  @media (prefers-color-scheme: dark) {
    :root:not([data-theme]) {
      --maroon:#b5566a; --maroon-deep:#8f3f50; --red:#b5566a; --red-deep:#8f3f50; --gold:#d4b366;
      --bg:#141518; --panel:#1B1D21; --card:#212429;
      --text:#ECEDEF; --muted:#9AA1AC; --line:#2C313A; --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
      --ok:#3DBB7E; --warn:#E08A2B; --err:#E5675A;
    }
  }
  :root[data-theme="dark"] {
    --maroon:#EF4152; --maroon-deep:#C8102E; --red:#EF4152; --red-deep:#C8102E; --gold:#F4C300;
    --bg:#141518; --panel:#1B1D21; --card:#212429;
    --text:#ECEDEF; --muted:#9AA1AC; --line:#2C313A; --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
    --ok:#3DBB7E; --warn:#E08A2B; --err:#E5675A;
  }

  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; -webkit-font-smoothing:antialiased; line-height:1.5; }

  /* app shell: fixed app bar + optional chip row, scrolling content, fixed bottom tabs */
  .app { display:flex; flex-direction:column; min-height:100dvh; }
  .abar { position:sticky; top:0; z-index:5; flex:none; display:flex; align-items:center; gap:.5rem; padding:.55rem .9rem;
    background:var(--maroon); color:#fff; }
  .abar .crest { width:42px; height:27px; background:#fff var(--logo) center/contain no-repeat; border-radius:5px; flex:none; }
  .abar .title { font-weight:800; font-size:1rem; letter-spacing:-.01em; }
  .abar .meta { margin-left:auto; font-size:.72rem; color:rgba(255,255,255,.82); font-weight:700; }
  .abar .act { color:#fff; background:rgba(255,255,255,.16); border:0; border-radius:999px; padding:.3rem .7rem; font-size:.75rem; font-weight:700; }

  .chips { position:sticky; z-index:4; flex:none; display:flex; gap:.4rem; padding:.5rem .8rem; overflow-x:auto;
    background:var(--bg); border-bottom:1px solid var(--line); -webkit-overflow-scrolling:touch; }
  .chips::-webkit-scrollbar { display:none; }
  .chip { flex:none; display:flex; align-items:center; gap:.35rem; padding:.32rem .6rem; border:1px solid var(--line);
    border-radius:999px; background:var(--card); color:var(--text); font-size:.75rem; font-weight:700; white-space:nowrap; cursor:pointer; }
  .chip.on { background:var(--maroon); color:#fff; border-color:var(--maroon); }
  .chip.on .badge { background:rgba(255,255,255,.2); }
  .chip.on .badge svg { color:#fff; }
  .chip.on .badge .lvl { background:#fff; color:var(--maroon); border-color:transparent; }
  .chip .dot { min-width:16px; height:16px; padding:0 .25rem; border-radius:999px; background:var(--err); color:#fff;
    font-size:.58rem; font-weight:900; display:flex; align-items:center; justify-content:center; }
  /* Team lifecycle tag (Preseason / Offseason / Past season) — quiet by default,
     inverts on a selected chip. */
  .phasepill { font-size:.58rem; font-weight:800; padding:.1rem .4rem; border-radius:999px; text-transform:uppercase; letter-spacing:.02em;
    background:color-mix(in srgb,var(--gold) 30%,transparent); color:#5b4a00; white-space:nowrap; }
  .chip.on .phasepill { background:rgba(255,255,255,.22); color:#fff; }

  main.content { flex:1; padding:.85rem .85rem 5.5rem; display:flex; flex-direction:column; gap:.6rem; max-width:34rem; margin:0 auto; width:100%; }

  .tabbar { position:fixed; bottom:0; left:0; right:0; z-index:6; display:flex; background:var(--card);
    border-top:1px solid var(--line); padding:.3rem .1rem calc(.3rem + env(safe-area-inset-bottom)); }
  .tabbar .tb { flex:1; display:flex; flex-direction:column; align-items:center; gap:.15rem; background:none; border:0;
    font-size:.6rem; font-weight:700; color:var(--muted); padding:.25rem 0; cursor:pointer; }
  .tabbar .tb.on { color:var(--maroon); }
  .tabbar .tb svg { width:21px; height:21px; color:currentColor; }
  .tabbar .tb:focus-visible, .chip:focus-visible, .abar .act:focus-visible { outline:2px solid var(--gold); outline-offset:2px; }

  /* sport badge: mono glyph + red level letter */
  .badge { position:relative; width:28px; height:28px; border-radius:8px; background:color-mix(in srgb,var(--text) 8%,transparent);
    display:flex; align-items:center; justify-content:center; flex:none; }
  .badge svg { width:16px; height:16px; color:var(--text); }
  .badge .lvl { position:absolute; bottom:-5px; right:-6px; background:var(--card); color:var(--maroon); font-size:.5rem;
    font-weight:900; padding:.02rem .18rem; border-radius:5px; border:1px solid var(--line); line-height:1.25; }
  .badge.lg { width:36px; height:36px; border-radius:10px; } .badge.lg svg { width:21px; height:21px; }

  /* athlete avatar: photo thumbnail or initials placeholder */
  .avatar { width:38px; height:38px; border-radius:999px; flex:none; overflow:hidden; display:inline-flex; align-items:center; justify-content:center;
    background:color-mix(in srgb,var(--maroon) 14%,var(--card)); color:var(--maroon); font-weight:800; font-size:.85rem; }
  .avatar img { width:100%; height:100%; object-fit:cover; display:block; }
  .avatar.lg { width:60px; height:60px; font-size:1.25rem; }

  /* atoms */
  .card { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:.7rem .8rem; box-shadow:var(--shadow); }
  .card.tight { padding:.55rem .7rem; }
  .flex { display:flex; align-items:center; gap:.5rem; }
  .row2 { display:flex; align-items:center; justify-content:space-between; gap:.5rem; }
  .h { font-size:.9rem; font-weight:700; } .s { font-size:.78rem; color:var(--muted); } .xs { font-size:.7rem; color:var(--muted); }
  .sectlabel { font-size:.66rem; text-transform:uppercase; letter-spacing:.14em; color:var(--muted); font-weight:800; margin:.5rem .15rem .1rem; }
  .pill { font-size:.62rem; font-weight:800; padding:.12rem .45rem; border-radius:999px; text-transform:uppercase; letter-spacing:.02em; }
  .pill.ok{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok);}
  .pill.warn{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn);}
  .pill.err{background:color-mix(in srgb,var(--err) 16%,transparent);color:var(--err);}
  .pill.gold{background:color-mix(in srgb,var(--gold) 32%,transparent);color:#5b4a00;}
  .pill.win{background:var(--ok);color:#fff;} .pill.plain{background:color-mix(in srgb,var(--text) 9%,transparent);color:var(--muted);}
  .livebadge{display:inline-flex;align-items:center;gap:.3rem;background:var(--err);color:#fff;border-radius:999px;padding:.1rem .5rem;font-size:.7rem;font-weight:700;letter-spacing:.03em;}
  .livebadge::before{content:"";width:.5rem;height:.5rem;border-radius:50%;background:#fff;animation:livepulse 1.4s ease-in-out infinite;}
  @keyframes livepulse{0%,100%{opacity:1;}50%{opacity:.2;}}
  @media (prefers-reduced-motion: reduce){.livebadge::before{animation:none;}}
  .watchbtn{display:inline-block;background:var(--err);color:#fff;border-radius:8px;padding:.35rem .7rem;font-size:.8rem;font-weight:600;text-decoration:none;margin-top:.4rem;}
  .watchbtn.hl{background:var(--maroon);}
  .btn { border:0; border-radius:10px; background:var(--maroon); color:#fff; font-weight:700; font-size:.85rem; padding:.6rem .8rem; text-align:center; cursor:pointer; }
  .btn:active { background:var(--maroon-deep); }
  .btn.ghost { background:transparent; color:var(--maroon); border:1px solid color-mix(in srgb,var(--maroon) 40%,var(--line)); }
  .btn.block { display:block; width:100%; }
  .input, select.input { width:100%; font-size:1rem; padding:.6rem .7rem; border:1px solid var(--line); border-radius:10px; background:var(--card); color:var(--text); }
  .conflict { border:1px solid color-mix(in srgb,var(--err) 45%,var(--line)); background:color-mix(in srgb,var(--err) 8%,var(--card)); border-radius:14px; padding:.7rem .8rem; }

    }

  // Print roster — an opt-in Game-Day add-in (a quick paper team sheet). ON by
  // default for soccer, OFF for every other sport; a coach can flip it on per
  // team in Team settings. Declared here (rather than threaded through each
  // blueprint literal) so it is a KNOWN module key everywhere — overrides merge,
  // the wizard can toggle it, and the button gates on it — with one source.
  Object.keys(BLUEPRINTS).forEach(function (k) {
    var bp = BLUEPRINTS[k];
    if (bp && bp.modules && bp.modules.printRoster === undefined) bp.modules.printRoster = (k === 'soccer');
  });

  // TEAMS.Sport code → canonical family (mirrors Labels.SPORT's coverage).
  var ALIAS = {
    BSOC: 'soccer', GSOC: 'soccer', SOC: 'soccer',
    BBB: 'basketball', GBB: 'basketball', BBK: 'basketball', GBK: 'basketball', BSK: 'basketball',
    VB: 'volleyball', VOLL: 'volleyball',
    BASE: 'baseball', SOFT: 'softball',
    XC: 'xc', GOLF: 'golf', FF: 'generic', FB: 'generic'
  };

  function keyFor(code) { return ALIAS[String(code || '').toUpperCase()] || 'generic'; }

  /** Do two sport codes denote the SAME sport? Same canonical family (BSOC≡GSOC≡SOC
   *  all soccer), but the catch-all 'generic' family requires an EXACT code match so
   *  distinct un-blueprinted sports (e.g. FF vs FB) never conflate. */
  function same(a, b) {
    var fa = keyFor(a), fb = keyFor(b);
    if (fa !== fb) return false;
    if (fa === 'generic') return String(a).toUpperCase() === String(b).toUpperCase();
    return true;
  }

  /** The blueprint for a stored sport code (never null — falls back to generic). */
  function get(code) { return BLUEPRINTS[keyFor(code)] || BLUEPRINTS.generic; }

  /** A deep-ish copy so callers/overrides can't mutate the shared blueprint. */
  function clone(bp) { return JSON.parse(JSON.stringify(bp)); }

  /**
   * Blueprint for a code with per-team overrides layered on top. overrides is a
   * plain object (or JSON string) of KNOWN blueprint keys only — unknown keys are
   * dropped (mirrors CoachPrefs.sanitize), and nested `modules` merges key-by-key.
   */
  function resolve(code, overrides) {
    var out = clone(get(code));
    var o = overrides;
    if (typeof o === 'string') { try { o = JSON.parse(o); } catch (e) { o = null; } }
    if (o && typeof o === 'object') {
      Object.keys(o).forEach(function (k) {
        if (!(k in out)) return;                 // only known knobs
        if (k === 'modules' && o.modules && typeof o.modules === 'object') {
          Object.keys(out.modules).forEach(function (m) {
            if (m in o.modules) out.modules[m] = o.modules[m] === true || o.modules[m] === 'true';
          });
        } else {
          out[k] = o[k];
        }
      });
    }
    return out;
  }

  /** All distinct blueprints (for a sport picker in the wizard). */
  function list() { return Object.keys(BLUEPRINTS).filter(function (k) { return k !== 'generic'; }).map(function (k) { return clone(BLUEPRINTS[k]); }); }

  /** The alias map (code → family) — the wizard's sport dropdown source. */
  function codes() { return JSON.parse(JSON.stringify(ALIAS)); }

  return { get: get, resolve: resolve, list: list, codes: codes, keyFor: keyFor, same: same };
})();

if (typeof module !== 'undefined') module.exports = Sports;

'use strict';
/**
 * standings.js — pure season-record aggregation (Feature A). No GAS, no DOM.
 * Computed client-side from the schedule each app already has (events carry a
 * recorded result), so there's no new schema, endpoint, or PII surface.
 *
 * Rules (per product decision):
 *  - Count COMPETITIVE games only: Game, Match, Meet, Tournament. Practices,
 *    Scrimmages, and "Other" never count toward a record.
 *  - Only events with a recorded result count (an unplayed/future game is skipped).
 *  - Head-to-head sports get a W-L(-T) record from the result tone. Race/field
 *    sports (XC, golf — no head-to-head W/L) instead report a meet count.
 */

var Standings = (function () {
  var COMPETITIVE = { Game: 1, Match: 1, Meet: 1, Tournament: 1 };

  /** Map a recorded-result tone → outcome letter (null if not decisive). */
  function outcome(tone) {
    if (tone === 'win') return 'W';
    if (tone === 'loss') return 'L';
    return 'T'; // a recorded non-win/loss result is a tie (head-to-head sports)
  }

  function record(t) {
    if (t.isRace) return t.meets + ' meet' + (t.meets === 1 ? '' : 's');
    var r = t.wins + '-' + t.losses;
    return t.ties ? r + '-' + t.ties : r;
  }

  /**
   * @param games [{ teamKey, sport, eventType, hasResult, resultTone, isRace }]
   *   teamKey  = stable per-team id (e.g. TeamID or label)
   *   hasResult= a final was recorded for this event
   *   isRace   = true for XC/golf-style (meet count instead of W/L)
   * @returns { byTeam: {teamKey→{teamKey,sport,isRace,wins,losses,ties,meets,record}}, list:[…] }
   */
  function compute(games) {
    var byTeam = {};
    (games || []).forEach(function (g) {
      if (!g || !COMPETITIVE[g.eventType] || !g.hasResult) return;
      var t = byTeam[g.teamKey] || (byTeam[g.teamKey] = { teamKey: g.teamKey, sport: g.sport, isRace: !!g.isRace, wins: 0, losses: 0, ties: 0, meets: 0 });
      if (g.isRace) { t.isRace = true; t.meets++; return; }
      var o = outcome(g.resultTone);
      if (o === 'W') t.wins++; else if (o === 'L') t.losses++; else t.ties++;
    });
    var list = Object.keys(byTeam).map(function (k) { var t = byTeam[k]; t.record = record(t); return t; });
    return { byTeam: byTeam, list: list };
  }

  return { compute: compute, outcome: outcome, record: record };
})();

if (typeof module !== 'undefined') module.exports = Standings;

</script>

<script>
  /* Fan surface client — public, read-only. Fetches the whitelisted publicSchedule
     and renders a schedule + recent-results board with a sport filter. No login,
     no writes, no PII ever reaches this code. */
  (function () {
    var state = { events: [], sport: 'all', today: '' };
    function $(id) { return document.getElementById(id); }
    function esc(s) { return TalonUI.esc(s); }
    function hid(id) { var el = $(id); return el ? String(el.textContent || '').trim() : ''; }
    var BUILD = hid('build-id');
    // Cross-app doors (server-injected from CONFIG; empty → link hidden).
    var LINKS = (function () {
      var p = hid('parent-url'), s = hid('signup-url');
      if (s) s += (s.indexOf('?') === -1 ? '?' : '&') + 'view=signup'; // student app's sign-up deep link
      return { parent: p, signup: s };
    })();
    function call(fn, args) { return new Promise(function (res, rej) { google.script.run.withSuccessHandler(res).withFailureHandler(rej).api(fn, args || {}); }); }
    function fmtDate(d) { var p = String(d).split('-'); if (p.length !== 3) return d; return new Date(+p[0], +p[1] - 1, +p[2]).toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' }); }
    function title(e) {
      if (e.type === 'Tournament') return esc(e.opponent || 'Tournament');
      var verb = e.homeAway === 'Away' ? ' at ' : ' vs ';
      var label = e.type === 'Scrimmage' ? 'Scrimmage' : (e.type || 'Game');
      return e.opponent ? esc(label + verb + e.opponent) : esc(label);
    }
    function sportName(code) { return (typeof Sports !== 'undefined' && Sports.get(code) && Sports.get(code).name) || code; }
    function isRaceSport(code) { return code === 'XC' || (typeof Sports !== 'undefined' && Sports.get && Sports.get(code) && Sports.get(code).scoreModel === 'places'); }
    function standingsList() {
      var games = state.events.map(function (e) { return { teamKey: e.team, sport: e.sport, eventType: e.type, hasResult: !!e.result, resultTone: e.resultTone, isRace: isRaceSport(e.sport) }; });
      return Standings.compute(games).list;
    }

    // Stale-while-revalidate: paint the last schedule instantly (public data, no
    // PII — the safest cache in the product), refresh in the background.
    var FAN_CACHE_KEY = 'talonFanSched';
    function readFanCache() {
      try { var o = JSON.parse(localStorage.getItem(FAN_CACHE_KEY) || 'null'); return (o && o.build === BUILD) ? o.payload : null; } catch (e) { return null; }
    }
    function writeFanCache(r) { try { localStorage.setItem(FAN_CACHE_KEY, JSON.stringify({ build: BUILD, payload: r })); } catch (e) {} }
    function applySched(r) {
      state.events = r.events || []; state.today = r.today || ''; render();
      try { TalonUI.renderAnnouncements(r.announcements || []); } catch (e) {} // fan-flagged announcements (banner)
      try { TalonUI.renderLive(r.liveNow || []); } catch (e) {}                // shared live ticker
    }
    function boot() {
      var cached = readFanCache();
      if (cached) applySched(cached); // instant paint; revalidated below
      // Board + live strip in ONE round trip (the strip used to arrive a full
      // round trip after the board — the widget already did this).
      Promise.all([
        call('publicSchedule').catch(function () { return null; }),
        call('liveNow').catch(function () { return null; })
      ]).then(function (rs) {
        var r = rs[0], l = rs[1];
        if (r && r.ok) { applySched(r); writeFanCache(r); }
        else if (!cached) { $('content').innerHTML = '<p class="placeholder">Could not load the schedule. Please reload.</p>'; }
        if (l && l.ok) { state.live = l.live || []; renderLive(); }
        scheduleLivePoll();
      });
    }
    // Live poll: 20s while something is live, backing off to 120s when idle (most
    // hours nothing is live — no point hammering the server), paused in hidden
    // tabs, snapping back to 20s the moment the tab is visible again.
    var LIVE_MIN = 20000, LIVE_MAX = 120000, liveDelay = LIVE_MIN;
    function scheduleLivePoll() {
      if (state._liveTimer) clearTimeout(state._liveTimer);
      state._liveTimer = setTimeout(pollLive, liveDelay);
    }
    function pollLive() {
      if (document.hidden) { scheduleLivePoll(); return; } // backgrounded tab: skip the fetch, keep the clock
      call('liveNow').then(function (r) {
        if (r && r.ok) {
          state.live = r.live || []; renderLive();
          liveDelay = state.live.length ? LIVE_MIN : Math.min(liveDelay * 2, LIVE_MAX);
        }
        scheduleLivePoll();
      }).catch(function () { scheduleLivePoll(); });
    }
    document.addEventListener('visibilitychange', function () {
      if (!document.hidden && state._liveTimer) { liveDelay = LIVE_MIN; pollLive(); }
    });
    function renderLive() {
      var el = $('live-strip'); if (!el) return;
      var live = (state.live || []).filter(function (g) { return state.sport === 'all' || g.sport === state.sport; });
      if (!live.length) { el.innerHTML = ''; return; }
      el.innerHTML = '<div class="sectlabel" style="color:var(--err)">🔴 Live now</div>' + live.map(function (g) {
        var stream = g.liveStreamUrl ? '<div style="margin-top:.25rem"><a class="watchbtn" target="_blank" rel="noopener" href="' + esc(g.liveStreamUrl) + '">▶ Watch live</a></div>' : '';
        return '<div class="card" style="border:2px solid var(--err)"><div class="flex">' + TalonUI.badge(g.sport, g.level) +
          '<div style="flex:1"><div class="h">' + esc(g.team) + (g.opponent ? ' <span class="s">' + (g.homeAway === 'Away' ? 'at' : 'vs') + ' ' + esc(g.opponent) + '</span>' : '') + '</div>' +
          (g.detail ? '<div class="xs">' + esc(g.detail) + '</div>' : '') + '</div>' +
          '<div style="text-align:right"><span class="livebadge">LIVE</span><div style="font-weight:800;font-size:1.2rem;font-variant-numeric:tabular-nums;margin-top:.2rem">' + esc(g.label) + '</div></div></div>' + stream + '</div>';
      }).join('');
    }
    function sports() { var s = {}; state.events.forEach(function (e) { if (e.sport) s[e.sport] = 1; }); return Object.keys(s).sort(); }

    function render() {
      var chips = $('chips'), sp = sports();
      if (sp.length > 1) {
        chips.hidden = false;
        chips.innerHTML = '<button class="chip' + (state.sport === 'all' ? ' on' : '') + '" data-s="all">All</button>' +
          sp.map(function (code) { return '<button class="chip' + (state.sport === code ? ' on' : '') + '" data-s="' + esc(code) + '">' + TalonUI.badge(code, '') + esc(sportName(code)) + '</button>'; }).join('');
        Array.prototype.forEach.call(chips.querySelectorAll('.chip'), function (b) { b.addEventListener('click', function () { state.sport = b.getAttribute('data-s'); render(); }); });
      } else chips.hidden = true;

      var evs = state.events.filter(function (e) { return state.sport === 'all' || e.sport === state.sport; });
      var up = evs.filter(function (e) { return e.date >= state.today && !e.result; });
      var results = evs.filter(function (e) { return e.result; }).slice().reverse();
      var h = '<div id="live-strip"></div><div class="sectlabel">Upcoming</div>' + (up.length ? up.map(card).join('') : '<p class="s">Nothing scheduled right now.</p>');
      if (results.length) h += '<div class="sectlabel">Recent results</div>' + results.slice(0, 25).map(card).join('');
      var recs = standingsList().filter(function (t) { return state.sport === 'all' || t.sport === state.sport; });
      if (recs.length) {
        h += '<div class="sectlabel">Season records</div>' + recs.map(function (t) {
          return '<div class="card tight flex">' + TalonUI.badge(t.sport, '') + '<div style="flex:1"><div class="h">' + esc(t.teamKey) + '</div></div><span class="pill plain">' + esc(t.record) + '</span></div>';
        }).join('');
      }
      // Funnel footer: the fan board is the only public page — point families at
      // the doors. Links render only when the CONFIG URLs are set server-side.
      var doors = [];
      if (LINKS.parent) doors.push('<a href="' + esc(LINKS.parent) + '" target="_blank" rel="noopener">👪 Families sign in →</a>');
      if (LINKS.signup) doors.push('<a href="' + esc(LINKS.signup) + '" target="_blank" rel="noopener">🎓 Students: sign up to play →</a>');
      if (doors.length) h += '<div class="card tight" style="text-align:center">' + doors.join(' &nbsp;·&nbsp; ') + '</div>';
      h += '<p class="build-stamp">Talon Hub · HCS Athletics · ' + esc(BUILD) + '</p>';
      $('content').innerHTML = h;
      renderLive(); // refill the live strip after a full re-render (e.g. sport filter change)
    }
    function card(e) {
      var meta = fmtDate(e.date) + (e.time ? ' · ' + e.time : '') + (e.location ? ' · ' + esc(e.location) : '');
      var statusPill = (e.status === 'Postponed' || e.status === 'Changed') ? '<span class="pill err">' + esc(e.status) + '</span>' : '';
      var right = e.result ? '<span class="pill ' + (e.resultTone === 'win' ? 'win' : (e.resultTone === 'loss' ? 'err' : 'plain')) + '">' + esc(e.result) + '</span>'
        : (statusPill || (e.homeAway === 'Home' ? '<span class="pill gold">Home</span>' : (e.homeAway === 'Away' ? '<span class="pill plain">Away</span>' : '')));
      var live = e.liveStreamUrl ? '<div style="margin-top:.25rem"><a class="watchbtn" target="_blank" rel="noopener" href="' + esc(e.liveStreamUrl) + '">▶ Watch live</a></div>' : '';
      var hl = e.highlightUrl ? '<div style="margin-top:.25rem"><a class="watchbtn hl" target="_blank" rel="noopener" href="' + esc(e.highlightUrl) + '">🎬 Highlights</a></div>' : '';
      // Tournament card: one calendar event, several games — each with its
      // time, opponent, and score once it's live or final.
      var games = '';
      if (e.games && e.games.length) {
        games = '<div style="margin-top:.35rem;border-top:1px solid var(--line);padding-top:.3rem">' + e.games.map(function (g) {
          var sc = g.state === 'Live' ? '<span class="livebadge">LIVE</span> <b>' + esc(g.score) + '</b>'
            : (g.state === 'Final' ? '<b>' + esc(g.score) + '</b> <span class="s">final</span>' : '');
          return '<div class="flex" style="gap:.4rem;padding:.15rem 0"><span class="s" style="min-width:4.6rem">' + esc(g.time) + '</span>' +
            '<span class="s" style="flex:1">vs ' + esc(g.opponent) + '</span>' + sc + '</div>';
        }).join('') + '</div>';
      }
      return '<div class="card"><div class="flex">' + TalonUI.badge(e.sport, e.level) + '<div style="flex:1"><div class="h">' + title(e) + '</div><div class="s">' + esc(e.team) + ' · ' + meta + '</div></div>' + right + '</div>' + games + live + hl + '</div>';
    }
    boot();
  })();
</script>
