<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ELC Student Assessments — Showcase demo</title>
<style>
  :root { --navy:#234C6A; --navy-deep:#17324A; --gold:#D4AF37; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { display: flex; flex-direction: column; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: #EEF2F5; }
  .bar {
    flex: none; display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
    padding: 10px 16px; color: #fff;
    background: linear-gradient(120deg, var(--navy-deep) 0%, var(--navy) 60%, #4C7996 100%);
    box-shadow: 0 4px 14px rgba(0,0,0,.3); z-index: 2;
  }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 1.05rem; }
  .brand .logo { font-size: 1.5rem; }
  .brand small { display: block; font-weight: 600; font-size: .72rem; opacity: .85; }
  .label { font-size: .74rem; font-weight: 700; opacity: .8; text-transform: uppercase; letter-spacing: .04em; }
  .seg { display: inline-flex; background: rgba(255,255,255,.14); border: 1px solid rgba(255,255,255,.25); border-radius: 999px; padding: 4px; gap: 2px; flex-wrap: wrap; }
  .seg button {
    border: 0; cursor: pointer; font: inherit; font-weight: 700; font-size: .86rem;
    color: #fff; background: transparent; padding: 8px 13px; border-radius: 999px;
    display: inline-flex; align-items: center; gap: 6px; transition: background .12s;
  }
  .seg button:hover { background: rgba(255,255,255,.16); }
  .seg button.active { background: var(--gold); color: #3a2b00; }
  .spacer { flex: 1; }
  .hint { font-size: .78rem; opacity: .85; max-width: 26rem; line-height: 1.35; }
  .pill { color: #fff; text-decoration: none; font-weight: 700; font-size: .86rem; opacity: .92; border: 1px solid rgba(255,255,255,.3);
          padding: 7px 12px; border-radius: 999px; background: transparent; cursor: pointer; font-family: inherit; }
  .pill:hover { background: rgba(255,255,255,.12); }
  .stage { flex: 1; position: relative; background: #EEF2F5; }
  .stage iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; display: block; background: #EEF2F5; }
  @media (max-width: 1500px) { .hint { display: none; } }
  @media (max-width: 1100px) { .brand small, .hint { display: none; } .seg button { padding: 8px 10px; font-size: .8rem; } }
</style>
</head>
<body>
  <div class="bar">
    <div class="brand">
      <span class="logo" aria-hidden="true">📚</span>
      <span>ELC Student Assessments<small>K–6 reading &amp; math screening, growth and risk</small></span>
    </div>
    <span class="label">Signed in as</span>
    <div class="seg" role="tablist" aria-label="Choose who is signed in">
      <button data-as="elc" class="active" aria-selected="true" title="Renee Ashby, ELC coordinator: unrestricted">🧑‍🏫 ELC Staff</button>
      <button data-as="admin" aria-selected="false" title="Dana Whitcomb, principal: unrestricted, plus Staff Access and the audit logs">🏫 Administrator</button>
      <button data-as="teacher" aria-selected="false" title="Lauren Pryce: Grade-Level Teacher scoped to grade 2">✏️ 2nd-grade teacher</button>
      <button data-as="teacher4" aria-selected="false" title="Gregory Lindqvist: Grade-Level Teacher scoped to grade 4">📐 4th-grade teacher</button>
    </div>
    <span class="spacer"></span>
    <span class="hint">As the 2nd-grade teacher, <b>Flag a Concern</b>; as ELC Staff, score it from <b>Flagged Concerns</b>.</span>
    <button class="pill" id="reset" title="Discard this visit's changes and replay the sample history">↻ Reset</button>
    <a class="pill" href="../../index.html" target="_top">← Gallery</a>
  </div>
  <div class="stage">
    <iframe id="screen" src="app.html?as=elc" title="ELC Student Assessments"></iframe>
  </div>
<script>
  // One app, four sign-ins. Each button reloads the SAME built page as a different staff member
  // (?as=), exactly as four people would open the one deployment; what you changed stays for the visit.
  var frame = document.getElementById('screen');
  var btns = [].slice.call(document.querySelectorAll('.seg button'));
  var current = 'elc';
  function show(as, reset) {
    current = as;
    btns.forEach(function (x) {
      var on = x.getAttribute('data-as') === as;
      x.classList.toggle('active', on);
      x.setAttribute('aria-selected', on ? 'true' : 'false');
    });
    frame.src = 'app.html?as=' + as + (reset ? '&reset=1' : '');
  }
  btns.forEach(function (b) { b.addEventListener('click', function () { show(b.getAttribute('data-as')); }); });
  document.getElementById('reset').addEventListener('click', function () { show(current, true); });
</script>
</body>
</html>
