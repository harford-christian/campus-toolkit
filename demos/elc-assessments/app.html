// ── Year-over-year cohort comparison (Phase 13c) ─────────────
// Reuses g.trend as-is (already computed by getPrincipalDashboard, already
// grade_at_admin-correct per Phase 8e) rather than a new server call --
// every trend entry's period key is "<school_year> <season>" (see
// Dashboard.gs), so this just regroups the SAME data by season/year instead
// of one flat chronological strip, so "this year's Fall vs last year's Fall"
// reads directly instead of requiring the user to eyeball it out of a
// combined timeline across separate Summary/Coverage/Dashboard reports.

var YOY_SEASON_ORDER = ['Fall', 'Winter', 'Spring'];

function seasonSortIndex_(season) {
  var idx = YOY_SEASON_ORDER.indexOf(season);
  return idx === -1 ? YOY_SEASON_ORDER.length : idx;
}

/**
 * "2025-2026|Fall" -> { schoolYear: "2025-2026", season: "Fall" }. Splits on
 * '|', not a space (Phase 39) -- a blank school_year/season falls back
 * server-side to a placeholder that itself contains a space ("(no
 * season)"), which used to corrupt a space-based split. '|' can never
 * appear in either field. Falls back to treating the whole key as the
 * school year with an empty season if a pre-Phase-39 key (no '|') is ever
 * still floating around, rather than guessing at a split point.
 */
function parseTrendPeriodKey_(periodKey) {
  var idx = periodKey.indexOf('|');
  if (idx === -1) return { schoolYear: periodKey, season: '' };
  return { schoolYear: periodKey.substring(0, idx), season: periodKey.substring(idx + 1) };
}

/** Friendly "<season> <school year>" display for a raw trend period key -- never render the key itself, its internal delimiter is not for display. */
function friendlyPeriodLabel_(periodKey) {
  var p = parseTrendPeriodKey_(periodKey);
  return (p.season ? p.season + ' ' : '') + p.schoolYear;
}

/** Regroups one grade's trend (a flat chronological list) into { years, seasons, bySeasonYear }. */
function buildYoyTable_(g) {
  var bySeasonYear = {};
  var yearsSet = {};
  var seasonsSet = {};
  g.trend.forEach(function(t) {
    var parsed = parseTrendPeriodKey_(t.period);
    seasonsSet[parsed.season] = true;
    yearsSet[parsed.schoolYear] = true;
    if (!bySeasonYear[parsed.season]) bySeasonYear[parsed.season] = {};
    bySeasonYear[parsed.season][parsed.schoolYear] = t.counts;
  });
  return {
    years: Object.keys(yearsSet).sort(), // "YYYY-YYYY" strings sort correctly lexically
    seasons: Object.keys(seasonsSet).sort(function(a, b) { return seasonSortIndex_(a) - seasonSortIndex_(b); }),
    bySeasonYear: bySeasonYear
  };
}

// Phase 25c (Phase 6a review finding #11): a rising count and a falling
// count previously rendered with the SAME ▲/▼ convention regardless of
// which bucket moved -- a rising "At Risk" (bad) and a rising "On Track"
// (good) looked identical at a glance, forcing the reader to actually read
// the label before knowing whether a delta was good or bad news. -1 means
// a DECREASE in this bucket is the good direction; 1 means an INCREASE is.
var DASHBOARD_BUCKET_GOOD_DIRECTION_ = { at_risk: -1, some_risk: -1, on_track: 1, not_assessed: -1 };

/** Colors a bucket's delta green/red to match whether the movement is actually good or bad for THAT bucket, not just its raw sign. Same hex values already used by badge-mastery/badge-intensive text. */
function deltaColoredText_(bucket, delta, text) {
  if (!delta) return text;
  var goodDirection = DASHBOARD_BUCKET_GOOD_DIRECTION_[bucket] || 0;
  var isGood = (delta > 0 && goodDirection > 0) || (delta < 0 && goodDirection < 0);
  return '<span style="color:' + (isGood ? '#15803d' : '#b91c1c') + ';font-weight:600">' + text + '</span>';
}

/**
 * Phase 23f (Phase 6a review finding): a school in its first year of use has
 * no prior school year to compare against, so this section used to fall
 * back to a bare "not enough historical data" message -- even in a grade
 * with a real Fall-to-Winter (or Winter-to-Spring) trend already recorded
 * THIS year. Shows that in-year movement instead, comparing the earliest
 * and latest recorded periods, using the same ▲/▼ delta convention as the
 * year-over-year table itself.
 */
function renderInYearTrendNarrative_(g) {
  if (g.trend.length < 2) {
    return '<p class="muted" style="font-size:.8rem">Not enough data yet — record at least two periods for this grade to see a trend.</p>';
  }
  var earliest = g.trend[0];
  var latest = g.trend[g.trend.length - 1];
  var rows = DASHBOARD_BUCKETS_ORDER.map(function(b) {
    var delta = latest.counts[b] - earliest.counts[b];
    var deltaText = delta === 0 ? 'no change' : (delta > 0 ? '▲' + delta : '▼' + Math.abs(delta));
    return '<div style="font-size:.78rem">' + DASHBOARD_BUCKET_LABELS[b] + ': ' + earliest.counts[b] + ' → ' + latest.counts[b] + ' (' + deltaColoredText_(b, delta, deltaText) + ')</div>';
  }).join('');
  return '<p class="muted" style="font-size:.78rem;margin-bottom:6px">No prior school year recorded yet, but here’s how this grade has moved so far this year ('
    + escapeHtml(parseTrendPeriodKey_(earliest.period).season) + ' → ' + escapeHtml(parseTrendPeriodKey_(latest.period).season) + '):</p>'
    + rows;
}

/** Inner HTML (no outer .card wrapper -- appended inside the existing per-grade card) for one grade's year-over-year table. */
function renderYoyComparisonSection_(g) {
  var t = buildYoyTable_(g);
  if (t.years.length < 2) {
    return '<h3 style="font-size:.85rem;margin:16px 0 6px">Year-over-Year Comparison</h3>' + renderInYearTrendNarrative_(g);
  }

  // Phase 31g addendum: used to stack 4 lines of "Label: N (▲delta)" plain
  // text per cell -- unreadable at a ~220px grade-card width (wrapped
  // mid-word, forced constant horizontal scroll). Compact colored chips
  // (one per bucket, same bucket-pattern-* texture as the trend strip so
  // risk level doesn't rely on color alone) fit all 4 buckets on one line
  // per cell; the full label+count is still available via the chip's title
  // attribute on hover/long-press.
  var html = '<h3 style="font-size:.85rem;margin:16px 0 6px">Year-over-Year Comparison</h3>'
    + '<div style="overflow-x:auto"><table class="trend-table yoy-table"><thead><tr><th>Season</th>'
    + t.years.map(function(y) { return '<th>' + escapeHtml(y) + '</th>'; }).join('') + '</tr></thead><tbody>';

  t.seasons.forEach(function(season) {
    html += '<tr><td><strong>' + escapeHtml(season) + '</strong></td>';
    var priorCounts = null;
    t.years.forEach(function(y) {
      var counts = t.bySeasonYear[season][y];
      if (!counts) { html += '<td class="muted">—</td>'; return; }
      var total = counts.at_risk + counts.some_risk + counts.on_track + counts.not_assessed;
      var chips = DASHBOARD_BUCKETS_ORDER.map(function(b) {
        var delta = priorCounts ? counts[b] - priorCounts[b] : null;
        var deltaText = delta === null || delta === 0 ? '' : ' ' + deltaColoredText_(b, delta, delta > 0 ? '▲' + delta : '▼' + Math.abs(delta));
        var title = DASHBOARD_BUCKET_LABELS[b] + ': ' + counts[b] + (delta ? ' (' + (delta > 0 ? '+' : '') + delta + ' vs prior period)' : '');
        return '<span class="yoy-chip bucket-pattern-' + b + '" style="background:' + DASHBOARD_BUCKET_COLORS[b] + '" title="' + escapeHtml(title) + '">'
          + counts[b] + deltaText + '</span>';
      }).join('');
      html += '<td><div class="yoy-chip-row">' + chips + '</div><div class="muted" style="font-size:.74rem;margin-top:3px">Total: ' + total + '</div></td>';
      priorCounts = counts;
    });
    html += '</tr>';
  });

  return html + '</tbody></table></div>';
}

/**
 * Plain-language verdict for a multi-period metric series (2026-09-24, at
 * the school's request -- the Dashboard's own trend used to only ever
 * compare the two MOST RECENT periods; this looks at everything recorded).
 * `values` is oldest -> newest. `lowerIsBetter` (true for At Risk %) flips
 * which delta direction counts as "improving". Prefers a real trailing
 * STREAK ("worsened 3 periods in a row") when one exists -- that's the more
 * actionable signal -- and falls back to the net first-to-last change only
 * when the streak is too short (1 period) to mean anything on its own.
 */
function computeTrendVerdict_(values, lowerIsBetter) {
  if (!values || values.length < 2) {
    return { direction: 'insufficient', text: (values && values.length === 1) ? 'Only one period recorded so far — not enough history for a trend yet.' : 'No data recorded yet.' };
  }
  var deltas = [];
  for (var i = 1; i < values.length; i++) deltas.push(values[i] - values[i - 1]);

  var streak = 0, streakSign = 0;
  for (var j = deltas.length - 1; j >= 0; j--) {
    var sign = deltas[j] > 0 ? 1 : (deltas[j] < 0 ? -1 : 0);
    if (sign === 0) break;
    if (streak === 0) { streakSign = sign; streak = 1; }
    else if (sign === streakSign) streak++;
    else break;
  }

  var first = values[0], last = values[values.length - 1];
  var net = last - first;
  var worseSign = lowerIsBetter ? 1 : -1; // sign of a delta that means "getting worse"
  var direction, text;
  var range = first.toFixed(1) + '% → ' + last.toFixed(1) + '%';

  if (streak >= 2) {
    var improving = streakSign !== worseSign;
    direction = improving ? 'improving' : 'declining';
    text = (improving ? 'Improving' : 'Worsening') + ' for ' + streak + ' periods in a row (' + range + ').';
  } else if (Math.abs(net) < 0.05) {
    direction = 'stable';
    text = 'Holding steady overall (' + range + ') — no consistent multi-period trend.';
  } else {
    var netImproving = (net * worseSign) < 0;
    direction = netImproving ? 'improving' : 'declining';
    text = (netImproving ? 'Improved' : 'Worsened') + ' overall since the earliest recorded period (' + range + '), though not in a straight line.';
  }
  return { direction: direction, streak: streak, net: net, text: text };
}

/** Schoolwide At Risk % per recorded period (2026-09-24) -- a PERCENTAGE, not the raw count computeDashboardHeadline_ already tracked, so enrollment changes (more/fewer students overall) don't get misread as the risk picture itself moving. Sums every grade's trend at each period index (aligned with dash.periods, same alignment computeDashboardHeadline_'s existing 2-period comparison already relies on). */
function schoolwideAtRiskPctSeries_(dash) {
  return (dash.periods || []).map(function(period, idx) {
    var atRisk = 0, total = 0;
    (dash.grades || []).forEach(function(g) {
      var t = g.trend[idx];
      if (!t) return;
      atRisk += t.counts.at_risk;
      total += t.counts.at_risk + t.counts.some_risk + t.counts.on_track + t.counts.not_assessed;
    });
    return { period: period, at_risk: atRisk, total: total, pct: total > 0 ? (atRisk / total * 100) : 0 };
  });
}

/** Small inline-SVG line sparkline for a percentage series (2026-09-24) -- same self-contained convention as buildGrowthChartSvg_/buildCompareBarChartSvg_ elsewhere in this app. One series, one hue (per the dataviz method: "trend over time -> line, one hue") -- colored by the verdict's direction (green improving / red declining / ink-soft stable), matching the color convention renderDashboardHeadline_ already used for its 2-period delta. */
function buildTrendSparklineSvg_(series, color) {
  var W = 260, H = 44, padX = 6, padY = 8;
  var vals = series.map(function(s) { return s.pct; });
  var min = Math.min.apply(null, vals);
  var max = Math.max.apply(null, vals.concat([min + 1]));
  var range = (max - min) || 1;
  function xFor(i) { return vals.length <= 1 ? W / 2 : padX + (i / (vals.length - 1)) * (W - padX * 2); }
  function yFor(v) { return H - padY - ((v - min) / range) * (H - padY * 2); }
  var pts = vals.map(function(v, i) { return { x: xFor(i), y: yFor(v) }; });
  var path = pts.map(function(p, i) { return (i === 0 ? 'M' : 'L') + p.x.toFixed(1) + ',' + p.y.toFixed(1); }).join(' ');

  var svg = '<svg viewBox="0 0 ' + W + ' ' + H + '" style="width:100%;max-width:280px;height:' + H + 'px;display:block">'
    + '<path d="' + path + '" fill="none" stroke="' + color + '" stroke-width="2"/>';
  pts.forEach(function(p, i) {
    var isLast = i === pts.length - 1;
    svg += '<circle cx="' + p.x.toFixed(1) + '" cy="' + p.y.toFixed(1) + '" r="' + (isLast ? 4 : 2.5) + '" fill="' + color + '"' + (isLast ? '' : ' opacity=".55"') + '>'
      + '<title>' + escapeXmlAttr_(friendlyPeriodLabel_(series[i].period) + ': ' + series[i].pct.toFixed(1) + '% at risk (' + series[i].at_risk + ' of ' + series[i].total + ')') + '</title></circle>';
  });
  return svg + '</svg>';
}

// Categorical palette for the Cohort Growth chart (Trend #2 from the
// report-ideas backlog, 2026-09-26) -- one fixed color per current-grade
// cohort, K through 6. The dataviz skill's validated 8-slot categorical
// order (its references/palette.md), first 7 slots, assigned in FIXED
// order by grade (K always slot 1/blue, Grade 1 always slot 2/orange, ...)
// -- never reassigned based on how many other cohorts happen to be
// present, so a color always identifies the SAME cohort identity across
// re-renders. Validated via the skill's own script
// (validate_palette.js "#2a78d6,#eb6834,#1baf7a,#eda100,#e87ba4,#008300,#4a3aa7"
// --mode light): passes every hard gate; 3 of the 7 (aqua/yellow/magenta)
// fall below 3:1 contrast on a light surface, which is why every line here
// also gets a direct end-of-line label AND a legend entry -- never
// identified by hue alone. Light-mode hexes only, matching every other
// data-bearing color already in this app (COMPARE_BUCKET_BAR_COLORS_ etc.)
// -- this app doesn't theme-swap chart data colors for dark mode.
var COHORT_GRADE_COLORS_ = { K: '#2a78d6', '1': '#eb6834', '2': '#1baf7a', '3': '#eda100', '4': '#e87ba4', '5': '#008300', '6': '#4a3aa7' };
var COHORT_GRADE_PROGRESSION_CLIENT_ = ['K', '1', '2', '3', '4', '5', '6'];

/**
 * One line per current-grade cohort, ALL sharing the SAME x-axis (grade
 * K-6, fixed regardless of any one cohort's own length -- a "currently
 * Grade 2" cohort's line simply stops at Grade 2 instead of being stretched
 * to fill the chart) and the SAME y-axis (At Risk %, auto-scaled to the
 * data actually present, same padding convention as buildTrendSparklineSvg_
 * above). "One axis" -- comparing several cohorts' own trajectories side by
 * side is much stronger evidence of "are we succeeding" than any single
 * cohort's line alone.
 */
/** True for a real, finite percentage -- guards against at_risk_pct arriving as anything other than a plain number (null is the documented "no data at this grade" case, but this also catches undefined/NaN defensively rather than letting a bad value reach .toFixed() downstream). */
function isRealCohortPct_(v) {
  return typeof v === 'number' && !isNaN(v);
}

function buildCohortGrowthChartSvg_(cohorts) {
  var W = 640, H = 230, padX = 34, padTop = 14, padBottom = 22, labelPad = 46;
  var innerW = W - padX - labelPad, drawH = H - padTop - padBottom;
  var gradeCount = COHORT_GRADE_PROGRESSION_CLIENT_.length;

  var allVals = [];
  cohorts.forEach(function(c) { c.points.forEach(function(p) { if (isRealCohortPct_(p.at_risk_pct)) allVals.push(p.at_risk_pct); }); });
  var min = allVals.length ? Math.min.apply(null, allVals) : 0;
  var max = allVals.length ? Math.max.apply(null, allVals.concat([min + 1])) : 1;
  var pad = (max - min) * 0.15 || 2;
  min = Math.max(0, min - pad);
  max = max + pad;
  var range = (max - min) || 1;

  function xFor(gradeIdx) { return padX + (gradeIdx / (gradeCount - 1)) * innerW; }
  function yFor(pct) { return padTop + drawH - ((pct - min) / range) * drawH; }

  var svg = '<svg viewBox="0 0 ' + W + ' ' + H + '" style="width:100%;height:auto;display:block">';

  COHORT_GRADE_PROGRESSION_CLIENT_.forEach(function(g, i) {
    var x = xFor(i);
    svg += '<line x1="' + x.toFixed(1) + '" y1="' + padTop + '" x2="' + x.toFixed(1) + '" y2="' + (padTop + drawH) + '" stroke="var(--line)" stroke-width="1"/>'
      + '<text x="' + x.toFixed(1) + '" y="' + (H - 4) + '" font-size="10.5" fill="var(--ink-soft)" text-anchor="middle">' + escapeXmlText_(g) + '</text>';
  });

  cohorts.forEach(function(cohort) {
    var color = COHORT_GRADE_COLORS_[cohort.current_grade] || '#888';
    var coords = [];
    cohort.points.forEach(function(p, i) { if (isRealCohortPct_(p.at_risk_pct)) coords.push({ x: xFor(i), y: yFor(p.at_risk_pct), p: p }); });
    if (coords.length === 0) return;
    if (coords.length > 1) {
      var path = coords.map(function(c, i) { return (i === 0 ? 'M' : 'L') + c.x.toFixed(1) + ',' + c.y.toFixed(1); }).join(' ');
      svg += '<path d="' + path + '" fill="none" stroke="' + color + '" stroke-width="2"/>';
    }
    coords.forEach(function(c, i) {
      var isLast = i === coords.length - 1;
      var titleText = 'Grade ' + cohort.current_grade + ' cohort, when in Grade ' + c.p.grade + ': ' + c.p.at_risk_pct.toFixed(1) + '% at risk (' + c.p.total + ' student' + (c.p.total === 1 ? '' : 's') + ')';
      svg += '<circle cx="' + c.x.toFixed(1) + '" cy="' + c.y.toFixed(1) + '" r="' + (isLast ? 4.5 : 3) + '" fill="' + color + '">'
        + '<title>' + escapeXmlAttr_(titleText) + '</title></circle>';
    });
    // Direct end-of-line label -- required relief for the palette's 3
    // lower-contrast hues (see COHORT_GRADE_COLORS_'s own comment), and
    // generally clearer than a legend alone for "which line is which."
    var lastCoord = coords[coords.length - 1];
    svg += '<text x="' + (lastCoord.x + 6).toFixed(1) + '" y="' + lastCoord.y.toFixed(1) + '" font-size="10" fill="var(--ink)" dominant-baseline="middle">Gr.' + escapeXmlText_(cohort.current_grade) + '</text>';
  });

  svg += '</svg>';
  return svg;
}

/**
 * Trend #2 from the report-ideas backlog (2026-09-26, at the school's
 * request -- "follow the SAME students across grades as they age up"):
 * follows each currently-active grade's own students BACKWARD through
 * their real session history, instead of comparing this year's grade to a
 * different set of kids who happened to be in that grade a year ago (see
 * getCohortGrowthReport's own comment, Dashboard.gs, for the full
 * reasoning). Per-cohort verdict text reuses computeTrendVerdict_ (the same
 * function driving the "This Month" headline's own narrative) so a
 * cohort's trajectory reads in the same plain language as everywhere else
 * in this app -- lowerIsBetter=true since this is an At Risk PERCENTAGE.
 */
function renderCohortGrowthSection_(report) {
  var cohorts = (report && report.cohorts) || [];
  if (cohorts.length === 0) return '<div class="empty-state">Not enough grade-history data yet to show cohort growth.</div>';

  var chart = buildCohortGrowthChartSvg_(cohorts);
  var legend = cohorts.map(function(c) {
    var color = COHORT_GRADE_COLORS_[c.current_grade] || '#888';
    var vals = c.points.map(function(p) { return p.at_risk_pct; }).filter(isRealCohortPct_);
    var verdictText = vals.length < 2
      ? 'Just starting to track this group — check back as they move through more grades.'
      : computeTrendVerdict_(vals, true).text;
    return '<div style="display:flex;align-items:flex-start;gap:8px;padding:6px 0;border-bottom:1px solid var(--line)">'
      + '<span style="width:10px;height:10px;border-radius:3px;background:' + color + ';display:inline-block;margin-top:4px;flex-shrink:0"></span>'
      + '<div><strong>Grade ' + escapeHtml(c.current_grade) + ' cohort</strong> <span class="muted">(' + c.cohort_size + ' student' + (c.cohort_size === 1 ? '' : 's') + ')</span>'
      + '<div class="muted" style="font-size:.82rem">' + escapeHtml(verdictText) + '</div></div></div>';
  }).join('');

  return '<p class="muted" style="margin-bottom:10px">Follows the SAME students forward through their own time here — e.g. the "Grade 3 cohort" line shows how THIS group\'s At Risk <strong>percentage</strong> (not a headcount) has moved since they were in Kindergarten at this school, not a comparison to a different group of kids who happened to be in Grade 3 last year. Fewer students at an earlier grade point just means some of this cohort weren\'t enrolled here yet at that point — excluded from that point, not counted as "fine." <strong>A line going up means WORSE</strong> (a bigger share of that same group was At Risk) — down means improving.</p>'
    + '<p class="muted" style="font-size:.78rem;margin:0 0 6px">Vertical axis: % of the cohort At Risk at that grade (higher = worse). Horizontal axis: grade level.</p>'
    + '<div style="margin-bottom:14px">' + chart + '</div>'
    + legend;
}

/**
 * Phase 25f (Phase 6a review finding #14): no synthesized top-line metric
 * existed anywhere -- only per-grade breakdowns, leaving a principal to do
 * the "is this actually getting better, schoolwide" synthesis by eye.
 * Reuses g.trend (already computed server-side by getPrincipalDashboard,
 * Dashboard.gs) rather than a new endpoint -- every grade's trend array is
 * aligned index-for-index with dash.periods, so summing across grades at
 * the same index gives a real schoolwide before/after At-Risk count with
 * no new server call. Deliberately a NET change across the whole school
 * (not a claim that N specific students individually improved -- some
 * could move in while others move out and still net to the same number).
 *
 * 2026-09-24, at the school's request ("looking for a trend... instead of
 * just right now vs last time"): now also carries the FULL schoolwide At
 * Risk % series and a computeTrendVerdict_ synthesis across every recorded
 * period, not just the last two -- see renderDashboardHeadline_ for where
 * that actually renders.
 */
function computeDashboardHeadline_(dash) {
  var periods = dash.periods || [];
  if (periods.length < 2 || !dash.grades || dash.grades.length === 0) return null;
  var lastIdx = periods.length - 1;
  var prevIdx = lastIdx - 1;
  var currentAtRisk = dash.grades.reduce(function(sum, g) { return sum + (g.trend[lastIdx] ? g.trend[lastIdx].counts.at_risk : 0); }, 0);
  var previousAtRisk = dash.grades.reduce(function(sum, g) { return sum + (g.trend[prevIdx] ? g.trend[prevIdx].counts.at_risk : 0); }, 0);
  var series = schoolwideAtRiskPctSeries_(dash);
  var verdict = computeTrendVerdict_(series.map(function(s) { return s.pct; }), true);
  return {
    current_period: periods[lastIdx], previous_period: periods[prevIdx],
    current_at_risk: currentAtRisk, previous_at_risk: previousAtRisk, delta: currentAtRisk - previousAtRisk,
    series: series, verdict: verdict
  };
}

function renderDashboardHeadline_(dash) {
  var h = computeDashboardHeadline_(dash);
  if (!h) return '';
  var cur = parseTrendPeriodKey_(h.current_period);
  var prev = parseTrendPeriodKey_(h.previous_period);
  var deltaText, deltaColor;
  if (h.delta === 0) {
    deltaText = 'No change';
    deltaColor = 'var(--ink-soft)';
  } else if (h.delta < 0) {
    deltaText = Math.abs(h.delta) + ' fewer student' + (Math.abs(h.delta) === 1 ? '' : 's') + ' At Risk';
    deltaColor = '#15803d';
  } else {
    deltaText = h.delta + ' more student' + (h.delta === 1 ? '' : 's') + ' At Risk';
    deltaColor = '#b91c1c';
  }
  // Phase 31g: no longer wraps itself in a <div class="card"> -- the caller
  // (renderDashboard) wraps this body in a collapsible "This Month" section.
  var html = '<div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px">'
    + '<div><strong style="font-size:1rem">Schoolwide At Risk: ' + h.previous_at_risk + ' → ' + h.current_at_risk + '</strong>'
    + '<div class="muted" style="font-size:.8rem;margin-top:2px">' + escapeHtml(prev.season) + ' ' + escapeHtml(prev.schoolYear)
    + ' → ' + escapeHtml(cur.season) + ' ' + escapeHtml(cur.schoolYear) + '</div></div>'
    + '<div style="font-weight:700;color:' + deltaColor + '">' + escapeHtml(deltaText) + '</div>'
    + '</div>'
    // Real find, 2026-09-26 (independent code review, "reporting consistency"):
    // this is a SCORE-based risk tier (this year's worst recorded result),
    // regardless of whether a required test was actually given -- it can
    // disagree with Benchmarking Overview below, which checks the opposite
    // (was the required test given, regardless of score).
    + '<p class="muted" style="font-size:.72rem;margin:6px 0 0">Based on this year\'s recorded scores. See Benchmarking Overview below for whether required tests were actually given.</p>';

  // 2026-09-24, at the school's request ("looking for a trend... instead
  // of just right now vs last time"): the block above only ever compares
  // the 2 most recent periods -- this adds the real multi-period picture,
  // as a percentage of currently-active students (not a raw count, so
  // enrollment changes don't get misread as the risk trend itself moving).
  if (h.verdict.direction !== 'insufficient') {
    var verdictColor = h.verdict.direction === 'improving' ? '#15803d' : (h.verdict.direction === 'declining' ? '#b91c1c' : 'var(--ink-soft)');
    html += '<div style="margin-top:12px;padding-top:12px;border-top:1px solid var(--line);display:flex;align-items:center;gap:14px;flex-wrap:wrap">'
      + buildTrendSparklineSvg_(h.series, verdictColor)
      + '<div><p class="muted" style="margin:0 0 2px;font-size:.72rem;text-transform:uppercase;letter-spacing:.04em">Across all ' + h.series.length + ' recorded periods</p>'
      + '<strong style="color:' + verdictColor + '">' + escapeHtml(h.verdict.text) + '</strong></div>'
      + '</div>';
  }
  return html;
}

/**
 * Phase 28 (Phase 6a review finding): renderDashboardHeadline_ above already
 * shows the aggregate At Risk count moved -- this answers the natural
 * follow-up, WHICH students, by name, moved since the last recorded period
 * (movement_summary, Dashboard.gs). Renders nothing at all once there's
 * only one recorded period (nothing to compare against yet) or when
 * nobody's bucket actually changed -- an empty "no movement" card would
 * just be noise on every single load.
 */
function renderMovementSummary_(d) {
  var m = d.movement_summary;
  if (!m || !m.prior_period) return '';
  if (m.declining_students.length === 0 && m.improving_students.length === 0) return '';

  function renderMovementList_(students, color) {
    return students.map(function(s) {
      return '<div class="student-row" onclick="openStudent(\'' + s.student_id + '\')">'
        + '<div class="student-name">' + escapeHtml(s.first_name) + ' ' + escapeHtml(s.last_initial) + '. <span class="muted" style="font-weight:400">(Grade ' + escapeHtml(s.grade || '—') + ')</span></div>'
        + '<div style="font-size:.78rem;color:' + color + '">' + escapeHtml(DASHBOARD_BUCKET_LABELS[s.from_bucket]) + ' → ' + escapeHtml(DASHBOARD_BUCKET_LABELS[s.to_bucket]) + '</div>'
        + '</div>';
    }).join('');
  }

  // Phase 31g: no longer wraps itself in a <div class="card"> -- the caller
  // (renderDashboard) wraps this body in a collapsible "Who Moved" section.
  // The specific period range moves from the old static h2 into this sub
  // line so that detail isn't lost just because the section title is now
  // a fixed label matching the other collapsible sections.
  var html = '<p class="muted" style="margin-bottom:8px;font-size:.8rem">' + escapeHtml(friendlyPeriodLabel_(m.prior_period)) + ' → ' + escapeHtml(friendlyPeriodLabel_(m.latest_period))
    + ' — students whose overall risk tier changed between the two most recently recorded periods.</p>';
  if (m.declining_students.length > 0) {
    html += '<h3 style="font-size:.82rem;margin:10px 0 4px;color:#b91c1c">Declining (' + m.declining_students.length + ')</h3>' + renderMovementList_(m.declining_students, '#b91c1c');
  }
  if (m.improving_students.length > 0) {
    html += '<h3 style="font-size:.82rem;margin:10px 0 4px;color:#15803d">Improving (' + m.improving_students.length + ')</h3>' + renderMovementList_(m.improving_students, '#15803d');
  }
  return html;
}

/**
 * Tier-Exit Alert (2026-09-27, administrator-requested feature): students
 * who've been On Track for 2+ consecutive most-recent recorded periods --
 * candidates to consider for exiting the ELC caseload. See
 * getTierExitCandidates' own comment (Dashboard.gs) for the exact criteria.
 * Same "no self-wrapping card" convention as renderMovementSummary_ --
 * renderDashboard wraps this in a collapsible section.
 */
function renderTierExitCandidates_(candidates) {
  if (!candidates || candidates.length === 0) return '';
  return '<p class="muted" style="margin-bottom:8px;font-size:.8rem">On Track for 2 or more consecutive recorded periods -- worth a look for exiting the ELC caseload, not an automatic decision.</p>'
    + candidates.map(function(s) {
        return '<div class="student-row" onclick="openStudent(\'' + s.student_id + '\')">'
          + '<div class="student-name">' + escapeHtml(s.first_name) + ' ' + escapeHtml(s.last_initial) + '. <span class="muted" style="font-weight:400">(Grade ' + escapeHtml(s.grade || '—') + ')</span></div>'
          + '<div style="font-size:.78rem;color:#15803d">On Track for ' + s.periods_on_track + ' periods running</div>'
          + '</div>';
      }).join('');
}

/**
 * Phase 23a (Phase 6a review): the two highest-priority "what needs my
 * attention" gaps the review flagged for the Dashboard -- a pending-request
 * backlog that was previously invisible unless you separately checked that
 * tab, and no on-screen confirmation of how fresh the data actually is.
 * Both are cheap, high-value additions to the same top-of-page real estate.
 */
function renderDashboardAttentionBar_(d) {
  var asOf = d.generated_at ? new Date(d.generated_at).toLocaleString() : '';
  var html = '<div class="card" style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px">'
    + '<div style="display:flex;flex-wrap:wrap;gap:10px">';

  var p = d.pending_summary || { count: 0, oldest_days: null };
  if (p.count === 0) {
    html += '<div class="badge badge-ok">✓ No pending assessment requests</div>';
  } else {
    var overdue = p.oldest_days !== null && p.oldest_days >= 14;
    var badgeClass = overdue ? 'badge-intensive' : 'badge-strategic';
    var label = p.count + ' pending assessment request' + (p.count === 1 ? '' : 's')
      + (p.oldest_days !== null ? ' — oldest ' + p.oldest_days + ' day' + (p.oldest_days === 1 ? '' : 's') + ' old' : '');
    html += '<span class="badge ' + badgeClass + '" style="cursor:pointer" onclick="goToRequests()">' + escapeHtml(label) + ' →</span>';
  }

  html += '</div>' + (asOf ? '<span class="muted" style="font-size:.74rem">Dashboard as of ' + escapeHtml(asOf) + '</span>' : '') + '</div>';
  return html;
}

/**
 * Phase 36 (finding #23): jumps straight to a section instead of scrolling
 * past everything above it. "By Grade" always links (that section always
 * renders, even as an empty state); the other three only appear when their
 * section is actually going to render, so there's never a dead link.
 */
function renderDashboardJumpNav_(hasHeadline, hasMovement, hasCompliance, hasCohortGrowth, hasTierExit) {
  var links = [];
  if (hasHeadline) links.push('<a href="#section-dashboard.headline">This Month</a>');
  if (hasMovement) links.push('<a href="#section-dashboard.movement">Who Moved</a>');
  if (hasCohortGrowth) links.push('<a href="#section-dashboard.cohortgrowth">Cohort Growth</a>');
  links.push('<a href="#section-dashboard.atrisk">At Risk — All Grades</a>');
  links.push('<a href="#section-dashboard.grades">By Grade</a>');
  if (hasCompliance) links.push('<a href="#section-dashboard.compliance">Benchmarking Overview</a>');
  if (hasTierExit) links.push('<a href="#section-dashboard.tierexit">Ready to Exit</a>');
  return '<nav class="muted" style="margin-bottom:14px;font-size:.82rem;display:flex;gap:14px;flex-wrap:wrap">' + links.join('') + '</nav>';
}

/**
 * Real find (2026-09-11): the Dashboard heading was hardcoded "Principal
 * Dashboard" for EVERY role -- a grade-level teacher scoped to only her own
 * grade's data still saw that exact title, which reasonably read as a
 * permissions mistake even though the data itself was correctly scoped
 * (requireDashboardAccess_ server-side already gates this correctly; this
 * was purely a display bug). Differentiated by role per the school's own
 * preference: Administrator gets "Admin Dashboard"; everyone else's title
 * includes the word "Teacher" (an ELC Staff account is still a teacher,
 * just caseload-wide instead of one grade), with a prefix so the two don't
 * read as identical.
 */
function dashboardTitle_(d) {
  var access = state.myAccess || {};
  if (access.is_administrator) return 'Admin Dashboard';
  if (access.is_elc_staff) return 'ELC Teacher Dashboard';
  if (d && d.grades && d.grades.length === 1) return 'Grade ' + d.grades[0].grade + ' Teacher Dashboard';
  return 'Teacher Dashboard'; // fallback -- e.g. an "Other" role scoped to multiple grades
}

function renderDashboard() {
  var d = state.dashboard;
  if (!state.dashboardExpanded) state.dashboardExpanded = {};
  if (!state.complianceExpanded) state.complianceExpanded = {};

  // Phase 30h: the Dashboard already knows the school-wide pending count --
  // piggyback on it to keep the nav badge fresh without a dedicated fetch.
  updateRequestsNavBadge_(d.pending_summary && d.pending_summary.count);

  // Phase 31g: restructured into collapsible sections (Option B from the
  // Dashboard restructure review) -- the attention bar stays always visible
  // (it's the "what needs my attention right now" summary); everything
  // below is an independently collapsible card, in the same order as the
  // reviewed mockup: This Month -> Who Moved -> By Grade -> Benchmarking
  // Status. Every section starts expanded the first time (nothing new is
  // hidden by default) -- see renderCollapsibleCard_/state.sectionExpanded.
  // Phase 36 (finding #23): the live Dashboard had no page-level heading of
  // its own (only the persistent app header up top) and no way to jump
  // straight to a section on a long scroll -- both fixed here rather than
  // inside any individual section, since they're properties of the page.
  var headlineBody = renderDashboardHeadline_(d);
  var movementBody = renderMovementSummary_(d);
  // 2026-09-23, at the school's request ("is there a place to see just all
  // the students at risk in all grades"): the per-grade At Risk count was
  // already clickable, but only ever showed ONE grade's list at a time --
  // reuses the exact same students_by_bucket data every grade card already
  // has (Dashboard.gs), just flattened across every grade client-side, so
  // no new server call is needed.
  var allAtRisk = [];
  d.grades.forEach(function(g) {
    (g.students_by_bucket.at_risk || []).forEach(function(s) { allAtRisk.push(Object.assign({ grade: g.grade }, s)); });
  });
  allAtRisk.sort(function(a, b) { return gradeSortCompareClient_(a.grade, b.grade) || (a.first_name + a.last_initial).localeCompare(b.first_name + b.last_initial); });
  var atRiskBody = allAtRisk.length === 0
    ? '<div class="empty-state">No students currently At Risk.</div>'
    : allAtRisk.map(function(s) {
        return '<div class="student-row" onclick="openStudent(\'' + s.student_id + '\')">'
          + '<div class="student-name">' + escapeHtml(s.first_name) + ' ' + escapeHtml(s.last_initial) + '. <span class="muted" style="font-weight:400">(Grade ' + escapeHtml(s.grade) + ')</span></div>'
          + '<div class="muted">' + chevronRightIconSvg_() + '</div></div>';
      }).join('');

  // Trend #2 from the report-ideas backlog (2026-09-26): only shown when
  // there's at least one real cohort (an empty roster/no history yet
  // renders nothing rather than a dead section).
  var cohortGrowthReport = state.cohortGrowth;
  var hasCohortGrowth = !!(cohortGrowthReport && cohortGrowthReport.cohorts && cohortGrowthReport.cohorts.length > 0);
  var cohortGrowthBody = hasCohortGrowth ? renderCohortGrowthSection_(cohortGrowthReport) : '';

  var tierExitBody = renderTierExitCandidates_(state.tierExitCandidates);

  var html = '<h1 style="margin-bottom:12px">' + escapeHtml(dashboardTitle_(d)) + '</h1>'
    + renderDashboardJumpNav_(!!headlineBody, !!movementBody, !!state.compliance, hasCohortGrowth, !!tierExitBody);
  html += renderDashboardAttentionBar_(d);

  if (headlineBody) html += renderCollapsibleCard_('dashboard.headline', 'This Month', headlineBody, 'toggleDashboardSection_');
  if (movementBody) html += renderCollapsibleCard_('dashboard.movement', 'Who Moved', movementBody, 'toggleDashboardSection_');
  if (cohortGrowthBody) html += renderCollapsibleCard_('dashboard.cohortgrowth', 'Cohort Growth — Same Students Over Time', cohortGrowthBody, 'toggleDashboardSection_');
  html += renderCollapsibleCard_('dashboard.atrisk', 'At Risk — All Grades (' + allAtRisk.length + ')', atRiskBody, 'toggleDashboardSection_');

  var gradesBody = '<div class="field" style="max-width:260px;margin-bottom:12px"><label>Grade</label><select id="dashboard-grade-filter" onchange="onDashboardGradeFilterChange_()">'
    + '<option value="">All Grades</option>'
    + d.grades.map(function(g) { return '<option' + (state.dashboardGradeFilter === g.grade ? ' selected' : '') + '>' + escapeHtml(g.grade) + '</option>'; }).join('')
    + '</select></div>'
    // 2026-09-23, at the school's request: toggleDashboardBucket_ already
    // expands the actual student list for whichever bucket (At Risk, Some
    // Risk, On Track, Not Yet Assessed) you click below -- it just wasn't
    // obvious that the count boxes were clickable at all (cursor:pointer on
    // .dashboard-cell alone isn't much of a signal). Spelling it out here
    // instead of only relying on hover.
    + '<p class="muted" style="margin-bottom:12px">Current risk-tier snapshot per grade (worst currently-known tier across any measure a student has been given), and how that mix has moved across every recorded assessment period. <strong>Click any count below to see that list of students.</strong></p>'
    // Phase 43: schoolwide/board-level exports stay Administrator/ELC Staff
    // only -- a Grade-Level Teacher's Dashboard is already narrowed to just
    // their own grade(s), but these two specifically imply a cross-grade
    // reporting action ("Board Packet" is literally board-level), not
    // something the "no new actions" ask for their view should include.
    + ((state.myAccess && (state.myAccess.is_administrator || state.myAccess.is_elc_staff))
        ? '<button class="btn btn-secondary btn-small" onclick="exportDashboardCsv_()">Export CSV</button> '
          + '<button class="btn btn-secondary btn-small" onclick="previewBoardPacketClick()">Print Board Packet</button>'
        : '');

  var visibleGrades = filteredDashboardGrades_();
  if (visibleGrades.length === 0) {
    gradesBody += '<div class="empty-state" style="margin-top:12px">' + (state.dashboardGradeFilter ? 'No active students in this grade.' : 'No active students on the roster yet.') + '</div>';
  } else {
    // Real CSS Grid (Phase 19) instead of one full-width card per grade
    // stacked forever -- lays out multiple grades per row once body.wide-view
    // (see updateNavActive_) gives it the room.
    gradesBody += '<div class="dashboard-grid">';
    visibleGrades.forEach(function(g) {
      gradesBody += '<div class="card">'
        + '<h2>Grade ' + escapeHtml(g.grade) + ' <span class="muted" style="font-weight:400;font-size:.8rem">(' + g.total + ' students)</span></h2>'
        + '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px">'
        + DASHBOARD_BUCKETS_ORDER.map(function(b) {
            return '<div class="dashboard-cell" style="border-color:' + DASHBOARD_BUCKET_COLORS[b] + '" onclick="toggleDashboardBucket_(\'' + g.grade + '\',\'' + b + '\')">'
              + '<div style="font-size:1.3rem;font-weight:700;color:' + DASHBOARD_BUCKET_COLORS[b] + '">' + g.current[b] + '</div>'
              // Real find, 2026-09-27 (independent code review + administrator
              // report, "design & spacing"): this is the actual risk-category
              // label a principal reads to interpret the count above it, not
              // a decorative caption -- bumped from .72rem (~11.5px) to a
              // normal readable size. The box has no fixed width (min-width
              // only) and text-align:center, so this fits fine even for
              // "Not Yet Assessed", the longest label.
              + '<div class="muted" style="font-size:.85rem">' + DASHBOARD_BUCKET_LABELS[b] + '</div></div>';
          }).join('')
        + '</div>';

      var expandedBucket = state.dashboardExpanded[g.grade];
      if (expandedBucket) {
        var list = g.students_by_bucket[expandedBucket];
        gradesBody += '<div style="margin-bottom:10px">';
        if (list.length === 0) {
          gradesBody += '<div class="empty-state">No students in this bucket.</div>';
        } else {
          list.forEach(function(s) {
            gradesBody += '<div class="student-row" onclick="openStudent(\'' + s.student_id + '\')">'
              + '<div class="student-name">' + escapeHtml(s.first_name) + ' ' + escapeHtml(s.last_initial) + '.' + notAssessedComplianceBadge_(s) + staleAssessmentBadge_(s) + '</div>'
              + '<div class="muted">' + chevronRightIconSvg_() + '</div></div>';
          });
        }
        gradesBody += '</div>';
      }

      // Multi-period trend strip -- same visual language as the per-student
      // sparklines (Growth Over Time), stacked by bucket proportion so a
      // principal can see whether this grade is trending better or worse
      // across every recorded period, not just right now. Each bucket
      // segment also carries a non-color texture (bucket-pattern-* classes)
      // and each period bar is tappable (title-only hover doesn't fire on
      // touch) -- tapping shows that period's exact counts below, and
      // outlines the selected bar so the current selection is visible too.
      if (g.trend.length > 0) {
        var selIdx = (DASHBOARD_TREND_SELECTED_[g.grade] !== undefined) ? DASHBOARD_TREND_SELECTED_[g.grade] : g.trend.length - 1;
        gradesBody += '<p class="muted" style="margin-bottom:4px">Trend across recorded periods (tap a bar for exact counts)</p>'
          + '<div class="sparkline" style="height:48px">' + g.trend.map(function(t, ti) {
              var total = t.counts.at_risk + t.counts.some_risk + t.counts.on_track + t.counts.not_assessed;
              var segs = DASHBOARD_BUCKETS_ORDER.map(function(b) {
                var h = total > 0 ? Math.round(t.counts[b] / total * 48) : 0;
                return '<div class="bucket-pattern-' + b + '" style="height:' + h + 'px;width:100%;background:' + DASHBOARD_BUCKET_COLORS[b] + '"></div>';
              }).join('');
              var titleText = friendlyPeriodLabel_(t.period) + ': ' + t.counts.at_risk + ' at risk, ' + t.counts.some_risk + ' some risk, '
                + t.counts.on_track + ' on track, ' + t.counts.not_assessed + ' not yet assessed';
              var selectedStyle = ti === selIdx ? ';box-shadow:0 0 0 2px var(--ink)' : '';
              return '<div style="display:flex;flex-direction:column-reverse;width:22px;min-width:22px;height:48px;border-radius:2px;overflow:hidden;cursor:pointer' + selectedStyle
                + '" title="' + escapeHtml(titleText) + '" onclick="selectDashboardTrendPeriod_(\'' + escapeHtml(g.grade) + '\', ' + ti + ')">' + segs + '</div>';
            }).join('') + '</div>'
          + '<div class="sparkline-caption" id="trend-detail-' + escapeHtml(g.grade) + '">' + dashboardTrendDetailText_(g.trend[selIdx]) + '</div>';

        // 2026-09-24, at the school's request: same multi-period verdict as
        // the schoolwide headline (computeTrendVerdict_), scoped to just
        // this grade's own At Risk % across every period it has recorded --
        // the stacked bars above already show the shape, this names it.
        var gradeVerdict = computeTrendVerdict_(
          g.trend.map(function(t) { var tot = t.counts.at_risk + t.counts.some_risk + t.counts.on_track + t.counts.not_assessed; return tot > 0 ? (t.counts.at_risk / tot * 100) : 0; }),
          true
        );
        if (gradeVerdict.direction !== 'insufficient') {
          var gvColor = gradeVerdict.direction === 'improving' ? '#15803d' : (gradeVerdict.direction === 'declining' ? '#b91c1c' : 'var(--ink-soft)');
          gradesBody += '<p style="margin:4px 0 0;font-size:.78rem;color:' + gvColor + '">' + escapeHtml(gradeVerdict.text) + '</p>';
        }
      }

      gradesBody += renderYoyComparisonSection_(g);

      gradesBody += '</div>';
    });
    gradesBody += '</div>'; // .dashboard-grid
  }
  html += renderCollapsibleCard_('dashboard.grades', 'By Grade', gradesBody, 'toggleDashboardSection_');

  var complianceBody = renderComplianceSection_();
  if (complianceBody) html += renderCollapsibleCard_('dashboard.compliance', 'Benchmarking Overview', complianceBody, 'toggleDashboardSection_');

  if (tierExitBody) html += renderCollapsibleCard_('dashboard.tierexit', 'Ready to Exit (' + state.tierExitCandidates.length + ')', tierExitBody, 'toggleDashboardSection_');

  app.innerHTML = html;
}

function csvEscape_(v) {
  var s = String(v == null ? '' : v);
  if (/[",\n]/.test(s)) return '"' + s.replace(/"/g, '""') + '"';
  return s;
}

function downloadTextFile_(text, filename, mimeType) {
  var a = document.createElement('a');
  a.href = 'data:' + mimeType + ';charset=utf-8,' + encodeURIComponent(text);
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
}

/**
 * CSV is reserved for exactly this kind of bulk/aggregate export (per the
 * user's decision) -- it's a school-wide count table, not individual student
 * PII, so a downloaded file is a reasonable trade-off here even though the
 * app avoids that pattern for single-student data (see copyStudentSummaryClick).
 */
// Phase 25h (Phase 6a review finding #16): neither this export nor
// exportSummaryCsv_ self-described the scope/period they covered --
// unlike exportComplianceCsv_ (Phase 23e), which already does. Bringing
// both in line with that same header-row convention (scope + generated
// timestamp before the data table).
function exportDashboardCsv_() {
  if (!state.dashboard) return;
  var d = state.dashboard;
  var rows = [
    ['Grade Filter', state.dashboardGradeFilter || 'All Grades'],
    ['Generated', d.generated_at ? new Date(d.generated_at).toLocaleString() : ''],
    [],
    ['Grade', 'Total Students', 'At Risk', 'Some Risk', 'On Track', 'Not Yet Assessed']
  ];
  filteredDashboardGrades_().forEach(function(g) {
    rows.push([g.grade, g.total, g.current.at_risk, g.current.some_risk, g.current.on_track, g.current.not_assessed]);
  });
  var csv = rows.map(function(r) { return r.map(csvEscape_).join(','); }).join('\r\n');
  downloadTextFile_(csv, 'principal-dashboard-' + todayIso_() + '.csv', 'text/csv');
}

/**
 * Phase 23d (Phase 6a review finding): the Compliance section -- arguably
 * the single most board-relevant screen -- had zero export path at all,
 * unlike Dashboard/Summary. Aggregate-only by design (checkpoint-level
 * counts, no individual student names) -- matches Dashboard's own
 * aggregate-CSV precedent and gives a board-safe file to actually hand over
 * instead of live-screen-sharing the named gap lists in this same view.
 * Includes school year + role filter as explicit rows (Phase 23e/6a
 * finding: exports should self-describe their own scope, not rely on
 * context that only exists on the live page at the moment it was run).
 */
function exportComplianceCsv_() {
  var c = state.compliance;
  if (!c) return;
  var rows = [
    ['School Year', c.school_year],
    ['Administered By Filter', c.administrator_role || 'All'],
    ['Generated', (window.ELC_DEMO_NOW ? window.ELC_DEMO_NOW() : new Date()).toLocaleString()],
    [],
    ['Checkpoint', 'Season', 'Due Date', 'Status', 'Students Evaluated', 'Completed', 'Completion %']
  ];
  c.checkpoints.forEach(function(cp) {
    var status = cp.is_past_due
      ? (cp.gaps.length === 0 ? 'All caught up' : (cp.gaps.length + ' missing'))
      : (cp.days_until_due !== null && cp.days_until_due !== undefined ? 'Due in ' + cp.days_until_due + ' days' : 'Not due yet');
    rows.push([
      cp.label, cp.season, fmtDate(cp.due_date), status,
      cp.evaluated_count !== null ? cp.evaluated_count : '',
      cp.completed_count !== null ? cp.completed_count : '',
      cp.completion_percentage !== null ? cp.completion_percentage : ''
    ]);
  });
  var csv = rows.map(function(r) { return r.map(csvEscape_).join(','); }).join('\r\n');
  downloadTextFile_(csv, 'benchmarking-compliance-' + c.school_year.replace(/[^0-9A-Za-z]/g, '') + '-' + todayIso_() + '.csv', 'text/csv');
}

function showAddStudentForm() {
  renderK56Picker_('add-student-slot', function() { loadRoster(); });
}

// ── K5-6 Roster picker (Phase 25/#166) ───────────────────────
// Shared "+ Add Student" search-and-select component: searches the full
// K5-6 schoolwide FACTS roster (searchK56Roster) and, on selection, adds
// the student under their REAL FACTS student_id (addStudentFromK56Roster)
// -- never a generated one -- so if this student is later flagged ELC in
// FACTS, they're recognized as the SAME student rather than creating a
// duplicate record with none of their assessment history. Used by both
// the Roster view's "+ Add Student" button and the Request Assessment
// flow's inline "+ Add Student" button -- one implementation, two call
// sites. Phase 36 (finding #39): these two used to say different things
// ("+ Student not in our roster?" in the Request Assessment flow) for the
// exact same action -- unified on the shorter, already-familiar label.
var K56_PICKER_SEARCH_DEBOUNCE_MS_ = 300;
var k56PickerSearchTimer_ = null;
var k56PickerSearchToken_ = 0;
var k56PickerOnAdded_ = null;

function renderK56Picker_(containerId, onAdded) {
  k56PickerOnAdded_ = onAdded;
  var slot = document.getElementById(containerId);
  // Phase 25/#166b: the off-roster manual-add fallback is Administrator-only
  // (matching addManualStudent's server-side gate) -- everyone else only
  // ever sees the picker, with no way to mint a non-FACTS student_id.
  var isAdmin = !!(state.myAccess && state.myAccess.is_administrator);
  slot.innerHTML = '<div class="card">'
    + '<h2 style="font-size:.95rem">Add Student</h2>'
    + '<p class="muted" style="margin-bottom:12px">Search the full K5-6 student list — selecting a match adds them under their real school ID, so their records stay linked if they later join ELC.</p>'
    + '<div class="field"><label>Student name</label><input type="text" id="' + containerId + '-query" placeholder="Start typing a name…" oninput="onK56PickerInput_(\'' + containerId + '\')" /></div>'
    + '<div id="' + containerId + '-results" class="muted" style="margin-top:8px;font-size:.85rem">Type at least 2 letters of a name.</div>'
    + (isAdmin
        ? '<button class="btn btn-secondary btn-small" style="margin-top:10px" onclick="toggleK56ManualFallback_(\'' + containerId + '\')">Can&rsquo;t find them? Add manually (Administrator only)</button>'
          + '<div id="' + containerId + '-manual-slot" style="margin-top:8px"></div>'
        : '')
    + '<button class="btn btn-secondary btn-small" style="margin-top:10px" onclick="document.getElementById(\'' + containerId + '\').innerHTML=\'\'">Cancel</button>'
    + '</div>';
}

/** Administrator-only off-roster fallback (Phase 25/#166b) -- a genuinely real student not (yet) on the K5-6 roster. */
function toggleK56ManualFallback_(containerId) {
  var slot = document.getElementById(containerId + '-manual-slot');
  if (slot.innerHTML) { slot.innerHTML = ''; return; }
  slot.innerHTML = '<div class="card">'
    + '<p class="muted" style="margin-bottom:8px">Use this ONLY when a genuinely real student isn&rsquo;t listed yet in the K5-6 roster (e.g. a brand-new enrollment FACTS hasn&rsquo;t synced). This creates a placeholder record instead of linking to their real school ID.</p>'
    + '<div class="field-row">'
    + '<div class="field"><label>First name</label><input type="text" id="' + containerId + '-manual-first" /></div>'
    + '<div class="field"><label>Last name</label><input type="text" id="' + containerId + '-manual-last" /></div>'
    + '</div>'
    + '<div class="field-row">'
    + '<div class="field"><label>Grade</label><input type="text" id="' + containerId + '-manual-grade" placeholder="e.g. 2" /></div>'
    + '<div class="field"><label>School</label><input type="text" id="' + containerId + '-manual-school" /></div>'
    + '</div>'
    + '<div class="field"><label>Notes (optional)</label><textarea id="' + containerId + '-manual-notes" rows="2"></textarea></div>'
    + '<button class="btn btn-primary btn-small" onclick="submitK56ManualFallback_(\'' + containerId + '\')">Save Student</button>'
    + '</div>';
}

function submitK56ManualFallback_(containerId) {
  var input = {
    first_name: document.getElementById(containerId + '-manual-first').value.trim(),
    last_name: document.getElementById(containerId + '-manual-last').value.trim(),
    grade: document.getElementById(containerId + '-manual-grade').value.trim(),
    school: document.getElementById(containerId + '-manual-school').value.trim(),
    notes: document.getElementById(containerId + '-manual-notes').value.trim()
  };
  if (!input.first_name || !input.last_name) { toast('First and last name are required.'); return; }
  call('addManualStudent', input).then(function(student) {
    if (!student) throw new Error('addManualStudent returned nothing.');
    toast('Student added.');
    document.getElementById(containerId).innerHTML = '';
    var cb = k56PickerOnAdded_;
    k56PickerOnAdded_ = null;
    if (cb) cb(student);
  }).catch(function(err) { toast('Error: ' + err.message); });
}

function onK56PickerInput_(containerId) {
  clearTimeout(k56PickerSearchTimer_);
  var query = document.getElementById(containerId + '-query').value.trim();
  var resultsEl = document.getElementById(containerId + '-results');
  if (query.length < 2) { resultsEl.className = 'muted'; resultsEl.innerHTML = 'Type at least 2 letters of a name.'; return; }
  resultsEl.className = 'muted';
  resultsEl.innerHTML = 'Searching…';

  var token = ++k56PickerSearchToken_;
  k56PickerSearchTimer_ = setTimeout(function() {
    call('searchK56Roster', query).then(function(matches) {
      if (token !== k56PickerSearchToken_ || !matches) return; // superseded by newer input
      renderK56PickerResults_(containerId, matches);
    }).catch(function(err) { resultsEl.innerHTML = 'Error: ' + escapeHtml(err.message); });
  }, K56_PICKER_SEARCH_DEBOUNCE_MS_);
}

function renderK56PickerResults_(containerId, matches) {
  var resultsEl = document.getElementById(containerId + '-results');
  if (matches.length === 0) {
    resultsEl.className = 'muted';
    resultsEl.innerHTML = 'No match in the K5-6 roster. If this student genuinely isn\'t listed yet, contact an administrator.';
    return;
  }
  resultsEl.className = '';
  resultsEl.innerHTML = matches.map(function(m) {
    return '<div class="session-item" style="padding:6px 8px;cursor:pointer" onclick="selectK56PickerResult_(\'' + containerId + '\',\'' + m.student_id + '\')">'
      + escapeHtml(m.name) + ' <span class="muted">(Grade ' + escapeHtml(m.grade || '—') + ')</span></div>';
  }).join('');
}

function selectK56PickerResult_(containerId, studentId) {
  var resultsEl = document.getElementById(containerId + '-results');
  resultsEl.innerHTML = 'Adding…';
  call('addStudentFromK56Roster', studentId).then(function(student) {
    if (!student) throw new Error('addStudentFromK56Roster returned nothing.');
    toast('Student added.');
    document.getElementById(containerId).innerHTML = '';
    var cb = k56PickerOnAdded_;
    k56PickerOnAdded_ = null;
    if (cb) cb(student);
  }).catch(function(err) { toast('Error: ' + err.message); resultsEl.innerHTML = ''; });
}

// ── Bulk roster import ──────────────────────────────────────
// Paste rows copied straight out of Excel/Google Sheets (tab-separated) or
// a comma-separated list, preview how they'll be parsed, then confirm to
// insert them all in one batched write via bulkAddStudents (Roster.gs).

/** Splits pasted text into row objects. Accepts tab- OR comma-separated columns, one student per line. */
function parseBulkImportText_(text) {
  // Filter blank lines using a trimmed check, but split the RAW (untrimmed)
  // line -- trimming first would eat a leading/trailing empty tab-delimited
  // column (e.g. a blank first-name cell before the tab), silently shifting
  // every field over by one.
  return String(text || '').split(/\r\n|\r|\n/)
    .filter(function(line) { return line.trim().length > 0; })
    .map(function(line) {
      var delim = line.indexOf('\t') !== -1 ? '\t' : ',';
      var cols = line.split(delim).map(function(c) { return c.trim(); });
      return {
        first_name: cols[0] || '',
        last_name: cols[1] || '',
        grade: cols[2] || '',
        school: cols[3] || '',
        elc_status: cols[4] || '',
        notes: cols[5] || ''
      };
    });
}

function showBulkImportForm() {
  var slot = document.getElementById('add-student-slot');
  slot.innerHTML = '<div class="card">'
    + '<h2>Bulk Import Students</h2>'
    + '<p class="muted" style="margin-bottom:12px">Paste one student per line, copied straight from Excel or Google Sheets. Columns, in order: '
    + '<strong>First name, Last name, Grade, School, ELC status, Notes</strong> (only First and Last name are required).</p>'
    + '<div class="field"><textarea id="bi-paste" rows="8" placeholder="Ann\tAdams\t1\nBo\tBaker\t3rd Grade"></textarea></div>'
    + '<div class="btn-row">'
    + '<button class="btn btn-primary" onclick="previewBulkImport_()">Preview</button>'
    + '<button class="btn btn-secondary" onclick="document.getElementById(\'add-student-slot\').innerHTML=\'\'">Cancel</button>'
    + '</div>'
    + '<div id="bulk-import-preview"></div>'
    + '</div>';
}

function previewBulkImport_() {
  var text = document.getElementById('bi-paste').value;
  var rows = parseBulkImportText_(text);
  state.bulkImportRows = rows;
  var preview = document.getElementById('bulk-import-preview');

  if (rows.length === 0) {
    preview.innerHTML = '<p class="muted" style="margin-top:12px">Nothing to preview yet — paste some rows above.</p>';
    return;
  }

  var html = '<h3 style="margin-top:16px">Preview (' + rows.length + ' row' + (rows.length === 1 ? '' : 's') + ')</h3>'
    + '<table class="preview-table"><thead><tr><th>First</th><th>Last</th><th>Grade</th><th>School</th><th>ELC Status</th><th>Notes</th></tr></thead><tbody>';
  rows.forEach(function(r) {
    var invalid = !r.first_name || !r.last_name;
    html += '<tr' + (invalid ? ' class="preview-row-invalid"' : '') + '>'
      + '<td>' + escapeHtml(r.first_name || '(missing)') + '</td>'
      + '<td>' + escapeHtml(r.last_name || '(missing)') + '</td>'
      + '<td>' + escapeHtml(r.grade) + '</td>'
      + '<td>' + escapeHtml(r.school) + '</td>'
      + '<td>' + escapeHtml(r.elc_status) + '</td>'
      // Real find, 2026-09-27 (independent code review, "design & spacing"):
      // every other column here is short (name/grade/status), so the
      // table-wide white-space:nowrap (.preview-table CSS) is fine for
      // them -- but Notes is genuinely free-text and can run long, which
      // used to force the WHOLE table into horizontal scroll instead of
      // just wrapping this one cell. Overridden here only, not table-wide,
      // so every other .preview-table (Email Log, audit logs, etc.) keeps
      // its existing nowrap behavior unchanged.
      + '<td style="white-space:normal;max-width:240px;overflow-wrap:break-word">' + escapeHtml(r.notes) + '</td>'
      + '</tr>';
  });
  html += '</tbody></table>';

  var invalidCount = rows.filter(function(r) { return !r.first_name || !r.last_name; }).length;
  if (invalidCount > 0) {
    html += '<p class="muted" style="margin-top:8px">' + invalidCount + ' row(s) highlighted above are missing a first or last name and will be skipped on import.</p>';
  }
  html += '<button class="btn btn-primary" onclick="confirmBulkImport_()">Confirm Import (' + rows.length + ')</button>';
  preview.innerHTML = html;
}

function confirmBulkImport_() {
  var rows = state.bulkImportRows || [];
  if (rows.length === 0) { toast('Nothing to import.'); return; }
  call('bulkAddStudents', rows).then(function(result) {
    if (!result) throw new Error('bulkAddStudents returned nothing.');
    var msg = result.added_count + ' student(s) added.';
    if (result.skipped_count > 0) msg += ' ' + result.skipped_count + ' skipped (missing/invalid name).';
    toast(msg);
    state.bulkImportRows = null;
    loadRoster();
  }).catch(function(err) { toast('Error: ' + err.message); });
}

// ── Student profile view ────────────────────────────────────

/**
 * Loads a student's full history, pending-request list, IEP goals, and
 * accommodations checklist together, setting all the related state fields
 * consistently. Every entry point that lands a user on/near the student
 * profile (opening it directly, starting a new assessment from the roster
 * picker, or "Record Assessment" from the requests queue) should go through
 * this, rather than each fetching getStudentHistory on its own -- a prior
 * version of two of these paths skipped refreshing currentStudentRequests,
 * so navigating in from those could show another student's (or stale)
 * pending-request data.
 *
 * Phase 35 (performance): this used to be several sequential
 * google.script.run calls -- each its own Apps Script execution. Now one
 * bundled call (getStudentProfileBundle, Code.gs) does all of them
 * server-side and returns them together, cutting profile-open from several
 * round trips to 1.
 */
function loadStudent_(studentId) {
  return call('getStudentProfileBundle', studentId).then(function(bundle) {
    if (!bundle || !bundle.history || !bundle.history.student) return false;
    state.currentHistory = bundle.history;
    state.currentStudent = bundle.history.student;
    state.currentStudentRequests = bundle.requests || [];
    state.currentIepGoals = bundle.iepGoals || [];
    state.currentAccommodations = bundle.accommodations || [];
    state.currentSection504 = bundle.section504 || null;
    state.currentSection504History = null; // a different student's history shouldn't linger visible/cached from before
    state.section504HistoryVisible = false;
    return true;
  });
}

function openStudent(studentId) {
  app.innerHTML = '<div class="card"><p class="muted">Loading student…</p></div>';
  loadStudent_(studentId).then(function(ok) {
    if (!ok) {
      // Phase 30f (Phase 6b review finding): "Check Executions in the Apps
      // Script editor" told a teacher to go somewhere they have no access
      // to or knowledge of -- replaced with something they can actually act on.
      app.innerHTML = '<div class="card">Couldn\'t load this student right now. Try again in a moment, or let your ELC team know if this keeps happening.</div>';
      return;
    }
    state.view = 'profile';
    updateNavActive_();
    renderProfile();
  }).catch(function(err) { app.innerHTML = '<div class="card">Error: ' + (err && err.message ? err.message : JSON.stringify(err)) + '</div>'; });
}

function renderProfile() {
  var s = state.currentStudent;
  var h = state.currentHistory;

  var html = '<button class="btn btn-secondary btn-small" onclick="goToRoster()">‹ Back to Students</button>';

  html += '<div class="card" style="margin-top:12px">'
    + '<h2>' + escapeHtml(s.first_name) + ' ' + escapeHtml(s.last_name) + '</h2>'
    + '<p class="muted">Grade ' + escapeHtml(s.grade || '—') + (s.school ? ' · ' + escapeHtml(s.school) : '') + (s.elc_status ? ' · ' + escapeHtml(s.elc_status) : '') + '</p>'
    // Phase (2026-08-05): a deactivated student's profile is still fully
    // reachable via the admin-only Deactivated Students list -- this banner
    // is what makes it unmistakable you're looking at an archived record,
    // not an active case, so nobody mistakes it for one.
    + ((s.active === false || s.active === 'FALSE') ? '<p style="margin-top:8px"><span class="tag tag-neutral" style="margin-left:0">Deactivated — ' + escapeHtml(s.deactivation_reason || 'Other') + '</span></p>' : '')
    // flex + gap (not just a literal space between buttons) so wrapped rows on
    // narrow screens still get real vertical separation -- previously two
    // buttons on adjacent wrapped lines had zero gap between them, and
    // Remove Student (destructive) could end up directly touching whichever
    // button wrapped above it. margin-left:auto also pushes Remove Student to
    // the far right/its own line, away from the other (safe) actions.
    + '<div style="margin-top:12px;display:flex;flex-wrap:wrap;gap:10px">'
    + '<button class="btn btn-primary" onclick="startNewAssessment()">Score Assessment</button>'
    + '<button class="btn btn-secondary" onclick="copyStudentSummaryClick()">Copy Summary</button>'
    + '<button class="btn btn-secondary" onclick="previewStudentReportClick()">Print Report</button>'
    + '<button class="btn btn-secondary" onclick="showEditStudentForm_()">Edit Student</button>'
    + ((s.active === false || s.active === 'FALSE')
        ? '<button class="btn btn-secondary" style="border-color:#16a34a;color:#15803d;margin-left:auto" onclick="reactivateStudentClick(\'' + s.student_id + '\')">Reactivate Student</button>'
        : '<button class="btn btn-secondary" style="border-color:#ef4444;color:#b91c1c;margin-left:auto" onclick="removeStudentClick(\'' + s.student_id + '\')">Remove Student</button>')
    + '</div>'
    + '<div id="edit-student-slot"></div>'
    + '</div>';

  var openRequests = state.currentStudentRequests.filter(function(r) { return r.status === 'pending'; });
  if (openRequests.length > 0) {
    html += '<div class="card"><h2>Flagged Concerns for This Student</h2>';
    openRequests.forEach(function(r) {
      html += '<div class="session-item">'
        + '<div class="session-head"><div>'
        + '<div class="session-title">' + escapeHtml(requestDescriptionText_(r)) + '</div>'
        + '<div class="session-meta">Requested by ' + escapeHtml(r.requested_by) + ' on ' + fmtDate(r.requested_at) + '</div>'
        + '</div>' + requestAgeBadge_(r.requested_at) + '</div>'
        + (r.note ? '<div class="muted" style="margin-top:4px">' + escapeHtml(r.note) + '</div>' : '')
        + '<div class="btn-row" style="margin-top:8px">'
        + '<button class="btn btn-primary btn-small" onclick="startNewAssessment(\'' + (r.suggested_assessment_type || '') + '\',\'' + r.request_id + '\')">Score Assessment</button>'
        // Both buttons below pass a callback that re-opens THIS student on
        // success, instead of firing openStudent() synchronously alongside
        // the async call (the original approach), which raced against the
        // call's own success handler and could unexpectedly navigate to the
        // global Requests view instead.
        + '<button class="btn btn-secondary btn-small" onclick="resolveRequestManuallyClick(\'' + r.request_id + '\', function() { openStudent(\'' + s.student_id + '\'); })">Mark Resolved</button>'
        + '<button class="btn btn-secondary btn-small" onclick="cancelRequestClick(\'' + r.request_id + '\', function() { openStudent(\'' + s.student_id + '\'); })">Cancel</button>'
        + '</div></div>';
    });
    html += '</div>';
  }

  // Past requests (resolved/cancelled) are already fetched by getRequestsForStudent
  // (it returns every status, not just pending) -- this just surfaces the
  // history the client was already discarding, so a teacher/ELC/principal can
  // see when a past request was made and how it was closed out, without
  // waiting on the 14-day overdue email or digging into the sheet directly.
  var pastRequests = state.currentStudentRequests.filter(function(r) { return r.status !== 'pending'; });
  if (pastRequests.length > 0) {
    html += '<details class="card"><summary style="cursor:pointer"><h2 style="display:inline">Past Requests for This Student</h2></summary>';
    pastRequests.forEach(function(r) {
      html += '<div class="session-item">'
        + '<div class="session-head"><div>'
        + '<div class="session-title">' + escapeHtml(requestDescriptionText_(r)) + '</div>'
        + '<div class="session-meta">Requested by ' + escapeHtml(r.requested_by) + ' on ' + fmtDate(r.requested_at)
        + (r.fulfilled_at ? ' · ' + escapeHtml(requestResolvedStatusText_(r)) + ' on ' + fmtDate(r.fulfilled_at) : ' · ' + escapeHtml(requestResolvedStatusText_(r)))
        + '</div></div></div>'
        + (r.note ? '<div class="muted" style="margin-top:4px">' + escapeHtml(r.note) + '</div>' : '')
        + '</div>';
    });
    html += '</details>';
  }

  var strengthsBody = '';
  if (h.strengths.length === 0 && h.concerns.length === 0) {
    strengthsBody = '<div class="empty-state">No assessments recorded yet.</div>';
  } else {
    if (h.strengths.length) {
      // Phase 32: was a leaf-green accent; navy is now the sole accent
      // family, same treatment already used for Accommodations &
      // Modifications' suggestion panel below.
      strengthsBody += '<div style="border-left:4px solid var(--navy);background:var(--navy-tint);border-radius:0 8px 8px 0;padding:10px 14px;margin-bottom:10px">'
        + '<p class="muted" style="margin-bottom:6px">Strengths</p>';
      h.strengths.forEach(function(s) {
        strengthsBody += tierBadge('Mastery').replace('Mastery', escapeHtml(measureLabel_(s.measure)))
          + (s.stale ? ' <span class="badge badge-yellow" style="margin-left:4px" title="Last assessed in the ' + escapeHtml(s.last_assessed_school_year) + ' school year">Needs Retesting (' + escapeHtml(measureAbbreviation_(s.measure)) + ')</span>' : '');
      });
      strengthsBody += '</div>';
    }
    if (h.concerns.length) {
      strengthsBody += '<p class="muted" style="margin-bottom:6px">Areas of concern</p>';
      h.concerns.forEach(function(c) {
        var plain = tierPlainLanguage_(c.tier);
        // Phase 37 (finding #17): a concern used to show with no way to tell
        // a fresh result from one that's a year or more old -- Growth.gs now
        // flags c.stale whenever the tier driving this isn't from the
        // current school year, same "Needs Retesting" language as the
        // Dashboard's equivalent badge (staleAssessmentBadge_).
        strengthsBody += '<span class="badge badge-' + (TIER_LABEL_TO_CLASS[c.tier] || 'neutral') + '">' + escapeHtml(measureLabel_(c.measure)) + ' — ' + c.tier
          + (plain ? ' (' + plain + ')' : '')
          + (c.trend !== 'insufficient data' ? ' · ' + c.trend : '') + '</span>'
          + (c.stale ? ' <span class="badge badge-yellow" style="margin-left:4px" title="Last assessed in the ' + escapeHtml(c.last_assessed_school_year) + ' school year">Needs Retesting (' + escapeHtml(measureAbbreviation_(c.measure)) + ')</span>' : '');
      });
    }
  }
  html += renderCollapsibleCard_('profile.strengths', 'Strengths & Areas of Concern', strengthsBody, 'toggleProfileSection_');

  html += renderCollapsibleCard_('profile.support', 'Accommodations & Modifications', renderSupportSection_(h), 'toggleProfileSection_');

  // 504 Plan (2026-09-11) -- placed immediately after Accommodations &
  // Modifications since a 504 plan IS an accommodations document; the
  // separate section exists because it also carries diagnosis/medications
  // (PHI) and prints as its own formal letterhead document, unlike the
  // checklist above. See Section504.gs for the access model.
  html += renderCollapsibleCard_('profile.section504', '504 Plan', renderSection504_(), 'toggleProfileSection_');

  // Phase 6i: a formal IEP goal is a distinct concept from the accommodations
  // & modifications checklist just above -- kept as its own section rather
  // than merged in, but placed immediately adjacent since the two are
  // closely related on the ground.
  html += renderCollapsibleCard_('profile.iepgoals', 'IEP Goals', renderIepGoalsSection_(), 'toggleProfileSection_');

  // 2026-09-26, at the administrator's explicit request ("no real way of
  // looking at a student over time and are they trending up or worse"; "I
  // want a few ways of looking at it... I want what's best not easiest"):
  // a dedicated selector-driven section, placed ABOVE the exhaustive
  // per-measure Growth Over Time list below -- see renderProgressOverTimeSection_'s
  // own comment for what the 3 kinds of views are and why. Omitted entirely
  // (both the section and its jump-nav-equivalent visibility) when there's
  // truly nothing to show yet (a brand-new student with zero results).
  var progressBody = renderProgressOverTimeSection_(h);
  if (progressBody) html += renderCollapsibleCard_('profile.progress', 'Progress Over Time', progressBody, 'toggleProfileSection_');

  // Phase 31h/36: same collapsible treatment across every Profile section --
  // Phase 31h only did Growth Over Time/Assessment History (the two that can
  // get long); Strengths & Concerns and Accommodations & Modifications (finding
  // #38) were left always-open, which was the actual remaining part of the
  // "one long un-anchored scroll" complaint. All four are collapsible now,
  // all default-expanded so nothing that used to be visible disappears.
  var growthBody = '';
  var measureIds = Object.keys(h.measureSeries);
  if (measureIds.length === 0) {
    growthBody = '<div class="empty-state">No measures recorded yet.</div>';
  } else {
    growthBody = growthChartShapeLegend_();
    // Group by assessment world (CORE Phonics, DIBELS, Lexile, ...) rather
    // than one flat list -- a measure family that spans more than one
    // assessment type (e.g. the merged oral-reading-fluency series) is
    // grouped under whichever type gave its most recent point, with a note
    // that it draws on more than one assessment.
    var groups = {};
    var groupOrder = [];
    var groupLatestTime = {};
    measureIds.forEach(function(mid) {
      var series = h.measureSeries[mid];
      var typesSeen = {};
      series.points.forEach(function(p) { typesSeen[p.assessment_type] = true; });
      var groupType = series.points[series.points.length - 1].assessment_type;
      if (!groups[groupType]) { groups[groupType] = []; groupOrder.push(groupType); groupLatestTime[groupType] = 0; }
      groups[groupType].push({ key: mid, series: series, spansMultiple: Object.keys(typesSeen).length > 1 });
      // 2026-09-23, at the school's request ("assessments sorted with the
      // most recent at the top"): each group's own most recent point (any
      // measure within it) decides where that whole assessment-world panel
      // sits among the others -- the assessment given most recently for
      // THIS student surfaces first, not whatever order Object.keys(
      // h.measureSeries) happened to return.
      var latestInSeries = new Date(series.points[series.points.length - 1].date).getTime();
      if (latestInSeries > groupLatestTime[groupType]) groupLatestTime[groupType] = latestInSeries;
    });
    groupOrder.sort(function(a, b) { return groupLatestTime[b] - groupLatestTime[a]; });

    groupOrder.forEach(function(type) {
      // Phase 32: the swatch (border) carries category identity; the label
      // text now stays in standard ink rather than the series color, so
      // legibility never depends on how a given hue happens to contrast
      // against the page -- "text wears text tokens, a colored mark beside
      // it carries identity," not the other way around.
      var color = ASSESSMENT_TYPE_COLORS[type] || 'var(--ink-soft)';
      growthBody += '<div style="border-left:4px solid ' + color + ';padding-left:14px;margin-bottom:20px">'
        + '<div style="font-weight:700;font-size:.78rem;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.04em;margin-bottom:10px">'
        + escapeHtml(ASSESSMENT_LABELS[type] || type) + '</div>';

      // 2026-09-23, at the school's request ("the composite and maze score
      // be at the top... the overall dibels score stand out... subsets
      // smaller or bulleted under the total score"): split into this
      // group's own main result(s) (GROWTH_MAIN_MEASURES_, above) vs.
      // everything else, main entries first and visually promoted, the
      // rest demoted to a compact bulleted list -- same underlying chart,
      // just sized and framed to say "this is the headline, these are the
      // supporting detail" instead of every measure competing equally.
      var mainKeys = GROWTH_MAIN_MEASURES_[type] || [];
      var mainEntries = [];
      var subEntries = [];
      groups[type].forEach(function(entry) {
        if (mainKeys.indexOf(entry.key) !== -1) mainEntries.push(entry); else subEntries.push(entry);
      });
      mainEntries.sort(function(a, b) { return mainKeys.indexOf(a.key) - mainKeys.indexOf(b.key); });

      mainEntries.forEach(function(entry) { growthBody += renderGrowthChartBlock_(entry.key, entry.series, entry.spansMultiple, 'main'); });
      if (subEntries.length) {
        growthBody += mainEntries.length
          ? '<div class="muted" style="font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.04em;margin:2px 0 8px">Sub-scores</div>'
          : '';
        growthBody += '<div style="display:flex;flex-direction:column;gap:2px">'
          + subEntries.map(function(entry) { return renderGrowthChartBlock_(entry.key, entry.series, entry.spansMultiple, 'sub'); }).join('')
          + '</div>';
      }
      growthBody += '</div>';
    });
  }
  html += renderCollapsibleCard_('profile.growth', 'Growth Over Time', growthBody, 'toggleProfileSection_');

  var historyBody = '';
  if (h.sessions.length === 0) {
    historyBody = '<div class="empty-state">No sessions yet.</div>';
  } else {
    var displaySessions = h.sessions.slice().reverse();
    var lastTransitionKey = null;
    displaySessions.forEach(function(sess) {
      var transitionKey = (sess.grade_at_admin || '') + '|' + (sess.school_year || '');
      if (transitionKey !== lastTransitionKey) {
        lastTransitionKey = transitionKey;
        if (sess.grade_at_admin || sess.school_year) {
          historyBody += '<div class="grade-divider">' + escapeHtml(['Grade ' + (sess.grade_at_admin || '—'), sess.school_year].filter(Boolean).join(' · ')) + '</div>';
        }
      }
      var summary = sess.summary || { strengths: [], concerns: [] };
      historyBody += '<div class="session-item">'
        + '<div class="session-head expandable" onclick="toggleSessionDetail_(\'' + sess.session_id + '\')"><div>'
