<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <script src="logic.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ELC Student Assessments</title>
  <style>
    :root {
      /* Phase 32 (Phase 6b review's color verdict, Option 2): the
         farmhouse/bakery palette (--butter/--cream/--brick/--leaf) is gone --
         navy is now the sole accent family, promoted from the header (where
         it was already correct) rather than replaced. --paper/--surface
         are the new page/card backgrounds: a cool neutral gray-blue instead
         of a warm gold, so the risk-tier badges (still their own protected
         green/yellow/red, untouched -- see the note above .badge below) are
         the only saturated color left competing for attention. */
      --paper: #EEF2F5;
      --surface: #FFFFFF;
      --navy: #4C7996;
      --navy-deep: #234C6A;
      --navy-deepest: #17324A;
      --navy-tint: #E6EEF3;
      --ink: #1E2D38;
      --ink-soft: #5C6B76;
      --line: #D7DEE3;
    }
    * , *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--paper); color: var(--ink); min-height: 100vh; }
    /* Phase 32 (finding: font swap): headings used to switch to Century
       Gothic/Futura, a second typeface with no other role in the app --
       one consistent family everywhere now. */
    h1, h2, h3, .heading-face { font-family: 'Segoe UI', system-ui, sans-serif; }

    header { background: var(--navy-deep); color: var(--surface); padding: 20px 28px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px; }
    header h1 { font-size: 1.4rem; font-weight: 800; }
    header .sub { font-size: .82rem; opacity: .8; }
    header nav { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
    /* Phase 31f (finding #22): daily-workflow actions (Roster, Flag a
       Concern, Flagged Concerns) and oversight/reporting actions
       (Benchmark Checkpoints, Dashboard, Summary) used to share identical
       styling with nothing separating them. A hairline divider plus a
       visibly quieter ("ghost") treatment for the oversight group signals
       both the grouping and the relative frequency of use -- daily actions
       stay bold, reporting screens recede slightly, same as the
       Admin Tools dropdown already stood apart on its own. Labels renamed
       Phase 42 -- see the naming-cleanup comment near the nav markup below. */
    .nav-group { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
    .nav-group-oversight { padding-left: 14px; border-left: 1px solid rgba(255,255,255,.3); }
    .nav-group-oversight button:not(.active) { background: transparent; border-color: rgba(255,255,255,.45); color: var(--navy-tint); }
    .nav-group-oversight button:not(.active):hover { background: rgba(255,255,255,.14); box-shadow: none; }
    header nav button { background: var(--surface); border: 1px solid var(--navy-deep); color: var(--navy-deep); padding: 9px 16px; border-radius: 8px; font-size: .85rem; font-weight: 700; cursor: pointer; min-height: 40px; transition: background-color .15s ease, transform .15s ease, box-shadow .15s ease; }
    header nav button:hover { background: #fff; transform: translateY(-1px); box-shadow: 0 2px 6px rgba(35,76,106,.2); }
    header nav button.active { background: var(--navy); border-color: var(--navy); color: #fff; }

    /* Phase 31b: "Administration" nav sub-menu -- groups Administrator-only
       screens under one dropdown instead of each getting its own top-level
       nav slot. Phase 37 (finding #8) added 3 more sub-screens to it. */
    .nav-dropdown { position: relative; }
    .nav-dropdown-menu { display: none; position: absolute; top: 100%; left: 0; margin-top: 6px; background: var(--surface); border: 1px solid var(--navy-deep); border-radius: 8px; padding: 6px; min-width: 170px; z-index: 20; box-shadow: 0 4px 14px rgba(35,76,106,.25); }
    .nav-dropdown-menu.open { display: block; }
    .nav-dropdown-menu button { display: block; width: 100%; text-align: left; background: none; border: none; border-radius: 6px; padding: 9px 12px; font-size: .85rem; font-weight: 700; color: var(--navy-deep); cursor: pointer; min-height: unset; }
    .nav-dropdown-menu button:hover { background: var(--navy-tint); }
    .nav-dropdown-menu button.active { background: var(--navy); color: #fff; }

    /* Dashboard opts into a wider reading column (toggled in updateNavActive_)
       so its grid of per-grade cards actually has room to lay out more than
       one column -- every other view keeps the original comfortable-reading
       width. */
    main { max-width: 880px; margin: 24px auto 60px; padding: 0 16px; transition: max-width .15s ease; }
    body.wide-view main { max-width: 1240px; }

    .card { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 20px 22px; margin-bottom: 16px; box-shadow: 0 2px 10px rgba(30,45,56,.07), 0 1px 2px rgba(30,45,56,.06); }
    .card h2 { font-size: 1.08rem; font-weight: 800; margin-bottom: 12px; }
    .muted { color: var(--ink-soft); font-size: .85rem; }

    .dashboard-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 16px; align-items: start; }
    .dashboard-grid > .card { margin-bottom: 0; }

    .row-icon { display: inline-flex; vertical-align: middle; flex: none; }
    .expand-chevron svg { transition: transform .15s ease; }
    .expand-chevron.rotated svg { transform: rotate(180deg); }

    input[type=text], input[type=number], input[type=date], select, textarea {
      width: 100%; padding: 9px 12px; border: 1px solid var(--line); border-radius: 6px; font-size: .9rem; color: var(--ink); font-family: inherit; background: #fff;
    }
    input:focus, select:focus, textarea:focus { outline: none; border-color: var(--navy-deep); }
    label { font-size: .8rem; font-weight: 700; color: var(--ink-soft); display: block; margin-bottom: 5px; }
    .field { margin-bottom: 12px; }
    .field-row { display: flex; gap: 12px; flex-wrap: wrap; }
    .field-row .field { flex: 1; min-width: 160px; }
    .field-error-msg { color: #b91c1c; font-size: .78rem; margin-top: 4px; }
    .field-invalid { border-color: #b91c1c !important; }

    button.btn { padding: 10px 20px; border-radius: 8px; font-size: .9rem; font-weight: 700; cursor: pointer; border: 1px solid transparent; transition: background-color .15s ease, border-color .15s ease, transform .15s ease, box-shadow .15s ease; }
    .btn-primary { background: var(--navy-deep); border-color: var(--navy-deep); color: white; box-shadow: 0 1px 0 rgba(0,0,0,.12) inset, 0 2px 5px rgba(35,76,106,.35); }
    .btn-primary:hover { background: var(--navy-deepest); border-color: var(--navy-deepest); transform: translateY(-1px); box-shadow: 0 1px 0 rgba(0,0,0,.12) inset, 0 4px 10px rgba(35,76,106,.4); }
    .btn-primary:active { transform: translateY(0); }
    .btn-primary:disabled { opacity: .4; cursor: not-allowed; transform: none; box-shadow: none; }
    /* 2026-09-14: a plain white fill + 1px border read as flat/plain-text
       rather than clickable, especially sitting alone on an already-white
       card with nothing else nearby for contrast -- Phase 41 patched one
       button with a one-off resting tint (background:var(--paper)) rather
       than fixing the base style, and the same complaint came back for
       "many" others. Baked that tint in here instead, plus a slightly
       heavier border and a permanent soft shadow (matching .btn-primary
       always having SOME shadow at rest, not just on hover) so every
       secondary button reads as pressable without a per-button override. */
    .btn-secondary { background: var(--paper); border: 1.5px solid var(--ink-soft); color: var(--ink); box-shadow: 0 1px 3px rgba(30,45,56,.1); }
    .btn-secondary:hover { background: var(--navy-tint); border-color: var(--navy-deep); transform: translateY(-1px); box-shadow: 0 3px 8px rgba(30,45,56,.16); }
    .btn-secondary:active { transform: translateY(0); }
    .btn-secondary:disabled { opacity: .45; cursor: not-allowed; transform: none; box-shadow: none; }
    .btn-small { padding: 8px 14px; font-size: .78rem; min-height: 38px; }

    .search-row { display: flex; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
    .search-row input { flex: 1; min-width: 160px; }

    .student-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; padding: 12px 14px; border-radius: 8px; border: 1px solid var(--line); margin-bottom: 8px; cursor: pointer; transition: border-color .15s ease, background-color .15s ease, transform .15s ease, box-shadow .15s ease; background: #fff; }
    .student-row:hover { border-color: var(--navy-deep); background: var(--navy-tint); transform: translateY(-1px); box-shadow: 0 3px 10px rgba(30,45,56,.1); }
    .student-name { font-weight: 700; font-size: .95rem; }
    .student-meta { font-size: .78rem; color: var(--ink-soft); }
    .tag { display: inline-block; font-size: .68rem; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; padding: 3px 8px; border-radius: 6px; margin-left: 6px; }
    .tag-facts { background: var(--navy-tint); color: var(--navy-deep); }
    /* Phase 30d (Phase 6b review finding): was near-identical amber to
       .badge-strategic/.badge-yellow below, so a "Manual" roster-source tag
       (purely informational) could be misread at a glance as a Strategic
       risk-tier flag. Risk-tier badge colors are protected (see the comment
       above them) -- this tag just needed to move OFF that palette entirely,
       to a neutral gray with no clinical meaning anywhere else in the app. */
    .tag-manual { background: #E5E7EB; color: #374151; }
    /* Same neutral gray as .tag-manual, reused under its own name for
       informational tags that aren't about roster source (e.g. a
       deactivation reason on the admin-only Deactivated Students list). */
    .tag-neutral { background: #E5E7EB; color: #374151; }

    /* Risk-tier badges keep their established colors -- these are read at a
       glance for clinical meaning, so only their shape (bolder outline,
       fully rounded) changes, never the color a tier maps to. badge-info is
       new (Phase 19): a genuinely calm/informational status ("not due yet")
       is now visually distinct from badge-neutral's "nothing to report"
       gray-tan, giving --navy an actual functional home instead of sitting
       almost unused in :root. */
    .badge { display: inline-flex; align-items: center; gap: 5px; font-size: .78rem; font-weight: 700; padding: 4px 11px; border-radius: 8px; border: 1px solid transparent; margin: 3px 4px 3px 0; }
    .badge-mastery, .badge-blue, .badge-green { background: #dcfce7; color: #15803d; border-color: #86efac; }
    .badge-strategic, .badge-yellow { background: #fef9c3; color: #a16207; border-color: #fde68a; }
    .badge-intensive, .badge-red { background: #fee2e2; color: #b91c1c; border-color: #fca5a5; }
    .badge-neutral { background: var(--paper); color: var(--ink-soft); border-color: var(--line); }
    .badge-ok { background: #ccfbf1; color: #0f766e; border-color: #99f6e4; }
    .badge-info { background: var(--navy-tint); color: var(--navy-deep); border-color: var(--navy); }


    .faq-item { border-bottom: 1px solid var(--line); padding: 12px 0; }
    .faq-item:last-child { border-bottom: none; }
    .faq-q { font-weight: 700; margin-bottom: 4px; }
    .glossary-term { font-weight: 700; }

    .assessment-type-card { border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; margin-bottom: 10px; cursor: pointer; background: #fff; position: relative; transition: border-color .15s ease, background-color .15s ease, transform .15s ease, box-shadow .15s ease; }
    .assessment-type-card:hover { border-color: var(--navy-deep); transform: translateY(-1px); box-shadow: 0 3px 10px rgba(30,45,56,.1); }
    .assessment-type-card.selected { border-color: var(--navy-deep); background: var(--navy-tint); padding-right: 40px; }
    .assessment-type-card.selected::after { content: '✓'; position: absolute; top: 14px; right: 16px; color: var(--navy-deep); font-weight: 800; font-size: 1.1rem; }
    .assessment-type-card .name { font-weight: 700; font-size: .95rem; }
    .assessment-type-card .desc { font-size: .82rem; color: var(--ink-soft); margin-top: 2px; }

    details.part-block { border: 1px solid var(--line); border-radius: 8px; margin-bottom: 8px; padding: 8px 12px; background: #fff; }
    details.part-block summary { cursor: pointer; font-weight: 700; font-size: .88rem; padding: 4px 0; display: flex; justify-content: space-between; }
    .word-grid { display: flex; flex-wrap: wrap; gap: 9px; margin-top: 8px; }
    .word-chip { border: 1px solid var(--line); border-radius: 6px; padding: 10px 14px; min-height: 40px; display: flex; align-items: center; font-size: .85rem; cursor: pointer; background: var(--paper); user-select: none; transition: background-color .15s ease, border-color .15s ease, box-shadow .15s ease, transform .1s ease; }
    .word-chip:active { transform: scale(.96); }
    /* Subtle, not the loud "mastery" green -- this now marks any chip the
       teacher has explicitly confirmed correct (tapped, possibly more than
       once), distinct from a chip that's correct only by un-touched default. */
    .word-chip.correct { background: #f0fdf4; border-color: #86efac; color: #166534; }
    .word-chip.incorrect { background: #fee2e2; border-color: #ef4444; color: #b91c1c; font-weight: 700; text-decoration: line-through; }
    /* Position anchor: whichever chip was tapped most recently, regardless of
       correct/incorrect, so a teacher who looks away mid-row has one clear
       "that's where I left off" cue instead of having to recount. */
    .word-chip.last-tapped { box-shadow: 0 0 0 3px var(--navy); }
    .word-chip-disabled { border: 1px dashed var(--line); border-radius: 6px; padding: 10px 14px; min-height: 40px; display: flex; align-items: center; font-size: .85rem; background: var(--line); color: var(--ink-soft); user-select: none; }
    .part-score { font-size: .78rem; color: var(--ink-soft); }
    .admin-group { margin-bottom: 10px; }
    .admin-group-label { font-size: .78rem; font-weight: 700; color: var(--ink-soft); margin-bottom: 4px; }
    .stop-marker-label { display: flex; align-items: center; gap: 6px; font-size: .8rem; font-weight: 600; color: #b91c1c; margin: 4px 0 10px; cursor: pointer; }

    .measure-row { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
    .measure-row label.check-label { display: flex; align-items: center; gap: 8px; flex: 1; min-width: 160px; font-weight: 600; font-size: .85rem; color: var(--ink); margin: 0; }
    .measure-row input[type=number] { width: 110px; }

    /* Shared button-group wrapper (Phase 18) -- flex+gap instead of joining
       buttons with a bare literal space, so a pair that wraps on a narrow
       screen still gets real vertical separation instead of sitting flush
       against whatever wrapped above it (same bug class as Phase 14a). */
    .btn-row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }

    /* Shared destructive-action color (Phase 18) -- previously hand-rolled
       inline at 6 separate call sites (Revoke, Remove Student, Delete
       Session, both modal confirms). */
    .btn-danger { border-color: #ef4444 !important; color: #b91c1c !important; }
    .btn-danger.btn-primary { background: #ef4444 !important; color: #fff !important; }

    table.trend-table { width: 100%; border-collapse: collapse; font-size: .82rem; }
    table.trend-table th, table.trend-table td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); }

    /* 2026-09-24, at the school's request ("spacing needs to be a bit
       better"): the multi-skill Compare table (renderSummaryCombinedResults_)
       packs 2 columns (Score + Status) per skill, up to 3 skills wide --
       .trend-table's normal 6px/8px padding reads as cramped at that width.
       Roomier padding plus a divider before each new skill's Score column
       (skipped for the first skill, which already has the Student/Grade
       columns as its left edge) makes each skill's pair of columns read as
       one visual group instead of one undifferentiated grid. */
    table.compare-multi-table th, table.compare-multi-table td { padding: 10px 14px; }
    table.compare-multi-table th.skill-group-start, table.compare-multi-table td.skill-group-start { border-left: 2px solid var(--line); }

    table.preview-table { width: 100%; border-collapse: collapse; font-size: .8rem; margin-top: 8px; display: block; overflow-x: auto; }
    table.preview-table th, table.preview-table td { text-align: left; padding: 5px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
    table.preview-table th { color: var(--ink-soft); font-weight: 700; }
    /* Phase 32: this row highlights an INVALID import row -- that's an error
       state, not a brand accent, so it now reuses the same red already
       established for destructive actions/field errors (.field-error-msg,
       .btn-danger) instead of the old warm brick tint. */
    table.preview-table tr.preview-row-invalid td { color: #b91c1c; background: #fef2f2; }

    .sparkline { position: relative; display: flex; align-items: flex-end; gap: 3px; height: 48px; margin-top: 6px; overflow-x: auto; padding-bottom: 2px; }
    .sparkline-caption { font-size: .74rem; color: var(--ink-soft); margin-top: 4px; }

    /* Non-color texture overlays for the Dashboard trend strip's stacked
       segments -- print/grayscale and colorblind-safe, so risk level reads
       from pattern, not just hue. Kept as subtle white overlays on top of
       the existing bucket color rather than replacing it. */
    .bucket-pattern-at_risk { background-image: repeating-linear-gradient(45deg, rgba(255,255,255,.4) 0 2px, transparent 2px 5px), repeating-linear-gradient(-45deg, rgba(255,255,255,.4) 0 2px, transparent 2px 5px); }
    .bucket-pattern-some_risk { background-image: repeating-linear-gradient(45deg, rgba(255,255,255,.4) 0 3px, transparent 3px 7px); }
    .bucket-pattern-on_track { background-image: radial-gradient(rgba(255,255,255,.55) 1px, transparent 1.2px); background-size: 6px 6px; }
    .bucket-pattern-not_assessed { background-image: repeating-linear-gradient(90deg, rgba(255,255,255,.45) 0 2px, transparent 2px 6px); }

    /* Phase 31g: collapsible section pattern (Option B from the Dashboard
       restructure review) -- every section starts expanded so nothing is
       hidden the first time a principal sees it, but each remembers its own
       collapsed/expanded state across re-renders (state.sectionExpanded,
       keyed per section). Reused as-is for the Profile's Growth Over Time /
       Assessment History sections (Phase 31h -- "the same collapsible
       treatment"). */
    .accordion-head { display: flex; align-items: center; justify-content: space-between; cursor: pointer; margin: 0 0 4px; }
    .accordion-head .chev { transition: transform .15s ease; color: var(--navy-deep); font-size: 1.1rem; flex-shrink: 0; }
    .card.collapsed .accordion-head .chev { transform: rotate(-90deg); }
    .card.collapsed .accordion-body { display: none; }

    /* Phase 31g addendum: the Year-over-Year table used to stack 4 lines of
       "Label: N (▲delta)" plain text per cell -- unreadable at the grade
       card's ~220px width (wrapped mid-word, forced constant horizontal
       scrolling). Compact colored chips (same bucket-pattern-* texture as
       the trend strip, so risk level still reads without relying on color
       alone) fit all 4 buckets in one row per cell. */
    table.yoy-table th, table.yoy-table td { white-space: nowrap; }
    .yoy-chip-row { display: flex; gap: 3px; flex-wrap: wrap; }
    /* Real find, 2026-09-27 (independent code review + administrator report,
       "design & spacing"): .68rem was the smallest text in the whole app,
       and it's real per-bucket student-count data, not filler -- bumped to
       .74rem with a slightly wider min-width. Still comfortably fits all 4
       chips in one row at this card's ~220px width (the constraint the
       Phase 31g addendum above was solving for), with .yoy-chip-row's own
       flex-wrap as a safety net if it ever doesn't. */
    .yoy-chip { display: inline-flex; align-items: center; justify-content: center; min-width: 30px; padding: 2px 5px; border-radius: 5px; font-size: .74rem; font-weight: 700; color: #fff; text-shadow: 0 1px 1px rgba(0,0,0,.3); }

    /* Navy-tinted info panel (Phase 19, recolored Phase 22) -- gives --navy a
       real functional home instead of sitting almost unused in :root; also
       visually separates the legend as reference material rather than
       another inline text line. */
    .chart-shape-legend { display: flex; flex-wrap: wrap; gap: 12px; font-size: .74rem; color: var(--navy-deep); margin-bottom: 14px; background: var(--navy-tint); border-radius: 8px; padding: 10px 14px; }
    .chart-shape-legend span { display: inline-flex; align-items: center; gap: 4px; }
    .chart-shape-legend svg { flex: none; }

    .grade-divider { display: flex; align-items: center; gap: 10px; margin: 14px 0 8px; font-size: .78rem; font-weight: 700; color: var(--navy-deep); text-transform: uppercase; letter-spacing: .04em; }
    .grade-divider::before, .grade-divider::after { content: ''; flex: 1; border-top: 1px solid var(--line); }

    .dashboard-cell { border: 1px solid var(--line); border-radius: 8px; padding: 10px 14px; cursor: pointer; text-align: center; min-width: 90px; background: #fff; transition: background-color .15s ease, transform .15s ease, box-shadow .15s ease; }
    .dashboard-cell:hover { background: var(--navy-tint); transform: translateY(-1px); box-shadow: 0 3px 10px rgba(30,45,56,.1); }

    .session-item { border: 1px solid var(--line); border-radius: 8px; padding: 12px 16px; margin-bottom: 8px; background: #fff; }
    .session-item .session-head { display: flex; justify-content: space-between; align-items: center; }
    .session-item .session-head.expandable { cursor: pointer; }
    .session-item .session-title { font-weight: 700; font-size: .9rem; }
    .session-item .session-meta { font-size: .78rem; color: var(--ink-soft); }
    .session-detail { margin-top: 10px; border-top: 1px solid var(--line); padding-top: 10px; display: none; overflow-x: auto; }
    .session-detail.visible { display: block; }
    .session-detail table { width: 100%; border-collapse: collapse; font-size: .82rem; }
    .session-detail td { padding: 4px 6px; border-bottom: 1px solid var(--line); }
    .expand-chevron { font-size: .75rem; color: var(--ink-soft); }

    .empty-state { text-align: center; padding: 30px; color: var(--ink-soft); font-size: .9rem; }
    .steps { display: flex; gap: 8px; margin-bottom: 16px; }
    .step-dot { flex: 1; height: 6px; border-radius: 3px; background: var(--line); }
    .step-dot.active { background: var(--navy-deep); }
    .step-dot.done { background: var(--navy); }

    /* Toast/modal (Phase 19): switched from a hard display:none/block toggle
       to opacity+transform+visibility so showing/hiding actually animates.
       visibility's transition-delay only applies on the way OUT (the
       .visible rule has no delay, so appearing is instant-opacity-start,
       while disappearing waits for the fade to finish before it stops
       accepting layout/hit-testing). */
    #toast { position: fixed; bottom: 20px; left: 50%; background: var(--ink); color: white; padding: 10px 20px; border-radius: 8px; font-size: .85rem; z-index: 200; opacity: 0; visibility: hidden; transform: translate(-50%, 8px); transition: opacity .2s ease, transform .2s ease, visibility 0s linear .2s; }
    #toast.visible { opacity: 1; visibility: visible; transform: translate(-50%, 0); transition: opacity .2s ease, transform .2s ease; }

    #modal-overlay { display: flex; position: fixed; inset: 0; background: rgba(30,45,56,.45); z-index: 150; align-items: center; justify-content: center; padding: 16px; opacity: 0; visibility: hidden; pointer-events: none; transition: opacity .2s ease, visibility 0s linear .2s; }
    #modal-overlay.visible { opacity: 1; visibility: visible; pointer-events: auto; transition: opacity .2s ease; }
    .modal-card { max-width: 420px; width: 100%; box-shadow: 0 10px 40px rgba(30,45,56,.3); transform: scale(.95); transition: transform .2s ease; }
    #modal-overlay.visible .modal-card { transform: scale(1); }
    .modal-card h3 { margin-bottom: 10px; }
    .modal-card p { font-size: .88rem; color: var(--ink-soft); margin-bottom: 18px; line-height: 1.45; }
    .modal-actions { display: flex; gap: 10px; justify-content: flex-end; }

    /* Print-friendly single-student report (Phase 13b) -- kept in a
       dedicated, normally-hidden container rather than printing the live
       app, since the SPA view has nav chrome, buttons, and interactive
       controls that don't belong on a page handed to a parent or brought to
       an IEP meeting. print-color-adjust keeps the badge backgrounds
       (tier colors) visible even though most browsers skip background
       colors when printing by default.

       Phase 37 (finding #40): this used to jump straight to window.print()
       with no way to see the page first or back out. #print-report now has
       a real on-screen visible state (.preview-visible) -- a full-screen
       overlay with Print/Back actions -- BEFORE the browser's own print
       dialog ever opens. Print output styling is unaffected: a paper page
       is white regardless of the app's own light/dark theme, so the
       preview intentionally always renders on a plain white background,
       same as the eventual printed page. */
    #print-report { display: none; }
    #print-report.preview-visible {
      display: block; position: fixed; inset: 0; z-index: 80;
      background: #fff; color: #000; overflow-y: auto; padding: 28px;
    }
    /* Real find (2026-09-22, at the school's request -- "needs to be more
       visually appealing... scrunched up"): these rules used to live ONLY
       inside @media print, so the on-screen preview (what's actually shown
       before anyone clicks Print) had none of them -- bare, unstyled
       headings and zero table-cell padding, the literal cramped look being
       reported. Moved out here so the preview and the real printed page
       match, with generous section spacing (a ruled line under each h2,
       like a real report's section breaks), roomier table cells, and
       alternating row shading for scanability. Only what genuinely differs
       between screen and paper (exact position, forced color rendering)
       stays inside @media print below. */
    #print-report h1 { font-size: 18pt; margin: 0 0 4px; }
    #print-report h2 { font-size: 13pt; margin: 28px 0 10px; padding-bottom: 5px; border-bottom: 1.5px solid #ccc; }
    #print-report h2:first-of-type { margin-top: 20px; }
    #print-report p { margin: 0 0 10px; line-height: 1.55; }
    #print-report ul { margin: 0 0 16px; padding-left: 20px; }
    #print-report li { margin-bottom: 4px; line-height: 1.5; }
    #print-report table { width: 100%; border-collapse: collapse; margin: 6px 0 22px; font-size: .95em; }
    #print-report th, #print-report td { border: 1px solid #ccc; padding: 7px 10px; text-align: left; }
    #print-report th { background: #f3f4f6; font-weight: 700; }
    #print-report tbody tr:nth-child(even) { background: #fafbfc; }
    .print-preview-actions { display: flex; gap: 10px; margin-bottom: 20px; }
    @media print {
      header, #app, #toast, #modal-overlay, .print-preview-actions { display: none !important; }
      #print-report, #print-report.preview-visible { display: block !important; position: static; font-size: 11pt; color: #000; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
      #print-report tbody tr:nth-child(even) { background: #fafbfc !important; }
      #print-report th { background: #f3f4f6 !important; }
    }

<script>
// ── API helpers (wrap google.script.run in Promises) ────────
function call(fn) {
  var args = Array.prototype.slice.call(arguments, 1);
  return new Promise(function(resolve, reject) {
    google.script.run
      .withSuccessHandler(resolve)
      .withFailureHandler(function(err) { reject(err); })
      [fn].apply(null, args);
  });
}

function toast(msg) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('visible');
  setTimeout(function() { t.classList.remove('visible'); }, 2600);
}

// ── App state ────────────────────────────────────────────────
var state = {
  view: 'roster',
  // Guards the init sequence's auto-navigate-to-landing-view below: if a
  // user clicks a nav button while getMyAccess() is still in flight (a slow
  // Apps Script cold start makes this common), that click's own
  // updateNavActive_() call flips this to false first, so the init callback
  // backs off instead of yanking them back to Dashboard/Roster mid-load.
  landingViewPending: true,
  roster: [],
  rosterFilter: '',
  rosterLastNameMatches: null,
  // Phase 31g/31h: collapsed/expanded state for the collapsible sections
  // introduced on the Dashboard and Student Profile, keyed by section name
  // (e.g. 'dashboard.headline', 'profile.growth'). Missing key == expanded
  // (see toggleSection_/renderCollapsibleCard_) -- every section starts
  // open the first time, only collapsing once a user explicitly closes it.
  sectionExpanded: {},
  currentStudent: null,
  currentHistory: null,
  currentStudentRequests: [],
  currentIepGoals: [],
  iepGoalAreas: null,
  iepGoalYearFilter: undefined, // set to the current school year on first render of the section; '' means "all years"
  currentAccommodations: [],
  accommodationChecklist: null,
  pendingRequests: null,
  requestsMineFilter: false,
  assessmentTypes: null,
  corePhonicsParts: null,
  corePhonicsAvailability: null,
  dibelsMeasures: null,
  grlLetters: null,
  administratorRoles: null,
  newAssessment: null, // { type, fulfilling_request_id, common: {administration_date, grade_at_admin, school_year, season, notes, administrator_role}, input: {...} }
  assessmentStatusForm: null,
  assessmentStatusReport: null,
  dashboard: null,
  compliance: null,
  complianceExpanded: {},
  complianceRole: '',
  complianceSchoolYear: '', // Phase 27: '' means "current school year" (the server's own default)
  dashboardGradeFilter: '',
  summaryForm: null,
  summaryReport: null,
  summaryQuickFilter: '', // Phase 28: '' = show every measure; otherwise one of SUMMARY_QUICK_FILTERS' keys
  schoolwideSkillRanking: null, // report_mode 'ranking' -- see renderSchoolwideSkillRanking_'s own comment
  staffAccessList: null,
  deactivationReasons: null,
  concernAreas: null
};

var TIER_LABEL_TO_CLASS = {
  Mastery: 'mastery', Strategic: 'strategic', Intensive: 'intensive',
  Blue: 'blue', Green: 'green', Yellow: 'yellow', Red: 'red'
};

function tierBadge(tier) {
  if (!tier) return '<span class="badge badge-neutral">Not tiered</span>';
  var cls = TIER_LABEL_TO_CLASS[tier] || 'neutral';
  return '<span class="badge badge-' + cls + '">' + tier + '</span>';
}

// Phase 25d (Phase 6a review finding #12): the Concerns list on a student's
// profile printed a raw tier name ("Strategic", "Intensive") with no
// plain-language gloss, even though this exact good/caution/risk grouping
// already exists a few lines away as TIER_STATUS_BUCKET_ (used to pick
// growth-chart marker shapes) -- reused here instead of a second parallel
// mapping. Two tier VOCABULARIES (DIBELS' Blue/Green/Yellow/Red and
// Mastery/Strategic/Intensive) both collapse to the same 3 plain terms.
var STATUS_BUCKET_PLAIN_LANGUAGE_ = { good: 'On Track', caution: 'Some Risk', risk: 'At Risk' };
function tierPlainLanguage_(tier) {
  var bucket = TIER_STATUS_BUCKET_[tier];
  return bucket ? STATUS_BUCKET_PLAIN_LANGUAGE_[bucket] : '';
}

// A null benchmark_tier means two very different things: (1) the score is
// fine -- above the risk cutoffs, nothing to flag -- or (2) this measure/
// grade/season genuinely has no published benchmark at all. Both used to
// render as the same gray "Not tiered" badge. benchmark_reference (present
// whenever a real cutoff exists for this point, even if the tier itself is
// null) is what tells these two cases apart.
/**
 * Phase 25k: distinguishes "Not Yet Assessed" students who are actually
 * overdue against a Compliance checkpoint from those it's simply too
 * early to have tested yet -- see notAssessedComplianceStatus_
 * (Dashboard.gs). No badge at all for 'not_tracked' (not ELC-eligible, or
 * their grade has no recurring benchmarking requirement) -- that's the
 * common case for non-ELC students in this bucket and isn't part of the
 * overdue-vs-early question this exists to answer.
 */
function notAssessedComplianceBadge_(s) {
  if (s.compliance_status === 'overdue') return ' <span class="badge badge-red" style="margin-left:4px">Overdue</span>';
  if (s.compliance_status === 'not_due_yet') return ' <span class="badge badge-neutral" style="margin-left:4px">Not due yet</span>';
  return '';
}

/**
 * Phase 29e (Phase 6b review finding), reworked in Phase 37 (finding #17):
 * a risk bucket used to stay frozen at whatever tier was last recorded,
 * however long ago -- "on track" could silently mean "was on track once, a
 * year (or more) ago" with no reassessment since. bucketAsOf_ (Dashboard.gs)
 * now excludes prior-school-year tiers from the bucket calculation entirely,
 * so a student in this situation lands in "not_assessed" instead -- this
 * badge (only ever set there, via entry.last_assessed_school_year) is what
 * tells a principal that's a "needs retesting" case, not a "never tested"
 * one.
 */
function staleAssessmentBadge_(s) {
  if (!s.last_assessed_school_year) return '';
  var title = 'Last assessed in the ' + s.last_assessed_school_year + ' school year';
  return ' <span class="badge badge-yellow" style="margin-left:4px" title="' + escapeHtml(title) + '">Needs Retesting</span>';
}

// A null raw_score means this measure was never actually scored (e.g. a
// DIBELS Composite placeholder created purely to explain, at entry time,
// that not enough measures were entered to auto-calculate it -- see
// Registry.gs's dibels.score and the fix in Code.gs's submitSession, real
// find 2026-09-17, Rowan Calloway case). Before this was checked here, such
// a point fell through to the benchmark_reference check below and showed
// "Meeting expectations" -- backwards, since a missing score is neither
// good nor bad, just absent. submitSession no longer even writes a result
// row for an unscored measure, but this check stays as a display-side
// safety net for any point that still has a null raw_score for some other
// reason.
function measureStatusBadge_(point) {
  if (point.benchmark_tier) return tierBadge(point.benchmark_tier);
  if (point.raw_score === null || point.raw_score === undefined || point.raw_score === '') {
    return '<span class="badge badge-neutral">Not scored</span>';
  }
  // Real find (2026-09-22): a DIBELS score below even the worst (Red) band
  // has benchmark_tier: null too, same as a genuinely unbenchmarked
  // grade/season -- but it's the single worst possible result, not an
  // absence of data. Checked before benchmark_reference/"Not benchmarked"
  // so it reads as urgent (red), not neutral gray. See
  // isBelowLowestDibelsBand_ (Registry.gs).
  if (point.below_benchmark_floor) {
    return '<span class="badge badge-red">Below Lowest Benchmark</span>';
  }
  if (point.benchmark_reference !== null && point.benchmark_reference !== undefined) {
    return '<span class="badge badge-ok">Meeting expectations</span>';
  }
  return '<span class="badge badge-neutral">Not benchmarked</span>';
}

function pointStatusText_(point) {
  if (point.benchmark_tier) return point.benchmark_tier;
  if (point.raw_score === null || point.raw_score === undefined || point.raw_score === '') return 'not scored';
  if (point.below_benchmark_floor) return 'below lowest benchmark';
  if (point.benchmark_reference !== null && point.benchmark_reference !== undefined) return 'meeting expectations';
  return 'not benchmarked';
}

// Friendly display labels for measure_ids/series keys, since Assessment_Results
// only ever stores the raw internal id (e.g. "part_a", "orf_wcpm") -- falls
// back to a title-cased version of the id itself for anything not listed
// (e.g. "iowa_reading" -> "Iowa Reading"), rather than showing snake_case.
var MEASURE_DISPLAY_LABELS = {
  letter_names_and_sounds: 'Alphabet Skills & Letter Sounds (combined)',
  part_a: 'CORE Part A — Letter names (uppercase)',
  part_b: 'CORE Part B — Letter names (lowercase)',
  part_c: 'CORE Part C — Consonant sounds',
  part_d_long: 'CORE Part D — Long vowel sounds',
  part_d_short: 'CORE Part D — Short vowel sounds',
  part_e: 'CORE Part E — Short vowels in CVC words',
  part_f: 'CORE Part F — Consonant blends',
  part_g: 'CORE Part G — Digraphs & -tch',
  part_h: 'CORE Part H — R-controlled vowels',
  part_i: 'CORE Part I — Long vowel spellings',
  part_j: 'CORE Part J — Variant vowels',
  part_k: 'CORE Part K — Low-frequency spellings',
  part_l: 'CORE Part L — Multisyllabic words',
  lnf: 'Letter Naming Fluency',
  psf: 'Phonemic Segmentation Fluency',
  nwf_cls: 'Nonsense Word Fluency (Correct Letter Sounds)',
  nwf_wrc: 'Nonsense Word Fluency (Words Recoded)',
  wrf: 'Word Reading Fluency',
  orf_words: 'Oral Reading Fluency — Words Correct (DIBELS)',
  orf_accuracy: 'Oral Reading Fluency — Accuracy',
  maze: 'Maze',
  composite: 'DIBELS Composite Score',
  lexile_score: 'Lexile Score',
  dra_level: 'DRA Level',
  orf_wcpm: 'Oral Reading Fluency (Hasbrouck & Tindal WCPM)',
  oral_reading_fluency: 'Oral Reading Fluency (words correct/min)',
  phoneme_segmenting: 'easyCBM Phoneme Segmenting',
  letter_names: 'easyCBM Letter Names',
  letter_sounds: 'easyCBM Letter Sounds',
  word_reading_fluency: 'easyCBM Word Reading Fluency',
  passage_reading_fluency: 'easyCBM Passage Reading Fluency',
  proficient_reading: 'easyCBM Proficient Reading',
  vocabulary: 'easyCBM Vocabulary',
  basic_reading: 'easyCBM Basic Reading',
  basic_math_benchmark: 'easyCBM Basic Math Benchmark',
  proficient_math_benchmark: 'easyCBM Proficient Math Benchmark'
};

function measureLabel_(id) {
  if (MEASURE_DISPLAY_LABELS[id]) return MEASURE_DISPLAY_LABELS[id];
  return String(id).replace(/_/g, ' ').replace(/\b\w/g, function(c) { return c.toUpperCase(); });
}

// Client-side copy of Dra.gs's DRA_GRL_TABLE grade-anchor column (2026-09-26,
// at the school's request: "show what that letter means... correspond it to
// a grade level, beginning 1st, middle 2nd, etc."). Not the GRL LETTERS
// themselves (those are lazy-loaded via getGrlLetters for the entry form
// only) -- this is the reverse, always-available-synchronously lookup
// DISPLAY needs, since a DRA score can show up in a growth chart, a Summary/
// Compare report, or a print report without any of those screens having
// gone through the entry form's lazy-load first. Keep in sync with Dra.gs's
// DRA_GRL_TABLE if that source chart is ever revised.
var DRA_GRADE_CONTEXT_TABLE_ = [
  { dra: 1, grade: 'Kindergarten' }, { dra: 2, grade: 'Kindergarten' }, { dra: 3, grade: 'Kindergarten / 1st Grade' },
  { dra: 4, grade: '1st Grade' }, { dra: 5, grade: '1st Grade' }, { dra: 6, grade: '1st Grade' },
  { dra: 8, grade: '1st Grade' }, { dra: 10, grade: '1st Grade' }, { dra: 12, grade: '1st Grade' },
  { dra: 14, grade: '1st Grade' }, { dra: 16, grade: '1st Grade' },
  { dra: 18, grade: '2nd Grade' }, { dra: 20, grade: '2nd Grade' }, { dra: 24, grade: '2nd Grade' }, { dra: 28, grade: '2nd Grade' },
  { dra: 30, grade: '3rd Grade (Beginning)' }, { dra: 34, grade: '3rd Grade (Middle)' }, { dra: 38, grade: '3rd Grade (End)' },
  { dra: 40, grade: '4th Grade' }, { dra: 50, grade: '5th Grade' }, { dra: 60, grade: '6th Grade' },
  { dra: 70, grade: '7th Grade' }, { dra: 80, grade: '8th Grade' }
];

/** Nearest published DRA grade-context AT OR BELOW this level (same reverse-lookup direction as Dra.gs's own lookupDra) -- '' if below the lowest published level (1) or not a number. */
function draGradeContextForLevel_(draLevel) {
  var n = Number(draLevel);
  if (isNaN(n)) return '';
  var match = null;
  for (var i = 0; i < DRA_GRADE_CONTEXT_TABLE_.length; i++) {
    if (DRA_GRADE_CONTEXT_TABLE_[i].dra <= n) match = DRA_GRADE_CONTEXT_TABLE_[i];
    else break;
  }
  return match ? match.grade : '';
}

/**
 * Plain-text score display for one measure point. Caller escapes for its
 * own context (HTML table cell vs SVG <text>).
 *
 * For a DRA Level specifically (2026-09-26, at the school's request --
 * "what letter was chosen... isn't the letter supposed to correlate with a
 * grade and time of year? what does 2 mean"): raw_score is always the
 * DERIVED DRA NUMBER (see Registry.gs's dra.score), meaningless on its own
 * to someone who thinks in Guided Reading Level LETTERS. itemDetail (the
 * actual letter typed, persisted since the 2026-09-18 fix -- see
 * renderDraScoreEditFields_'s own comment for the honest gap on older
 * sessions) is shown when available, e.g. "Guided Reading Level B (DRA 2,
 * Kindergarten)"; falls back to "2 (Kindergarten)" for a session that
 * predates that fix, still better than a bare unexplained number.
 */
function formatScoreText_(measureKey, rawScore, maxScore, itemDetail) {
  if (measureKey === 'dra_level') {
    var ctx = draGradeContextForLevel_(rawScore);
    if (itemDetail) return 'Guided Reading Level ' + itemDetail + ' (DRA ' + rawScore + (ctx ? ', ' + ctx : '') + ')';
    return String(rawScore) + (ctx ? ' (' + ctx + ')' : '');
  }
  return String(rawScore) + (maxScore ? ' / ' + maxScore : '');
}

/** Compact identifier for a "Needs Retesting" tag (e.g. "LNF", "NWF CLS") -- at the school's request, so an overdue skill is recognizable at a glance without reading the full measure name. */
function measureAbbreviation_(id) {
  return String(id).toUpperCase().replace(/_/g, ' ');
}

// Bar/dot color for one growth-chart point: real tier color when a tier was
// assigned, a distinct teal when the score is fine but untiered (see
// measureStatusBadge_ above), or neutral gray when there's truly no
// benchmark to compare against.
function pointColor_(point) {
  if (point.benchmark_tier) return tierColor_(point.benchmark_tier);
  if (point.below_benchmark_floor) return tierColor_('Red');
  if (point.benchmark_reference !== null && point.benchmark_reference !== undefined) return '#14b8a6';
  return '#A8916B';
}

// Groups every tier label into one of 3 status buckets (mirrors
// CONCERN_TIERS/STRENGTH_TIERS' worst-tier-wins grouping, Registry.gs) --
// used to pick a marker SHAPE per point (Phase 13a), so tier/status reads
// from shape as well as color: colorblind-safe and still legible in a
// black-and-white printout.
var TIER_STATUS_BUCKET_ = {
  Mastery: 'good', Blue: 'good', Green: 'good',
  Strategic: 'caution', Yellow: 'caution',
  Intensive: 'risk', Red: 'risk'
};

/** good/caution/risk/meets_untiered/unbenchmarked -- see buildGrowthChartSvg_'s marker shapes. */
function pointStatusBucket_(point) {
  if (point.benchmark_tier) return TIER_STATUS_BUCKET_[point.benchmark_tier] || 'good';
  if (point.below_benchmark_floor) return 'risk';
  if (point.benchmark_reference !== null && point.benchmark_reference !== undefined) return 'meets_untiered';
  return 'unbenchmarked';
}

/**
 * Renders one growth-chart point as a shape distinct per status bucket --
 * not just a colored dot -- so status is legible without relying on color
 * perception or a print/grayscale rendering: circle (on track), square
 * (some risk), triangle (at risk), diamond (meeting expectations but this
 * measure has no tier), hollow ring (no benchmark exists at all). Includes
 * an invisible larger hit-area circle so the tap target is comfortably
 * bigger than the visible marker (see Phase 3d's touch-target-sizing note).
 */
function pointMarkerSvg_(cx, cy, r, color, bucket, isLast, onclickAttr) {
  var strokeAttr = isLast ? ' stroke="#fff" stroke-width="2"' : '';
  var hitArea = '<circle cx="' + cx.toFixed(1) + '" cy="' + cy.toFixed(1) + '" r="12" fill="transparent"' + onclickAttr + '/>';
  var shape;
  if (bucket === 'unbenchmarked') {
    shape = '<circle cx="' + cx.toFixed(1) + '" cy="' + cy.toFixed(1) + '" r="' + r + '" fill="none" stroke="' + color + '" stroke-width="2"' + strokeAttr + onclickAttr + '/>';
  } else if (bucket === 'risk') {
    var h = r * 1.8;
    var pts = [[cx, cy - h * 0.6], [cx - h * 0.6, cy + h * 0.4], [cx + h * 0.6, cy + h * 0.4]]
      .map(function(p) { return p[0].toFixed(1) + ',' + p[1].toFixed(1); }).join(' ');
    shape = '<polygon points="' + pts + '" fill="' + color + '"' + strokeAttr + onclickAttr + '/>';
  } else if (bucket === 'caution') {
    var s = r * 1.6;
    shape = '<rect x="' + (cx - s / 2).toFixed(1) + '" y="' + (cy - s / 2).toFixed(1) + '" width="' + s.toFixed(1) + '" height="' + s.toFixed(1) + '" fill="' + color + '"' + strokeAttr + onclickAttr + '/>';
  } else if (bucket === 'meets_untiered') {
    var d = r * 1.3;
    var pts2 = [[cx, cy - d], [cx + d, cy], [cx, cy + d], [cx - d, cy]]
      .map(function(p) { return p[0].toFixed(1) + ',' + p[1].toFixed(1); }).join(' ');
    shape = '<polygon points="' + pts2 + '" fill="' + color + '"' + strokeAttr + onclickAttr + '/>';
  } else {
    shape = '<circle cx="' + cx.toFixed(1) + '" cy="' + cy.toFixed(1) + '" r="' + r + '" fill="' + color + '"' + strokeAttr + onclickAttr + '/>';
  }
  return hitArea + shape;
}

// One legend, shown once above the Growth Over Time charts, explaining the
// shapes pointMarkerSvg_ draws -- shapes alone aren't self-explanatory
// without a key, unlike color (which most sighted users already read as
// "green good, red bad" by convention).
function growthChartShapeLegend_() {
  function swatch(shapeSvg, label) {
    return '<span><svg width="16" height="16" viewBox="-8 -8 16 16">' + shapeSvg + '</svg>' + label + '</span>';
  }
  return '<div class="chart-shape-legend">'
    + swatch('<circle cx="0" cy="0" r="5" fill="#22c55e"/>', 'On track')
    + swatch('<rect x="-4" y="-4" width="8" height="8" fill="#eab308"/>', 'Some risk')
    + swatch('<polygon points="0,-5,-4.5,3.4,4.5,3.4" fill="#ef4444"/>', 'At risk')
    + swatch('<polygon points="0,-5,5,0,0,5,-5,0" fill="#14b8a6"/>', 'Meeting expectations (not tiered)')
    + swatch('<circle cx="0" cy="0" r="5" fill="none" stroke="#A8916B" stroke-width="2"/>', 'Not benchmarked')
    + '</div>';
}

/**
 * Phase 31e: merged what used to be two near-identical screens -- the
 * Roster (browse -> open a student's profile) and the "New Assessment
 * picker" (browse -> jump straight into scoring, skipping the profile).
 * Every row's own onclick (openStudent) is the app's one consistent "click
 * a student" behavior everywhere else. A per-row "Record Assessment" quick
 * action used to sit alongside it as a fast path straight into scoring,
 * bypassing the profile -- removed in Phase 41 (screenshot feedback: with
 * the top-nav "Request Assessment" button also on this page, two
 * similar-looking per-row/page-level actions was one too many entry points
 * for the same page). Recording an assessment now always goes through the
 * profile first.

function renderRoster() {
  var rows = filterRosterRows_(state.roster, state.rosterFilter);

  if (rows.length === 0 && state.rosterLastNameMatches && state.rosterLastNameMatches.length > 0) {

    + '<input type="text" id="roster-search" placeholder="Search by name or grade…" value="' + state.rosterFilter + '" oninput="onRosterSearch(this.value)" />'
    + '<button class="btn btn-primary" onclick="showAddStudentForm()">+ Add Student</button> '
    // Phase 25/#166b: Bulk Import bypasses the K5-6 roster picker entirely
    // (every row gets a generated id) -- Administrator-only client-side to

    + ((state.myAccess && state.myAccess.is_administrator) ? '<button class="btn btn-secondary" onclick="showBulkImportForm()">Bulk Import</button>' : '')

    + '</div>'

    // the entire student list (outside the card, appended once at the very
    // bottom of the whole page) -- clicking "+ Add Student" or "Bulk
    // Import" with a long roster loaded opened a form that was scrolled
    // completely out of view, with nothing on screen to say it had opened
    // at all. Moved directly under the buttons that open it (still inside
    // the same card), so it's immediately visible the moment either button
    // is clicked, above the list instead of below it.
    + '<div id="add-student-slot"></div>';

  if (rows.length === 0) {
    html += rosterEmptyStateHtml_(state.rosterFilter, state.roster.length);
  } else {
    if (usingLastNameFallback) {
      html += '<p class="muted" style="font-size:.8rem;margin-bottom:8px">Matched by last name (not shown below — open a student to see full details).</p>';
    }
    rows.forEach(function(s) {
      var tag = s.source === 'FACTS' ? '<span class="tag tag-facts">FACTS</span>' : '<span class="tag tag-manual">Manual</span>';
      html += '<div class="student-row" onclick="openStudent(\'' + s.student_id + '\')">'

        + '<div class="student-meta">Grade ' + escapeHtml(s.grade || '—') + (s.school ? ' · ' + escapeHtml(s.school) : '') + (s.elc_status ? ' · ' + escapeHtml(s.elc_status) : '') + '</div></div>'
        + '<div class="muted">' + chevronRightIconSvg_() + '</div>'
        + '</div>';
    });

  html += '</div>';

function onRosterSearch(v) {
  state.rosterFilter = v;
  state.rosterLastNameMatches = null;
  renderRoster();
  document.getElementById('roster-search').focus();
  scheduleRosterLastNameSearch_();
}

/** Client-side substring match against first name/last-initial/grade for the Roster view's search box. */
function filterRosterRows_(roster, filter) {
  var f = String(filter || '').toLowerCase();
  return (roster || []).filter(function(s) {
    return !f || (s.first_name + ' ' + s.last_initial + ' ' + s.grade).toLowerCase().indexOf(f) !== -1;
  });
}

// Phase 25a (Phase 6a review finding #22): when a search has zero
// client-side matches, fall back to a debounced server-side search against
// full last names (Roster.gs's searchRosterByLastName) -- debounced and
// gated on "client-side already found nothing" so the common search case
// (first name/grade, already available client-side) never pays a round
// trip, and a rapid run of keystrokes only fires the server search once
// typing pauses. A token guards against a stale (superseded) response
// overwriting state for whatever's currently typed.
var ROSTER_LASTNAME_SEARCH_DEBOUNCE_MS_ = 350;
var rosterLastNameSearchTimer_ = null;
var rosterLastNameSearchToken_ = 0;

function scheduleRosterLastNameSearch_() {
  clearTimeout(rosterLastNameSearchTimer_);
  var filter = state.rosterFilter.trim();
  if (filter.length < 2) return; // too short to be worth a round trip
  if (filterRosterRows_(state.roster, filter).length > 0) return; // client-side already resolved it

  var token = ++rosterLastNameSearchToken_;
  rosterLastNameSearchTimer_ = setTimeout(function() {
    call('searchRosterByLastName', filter).then(function(matches) {
      if (token !== rosterLastNameSearchToken_ || !matches) return; // superseded by a newer search
      state.rosterLastNameMatches = matches;
      if (state.view === 'roster') renderRoster();
    }).catch(function() { /* silent -- worst case, no fallback results appear */ });
  }, ROSTER_LASTNAME_SEARCH_DEBOUNCE_MS_);
}

/**
 * Phase 23b (Phase 6a review finding): "No students found." read identically
 * whether the WHOLE roster was empty (no FACTS sync / no students added
 * yet) or a search just had no matches -- and a search miss looked
 * identical to "this student doesn't exist," even though the search box
 * can only ever match first name/last-initial/grade (getRoster() never
 * sends full last names to the client -- Phase 20/PRIVACY.md's
 * minimal-identifying-info design). Searching a full last name (e.g.
 * "Adams") silently found nothing, with no hint that last names simply
 * aren't searchable here. This makes both cases explicit instead of
 * leaving the principal to guess.
 */
function rosterEmptyStateHtml_(filter, totalCount) {
  if (totalCount === 0) {
    return '<div class="empty-state">No students on the roster yet. Add one manually or check with your administrator about the FACTS import.</div>';
  }
  return '<div class="empty-state">No students match &ldquo;' + escapeHtml(filter) + '&rdquo;. '
    + 'Search matches first name, last initial, and grade — not full last names.</div>';
}

/**
 * Phase 37 (finding #29): shared concern-area/notes markup, originally built
 * for two Request Assessment entry points (a nav flow and a profile flow)
 * that had each duplicated this markup under a different id prefix
 * (ra-/req-). The profile flow was removed in Phase 41 -- this nav flow
 * (renderRequestAssessmentConcernSection_ below) is the only caller now, but
 * the helper stays factored out rather than inlined back in case a second
 * entry point returns.
 */
function renderConcernAreaFields_() {
  return '<label>Area(s) of difficulty</label>'
    + '<div style="display:flex;flex-wrap:wrap;gap:10px;margin-bottom:12px">'
    + state.concernAreas.map(function(a) {
        return '<label style="display:flex;align-items:center;gap:6px;font-weight:600;font-size:.85rem;margin:0">'
          + '<input type="checkbox" class="concern-area-chk" value="' + escapeHtml(a) + '" /> ' + escapeHtml(a) + '</label>';
      }).join('')
    + '</div>'
    // Phase 30g (Phase 6b review finding): this tool only scores reading
    // assessments -- nothing previously told a requester that a Math/
    // English/Spelling concern won't get an automated assessment-type
    // suggestion, just a manual follow-up from ELC.
    + '<p class="muted" style="font-size:.78rem;margin:-4px 0 12px">This tool scores reading assessments only -- a Math, English, or Spelling concern will be reviewed by ELC directly rather than matched to an automated suggestion.</p>'
    + '<div class="field"><label>Notes / details</label><textarea id="concern-area-note" rows="2" placeholder="e.g. struggling to sound out CVC words during independent reading time"></textarea></div>';
}

/** Reads the shared concern-area checkboxes + notes field. Returns null (and toasts) if no area is selected -- same validation both flows had separately before. */
function collectConcernAreaSubmission_() {
  var concernAreas = Array.prototype.slice.call(document.querySelectorAll('.concern-area-chk:checked')).map(function(el) { return el.value; });
  if (concernAreas.length === 0) { toast('Select at least one area of difficulty.'); return null; }
  return { concern_areas: concernAreas, note: document.getElementById('concern-area-note').value.trim() };
}

function renderRequestAssessmentConcernSection_(studentId) {

function submitRequestAssessmentFromHome_(studentId) {

/**

 * previously gave no hint that a queue even existed until you clicked in --
 * updates opportunistically whenever the count becomes known (this view,
 * or the Dashboard's own pending-requests summary), rather than adding a

 */
function updateRequestsNavBadge_(count) {

    el.style.display = 'none';
    el.textContent = '';

/** Phase 30h: does this request belong to the signed-in staff member? Case-insensitive since server-stored emails are already lowercased, but the caller's own address (from getMyAccess) shouldn't be assumed to be. */
function isMyRequest_(r) {
  var mine = (state.myAccess && state.myAccess.email || '').toLowerCase();
  return !!mine && String(r.requested_by || '').toLowerCase() === mine;
}

/** A request describes the concern (Reading/Math/etc.) when raised through the current form, or names a specific assessment_type when it came from the older request shape (or a requester who already knew what they wanted). */
function requestDescriptionText_(r) {
  if (r.concern_areas) return 'Difficulty in ' + r.concern_areas;
  if (r.assessment_type) return ASSESSMENT_LABELS[r.assessment_type] || r.assessment_type;
  return 'Assessment requested';
}

function requestAgeDays_(requestedAt) {
  var ms = (window.ELC_DEMO_NOW ? window.ELC_DEMO_NOW() : new Date()).getTime() - new Date(requestedAt).getTime();
  return Math.max(0, Math.floor(ms / 86400000));
}

/** A resolved request's status, in plain language -- distinguishes a real fulfillment (fulfilled_session_id set) from a manual resolution (Requests.gs's resolveRequestManually, no session) or a withdrawal. */
function requestResolvedStatusText_(r) {
  if (r.status === 'cancelled') return 'Cancelled';
  if (r.status === 'completed') return r.fulfilled_session_id ? 'Completed' : 'Resolved (no assessment applied)';
  return r.status;
}

/** A request that's sat unaddressed for weeks is easy to lose in a long queue -- flag its age, not just its position. */
function requestAgeBadge_(requestedAt) {
  var days = requestAgeDays_(requestedAt);
  var label = days === 0 ? 'Today' : (days === 1 ? '1 day ago' : days + ' days ago');
  var cls = days >= 30 ? 'badge-red' : (days >= 14 ? 'badge-yellow' : 'badge-neutral');
  return '<span class="badge ' + cls + '">' + label + '</span>';
}

/** One request row -- shared by the global queue and the prior-year section below it. */
function renderRequestItem_(r) {
  var html = '<div class="session-item">'
    + '<div class="session-head"><div>'
    + '<div class="session-title">' + escapeHtml(r.student_first_name) + ' ' + escapeHtml(r.student_last_initial) + '. — '
    + escapeHtml(requestDescriptionText_(r)) + '</div>'
    + '<div class="session-meta">Grade ' + escapeHtml(r.student_grade || '—') + ' · requested by ' + escapeHtml(r.requested_by)

    + '<button class="btn btn-secondary btn-small" onclick="resolveRequestManuallyClick(\'' + r.request_id + '\')">Mark Resolved</button>'
    + '<button class="btn btn-secondary btn-small" onclick="cancelRequestClick(\'' + r.request_id + '\')">Cancel</button>'
    + '</div>'
    + '</div>';
  return html;
}

/** Phase 30h: toggling "mine" re-renders in place -- no re-fetch, this only changes which already-loaded requests are shown. */
function toggleRequestsMineFilter_() {
  state.requestsMineFilter = !state.requestsMineFilter;
  renderRequestsView();
}

function renderRequestsView() {
  var mineOnly = !!state.requestsMineFilter;
  var visible = mineOnly ? state.pendingRequests.filter(isMyRequest_) : state.pendingRequests;

  var html = '<div class="card"><div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px">'
    + '<h2 style="margin:0">Flagged Concerns (' + state.pendingRequests.length + ')</h2>'
    + (visible.length ? '<button class="btn btn-secondary btn-small" onclick="previewFlaggedConcernsPrintClick_()">Print List</button>' : '')
    + '</div>';
  // Phase 30h (Phase 6b review finding): the queue is school-wide with no
  // way to tell which requests are yours without manually scanning --
  // hidden when there's nothing to filter by (myAccess not loaded yet) or
  // the whole queue is already empty.
  if (state.myAccess && state.myAccess.email && state.pendingRequests.length > 0) {
    html += '<label style="display:flex;align-items:center;gap:6px;font-size:.85rem;font-weight:600;margin:14px 0">'
      + '<input type="checkbox" ' + (mineOnly ? 'checked' : '') + ' onchange="toggleRequestsMineFilter_()" /> Show only my requests</label>';
  }

  if (visible.length === 0) {
    html += '<div class="empty-state">' + (mineOnly ? 'None of the pending requests are yours.' : 'Nothing pending — all caught up.') + '</div>';
  } else {
    // Phase 25/#163: a request from a prior school year that was never
    // resolved shouldn't blend invisibly into this year's queue -- split
    // them into their own labeled section so nothing looks like new,
    // current-year work, but nothing is hidden either.
    var currentYear = visible.filter(function(r) { return r.is_current_school_year; });
    var priorYears = visible.filter(function(r) { return !r.is_current_school_year; });
    currentYear.forEach(function(r) { html += renderRequestItem_(r); });
    if (priorYears.length > 0) {
      html += '<h3 class="muted" style="margin-top:20px">Carried over from a prior school year (' + priorYears.length + ')</h3>';
      priorYears.forEach(function(r) {
        html += '<div class="muted" style="font-size:0.85em;margin-bottom:2px">School year ' + escapeHtml(r.request_school_year) + '</div>' + renderRequestItem_(r);
      });
    }
  }
  html += '</div>';
  app.innerHTML = html;
}

/**

/**
 * Closes a request out as "handled some other way" -- no in-tool assessment
 * satisfies it (Math/English/Spelling have no equivalent test here), or ELC
 * staff simply decided it doesn't need one. Distinct from Cancel (withdrawn/
 * no longer needed): this records it as resolved, with a note on how.
 */
function resolveRequestManuallyClick(requestId, onDone) {
  var note = prompt('How was this request resolved? (optional)');
  if (note === null) return; // user cancelled the prompt -- abort, don't resolve with a blank note
  call('resolveRequestManually', requestId, note).then(function() {
    toast('Request marked resolved.');
    (onDone || goToRequests)();
  }).catch(function(err) { toast('Error: ' + err.message); });
}

/**
 * onDone (optional): what to do after a successful cancel -- defaults to
 * goToRequests() for the global Pending Requests queue. The student-profile
 * call site instead passes a callback that re-opens the SAME student, since
 * calling openStudent() as a separate synchronous statement alongside this
 * (the previous approach) raced with this function's own async success
 * handler -- whichever finished last silently won, so canceling from a
 * student's own profile could unpredictably yank the user over to the
 * global Requests view a moment later instead of leaving them on that
 * student.
 */
function cancelRequestClick(requestId, onDone) {
  // Phase 30a (Phase 6b review finding): every other destructive action
  // (Delete Session, Remove Student, Revoke Access) confirms first --
  // Cancel was the one gap, sitting right next to "Score Assessment"/"Mark
  // Resolved" with no undo except an admin editing the spreadsheet directly.
  showConfirm_(
    'Cancel this request?',
    'This removes the pending request entirely -- the person who asked won\'t be notified, and there\'s no undo from within the app. ' +
    'If the concern still needs attention, someone will need to submit a new request.',
    'Cancel Request',
    function() {
      call('cancelRequest', requestId).then(function() {
        toast('Request cancelled.');
        (onDone || goToRequests)();
      }).catch(function(err) { toast('Error: ' + err.message); });
    }
  );
}

//    "Assessment Status", and "Coverage" before that) ────────────────

function goToAssessmentStatus() {
  state.view = 'assessment-status';
  updateNavActive_();
  state.assessmentStatusReport = null;
  if (!state.assessmentStatusForm) {
    state.assessmentStatusForm = { assessment_type: '', school_year: schoolYearGuess_(), season: seasonGuess_(), administrator_role: '' };
  }
  // Phase 35 (performance): used to be 3 sequential round trips the first
  // time this view is opened in a session (getAssessmentTypes,
  // getAdministratorRoles, getAvailableSchoolYears) -- one bundled call now.
  // Still skips the network entirely once all 3 are already cached, same as
  // before.
  var allCached = state.assessmentTypes && state.administratorRoles && state.availableSchoolYears && state.complianceRequirements;
  var chain = allCached ? Promise.resolve(null) : call('getAssessmentStatusBundle');
  chain.then(function(bundle) {
    if (bundle) {
      if (!bundle.assessmentTypes) throw new Error('getAssessmentStatusBundle returned nothing.');
      state.assessmentTypes = bundle.assessmentTypes;
      state.administratorRoles = bundle.administratorRoles;
      state.availableSchoolYears = bundle.availableSchoolYears;
      state.complianceRequirements = bundle.complianceRequirements;
    }
    if (!state.assessmentStatusForm.assessment_type) state.assessmentStatusForm.assessment_type = state.assessmentTypes[0].id;
    renderAssessmentStatusPicker_();
  }).catch(function(err) { toast('Error: ' + err.message); });
}

/**
 * Whether `assessmentType` is part of an ACTUAL compliance requirement for
 * `grade`, in either service area (2026-09-23, at the school's request --
 * see getComplianceRequirementsSummary's own doc comment). Checks
 * `any_of` groups only -- `any_of_measures` groups (DIBELS Maze) name a
 * MEASURE, not an assessment type, so they can't make an assessment TYPE
 * itself "required" on their own; a DIBELS session is already required by
 * its own `any_of: ['dibels']` group wherever Maze also applies. Returns
 * { required: boolean, alternatives: string[] } -- alternatives lists the
 * OTHER types that satisfy the same requirement group (e.g. picking "DRA"
 * for a grade where "Lexile or DRA" is required returns ['lexile']), so a
 * "not yet assessed for DRA" row can be read honestly: that student may
 * already be compliant via Lexile instead.
 */
function complianceRequirementFor_(assessmentType, grade) {
  var req = state.complianceRequirements;
  if (!req || !grade) return { required: false, alternatives: [] };
  var alternatives = [];
  var required = false;
  ['reading', 'math'].forEach(function(area) {
    var groups = (req[area] && req[area][grade]) || [];
    groups.forEach(function(g) {
      if (!g.any_of || g.any_of.indexOf(assessmentType) === -1) return;
      required = true;
      g.any_of.forEach(function(t) { if (t !== assessmentType && alternatives.indexOf(t) === -1) alternatives.push(t); });
    });
  });
  return { required: required, alternatives: alternatives };
}

function runAssessmentStatusReport_() {

/** Every distinct grade present in a coverage report, sorted with "K" first (Phase 37, finding #20). */
function assessmentStatusReportGrades_(r) {
  var grades = [];
  r.assessed.concat(r.not_assessed).forEach(function(s) {
    if (s.grade && grades.indexOf(s.grade) === -1) grades.push(s.grade);
  });
  grades.sort(function(a, b) {
    var na = a === 'K' ? 0 : parseInt(a, 10);
    var nb = b === 'K' ? 0 : parseInt(b, 10);
    if (isNaN(na) || isNaN(nb)) return String(a).localeCompare(String(b));
    return na - nb;
  });
  return grades;
}

function onAssessmentStatusGradeFilterChange_() {
  state.assessmentStatusGradeFilter = document.getElementById('as-status-grade-filter').value;
  renderAssessmentStatusResults_();
}

function renderAssessmentStatusResults_() {
  var r = state.assessmentStatusReport;
  var slot = document.getElementById('assessment-status-results');
  if (!r || !slot) return;
  var roleSuffix = r.administrator_role ? ' — administered by ' + escapeHtml(r.administrator_role) : '';

  // Phase 37 (finding #20): getCoverageReport (Coverage.gs) already excludes
  // grades this assessment type doesn't apply to at all (Phase 29f) -- this
  // filter narrows the already-applicable results further, purely
  // client-side, same pattern as the Dashboard's grade filter.
  var grades = assessmentStatusReportGrades_(r);
  var gradeFilter = state.assessmentStatusGradeFilter || '';
  if (gradeFilter && grades.indexOf(gradeFilter) === -1) gradeFilter = state.assessmentStatusGradeFilter = '';
  var notAssessed = gradeFilter ? r.not_assessed.filter(function(s) { return s.grade === gradeFilter; }) : r.not_assessed;
  var assessed = gradeFilter ? r.assessed.filter(function(s) { return s.grade === gradeFilter; }) : r.assessed;
  var total = assessed.length + notAssessed.length;
  var pct = total > 0 ? Math.round(assessed.length / total * 100) : 0;

  var html = '<div class="card"><h2>' + escapeHtml(ASSESSMENT_LABELS[r.assessment_type] || r.assessment_type) + ' — ' + escapeHtml(r.season) + ' ' + escapeHtml(r.school_year) + roleSuffix + '</h2>';

  if (grades.length > 1) {
    html += '<div class="field" style="max-width:200px;margin-bottom:12px"><label>Grade</label><select id="as-status-grade-filter" onchange="onAssessmentStatusGradeFilterChange_()">'
      + '<option value="">All Grades</option>'
      + grades.map(function(g) { return '<option' + (gradeFilter === g ? ' selected' : '') + '>' + escapeHtml(g) + '</option>'; }).join('')
      + '</select></div>';
  }

  // 2026-09-23, at the school's request ("shouldn't actually show as needed
  // if it's not required, right?"): this report is a general search -- pick
  // ANY assessment/period and see who has/hasn't taken it, regardless of
  // whether it's actually required at that grade (see Coverage.gs's own doc
  // comment -- it deliberately has no requirement gate, since the search is
  // the whole point). That's genuinely useful, but "Not yet assessed" reads
  // as an urgent gap either way -- this makes the distinction explicit
  // instead of leaving every row looking equally required.
  html += complianceRequirementBadgeHtml_(r.assessment_type, gradeFilter, grades);

  html += '<p class="muted" style="margin-bottom:12px">' + assessed.length + ' of ' + total + ' active students assessed (' + pct + '%)' + (gradeFilter ? ', Grade ' + escapeHtml(gradeFilter) : '') + '</p>';

  html += '<div style="display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:6px">'
    + '<p class="muted" style="margin:0">Not yet assessed (' + notAssessed.length + ')</p>'
    + (notAssessed.length ? '<button class="btn btn-secondary btn-small" onclick="previewAssessmentStatusPrintClick_()">Print Checklist</button>' : '')
    + '</div>';
  if (notAssessed.length === 0) {
    html += '<div class="empty-state">Everyone’s been assessed for this period.</div>';
  } else {
    notAssessed.forEach(function(s) {
      html += '<div class="student-row" style="cursor:default;flex-wrap:wrap;gap:10px">'
        + '<div><div class="student-name">' + escapeHtml(s.first_name) + ' ' + escapeHtml(s.last_initial) + '.</div>'
        + '<div class="student-meta">Grade ' + escapeHtml(s.grade || '—') + '</div></div>'
        + '<button class="btn btn-primary btn-small" onclick="startAssessmentFromStatus_(\'' + s.student_id + '\',\'' + r.assessment_type + '\')">Score Assessment</button>'
        + '</div>';
    });
  }

  html += '<p class="muted" style="margin:14px 0 6px">Already assessed (' + assessed.length + ')</p>';
  if (assessed.length === 0) {
    html += '<div class="empty-state">Nobody yet.</div>';
  } else {
    assessed.forEach(function(s) {
      html += '<div class="student-row" onclick="openStudent(\'' + s.student_id + '\')">'
        + '<div><div class="student-name">' + escapeHtml(s.first_name) + ' ' + escapeHtml(s.last_initial) + '.</div>'
        + '<div class="student-meta">Grade ' + escapeHtml(s.grade || '—') + ' · ' + fmtDate(s.administration_date) + (s.administrator_role ? ' · ' + escapeHtml(s.administrator_role) : '') + '</div></div>'
        + '<div class="muted">' + chevronRightIconSvg_() + '</div>'
        + '</div>';
    });
  }

  html += '</div>';
  slot.innerHTML = html;
}

/** See renderAssessmentStatusResults_'s own comment for why this exists. `grades` is every grade actually present in this report (assessmentStatusReportGrades_). */
function complianceRequirementBadgeHtml_(assessmentType, gradeFilter, grades) {
  if (!state.complianceRequirements) return '';
  var checkGrades = gradeFilter ? [gradeFilter] : grades;
  if (checkGrades.length === 0) return '';

  var requiredGrades = [], optionalGrades = [];
  var alternativesByGrade = {};
  checkGrades.forEach(function(g) {
    var res = complianceRequirementFor_(assessmentType, g);
    if (res.required) { requiredGrades.push(g); if (res.alternatives.length) alternativesByGrade[g] = res.alternatives; }
    else optionalGrades.push(g);
  });

  if (gradeFilter) {
    if (requiredGrades.length) {
      var alts = alternativesByGrade[gradeFilter];
      return '<div class="badge badge-ok" style="margin-bottom:10px">✓ Required for Grade ' + escapeHtml(gradeFilter) + '</div>'
        + (alts && alts.length ? '<p class="muted" style="font-size:.78rem;margin:-4px 0 10px">Satisfied by ' + alts.map(function(t) { return escapeHtml(ASSESSMENT_LABELS[t] || t); }).join(' or ') + ' too -- a "not yet assessed" student below may already be compliant through one of those instead.</p>' : '');
    }
    return '<div class="badge badge-neutral" style="margin-bottom:10px">Not required for Grade ' + escapeHtml(gradeFilter) + ' — general search, not a compliance gap</div>';
  }

  // "All Grades" spans a mix -- summarize rather than pretend one status fits every grade shown.
  if (optionalGrades.length === 0) return '<div class="badge badge-ok" style="margin-bottom:10px">✓ Required for every grade shown</div>';
  if (requiredGrades.length === 0) return '<div class="badge badge-neutral" style="margin-bottom:10px">Not required for any grade shown — general search, not a compliance gap</div>';
  return '<div class="badge badge-ok" style="margin-bottom:4px">Required: Grade ' + requiredGrades.map(escapeHtml).join(', ') + '</div>'
    + '<div class="badge badge-neutral" style="margin-bottom:10px">Not required: Grade ' + optionalGrades.map(escapeHtml).join(', ') + '</div>';
}

/**
 * Letterhead-branded, printable checklist of the "Not yet assessed" list
 * (2026-09-23, at the school's request -- "print a list... so I can use as
 * a checklist or an email to teachers"). Same #print-report/@media print
 * mechanism as every other printed output in this app (see
 * printLetterheadHtml_'s own doc comment). No iepExportType -- a roster of
 * who's missing an assessment isn't a single student's exported PII the
 * way the per-student report/IEP packet is.
 */
function buildAssessmentStatusPrintHtml_() {
  var r = state.assessmentStatusReport;
  var gradeFilter = state.assessmentStatusGradeFilter || '';
  var notAssessed = (gradeFilter ? r.not_assessed.filter(function(s) { return s.grade === gradeFilter; }) : r.not_assessed)
    .slice().sort(function(a, b) { return gradeSortCompareClient_(a.grade, b.grade) || (a.first_name + a.last_initial).localeCompare(b.first_name + b.last_initial); });

  var subtitle = escapeHtml(r.season) + ' ' + escapeHtml(r.school_year) + (gradeFilter ? ' · Grade ' + escapeHtml(gradeFilter) : '')
    + (r.administrator_role ? ' · administered by ' + escapeHtml(r.administrator_role) : '') + ' · Generated ' + fmtDate(todayIso_());

  var html = '<div style="max-width:640px;margin:0 auto;font-size:.92rem">'
    + printLetterheadHtml_((ASSESSMENT_LABELS[r.assessment_type] || r.assessment_type) + ' — Still Needed', subtitle)
    + '<p style="text-align:center;margin:0 0 18px;color:#444">' + notAssessed.length + ' student' + (notAssessed.length === 1 ? '' : 's') + ' not yet assessed</p>';

  if (notAssessed.length === 0) {
    html += '<p>Everyone has been assessed for this period.</p>';
  } else {
    html += '<table><thead><tr><th>Student</th><th>Grade</th><th style="width:90px">Done?</th></tr></thead><tbody>'
      + notAssessed.map(function(s) {
          return '<tr><td>' + escapeHtml(s.first_name) + ' ' + escapeHtml(s.last_initial) + '.</td><td>' + escapeHtml(s.grade || '—') + '</td><td></td></tr>';
        }).join('')
      + '</tbody></table>';
  }
  return html + '</div>';
}
