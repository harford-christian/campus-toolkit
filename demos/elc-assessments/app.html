        + '</div><span style="display:inline-flex;align-items:center;gap:10px">'
          // Phase 36 (finding #32): Delete used to live ONLY inside the
          // session detail, which itself is one click behind (and, after
          // Phase 31h, the whole Assessment History card can also be
          // collapsed) -- up to 3 clicks deep before Delete was even
          // visible. A single small action right on the always-visible row
          // header cuts that straight to one click + the existing confirm
          // modal, no expansion required. stopPropagation so it doesn't
          // also toggle the detail view open/closed.
          + '<button class="btn btn-secondary btn-small" style="padding:2px 8px;font-size:.72rem" onclick="event.stopPropagation(); editSessionClick_(\'' + sess.session_id + '\')">Edit</button>'
          + '<button class="btn btn-secondary btn-small" style="border-color:#ef4444;color:#b91c1c;padding:2px 8px;font-size:.72rem" onclick="event.stopPropagation(); deleteSessionClick_(\'' + sess.session_id + '\')">Delete</button>'
          + '<span class="expand-chevron" id="chevron-' + sess.session_id + '" style="display:inline-flex;align-items:center;gap:4px">'
          + caretDownIconSvg_() + ' <span class="chevron-label">details</span></span></span></div>';
      if (summary.concerns && summary.concerns.length) {
        historyBody += '<div style="margin-top:8px">' + summary.concerns.map(function(c) { return '<span class="badge badge-strategic">' + escapeHtml(c) + '</span>'; }).join('') + '</div>';
      }
      if (summary.interventions && summary.interventions.length) {
        historyBody += '<div class="muted" style="margin-top:6px;font-size:.8rem">' + summary.interventions.map(escapeHtml).join(' ') + '</div>';
      }
      if (sess.notes) {
        historyBody += '<div style="margin-top:6px;font-size:.8rem;font-style:italic;color:var(--ink-soft)">“' + escapeHtml(sess.notes) + '”</div>';
      }
      // Phase 36 (finding #32): Delete moved up to the always-visible row
      // header above -- no longer duplicated here.
      historyBody += '<div class="session-detail" id="session-detail-' + sess.session_id + '">' + renderSessionMeasureDetail_(sess.session_id) + '</div>';
      historyBody += '<div id="session-edit-' + sess.session_id + '"></div>';
      historyBody += '</div>';
    });
  }
  html += renderCollapsibleCard_('profile.history', 'Assessment History', historyBody, 'toggleProfileSection_');

  app.innerHTML = html;
}

// ── Accommodations & Modifications (Phase 23c, folding in Phase 7; renamed Phase 40) ──
//
// Phase 45 (2026-08-04): the Interventions.gs support/intervention log that
// used to live in this section (suggestion box, "+ Log Intervention",
// Active/Completed/Discontinued status log) was removed at the user's
// explicit request -- accommodations/modifications cover this now, and
// formal interventions are tracked through the IEP process outside this
// tool. This section is now just the checklist. See git history (Phase
// 23c/36/40b) if the old log is ever needed for reference.

/** Phase 36 (finding #38): returns body-only HTML now -- the caller wraps this in renderCollapsibleCard_, same "no self-wrapping card" convention as renderDashboardHeadline_/renderComplianceSection_ since Phase 31g. */
function renderSupportSection_(h) {
  return renderAccommodationChecklist_()
    + '<div class="btn-row" style="margin-top:12px"><button class="btn btn-secondary btn-small" onclick="previewAccommodationSummaryClick()">Print Accommodations Summary</button></div>';
}

/**
 * Two levels of nested collapsibles (Accommodation/Modification, then each
 * checklist category within) -- deliberately NOT renderCollapsibleCard_
 * (that wraps in a full .card with its own shadow/border; nesting .card
 * inside .card inside .card here would look heavy). Reuses the same
 * toggleProfileSection_/state.sectionExpanded mechanism with more granular
 * keys instead, so expand/collapse state still survives a re-render.
 */
function renderChecklistAccordion_(key, title, bodyHtml) {
  var expanded = state.sectionExpanded[key] !== false;
  return '<div style="border:1px solid var(--line);border-radius:6px;padding:10px 12px;margin-bottom:8px">'
    + '<div class="accordion-head" style="margin-bottom:0" onclick="toggleProfileSection_(\'' + key + '\')">'
    + '<strong style="font-size:.85rem">' + escapeHtml(title) + '</strong>'
    + '<span class="chev" style="display:inline-block' + (expanded ? '' : ';transform:rotate(-90deg)') + '">▾</span></div>'
    + (expanded ? '<div style="margin-top:10px">' + bodyHtml + '</div>' : '')
    + '</div>';
}

function accommodationEntryFor_(type, category, item) {
  return (state.currentAccommodations || []).filter(function(c) { return c.type === type && c.category === category && c.item === item; })[0];
}

function renderAccommodationChecklist_() {
  if (!state.accommodationChecklist) {
    call('getAccommodationChecklist').then(function(def) {
      if (!def) throw new Error('getAccommodationChecklist returned nothing.');
      state.accommodationChecklist = def;
      renderProfile();
    }).catch(function(err) { toast('Error: ' + err.message); });
    return '<div class="muted" style="font-size:.85rem">Loading checklist…</div>';
  }

  var def = state.accommodationChecklist;
  var checkedItems = state.currentAccommodations || [];

  return ['Accommodation', 'Modification'].map(function(type) {
    var categories = def.checklist[type] || {};
    var checkedCountForType = checkedItems.filter(function(c) { return c.type === type; }).length;

    // 2026-09-09: per the school's "ELC Accommodation Definitions" document
    // -- "Modifications are NOT generally used. Consult ELC before any
    // modifications are made." Shown every time this section is open,
    // not just once, since checking a Modification item is a real,
    // infrequent action worth a visible reminder right at the point of use.
    var modificationDisclaimer = type === 'Modification'
      ? '<p class="muted" style="margin-bottom:10px;font-size:.82rem">Modifications are not generally used at this school — consult ELC before adding any modification for a student.</p>'
      : '';

    var body = modificationDisclaimer + Object.keys(categories).map(function(category) {
      var items = categories[category];
      var checkedCountForCategory = checkedItems.filter(function(c) { return c.type === type && c.category === category; }).length;

      var itemsHtml = items.map(function(item) {
        var entry = accommodationEntryFor_(type, category, item);
        var itemKey = (type + '|' + category + '|' + item).replace(/'/g, "\\'");
        // 2026-09-14: the old design was two separate steps -- a plain
        // "is this needed" checkbox on the left, then (once checked) a
        // separate responsible-party dropdown on the right, with a
        // "Responsible party…" placeholder state that could sit unset.
        // Merged into one step, per the school's own request: the 3
        // responsible-party checkboxes below ARE the "is this needed"
        // signal -- checking any one of them both marks the item
        // necessary and assigns who owns it in a single click. Only one
        // can be true at a time (same one-value-per-item data model as
        // before, setAccommodationItem/responsible_party), so checking a
        // different party switches it; unchecking the currently-checked
        // one removes the accommodation entirely (same as the old
        // top-level checkbox unchecked).
        return '<div style="display:flex;align-items:center;justify-content:space-between;gap:10px;padding:4px 0;flex-wrap:wrap">'
          + '<span style="font-size:.85rem;font-weight:' + (entry ? '600' : '400') + '">' + escapeHtml(item) + '</span>'
          + '<div style="display:flex;gap:12px;flex-wrap:wrap">'
          + def.responsible_parties.map(function(p) {
              var isChecked = !!entry && entry.responsible_party === p;
              return '<label style="display:flex;align-items:center;gap:5px;font-size:.78rem;font-weight:' + (isChecked ? '600' : '400') + ';margin:0">'
                + '<input type="checkbox" class="accom-party-chk"' + (isChecked ? ' checked' : '') + ' onchange="onAccommodationPartyToggle_(\'' + itemKey + '\', \'' + p.replace(/'/g, "\\'") + '\', this.checked)" /> '
                + escapeHtml(p) + '</label>';
            }).join('')
          + '</div></div>';
      }).join('');

      return renderChecklistAccordion_('accommodations.' + type + '.' + category, category + (checkedCountForCategory ? ' (' + checkedCountForCategory + ')' : ''), itemsHtml);
    }).join('');

    return renderChecklistAccordion_('accommodations.' + type, (type === 'Accommodation' ? 'Accommodations' : 'Modifications') + (checkedCountForType ? ' (' + checkedCountForType + ')' : ''), body);
  }).join('');
}

/**
 * Replaces the old two-step onAccommodationItemToggle_/
 * onAccommodationResponsiblePartyChange_ pair (2026-09-14) -- see the
 * comment above these checkboxes in renderAccommodationChecklist_ for why.
 * Checking a party checkbox sets it as responsible AND marks the item
 * necessary in one call; unchecking the currently-checked one removes the
 * accommodation entirely (setAccommodationItem's checked=false already
 * deletes the row -- same server behavior as the old top-level checkbox).
 *
 * Real find (2026-09-14, take 2): the first fix for rapid-click races
 * disabled every checkbox for the duration of one save -- correct, but on
 * real Apps Script round-trip latency that made filling out a long
 * checklist feel frozen (nothing else clickable until each save fully
 * landed). This instead updates state.currentAccommodations and
 * re-renders IMMEDIATELY on click, synchronously, before the network call
 * even starts -- no waiting, and the page reflow (a checked item going
 * bold) happens in the same instant as the click instead of arriving late
 * and shifting a row out from under a later click. The server call still
 * happens in the background to persist it, just not on the critical path
 * for what the user sees. accommSaveSeq_ guards the one remaining risk --
 * clicking a different party for the SAME item again before the first
 * click's call resolves -- by only letting the LATEST click's response
 * matter; a stale one arriving late is ignored instead of clobbering a
 * newer click. On a genuine failure (rare), re-fetches fresh from the
 * server rather than guessing what to revert to locally.
 */
var accommSaveSeq_ = {};
function onAccommodationPartyToggle_(itemKey, party, checked) {
  var parts = itemKey.split('|');
  var type = parts[0], category = parts[1], item = parts[2];
  var responsibleParty = checked ? party : '';

  state.currentAccommodations = (state.currentAccommodations || []).filter(function(c) {
    return !(c.type === type && c.category === category && c.item === item);
  });
  if (checked) state.currentAccommodations.push({ type: type, category: category, item: item, responsible_party: party });
  renderProfile();

  accommSaveSeq_[itemKey] = (accommSaveSeq_[itemKey] || 0) + 1;
  var mySeq = accommSaveSeq_[itemKey];

  call('setAccommodationItem', state.currentStudent.student_id, type, category, item, checked, responsibleParty).catch(function(err) {
    if (accommSaveSeq_[itemKey] !== mySeq) return; // a newer click for this same item already superseded this request
    toast('Error: ' + err.message + ' -- reloading to make sure what\'s shown is accurate.');
    loadStudent_(state.currentStudent.student_id).then(function() { renderProfile(); });
  });
}

var HCS_LOGO_BASE64_ = 'data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20120%20120%22%3E%3Ccircle%20cx%3D%2260%22%20cy%3D%2260%22%20r%3D%2256%22%20fill%3D%22%23234C6A%22%2F%3E%3Ccircle%20cx%3D%2260%22%20cy%3D%2260%22%20r%3D%2248%22%20fill%3D%22none%22%20stroke%3D%22%23D4AF37%22%20stroke-width%3D%223%22%2F%3E%3Cpath%20d%3D%22M60%2026%20L60%2058%20M44%2040%20L76%2040%22%20stroke%3D%22%23fff%22%20stroke-width%3D%226%22%20stroke-linecap%3D%22round%22%2F%3E%3Ctext%20x%3D%2260%22%20y%3D%2288%22%20font-family%3D%22Georgia%2C%20serif%22%20font-size%3D%2222%22%20font-weight%3D%22700%22%20fill%3D%22%23fff%22%20text-anchor%3D%22middle%22%3EECS%3C%2Ftext%3E%3C%2Fsvg%3E';

/**
 * Accommodations & Modifications summary print (2026-09-14) -- "for
 * teachers" per the school's request, so this deliberately does NOT pull
 * in anything from the 504 Plan (diagnosis/medications are PHI, and not
 * what a classroom-teacher summary is about) -- just what's actually
 * checked on this student's Accommodations & Modifications checklist and
 * who's responsible for each, formatted to match the school's own real
 * "Elementary Special Education Accommodation Checklist" (see ELC Docs).
 * Same letterhead treatment, #print-report/@media print mechanism, and
 * IEP Export Log audit trail (export_type='printed_accommodations_summary')
 * as the 504 Plan print below.
 */
function buildAccommodationSummaryHtml_() {
  var s = state.currentStudent;
  var checked = state.currentAccommodations || [];

  var html = '<div style="max-width:720px;margin:0 auto;font-size:.92rem">'
    + printLetterheadHtml_('Elementary Special Education Accommodation Checklist', 'Accommodations & Modifications Summary')
    + '<table style="width:100%;margin-bottom:20px"><tr>'
    + '<td style="width:50%"><strong>Student:</strong> ' + escapeHtml(s.first_name) + ' ' + escapeHtml(s.last_name) + '</td>'
    + '<td><strong>Grade:</strong> ' + escapeHtml(s.grade || '—') + '</td></tr></table>';

  ['Accommodation', 'Modification'].forEach(function(type) {
    var typeItems = checked.filter(function(c) { return c.type === type; });
    if (!typeItems.length) return;

    html += '<h2 style="font-size:1rem;border-bottom:2px solid #333;padding-bottom:3px;margin-top:20px">' + (type === 'Accommodation' ? 'Accommodations' : 'Modifications') + '</h2>';

    var byCategory = {};
    var order = [];
    typeItems.forEach(function(c) {
      if (!byCategory[c.category]) { byCategory[c.category] = []; order.push(c.category); }

    });

    order.forEach(function(cat) {
      html += '<p style="margin:10px 0 4px"><strong>' + escapeHtml(cat) + '</strong></p>'
        + '<table style="width:100%;border-collapse:collapse;margin-bottom:6px">'
        + '<thead><tr><th style="text-align:left;border-bottom:1px solid #ccc;padding:3px 4px;font-size:.8rem">Accommodation</th><th style="text-align:left;border-bottom:1px solid #ccc;padding:3px 4px;font-size:.8rem;width:160px">Responsible Party</th></tr></thead><tbody>'
        + byCategory[cat].map(function(c) {
            return '<tr><td style="padding:3px 4px;border-bottom:1px solid #eee">' + escapeHtml(c.item) + '</td>'
              + '<td style="padding:3px 4px;border-bottom:1px solid #eee">' + (c.responsible_party ? escapeHtml(c.responsible_party) : '<span style="color:var(--ink-soft)">—</span>') + '</td></tr>';
          }).join('')
        + '</tbody></table>';
    });
  });

  if (!checked.length) {
    html += '<p style="color:var(--ink-soft);margin-top:16px">No accommodations or modifications currently checked for this student.</p>';
  }

  html += '<p style="margin-top:30px;font-size:.78rem;color:#666">Generated ' + escapeHtml(fmtDate(todayIso_())) + '</p>';
  html += '</div>';
  return html;
}

function previewAccommodationSummaryClick() {
  var container = document.getElementById('print-report');

}

// ── 504 Plan (2026-09-11) ────────────────────────────────────
//
// Genuinely PHI (diagnosis, medications), not just PII -- see
// Section504.gs for the full access model. Viewing is open to any staff
// who can already see this student (same as Accommodations/IEP Goals),
// so no read-side restriction here; editing is Administrator/ELC Staff
// only, enforced server-side by saveSection504Plan -- the Edit/Add
// button below is just hidden for everyone else so it isn't a dead
// click, not the actual security boundary.

function renderSection504_() {
  var p = state.currentSection504 || { diagnosis: '', medications: '', service_areas: [], date_plan_implemented: '', exists: false };
  var access = state.myAccess || {};
  var canEdit = !!(access.is_administrator || access.is_elc_staff);

  if (state.section504Editing) return renderSection504EditForm_(p);

  var html = '';
  if (!p.exists) {
    html += '<p class="muted">No 504 Plan on file for this student.</p>';
  } else {
    html += '<p style="white-space:pre-wrap"><strong>Diagnosis / Disability:</strong> ' + (p.diagnosis ? escapeHtml(p.diagnosis) : '<span class="muted">(none entered)</span>') + '</p>'
      + '<p style="white-space:pre-wrap"><strong>Medications:</strong> ' + (p.medications ? escapeHtml(p.medications) : '<span class="muted">(none entered)</span>') + '</p>'
      + '<p><strong>ELC Service Areas:</strong> ' + (p.service_areas.length
          ? p.service_areas.map(function(a) { return '<span class="badge badge-neutral" style="margin-right:4px">' + escapeHtml(a) + '</span>'; }).join('')
          : '<span class="muted">(none selected)</span>') + '</p>'
      + '<p><strong>Plan Implemented:</strong> ' + (p.date_plan_implemented ? escapeHtml(fmtDate(p.date_plan_implemented)) : '<span class="muted">(not set)</span>') + '</p>';
  }

  html += '<div class="btn-row" style="margin-top:10px">'
    + '<button class="btn btn-secondary btn-small" onclick="previewSection504Click()">Print 504 Plan</button>'
    + (canEdit ? '<button class="btn btn-secondary btn-small" onclick="showEditSection504Form_()">' + (p.exists ? 'Edit' : 'Add') + ' 504 Plan</button>' : '')
    + (canEdit && p.exists ? '<button class="btn btn-secondary btn-small" style="border-color:#ef4444;color:#b91c1c" onclick="deleteSection504Click_()">Delete 504 Plan</button>' : '')
    + '<button class="btn btn-secondary btn-small" onclick="toggleSection504History_()">' + (state.section504HistoryVisible ? 'Hide' : 'View') + ' History</button>'
    + '</div>'
    + '<div id="section504-history-slot" style="margin-top:10px">' + (state.section504HistoryVisible ? renderSection504HistoryList_() : '') + '</div>';
  return html;
}

/**
 * Real find (2026-09-14): every edit or delete now archives the PRIOR
 * version (archiveSection504Plan_, Section504.gs) instead of silently
 * overwriting/losing it -- this is where that history actually becomes
 * visible. Lazy-loaded (only fetched the first time someone clicks "View
 * History"), not bundled into the profile load -- most students won't
 * have any history to show, so there's no reason to pay for it on every
 * profile open.
 */
function toggleSection504History_() {
  state.section504HistoryVisible = !state.section504HistoryVisible;
  if (!state.section504HistoryVisible) { renderProfile(); return; }
  if (state.currentSection504History) { renderProfile(); return; }
  call('getSection504History', state.currentStudent.student_id).then(function(history) {
    state.currentSection504History = history || [];
    renderProfile();
  }).catch(function(err) { toast('Error: ' + err.message); state.section504HistoryVisible = false; });
}

function renderSection504HistoryList_() {
  var history = state.currentSection504History || [];
  if (!history.length) return '<p class="muted" style="font-size:.85rem">No prior versions on file.</p>';

  return history.map(function(h) {
    return '<div class="faq-item">'
      + '<div class="faq-q">' + escapeHtml(h.archived_reason || 'Archived') + ' ' + fmtDate(h.archived_at) + (h.archived_by ? ' by ' + escapeHtml(h.archived_by) : '') + '</div>'
      + '<div class="muted" style="font-size:.85rem;white-space:pre-wrap"><strong>Diagnosis:</strong> ' + (h.diagnosis ? escapeHtml(h.diagnosis) : '(none entered)') + '</div>'
      + '<div class="muted" style="font-size:.85rem;white-space:pre-wrap"><strong>Medications:</strong> ' + (h.medications ? escapeHtml(h.medications) : '(none entered)') + '</div>'
      + '<div class="muted" style="font-size:.85rem"><strong>Service Areas:</strong> ' + (h.service_areas.length ? h.service_areas.map(escapeHtml).join(', ') : '(none selected)') + '</div>'
      + '<div class="muted" style="font-size:.85rem"><strong>Plan Implemented:</strong> ' + (h.date_plan_implemented ? escapeHtml(fmtDate(h.date_plan_implemented)) : '(not set)') + '</div>'
      + '</div>';
  }).join('');
}

/** Administrator/ELC Staff only (mirrors saveSection504Plan's gate) -- permanently removes the row, e.g. to clear out a test entry, not just blank its fields. */
function deleteSection504Click_() {
  showConfirm_(
    'Delete this 504 Plan?',
    'This removes it as the student\'s current plan. The version being removed is archived first -- you can still see it under "View History" -- but there won\'t be an active plan on file until a new one is added.',
    'Delete 504 Plan',
    function() {
      call('deleteSection504Plan', state.currentStudent.student_id).then(function(result) {

      }).then(function() {

}

function showEditSection504Form_() {
  state.section504Editing = true;

    state.section504ServiceAreas = areas || [];

  }).catch(function(err) { toast('Error: ' + err.message); state.section504Editing = false; });
}

function cancelEditSection504_() {
  state.section504Editing = false;
  renderProfile();
}

function renderSection504EditForm_(p) {
  var areas = state.section504ServiceAreas || [];
  var selected = {};
  (p.service_areas || []).forEach(function(a) { selected[a] = true; });

  var html = '<div class="field"><label>Diagnosis / Disability</label>'

    + '<div class="field"><label>Medications</label>'

    + '<div class="field" style="max-width:220px"><label>Date Plan Implemented</label>'
    + '<input type="date" id="s504-date" value="' + escapeHtml(p.date_plan_implemented || '') + '" /></div>'
    + '<label>ELC Service Areas</label>'
    + '<div style="display:flex;flex-wrap:wrap;gap:10px;margin-bottom:14px">'
    + areas.map(function(a) {
        return '<label style="display:flex;align-items:center;gap:6px;font-weight:600;font-size:.85rem;margin:0">'
          + '<input type="checkbox" class="s504-area-chk" value="' + escapeHtml(a) + '"' + (selected[a] ? ' checked' : '') + ' /> ' + escapeHtml(a) + '</label>';
      }).join('')
    + '</div>'
    + '<div class="btn-row">'
    + '<button class="btn btn-primary btn-small" onclick="saveSection504Click_()">Save</button>'
    + '<button class="btn btn-secondary btn-small" onclick="cancelEditSection504_()">Cancel</button>'
    + '</div>';
  return html;
}

function saveSection504Click_() {
  var serviceAreas = Array.prototype.slice.call(document.querySelectorAll('.s504-area-chk:checked')).map(function(el) { return el.value; });
  var data = {
    diagnosis: document.getElementById('s504-diagnosis').value.trim(),
    medications: document.getElementById('s504-meds').value.trim(),
    date_plan_implemented: document.getElementById('s504-date').value,
    service_areas: serviceAreas
  };
  call('saveSection504Plan', state.currentStudent.student_id, data).then(function(result) {
    if (!result) throw new Error('saveSection504Plan returned nothing.');
    state.section504Editing = false;
    return loadStudent_(state.currentStudent.student_id);
  }).then(function() {
    renderProfile();
    toast('504 Plan saved.');
  }).catch(function(err) { toast('Error: ' + err.message); });
}

/**
 * 504 Plan print/letterhead builder -- mirrors the school's real
 * "Classroom Accommodation (504) Plan Form" (see ELC Docs), but pulls
 * from real stored data (Section504.gs) instead of being hand-filled
 * from scratch every time. Accommodations shown are whatever's actually
 * checked in the Accommodations & Modifications checklist above (this
 * app's own category structure, not the paper form's original category
 * names) -- same source of truth, not a separate parallel list to keep
 * in sync. Same #print-report/@media print mechanism as the existing
 * student report and board packet (Phase 13b/25e), and the same IEP
 * Export Log (logIepExport, export_type='printed_504_plan') that already
 * tracks PII/PHI leaving the app on paper.
 */
function buildSection504Html_() {
  var s = state.currentStudent;
  var p = state.currentSection504 || { diagnosis: '', medications: '', service_areas: [], date_plan_implemented: '' };
  var checked = (state.currentAccommodations || []).filter(function(c) { return c.type === 'Accommodation'; });

  var html = '<div style="max-width:720px;margin:0 auto;font-size:.92rem">'
    + printLetterheadHtml_('Classroom Accommodation Plan (504)', null)
    + '<table style="width:100%;margin-bottom:16px"><tr>'
    + '<td style="width:50%"><strong>Student:</strong> ' + escapeHtml(s.first_name) + ' ' + escapeHtml(s.last_name) + '</td>'
    + '<td><strong>Grade:</strong> ' + escapeHtml(s.grade || '—') + '</td></tr>'
    + '<tr><td><strong>Date Plan Implemented:</strong> ' + (p.date_plan_implemented ? escapeHtml(fmtDate(p.date_plan_implemented)) : '—') + '</td>'
    + '<td><strong>School Year:</strong> ' + escapeHtml(schoolYearGuess_()) + '</td></tr></table>'

    + '<h2 style="font-size:.95rem;border-bottom:1px solid #ccc;padding-bottom:2px">Diagnosis / Disability</h2>'
    + '<p style="white-space:pre-wrap">' + (p.diagnosis ? escapeHtml(p.diagnosis) : '<span style="color:var(--ink-soft)">Not on file.</span>') + '</p>'

    + '<h2 style="font-size:.95rem;border-bottom:1px solid #ccc;padding-bottom:2px">Medications</h2>'
    + '<p style="white-space:pre-wrap">' + (p.medications ? escapeHtml(p.medications) : '<span style="color:var(--ink-soft)">None on file.</span>') + '</p>'

    + '<h2 style="font-size:.95rem;border-bottom:1px solid #ccc;padding-bottom:2px">ELC Service Areas</h2>'
    + '<p>' + (p.service_areas.length ? p.service_areas.map(escapeHtml).join(', ') : '<span style="color:var(--ink-soft)">None selected.</span>') + '</p>'

    + '<h2 style="font-size:.95rem;border-bottom:1px solid #ccc;padding-bottom:2px">Accommodations</h2>';

  if (!checked.length) {
    html += '<p style="color:var(--ink-soft)">No accommodations currently checked.</p>';
  } else {
    var byCategory = {};
    var order = [];
    checked.forEach(function(c) {
      if (!byCategory[c.category]) { byCategory[c.category] = []; order.push(c.category); }
      byCategory[c.category].push(c);
    });
    order.forEach(function(cat) {
      html += '<p style="margin-bottom:4px"><strong>' + escapeHtml(cat) + ':</strong></p><ul style="margin-top:0">'
        + byCategory[cat].map(function(c) { return '<li>' + escapeHtml(c.item) + (c.responsible_party ? ' <span style="color:#666">(' + escapeHtml(c.responsible_party) + ')</span>' : '') + '</li>'; }).join('')
        + '</ul>';
    });
  }

  html += '<div style="margin-top:36px;font-size:.85rem">'
    + '<p>Copy of Plan given to and approved by:</p>'
    + '<div style="display:flex;gap:40px;margin-top:36px">'
    + '<div style="flex:1;border-top:1px solid #333;padding-top:4px">Administrator Signature</div>'
    + '<div style="width:140px;border-top:1px solid #333;padding-top:4px">Date</div>'
    + '</div>'
    + '<div style="display:flex;gap:40px;margin-top:36px">'
    + '<div style="flex:1;border-top:1px solid #333;padding-top:4px">Signature of Parent/Guardian</div>'
    + '<div style="width:140px;border-top:1px solid #333;padding-top:4px">Date</div>'
    + '</div></div>';

  html += '</div>';
  return html;
}

function previewSection504Click() {
  var container = document.getElementById('print-report');
  if (!container) return;
  container.innerHTML = renderPrintPreviewActions_('printed_504_plan') + buildSection504Html_();
  container.classList.add('preview-visible');
}

// ── IEP Goals (Phase 6i) ──────────────────────────────────────
//
// A formal, legally-documented objective -- distinct from the Accommodations
// & Modifications checklist just above (a specific support/strategy in use,
// not a legal goal). Never edited in place: closing a goal out as
// Met/Discontinued/Revised (and for Revised, opening a new linked goal) is
// the only way it changes, same append-mostly-log convention as the access
// audit trail. See IepGoals.gs.

/**
 * Discontinued and Revised used to share the same plain grey badge, with no
 * visual cue that they mean very different things (an SME review flagged
 * this as a likely real point of staff confusion, revisited 2026-08-04) --
 * Revised now gets the navy "info" badge (something to follow -- see the
 * "→ Revised into: ..." line below) while Discontinued stays neutral grey
 * (a true dead end, nothing further happens).
 */
function iepGoalStatusBadgeClass_(status) {
  if (status === 'Active') return 'badge-strategic';
  if (status === 'Met') return 'badge-ok';
  if (status === 'Revised') return 'badge-info';
  return 'badge-neutral'; // Discontinued
}

/**
 * The year dropdown's options come from the school years actually present
 * among this student's OWN goals, plus the current school year always
 * available even with zero goals yet -- deliberately not a round trip to
 * getAvailableSchoolYears (that's sourced from Assessment_Sessions across
 * every student, and the Profile page doesn't otherwise need it). Sorted
 * newest first, same direction as the goals list itself.
 */
function iepGoalYearOptions_(goals) {
  var years = {};
  years[schoolYearGuess_()] = true;
  (goals || []).forEach(function(g) { if (g.school_year) years[g.school_year] = true; });
  return Object.keys(years).sort().reverse();
}

function onIepGoalYearFilterChange_() {
  state.iepGoalYearFilter = document.getElementById('iepgoal-year-filter').value;
  renderProfile();
}

/** Phase 6i: returns body-only HTML, same "no self-wrapping card" convention as renderSupportSection_ above. */
function renderIepGoalsSection_() {
  var goals = state.currentIepGoals || [];
  if (state.iepGoalYearFilter === undefined) state.iepGoalYearFilter = schoolYearGuess_();
  var years = iepGoalYearOptions_(goals);
  var visible = state.iepGoalYearFilter ? goals.filter(function(g) { return g.school_year === state.iepGoalYearFilter; }) : goals;

  var html = '<div class="field" style="max-width:220px"><label>School year</label>'
    + '<select id="iepgoal-year-filter" onchange="onIepGoalYearFilterChange_()">'
    + '<option value=""' + (state.iepGoalYearFilter === '' ? ' selected' : '') + '>All years</option>'
    + years.map(function(y) { return '<option value="' + escapeHtml(y) + '"' + (state.iepGoalYearFilter === y ? ' selected' : '') + '>' + escapeHtml(y) + '</option>'; }).join('')
    + '</select></div>';

  if (visible.length === 0) {
    html += '<div class="empty-state">' + (goals.length === 0 ? 'No IEP goals logged yet.' : 'No goals for ' + escapeHtml(state.iepGoalYearFilter) + '.') + '</div>';
  } else {
    // Administrator/ELC Staff only (mirrors deleteIepGoal's server-side
    // gate) -- hidden entirely for anyone else so it's not a dead click,
    // same convention as the 504 Plan Edit/Delete buttons above.
    var canDelete = !!(state.myAccess && (state.myAccess.is_administrator || state.myAccess.is_elc_staff));
    visible.forEach(function(g) {
      var revisedInto = (goals || []).filter(function(other) { return other.revised_from_goal_id === g.goal_id; })[0];
      // A goal already revised into a newer one can't be deleted (would
      // orphan that history -- deleteIepGoal enforces this server-side
      // too) -- omitted here rather than shown and left to fail.
      var deleteBtn = (canDelete && !revisedInto)
        ? '<button class="btn btn-secondary btn-small" style="border-color:#ef4444;color:#b91c1c" onclick="deleteIepGoalClick_(\'' + g.goal_id + '\')">Delete</button>'
        : '';

      html += '<div class="session-item">'
        + '<div class="session-head"><div>'
        + '<div class="session-title">' + escapeHtml(g.area) + '</div>'
        + '<div class="session-meta">Entered ' + fmtDate(g.entered_date) + ' · ' + escapeHtml(g.school_year) + '</div>'
        + '</div><span class="badge ' + iepGoalStatusBadgeClass_(g.status) + '">' + escapeHtml(g.status) + '</span></div>'
        + '<div style="margin-top:6px">' + escapeHtml(g.goal_text) + '</div>'
        + (g.baseline ? '<div class="muted" style="margin-top:4px;font-size:.8rem">Baseline: ' + escapeHtml(g.baseline) + '</div>' : '')
        + (g.target_criterion ? '<div class="muted" style="margin-top:2px;font-size:.8rem">Target: ' + escapeHtml(g.target_criterion) + '</div>' : '')
        + (g.status === 'Met' ? '<div class="muted" style="margin-top:4px;font-size:.8rem">Met ' + fmtDate(g.completed_date) + '</div>' : '')
        + (g.outcome_note ? '<div class="muted" style="margin-top:4px;font-size:.8rem;font-style:italic">' + escapeHtml(g.outcome_note) + '</div>' : '')
        + (revisedInto ? '<div class="muted" style="margin-top:4px;font-size:.8rem">→ Revised into: ' + escapeHtml(revisedInto.goal_text) + '</div>' : '')
        + (g.status === 'Active'
            ? '<div class="btn-row" style="margin-top:8px">'
              + '<button class="btn btn-secondary btn-small" onclick="markIepGoalMetClick_(\'' + g.goal_id + '\')">Mark Met</button>'
              + '<button class="btn btn-secondary btn-small" onclick="showReviseIepGoalForm_(\'' + g.goal_id + '\')">Revise</button>'
              + '<button class="btn btn-secondary btn-small" onclick="showDiscontinueIepGoalForm_(\'' + g.goal_id + '\')">Discontinue</button>'
              + deleteBtn + '</div>'
            : (deleteBtn ? '<div class="btn-row" style="margin-top:8px">' + deleteBtn + '</div>' : ''))
        + '<div id="iepgoal-action-slot-' + g.goal_id + '"></div>'
        + '</div>';
    });
  }

  html += '<div style="margin-top:10px"><button class="btn btn-primary btn-small" onclick="showAddIepGoalForm_()">+ Log IEP Goal</button></div>'
    + '<div id="iepgoal-form-slot"></div>';
  return html;
}

function showAddIepGoalForm_() {
  var render = function() {
    var slot = document.getElementById('iepgoal-form-slot');
    slot.innerHTML = '<div style="margin-top:14px;border-top:1px solid var(--line);padding-top:14px">'
      + '<div class="field"><label>Area</label><select id="iepgoal-area">'
      + state.iepGoalAreas.map(function(a) { return '<option>' + escapeHtml(a) + '</option>'; }).join('')
      + '</select></div>'
      + '<div class="field"><label>Goal</label><textarea id="iepgoal-text" rows="3" placeholder="e.g. Given a grade-level passage, Ada will read 90 wcpm with 95% accuracy by the next annual review."></textarea></div>'
      + '<div class="field"><label>Baseline (optional)</label><input type="text" id="iepgoal-baseline" placeholder="e.g. 45 wcpm cold read" /></div>'
      + '<div class="field"><label>Target criterion (optional)</label><input type="text" id="iepgoal-target" placeholder="e.g. 80% accuracy, 3 consecutive probes" /></div>'
      + '<div class="btn-row">'
      + '<button class="btn btn-primary btn-small" onclick="submitAddIepGoal_()">Log It</button>'
      + '<button class="btn btn-secondary btn-small" onclick="document.getElementById(\'iepgoal-form-slot\').innerHTML=\'\'">Cancel</button>'
      + '</div></div>';
  };
  if (state.iepGoalAreas) { render(); return; }
  call('getIepGoalAreas').then(function(areas) {
    if (!areas) throw new Error('getIepGoalAreas returned nothing.');
    state.iepGoalAreas = areas;
    render();
  }).catch(function(err) { toast('Error: ' + err.message); });
}

function submitAddIepGoal_() {
  var area = document.getElementById('iepgoal-area').value;
  var goalText = document.getElementById('iepgoal-text').value.trim();
  var baseline = document.getElementById('iepgoal-baseline').value.trim();
  var target = document.getElementById('iepgoal-target').value.trim();
  if (!goalText) { toast('Goal text is required.'); return; }
  call('addIepGoal', state.currentStudent.student_id, area, goalText, baseline, target).then(function() {
    toast('IEP goal logged.');
    openStudent(state.currentStudent.student_id);
  }).catch(function(err) { toast('Error: ' + err.message); });
}
