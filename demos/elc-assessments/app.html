    // given.
    + '<div class="field"><label>Administration date <span class="muted" style="font-weight:400">(required)</span></label><input type="date" id="ca-date" value="' + c.administration_date + '" required /><div id="ca-date-error" class="field-error-msg" style="display:none"></div></div>'
    + '<div class="field"><label>Grade at administration</label><select id="ca-grade" onchange="onGradeOrSeasonChanged()">'
    + (function() {
        var current = normalizeGradeKey_(c.grade_at_admin);
        return NEW_ASSESSMENT_GRADE_OPTIONS.map(function(g) {
          return '<option value="' + g + '"' + (current === g ? ' selected' : '') + '>' + (NEW_ASSESSMENT_GRADE_LABELS_[g] || g) + '</option>';
        }).join('');
      })()
    + '</select></div>'
    + '</div>'
    + '<div class="field-row">'
    + '<div class="field"><label>School year</label><select id="ca-year" onchange="onSchoolYearChanged_()">'
    + (state.availableSchoolYears || []).map(function(y) { return '<option value="' + escapeHtml(y) + '"' + (c.school_year === y ? ' selected' : '') + '>' + escapeHtml(y) + '</option>'; }).join('')
    + '</select></div>';

  if (type === 'dibels' || type === 'lexile' || type === 'dra' || type === 'core_phonics' || type === 'easycbm' || type === 'easycbm_math') {
    // 'Other' (2026-09-22, at the school's request): for an assessment
    // given outside the three fixed benchmark windows -- a progress-
    // monitoring check, a re-test after an intervention, etc. Benchmark
    // tiering naturally comes back "not published" for it (DIBELS/easyCBM's
    // season-to-period lookups only know Fall/Winter/Spring -- see
    // DIBELS_SEASON_TO_PERIOD, Dibels.gs), which is correct: there IS no
    // seasonal cutoff to compare an off-cycle score against. The raw score
    // and its real administration date still save normally either way.
    html += '<div class="field"><label>Season</label><select id="ca-season" onchange="onGradeOrSeasonChanged()">'
      + ['Fall','Winter','Spring','Other'].map(function(s) { return '<option' + (c.season===s?' selected':'') + '>' + s + '</option>'; }).join('')
      + '</select></div>';
  }
  if (type === 'easycbm_math') {
    // 2026-09-22, at the school's request: when a student can't attempt
    // their OWN grade's test and is given a lower grade's test instead,
    // this is a SEPARATE field from "Grade at administration" above --
    // that one stays the student's real current grade (roster/compliance
    // depend on it), this one (optional, blank = same as their own grade)
    // is only which grade's benchmark table the entered scores get scored
    // against. See ASSESSMENT_REGISTRY.easycbm_math.score, Registry.gs.
    html += '<div class="field"><label>Test Grade Level <span class="muted" style="font-weight:400">(optional — if different from the student\'s own grade)</span></label><select id="ca-test-grade" onchange="onGradeOrSeasonChanged()">'
      + '<option value="">Same as student\'s grade</option>'
      + NEW_ASSESSMENT_GRADE_OPTIONS.map(function(g) { return '<option value="' + g + '"' + (c.test_grade_level === g ? ' selected' : '') + '>' + (NEW_ASSESSMENT_GRADE_LABELS_[g] || g) + '</option>'; }).join('')
      + '</select></div>';
  }
  html += '<div class="field"><label>Administered by</label><select id="ca-admin-role">'
    + '<option value="">Select…</option>'
    + state.administratorRoles.map(function(r) { return '<option' + (c.administrator_role === r ? ' selected' : '') + '>' + escapeHtml(r) + '</option>'; }).join('')
    + '</select><div id="ca-admin-role-error" class="field-error-msg" style="display:none"></div></div>';
  html += '</div>';

  html += '<div class="field"><label>Notes / observations (optional)</label>'
    + '<textarea id="ca-notes" rows="2" placeholder="Anything worth remembering about this administration...">' + escapeHtml(c.notes || '') + '</textarea></div>';

  html += '<div id="type-specific-input">' + renderTypeSpecificInput_(type) + '</div>';

  html += '<div style="margin-top:14px"><button class="btn btn-primary" id="ca-save-btn" onclick="collectAndSubmit()">Score &amp; Save →</button></div></div>';
  app.innerHTML = html;

  if (type === 'core_phonics') attachCorePhonicsHandlers_();
}

/**
 * Real find (2026-09-10): "Grade at administration" defaulted once from
 * the student's CURRENT grade when the Score Assessment flow opened, then
 * never recalculated -- so changing "School year" to log a past-year test
 * silently left Grade at Administration wrong unless someone remembered to
 * ALSO fix it by hand. That produced real corrupted session data (see
 * GradeAudit.gs) that took a manual cleanup pass to fix. This recomputes a
 * suggested grade every time School year changes, by stepping the
 * student's current grade back one level per prior year -- still just a
 * dropdown selection the picker can freely override (e.g. for a genuinely
 * retained student), not a hidden/locked value.
 */
function onSchoolYearChanged_() {
  var yearEl = document.getElementById('ca-year');
  var gradeEl = document.getElementById('ca-grade');
  if (!yearEl || !gradeEl || !state.currentStudent) return;

  var currentStart = schoolYearStartYear_(schoolYearGuess_());
  var selectedStart = schoolYearStartYear_(yearEl.value);
  var yearsBack = (currentStart !== null && selectedStart !== null) ? (currentStart - selectedStart) : null;
  if (yearsBack === null || yearsBack < 0) return; // a future/unrecognized year -- nothing sensible to suggest

  var suggested = stepGradeBack_(state.currentStudent.grade, yearsBack);
  if (suggested && gradeEl.querySelector('option[value="' + suggested + '"]')) {
    gradeEl.value = suggested;
  }
  onGradeOrSeasonChanged(); // keep any grade-dependent measure inputs (DIBELS/easyCBM/CORE Phonics) in sync with the new suggestion
}

/** Re-renders just the type-specific input area when grade/season changes -- DIBELS'/easyCBM's measure checklists and CORE Phonics' part list both depend on grade (and CORE Phonics on season too). */
function onGradeOrSeasonChanged() {
  var type = state.newAssessment.type;
  if (type !== 'dibels' && type !== 'core_phonics' && type !== 'easycbm' && type !== 'easycbm_math') return;
  document.getElementById('type-specific-input').innerHTML = renderTypeSpecificInput_(type);
  if (type === 'core_phonics') attachCorePhonicsHandlers_();
}

function renderTypeSpecificInput_(type) {
  if (type === 'core_phonics') return renderCorePhonicsInput_();
  if (type === 'dibels') return renderDibelsInput_();
  if (type === 'easycbm') return renderEasyCbmInput_();
  if (type === 'easycbm_math') return renderEasyCbmMathInput_();
  if (type === 'lexile') return '<div class="field"><label>Lexile Score (e.g. 620L or BR100L)</label><input type="text" id="in-lexile" placeholder="e.g. 620L" /></div>'
    + '<div class="field"><label>Words Correct Per Minute <span class="muted" style="font-weight:400">(required — benchmarked against Hasbrouck &amp; Tindal ORF norms)</span></label><input type="number" id="in-lexile-wcpm" min="0" required /></div>';
  if (type === 'dra') return '<div class="field"><label>Guided Reading Level</label><select id="in-dra-grl">'
      + state.grlLetters.map(function(g) { return '<option value="' + g + '">' + g + '</option>'; }).join('')
      + '</select></div>'
    + '<div class="field"><label>Words Correct Per Minute <span class="muted" style="font-weight:400">(required — benchmarked against Hasbrouck &amp; Tindal ORF norms)</span></label><input type="number" id="in-dra-wcpm" min="0" required /></div>';
  return '';
}

// -- CORE Phonics item-level entry --
var corePhonicsMarks = {};
var corePhonicsTouched = {}; // partId -> bool[] -- has this item ever been tapped (regardless of resulting value)?
var corePhonicsLastTapped = null; // { partId, idx } of the most recently tapped chip, for a "where did I leave off" anchor

/** Mirrors corePhonicsGradeBucket_ in Assessments/CorePhonics.gs -- keep these two in sync. */
function corePhonicsGradeBucket_(grade) {
  var g = String(grade || '').trim().toUpperCase();
  if (g === 'K' || g === 'KINDERGARTEN') return 'K';
  var n = parseInt(g, 10);
  if (n === 1) return '1';
  if (n === 2) return '2';
  return '3+';
}

/**
 * Normalizes free-text grade entry ("1st Grade", "Grade 1", " 1 ", "K5") to
 * the canonical key ('K','1'..'8') server data is keyed by. Unlike
 * corePhonicsGradeBucket_, this does NOT collapse grades 3+ into one
 * bucket -- DIBELS (and anything else keyed by exact grade) cares about
 * the real grade, not a bucket. Falls back to the trimmed/uppercased raw
 * string if nothing numeric is found, so an already-clean value ("K",
 * "1") still passes through unchanged.
 */
function normalizeGradeKey_(grade) {
  var g = String(grade || '').trim().toUpperCase();
  if (!g) return '';
  if (g.indexOf('K') === 0) return 'K';
  var m = g.match(/\d+/);
  return m ? String(parseInt(m[0], 10)) : g;
}

// partId -> group index the teacher marked as "stopped after" (undefined = fully administered).
var corePhonicsStopGroup = {};

/**
 * Parts E-K each have 3 administration lines (2 real-word + 1 made-up-word);
 * Part L is administered column-by-column (see CORE Phonics Survey p.42
 * instructions); Parts A/B/C have no real/made-up split but are still
 * printed in multiple rows on the Record Form. Defines those groups by item
 * index so the "Stop administration here" control knows what to exclude.
 * Parts D_long/D_short are only 5 items each with no printed row split, but
 * a student can still be discontinued partway through them same as any
 * other part, so each item gets its own single-item checkpoint below.
 */
function corePhonicsPartGroups_(partId) {
  if (partId === 'L') {
    return [
      { label: 'Column 1 — real words (2-syllable)', indices: [0, 3, 6, 9, 12, 15, 18, 21] },
      { label: 'Column 2 — real words', indices: [1, 4, 7, 10, 13, 16, 19, 22] },
      { label: 'Column 3 — made-up words', indices: [2, 5, 8, 11, 14, 17, 20, 23] }
    ];
  }
  if (['E', 'F', 'G', 'H', 'I', 'J', 'K'].indexOf(partId) !== -1) {
    return [
      { label: 'Real words (line 1)', indices: [0, 1, 2, 3, 4] },
      { label: 'Real words (line 2)', indices: [5, 6, 7, 8, 9] },
      { label: 'Made-up words', indices: [10, 11, 12, 13, 14] }
    ];
  }
  if (partId === 'A' || partId === 'B') {
    // Printed on the Record Form in 3 rows of 9/9/8 -- gives a stop point for
    // early discontinuation (e.g. "tiring or making many consecutive errors")
    // instead of the remaining letters defaulting to correct.
    return [
      { label: 'Row 1', indices: [0, 1, 2, 3, 4, 5, 6, 7, 8] },
      { label: 'Row 2', indices: [9, 10, 11, 12, 13, 14, 15, 16, 17] },
      { label: 'Row 3', indices: [18, 19, 20, 21, 22, 23, 24, 25] }
    ];
  }
  if (partId === 'C') {
    // 3 rows of 7 on the Record Form.
    return [
      { label: 'Row 1', indices: [0, 1, 2, 3, 4, 5, 6] },
      { label: 'Row 2', indices: [7, 8, 9, 10, 11, 12, 13] },
      { label: 'Row 3', indices: [14, 15, 16, 17, 18, 19, 20] }
    ];
  }
  if (partId === 'D_long' || partId === 'D_short') {
    return [
      { label: 'Item 1', indices: [0] },
      { label: 'Item 2', indices: [1] },
      { label: 'Item 3', indices: [2] },
      { label: 'Item 4', indices: [3] },
      { label: 'Item 5', indices: [4] }
    ];
  }
  return null;
}

function renderCorePhonicsInput_() {
  corePhonicsMarks = {};
  corePhonicsTouched = {};
  corePhonicsLastTapped = null;
  corePhonicsStopGroup = {};
  var gradeEl = document.getElementById('ca-grade');
  var seasonEl = document.getElementById('ca-season');
  var grade = gradeEl ? gradeEl.value.trim() : state.newAssessment.common.grade_at_admin;
  var season = seasonEl ? seasonEl.value : state.newAssessment.common.season;

  var bucket = state.corePhonicsAvailability[corePhonicsGradeBucket_(grade)];
  var applicableIds = (bucket && bucket[season]) || state.corePhonicsParts.map(function(p) { return p.id; });
  var applicableParts = state.corePhonicsParts.filter(function(p) { return applicableIds.indexOf(p.id) !== -1; });

  var html = '<p class="muted" style="margin:8px 0">'
    + (grade ? 'Showing parts given at grade ' + escapeHtml(grade) + ', ' + escapeHtml(season) + ' per the official CORE Phonics administration chart. ' : '')
    + 'Every word defaults to correct — tap a word only if the student got it wrong (tap again to undo). '
    + 'A tapped-and-confirmed word turns pale green; a blue ring marks whichever word you tapped most recently, so you '
    + 'always have an anchor for where you left off. If you stopped partway through a part '
    + '(a line/row wasn\'t given, or testing was discontinued early), check "Stopped here" on the last row actually given so the rest are excluded instead of counted correct.</p>';

  applicableParts.forEach(function(part) {
    corePhonicsMarks[part.id] = part.items.map(function() { return true; }); // default: correct
    corePhonicsTouched[part.id] = part.items.map(function() { return false; });
    var maxScore = part.items.length;
    html += '<details class="part-block" open><summary>Part ' + part.id.replace('_long',' (long)').replace('_short',' (short)') + ' — ' + escapeHtml(part.label)
      + ' <span class="part-score" id="score-' + part.id + '">' + maxScore + '/' + maxScore + '</span></summary>'
      + '<div id="part-content-' + part.id + '">' + renderCorePhonicsPartInner_(part) + '</div></details>';
  });
  return html;
}

function renderCorePhonicsWordGrid_(partId, items, indices, disabled) {
  return '<div class="word-grid">' + indices.map(function(idx) {
    var cls = 'word-chip';
    if (disabled) {
      cls += ' word-chip-disabled';
    } else {
      if (corePhonicsMarks[partId][idx] === false) cls += ' incorrect';
      else if (corePhonicsTouched[partId][idx]) cls += ' correct';
      if (corePhonicsLastTapped && corePhonicsLastTapped.partId === partId && corePhonicsLastTapped.idx === idx) cls += ' last-tapped';
    }
    return '<div class="' + cls + '" data-part="' + partId + '" data-idx="' + idx + '">' + escapeHtml(items[idx]) + '</div>';
  }).join('') + '</div>';
}

function renderCorePhonicsPartInner_(part) {
  var groups = corePhonicsPartGroups_(part.id);
  if (!groups) {
    return renderCorePhonicsWordGrid_(part.id, part.items, part.items.map(function(_, i) { return i; }), false);
  }

  var stopGroup = corePhonicsStopGroup[part.id];
  var html = '';
  groups.forEach(function(group, gi) {
    var disabled = (stopGroup !== undefined && gi > stopGroup);
    group.indices.forEach(function(idx) {
      // Disabled groups score as not-administered (null); re-enabled groups reset to the correct default.
      if (disabled) {
        corePhonicsMarks[part.id][idx] = null;
        corePhonicsTouched[part.id][idx] = false;
      } else if (corePhonicsMarks[part.id][idx] === null) {
        corePhonicsMarks[part.id][idx] = true;
      }
    });
    html += '<div class="admin-group">'
      + '<div class="admin-group-label">' + escapeHtml(group.label) + (disabled ? ' <span class="muted">— not given</span>' : '') + '</div>'
      + renderCorePhonicsWordGrid_(part.id, part.items, group.indices, disabled)
      + '</div>';
    if (gi < groups.length - 1) {
      html += '<label class="stop-marker-label"><input type="checkbox" ' + (stopGroup === gi ? 'checked' : '')
        + ' onchange="toggleCorePhonicsStop_(\'' + part.id + '\',' + gi + ',this.checked)" /> Stopped here — remaining lines not given</label>';
    }
  });
  return html;
}

function toggleCorePhonicsStop_(partId, groupIndex, checked) {
  corePhonicsStopGroup[partId] = checked ? groupIndex : undefined;
  var part = state.corePhonicsParts.filter(function(p) { return p.id === partId; })[0];
  document.getElementById('part-content-' + partId).innerHTML = renderCorePhonicsPartInner_(part);
  attachCorePhonicsHandlersForPart_(partId);
  updateCorePhonicsScore_(partId);
}

function attachCorePhonicsHandlers_() {
  state.corePhonicsParts.forEach(function(part) {
    if (document.getElementById('part-content-' + part.id)) attachCorePhonicsHandlersForPart_(part.id);
  });
}

function attachCorePhonicsHandlersForPart_(partId) {
  var container = document.getElementById('part-content-' + partId);
  if (!container) return;
  container.querySelectorAll('.word-chip:not(.word-chip-disabled)').forEach(function(chip) {
    chip.addEventListener('click', function() {
      var idx = Number(chip.getAttribute('data-idx'));
      var next = corePhonicsMarks[partId][idx] === true ? false : true; // toggle correct <-> incorrect
      corePhonicsMarks[partId][idx] = next;
      corePhonicsTouched[partId][idx] = true;
      chip.classList.toggle('incorrect', next === false);
      chip.classList.toggle('correct', next === true);

      // Move the "last tapped" anchor to this chip.
      if (corePhonicsLastTapped) {
        var prevChip = document.querySelector('.word-chip[data-part="' + corePhonicsLastTapped.partId + '"][data-idx="' + corePhonicsLastTapped.idx + '"]');
        if (prevChip) prevChip.classList.remove('last-tapped');
      }
      corePhonicsLastTapped = { partId: partId, idx: idx };
      chip.classList.add('last-tapped');

      updateCorePhonicsScore_(partId);
    });
  });
}

function updateCorePhonicsScore_(partId) {
  var el = document.getElementById('score-' + partId);
  if (!el) return;
  var count = corePhonicsMarks[partId].filter(function(v) { return v === true; }).length;
  el.textContent = count + '/' + corePhonicsMarks[partId].length;
}

// -- DIBELS entry --
function renderDibelsInput_() {
  var gradeEl = document.getElementById('ca-grade');
  var grade = gradeEl ? gradeEl.value.trim() : state.newAssessment.common.grade_at_admin;
  var gradeKey = normalizeGradeKey_(grade);
  var applicable = state.dibelsMeasures.filter(function(m) {
    return !gradeKey || m.grades.indexOf(gradeKey) !== -1;
  });

  // Phase 37 (finding #34): a checkbox-then-value pattern used to require
  // two actions per measure. Typing a score is now the only signal needed --
  // a blank field just means that measure wasn't given, same meaning a
  // blank field already has everywhere else in this app (Lexile, DRA, etc).
  var html = '<p class="muted" style="margin:8px 0">'
    + (grade ? 'Showing measures given at grade ' + escapeHtml(grade) + ' per the official DIBELS administration timeline. ' : 'Enter a grade above to filter this list. ')
    + 'Enter a score for each measure that was administered; leave the rest blank. Enter raw counts only -- '
    + 'ORF Accuracy, Maze, and the Composite are all calculated automatically below once enough of the other measures '
    + 'are entered, the same way a real DIBELS Data System does.</p>';

  if (applicable.length === 0) {
    html += '<div class="empty-state">No DIBELS measures are published for that grade — double check the grade above.</div>';
    return html;
  }

  // Real find (2026-09-22, from the official Grade 2 Benchmark Scoring
  // Booklet): ORF Accuracy and Maze are DERIVED scores, not raw counts --
  // see the same-dated comment on ASSESSMENT_REGISTRY.dibels.score
  // (Registry.gs) for the formulas and why. Both get raw-count fields here
  // instead of their own single "type the final number" row, matching the
  // paper form's own two-step (raw counts -> calculated score) structure --
  // staff only ever type what they directly observed.
  applicable.forEach(function(m) {
    // Real find (2026-09-22, at the school's request): a manual "type the
    // final Composite number" box invited exactly the mistake this whole
    // raw-data-only redesign exists to prevent -- a typo'd or guessed
    // override silently beating the correct auto-calculated value with no
    // way to tell the two apart later. Composite is now ONLY ever the
    // live-calculated result shown below (see
    // updateDibelsCompositePreviewNew_) -- never its own input field.
    if (m.id === 'COMPOSITE') return;
    if (m.id === 'ORF_ACCURACY') {
      html += '<div class="measure-row">'
        + '<label class="check-label">Oral Reading Fluency — Errors</label>'
        + '<input type="number" step="1" min="0" id="dval-orf-errors" placeholder="errors" oninput="scheduleDibelsCompositePreviewNew_()" />'
        + '</div>';
      return;
    }
    if (m.id === 'MAZE') {
      html += '<div class="measure-row">'
        + '<label class="check-label">Maze — Correct</label>'
        + '<input type="number" step="1" min="0" id="dval-maze-correct" placeholder="correct replacements" oninput="scheduleDibelsCompositePreviewNew_()" />'
        + '</div>'
        + '<div class="measure-row">'
        + '<label class="check-label">Maze — Incorrect</label>'
        + '<input type="number" step="1" min="0" id="dval-maze-incorrect" placeholder="incorrect replacements" oninput="scheduleDibelsCompositePreviewNew_()" />'
        + '</div>';
      return;
    }
    html += '<div class="measure-row">'
      + '<label class="check-label">' + escapeHtml(m.label) + '</label>'
      + '<input type="number" step="0.5" id="dval-' + m.id + '" placeholder="' + escapeHtml(m.unit) + '" oninput="scheduleDibelsCompositePreviewNew_()" />'
      + '</div>';
  });
  // Live "will save as" preview (2026-09-17, at the school's request) --
  // see updateDibelsCompositePreviewNew_/previewDibelsComposite (Code.gs).
  // Only meaningful when Composite itself is being left blank for
  // auto-calculation, which is the normal case this whole preview exists
  // for; a manually-typed Composite value simply hides it (see that
  // function's own guard).
  html += '<div id="dibels-composite-preview" class="muted" style="font-size:.82rem;margin-top:4px"></div>';
  return html;
}

// ── Live DIBELS Composite preview (2026-09-17, at the school's request) ──
// Two entry points share one server call/render step: the New Assessment
// DIBELS form (renderDibelsInput_ above) and the session Edit form's
// DIBELS score fields (renderSessionScoreEditFields_ below) each have
// their own DOM id scheme, so each gets its own thin
// schedule/update pair, but both funnel into
// renderDibelsCompositePreviewResult_ for the actual server call.
// Debounced (same 400ms shape as the K5-6 roster picker's own debounce)
// so typing doesn't fire a server call per keystroke.
var dibelsCompositePreviewTimer_ = null;

/**
 * Folds the derived ORF Accuracy / Maze Adjusted values into a byMeasure
 * map for the live Composite preview only -- mirrors the server's own
 * formula (see ASSESSMENT_REGISTRY.dibels.score, Registry.gs) so the
 * preview's Composite estimate accounts for them, but this client-side
 * copy is never what actually gets saved; the real save always goes
 * through the server's own computation.
 */
function applyDerivedDibelsPreviewValues_(byMeasure, orfErrors, mazeCorrect, mazeIncorrect) {
  if (orfErrors !== '' && orfErrors !== null && orfErrors !== undefined && byMeasure.ORF_WORDS !== undefined) {
    var attempts = byMeasure.ORF_WORDS + Number(orfErrors);
    if (attempts > 0) byMeasure.ORF_ACCURACY = Math.round((byMeasure.ORF_WORDS / attempts) * 100 * 100) / 100;
  }
  if (mazeCorrect !== '' && mazeCorrect !== null && mazeCorrect !== undefined) {
    var incorrect = (mazeIncorrect !== '' && mazeIncorrect !== null && mazeIncorrect !== undefined) ? Number(mazeIncorrect) : 0;
    byMeasure.MAZE = Math.round((Number(mazeCorrect) - 0.5 * incorrect) * 100) / 100;
  }
}

function scheduleDibelsCompositePreviewNew_() {
  clearTimeout(dibelsCompositePreviewTimer_);
  dibelsCompositePreviewTimer_ = setTimeout(updateDibelsCompositePreviewNew_, 400);
}
function updateDibelsCompositePreviewNew_() {
  var previewEl = document.getElementById('dibels-composite-preview');
  if (!previewEl) return;
  var gradeEl = document.getElementById('ca-grade');
  var seasonEl = document.getElementById('ca-season');
  var byMeasure = {};
  (state.dibelsMeasures || []).forEach(function(m) {
    if (m.id === 'COMPOSITE' || m.id === 'ORF_ACCURACY' || m.id === 'MAZE') return;
    var el = document.getElementById('dval-' + m.id);
    if (el && el.value !== '') byMeasure[m.id] = Number(el.value);
  });
  var orfErrorsEl = document.getElementById('dval-orf-errors');
  var mazeCorrectEl = document.getElementById('dval-maze-correct');
  var mazeIncorrectEl = document.getElementById('dval-maze-incorrect');
  applyDerivedDibelsPreviewValues_(byMeasure, orfErrorsEl ? orfErrorsEl.value : '', mazeCorrectEl ? mazeCorrectEl.value : '', mazeIncorrectEl ? mazeIncorrectEl.value : '');
  var dateEl = document.getElementById('ca-date');
  renderDibelsCompositePreviewResult_(previewEl, gradeEl ? gradeEl.value : '', seasonEl ? seasonEl.value : '', byMeasure, dateEl ? dateEl.value : '');
}

function scheduleDibelsCompositePreviewEdit_(sessionId) {
  clearTimeout(dibelsCompositePreviewTimer_);
  dibelsCompositePreviewTimer_ = setTimeout(function() { updateDibelsCompositePreviewEdit_(sessionId); }, 400);
}
function updateDibelsCompositePreviewEdit_(sessionId) {
  var previewEl = document.getElementById('dibels-composite-preview-' + sessionId);
  if (!previewEl) return;
  var gradeEl = document.getElementById('se-grade-' + sessionId);
  var seasonEl = document.getElementById('se-season-' + sessionId);
  var byMeasure = {};
  (state.dibelsMeasures || []).forEach(function(m) {
    if (m.id === 'COMPOSITE' || m.id === 'ORF_ACCURACY' || m.id === 'MAZE') return;
    var el = document.getElementById('se-dval-' + sessionId + '-' + m.id);
    if (el && el.value !== '') byMeasure[m.id] = Number(el.value);
  });
  var orfErrorsEl = document.getElementById('se-dval-orf-errors-' + sessionId);
  var mazeCorrectEl = document.getElementById('se-dval-maze-correct-' + sessionId);
  var mazeIncorrectEl = document.getElementById('se-dval-maze-incorrect-' + sessionId);
  applyDerivedDibelsPreviewValues_(byMeasure, orfErrorsEl ? orfErrorsEl.value : '', mazeCorrectEl ? mazeCorrectEl.value : '', mazeIncorrectEl ? mazeIncorrectEl.value : '');
  var dateEl = document.getElementById('se-date-' + sessionId);
  renderDibelsCompositePreviewResult_(previewEl, gradeEl ? gradeEl.value : '', seasonEl ? seasonEl.value : '', byMeasure, dateEl ? dateEl.value : '');
}

/** Shared server-call + render step for both preview entry points above -- see previewDibelsComposite (Code.gs). */
function renderDibelsCompositePreviewResult_(previewEl, grade, season, byMeasure, administrationDate) {
  call('previewDibelsComposite', grade, season, byMeasure, administrationDate).then(function(r) {
    if (!r || !previewEl) return;
    if (r.composite !== null && r.composite !== undefined) {
      previewEl.innerHTML = 'Composite Score (will save as): <strong>' + escapeHtml(String(r.composite)) + '</strong>' + (r.tier ? ' — ' + escapeHtml(r.tier) : '');
    } else if (r.missing_labels && r.missing_labels.length) {
      previewEl.textContent = 'Composite will calculate once these are entered: ' + r.missing_labels.join(', ');
    } else {
      previewEl.innerHTML = '';
    }
  }).catch(function() { /* preview is a nice-to-have -- a transient failure here shouldn't toast/interrupt data entry */ });
}

function renderEasyCbmInput_() {
  var gradeEl = document.getElementById('ca-grade');
  var grade = gradeEl ? gradeEl.value.trim() : state.newAssessment.common.grade_at_admin;
  var gradeKey = normalizeGradeKey_(grade);
  var applicable = state.easyCbmMeasures.filter(function(m) {
    return !gradeKey || m.grades.indexOf(gradeKey) !== -1;
  });

  // Phase 37 (finding #34): see renderDibelsInput_ -- same change, same reason.
  var html = '<p class="muted" style="margin:8px 0">'
    + (grade ? 'Showing measures published at grade ' + escapeHtml(grade) + ' per the easyCBM Percentile Quick Reference. ' : 'Enter a grade above to filter this list. ')
    + 'Enter a score for each measure that was administered; leave the rest blank.</p>';

  if (applicable.length === 0) {
    html += '<div class="empty-state">No easyCBM measures are published for that grade — double check the grade above (this app covers grades K-6 reading measures only).</div>';
    return html;
  }

  applicable.forEach(function(m) {
    html += '<div class="measure-row">'
      + '<label class="check-label">' + escapeHtml(m.label) + '</label>'
      + '<input type="number" step="0.5" id="eval-' + m.id + '" placeholder="' + escapeHtml(m.unit) + '" />'
      + '</div>';
  });
  return html;
}

function renderEasyCbmMathInput_() {
  var gradeEl = document.getElementById('ca-grade');
  var grade = gradeEl ? gradeEl.value.trim() : state.newAssessment.common.grade_at_admin;
  // 2026-09-22, at the school's request: if a Test Grade Level override is
  // set (a lower-grade test given because the student can't attempt their
  // own grade's), the measure list shown/filtered here should match the
  // TEST actually being given, not the student's own grade -- same grade
  // this feeds into scoring (see collectAndSubmit's easycbm_math branch,
  // ASSESSMENT_REGISTRY.easycbm_math.score in Registry.gs).
  var testGradeEl = document.getElementById('ca-test-grade');
  var testGrade = testGradeEl ? testGradeEl.value : '';
  var effectiveGrade = testGrade || grade;
  var gradeKey = normalizeGradeKey_(effectiveGrade);
  var applicable = state.easyCbmMathMeasures.filter(function(m) {
    return !gradeKey || m.grades.indexOf(gradeKey) !== -1;
  });

  var html = '<p class="muted" style="margin:8px 0">'
    + (effectiveGrade ? 'Showing measures published at grade ' + escapeHtml(effectiveGrade) + ' per the easyCBM Percentile Quick Reference'
        + (testGrade ? ' (test grade level, not the student\'s own grade)' : '') + '. ' : 'Enter a grade above to filter this list. ')
    + 'Enter a score for each measure that was administered; leave the rest blank.</p>';

  if (applicable.length === 0) {
    html += '<div class="empty-state">No easyCBM Math measures are published for that grade — double check the grade above (this app covers grades K-6 math benchmarks only).</div>';
    return html;
  }

  applicable.forEach(function(m) {
    html += '<div class="measure-row">'
      + '<label class="check-label">' + escapeHtml(m.label) + '</label>'
      + '<input type="number" step="0.5" id="ecmval-' + m.id + '" placeholder="' + escapeHtml(m.unit) + '" />'
      + '</div>';
  });
  return html;
}

function collectAndSubmit() {
  var na = state.newAssessment;
  na.common.administration_date = document.getElementById('ca-date').value;
  var dateErrorEl = document.getElementById('ca-date-error');
  if (!na.common.administration_date) {
    // Real find (2026-09-22, at the school's request): this used to be
    // optional and silently defaulted to "whenever this was submitted"
    // (submitSession, Code.gs) -- required now, same visible-inline-error
    // pattern as the Administered By field just below, so there's never
    // any ambiguity about when an assessment was actually given.
    dateErrorEl.textContent = 'Administration date is required.';
    dateErrorEl.style.display = 'block';
    document.getElementById('ca-date').classList.add('field-invalid');
    document.getElementById('ca-date').focus();
    toast('Administration date is required.');
    return;
  }
  dateErrorEl.style.display = 'none';
  document.getElementById('ca-date').classList.remove('field-invalid');
  na.common.grade_at_admin = document.getElementById('ca-grade').value.trim();
  na.common.school_year = document.getElementById('ca-year').value.trim();
  var seasonEl = document.getElementById('ca-season');
  na.common.season = seasonEl ? seasonEl.value : '';
  var notesEl = document.getElementById('ca-notes');
  na.common.notes = notesEl ? notesEl.value.trim() : '';
  na.common.administrator_role = document.getElementById('ca-admin-role').value;
  var adminRoleErrorEl = document.getElementById('ca-admin-role-error');
  if (!na.common.administrator_role) {
    // Phase 30c (Phase 6b review finding): a blank submit used to only show
    // a transient toast, with nothing left on-screen once it faded to tell
    // the user WHICH field needs attention.
    adminRoleErrorEl.textContent = 'Please select who administered this assessment.';
    adminRoleErrorEl.style.display = 'block';
    document.getElementById('ca-admin-role').classList.add('field-invalid');
    document.getElementById('ca-admin-role').focus();
    toast('Please select who administered this assessment.');
    return;
  }
  adminRoleErrorEl.style.display = 'none';
  document.getElementById('ca-admin-role').classList.remove('field-invalid');
  // Phase 30c: remembered so the NEXT New Assessment entry (a different
  // student, or "assess next student" right after this one) defaults to
  // the same role instead of forcing a reselect every single time -- most
  // sessions are one staffer working through several students in a row.
  lastAdministratorRole_ = na.common.administrator_role;

  var input = {};
  if (na.type === 'core_phonics') {
    input.itemResults = corePhonicsMarks;
  } else if (na.type === 'dibels') {
    input.grade = na.common.grade_at_admin;
    input.season = na.common.season;
    input.entries = [];
    state.dibelsMeasures.forEach(function(m) {
      // Composite is never a manual entry (2026-09-22, at the school's
      // request -- see renderDibelsInput_'s same-dated comment); ORF
      // Accuracy and Maze are derived, not directly entered -- see
      // renderDibelsInput_'s dedicated raw-count fields for them, collected
      // separately right below instead of through this generic loop.
      if (m.id === 'COMPOSITE' || m.id === 'ORF_ACCURACY' || m.id === 'MAZE') return;
      // Phase 37 (finding #34): a non-empty value IS the inclusion signal now
      // -- no more separate checkbox to check first.
      var valEl = document.getElementById('dval-' + m.id);
      var val = valEl ? valEl.value : '';
      if (val !== '') input.entries.push({ measure: m.id, rawScore: Number(val) });
    });
    var orfErrorsEl = document.getElementById('dval-orf-errors');
    if (orfErrorsEl && orfErrorsEl.value !== '') input.orfErrors = Number(orfErrorsEl.value);
    var mazeCorrectEl = document.getElementById('dval-maze-correct');
    if (mazeCorrectEl && mazeCorrectEl.value !== '') input.mazeCorrect = Number(mazeCorrectEl.value);
    var mazeIncorrectEl = document.getElementById('dval-maze-incorrect');
    if (mazeIncorrectEl && mazeIncorrectEl.value !== '') input.mazeIncorrect = Number(mazeIncorrectEl.value);
  } else if (na.type === 'lexile') {
    var lexWcpm = document.getElementById('in-lexile-wcpm').value;
    if (lexWcpm === '') { toast('Words Correct Per Minute is required.'); return; }
    input.grade = na.common.grade_at_admin;
    input.season = na.common.season;
    input.lexileScore = document.getElementById('in-lexile').value.trim();
    input.wcpm = Number(lexWcpm);
  } else if (na.type === 'dra') {
    var draWcpm = document.getElementById('in-dra-wcpm').value;
    if (draWcpm === '') { toast('Words Correct Per Minute is required.'); return; }
    input.grade = na.common.grade_at_admin;
    input.season = na.common.season;
    input.grl = document.getElementById('in-dra-grl').value;
    input.wcpm = Number(draWcpm);
  } else if (na.type === 'easycbm') {
    input.grade = na.common.grade_at_admin;
    input.season = na.common.season;
    input.entries = [];
    state.easyCbmMeasures.forEach(function(m) {
      // Phase 37 (finding #34): see the DIBELS branch above -- same change.
      var valEl = document.getElementById('eval-' + m.id);
      var val = valEl ? valEl.value : '';
      if (val !== '') input.entries.push({ measure: m.id, rawScore: Number(val) });
    });
  } else if (na.type === 'easycbm_math') {
    input.grade = na.common.grade_at_admin;
    input.season = na.common.season;
    var testGradeEl = document.getElementById('ca-test-grade');
    na.common.test_grade_level = testGradeEl ? testGradeEl.value : '';
    if (na.common.test_grade_level) input.testGrade = na.common.test_grade_level;
    input.entries = [];
    state.easyCbmMathMeasures.forEach(function(m) {
      var valEl = document.getElementById('ecmval-' + m.id);
      var val = valEl ? valEl.value : '';
      if (val !== '') input.entries.push({ measure: m.id, rawScore: Number(val) });
    });
  }

  var payload = {
    student_id: state.currentStudent.student_id,
    assessment_type: na.type,
    administration_date: na.common.administration_date,
    school_year: na.common.school_year,
    grade_at_admin: na.common.grade_at_admin,
    season: na.common.season,
    notes: na.common.notes || '',
    administrator_role: na.common.administrator_role,
    input: input,
    fulfilling_request_id: na.fulfilling_request_id || null,
    test_grade_level: na.common.test_grade_level || ''
  };

  submitSessionPayload_(payload);
}

/**
 * Phase 36 (finding #16): the Save button used to stay clickable for the
 * entire round trip -- a fast double-click (or a slow connection) could fire
 * submitSession twice before the first response landed. Disabled for the
 * duration of each network call and re-enabled the moment control comes
 * back to the user (an error, or the duplicate-session confirm prompt), not
 * just on final success -- renderResults_ replaces the whole screen on
 * success anyway, so there's nothing to re-enable there.
 */
function submitSessionPayload_(payload) {
  var btn = document.getElementById('ca-save-btn');
  if (btn) btn.disabled = true;
  call('submitSession', payload).then(function(result) {
    if (result && result.grade_year_mismatch_warning) {
      if (btn) btn.disabled = false;
      showConfirm_(
        'Grade doesn\'t match this school year?',
        'You entered Grade ' + (NEW_ASSESSMENT_GRADE_LABELS_[result.entered_grade] || result.entered_grade) + ' for ' + escapeHtml(payload.school_year)
          + ', but based on this student\'s current grade, ' + escapeHtml(payload.school_year) + ' should be Grade ' + (NEW_ASSESSMENT_GRADE_LABELS_[result.expected_grade] || result.expected_grade)
          + '. If this student was genuinely held back a grade, this is expected -- otherwise, cancel and fix "Grade at administration" before saving.',
        'Save Anyway',
        function() {
          payload.confirm_grade_year_mismatch = true;
          submitSessionPayload_(payload);
        }
      );
      return;
    }
    if (result && result.duplicate_warning) {
      if (btn) btn.disabled = false;
      showConfirm_(
        'Already recorded this period?',
        'A ' + (ASSESSMENT_LABELS[payload.assessment_type] || payload.assessment_type) + ' session for this student already exists for '
          + escapeHtml(payload.season) + ' ' + escapeHtml(payload.school_year) + ' (administered '
          + escapeHtml(fmtDate(result.existing_session.administration_date)) + '). Save this as another session anyway?',
        'Save Anyway',
        function() {
          payload.confirm_duplicate = true;
          submitSessionPayload_(payload);
        }
      );
      return;
    }
    if (result && result.composite_incomplete_warning) {
      if (btn) btn.disabled = false;
      showConfirm_(
        'Missing measures needed for the Composite score',
        'The DIBELS Composite Score can\'t be calculated because these measures are still blank: ' + result.missing_measures.map(escapeHtml).join(', ')
          + '. Go back and enter them, or save this session without a Composite score.',
        'Save Without Composite',
        function() {
          payload.confirm_incomplete_composite = true;
          submitSessionPayload_(payload);
        }
      );
      return;
    }
    newAssessmentStep2Dirty_ = false;
    renderResults_(result);
  }).catch(function(err) {
    if (btn) btn.disabled = false;
    toast('Error: ' + err.message);
  });
}

function renderResults_(result) {
  // Phase 30e (Phase 6b review finding): the step indicator previously
  // never advanced past "Step 2 of 3" -- this results screen IS step 3, it
  // just never said so.
  var html = '<div class="card">'
    + '<p class="muted" style="font-size:.72rem;margin-bottom:4px">Step 3 of 3</p>'
    + '<div class="steps"><div class="step-dot done"></div><div class="step-dot done"></div><div class="step-dot active"></div></div>'
    + '<h2>Results Saved ✓</h2>';
  html += '<table class="trend-table"><thead><tr><th>Measure</th><th>Score</th><th>Tier</th></tr></thead><tbody>';
  Object.keys(result.measures).forEach(function(mid) {
    var m = result.measures[mid];
    html += '<tr><td>' + escapeHtml(m.label) + '</td><td>' + (m.raw_score != null ? escapeHtml(String(m.raw_score)) : '—') + (m.max_score ? ' / ' + m.max_score : '')
      + '</td><td>' + tierBadge(m.benchmark_tier) + (m.meaning ? '<div class="muted" style="margin-top:3px">' + escapeHtml(m.meaning) + '</div>' : '') + '</td></tr>';
  });
  html += '</tbody></table>';

  if (result.summary.concerns && result.summary.concerns.length) {
    html += '<h2 style="font-size:.95rem;margin-top:16px">Areas of Concern</h2>' + result.summary.concerns.map(function(c) { return '<div class="muted">• ' + escapeHtml(c) + '</div>'; }).join('');
  }
  if (result.summary.interventions && result.summary.interventions.length) {
    html += '<h2 style="font-size:.95rem;margin-top:16px">Suggested Next Steps</h2>' + result.summary.interventions.map(function(i) { return '<p style="margin-bottom:6px;font-size:.88rem">' + escapeHtml(i) + '</p>'; }).join('');
  }

  html += '<div class="btn-row" style="margin-top:16px">'
    + '<button class="btn btn-primary" onclick="openStudent(\'' + state.currentStudent.student_id + '\')">Done — Back to Student</button>'
    + '<button class="btn btn-secondary" onclick="assessNextStudentSameSettings_()">Record Next Student (same settings)</button>'
    + '</div>';
  html += '</div>';
  app.innerHTML = html;
}

// ── "Assess Next Student" shortcut (batch class-screening entry) ──
// Carries forward the just-used date/school year/season/administrator
// role to the next student -- built for a teacher screening a whole class
// in one sitting, where re-picking those same four fields for every
// single student is the real friction, not the scoring itself.

function assessNextStudentSameSettings_() {
  var chain = state.roster && state.roster.length ? Promise.resolve(state.roster) : call('getRoster');
  chain.then(function(roster) {
    if (!roster) throw new Error('getRoster returned nothing.');
    state.roster = roster;
    showAssessNextStudentPicker_();
  }).catch(function(err) { toast('Error: ' + err.message); });
}

function showAssessNextStudentPicker_() {
  var sortedRoster = (state.roster || []).slice().sort(function(a, b) {
    return (a.first_name + a.last_initial).localeCompare(b.first_name + b.last_initial);
  });
  var overlay = document.getElementById('modal-overlay');
  overlay.innerHTML = '<div class="card modal-card">'
    + '<h3>Record Next Student</h3>'
    + '<p>Same assessment type, date, school year, season, and administrator — just pick who\'s next.</p>'
    + '<div class="field"><label>Student</label><select id="assess-next-student">'
    + sortedRoster.map(function(s) { return '<option value="' + s.student_id + '">' + escapeHtml(s.first_name) + ' ' + escapeHtml(s.last_initial) + '. (Grade ' + escapeHtml(s.grade || '—') + ')</option>'; }).join('')
    + '</select></div>'
    + '<div class="modal-actions">'
    + '<button class="btn btn-secondary btn-small" onclick="hideConfirm_()">Cancel</button>'
    + '<button class="btn btn-primary btn-small" onclick="confirmAssessNextStudent_()">Continue</button>'
    + '</div></div>';
  overlay.classList.add('visible');
}

function confirmAssessNextStudent_() {
  var studentId = document.getElementById('assess-next-student').value;
  var priorCommon = state.newAssessment.common;
  var priorType = state.newAssessment.type;
  hideConfirm_();

  app.innerHTML = '<div class="card"><p class="muted">Loading student…</p></div>';
  loadStudent_(studentId).then(function(ok) {
    if (!ok) { toast('Could not load this student — try again.'); goToRoster(); return; }
    state.view = 'profile';
    updateNavActive_();
    state.newAssessment = {
      step: 2,
      type: priorType,
      fulfilling_request_id: null,
      // Carry forward the shared session-day fields; grade_at_admin comes
      // fresh from THIS student's own roster record (they may not be in
      // the same grade as whoever came before), and notes don't carry over.
      common: { administration_date: priorCommon.administration_date, grade_at_admin: state.currentStudent.grade || '', school_year: priorCommon.school_year, season: priorCommon.season, notes: '', administrator_role: priorCommon.administrator_role },
      input: {}
    };
    return ensureTypeDataLoaded_(priorType);
  }).then(function() {
    if (state.newAssessment) renderNewAssessmentStep2();
  }).catch(function(err) { toast('Error: ' + err.message); });
}

  if (!req) return '<p class="muted">Requirements reference didn\'t load -- try reopening Help.</p>';

  var gradeSet = {};
  ['reading', 'math'].forEach(function(area) { Object.keys(req[area] || {}).forEach(function(g) { gradeSet[g] = true; }); });
  var gradeList = Object.keys(gradeSet).sort(gradeSortCompareClient_);
  if (gradeList.length === 0) return '<p class="muted">No recurring benchmark requirements are currently configured.</p>';

  function labelsFor(area, g) { return ((req[area] && req[area][g]) || []).map(function(group) { return group.label; }); }

  return '<div style="overflow-x:auto"><table class="trend-table"><thead><tr><th>Grade</th><th>Reading</th><th>Math</th></tr></thead><tbody>'
    + gradeList.map(function(g) {
        var reading = labelsFor('reading', g);
        var math = labelsFor('math', g);
        return '<tr><td><strong>' + escapeHtml(g) + '</strong></td>'
          + '<td>' + (reading.length ? reading.map(escapeHtml).join('<br>') : '<span class="muted">—</span>') + '</td>'
          + '<td>' + (math.length ? math.map(escapeHtml).join('<br>') : '<span class="muted">—</span>') + '</td></tr>';
      }).join('')
    + '</tbody></table></div>'
    + '<p class="muted" style="font-size:.78rem;margin:8px 0 0">Only applies to students on the ELC caseload, flagged for that service area (Reading and/or Math) on the ELC Elementary sheet -- required at every benchmarking checkpoint (Fall/Winter/Spring). "X or Y" means either one satisfies it; both aren\'t needed. Kindergarten and grades 7+ have no recurring requirement configured here.</p>';
}

function renderHelp_() {
  var html = '<div class="card"><h2>Help &amp; Getting Started</h2>'
    + '<p class="muted" style="margin-bottom:12px">New here? <button class="btn btn-primary btn-small" onclick="showWelcomeTour_()">Take the Tour</button></p>'
    // 2026-10-08, at the school's request ("I feel like the guides are lost
    // where they are"): moved to the very top, ahead of Tutorials -- these
    // are a grab-and-print-right-now resource for an upcoming conference,
    // not a learning-to-use-the-app step, so they shouldn't be buried
    // behind two unrelated sections someone has to scroll past first.
    + '<h3 style="margin-top:0;margin-bottom:6px">Parent &amp; Conference Guides</h3>'
    + '<p class="muted" style="margin-bottom:10px;font-size:.82rem">A one-page, printable explanation of what each DIBELS measure assesses and what a low score may mean -- grade-specific, since the measures given change by grade. Handy to print and walk through at a parent-teacher conference.</p>'
    + '<div style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px">'
    + DIBELS_PARENT_GUIDE_BANDS_.map(function(b) {
        return '<button class="btn btn-secondary btn-small" onclick="previewDibelsParentGuideClick_(\'' + b.key + '\')">Print: ' + escapeHtml(b.label) + '</button>';
      }).join('')
    + '</div>'
    + '<h3 style="margin-top:18px;margin-bottom:6px">Tutorials</h3>'
    + TUTORIALS_.map(function(t) {
        return '<div class="faq-item"><div class="faq-q">' + escapeHtml(t.title) + '</div><ol style="margin:6px 0 0 20px;padding:0">'
          + t.steps.map(function(step) { return '<li class="muted" style="margin-bottom:6px">' + step + '</li>'; }).join('')
          + '</ol></div>';
      }).join('')
    + '<h3 style="margin-top:18px;margin-bottom:6px">Required Assessments by Grade</h3>'
    + '<p class="muted" style="margin-bottom:10px;font-size:.82rem">What\'s actually required at each benchmarking checkpoint (Fall/Winter/Spring) -- see Benchmark Checkpoints and the Dashboard\'s Benchmarking Overview for who\'s currently missing one of these.</p>'
    + requiredAssessmentsTableHtml_()
    + '<h3 style="margin-top:18px;margin-bottom:6px">Frequently Asked Questions</h3>'
    // 2026-10-05, at the school's request ("the question answer section
    // seems clunky... better formatting could be used to organize"):
    // grouped into sections (was one flat list), and answers render as
    // trusted HTML (same as TUTORIALS_ steps already do) instead of being
    // forced through escapeHtml, so a bulleted answer actually renders as
    // a list instead of printing literal "<ul>" text.
    + FAQ_SECTIONS_.map(function(section) {
        return '<h4 style="margin:14px 0 4px">' + escapeHtml(section.title) + '</h4>'
          + section.items.map(function(item) {
              return '<div class="faq-item"><div class="faq-q">' + escapeHtml(item.q) + '</div><div class="muted">' + item.a + '</div></div>';
            }).join('');
      }).join('')
    + '<h3 style="margin-top:18px;margin-bottom:6px">Glossary</h3>'
    + GLOSSARY_TERMS_.map(function(g) {
        return '<div class="faq-item"><span class="glossary-term">' + escapeHtml(g.term) + '</span> -- <span class="muted">' + escapeHtml(g.def) + '</span></div>';
      }).join('')
    + '<h3 style="margin-top:18px;margin-bottom:6px">Accommodation &amp; Modification Definitions</h3>'
    + '<p class="muted" style="margin-bottom:10px;font-size:.82rem">What each item on a student\'s Accommodation Checklist actually means and how to implement it -- from the school\'s "ELC Accommodation Definitions" document.</p>'
    + '<h4 style="margin:14px 0 4px">General Accommodations</h4>'
    + ACCOMMODATION_DEFINITIONS_.map(function(d) {
        return '<div class="faq-item"><span class="glossary-term">' + escapeHtml(d.term) + '</span> -- <span class="muted">' + escapeHtml(d.def) + '</span></div>';
      }).join('')
    + '<h4 style="margin:14px 0 4px">Assessment-Specific Accommodations</h4>'
    + ACCOMMODATION_ASSESSMENT_DEFINITIONS_.map(function(d) {
        return '<div class="faq-item"><span class="glossary-term">' + escapeHtml(d.term) + '</span> -- <span class="muted">' + escapeHtml(d.def) + '</span></div>';
      }).join('')
    + '<h4 style="margin:14px 0 4px">Modification</h4>'
    + '<div class="faq-item"><span class="muted">' + escapeHtml(MODIFICATION_DEFINITION_.def) + ' <strong>Examples:</strong> ' + escapeHtml(MODIFICATION_DEFINITION_.examples) + '</span></div>'
    // Real find, 2026-09-27 (independent code review, "design & spacing"):
    // this used an off-brand maroon (#800000) found nowhere else in the app
    // -- every other caution/important note uses the same established
    // danger red (#b91c1c) as error messages, delete buttons, and badges.
    + '<div class="faq-item"><span class="muted" style="color:#b91c1c">' + escapeHtml(MODIFICATION_DEFINITION_.note) + '</span></div>'
    + '</div>';
  app.innerHTML = html;
}

function showWelcomeTour_() {
  state.tourSteps = buildTourSteps_(state.myAccess);
  state.tourStep = 0;
  renderTourStep_();
}

function renderTourStep_() {
  var i = state.tourStep;
  var steps = state.tourSteps || buildTourSteps_(state.myAccess);
  var step = steps[i];
  var overlay = document.getElementById('modal-overlay');
  overlay.innerHTML = '<div class="card modal-card">'
    + '<p class="muted" style="margin-bottom:4px;font-size:.78rem">Step ' + (i + 1) + ' of ' + steps.length + '</p>'
    + '<h3>' + escapeHtml(step.title) + '</h3>'
    // 2026-10-05: body renders as trusted HTML (same as TUTORIALS_ steps and
    // the FAQ already do), not escapeHtml -- the Admin Tools/Dashboard steps
    // now use a real bulleted list instead of one run-on sentence.
    + '<div>' + step.body + '</div>'
    + '<div class="modal-actions">'
    + '<button class="btn btn-secondary btn-small" onclick="tourSkip_()">Skip</button>'
    + (i > 0 ? '<button class="btn btn-secondary btn-small" onclick="tourBack_()">Back</button>' : '')
    + '<button class="btn btn-primary btn-small" onclick="tourNext_()">' + (i === steps.length - 1 ? 'Done' : 'Next') + '</button>'
    + '</div></div>';
  overlay.classList.add('visible');
  overlay.onclick = function(e) { if (e.target === overlay) tourSkip_(); };
}

/** Distinct from the generic hideConfirm_ (shared by every other modal) -- Skip/backdrop-click on the tour specifically must also mark it seen, so the auto-launch (maybeAutoShowWelcomeTour_) never nags again after someone's dismissed it once. */
function tourSkip_() {
  markWelcomeTourSeen_();
  hideConfirm_();
}

function tourNext_() {
  var steps = state.tourSteps || buildTourSteps_(state.myAccess);
  if (state.tourStep >= steps.length - 1) { markWelcomeTourSeen_(); hideConfirm_(); return; }
  state.tourStep++;
  renderTourStep_();
}

function tourBack_() {
  if (state.tourStep <= 0) return;
  state.tourStep--;
  renderTourStep_();
}

/**
 * Hides the Dashboard/Staff Access nav buttons for accounts that can't use
 * them (Phase 20 -- the server independently enforces this via
 * requireDashboardAccess_/requireAdministrator_; this is purely so a
 * Grade-Level Teacher/Other account never sees a nav item that just leads
 * to a "not authorized" error).
 */
function applyNavVisibility_() {
  var access = state.myAccess || { is_administrator: false, is_elc_staff: false, has_grade_scope: false };
  var dashBtn = document.getElementById('nav-dashboard');
  // Phase 31b: the whole "Administration" dropdown wrapper hides/shows
  // together, not just the Staff Access button inside it -- a non-admin
  // account shouldn't see an empty "Administration" menu.
  var adminDropdown = document.getElementById('nav-admin-dropdown');
  // Phase 43: has_grade_scope covers a Grade-Level Teacher/Other account OR
  // a blank-role ELC caseload match -- mirrors requireDashboardAccess_'s
  // server-side condition exactly, see getMyAccess (Code.gs).
  if (dashBtn) dashBtn.style.display = (access.is_administrator || access.is_elc_staff || access.has_grade_scope) ? '' : 'none';
  if (adminDropdown) adminDropdown.style.display = access.is_administrator ? '' : 'none';
}

/**
 * Phase 31b: the "Administration" nav dropdown -- toggles open/closed and
 * closes on any click outside it (the guard mirrors the Escape-key handler
 * below: this runs at script load time, and not every test harness's
 * `document` mock implements addEventListener).
 *
 * Real find (2026-09-11): state.myAccess (and everything decided from it,
 * like this button's own visibility) is only ever fetched ONCE, at initial
 * page load -- on a shared computer where a different Google account signs
 * in without a full page reload, that can leave Admin Tools visible to
 * someone who isn't actually an administrator. Every real admin action
 * still independently re-checks the CURRENT signed-in identity server-side
 * (requireAdministrator_ etc.), so nothing behind this menu could ever
 * actually succeed for the wrong person -- but seeing "Admin Tools" at all
 * when you're not one is confusing and looks like a real access bug. This
 * re-verifies fresh every time the button is clicked (not just once at
 * load) and self-corrects immediately instead of waiting on a reload
 * nobody may think to do.
 */
function toggleAdminNavDropdown_(e) {
  if (e) e.stopPropagation();
  call('getMyAccess').then(function(access) {
    state.myAccess = access || { is_administrator: false, is_elc_staff: false, has_grade_scope: false };
    applyNavVisibility_();
    if (!state.myAccess.is_administrator) {
      toast('Your access has changed -- Admin Tools is no longer available.');
      return;
    }
    var menu = document.getElementById('nav-admin-menu');
    if (menu) menu.classList.toggle('open');
  }).catch(function(err) { toast('Error: ' + err.message); });
}
function closeAdminNavDropdown_() {
  var menu = document.getElementById('nav-admin-menu');
  if (menu) menu.classList.remove('open');
}
if (typeof document.addEventListener === 'function') {
  document.addEventListener('click', function(e) {
    var dropdown = document.getElementById('nav-admin-dropdown');
    if (dropdown && !dropdown.contains(e.target)) closeAdminNavDropdown_();
  });
}

/**
 * Landing view on login (Phase 22): Administrator/ELC Staff open on the
 * Dashboard -- the "state of the school" overview is the more useful first
 * screen for an oversight role than an alphabetical student list. Phase 43
 * extended this to a Grade-Level Teacher/Other account too, once they got
 * their own (grade-scoped) Dashboard -- same reasoning applies at their
 * scale. Only an account with NO Dashboard access at all (see
 * applyNavVisibility_) still opens on the Students list, since their first
 * action is almost always looking up one of their own students.
 */
function goToLandingView_() {
  var access = state.myAccess || { is_administrator: false, is_elc_staff: false, has_grade_scope: false };
  if (access.is_administrator || access.is_elc_staff || access.has_grade_scope) goToDashboard();
  else goToRoster();
}

// ── Init ─────────────────────────────────────────────────────
call('getMyAccess').then(function(access) {
  state.myAccess = access || { is_administrator: false, is_elc_staff: false, has_grade_scope: false };
  applyNavVisibility_();
  // Real bug (2026-08-04): getMyAccess() is slow enough on an Apps Script
  // cold start that a user clicking a nav button before it resolves used to
  // get yanked back to the landing view the instant it finished -- the
  // click's own updateNavActive_() call already flipped landingViewPending
  // to false, so respect that instead of overriding their navigation.
  if (state.landingViewPending) goToLandingView_();
  // Phase 31c (onboarding): auto-launches the welcome tour on this
  // browser's first visit -- see maybeAutoShowWelcomeTour_ for why an
  // opt-in-only "Take the Tour" button isn't enough on its own.
  maybeAutoShowWelcomeTour_();
}).catch(function() {
  // A startup hiccup here shouldn't block the whole app -- fall through to
  // the normal roster load, which surfaces any real auth error on its own.
  if (state.landingViewPending) goToRoster();
});
</script>
