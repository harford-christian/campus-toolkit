}

/**
 * Letterhead-branded, printable version of the same comparison (2026-09-22,
 * at the school's request: "it should also look professional"). Same
 * #print-report/@media print mechanism as buildStudentReportHtml_/
 * buildBoardPacketHtml_ -- printLetterheadHtml_'s own doc comment explains
 * why every printed output in this app shares that one function. No
 * `iepExportType` (renderPrintPreviewActions_'s null argument) -- this is
 * aggregate, not one student's PII, same reasoning buildBoardPacketHtml_
 * already documents for the board packet.
 */
/** Print version of renderSummaryCombinedResults_ -- see that function's own doc comment for why a combined comparison sorts by the PRIMARY (first) measure's raw score, ascending. Plain text status (no badges/colors) for print, same convention printTable already uses in buildSummaryCompareReportHtml_. */
function buildSummaryCombinedReportHtml_() {
  var r = state.summaryReport;
  var keys = r.measure;
  var students = applySummaryQuickFilter_(r.students, state.summaryQuickFilter);
  var rows = students.map(function(s) {
    var byKey = {};
    s.measures.forEach(function(m) { byKey[m.measure] = summaryComparePoint_(m); });
    return { student_id: s.student_id, first_name: s.first_name, last_initial: s.last_initial, grade: s.grade, byKey: byKey };
  }).filter(function(row) { return keys.some(function(k) { return row.byKey[k]; }); });

  // Same "drop a skill nobody in this scope has a score for" fix as
  // renderSummaryCombinedResults_ -- see its own doc comment for why.
  var presentKeys = keys.filter(function(k) { return rows.some(function(row) { return row.byKey[k]; }); });
  var droppedKeys = keys.filter(function(k) { return presentKeys.indexOf(k) === -1; });

  function primaryScoreRank_(row) {
    var m = row.byKey[presentKeys[0]];
    var score = m ? Number(m.raw_score) : NaN;
    return isNaN(score) ? Infinity : score;
  }
  rows.sort(function(a, b) {
    return gradeSortCompareClient_(a.grade, b.grade) || (primaryScoreRank_(a) - primaryScoreRank_(b));
  });

  var scopeText = r.all_time ? 'All time' : ([r.season, r.school_year].filter(Boolean).join(' ') || 'Any period');
  var html = '<div style="max-width:760px;margin:0 auto;font-size:.92rem">'
    + printLetterheadHtml_('Skill Comparison Report', presentKeys.map(measureLabel_).join(' & ') + ' — ' + (r.grade ? 'Grade ' + r.grade : 'All Grades') + ' · ' + scopeText + ' · Generated ' + fmtDate(todayIso_()))
    + (droppedKeys.length ? '<p style="text-align:center;margin:0 0 10px;color:var(--ink-soft);font-size:.85rem">' + escapeHtml(droppedKeys.map(measureLabel_).join(', ')) + (droppedKeys.length === 1 ? ' has' : ' have') + ' no results for these students in this scope — left out below.</p>' : '')
    + '<p style="text-align:center;margin:0 0 18px;color:#444">' + rows.length + ' student' + (rows.length === 1 ? '' : 's') + '</p>'
    + '<table><thead><tr><th>Student</th>' + (r.grade ? '' : '<th>Grade</th>')
    + presentKeys.map(function(k) { return '<th>' + escapeHtml(measureLabel_(k)) + '</th>' + (measureHasOwnStatus_(k) ? '<th>Status</th>' : ''); }).join('')
    + '</tr></thead><tbody>'
    + rows.map(function(row) {
        return '<tr><td>' + escapeHtml(studentPrintLabel_(row)) + '</td>'
          + (r.grade ? '' : '<td>' + escapeHtml(row.grade || '—') + '</td>')
          + presentKeys.map(function(k) {
              var m = row.byKey[k];
              return '<td>' + (m ? escapeHtml(formatScoreText_(k, m.raw_score, m.max_score, m.item_detail)) : '—') + '</td>'
                + (measureHasOwnStatus_(k) ? '<td>' + (m ? escapeHtml(pointStatusText_(m)) : 'not scored') + '</td>' : '');
            }).join('')
          + '</tr>';
      }).join('')
    + '</tbody></table></div>';
  return html;
}

function buildSummaryCompareReportHtml_() {
  var r = state.summaryReport;
  if (Array.isArray(r.measure)) return buildSummaryCombinedReportHtml_();
  var students = applySummaryQuickFilter_(r.students, state.summaryQuickFilter);
  var rows = students.map(function(s) {
    var m = summaryComparePoint_(s.measures[0]);
    return { student_id: s.student_id, first_name: s.first_name, last_initial: s.last_initial, grade: s.grade, point: m };
  });
  var stats = compareScoreStats_(rows);
  var scopeText = r.all_time ? 'All time' : ([r.season, r.school_year].filter(Boolean).join(' ') || 'Any period');

  var html = '<div style="max-width:760px;margin:0 auto;font-size:.92rem">'
    + printLetterheadHtml_('Skill Comparison Report', measureLabel_(r.measure) + ' — ' + (r.grade ? 'Grade ' + r.grade : 'All Grades') + ' · ' + scopeText + ' · Generated ' + fmtDate(todayIso_()));

  if (stats) {
    html += '<p style="text-align:center;margin:0 0 18px;color:#444">' + stats.count + ' student' + (stats.count === 1 ? '' : 's')
      + ' &middot; Average: ' + stats.avg + ' &middot; Range: ' + stats.min + '&ndash;' + stats.max + '</p>';
  }

  function printTable(rowsToShow, showGrade) {
    return '<table><thead><tr><th>#</th><th>Student</th>' + (showGrade ? '<th>Grade</th>' : '') + '<th>Score</th><th>Status</th></tr></thead><tbody>'
      + rowsToShow.map(function(row, i) {
          return '<tr><td>' + (i + 1) + '</td><td>' + escapeHtml(studentPrintLabel_(row)) + '</td>'
            + (showGrade ? '<td>' + escapeHtml(row.grade || '—') + '</td>' : '')
            + '<td>' + escapeHtml(formatScoreText_(row.point.measure, row.point.raw_score, row.point.max_score, row.point.item_detail)) + '</td>'
            + '<td>' + escapeHtml(pointStatusText_(row.point)) + '</td></tr>';
        }).join('')
      + '</tbody></table>';
  }

  if (r.grade) {
    rows.sort(function(a, b) { return (Number(b.point.raw_score) || 0) - (Number(a.point.raw_score) || 0); });
    html += printTable(rows, false);
  } else {
    var byBucket = {};
    rows.forEach(function(row) {
      var b = pointStatusBucket_(row.point);
      if (!byBucket[b]) byBucket[b] = [];
      byBucket[b].push(row);
    });
    COMPARE_BUCKET_ORDER_.forEach(function(b) {
      var group = byBucket[b];
      if (!group || !group.length) return;
      group.sort(function(a, b2) { return gradeSortCompareClient_(a.grade, b2.grade) || (Number(b2.point.raw_score) || 0) - (Number(a.point.raw_score) || 0); });
      html += '<h2>' + escapeHtml(COMPARE_BUCKET_LABELS_[b]) + ' (' + group.length + ')</h2>' + printTable(group, true);
    });
  }

  return html + '</div>';
}

/** Client-side copy of Dashboard.gs's gradeSortCompare_ (K first, then numeric, unrecognized last) -- grouping students by grade within a tier bucket needs the same ordering the rest of the app already uses. */
function gradeSortCompareClient_(a, b) {
  var na = a === 'K' ? -1 : parseInt(a, 10);
  var nb = b === 'K' ? -1 : parseInt(b, 10);
  if (isNaN(na) && isNaN(nb)) return String(a).localeCompare(String(b));
  if (isNaN(na)) return 1;
  if (isNaN(nb)) return -1;
  return na - nb;
}

/**
 * Bulk, multi-student data -- CSV per the established clipboard-for-one/CSV-for-bulk convention.
 * Phase 25g (Phase 6a review finding #15): "Tier" mixes two incompatible
 * vocabularies in one column with no explanation -- DIBELS' Blue/Green/
 * Yellow/Red alongside Mastery/Strategic/Intensive from every other
 * assessment type. A "Tier Meaning" column (reusing tierPlainLanguage_,
 * Phase 25d's in-app gloss) makes both vocabularies read consistently
 * without discarding the original, more precise tier value.
 */
function exportSummaryCsv_() {
  var r = state.summaryReport;
  if (!r) return;
  var scopeText = r.all_time ? 'All time' : ([r.season, r.school_year].filter(Boolean).join(' ') || 'Any period');
  var quickFilterLabel = (SUMMARY_QUICK_FILTERS.find(function(f) { return f.key === state.summaryQuickFilter; }) || {}).label;
  var rows = [
    ['Scope', scopeText + (r.grade ? ' · Grade ' + r.grade : '')],
    ['Show filter', quickFilterLabel || 'All'],
    ['Generated', (window.ELC_DEMO_NOW ? window.ELC_DEMO_NOW() : new Date()).toLocaleString()],
    [],
    ['Student', 'Grade', 'Measure', 'Score', 'Max', 'Tier', 'Tier Meaning', 'Goal', 'Trend']
  ];
  applySummaryQuickFilter_(r.students, state.summaryQuickFilter).forEach(function(s) {
    var name = s.first_name + ' ' + s.last_initial + '.';
    s.measures.forEach(function(rawM) {
      var m = summaryComparePoint_(rawM);
      rows.push([name, s.grade, measureLabel_(m.measure), m.raw_score, m.max_score || '', m.benchmark_tier || '',
        m.benchmark_tier ? tierPlainLanguage_(m.benchmark_tier) : '',
        (m.benchmark_reference !== null && m.benchmark_reference !== undefined) ? m.benchmark_reference : '', m.trend || '']);
    });
  });
  var csv = rows.map(function(row) { return row.map(csvEscape_).join(','); }).join('\r\n');
  downloadTextFile_(csv, 'student-summary-' + todayIso_() + '.csv', 'text/csv');
}

/**
 * "Grade-Level Teacher — Grades 1, 2" / "ELC Staff (unrestricted)" /
 * "Administrator (unrestricted)" / "Automatic ... sees Grade 3" (blank
 * access_role, Phase 20's default) -- mirrors Code.gs's computeAccessScope_.
 *
 * Phase 23g (Phase 6a review finding): a blank-role row used to only ever
 * show the literal string "Automatic," with no way to tell what it actually
 * resolves to without manually searching the roster spreadsheet tabs.
 * getStaffAccessList() now computes the real resolved scope server-side
 * (resolved_grades/resolved_is_elc_staff/resolved_student_count/
 * resolved_closed) -- this just renders it.
 */
/**
 * Real find (2026-09-11): an access_role that isn't blank but also isn't
 * one of the real roles (state.accessRoles, from getAccessRoles()) can
 * only have gotten there via a DIRECT spreadsheet edit -- the app's own
 * Edit Scope form validates against this list (Code.gs's updateAccessScope)
 * and could never save anything else. computeAccessScope_ already silently
 * falls through to the SAME automatic K5-6 Teachers/ELC Elementary
 * derivation as a truly blank role in this case -- but this function used
 * to only check `!r.access_role` for that automatic path, so a garbage
 * value like "HR-01" (almost certainly meant for some other column
 * entirely) rendered as if it were a real, intentional custom role
 * ("HR-01 — Grade(none configured)"), hiding that it was actually being
 * silently ignored.
 */
function isUnrecognizedAccessRole_(r) {
  return !!r.access_role && (state.accessRoles || []).indexOf(r.access_role) === -1;
}

function accessScopeSummary_(r) {
  if (r.malformed) return 'Malformed entry (not a valid single email) -- click <strong>Revoke</strong> below to remove it.';
  var unrecognized = isUnrecognizedAccessRole_(r);
  if (!r.access_role || unrecognized) {
    var prefix = unrecognized ? 'Unrecognized role "' + escapeHtml(r.access_role) + '" (probably a direct spreadsheet edit, not set through this app) -- ignored, falls back to automatic: ' : '';
    if (r.resolved_closed) return prefix + 'Automatic — resolves to <strong>no students</strong> (not found on K5-6 Teachers or ELC Elementary)';
    var parts = [];
    if (r.resolved_grades && r.resolved_grades.length) {
      parts.push('Grade' + (r.resolved_grades.length === 1 ? ' ' : 's ') + r.resolved_grades.map(escapeHtml).join(', '));
    }
    if (r.resolved_is_elc_staff) {
      parts.push('every ELC-flagged student (' + r.resolved_student_count + ')');
    }
    return prefix + 'Automatic — currently sees ' + (parts.length ? parts.join(' + ') : 'nothing');
  }
  if (r.access_role === 'Administrator') return 'Administrator (unrestricted -- sees every student)';
  if (r.access_role === 'ELC Staff') return 'ELC Staff (unrestricted override -- sees every student)';
  var grades = (r.scope_grades || '').split(',').map(function(g) { return g.trim(); }).filter(Boolean);
  return escapeHtml(r.access_role) + ' — Grade' + (grades.length === 1 ? ' ' : 's ') + (grades.length ? grades.map(escapeHtml).join(', ') : '(none configured)');
}

    state.gradeAdvanceExcluded = {};

}

function renderGradeAdvancePreview_() {
  var slot = document.getElementById('grade-advance-slot');
  var preview = state.gradeAdvancePreview || [];
  if (preview.length === 0) { slot.innerHTML = '<p class="muted" style="margin-top:10px">No active students on the roster.</p>'; return; }

  var html = '<p class="muted" style="margin:10px 0">Review below, uncheck anyone being <strong>retained</strong> in their current grade, then confirm. Grade 6 students moving on to Middle School are never auto-advanced (there\'s no 7th grade here) — deactivate them separately (reason: "Promoted to Middle School") once the year ends.</p>'
    + '<table class="preview-table"><thead><tr><th></th><th>Student</th><th>Current Grade</th><th>Next Grade</th></tr></thead><tbody>';
  preview.forEach(function(p) {
    var graduating = !p.next_grade;
    var checked = (!graduating && !state.gradeAdvanceExcluded[p.student_id]) ? ' checked' : '';
    // The checkbox is wrapped in a full-cell <label> (not a bare <input>) so
    // the whole cell is the tap target, matching every other checkbox in the
    // app -- this guards a bulk, easy-to-miss action (advances every checked
    // student a grade), where a missed tap silently changes who gets promoted.
    html += '<tr' + (graduating ? ' class="preview-row-invalid"' : '') + '>'
      + '<td>' + (graduating ? '—' : '<label style="display:flex;align-items:center;justify-content:center;min-height:32px;cursor:pointer;margin:0">'
          + '<input type="checkbox"' + checked + ' onchange="toggleGradeAdvanceExclude_(\'' + p.student_id + '\', this.checked)" /></label>') + '</td>'
      + '<td>' + escapeHtml(p.first_name) + ' ' + escapeHtml(p.last_initial) + '.</td>'
      + '<td>' + escapeHtml(p.current_grade || '—') + '</td>'
      + '<td>' + (graduating ? 'Middle School — not advanced' : escapeHtml(p.next_grade)) + '</td>'
      + '</tr>';
  });
  html += '</tbody></table>'
    + '<div class="btn-row" style="margin-top:10px">'
    + '<button class="btn btn-primary" onclick="confirmGradeAdvance_()">Confirm Advance</button>'
    + '<button class="btn btn-secondary" onclick="document.getElementById(\'grade-advance-slot\').innerHTML=\'\'">Cancel</button>'
    + '</div>';
  slot.innerHTML = html;
}

function toggleGradeAdvanceExclude_(studentId, isChecked) {
  if (isChecked) delete state.gradeAdvanceExcluded[studentId];

}

function confirmGradeAdvance_() {
  var excludeIds = Object.keys(state.gradeAdvanceExcluded || {});
  showConfirm_(
    'Advance grades for the new school year?',

    'Advance Grades',

function grantAccessClick_() {

var DASHBOARD_BUCKETS_ORDER = ['at_risk', 'some_risk', 'on_track', 'not_assessed'];
var DASHBOARD_BUCKET_LABELS = { at_risk: 'At Risk', some_risk: 'Some Risk', on_track: 'On Track', not_assessed: 'Not Yet Assessed' };
var DASHBOARD_BUCKET_COLORS = { at_risk: RISK_COLOR_RED_, some_risk: RISK_COLOR_YELLOW_, on_track: RISK_COLOR_GREEN_, not_assessed: '#A8916B' };

/**
 * Phase 31g/31h: shared collapsible-section pattern (Option B from the
 * Dashboard restructure review). `key` is a stable string (e.g.
 * 'dashboard.headline', 'profile.growth') so each section's collapsed state
 * survives a full re-render independent of the others. Missing from
 * state.sectionExpanded == expanded (every section starts open the first
 * time; only an explicit collapse persists).
 */
function toggleSection_(key) {
  state.sectionExpanded[key] = !(state.sectionExpanded[key] !== false);
}
function toggleDashboardSection_(key) { toggleSection_(key); renderDashboard(); }
function toggleProfileSection_(key) { toggleSection_(key); renderProfile(); }

/** bodyHtml is skipped/hidden (not un-rendered) when collapsed, so toggling back open needs no re-fetch. */
function renderCollapsibleCard_(key, title, bodyHtml, toggleFnName) {
  var expanded = state.sectionExpanded[key] !== false;
  // Phase 36 (finding #23): the id lets a jump-nav link (see
  // renderDashboardJumpNav_) scroll straight to a section, even a currently-
  // collapsed one -- scrolling to it doesn't auto-expand it, but the section
  // heading (with its own click-to-expand affordance) is right there either way.
  return '<div class="card' + (expanded ? '' : ' collapsed') + '" id="section-' + escapeHtml(key) + '">'
    + '<div class="accordion-head" onclick="' + toggleFnName + '(\'' + key + '\')">'
    + '<h2>' + escapeHtml(title) + '</h2>'
    + '<span class="chev">▾</span></div>'
    + '<div class="accordion-body">' + bodyHtml + '</div></div>';
}

// Phase 35 (performance): getPrincipalDashboard + getComplianceReport used
// to be 2 sequential round trips every single Dashboard visit -- now one
// bundled call (getDashboardBundle, Dashboard.gs). getAdministratorRoles/
// getAvailableSchoolYears stay separate (already cached client-side in
// state after the first fetch each session), so they're skipped entirely
// on repeat visits rather than folded into the bundle.
function goToDashboard() {
  state.view = 'dashboard';
  updateNavActive_();
  app.innerHTML = '<div class="card"><p class="muted">Loading dashboard…</p></div>';
  (state.administratorRoles ? Promise.resolve(state.administratorRoles) : call('getAdministratorRoles')).then(function(roles) {
    if (!roles) throw new Error('getAdministratorRoles returned nothing.');
    state.administratorRoles = roles;
    return state.availableSchoolYears ? Promise.resolve(state.availableSchoolYears) : call('getAvailableSchoolYears');
  }).then(function(years) {
    if (!years) throw new Error('getAvailableSchoolYears returned nothing.');
    state.availableSchoolYears = years;
    return call('getDashboardBundle', state.complianceRole || '', state.complianceSchoolYear || '');
  }).then(function(bundle) {
    if (!bundle || !bundle.dashboard || !bundle.compliance) throw new Error('getDashboardBundle returned nothing.');
    state.dashboard = bundle.dashboard;
    state.dashboardExpanded = {};
    state.compliance = bundle.compliance;
    state.complianceExpanded = {};
    state.cohortGrowth = bundle.cohortGrowth || { cohorts: [] }; // Trend #2 -- lenient fallback so a hiccup in this newer, supplementary report never blanks the rest of the Dashboard
    state.tierExitCandidates = bundle.tierExitCandidates || []; // same lenient fallback, same reasoning -- a newer, supplementary section
    renderDashboard();
  }).catch(function(err) { toast('Error: ' + err.message); app.innerHTML = '<div class="card">Error: ' + err.message + '</div>'; });
}

function toggleComplianceGaps_(season) {
  state.complianceExpanded[season] = !state.complianceExpanded[season];

}

/** Whether the compliance report has ANY requirement defined for a given raw grade value (e.g. "K", "2", "1st Grade", "Ungraded"). */
function complianceGradeIsTrackable_(c, grade) {
  var m = String(grade || '').match(/\d+/);
  if (!m) return false;
  var key = String(parseInt(m[0], 10));
  if ((c.defined_grade_bands || []).indexOf(key) === -1) return false;
  if ((c.untracked_grade_bands || []).indexOf(key) !== -1) return false;
  return true;
}

}

function renderComplianceSection_() {
  var c = state.compliance;
  if (!c) return '';

  // Phase 31g: no longer wraps itself in a <div class="card"> -- the caller
  // (renderDashboard) wraps this body in a collapsible section. Naming
  // history: "Benchmarking Compliance" -> "Benchmarking Status" (Phase 31d)
  // -> "Benchmarking Overview" (Phase 42) -- the section title itself is
  // supplied by the caller, so the school year moves into this sub-line
  // instead of a dynamic h2 suffix.
  // Phase 42: a naming/IA review flagged "Benchmarking Status" as echoing
  // the renamed nav item "Benchmark Checkpoints" and suggested "Compliance
  // Snapshot" -- rejected. "Compliance" was specifically avoided when this
  // section was originally named (see the COMPLIANCE_COMING_DUE_WINDOW_DAYS
  // comment in Compliance.gs): these dates are internally-set operational
  // targets, not a citation to a state/district regulation, and the word
  // "Compliance" reads as a legal/IDEA compliance claim this app doesn't
  // make. "Benchmarking Overview" keeps the already-vetted "Benchmarking"
  // word and only drops "Status" -- the half that was actually echoing
  // "Checkpoints" -- while also reading as aggregate/schoolwide (Overview)
  // vs. the nav item's per-student gap list (Checkpoints).
  // Phase 43: same admin/ELC-only export restriction as the Dashboard's own
  // Export CSV/Print Board Packet buttons, see renderDashboard's "By Grade" body.
  var html = '<div style="display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:8px">'
    + '<p class="muted" style="margin:0 0 4px">' + escapeHtml(c.school_year) + '</p>'
    + ((state.myAccess && (state.myAccess.is_administrator || state.myAccess.is_elc_staff))
        ? '<button class="btn btn-secondary btn-small" onclick="exportComplianceCsv_()">Export CSV</button>'
          // Real find, 2026-10-02 (administrator-requested feature, "print
          // off the missing benchmark students and what's missing... don't
          // want to search by each test"): the per-student gap list
          // (student + exactly which tests are missing) already loads here
          // for every past-due checkpoint at once -- Benchmark Checkpoints
          // only ever shows one assessment type at a time. Reuses
          // state.compliance exactly as already loaded for this live view,
          // same no-new-server-call pattern as Print Board Packet.
          + ' <button class="btn btn-secondary btn-small" onclick="previewOverdueBenchmarksClick_()">Print Who\'s Overdue</button>'
        : '')
    + '</div>'
    + '<div style="display:flex;gap:12px;flex-wrap:wrap">'
    + '<div class="field" style="max-width:200px"><label>School year</label><select id="compliance-year-filter" onchange="onComplianceSchoolYearChange_()">'
    + (state.availableSchoolYears || []).map(function(y) {
        return '<option value="' + escapeHtml(y) + '"' + (y === c.school_year ? ' selected' : '') + '>' + escapeHtml(y) + '</option>';
      }).join('')
    + '</select></div>'
    + '<div class="field" style="max-width:260px"><label>Administered by</label><select id="compliance-role-filter" onchange="onComplianceRoleChange_()">'
    + '<option value="">All</option>'
    + (state.administratorRoles || []).map(function(r) { return '<option' + (c.administrator_role === r ? ' selected' : '') + '>' + escapeHtml(r) + '</option>'; }).join('')
    + '</select></div>'
    + '</div>'
    + '<p class="muted" style="margin-bottom:12px">Requirements depend on each student\'s ELC Elementary service area(s), grades 1–6: students flagged Reading require DIBELS + (Lexile or Guided Reading Level) in grades 1–3, or easyCBM Reading + Lexile in grades 4–6; students flagged Math require easyCBM Math every checkpoint. Phonics/Spelling have no separate requirement (already captured by DIBELS/Reading), Kindergarten isn\'t tracked, and a student flagged only English/Language has no requirement yet.'
    + (c.administrator_role ? ' Showing only sessions administered by ' + escapeHtml(c.administrator_role) + '.' : '') + '</p>'
    + '<p class="muted" style="margin:-6px 0 12px;font-size:.78rem">This tracks internal benchmarking/screening windows only -- it is not a record of IEP, 504, or IDEA procedural compliance.</p>'
    // Real find, 2026-09-26 (independent code review, "reporting consistency"):
    // this measures whether a REQUIRED test was given at all, regardless of the
    // score -- a student can show up here with a gap while the Dashboard's own
    // risk color shows green (they scored fine on whatever WAS given) or vice
    // versa. Nothing previously told an admin that's expected, not a bug.
    + '<p class="muted" style="margin:-6px 0 12px;font-size:.78rem">A student can look fine here but flagged elsewhere, or the reverse -- this only checks whether a required test was GIVEN, not the score. See the Dashboard\'s risk color for score-based risk, or Benchmark Checkpoints to search one specific assessment type regardless of whether it\'s required.</p>';

  // Real find, 2026-09-27 (independent code review, "admin experience"):
  // this section reuses the SAME state.dashboardGradeFilter set by the "By
  // Grade" card above, with nothing here saying so -- an admin who filters
  // to one grade there, then scrolls down (or collapses "By Grade"
  // afterward), sees a silently-narrowed gap count with no visible
  // explanation for why it's smaller than expected.
  if (state.dashboardGradeFilter) {
    html += '<div class="badge badge-neutral" style="margin-bottom:12px">Filtered to Grade ' + escapeHtml(state.dashboardGradeFilter) + ' (set by the "By Grade" card above)</div>';
  }

  if (c.untracked_grade_bands && c.untracked_grade_bands.length) {
    html += '<div class="muted" style="margin-bottom:12px;font-size:.8rem">'
      + 'Grade' + (c.untracked_grade_bands.length > 1 ? 's ' : ' ') + c.untracked_grade_bands.map(escapeHtml).join(', ')
      + ' require an assessment type this tool doesn’t support yet — compliance tracking will extend to them automatically once it’s added.'
      + '</div>';
  }

  // A grade filter outside this tool's defined requirements (K, 7, 8,
  // Ungraded) would otherwise show every checkpoint as an empty gaps list
  // -- indistinguishable from genuine "All caught up" -- when really no
  // requirement was ever evaluated for that grade at all.
  if (state.dashboardGradeFilter && !complianceGradeIsTrackable_(c, state.dashboardGradeFilter)) {
    html += '<div class="empty-state">No benchmarking requirement is defined for Grade ' + escapeHtml(state.dashboardGradeFilter) + ' — this isn’t "caught up," compliance tracking just doesn’t apply to this grade.</div>';
    return html;
  }

  c.checkpoints.forEach(function(cp) {
    var gaps = state.dashboardGradeFilter ? cp.gaps.filter(function(g) { return g.grade === state.dashboardGradeFilter; }) : cp.gaps;
    // Phase 34: students who still need testing for an UPCOMING checkpoint
    // (within the 21-day lookahead, urgent flagged inside 7 days) -- so
    // staff can see who's coming due BEFORE the deadline, not only after
    // it's already been missed (that's what `gaps` above answers).
    var comingDueGaps = state.dashboardGradeFilter
      ? (cp.coming_due_gaps || []).filter(function(g) { return g.grade === state.dashboardGradeFilter; })
      : (cp.coming_due_gaps || []);

    html += '<div style="margin-bottom:10px;padding-bottom:10px;border-bottom:1px solid var(--line)">'
      + '<div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px">'
      + '<strong style="font-size:.88rem">' + escapeHtml(cp.label) + ' (' + escapeHtml(cp.season) + ')</strong>';

    if (!cp.is_past_due) {
      // Phase 25b (Phase 6a review finding #9): the days-until-due
      // countdown previously only existed in the (disabled-by-default)
      // email digest -- now shown in-app too, so it's visible regardless
      // of whether email notifications are ever turned on.
      var dueLabel = cp.days_until_due !== null && cp.days_until_due !== undefined
        ? 'Due in ' + cp.days_until_due + ' day' + (cp.days_until_due === 1 ? '' : 's')
        : 'Not due yet';
      html += '<span class="badge badge-info">' + escapeHtml(dueLabel) + '</span>';
      if (comingDueGaps.length > 0) {
        // Phase 39d: no Show/Hide gate here (unlike the past-due `gaps`
        // list below) -- the whole point of surfacing students BEFORE a
        // deadline is to make it visible without an extra click; hiding it
        // by default undercuts that.
        var anyUrgent = comingDueGaps.some(function(g) { return g.urgent; });
        html += ' <span class="badge ' + (anyUrgent ? 'badge-red' : 'badge-yellow') + '">' + comingDueGaps.length + ' still need testing</span>';
      }
    } else if (gaps.length === 0) {
      html += '<span class="badge badge-ok">All caught up</span>';
    } else {
      html += '<span class="badge badge-strategic">' + gaps.length + ' missing</span>'
        + ' <button class="btn btn-secondary btn-small" onclick="toggleComplianceGaps_(\'' + cp.season + '\')">'
        + (state.complianceExpanded[cp.season] ? 'Hide' : 'Show') + '</button>';
    }
    html += '</div>';

    // Phase 23e: a schoolwide "X of Y (Z%)" figure -- the actual number a
    // board asks for -- computed across every tracked grade combined, so it
    // only makes sense in the unfiltered ("All Grades") view; a per-grade
    // filter already gets its answer from the gap list itself.
    if (cp.is_past_due && cp.evaluated_count !== null && !state.dashboardGradeFilter) {
      html += '<div class="muted" style="font-size:.78rem;margin-top:4px">'
        + cp.completed_count + ' of ' + cp.evaluated_count + ' students met this deadline (' + cp.completion_percentage + '%)</div>';
    }

    if (cp.is_past_due && gaps.length > 0 && state.complianceExpanded[cp.season]) {
      html += '<div style="margin-top:8px">' + gaps.map(function(g) {
        return '<div class="student-row" onclick="openStudent(\'' + g.student_id + '\')">'
          + '<div><div class="student-name">' + escapeHtml(g.first_name) + ' ' + escapeHtml(g.last_initial) + '. '
          + '<span class="muted" style="font-weight:400">(Grade ' + escapeHtml(g.grade) + ')</span></div>'
          + '<div class="student-meta">Missing: ' + escapeHtml(g.missing.join(', ')) + '</div></div>'
          + '<div class="muted">' + chevronRightIconSvg_() + '</div></div>';
      }).join('') + '</div>';
    }

    if (!cp.is_past_due && comingDueGaps.length > 0) {
      html += '<div style="margin-top:8px">' + comingDueGaps.map(function(g) {
        return '<div class="student-row" onclick="openStudent(\'' + g.student_id + '\')">'
          + '<div><div class="student-name">' + escapeHtml(g.first_name) + ' ' + escapeHtml(g.last_initial) + '. '
          + '<span class="muted" style="font-weight:400">(Grade ' + escapeHtml(g.grade) + ')</span>'
          + (g.urgent ? ' <span class="badge badge-red" style="font-size:.68rem">Urgent</span>' : '') + '</div>'
          + '<div class="student-meta">Still needs: ' + escapeHtml(g.missing.join(', ')) + '</div></div>'
          + '<div class="muted">' + chevronRightIconSvg_() + '</div></div>';
      }).join('') + '</div>';
    }

    html += '</div>';
  });

  return html;
}

function toggleDashboardBucket_(grade, bucket) {
  state.dashboardExpanded[grade] = (state.dashboardExpanded[grade] === bucket) ? null : bucket;
  renderDashboard();
}

// Which trend-strip period bar is selected per grade -- defaults to the
// latest period. A full renderDashboard() on tap is safe here (unlike the
// growth chart's targeted DOM patch) since the only other per-grade UI
// state (the expanded risk-bucket list) already lives in state.dashboardExpanded
// and survives a re-render.
var DASHBOARD_TREND_SELECTED_ = {};

function selectDashboardTrendPeriod_(grade, idx) {
  DASHBOARD_TREND_SELECTED_[grade] = idx;
  renderDashboard();
}

function dashboardTrendDetailText_(t) {
  if (!t) return '';
  return escapeHtml(friendlyPeriodLabel_(t.period)) + ' — ' + t.counts.at_risk + ' at risk · ' + t.counts.some_risk + ' some risk · '
    + t.counts.on_track + ' on track · ' + t.counts.not_assessed + ' not yet assessed';
}

function onDashboardGradeFilterChange_() {

function filteredDashboardGrades_() {
  var d = state.dashboard;
  if (!d) return [];
