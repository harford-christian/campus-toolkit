// ── Summary view (bulk, filterable score/risk report) ───────

function goToSummary() {
  state.view = 'summary';
  updateNavActive_();
  state.summaryReport = null;
  if (!state.summaryForm) {
    state.summaryForm = { report_mode: 'overview', assessment_types: [], all_time: false, school_year: schoolYearGuess_(), season: seasonGuess_(), grade: '', elc_only: false, student_id: '', compare_slots: [{ type: '', measure: '' }], matrix_type: '' };
  }
  // Phase 35 (performance): used to be 3 sequential round trips the first
  // time this view is opened in a session (getAssessmentTypes, getRoster,
  // getAvailableSchoolYears) -- one bundled call now. Still skips the
  // network entirely once all 3 are already cached, same as before.
  var allCached = state.assessmentTypes && state.roster && state.roster.length && state.availableSchoolYears;
  var chain = allCached ? Promise.resolve(null) : call('getSummaryBundle');
  chain.then(function(bundle) {
    if (bundle) {
      if (!bundle.assessmentTypes) throw new Error('getSummaryBundle returned nothing.');
      state.assessmentTypes = bundle.assessmentTypes;
      state.roster = bundle.roster;
      state.availableSchoolYears = bundle.availableSchoolYears;
    }
    renderSummaryPicker_();
  }).catch(function(err) { toast('Error: ' + err.message); });
}

// 2026-10-08: CORE Phonics Parts A/B/C/D_long/D_short share ONE combined
// "Alphabet Skills" tier (scoreCorePhonics, CorePhonics.gs overwrites all
// five with the combined 83-point tier once the full battery is given) --
// they don't have a real tier of their own. Fine on a student's own profile
// (shown right alongside the combined score, so the context is clear), but
// showing that borrowed tier/reference in a CROSS-STUDENT comparison would
// misrepresent it as if it were specific to that one part. summaryComparePoint_
// strips it for exactly these 5 measures before Compare/Matrix display;
// every other measure (including Parts E-L, which DO have their own real
// per-part cut table) passes through unchanged.
var CORE_PHONICS_SHARED_TIER_PARTS_ = { part_a: true, part_b: true, part_c: true, part_d_long: true, part_d_short: true };
/** Whether a Compare/Matrix column for this measure should get its own Status column -- false for the 5 CORE Phonics alphabet parts, which summaryComparePoint_ already strips, so a Status column for them would just be an empty/"Not benchmarked" column with zero information. */
function measureHasOwnStatus_(key) { return !CORE_PHONICS_SHARED_TIER_PARTS_[key]; }
function summaryComparePoint_(point) {
  if (!point || !CORE_PHONICS_SHARED_TIER_PARTS_[point.measure]) return point;
  var clean = {};
  for (var k in point) clean[k] = point[k];
  clean.benchmark_tier = null;
  clean.benchmark_reference = null;
  return clean;
}

/**
 * Skill dropdown options for one assessment type, keyed by the same series
 * key seriesKeyFor_ (Growth.gs) produces server-side -- must match exactly,
 * since getStudentSummary's `measure` filter compares against that key.
 * DIBELS/easyCBM/easyCBM Math/CORE Phonics each already have a per-measure
 * list loaded elsewhere in the app (ensureTypeDataLoaded_); Lexile/DRA have
 * no such list (their entry form is a couple of fixed fields, not a
 * per-measure loop) so their options are hardcoded here instead.
 */
function summaryCompareMeasureOptions_(type) {
  if (type === 'dibels') {
    // Composite listed FIRST (2026-09-22, at the school's request) -- it's
    // the weighted-combination "overall" DIBELS score (computeDibelsComposite,
    // Dibels.gs), so it's the natural default pick when comparing students
    // generally rather than on one specific sub-skill.
    return [{ value: 'composite', label: 'DIBELS Composite Score (overall)' }]
      .concat((state.dibelsMeasures || []).filter(function(m) { return m.id !== 'COMPOSITE'; }).map(function(m) { return { value: m.id.toLowerCase(), label: m.label }; }));
  }
  if (type === 'easycbm') {
    return (state.easyCbmMeasures || []).map(function(m) { return { value: m.id.toLowerCase(), label: m.label }; });
  }
  if (type === 'easycbm_math') {
    return (state.easyCbmMathMeasures || []).map(function(m) { return { value: m.id.toLowerCase(), label: m.label }; });
  }
  if (type === 'core_phonics') {
    // Parts A/B/C/D_long/D_short (2026-10-08, at the school's request --
    // "these are the only sections given for K5 and 1st"): scoreCorePhonics
    // (CorePhonics.gs) never gives these five their own tier -- once the
    // full alphabet battery is given, all five get overwritten with the
    // COMBINED 83-point score's tier instead. Listed here now (previously
    // excluded entirely, 2026-09-22) since comparing their real raw scores
    // is genuinely useful at K/1 where they're the whole picture -- but see
    // CORE_PHONICS_SHARED_TIER_PARTS_/summaryComparePoint_ below, which
    // strips that borrowed tier/reference specifically for these 5 before
    // display, so a per-part comparison never shows a status badge that's
    // actually about the combined battery, not that one part. Parts E-L
    // each have their own real per-part cut table and compare validly WITH
    // their tier, same as before.
    return [{ value: 'letter_names_and_sounds', label: 'Alphabet Skills & Letter Sounds (combined, overall)' }]
      .concat((state.corePhonicsParts || [])
        .map(function(p) { return { value: 'part_' + p.id.toLowerCase(), label: 'Part ' + p.id.replace('_long', ' (long)').replace('_short', ' (short)') + ' — ' + p.label }; }));
  }
  if (type === 'lexile') {
    return [{ value: 'lexile_score', label: 'Lexile Score' }, { value: 'oral_reading_fluency', label: 'Oral Reading Fluency (words correct/min)' }];
  }
  if (type === 'dra') {
    // Combined option listed FIRST (2026-09-22, at the school's request --
    // "shouldn't DRA compare both the level and wcpm somehow"): DRA Level
    // alone is a grade-placement comparison, not a norm-referenced score
    // (draLevelTier_, Dra.gs has no real percentile tier of its own), so it
    // only tells half the story on its own -- the bundled Oral Reading
    // Fluency sub-measure is the other half. Value is comma-joined (an
    // HTML <option> can only carry one string) -- split back into the
    // array getStudentSummary's `measure` now accepts (see runSummaryReport_).
    return [{ value: 'dra_level,oral_reading_fluency', label: 'DRA Level & Oral Reading Fluency (combined)' },
      { value: 'dra_level', label: 'DRA Level only' }, { value: 'oral_reading_fluency', label: 'Oral Reading Fluency only' }];
  }
  return [];
}

/**
 * 2026-09-24 (Grouping #3 from the report-ideas backlog, "quick win"):
 * Compare mode used to allow exactly ONE assessment+skill pair. Now allows
 * 1-3, each its own independent (type, measure) slot -- reads back into
 * getStudentSummary's own `measure` array (Summary.gs already supported an
 * array of series keys, built for DRA's Level+WCPM combo; this just lets
 * the CLIENT build that array from any 1-3 picks instead of only DRA's
 * hardcoded pair) and renders via the existing renderSummaryCombinedResults_
 * table once 2+ series keys are in play, or the single-skill bar chart when
 * there's exactly one -- see runSummaryReport_'s measure-count check.
 */
// 2026-10-08, at the school's request ("any reason we can't compare by more
// than 3 items... core phonics... gets weird to print it on two different
// reports"): no server-side limit ever existed (getStudentSummary's measure
// filter takes an array of any length) -- 3 was purely a client UI choice.
// Raised to comfortably cover CORE Phonics' 5 alphabet parts (A/B/C/D_long/
// D_short) in one single report instead of splitting across two. See
// measureHasOwnStatus_ above: those 5 parts also skip their Status column
// in the combined table, so a 5-part comparison stays a reasonable width
// instead of doubling for a column with no real information in it.
var SUMMARY_MAX_COMPARE_SLOTS_ = 8;

/** Reads whatever's currently selected in each rendered slot row back into state, before any structural re-render (add/remove a slot, change a type) that would otherwise blow away unsaved picks in the other rows. */
function syncCompareSlotsFromDom_() {
  (state.summaryForm.compare_slots || []).forEach(function(slot, i) {
    var typeEl = document.getElementById('sum-compare-type-' + i);
    var measureEl = document.getElementById('sum-compare-measure-' + i);
    if (typeEl) slot.type = typeEl.value;
    if (measureEl) slot.measure = measureEl.value;
  });
}

/** Lazy-loads whichever type's measure list summaryCompareMeasureOptions_ needs (same ensureTypeDataLoaded_ every New Assessment form already uses) for the slot at `idx`, then re-renders the picker with that slot's Skill dropdown populated. */
function onSummaryCompareSlotTypeChanged_(idx) {
  syncCompareSlotsFromDom_();
  var slot = state.summaryForm.compare_slots[idx];
  var typeEl = document.getElementById('sum-compare-type-' + idx);
  slot.type = typeEl ? typeEl.value : '';
  slot.measure = ''; // changing the type invalidates whatever skill was picked for the old one
  if (!slot.type) { renderSummaryPicker_(); return; }
  ensureTypeDataLoaded_(slot.type).then(renderSummaryPicker_).catch(function(err) { toast('Error: ' + err.message); });
}

/** Adds an empty (type, measure) slot, up to SUMMARY_MAX_COMPARE_SLOTS_. */
function addSummaryCompareSlot_() {
  syncCompareSlotsFromDom_();
  if (state.summaryForm.compare_slots.length >= SUMMARY_MAX_COMPARE_SLOTS_) return;
  state.summaryForm.compare_slots.push({ type: '', measure: '' });
  renderSummaryPicker_();
}

/** Removes the slot at `idx` -- never below 1 slot (Compare mode always needs at least one). */
function removeSummaryCompareSlot_(idx) {
  syncCompareSlotsFromDom_();
  if (state.summaryForm.compare_slots.length <= 1) return;
  state.summaryForm.compare_slots.splice(idx, 1);
  renderSummaryPicker_();
}

function toggleSummaryMode_() {
  state.summaryForm.report_mode = document.querySelector('input[name="sum-mode"]:checked').value;
  // Neither the Matrix nor Ranking allow All Time (see renderSummaryPicker_'s
  // own comment) -- force this off so a stale true from Overview/Compare
  // can't leak in and skip reading the Year/Season selects at submit time.
  if (state.summaryForm.report_mode === 'matrix' || state.summaryForm.report_mode === 'ranking') state.summaryForm.all_time = false;
  renderSummaryPicker_();
}

/** Lazy-loads whichever type's measure list summaryCompareMeasureOptions_ needs (reused here for the matrix's column list too) for the Skill Profile Matrix's single Assessment picker, then re-renders. */
function onSummaryMatrixTypeChanged_() {
  var typeEl = document.getElementById('sum-matrix-type');
  state.summaryForm.matrix_type = typeEl ? typeEl.value : '';
  if (!state.summaryForm.matrix_type) { renderSummaryPicker_(); return; }
  ensureTypeDataLoaded_(state.summaryForm.matrix_type).then(renderSummaryPicker_).catch(function(err) { toast('Error: ' + err.message); });
}

function toggleSummaryScope_() {
  state.summaryForm.all_time = document.querySelector('input[name="sum-scope"]:checked').value === 'all_time';
  renderSummaryPicker_();
}

function renderSummaryPicker_() {
  var f = state.summaryForm;
  var isCompare = f.report_mode === 'compare';
  var isMatrix = f.report_mode === 'matrix';
  var isRanking = f.report_mode === 'ranking';
  var html = '<div class="card"><h2>Summary — Scores &amp; Risk by Test</h2>'
    // 2026-09-22, at the school's request ("it's confusing... tighten this
    // up"): the Assessments checkboxes and the Compare dropdowns used to
    // BOTH show at once, with no visual signal that picking one silently
    // overrode the other. A single mode toggle (same radio-pair pattern
    // Time scope already uses below) now shows exactly one of the two --
    // never both -- so there's only ever one obvious way to pick what
    // you're looking at. Extended 2026-09-26 (Grouping #1 from the report-
    // ideas backlog) with a third mode -- the Skill Profile Matrix -- for
    // "which students share the same weak sub-skill," which a single
    // combined score (DIBELS Composite, CORE Phonics combined) can hide.
    + '<label>What do you want to see?</label>'
    + '<div style="display:flex;gap:16px;flex-wrap:wrap;margin-bottom:14px">'
    + '<label style="display:flex;align-items:center;gap:6px;font-weight:600;font-size:.85rem;margin:0"><input type="radio" name="sum-mode" value="overview" onchange="toggleSummaryMode_()"' + (!isCompare && !isMatrix && !isRanking ? ' checked' : '') + ' /> Overview (latest score per skill)</label>'
    + '<label style="display:flex;align-items:center;gap:6px;font-weight:600;font-size:.85rem;margin:0"><input type="radio" name="sum-mode" value="compare" onchange="toggleSummaryMode_()"' + (isCompare ? ' checked' : '') + ' /> Compare students on 1-' + SUMMARY_MAX_COMPARE_SLOTS_ + ' skills</label>'
    + '<label style="display:flex;align-items:center;gap:6px;font-weight:600;font-size:.85rem;margin:0"><input type="radio" name="sum-mode" value="matrix" onchange="toggleSummaryMode_()"' + (isMatrix ? ' checked' : '') + ' /> Skill Profile Matrix (grouping tool)</label>'
    // Real find, 2026-09-27 (administrator-requested feature, corrected a
    // THIRD time after the administrator's own feedback -- "you can't just
    // view that information, you still have to choose an assessment"):
    // a genuine separate mode, not a checkbox nested inside Matrix mode,
    // since it needs no assessment-type pick at all -- only a period.
    + '<label style="display:flex;align-items:center;gap:6px;font-weight:600;font-size:.85rem;margin:0"><input type="radio" name="sum-mode" value="ranking" onchange="toggleSummaryMode_()"' + (isRanking ? ' checked' : '') + ' /> Schoolwide Skill Ranking</label>'
    + '</div>';

  if (isRanking) {
    html += '<p class="muted" style="margin-bottom:12px">Every skill across every assessment type, worst to best, by % of tested students below benchmark for one period — answers "is our weakest spot in reading or math right now" without picking any one assessment type. Pick a specific School Year AND Season below (no "All time" here, same reasoning as the Matrix).</p>';
  } else if (isMatrix) {
    html += '<p class="muted" style="margin-bottom:12px">Pick ONE assessment, a specific School Year AND Season (required below — every column needs to reflect the same checkpoint, so there\'s no "All time" here), and optionally a grade — shows every student × every one of its skills in a grid, color-coded by tier, so shared weak spots jump out for grouping (a combined score like DIBELS Composite can hide a single weak sub-skill; this shows every sub-skill at once). Pick a grade to keep it readable — a schoolwide grid gets wide fast.</p>'
      + '<div class="field-row"><div class="field" style="max-width:280px"><label>Assessment</label><select id="sum-matrix-type" onchange="onSummaryMatrixTypeChanged_()">'
      + '<option value="">Select…</option>'
      + state.assessmentTypes.map(function(t) { return '<option value="' + t.id + '"' + (f.matrix_type === t.id ? ' selected' : '') + '>' + escapeHtml(t.label) + '</option>'; }).join('')
      + '</select></div></div>';
  } else if (isCompare) {
    html += '<p class="muted" style="margin-bottom:12px">Pick 1-3 assessment+skill pairs, a period (or all time), and optionally a grade — ranks every matching student side by side, each showing their LATEST result (one skill shows a bar chart; 2-3 shows a side-by-side table so you can spot who\'s flagged on more than one). Under All time, hover a result for the grade/date it\'s actually from — a grade filter picks students by their current grade, not by what grade the test itself was given at. Leave grade blank to compare across every grade at once (grouped by tier for a single skill, since raw scores from different grades aren\'t comparable).</p>'
      + state.summaryForm.compare_slots.map(function(slot, i) {
          return '<div class="field-row" style="align-items:flex-end">'
            + '<div class="field"><label>Assessment' + (i > 0 ? ' ' + (i + 1) : '') + '</label><select id="sum-compare-type-' + i + '" onchange="onSummaryCompareSlotTypeChanged_(' + i + ')">'
            + '<option value="">Select…</option>'
            + state.assessmentTypes.map(function(t) { return '<option value="' + t.id + '"' + (slot.type === t.id ? ' selected' : '') + '>' + escapeHtml(t.label) + '</option>'; }).join('')
            + '</select></div>'
            + '<div class="field"><label>Skill' + (i > 0 ? ' ' + (i + 1) : '') + '</label><select id="sum-compare-measure-' + i + '"' + (slot.type ? '' : ' disabled') + '>'
            + (slot.type ? ('<option value="">Select…</option>' + summaryCompareMeasureOptions_(slot.type).map(function(o) { return '<option value="' + o.value + '"' + (slot.measure === o.value ? ' selected' : '') + '>' + escapeHtml(o.label) + '</option>'; }).join('')) : '')
            + '</select></div>'
            + (state.summaryForm.compare_slots.length > 1 ? '<button type="button" class="btn btn-secondary btn-small" onclick="removeSummaryCompareSlot_(' + i + ')" title="Remove this skill" style="margin-bottom:14px">Remove</button>' : '')
            + '</div>';
        }).join('')
      + (state.summaryForm.compare_slots.length < SUMMARY_MAX_COMPARE_SLOTS_
          ? '<button type="button" class="btn btn-secondary btn-small" onclick="addSummaryCompareSlot_()" style="margin-bottom:14px">+ Add another skill (up to ' + SUMMARY_MAX_COMPARE_SLOTS_ + ')</button>'
          : '');
  } else {
    html += '<p class="muted" style="margin-bottom:12px">Pick one or more assessments, a period (or all time), and (optionally) a grade — see every matching student\'s LATEST score and tier per skill, one row each (not a full history — Growth on the student\'s own profile shows every past session). A grade filter always picks students CURRENTLY in that grade; under a specific period it also requires the test itself to have been given during that grade (a Kindergarten score won\'t show under a Grade 2 checkpoint), but under All time a result can come from any grade the student was in when tested — each row shows exactly which.</p>'
      + '<label>Assessments (leave all unchecked for every type)</label>'
      + '<div style="display:flex;flex-wrap:wrap;gap:10px;margin-bottom:14px">'
      + state.assessmentTypes.map(function(t) {
          var checked = f.assessment_types.indexOf(t.id) !== -1;
          return '<label style="display:flex;align-items:center;gap:6px;font-weight:600;font-size:.85rem;margin:0">'
            + '<input type="checkbox" class="sum-type-chk" value="' + t.id + '"' + (checked ? ' checked' : '') + ' /> ' + escapeHtml(t.label) + '</label>';
        }).join('')
      + '</div>';
  }

  // 2026-09-26, at the school's question ("do I have to choose a school
  // year or season? should all time even be an option"): the Matrix
  // compares MANY skills side by side for the SAME student -- if each
  // column showed its own separate "latest ever" result (what All Time, or
  // a blank Year/Season, does everywhere else in Summary), one column
  // could be from this week and another from two years ago, misrepresenting
  // a student's CURRENT profile and defeating the point of grouping by
  // what's true right now. So the Matrix always requires one specific,
  // real School Year AND Season -- no All Time, no blank "Any" -- every
  // column reflects the exact same checkpoint.
  // Real find, 2026-09-29 (administrator report -- "I'm super confused as to
  // when I'm supposed to choose All Time... reporting needs to be tightened
  // up"): Specific Period used to let School Year and/or Season stay blank
  // ("Any"), which quietly behaved almost exactly like All Time (spans
  // every period) but WITHOUT a trend and without looking like a broad
  // report -- a confusing third state that was neither a real single
  // checkpoint nor clearly "everything." Specific Period now always requires
  // a real School Year AND Season (same requirement Matrix/Ranking already
  // had), so there are exactly two distinct, honestly-labeled choices: one
  // exact checkpoint, or All Time.
  if (!isMatrix && !isRanking) {
    html += '<label>Time scope</label>'
      + '<div style="display:flex;gap:16px;margin-bottom:6px">'
      + '<label style="display:flex;align-items:center;gap:6px;font-weight:600;font-size:.85rem;margin:0"><input type="radio" name="sum-scope" value="period" onchange="toggleSummaryScope_()"' + (f.all_time ? '' : ' checked') + ' /> Specific period</label>'
      + '<label style="display:flex;align-items:center;gap:6px;font-weight:600;font-size:.85rem;margin:0"><input type="radio" name="sum-scope" value="all_time" onchange="toggleSummaryScope_()"' + (f.all_time ? ' checked' : '') + ' /> All time (shows trend)</label>'
      + '</div>'
      + '<p class="muted" style="font-size:.78rem;margin:0 0 14px">'
      + (f.all_time
          ? 'Every session ever recorded for these students, at whatever grade they were in each time — each result shows the grade/date it came from.'
          : 'One exact School Year + Season — every result is from that same real checkpoint, no earlier grade\'s score can show up here.')
      + '</p>';
  }

  if (isMatrix || isRanking || !f.all_time) {
    html += '<div class="field-row">'
      + '<div class="field"><label>School year</label><select id="sum-year"><option value="">Select…</option>'
      + (state.availableSchoolYears || []).map(function(y) { return '<option value="' + escapeHtml(y) + '"' + (f.school_year === y ? ' selected' : '') + '>' + escapeHtml(y) + '</option>'; }).join('')
      + '</select></div>'
      + '<div class="field"><label>Season</label><select id="sum-season"><option value="">Select…</option>'
      + ['Fall', 'Winter', 'Spring'].map(function(s) { return '<option' + (f.season === s ? ' selected' : '') + '>' + s + '</option>'; }).join('')
      + '</select></div>'
      + '</div>';
  }

  var sortedRoster = (state.roster || []).slice().sort(function(a, b) {
    return (a.first_name + a.last_initial).localeCompare(b.first_name + b.last_initial);
  });
  // Real find, 2026-09-27: Ranking is inherently whole-school (same
  // studentVisibleInScope_ scoping every other report already uses, no
  // separate grade/student narrowing in this first version) -- showing
  // Grade/Student controls that don't actually feed into the ranking call
  // would be misleading, so they're skipped entirely for this mode.
  if (!isRanking) {
    html += '<div class="field-row">'
      // 2026-09-26, at the school's request ("the grade automatically moves
      // based on student or it's not a choice... if you don't choose the
      // correct things it doesn't work"): once a specific Student is picked,
      // Grade is no longer a real independent choice -- it's just whatever
      // grade they happened to be in for a given session, and picking the
      // WRONG one used to silently zero out an otherwise-valid request (e.g.
      // Grade 2 + a period from when they were actually in Grade 1). So the
      // Grade control only shows at all when no specific Student is selected
      // ("everyone currently in Grade 2"); with a Student picked, their grade
      // automatically follows their own history instead (see getStudentSummary,
      // Summary.gs, which now ignores `grade` entirely whenever `student_id`
      // is set, not just hides the control).
      + (f.student_id ? '' : ('<div class="field" style="max-width:220px"><label>Grade (optional)</label><select id="sum-grade"><option value=""' + (f.grade ? '' : ' selected') + '>All Grades</option>'
          + NEW_ASSESSMENT_GRADE_OPTIONS.map(function(g) { return '<option value="' + g + '"' + (f.grade === g ? ' selected' : '') + '>' + (NEW_ASSESSMENT_GRADE_LABELS_[g] || g) + '</option>'; }).join('')
          + '</select></div>'
        // 2026-10-02, at the school's request ("I like seeing all the kids
        // tested in a grade but need a way to sort out just elc"): narrows
        // the SAME report down to just the ELC caseload (getElcElementaryAssignments_,
        // Code.gs -- same roster this app already uses for ELC-derived access
        // scope), combinable with Grade exactly like every other filter here.
        + '<div class="field" style="max-width:220px"><label>Student Group</label><select id="sum-elc"><option value=""' + (f.elc_only ? '' : ' selected') + '>All Students</option><option value="elc"' + (f.elc_only ? ' selected' : '') + '>ELC Only</option></select></div>'))
      + '<div class="field" style="max-width:260px"><label>Student (optional)</label><select id="sum-student" onchange="onSummaryStudentChanged_()"><option value="">All Students</option>'
      + sortedRoster.map(function(s) {
          return '<option value="' + s.student_id + '"' + (f.student_id === s.student_id ? ' selected' : '') + '>' + escapeHtml(s.first_name) + ' ' + escapeHtml(s.last_initial) + '. (Grade ' + escapeHtml(s.grade || '—') + ')</option>';
        }).join('')
      + '</select></div>'
      + (f.student_id ? '<p class="muted" style="align-self:flex-end;margin:0 0 10px;font-size:.8rem">Grade follows this student automatically across their whole history — not a separate choice while one student is selected.</p>' : '')
      + '</div>';
  }
  html += '<button class="btn btn-primary" onclick="runSummaryReport_()">Run Summary</button>'
    + '</div><div id="summary-results"></div>';
  app.innerHTML = html;

  if (state.summaryReport) renderSummaryResults_();
}

/** Re-renders the picker when the Student dropdown changes -- needed live (not just at submit time) because picking a specific student hides the now-irrelevant Grade control (see renderSummaryPicker_'s own comment). */
function onSummaryStudentChanged_() {
  var studentEl = document.getElementById('sum-student');
  state.summaryForm.student_id = studentEl ? studentEl.value : '';
  if (state.summaryForm.student_id) { state.summaryForm.grade = ''; state.summaryForm.elc_only = false; } // no longer a real choice once a student is picked
  renderSummaryPicker_();
}

function runSummaryReport_() {
  var f = state.summaryForm;
  var isCompare = f.report_mode === 'compare';
  var isMatrix = f.report_mode === 'matrix';
  var isRanking = f.report_mode === 'ranking';

  // Real find, 2026-09-27 (administrator-requested feature, corrected a
  // THIRD time after the administrator's own feedback): fully independent
  // of getStudentSummary/Overview/Compare/Matrix -- only needs a period,
  // never an assessment type, grade, or student.
  if (isRanking) {
    f.school_year = document.getElementById('sum-year').value.trim();
    f.season = document.getElementById('sum-season').value;
    if (!f.school_year || !f.season) { toast('Pick a School Year AND Season for the Schoolwide Skill Ranking.'); return; }
    var rankingResultsSlot = document.getElementById('summary-results');
    rankingResultsSlot.innerHTML = '<div class="card"><p class="muted">Loading…</p></div>';
    call('getSchoolwideSkillRanking', f.school_year, f.season).then(function(ranking) {
      if (!ranking) throw new Error('getSchoolwideSkillRanking returned nothing.');
      state.schoolwideSkillRanking = ranking;
      state.summaryReport = { __client_mode: 'ranking', school_year: f.school_year, season: f.season };
      renderSummaryResults_();
    }).catch(function(err) { toast('Error: ' + err.message); rankingResultsSlot.innerHTML = ''; });
    return;
  }

  if (isMatrix) f.all_time = false; // the Matrix never allows All Time -- see renderSummaryPicker_'s own comment
  if (!f.all_time) {
    f.school_year = document.getElementById('sum-year').value.trim();
    f.season = document.getElementById('sum-season').value;
  }
  if (isMatrix && (!f.school_year || !f.season)) { toast('Pick a School Year AND Season for the Skill Profile Matrix — every column needs to reflect the same checkpoint.'); return; }
  // Real find, 2026-09-29: Specific Period no longer offers "Any" for
  // School Year/Season (see renderSummaryPicker_'s own comment) -- this
  // backs that up server-request-side too, in case the picker somehow
  // renders stale/blank selects.
  if (!isMatrix && !f.all_time && (!f.school_year || !f.season)) { toast('Pick a School Year AND Season, or switch to All time.'); return; }
  f.student_id = document.getElementById('sum-student').value;
  // The Grade control isn't even rendered once a Student is selected (see
  // renderSummaryPicker_) -- f.grade is already '' from onSummaryStudentChanged_
  // in that case, so there's nothing to read back here.
  var gradeEl = document.getElementById('sum-grade');
  if (gradeEl) f.grade = gradeEl.value.trim();
  var elcEl = document.getElementById('sum-elc');
  if (elcEl) f.elc_only = elcEl.value === 'elc';

  var compareAssessmentTypes = [];
  var compareMeasureKeys = [];
  if (isCompare) {
    syncCompareSlotsFromDom_();
    // Only fully-filled (type AND measure) slots count -- lets someone add
    // a 3rd row, change their mind, and leave it blank without it blocking
    // the run. At least the first slot must be filled.
    var filledSlots = f.compare_slots.filter(function(s) { return s.type && s.measure; });
    if (filledSlots.length === 0) { toast('Pick at least one assessment AND skill to compare.'); return; }
    filledSlots.forEach(function(s) {
      if (compareAssessmentTypes.indexOf(s.type) === -1) compareAssessmentTypes.push(s.type);
      // A comma-joined value (currently only DRA's combined option) means
      // "this one slot is actually 2 series keys together" -- see
      // summaryCompareMeasureOptions_'s DRA branch and getStudentSummary's
      // measureFilterList (Summary.gs).
      (s.measure.indexOf(',') !== -1 ? s.measure.split(',') : [s.measure]).forEach(function(k) {
        if (compareMeasureKeys.indexOf(k) === -1) compareMeasureKeys.push(k);
      });
    });
  } else if (isMatrix) {
    var matrixTypeEl = document.getElementById('sum-matrix-type');
    f.matrix_type = matrixTypeEl ? matrixTypeEl.value : '';
    if (!f.matrix_type) { toast('Pick an assessment for the Skill Profile Matrix.'); return; }
    // Clears out whatever was picked in Compare mode, same reasoning as the
    // Overview branch below.
    f.compare_slots = [{ type: '', measure: '' }];
  } else {
    f.assessment_types = Array.prototype.slice.call(document.querySelectorAll('.sum-type-chk:checked')).map(function(el) { return el.value; });
    // Clears out whatever was picked the last time Compare mode ran --
    // otherwise switching back to Overview without touching these could
    // silently carry a stale measure filter into an Overview request.
    f.compare_slots = [{ type: '', measure: '' }];
  }

  var resultsSlot = document.getElementById('summary-results');
  resultsSlot.innerHTML = '<div class="card"><p class="muted">Loading…</p></div>';
  call('getStudentSummary', {
    assessment_types: isCompare ? compareAssessmentTypes : (isMatrix ? [f.matrix_type] : f.assessment_types),
    all_time: f.all_time,
    school_year: f.school_year,
    season: f.season,
    grade: f.grade,
    elc_only: f.elc_only,
    student_id: f.student_id,
    // Exactly one series key overall -> plain string (keeps the single-skill
    // bar chart view, renderSummaryCompareResults_); 2-3 -> array (the
    // side-by-side table, renderSummaryCombinedResults_) -- same array
    // shape Summary.gs already accepted for DRA's combined option, just now
    // built from any 1-3 picks instead of only that one hardcoded pair.
    // Matrix mode leaves this blank/undefined (same as Overview) so
    // getStudentSummary returns EVERY measure recorded for the chosen
    // assessment type, not just one picked skill.
    measure: isCompare ? (compareMeasureKeys.length > 1 ? compareMeasureKeys : compareMeasureKeys[0]) : undefined
  }).then(function(report) {
    if (!report) throw new Error('getStudentSummary returned nothing.');
    // Overview and the Matrix both leave report.measure blank, so the
    // response shape alone can't tell them apart the way Compare's
    // report.measure already does -- this marker rides along on the
    // response object itself (not state.summaryForm, which could drift if
    // the mode radio is flipped again before re-running), so a render
    // triggered later from a stale report is never misinterpreted.
    report.__client_mode = isMatrix ? 'matrix' : (isCompare ? 'compare' : 'overview');
    state.matrixSort = null; // a fresh report always starts back at the default grouped-by-weakest-skill view -- a stale sort key from a previous assessment/grade may not even exist in this one's columns
    state.matrixGroupCap = null; // a group-size cap chosen for one assessment/grade shouldn't silently carry over to a different one
    state.summaryReport = report;
    renderSummaryResults_();
  }).catch(function(err) { toast('Error: ' + err.message); resultsSlot.innerHTML = ''; });
}

// Phase 28 (Phase 6a review finding): Summary could filter by assessment
// type/period/grade/student, but not by the thing a principal usually
// actually wants -- "just show me who's at risk" or "who's headed the
// wrong direction" -- without manually scanning every card. Purely a
// client-side re-slice of the already-fetched report (no new server call
// needed, since risk tier and trend are already returned per measure);
// reuses pointStatusBucket_ (good/caution/risk/meets_untiered/unbenchmarked,
// Growth chart's own classification) so this stays consistent with how
// tier status is judged everywhere else in the app, rather than a second
// parallel definition of "at risk."
var SUMMARY_QUICK_FILTERS = [
  { key: '', label: 'All' },
  { key: 'at_risk', label: 'At Risk' },
  { key: 'some_risk', label: 'Some Risk' },
  { key: 'on_track', label: 'On Track' },
  { key: 'not_benchmarked', label: 'Not Benchmarked' },
  { key: 'declining', label: 'Declining' },
  { key: 'improving', label: 'Improving' }
];

/** True if measure `m` matches quick-filter `filterKey` -- '' (All) always matches. */
function summaryMeasureMatchesFilter_(m, filterKey) {
  if (!filterKey) return true;
  if (filterKey === 'declining' || filterKey === 'improving') return m.trend === filterKey;
  var bucket = pointStatusBucket_(m);
  if (filterKey === 'at_risk') return bucket === 'risk';
  if (filterKey === 'some_risk') return bucket === 'caution';
  if (filterKey === 'on_track') return bucket === 'good' || bucket === 'meets_untiered';
  if (filterKey === 'not_benchmarked') return bucket === 'unbenchmarked';
  return true;
}

/** Every student from the report, narrowed to just the measures matching the active quick filter, with students left with zero matches dropped entirely. Filter '' (All) returns the report's students/measures unchanged. */
function applySummaryQuickFilter_(students, filterKey) {
  if (!filterKey) return students;
  return students.map(function(s) {
    return Object.assign({}, s, { measures: s.measures.filter(function(m) { return summaryMeasureMatchesFilter_(m, filterKey); }) });
  }).filter(function(s) { return s.measures.length > 0; });
}

function onSummaryQuickFilterChange_() {
  state.summaryQuickFilter = document.getElementById('summary-quick-filter').value;
  renderSummaryResults_();
}

function renderSummaryResults_() {
  var r = state.summaryReport;
  var slot = document.getElementById('summary-results');
  if (!r || !slot) return;

  // Ranking mode has no per-student report shape at all (r.students doesn't
  // exist) -- handled entirely separately from Overview/Compare/Matrix below.
  if (r.__client_mode === 'ranking') {
    slot.innerHTML = renderSchoolwideSkillRanking_();
    return;
  }

  var filteredStudents = applySummaryQuickFilter_(r.students, state.summaryQuickFilter);
  var scopeText = r.all_time ? 'All time' : ([r.season, r.school_year].filter(Boolean).join(' ') || 'Any period');
  var html = '<div class="card"><h2>'
    + (state.summaryQuickFilter ? filteredStudents.length + ' of ' + r.students.length + ' matching students' : r.students.length + ' of ' + r.total_active_students + ' students have matching data')
    + '</h2>'
    + '<p class="muted" style="margin-bottom:12px">' + escapeHtml(scopeText) + (r.grade ? ' · Grade ' + escapeHtml(r.grade) : '') + (r.elc_only ? ' · ELC Only' : '') + '</p>'
    + '<div class="field" style="max-width:220px;margin-bottom:10px"><label>Show</label><select id="summary-quick-filter" onchange="onSummaryQuickFilterChange_()">'
    + SUMMARY_QUICK_FILTERS.map(function(f) { return '<option value="' + f.key + '"' + (state.summaryQuickFilter === f.key ? ' selected' : '') + '>' + escapeHtml(f.label) + '</option>'; }).join('')
    + '</select></div>'
    + (state.summaryQuickFilter === 'declining' || state.summaryQuickFilter === 'improving'
        ? '<p class="muted" style="font-size:.78rem;margin-bottom:10px">Trend needs at least 2 recorded results for a measure — only shows under "All time" scope.</p>' : '')
    + '<button class="btn btn-secondary btn-small" onclick="exportSummaryCsv_()">Export CSV</button>'
    + '</div>';

  if (filteredStudents.length === 0) {
    html += '<div class="card"><div class="empty-state">'
      + (state.summaryQuickFilter ? 'No students match this filter within the current scope.' : 'No students have recorded results matching this scope yet.')
      + '</div></div>';
  } else if (r.__client_mode === 'matrix') {
    html += renderSummaryMatrixResults_(r, filteredStudents);
  } else if (r.measure) {
    html += renderSummaryCompareResults_(r, filteredStudents);
  } else {
    filteredStudents.forEach(function(s) {
      html += '<div class="card">'
        + '<h2 style="font-size:.95rem">' + escapeHtml(s.first_name) + ' ' + escapeHtml(s.last_initial) + '. <span class="muted" style="font-weight:400">(Grade ' + escapeHtml(s.grade || '—') + ')</span></h2>';
      s.measures.forEach(function(m) {
        // Real find, 2026-09-29 (administrator report -- a "Grade 1" header
        // with results actually tested in K5 read as apples-to-oranges):
        // every row now shows the real date AND grade this SPECIFIC result
        // was tested at, flagged explicitly when it differs from the
        // student's CURRENT grade (the grade filter/header only reflects
        // who's included, not what grade every row's test was given at --
        // see getStudentSummary's own isPinnedSingleCheckpoint, Summary.gs).
        var gradeMismatch = m.grade_at_admin && String(s.grade || '') !== m.grade_at_admin;
        html += '<div style="display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid var(--line)">'
          + '<div><strong style="font-size:.85rem">' + escapeHtml(measureLabel_(m.measure)) + '</strong> '
          + '<span class="muted">' + escapeHtml(formatScoreText_(m.measure, m.raw_score, m.max_score, m.item_detail)) + '</span>'
          + '<br/><span class="muted" style="font-size:.74rem">' + escapeHtml(fmtDate(m.date))
          + (m.grade_at_admin ? ' · Grade ' + escapeHtml(m.grade_at_admin) + (gradeMismatch ? ' (tested at a different grade than shown above)' : '') : '')
          // 2026-09-26, at the school's request ("if you choice any for
          // year/season does it capture all the assessments... it doesn't
          // sound like it's doing that"): the score shown is always just the
          // MOST RECENT matching result -- when the current scope actually
          // matched more than one (a broad Year/Season, or All Time), say so
          // explicitly instead of leaving it looking like a single isolated
          // result, since a blank Year/Season already matches every period.
          + (m.point_count > 1 ? ' · most recent of ' + m.point_count + ' results' : '')
          + '</span>'
          + '</div>'
          + '<div style="display:flex;align-items:center;gap:8px">'
          + (m.trend && m.trend !== 'insufficient data' ? '<span class="muted" style="font-size:.76rem">' + escapeHtml(m.trend) + '</span>' : '')
          + measureStatusBadge_(m) + '</div></div>';
      });
      html += '</div>';
    });
  }

  slot.innerHTML = html;
}

/**
 * "Compare students on one skill" results (2026-09-22, at the school's
 * request). Each student in `students` has exactly one entry in .measures
 * (getStudentSummary's `measure` filter already narrowed it). Two shapes,
 * both born out of the same real constraint -- raw scores from different
 * grades' benchmark charts aren't comparable, but benchmark TIER already
 * accounts for grade (it's a percentile/cut-score comparison, not a raw
 * number):
 *   - A grade filter is set -> one flat table, ranked by raw score
 *     (comparable within a single grade), best first.
 *   - No grade filter (comparing across every grade) -> grouped by tier
 *     bucket instead (worst group first, so the students needing the most
 *     attention are immediately visible), grade shown per student since
 *     the ranking itself no longer implies it.
 */
// Real find, 2026-09-27 (independent code review, "design & spacing"): the
// same 3 core risk colors (red/yellow/green) were hardcoded as separate
// string literals in 4 different places across this file (COMPARE_BUCKET_
// BAR_COLORS_ below, DASHBOARD_BUCKET_COLORS, and the tier-name map in
// tierColorHex_) -- already consistent in VALUE (confirmed identical hex
// everywhere), but with no single source, a future color tweak would need
// to be found and changed in all 4 places by hand. One shared set of named
// constants now backs those 3 -- each map still keeps its own vocabulary
// (bucket keys vs. tier names), only the actual color values are unified.
// COMPARE_BUCKET_COLORS_ right below is deliberately NOT part of this --
// its pastel tints are a genuinely different set of values, not a repeat.
var RISK_COLOR_RED_ = '#ef4444';
var RISK_COLOR_YELLOW_ = '#eab308';
var RISK_COLOR_GREEN_ = '#22c55e';

// Same 5 buckets pointStatusBucket_ already classifies every point into,
// mapped to the exact pastel shades the .badge-* classes already use
// (Index.html's <style>, e.g. .badge-red { background: #fee2e2 }) -- a
// whole-row tint at that same intensity reads as "color-coded," not
// "highlighted/flagged," staying consistent with what those colors already
// mean everywhere else in the app instead of inventing a new palette.
var COMPARE_BUCKET_COLORS_ = { risk: '#fee2e2', caution: '#fef9c3', good: '#dcfce7', meets_untiered: '#ccfbf1', unbenchmarked: '#f4f4f4' };
var COMPARE_BUCKET_LABELS_ = { risk: 'At Risk', caution: 'Some Risk', good: 'On Track', meets_untiered: 'Meeting Expectations (not tiered)', unbenchmarked: 'Not Benchmarked' };
var COMPARE_BUCKET_ORDER_ = ['risk', 'caution', 'good', 'meets_untiered', 'unbenchmarked'];

/** Mean of whatever numeric raw scores are present, rounded to 1 decimal -- null if none. Shared by the on-screen summary line and the print report's same line. */
function compareScoreStats_(rows) {
  var scores = rows.map(function(row) { return Number(row.point.raw_score); }).filter(function(n) { return !isNaN(n); });
  if (!scores.length) return null;
  var sum = scores.reduce(function(a, b) { return a + b; }, 0);
  return { count: scores.length, avg: Math.round((sum / scores.length) * 10) / 10, min: Math.min.apply(null, scores), max: Math.max.apply(null, scores) };
}

/** One ranked table's rows, WITH a proportional score bar (scaled to this table's own highest score) -- the actual "easily shows the comparison" ask: a glance at bar length says as much as the number next to it. `showGrade` includes a Grade column (the cross-grade view needs it; a single-grade table doesn't). */
// Status colors for the compare bar chart (2026-09-23, at the school's
// request for "a graph... visually shows the comparison"): reuses hex
// values ALREADY live elsewhere in this app (DASHBOARD_BUCKET_COLORS'
// at_risk/some_risk/on_track, and pointColor_'s teal for "meets benchmark,
// untiered") rather than a new ad hoc palette -- one reserved, consistent
// meaning for these colors across the whole app, per the dataviz skill's
// "status is fixed... reserved meaning" rule. Deliberately distinct from
// COMPARE_BUCKET_COLORS_ (the pale tints used for row/table backgrounds
// elsewhere) -- a bar's FILL needs the fully-saturated step, not the tint.
var COMPARE_BUCKET_BAR_COLORS_ = { risk: RISK_COLOR_RED_, caution: RISK_COLOR_YELLOW_, good: RISK_COLOR_GREEN_, meets_untiered: '#14b8a6', unbenchmarked: '#94a3b8' };

/**
 * Horizontal bar chart, one row per student (2026-09-23, at the school's
 * request -- a line graph doesn't fit here: lines show change over time for
 * ONE series, this is a magnitude comparison across many discrete people,
 * which is what bars are for). Plain inline SVG, same self-contained
 * convention buildGrowthChartSvg_ already uses -- text/gridlines take the
 * app's ink/line CSS tokens (dark-mode-safe for free, same as every other
 * chart here); only the bar FILL carries data color, per "text never wears
 * the data color." Bar length is capped at 65% of the available track so
 * the value+status label at the tip never needs measuring or clipping --
 * simpler than exact text-width measurement, same practical effect.
 */
function buildCompareBarChartSvg_(rows, showGrade) {
  var maxScore = Math.max.apply(null, rows.map(function(row) { return Number(row.point.raw_score) || 0; }).concat([1]));
  var W = 600, rowH = 30, barH = 18, labelW = 150, trackW = W - labelW - 10;
  var H = rows.length * rowH + 8;

  var svg = '<svg viewBox="0 0 ' + W + ' ' + H + '" style="width:100%;height:auto;display:block">';
  rows.forEach(function(row, i) {
    var y = 4 + i * rowH;
    var midY = y + rowH / 2;
    var score = Number(row.point.raw_score) || 0;
    var pct = Math.max(0.03, Math.min(0.65, score / maxScore)); // floor so even a 0/very-low score shows a sliver; capped so the tip label always has room
    var barW = pct * trackW;
    var color = COMPARE_BUCKET_BAR_COLORS_[pointStatusBucket_(row.point)] || '#94a3b8';
    var scoreText = formatScoreText_(row.point.measure, row.point.raw_score, row.point.max_score, row.point.item_detail);
    var statusText = pointStatusText_(row.point);
    // Real find, 2026-09-29 (administrator report -- a grade-filtered
    // report can still mix in a score tested at an earlier grade under All
    // Time/Any period): row.grade is the student's CURRENT grade;
    // row.point.grade_at_admin is what grade THIS result was actually
    // tested at -- flag it inline, not just on hover, whenever they differ.
    var testedGrade = row.point.grade_at_admin || '';
    var gradeMismatch = testedGrade && testedGrade !== String(row.grade || '');
    var dateText = fmtDate(row.point.date);
    var titleText = row.first_name + ' ' + row.last_initial + '.' + (showGrade ? ' (Grade ' + (row.grade || '—') + ')' : '') + ': ' + scoreText + ' — ' + statusText
      + (dateText ? ' · tested ' + dateText : '') + (testedGrade ? ' (Grade ' + testedGrade + ' at the time)' : '');

    svg += '<g' + (row.student_id ? ' onclick="openStudent(\'' + row.student_id + '\')" style="cursor:pointer"' : '') + '>'
      + '<title>' + escapeXmlAttr_(titleText) + '</title>'
      + '<text x="4" y="' + midY.toFixed(1) + '" dominant-baseline="middle" font-size="12" fill="var(--ink)">'
        + escapeXmlText_(row.first_name + ' ' + row.last_initial + '.') + (showGrade ? '<tspan fill="var(--ink-soft)"> (Gr. ' + escapeXmlText_(row.grade || '—') + ')</tspan>' : '')
      + '</text>'
      + '<rect x="' + labelW + '" y="' + (y + (rowH - barH) / 2).toFixed(1) + '" width="' + Math.max(barW, 3).toFixed(1) + '" height="' + barH + '" rx="4" fill="' + color + '"/>'
      + '<text x="' + (labelW + barW + 8).toFixed(1) + '" y="' + midY.toFixed(1) + '" dominant-baseline="middle" font-size="11.5" fill="var(--ink)">'
        + escapeXmlText_(scoreText + ' — ' + statusText)
        + (gradeMismatch ? '<tspan fill="var(--ink-soft)" font-size="10"> (Gr. ' + escapeXmlText_(testedGrade) + ' then)</tspan>' : '')
      + '</text>'
      + '</g>';
    if (i > 0) svg += '<line x1="0" y1="' + y + '" x2="' + W + '" y2="' + y + '" stroke="var(--line)" stroke-width="1"/>';
  });
  svg += '</svg>';

  // Legend (dataviz skill: a status color always ships with an icon+label,
  // and is always present for 2+ distinct values here) -- only the buckets
  // actually present among these rows, so a within-grade chart that's all
  // Green doesn't show three irrelevant swatches.
  var present = [];
  rows.forEach(function(row) { var b = pointStatusBucket_(row.point); if (present.indexOf(b) === -1) present.push(b); });
  var legend = present.length > 1 ? '<div style="display:flex;flex-wrap:wrap;gap:12px;margin-top:6px;font-size:.76rem;color:var(--ink-soft)">'
    + present.map(function(b) {
        return '<span style="display:inline-flex;align-items:center;gap:5px"><span style="width:10px;height:10px;border-radius:3px;background:' + (COMPARE_BUCKET_BAR_COLORS_[b] || '#94a3b8') + ';display:inline-block"></span>' + escapeHtml(COMPARE_BUCKET_LABELS_[b]) + '</span>';
      }).join('') + '</div>' : '';

  return svg + legend;
}

/** Minimal SVG-safe text escaping for values placed inside <text>/<title> via string concatenation (not through escapeHtml, which HTML-entity-encodes differently than XML needs for &/</>). */
function escapeXmlText_(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}
function escapeXmlAttr_(s) {
  return escapeXmlText_(s).replace(/"/g, '&quot;');
}

// A "combined/overall" column (DIBELS Composite, CORE Phonics' combined
// Alphabet Skills score) summarizes the OTHER columns -- it's not itself an
// independent, targetable skill, so groupMatrixRows_ below excludes it from
// deciding what a student's shared weak spot even IS (letting it drive
// clustering would just re-create the "Composite hides a weak sub-skill"
// blind spot this whole Matrix exists to fix).
var MATRIX_EXCLUDE_FROM_CLUSTERING_ = { composite: true, letter_names_and_sounds: true };

/**
 * 2026-09-26, at the school's question ("should it group similar needs
 * together... we need to figure that out"): clusters students by their
 * SINGLE WORST non-combined skill instead of a straight severity ranking --
 * a straight ranking answers "who needs the most help," but a shared-skill
 * cluster answers the actually-actionable question, "who could go in the
 * same intervention group." Ties within the same worst bucket break on
 * column order (already a foundational-to-advanced progression for
 * DIBELS/CORE Phonics). A student whose worst column is only 'good' or
 * better (or who has no data on any clusterable column at all) has no real
 * shared weak spot to group on, so they land in one trailing catch-all
 * group instead of forcing them into a cluster that doesn't fit.
 *
 * Returns an array of { column, bucketRank, rows }, groups ordered
 * worst-bucket-first, biggest cluster first within the same bucket; the
 * trailing group has column: null.
 */
function groupMatrixRows_(rows, columns) {
  var clusterColumns = columns.filter(function(c) { return !MATRIX_EXCLUDE_FROM_CLUSTERING_[c.value]; });
  var riskRank = COMPARE_BUCKET_ORDER_.indexOf('risk');
  var cautionRank = COMPARE_BUCKET_ORDER_.indexOf('caution');

  function primaryWeakness_(row) {
    var worst = null, worstRank = COMPARE_BUCKET_ORDER_.length;
    clusterColumns.forEach(function(c) {
      var m = row.byKey[c.value];
      if (!m) return;
      var rank = COMPARE_BUCKET_ORDER_.indexOf(pointStatusBucket_(m));
      if (rank < worstRank) { worstRank = rank; worst = c; }
    });
    if (!worst || worstRank > cautionRank) return null; // nothing worse than "good"/"meets expectations" -- not a real grouping-worthy weakness
    return { column: worst, bucketRank: worstRank };
  }

  var groups = {};
  var noNeed = [];
  rows.forEach(function(row) {
    var weakness = primaryWeakness_(row);
    if (!weakness) { noNeed.push(row); return; }
    var key = weakness.column.value;
    if (!groups[key]) groups[key] = { column: weakness.column, bucketRank: weakness.bucketRank, rows: [] };
    groups[key].bucketRank = Math.min(groups[key].bucketRank, weakness.bucketRank); // reflect the group's TRUE worst member, not just whoever happened to be assigned first
    groups[key].rows.push(row);
  });

  var ordered = Object.keys(groups).map(function(k) { return groups[k]; }).sort(function(a, b) {
    return a.bucketRank - b.bucketRank // 'risk'-worst groups before 'caution'-worst groups
      || b.rows.length - a.rows.length // biggest cluster first -- the most useful group to actually form
      || clusterColumns.indexOf(a.column) - clusterColumns.indexOf(b.column);
  });
  ordered.forEach(function(g) {
    g.rows.sort(function(a, b) {
      var ma = a.byKey[g.column.value], mb = b.byKey[g.column.value];
      return (Number(ma && ma.raw_score) || 0) - (Number(mb && mb.raw_score) || 0); // worst score first within the cluster
    });
  });

  if (noNeed.length) {
    noNeed.sort(function(a, b) { return gradeSortCompareClient_(a.grade, b.grade) || (a.first_name + a.last_initial).localeCompare(b.first_name + b.last_initial); });
    ordered.push({ column: null, bucketRank: riskRank /* unused */, rows: noNeed });
  }
  return ordered;
}

/**
 * Grouping #2 from the report-ideas backlog (2026-09-26, at the school's
 * follow-up on the Matrix's clustering): "auto-suggested groups, capped at
 * a settable group size" -- a shared-weak-skill cluster from
 * groupMatrixRows_ can still be too large to actually run as ONE
 * intervention group (e.g. 14 students all weakest on the same DIBELS
 * sub-skill). When a cap is set, splits any cluster bigger than it into
 * consecutive "Group 1 of N" / "Group 2 of N" sub-groups -- rows are
 * already sorted worst-score-first within the cluster (groupMatrixRows_),
 * so Group 1 is always the most severe slice, not an arbitrary split. The
 * trailing "No Flagged Weak Skill" group (column: null) is never split --
 * it isn't an intervention cluster, just a catch-all.
 */
function splitMatrixGroupsByCap_(groups, groupCap) {
  if (!groupCap || groupCap < 1) return groups;
  var result = [];
  groups.forEach(function(g) {
    if (!g.column || g.rows.length <= groupCap) { result.push(g); return; }
    var chunkCount = Math.ceil(g.rows.length / groupCap);
    for (var i = 0; i < chunkCount; i++) {
      result.push({
        column: g.column,
        bucketRank: g.bucketRank,
        rows: g.rows.slice(i * groupCap, (i + 1) * groupCap),
        subgroupIndex: i + 1,
        subgroupCount: chunkCount
      });
    }
  });
  return result;
}

/** Group header text shared by the screen and print Matrix renderers -- includes the "Group X of Y" suffix when splitMatrixGroupsByCap_ split a cluster. */
function matrixGroupHeaderText_(g) {
  if (!g.column) return 'No Flagged Weak Skill (' + g.rows.length + ' student' + (g.rows.length === 1 ? '' : 's') + ')';
  var base = 'Weakest on: ' + g.column.label + ' (' + g.rows.length + ' student' + (g.rows.length === 1 ? '' : 's') + ', ' + COMPARE_BUCKET_LABELS_[COMPARE_BUCKET_ORDER_[g.bucketRank]] + ')';
  return g.subgroupCount ? base + ' — Group ' + g.subgroupIndex + ' of ' + g.subgroupCount : base;
}

/**
 * Grouping #1 from the report-ideas backlog (2026-09-26): students x every
 * skill for ONE assessment type, tier-colored cells -- the shared-weak-spot
 * grouping tool a single combined score (DIBELS Composite, CORE Phonics
 * combined) can hide, since a student can look "fine" on the composite
 * while being weak on one specific sub-skill. Columns come from
 * summaryCompareMeasureOptions_ (the same ordered per-type skill list the
 * Compare picker's Skill dropdown already uses), minus DRA's comma-joined
 * "combined" convenience option -- that value only exists for the Compare
 * picker's own UI, it's never a real stored measure key a student's
 * .measures could actually contain. Cell color reuses COMPARE_BUCKET_COLORS_
 * (the pale per-skill tint) -- unambiguous here since each CELL really is
 * exactly one skill, unlike the whole-ROW tinting removed from
 * renderSummaryCombinedResults_ on 2026-09-24 for being ambiguous across
 * several skills in one row. Rows are clustered by shared weak skill (see
 * groupMatrixRows_) rather than a flat severity ranking.
 */
/**
 * 2026-09-26, at the school's request ("is it possible to toggle to a
 * couple different ways to sort... in each column you're able to sort from
 * best to worst"): click any column header to flat-sort the whole table by
 * that one skill (or Student/Grade) instead of the default clustered view --
 * click again to flip best<->worst. state.matrixSort holds { key, dir },
 * key===null meaning "back to the default grouped-by-weakest-skill view"
 * (see groupMatrixRows_) -- reset whenever a new Summary report runs
 * (runSummaryReport_) so a stale sort from a previous matrix never silently
 * carries over to a different assessment/grade.
 */
function sortMatrixByColumn_(key) {
  var cur = state.matrixSort;
  state.matrixSort = (cur && cur.key === key) ? { key: key, dir: cur.dir === 'asc' ? 'desc' : 'asc' } : { key: key, dir: 'asc' };
  renderSummaryResults_();
}

/** Returns to the default clustered-by-weakest-skill view (see groupMatrixRows_), discarding any column sort. */
function resetMatrixGrouping_() {
  state.matrixSort = null;
  renderSummaryResults_();
}

/** Grouping #2 from the report-ideas backlog (2026-09-26) -- reads the Matrix's "Max group size" field and re-renders with clusters split accordingly (see splitMatrixGroupsByCap_). Blank/0/invalid clears the cap (no limit). */
function onMatrixGroupCapChange_() {
  var el = document.getElementById('matrix-group-cap');
  var n = el ? parseInt(el.value, 10) : NaN;
  state.matrixGroupCap = (!isNaN(n) && n > 0) ? n : null;
  renderSummaryResults_();
}

/** Flat (non-grouped) sort for the Matrix by one column -- 'student', 'grade', or a skill's column key ('asc' == worst-first for a score column, A-Z/lowest-grade-first for student/grade; 'desc' flips it). A student with no data on the sorted SKILL column always sorts to the very end regardless of direction, since "not administered" isn't meaningfully best or worst. */
function sortMatrixRowsByColumn_(rows, key, dir) {
  var sign = dir === 'asc' ? 1 : -1;
  var sorted = rows.slice();
  sorted.sort(function(a, b) {
    if (key === 'student') return sign * (a.first_name + a.last_initial).localeCompare(b.first_name + b.last_initial);
    if (key === 'grade') return sign * gradeSortCompareClient_(a.grade, b.grade);
    var ma = a.byKey[key], mb = b.byKey[key];
    var sa = ma ? Number(ma.raw_score) : null, sb = mb ? Number(mb.raw_score) : null;
    if (sa === null && sb === null) return 0;
    if (sa === null) return 1;
    if (sb === null) return -1;
    return sign * (sa - sb);
  });
  return sorted;
}

/** One matrix data row's <tr> -- shared by the default grouped view and the flat column-sort view so the cell logic only lives in one place. */
function matrixRowHtml_(row, columns, hideGrade) {
  return '<tr' + (row.student_id ? ' style="cursor:pointer" onclick="openStudent(\'' + row.student_id + '\')"' : '') + '>'
    + '<td><strong>' + escapeHtml(row.first_name) + ' ' + escapeHtml(row.last_initial) + '.</strong></td>'
    + (hideGrade ? '' : '<td>' + escapeHtml(row.grade || '—') + '</td>')
    + columns.map(function(c) {
        var m = row.byKey[c.value];
        if (!m) return '<td style="text-align:center;color:var(--ink-soft)">—</td>';
        var color = COMPARE_BUCKET_COLORS_[pointStatusBucket_(m)] || '#fff';
        var title = c.label + ': ' + formatScoreText_(c.value, m.raw_score, m.max_score, m.item_detail) + ' — ' + pointStatusText_(m);
        return '<td style="background:' + color + ';text-align:center" title="' + escapeHtml(title) + '">' + escapeHtml(String(m.raw_score)) + '</td>';
      }).join('')
    + '</tr>';
}

/** One clickable, sort-indicating <th> for the Matrix's header row. tooltip defaults to "Click to sort by <label>" when not given (e.g. a skill column passes its own full measure label, since `label` there is just the short abbreviation). */
function matrixHeaderCellHtml_(label, key, activeSort, center, tooltip) {
  var arrow = (activeSort && activeSort.key === key) ? (activeSort.dir === 'asc' ? ' ▲' : ' ▼') : '';
  return '<th style="cursor:pointer' + (center ? ';text-align:center' : '') + '" title="' + escapeHtml(tooltip || ('Click to sort by ' + label)) + '" onclick="sortMatrixByColumn_(\'' + key + '\')">' + escapeHtml(label) + arrow + '</th>';
}

/**
 * Schoolwide Skill Ranking (2026-09-27, administrator-requested feature,
 * corrected THREE times after the administrator's own feedback -- first for
 * appearing automatically, then for living inside a per-assessment-type
 * Matrix card, then for still requiring an assessment-type pick at all):
 * its own top-level Summary mode now (renderSummaryPicker_/runSummaryReport_),
 * needing only a period, nothing else. Combines every skill across every
 * assessment type for the selected period into one ranked list, so "is our
 * weakest spot in reading or math right now" can be answered without
 * flipping between several separate per-type Matrix screens, which this is
 * deliberately NOT a replacement for -- see getSchoolwideSkillRanking's own
 * comment (Summary.gs) for why this needed its own separate call.
 */
function renderSchoolwideSkillRanking_() {
  var r = state.summaryReport;
  var ranking = state.schoolwideSkillRanking;
  if (!ranking) return '<div class="card"><p class="muted">Loading…</p></div>';
  var skills = ranking.skills || [];

  var html = '<div class="card"><h2>Schoolwide Skill Ranking</h2>'
    + '<p class="muted" style="margin-bottom:10px">' + escapeHtml([r.season, r.school_year].filter(Boolean).join(' ') || '') + ' — every skill across every assessment type, worst to best, by % of tested students below benchmark.</p>';

  if (skills.length === 0) {
    html += '<div class="empty-state">Not enough tested students yet this period for a meaningful ranking.</div></div>';
    return html;
  }

  html += '<table class="trend-table"><thead><tr><th>Skill</th><th>Assessment</th><th>Below Benchmark</th><th>Tested</th></tr></thead><tbody>'
    + skills.map(function(s) {
        var typeLabel = (state.assessmentTypes.filter(function(t) { return t.id === s.assessment_type; })[0] || {}).label || s.assessment_type;
        var streakBadge = s.periods_running >= 2
          ? ' <span class="badge badge-yellow" style="margin-left:4px">Weak ' + s.periods_running + ' periods running</span>'
          : '';
        return '<tr><td>' + escapeHtml(measureLabel_(s.measure)) + streakBadge + '</td>'
          + '<td class="muted">' + escapeHtml(typeLabel) + '</td>'
          + '<td><strong>' + s.below_benchmark_pct + '%</strong></td>'
          + '<td class="muted">' + s.tested_count + '</td></tr>';
      }).join('')
    + '</tbody></table></div>';
  return html;
}

function renderSummaryMatrixResults_(r, students) {
  var type = (r.assessment_types || [])[0];
  var columns = summaryCompareMeasureOptions_(type).filter(function(o) { return o.value.indexOf(',') === -1; });
  var typeLabel = (state.assessmentTypes.filter(function(t) { return t.id === type; })[0] || {}).label || type;

  var rows = students.map(function(s) {
    var byKey = {};
    s.measures.forEach(function(m) { byKey[m.measure] = summaryComparePoint_(m); });
    return { student_id: s.student_id, first_name: s.first_name, last_initial: s.last_initial, grade: s.grade, byKey: byKey };
  });
  var activeSort = state.matrixSort;
  var colspan = 1 + (r.grade ? 0 : 1) + columns.length;

  var headerRow = '<tr>' + matrixHeaderCellHtml_('Student', 'student', activeSort) + (r.grade ? '' : matrixHeaderCellHtml_('Grade', 'grade', activeSort))
    + columns.map(function(c) { return matrixHeaderCellHtml_(measureAbbreviation_(c.value), c.value, activeSort, true, c.label + ' — click to sort'); }).join('')
    + '</tr>';

  var bodyHtml;
  if (activeSort) {
    bodyHtml = sortMatrixRowsByColumn_(rows, activeSort.key, activeSort.dir).map(function(row) { return matrixRowHtml_(row, columns, !!r.grade); }).join('');
  } else {
    var groups = splitMatrixGroupsByCap_(groupMatrixRows_(rows, columns), state.matrixGroupCap);
    bodyHtml = groups.map(function(g) {
      var groupHeaderRow = '<tr><td colspan="' + colspan + '" style="font-weight:700;background:var(--panel-alt,#f4f4f4);padding-top:10px">' + escapeHtml(matrixGroupHeaderText_(g)) + '</td></tr>';
      return groupHeaderRow + g.rows.map(function(row) { return matrixRowHtml_(row, columns, !!r.grade); }).join('');
    }).join('');
  }

  // Grouping #2 from the report-ideas backlog (2026-09-26, "don't be lazy"
  // -- built properly instead of assuming the Matrix's clustering alone
  // already covered it): a cap only makes sense against the clustered
  // view, not a column sort (which is already a flat list, not clusters),
  // so this control only shows there.
  var groupCapControl = activeSort ? '' : ('<div class="field" style="max-width:220px;margin-bottom:10px"><label>Max group size (optional)</label>'
    + '<input type="number" min="1" id="matrix-group-cap" value="' + (state.matrixGroupCap || '') + '" placeholder="No limit" onchange="onMatrixGroupCapChange_()" /></div>');

  var html = '<div class="card">'
    + '<div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-bottom:4px">'
    + '<h3 style="font-size:1.02rem;margin:0">Skill Profile Matrix — ' + escapeHtml(typeLabel) + (r.grade ? ' — Grade ' + escapeHtml(r.grade) : ' — All Grades') + '</h3>'
    + '<button class="btn btn-secondary btn-small" onclick="previewSummaryReportClick_()">Print Report</button>'
    + '</div>'
    + '<p class="muted" style="margin-bottom:4px">' + rows.length + ' student' + (rows.length === 1 ? '' : 's') + ' — click a row to open that student, click a column header to sort by it</p>'
    + (activeSort
        ? '<p class="muted" style="margin-bottom:12px;font-size:.8rem">Sorted by ' + escapeHtml(activeSort.key === 'student' ? 'Student' : (activeSort.key === 'grade' ? 'Grade' : measureLabel_(activeSort.key))) + ' (' + (activeSort.dir === 'asc' ? 'ascending' : 'descending') + '). <a href="javascript:void(0)" onclick="resetMatrixGrouping_()">Back to grouped-by-weakest-skill view</a></p>'
        : '<p class="muted" style="margin-bottom:12px;font-size:.8rem">Clustered by shared weakest skill, most urgent/largest cluster first (default). Set a max group size below to split a large cluster into smaller, actionable groups (worst first).</p>')
    + groupCapControl
    + '<div style="overflow-x:auto"><table class="trend-table compare-multi-table"><thead>' + headerRow + '</thead><tbody>'
    + bodyHtml
    + '</tbody></table></div>'
    + '<div style="display:flex;flex-wrap:wrap;gap:12px;margin-top:10px;font-size:.76rem;color:var(--ink-soft)">'
    + COMPARE_BUCKET_ORDER_.map(function(b) {
        return '<span style="display:inline-flex;align-items:center;gap:5px"><span style="width:10px;height:10px;border-radius:3px;border:1px solid var(--line);background:' + COMPARE_BUCKET_COLORS_[b] + ';display:inline-block"></span>' + escapeHtml(COMPARE_BUCKET_LABELS_[b]) + '</span>';
      }).join('')
    + '</div></div>';
  return html;
}

/** One matrix print row's <tr> -- same as matrixRowHtml_ but with studentPrintLabel_ (confidential-mode-aware) and no click-to-open (a printed page has no click). */
function matrixPrintRowHtml_(row, columns, hideGrade) {
  return '<tr><td>' + escapeHtml(studentPrintLabel_(row)) + '</td>'
    + (hideGrade ? '' : '<td>' + escapeHtml(row.grade || '—') + '</td>')
    + columns.map(function(c) {
        var m = row.byKey[c.value];
        if (!m) return '<td>—</td>';
        return '<td style="background:' + (COMPARE_BUCKET_COLORS_[pointStatusBucket_(m)] || '#fff') + '">' + escapeHtml(String(m.raw_score)) + '</td>';
      }).join('')
    + '</tr>';
}

/** Print version of renderSummaryMatrixResults_ -- mirrors whichever view (clustered, or a column sort) is currently active on screen, same columns/cell logic (groupMatrixRows_/sortMatrixRowsByColumn_), plain background-color cells (colors print fine; @media print's own rules elsewhere in this app already assume printed color is acceptable, e.g. status badges). Confidential mode via studentPrintLabel_, same as the other multi-student print reports. */
function buildSummaryMatrixReportHtml_() {
  var r = state.summaryReport;
  var type = (r.assessment_types || [])[0];
  var columns = summaryCompareMeasureOptions_(type).filter(function(o) { return o.value.indexOf(',') === -1; });
  var typeLabel = (state.assessmentTypes.filter(function(t) { return t.id === type; })[0] || {}).label || type;
  var students = applySummaryQuickFilter_(r.students, state.summaryQuickFilter);

  var rows = students.map(function(s) {
    var byKey = {};
    s.measures.forEach(function(m) { byKey[m.measure] = summaryComparePoint_(m); });
    return { student_id: s.student_id, first_name: s.first_name, last_initial: s.last_initial, grade: s.grade, byKey: byKey };
  });
  var activeSort = state.matrixSort;
  var colspan = 1 + (r.grade ? 0 : 1) + columns.length;

  var bodyHtml;
  var subtitle;
  if (activeSort) {
    bodyHtml = sortMatrixRowsByColumn_(rows, activeSort.key, activeSort.dir).map(function(row) { return matrixPrintRowHtml_(row, columns, !!r.grade); }).join('');
    subtitle = 'Sorted by ' + (activeSort.key === 'student' ? 'Student' : (activeSort.key === 'grade' ? 'Grade' : measureLabel_(activeSort.key))) + ' (' + (activeSort.dir === 'asc' ? 'ascending' : 'descending') + ')';
  } else {
    var groups = splitMatrixGroupsByCap_(groupMatrixRows_(rows, columns), state.matrixGroupCap);
    bodyHtml = groups.map(function(g) {
      var groupHeaderRow = '<tr><td colspan="' + colspan + '" style="font-weight:700;background:#f4f4f4">' + escapeHtml(matrixGroupHeaderText_(g)) + '</td></tr>';
      return groupHeaderRow + g.rows.map(function(row) { return matrixPrintRowHtml_(row, columns, !!r.grade); }).join('');
    }).join('');
    subtitle = 'Clustered by shared weakest skill' + (state.matrixGroupCap ? ', max ' + state.matrixGroupCap + ' per group' : '');
  }

  var scopeText = r.all_time ? 'All time' : ([r.season, r.school_year].filter(Boolean).join(' ') || 'Any period');
  var html = '<div style="max-width:960px;margin:0 auto;font-size:.86rem">'
    + printLetterheadHtml_('Skill Profile Matrix', typeLabel + ' — ' + (r.grade ? 'Grade ' + r.grade : 'All Grades') + ' · ' + scopeText + ' · Generated ' + fmtDate(todayIso_()))
    + '<p style="text-align:center;margin:0 0 18px;color:#444">' + rows.length + ' student' + (rows.length === 1 ? '' : 's') + ' — ' + escapeHtml(subtitle) + '</p>'
    + '<table><thead><tr><th>Student</th>' + (r.grade ? '' : '<th>Grade</th>')
    + columns.map(function(c) { return '<th>' + escapeHtml(measureAbbreviation_(c.value)) + '</th>'; }).join('')
    + '</tr></thead><tbody>'
    + bodyHtml
    + '</tbody></table></div>';
  return html;
}

/**
 * Combined-measure comparison (2026-09-22, at the school's request --
 * "shouldn't DRA compare both the level and wcpm somehow"; extended
 * 2026-09-24 for Grouping #3, up to 3 independently-picked skills instead
 * of just DRA's hardcoded pair): `r.measure` is an array of series keys --
 * each student's .measures can now carry up to one point per key instead
 * of always exactly one. One flat table, a Score+Status column PAIR per
 * measure. Sorted worst-first on the PRIMARY measure (keys[0]) since
 * ranking several different scales at once has no single well-defined
 * order -- but (2026-09-24, at the school's request: "I don't think the
 * whole row should take on the color of the [primary] score") no longer
 * row-tints by that measure, since with 2-3 different skills in view a
 * whole-row color read as if it described every column, not just the
 * first one -- each skill's own per-cell Status badge already carries its
 * own color, which is unambiguous.
 */
function renderSummaryCombinedResults_(r, students) {
  var keys = r.measure;
  var rows = students.map(function(s) {
    var byKey = {};
    s.measures.forEach(function(m) { byKey[m.measure] = summaryComparePoint_(m); });
    return { student_id: s.student_id, first_name: s.first_name, last_initial: s.last_initial, grade: s.grade, byKey: byKey };
  }).filter(function(row) { return keys.some(function(k) { return row.byKey[k]; }); }); // dropped by applySummaryQuickFilter_ down to zero matching measures

  // 2026-09-24, at the school's request ("I don't love it but I don't know
  // why" -- turned out to be a skill picked for a grade that assessment
  // doesn't even apply to, e.g. easyCBM for Grade 2 when easyCBM only
  // starts at Grade 4 -- rendering as a full column of "Not scored" badges,
  // pure visual noise with zero information): a skill with ZERO results
  // across every one of these students is dropped from the table (title,
  // header, columns, primary sort) and named in a one-line note instead, so
  // it's clear WHY it's missing rather than just silently absent. A skill
  // that has SOME but not all students scored is unaffected -- that's a
  // real, useful "not scored yet" per student, not this case.
  var presentKeys = keys.filter(function(k) { return rows.some(function(row) { return row.byKey[k]; }); });
  var droppedKeys = keys.filter(function(k) { return presentKeys.indexOf(k) === -1; });

  // Plain ascending raw score on the PRIMARY measure (the first SKILL that
  // actually has data, not necessarily the first one picked if that one got
  // dropped above) -- lowest (most concerning) first. Missing scores sort
  // last (Infinity), not first. Still grouped by grade first when no grade
  // filter is set -- raw scores from different grades aren't on the same
  // scale (same reason the single-measure view groups by tier instead of a
  // flat score sort across grades), so a flat cross-grade score sort would
  // be misleading.
  function primaryScoreRank_(row) {
    var m = row.byKey[presentKeys[0]];
    var score = m ? Number(m.raw_score) : NaN;
    return isNaN(score) ? Infinity : score;
  }
  rows.sort(function(a, b) {
    return gradeSortCompareClient_(a.grade, b.grade) || (primaryScoreRank_(a) - primaryScoreRank_(b));
  });

  var titleParts = presentKeys.map(measureLabel_).join(' & ');
  var html = '<div class="card">'
    + '<div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-bottom:4px">'
    + '<h3 style="font-size:1.02rem;margin:0">' + escapeHtml(titleParts) + (r.grade ? ' — Grade ' + escapeHtml(r.grade) : ' — All Grades') + '</h3>'
    + '<button class="btn btn-secondary btn-small" onclick="previewSummaryReportClick_()">Print Report</button>'
    + '</div>'
    + (droppedKeys.length ? '<p class="muted" style="margin-bottom:8px;font-size:.8rem">' + escapeHtml(droppedKeys.map(measureLabel_).join(', ')) + (droppedKeys.length === 1 ? ' has' : ' have') + ' no results for these students in this scope (often means that assessment doesn\'t apply at this grade) — left out of the table below.</p>' : '')
    + '<p class="muted" style="margin-bottom:12px">' + rows.length + ' student' + (rows.length === 1 ? '' : 's') + '</p>'
    + '<table class="trend-table compare-multi-table"><thead><tr><th>Student</th>' + (r.grade ? '' : '<th>Grade</th>')
    + presentKeys.map(function(k, i) { return '<th' + (i > 0 ? ' class="skill-group-start"' : '') + '>' + escapeHtml(measureLabel_(k)) + '</th>' + (measureHasOwnStatus_(k) ? '<th>Status</th>' : ''); }).join('')
    + '</tr></thead><tbody>'
    + rows.map(function(row) {
        return '<tr>'
          + '<td><strong>' + escapeHtml(row.first_name) + ' ' + escapeHtml(row.last_initial) + '.</strong></td>'
          + (r.grade ? '' : '<td>' + escapeHtml(row.grade || '—') + '</td>')
          + presentKeys.map(function(k, i) {
              var m = row.byKey[k];
              // Real find, 2026-09-29: hover shows exactly when/what grade this
              // result is from -- same reasoning as buildCompareBarChartSvg_'s
              // own comment; an inline "(Gr. X then)" note only when it
              // differs from this student's current grade, so a mismatch is
              // visible without needing to hover at all.
              var mismatch = m && m.grade_at_admin && m.grade_at_admin !== String(row.grade || '');
              var titleAttr = m ? ' title="' + escapeHtml('Tested ' + fmtDate(m.date) + (m.grade_at_admin ? ', Grade ' + m.grade_at_admin : '')) + '"' : '';
              return '<td' + (i > 0 ? ' class="skill-group-start"' : '') + titleAttr + '>' + (m ? escapeHtml(formatScoreText_(k, m.raw_score, m.max_score, m.item_detail)) : '—')
                + (mismatch ? ' <span class="muted" style="font-size:.72rem">(Gr. ' + escapeHtml(m.grade_at_admin) + ' then)</span>' : '')
                + '</td>'
                + (measureHasOwnStatus_(k) ? '<td>' + (m ? measureStatusBadge_(m) : '<span class="badge badge-neutral">Not scored</span>') + '</td>' : '');
            }).join('')
          + '</tr>';
      }).join('')
    + '</tbody></table></div>';
  return html;
}

function renderSummaryCompareResults_(r, students) {
  if (Array.isArray(r.measure)) return renderSummaryCombinedResults_(r, students);
  var rows = students.map(function(s) {
    var m = summaryComparePoint_(s.measures[0]);
    return { student_id: s.student_id, first_name: s.first_name, last_initial: s.last_initial, grade: s.grade, point: m };
  });
  var stats = compareScoreStats_(rows);

  var html = '<div class="card">'
    + '<div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-bottom:4px">'
    + '<h3 style="font-size:1.02rem;margin:0">' + escapeHtml(measureLabel_(r.measure)) + (r.grade ? ' — Grade ' + escapeHtml(r.grade) : ' — All Grades') + '</h3>'
    + '<button class="btn btn-secondary btn-small" onclick="previewSummaryReportClick_()">Print Report</button>'
    + '</div>'
    + (stats ? '<p class="muted" style="margin-bottom:12px">' + stats.count + ' student' + (stats.count === 1 ? '' : 's') + ' · Average: ' + stats.avg + ' · Range: ' + stats.min + '–' + stats.max + '</p>' : '');

  if (r.grade) {
    rows.sort(function(a, b) { return (Number(b.point.raw_score) || 0) - (Number(a.point.raw_score) || 0); });
    html += buildCompareBarChartSvg_(rows, false) + '</div>';
    return html;
  }

  var byBucket = {};
  rows.forEach(function(row) {
    var b = pointStatusBucket_(row.point);
    if (!byBucket[b]) byBucket[b] = [];
    byBucket[b].push(row);
  });

  COMPARE_BUCKET_ORDER_.forEach(function(b) {
    var group = byBucket[b];
    if (!group || !group.length) return;
    group.sort(function(a, b2) { return gradeSortCompareClient_(a.grade, b2.grade) || (Number(b2.point.raw_score) || 0) - (Number(a.point.raw_score) || 0); });
    html += '<p class="muted" style="margin:14px 0 4px;font-weight:700;font-size:.85rem">' + escapeHtml(COMPARE_BUCKET_LABELS_[b]) + ' (' + group.length + ')</p>'
      + buildCompareBarChartSvg_(group, true);
  });

  html += '</div>';
