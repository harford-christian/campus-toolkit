// Which point is currently shown in each measure's on-screen caption --
// keyed by measure id, defaults to the latest point. Tapping any marker
// (see buildGrowthChartSvg_) updates just that measure's caption in place
// (see selectGrowthChartPoint_) rather than a full page re-render, which
// would also collapse any expanded Assessment History accordions elsewhere
// on the same page (that expand/collapse state lives only in the DOM, not
// in `state`).
var GROWTH_CHART_SELECTED_ = {};

/** One measure's heading/trend line, its growth chart, and its (tap-updatable) caption. */
/**
 * `variant` ('main' or 'sub', 2026-09-23 at the school's request -- see
 * GROWTH_MAIN_MEASURES_'s own comment): 'main' gets a bordered/tinted box
 * and a bigger label -- the assessment's own headline result, meant to
 * stand out; 'sub' gets a bullet marker, a smaller label, and a shrunk
 * chart (buildGrowthChartSvg_'s `compact` flag) -- a component sub-test,
 * meant to read as supporting detail under the main score(s) rather than
 * compete with them for attention. Defaults to 'main' so every existing
 * call site (there's only ever been the one shape before today) keeps
 * looking exactly as it did.
 */
function renderGrowthChartBlock_(mid, series, spansMultiple, variant) {
  var isSub = variant === 'sub';
  var hasBenchmark = series.points.some(function(p) { return p.benchmark_reference !== null && p.benchmark_reference !== undefined; });
  var selectedIdx = GROWTH_CHART_SELECTED_[mid] !== undefined ? GROWTH_CHART_SELECTED_[mid] : series.points.length - 1;

  var label = '<strong style="font-size:' + (isSub ? '.8rem' : '.95rem') + '">' + (isSub ? '&bull; ' : '') + escapeHtml(measureLabel_(mid)) + '</strong> '
    + '<span class="muted" style="font-size:' + (isSub ? '.76rem' : '.85rem') + '">(' + series.trend + (series.points.length < 3 ? ' — ' + series.points.length + ' data point' + (series.points.length === 1 ? '' : 's') : '') + ')</span>'
    + (spansMultiple ? ' <span class="muted" style="font-style:italic;font-size:.76rem">· combines more than one assessment</span>' : '');

  var body = label
    // 2026-10-05, at the school's request ("teachers feel its confusing
    // having it below"): date range, selected value + tier/status, goal,
    // and the overall min-max spread now reads BEFORE the chart instead of
    // after it, so it's the first thing seen rather than something found
    // only after scrolling past the graph. On-screen (not just the hover
    // tooltip, which doesn't fire on touch) -- tapping a non-latest marker
    // still swaps this in place via its id, same as before.
    + '<div class="sparkline-caption" id="gchart-caption-' + escapeHtml(mid) + '" style="font-size:' + (isSub ? '.74rem' : '.8rem') + '">' + growthChartCaptionHtml_(mid, series, selectedIdx) + '</div>'
    + buildGrowthChartSvg_(series.points, hasBenchmark, mid, isSub);

  if (isSub) return '<div style="margin-bottom:10px;padding-left:14px">' + body + '</div>';
  return '<div style="margin-bottom:16px;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--navy-tint)">' + body + '</div>';
}

/** Renders the caption line for one selected point in a measure's series (idx defaults to latest if out of range). */
function growthChartCaptionHtml_(mid, series, idx) {
  var points = series.points;
  var i = (idx >= 0 && idx < points.length) ? idx : points.length - 1;
  var p = points[i];
  var isLatest = i === points.length - 1;
  var scores = points.map(function(pt) { return Number(pt.raw_score) || 0; });
  var min = Math.min.apply(null, scores);
  var max = Math.max.apply(null, scores.concat([1]));

  return escapeHtml(fmtDate(points[0].date)) + ' → ' + escapeHtml(fmtDate(points[points.length - 1].date))
    + ' · ' + (isLatest ? 'Latest' : 'Selected') + ': ' + escapeHtml(String(p.raw_score)) + ' (' + pointStatusText_(p) + ')'
    + (p.benchmark_reference !== null && p.benchmark_reference !== undefined ? ' · Goal: ' + escapeHtml(String(p.benchmark_reference)) : '')
    + (points.length > 1 ? ' · Range: ' + escapeHtml(String(min)) + '–' + escapeHtml(String(max)) : '')
    + (!isLatest ? ' · <span class="muted" style="text-decoration:underline;cursor:pointer" onclick="selectGrowthChartPoint_(\''
        + escapeHtml(mid) + '\', ' + (points.length - 1) + ')">back to latest</span>' : '');
}

/**
 * Tap handler for a growth-chart marker (see buildGrowthChartSvg_'s onclick).
 * Patches just that measure's caption in place via its id -- see
 * GROWTH_CHART_SELECTED_'s comment for why this deliberately isn't a full
 * page re-render.
 */
function selectGrowthChartPoint_(mid, idx) {
  GROWTH_CHART_SELECTED_[mid] = idx;
  var series = state.currentHistory && state.currentHistory.measureSeries && state.currentHistory.measureSeries[mid];
  if (!series) return;
  var caption = document.getElementById('gchart-caption-' + mid);
  if (caption) caption.innerHTML = growthChartCaptionHtml_(mid, series, idx);
}

var GROWTH_CHART_SEQ_ = 0;

/**
 * A small line/area chart for one measure's points -- an emphasized,
 * tier-colored endpoint, a faint grid, and (when a real benchmark exists)
 * a shaded "at/above goal" band instead of just a dashed reference line, so
 * the shape of a student's progress reads at a glance instead of as a row
 * of same-height bars. Self-contained inline SVG (no charting library) so
 * it keeps working with no external dependency in the Apps Script sandbox.
 */
function buildGrowthChartSvg_(points, hasBenchmark, mid, compact) {
  // `compact` (2026-09-23, at the school's request): a sub-measure's chart
  // renders genuinely smaller, not just narrower -- half the height, tighter
  // markers -- so it reads as supporting detail under a main score's
  // full-size chart, not an equally-weighted peer. Marker/gridline geometry
  // below is already all relative to H, so shrinking it is the one change
  // needed.
  var W = 320, H = compact ? 56 : 100, padX = 14, topY = 8, bottomY = H - (compact ? 8 : 14);
  var drawH = bottomY - topY, innerW = W - padX * 2;
  var n = points.length;
  var scores = points.map(function(p) { return Number(p.raw_score) || 0; });
  var min = Math.min.apply(null, scores);
  var max = Math.max.apply(null, scores.concat([1]));
  var goalY = topY + drawH * 0.4;

  function xFor(i) { return n <= 1 ? W / 2 : padX + (i / (n - 1)) * innerW; }
  function yFor(p) {
    if (hasBenchmark) {
      if (p.benchmark_reference !== null && p.benchmark_reference !== undefined) {
        var ratio = (Number(p.raw_score) || 0) / p.benchmark_reference;
        return Math.max(topY, Math.min(bottomY, goalY - (ratio - 1) * (drawH * 0.5)));
      }
      return topY + drawH * 0.5; // no reference for this point -- neutral middle, doesn't mix scales
    }
    var range = (max - min) || 1;
    return bottomY - ((Number(p.raw_score) || 0) - min) / range * drawH;
  }

  var coords = points.map(function(p, i) { return { x: xFor(i), y: yFor(p) }; });
  var linePath = coords.map(function(c, i) { return (i === 0 ? 'M' : 'L') + c.x.toFixed(1) + ',' + c.y.toFixed(1); }).join(' ');
  var areaPath = n > 1 ? linePath + ' L' + coords[n - 1].x.toFixed(1) + ',' + bottomY + ' L' + coords[0].x.toFixed(1) + ',' + bottomY + ' Z' : '';

  GROWTH_CHART_SEQ_++;
  var gradId = 'gchart-grad-' + GROWTH_CHART_SEQ_;

  var svg = '<svg viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none" style="width:100%;height:' + H + 'px;display:block;margin-top:6px">'
    + '<defs><linearGradient id="' + gradId + '" x1="0" y1="0" x2="0" y2="1">'
    + '<stop offset="0%" stop-color="var(--navy-deep)" stop-opacity=".2"/><stop offset="100%" stop-color="var(--navy-deep)" stop-opacity="0"/>'
    + '</linearGradient></defs>';

  [0.25, 0.5, 0.75].forEach(function(f) {
    var y = (topY + drawH * f).toFixed(1);
    svg += '<line x1="' + padX + '" y1="' + y + '" x2="' + (W - padX) + '" y2="' + y + '" stroke="var(--line)" stroke-width="1"/>';
  });

  if (hasBenchmark) {
    // Phase 32: was the old --leaf green (now retired as a decorative brand
    // color); this shading specifically means "meets the goal," the same
    // concept as the on_track risk bucket, so it keeps that established
    // green (DASHBOARD_BUCKET_COLORS.on_track) rather than switching to navy.
    svg += '<rect x="' + padX + '" y="' + topY.toFixed(1) + '" width="' + innerW + '" height="' + (goalY - topY).toFixed(1) + '" fill="#22c55e" fill-opacity=".1"/>'
      + '<line x1="' + padX + '" y1="' + goalY.toFixed(1) + '" x2="' + (W - padX) + '" y2="' + goalY.toFixed(1) + '" stroke="#22c55e" stroke-width="1.5" stroke-dasharray="4,3"/>';
  }

  if (n > 1) {
    svg += '<path d="' + areaPath + '" fill="url(#' + gradId + ')"/>'
      + '<path d="' + linePath + '" fill="none" stroke="var(--ink-soft)" stroke-width="2"/>';
  }

  coords.forEach(function(c, i) {
    var isLast = i === coords.length - 1;
    var p = points[i];
    var titleText = fmtDate(p.date) + ': ' + formatScoreText_(mid, p.raw_score, p.max_score, p.item_detail) + (p.benchmark_tier ? ' (' + p.benchmark_tier + ')' : '') + (p.benchmark_reference !== null && p.benchmark_reference !== undefined ? ' · goal ' + p.benchmark_reference : '');
    var onclickAttr = mid ? ' onclick="selectGrowthChartPoint_(\'' + escapeHtml(mid) + '\', ' + i + ')" style="cursor:pointer"' : '';
    svg += '<g>' + pointMarkerSvg_(c.x, c.y, isLast ? 6 : 4, pointColor_(p), pointStatusBucket_(p), isLast, onclickAttr)
      + '<title>' + escapeHtml(titleText) + '</title></g>';
  });

  return svg + '</svg>';
}

// Top-to-bottom row order for buildRiskLevelTrajectoryChartSvg_ below --
// deliberately NOT a "worse at the bottom" scale: not_assessed isn't worse
// than at_risk, it's "unknown," so it gets its own clearly-separate,
// distinctly-colored (gray, not red) row at the bottom rather than
// implying a false ordering.
var PROFILE_RISK_TRAJECTORY_ROWS_ = ['on_track', 'some_risk', 'at_risk', 'not_assessed'];

/**
 * "Overall Risk Level" view for the Progress Over Time selector (2026-09-26,
 * at the administrator's explicit request -- "no real way of looking at a
 * student over time and are they trending up or worse," and "I want what's
 * best not easiest," so this is its own real categorical chart, not a
 * number squeezed into the raw-score chart type buildGrowthChartSvg_ above
 * already handles). Plots h.riskTrajectory (Growth.gs's
 * computeStudentRiskTrajectory_) -- one point per period this student has
 * ANY tiered result, positioned by which of the 4 ROWS its bucket is (not a
 * continuous y-axis, since risk bucket is categorical) and colored with the
 * exact same DASHBOARD_BUCKET_COLORS/LABELS the schoolwide Dashboard already
 * uses for this identical bucket concept -- one consistent meaning for
 * these colors everywhere in the app, not a new ad hoc scale.
 */
function buildRiskLevelTrajectoryChartSvg_(trajectory) {
  var W = 640, H = 170, padX = 60, padTop = 16, padBottom = 26;
  var innerW = W - padX - 20, drawH = H - padTop - padBottom;
  var rowCount = PROFILE_RISK_TRAJECTORY_ROWS_.length;

  function yForBucket(b) {
    var idx = PROFILE_RISK_TRAJECTORY_ROWS_.indexOf(b);
    if (idx === -1) idx = rowCount - 1;
    return padTop + (idx / (rowCount - 1)) * drawH;
  }
  function xFor(i) { return trajectory.length <= 1 ? W / 2 : padX + (i / (trajectory.length - 1)) * innerW; }

  var svg = '<svg viewBox="0 0 ' + W + ' ' + H + '" style="width:100%;height:auto;display:block">';

  PROFILE_RISK_TRAJECTORY_ROWS_.forEach(function(b) {
    var y = yForBucket(b);
    svg += '<line x1="' + padX + '" y1="' + y.toFixed(1) + '" x2="' + (W - 20) + '" y2="' + y.toFixed(1) + '" stroke="var(--line)" stroke-width="1"/>'
      + '<text x="0" y="' + (y + 3).toFixed(1) + '" font-size="9.5" fill="var(--ink-soft)">' + escapeXmlText_(DASHBOARD_BUCKET_LABELS[b]) + '</text>';
  });

  var coords = trajectory.map(function(p, i) { return { x: xFor(i), y: yForBucket(p.bucket), p: p }; });
  if (coords.length > 1) {
    var path = coords.map(function(c, i) { return (i === 0 ? 'M' : 'L') + c.x.toFixed(1) + ',' + c.y.toFixed(1); }).join(' ');
    svg += '<path d="' + path + '" fill="none" stroke="var(--ink-soft)" stroke-width="1.5" stroke-dasharray="3,2"/>';
  }
  coords.forEach(function(c, i) {
    var isLast = i === coords.length - 1;
    var color = DASHBOARD_BUCKET_COLORS[c.p.bucket] || '#888';
    var titleText = friendlyPeriodLabel_(c.p.period) + ' (Grade ' + (c.p.grade || '—') + '): ' + DASHBOARD_BUCKET_LABELS[c.p.bucket];
    svg += '<g><circle cx="' + c.x.toFixed(1) + '" cy="' + c.y.toFixed(1) + '" r="' + (isLast ? 6 : 4) + '" fill="' + color + '"/>'
      + '<title>' + escapeXmlAttr_(titleText) + '</title></g>'
      + '<text x="' + c.x.toFixed(1) + '" y="' + (H - 6) + '" font-size="9.5" fill="var(--ink-soft)" text-anchor="middle">' + escapeXmlText_(c.p.grade || '') + '</text>';
  });

  svg += '</svg>';
  return svg;
}

/**
 * "Reading Grade Level" view (2026-09-26, at the administrator's explicit
 * request -- "once we have more fluency scores that give a reading grade
 * level, could we track how they're improving there"; then, real find from
 * a screenshot: "it's not clear what his reading level is" -- a lone
 * boundary GRIDLINE far below a point told you nothing about which band
 * that point was actually in, since the whole point of a wide band like
 * "1st Grade" (DRA 4-16) is that a point can sit far from its own
 * boundary line and still be squarely inside it): plots the DRA measure's
 * raw score (the underlying DRA number -- continuous and comparable across
 * grades, see Dra.gs's own header comment) over time. Each grade band is
 * now a shaded REGION (alternating tint) spanning its own full range, not
 * just a boundary line, and every point gets its grade-equivalent text
 * written directly next to it (via draGradeContextForLevel_, the same
 * lookup formatScoreText_ already uses) -- never relying on hover-only
 * disclosure or on-band-boundary-proximity to answer "what grade level is
 * this," the two things that made it unclear.
 */
function buildReadingLevelTrajectoryChartSvg_(points) {
  var W = 640, H = 230, padX = 78, padTop = 14, padBottom = 30, rightLabelPad = 130;
  var innerW = W - padX - rightLabelPad, drawH = H - padTop - padBottom;
  var scores = points.map(function(p) { return Number(p.raw_score) || 0; });
  var min = Math.min.apply(null, scores.concat([1]));
  var max = Math.max.apply(null, scores.concat([min + 1]));
  var pad = (max - min) * 0.25 || 5;
  min = Math.max(1, min - pad);
  max = max + pad;
  var range = (max - min) || 1;

  function xFor(i) { return points.length <= 1 ? W / 2 : padX + (i / (points.length - 1)) * innerW; }
  function yFor(score) { return padTop + drawH - ((score - min) / range) * drawH; }

  // Deduped grade-band boundaries within [min, max] (the source table has
  // ~20 rows, many sharing the same grade text -- only real band
  // TRANSITIONS matter here). Each boundary's band runs from its own dra
  // threshold up to the NEXT boundary's threshold (or to `max` for the
  // last one), so the shaded region -- and its label -- covers the band's
  // FULL span, not just its starting line.
  var boundaries = [];
  var lastLabel = null;
  DRA_GRADE_CONTEXT_TABLE_.forEach(function(row) {
    if (row.dra > max || row.grade === lastLabel) return;
    lastLabel = row.grade;
    boundaries.push(row);
  });

  var svg = '<svg viewBox="0 0 ' + W + ' ' + H + '" style="width:100%;height:auto;display:block">';

  boundaries.forEach(function(b, i) {
    var bandTopDra = boundaries[i + 1] ? boundaries[i + 1].dra : max;
    var yBottom = yFor(Math.max(b.dra, min));
    var yTop = yFor(bandTopDra);
    if (yBottom <= yTop) return; // band entirely outside the visible [min,max] window
    svg += '<rect x="' + padX + '" y="' + yTop.toFixed(1) + '" width="' + innerW.toFixed(1) + '" height="' + (yBottom - yTop).toFixed(1) + '" fill="' + (i % 2 ? 'var(--panel-alt, #f4f4f4)' : 'transparent') + '"/>'
      + '<line x1="' + padX + '" y1="' + yBottom.toFixed(1) + '" x2="' + (padX + innerW).toFixed(1) + '" y2="' + yBottom.toFixed(1) + '" stroke="var(--line)" stroke-width="1"/>'
      + '<text x="4" y="' + ((yTop + yBottom) / 2 + 3).toFixed(1) + '" font-size="9.5" fill="var(--ink-soft)">' + escapeXmlText_(b.grade) + '</text>';
  });

  var coords = points.map(function(p, i) { return { x: xFor(i), y: yFor(Number(p.raw_score) || 0), p: p }; });
  if (coords.length > 1) {
    var path = coords.map(function(c, i) { return (i === 0 ? 'M' : 'L') + c.x.toFixed(1) + ',' + c.y.toFixed(1); }).join(' ');
    svg += '<path d="' + path + '" fill="none" stroke="var(--navy-deep)" stroke-width="2"/>';
  }
  coords.forEach(function(c, i) {
    var isLast = i === coords.length - 1;
    var gradeText = draGradeContextForLevel_(c.p.raw_score);
    var directLabel = 'DRA ' + c.p.raw_score + (gradeText ? ' — ' + gradeText : '');
    var dateLabel = c.p.date ? fmtDate(c.p.date) : '';
    var titleText = dateLabel + ': ' + formatScoreText_('dra_level', c.p.raw_score, c.p.max_score, c.p.item_detail);
    svg += '<circle cx="' + c.x.toFixed(1) + '" cy="' + c.y.toFixed(1) + '" r="' + (isLast ? 5.5 : 4) + '" fill="var(--navy-deep)"><title>' + escapeXmlAttr_(titleText) + '</title></circle>'
      + '<text x="' + (c.x + 8).toFixed(1) + '" y="' + (c.y - 6).toFixed(1) + '" font-size="10" font-weight="700" fill="var(--ink)">' + escapeXmlText_(directLabel) + '</text>'
      + (dateLabel ? '<text x="' + (c.x + 8).toFixed(1) + '" y="' + (c.y + 8).toFixed(1) + '" font-size="9" fill="var(--ink-soft)">' + escapeXmlText_(dateLabel) + '</text>' : '');
  });

  svg += '</svg>';
  return svg;
}

/**
 * "Progress Over Time" section (2026-09-26, at the administrator's explicit
 * request for "a few ways of looking at it" covering overall risk level,
 * reading grade level once there's enough DRA history, and composite/key
 * scores on other tests): one selector, switching between the Overall Risk
 * Level chart, the Reading Grade Level chart (only offered once the student
 * has at least one DRA result), and every other measure this student has
 * data for (headline/composite-style measures from GROWTH_MAIN_MEASURES_
 * listed first, reusing buildGrowthChartSvg_ at full size -- the exact same
 * chart Growth Over Time already builds for that measure, just given a
 * single featured spot instead of competing in that long per-measure list).
 * Placed as its own card ABOVE Growth Over Time, which remains the
 * exhaustive per-measure reference for anyone who wants to see literally
 * every sub-skill at once.
 */
function renderProgressOverTimeSection_(h) {
  var options = [];
  if (h.riskTrajectory && h.riskTrajectory.length > 0) options.push({ key: 'risk', label: 'Overall Risk Level' });
  if (h.measureSeries.dra_level && h.measureSeries.dra_level.points.length > 0) options.push({ key: 'dra_level', label: 'Reading Grade Level (Guided Reading / DRA)' });

  var seen = { risk: true, dra_level: true };
  Object.keys(GROWTH_MAIN_MEASURES_).forEach(function(type) {
    (GROWTH_MAIN_MEASURES_[type] || []).forEach(function(k) {
      if (h.measureSeries[k] && !seen[k]) { seen[k] = true; options.push({ key: k, label: measureLabel_(k) }); }
    });
  });
  Object.keys(h.measureSeries).forEach(function(k) {
    if (!seen[k]) { seen[k] = true; options.push({ key: k, label: measureLabel_(k) }); }
  });

  if (options.length === 0) return '';
  if (!state.profileProgressView || !options.some(function(o) { return o.key === state.profileProgressView; })) {
    state.profileProgressView = options[0].key;
  }

  var chart, note;
  if (state.profileProgressView === 'risk') {
    chart = buildRiskLevelTrajectoryChartSvg_(h.riskTrajectory);
    note = 'One combined risk level per period (the same "worst tier across whatever was given" logic the Dashboard uses), so this reads straight across a change in WHICH test produced it -- e.g. DIBELS through Grade 3, easyCBM from Grade 4 on.';
  } else if (state.profileProgressView === 'dra_level') {
    chart = buildReadingLevelTrajectoryChartSvg_(h.measureSeries.dra_level.points);
    note = 'Y-axis is labeled in grade-level terms (via the Guided Reading Level / DRA correlation chart), not a raw DRA number.';
  } else {
    var series = h.measureSeries[state.profileProgressView];
    chart = series ? buildGrowthChartSvg_(series.points, true, state.profileProgressView, false) : '<p class="muted">No data.</p>';
    note = '';
  }

  return '<div class="field" style="max-width:320px;margin-bottom:10px"><label>View</label><select id="profile-progress-view" onchange="onProfileProgressViewChange_()">'
    + options.map(function(o) { return '<option value="' + o.key + '"' + (state.profileProgressView === o.key ? ' selected' : '') + '>' + escapeHtml(o.label) + '</option>'; }).join('')
    + '</select></div>'
    + (note ? '<p class="muted" style="font-size:.78rem;margin-bottom:8px">' + escapeHtml(note) + '</p>' : '')
    + '<div>' + chart + '</div>';
}

/** Re-renders the profile with a newly-picked Progress Over Time view -- no new server call, everything it needs is already in state.currentHistory. */
function onProfileProgressViewChange_() {
  var el = document.getElementById('profile-progress-view');
  state.profileProgressView = el ? el.value : null;
  renderProfile();
}

/** Builds the per-measure breakdown table for one session, pulled from state.currentHistory.measureSeries (already loaded, no extra server call needed). */
function renderSessionMeasureDetail_(sessionId) {
  var rows = [];
  var series = state.currentHistory.measureSeries;
  Object.keys(series).forEach(function(seriesKey) {
    series[seriesKey].points.forEach(function(p) {
      // Use the point's OWN measure_id for the row label, not the (possibly
      // merged, e.g. "oral_reading_fluency") series key -- session-level
      // detail should show precisely which measure was administered that day.
      if (p.session_id === sessionId) rows.push({ measure: p.measure_id || seriesKey, point: p });
    });
  });
  if (rows.length === 0) return '<p class="muted">No measure detail recorded for this session.</p>';

  // 2026-09-26, at the administrator's explicit request: Hasbrouck & Tindal
  // publishes no Kindergarten (or Beginning-1st-Grade, which is also
  // unpublished -- see ORF_NORMS['1'].fall, Assessments/Orf.gs) ORF WCPM
  // norms at all, so a Kindergarten reading-fluency score has nothing real
  // to compare against. Rather than a bare, unexplained "not benchmarked,"
  // this shows a clearly-labeled rough placeholder ("~0-10 wcpm, no
  // published norm") -- but ONLY here, when looking up this ONE session's
  // detail, per the administrator's explicit instruction to "leave any
  // results not actually captured by true data off our reporting -- just
  // can be looked up in assessments for informational purposes." Computed
  // client-side, deliberately NOT threaded into benchmark_reference itself
  // (Registry.gs's getBenchmarkReference_), so it never leaks into
  // growth-chart goal lines, Summary/Compare reports, or any other
  // aggregate/trend reporting.
  // 2026-09-26 follow-up ("can we put the same rule in place for beg of
  // 1st"): Grade 1 Fall has the identical gap (ORF_NORMS['1'].fall is null
  // for every percentile, Assessments/Orf.gs) -- same placeholder, same
  // informational-only scope.
  var sessionInfo = (state.currentHistory.sessions || []).filter(function(s) { return s.session_id === sessionId; })[0];
  var sessionGradeKey = sessionInfo && normalizeGradeKey_(sessionInfo.grade_at_admin);
  // Real find, 2026-09-26 (independent code review, at the administrator's
  // direction): Grade-1-Fall now borrows DIBELS's real published benchmark
  // (see buildOrfMeasure_, Orf.gs) instead of this rough placeholder, so
  // it's no longer "no norms." Kindergarten still has no real published
  // number from either study, so it keeps the placeholder.
  var hasNoOrfNorms = !!(sessionInfo && sessionGradeKey === 'K');

  return '<table class="trend-table"><thead><tr><th>Measure</th><th>Score</th><th>Goal</th><th>Status</th></tr></thead><tbody>' + rows.map(function(r) {
    var goalCell = (r.point.benchmark_reference !== null && r.point.benchmark_reference !== undefined) ? escapeHtml(String(r.point.benchmark_reference)) : '—';
    if (r.measure === 'orf_wcpm' && hasNoOrfNorms) {
      goalCell = '<span class="muted" title="Hasbrouck &amp; Tindal publishes no Kindergarten norms -- this is a rough placeholder for reference only, not a real benchmark.">~0–10 (est., no published norm)</span>';
    }
    return '<tr><td>' + escapeHtml(measureLabel_(r.measure)) + '</td>'
      + '<td>' + escapeHtml(formatScoreText_(r.measure, r.point.raw_score, r.point.max_score, r.point.item_detail)) + '</td>'
      + '<td>' + goalCell + '</td>'
      + '<td>' + measureStatusBadge_(r.point) + '</td></tr>';
  }).join('') + '</tbody></table>';
}

function toggleSessionDetail_(sessionId) {
  var detail = document.getElementById('session-detail-' + sessionId);
  var chevron = document.getElementById('chevron-' + sessionId);
  if (!detail) return;
  var nowVisible = detail.classList.toggle('visible');
  if (chevron) {
    // Toggling a class (rather than replacing the icon) keeps the same SVG
    // element in place so its CSS rotate transition (.expand-chevron.rotated
    // svg, Phase 19) actually animates instead of snapping.
    chevron.classList.toggle('rotated', nowVisible);
    var label = chevron.querySelector('.chevron-label');
    if (label) label.textContent = nowVisible ? 'hide' : 'details';
  }
}

// ── Styled confirmation modal (replaces window.confirm, which reads as a
// browser-chrome popup rather than part of the app on a shared classroom PC) ──
function showConfirm_(title, message, confirmLabel, onConfirm) {
  var overlay = document.getElementById('modal-overlay');
  overlay.innerHTML = '<div class="card modal-card">'
    + '<h3>' + escapeHtml(title) + '</h3>'
    + '<p>' + escapeHtml(message).replace(/\n/g, '<br>') + '</p>'
    + '<div class="modal-actions">'
    + '<button class="btn btn-secondary btn-small" onclick="hideConfirm_()">Cancel</button>'
    + '<button class="btn btn-primary btn-small btn-danger" id="modal-confirm-btn">' + escapeHtml(confirmLabel) + '</button>'
    + '</div></div>';
  overlay.classList.add('visible');
  document.getElementById('modal-confirm-btn').onclick = function() { hideConfirm_(); onConfirm(); };
  // Clicking the backdrop itself (not the card) dismisses, same as pressing
  // Escape (see the document-level keydown listener below) -- previously the
  // only way out was the explicit Cancel button.
  overlay.onclick = function(e) { if (e.target === overlay) hideConfirm_(); };
}

function hideConfirm_() {
  var overlay = document.getElementById('modal-overlay');
  overlay.classList.remove('visible');
  // Wait for the fade-out (see #modal-overlay's CSS transition, Phase 19)
  // to finish before clearing the content -- otherwise the modal card would
  // visibly vanish out from under the still-fading overlay instead of
  // fading away together.
  setTimeout(function() { overlay.innerHTML = ''; }, 200);
}

// Escape dismisses whichever confirm modal is currently open, same as
// clicking the backdrop or the explicit Cancel button (Phase 18). Guarded --
// this runs at script load time, and the various test harnesses' minimal
// `document` mocks don't all implement addEventListener.
if (typeof document.addEventListener === 'function') {
  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape' && document.getElementById('modal-overlay').classList.contains('visible')) {
      hideConfirm_();
    }
  });
}

function deleteSessionClick_(sessionId) {
  showConfirm_(
    'Delete this session?',
    'This permanently removes the session and its scored results -- unlike removing a student, this cannot be undone from within the app. ' +
    'Use this to correct a mis-entered assessment, then re-administer it via "Score Assessment" if it still needs to be given.',
    'Delete Session',
    function() {
      call('deleteSession', sessionId).then(function() {
        toast('Session deleted.');
        openStudent(state.currentStudent.student_id);
      }).catch(function(err) { toast('Error: ' + err.message); });
    }
  );
}

/**
 * Corrects a session's metadata (date/year/season/grade/administrator
 * role/notes) AND, for the supported assessment types (2026-09-17, at the
 * school's request -- see updateSessionFields, Code.gs), its actual
 * SCORES in place. Available to any staff member, same requireStaff_ gate
 * deleteSession already has. Lazy-fetches administratorRoles/
 * availableSchoolYears (always needed) plus whatever this specific
 * assessment type's score-editing fields need (ensureTypeDataLoaded_,
 * same lazy-load already used by the New Assessment form).
 */
function editSessionClick_(sessionId) {
  var sess = ((state.currentHistory || {}).sessions || []).filter(function(s) { return s.session_id === sessionId; })[0];
  if (!sess) return;

  var chain = Promise.resolve();
  if (!state.administratorRoles) chain = chain.then(function() { return call('getAdministratorRoles'); }).then(function(roles) { state.administratorRoles = roles || []; });
  if (!state.availableSchoolYears) chain = chain.then(function() { return call('getAvailableSchoolYears'); }).then(function(years) { state.availableSchoolYears = years || []; });
  chain = chain.then(function() { return ensureTypeDataLoaded_(sess.assessment_type); });
  // CORE Phonics' per-item marks, DRA's original Guided Reading Level
  // letter, and (2026-09-22) DIBELS' original ORF Errors/Maze Correct-
  // Incorrect counts aren't in state.currentHistory at all (see
  // getSessionItemDetail, Code.gs, for why) -- fetch on demand only for
  // the types that actually need it.
  if (sess.assessment_type === 'core_phonics' || sess.assessment_type === 'dra' || sess.assessment_type === 'dibels') {
    chain = chain.then(function() { return call('getSessionItemDetail', sessionId); }).then(function(detail) {
      state.sessionItemDetailCache = state.sessionItemDetailCache || {};
      state.sessionItemDetailCache[sessionId] = detail || {};
    });
  }

  chain.then(function() {
    var slot = document.getElementById('session-edit-' + sessionId);
    if (slot) slot.innerHTML = renderSessionEditForm_(sess);
    // Shows the current Composite status immediately (e.g. "already
    // complete, will save as 354 — Green") rather than only after the
    // teacher edits a field -- the values are already pre-filled, so
    // there's real information to show right away.
    if (sess.assessment_type === 'dibels') updateDibelsCompositePreviewEdit_(sessionId);
    // Word-grid click handlers (attachCorePhonicsHandlersForPart_) only
    // attach to whatever part-content-<id> containers actually exist in
    // the DOM right now -- safe to call unconditionally here the same way
    // the New Assessment form already does.
    if (sess.assessment_type === 'core_phonics') attachCorePhonicsHandlers_();
  }).catch(function(err) { toast('Error: ' + err.message); });
}

/**
 * Every raw_score already on file for one session, keyed by the STORED
 * measure_id (lowercase, e.g. 'lnf', 'lexile_score') -- pulled straight
 * from state.currentHistory.measureSeries (already loaded for the
 * profile's Growth Over Time section, no extra server call needed) rather
 * than a fresh fetch. Used to pre-fill the score-editing fields below.
 */
function sessionMeasureRawScores_(sessionId) {
  var out = {};
  var series = (state.currentHistory && state.currentHistory.measureSeries) || {};
  Object.keys(series).forEach(function(seriesKey) {
    series[seriesKey].points.forEach(function(p) {
      if (p.session_id === sessionId) out[String(p.measure_id || seriesKey).toLowerCase()] = p.raw_score;
    });
  });
  return out;
}

/** One numeric-per-measure input row, pre-filled with whatever's already on file for this session (blank if that measure was never recorded). `onInputAttr` (optional) wires a live preview, e.g. the DIBELS Composite preview -- see scoreEditMeasureRow_'s DIBELS caller. */
function scoreEditMeasureRow_(idPrefix, sess, m, existing, onInputAttr) {
  var val = existing[String(m.id).toLowerCase()];
  return '<div class="measure-row">'
    + '<label class="check-label">' + escapeHtml(m.label) + '</label>'
    + '<input type="number" step="0.5" id="' + idPrefix + sess.session_id + '-' + m.id + '" value="' + (val !== undefined && val !== null ? escapeHtml(String(val)) : '') + '" placeholder="' + escapeHtml(m.unit) + '"' + (onInputAttr || '') + ' />'
    + '</div>';
}

/**
 * DIBELS score editing. ORF Accuracy and Maze are special-cased the same
 * way renderDibelsInput_ (New Assessment) now is (2026-09-22, at the
 * school's request -- both are DERIVED scores, see
 * ASSESSMENT_REGISTRY.dibels.score, Registry.gs, for the formulas and
 * why): raw-count fields instead of one "type the final number" row. A
 * session saved AFTER that fix has item_detail (the original raw counts)
 * to pre-fill exactly; an older session only has the already-computed
 * value on file, no raw counts -- shown as a note, with the raw fields
 * left blank rather than guessed. Leaving them blank on save doesn't lose
 * that older value either way: updateSessionFields (Code.gs) falls back
 * to preserving the existing computed value verbatim when no new raw
 * counts are entered (see its existingOrfAccuracy/existingMaze handling),
 * so editing a DIBELS session to fix an unrelated field (like its date)
 * can never silently wipe out an Accuracy/Maze score nobody touched.
 */
function renderDibelsScoreEditFields_(sess, existing, applicableMeasures) {
  var detail = (state.sessionItemDetailCache && state.sessionItemDetailCache[sess.session_id]) || {};
  var onInput = ' oninput="scheduleDibelsCompositePreviewEdit_(\'' + sess.session_id + '\')"';
  var html = '';

  applicableMeasures.forEach(function(m) {
    if (m.id === 'ORF_ACCURACY') {
      var orfDetail = detail.orf_accuracy;
      if (!orfDetail && existing.orf_accuracy !== undefined) {
        html += '<p class="muted" style="font-size:.78rem;margin-bottom:4px">This session was saved before raw ORF Errors were tracked (only the calculated Accuracy % was, currently ' + escapeHtml(String(existing.orf_accuracy)) + '). Enter the errors below to recalculate it, or leave blank to keep that value as-is.</p>';
      }
      html += '<div class="measure-row">'
        + '<label class="check-label">Oral Reading Fluency — Errors</label>'
        + '<input type="number" step="1" min="0" id="se-dval-orf-errors-' + sess.session_id + '" value="' + (orfDetail ? escapeHtml(String(orfDetail.errors)) : '') + '" placeholder="errors"' + onInput + ' />'
        + '</div>';
      return;
    }
    if (m.id === 'MAZE') {
      var mazeDetail = detail.maze;
      if (!mazeDetail && existing.maze !== undefined) {
        html += '<p class="muted" style="font-size:.78rem;margin-bottom:4px">This session was saved before raw Maze Correct/Incorrect counts were tracked (only the calculated Adjusted score was, currently ' + escapeHtml(String(existing.maze)) + '). Enter both below to recalculate it, or leave blank to keep that value as-is.</p>';
      }
      html += '<div class="measure-row">'
        + '<label class="check-label">Maze — Correct</label>'
        + '<input type="number" step="1" min="0" id="se-dval-maze-correct-' + sess.session_id + '" value="' + (mazeDetail ? escapeHtml(String(mazeDetail.correct)) : '') + '" placeholder="correct replacements"' + onInput + ' />'
        + '</div>'
        + '<div class="measure-row">'
        + '<label class="check-label">Maze — Incorrect</label>'
        + '<input type="number" step="1" min="0" id="se-dval-maze-incorrect-' + sess.session_id + '" value="' + (mazeDetail ? escapeHtml(String(mazeDetail.incorrect)) : '') + '" placeholder="incorrect replacements"' + onInput + ' />'
        + '</div>';
      return;
    }
    // Composite is never a manual entry, same as the New Assessment form --
    // see renderDibelsInput_'s 2026-09-22 comment.
    if (m.id === 'COMPOSITE') return;
    html += scoreEditMeasureRow_('se-dval-', sess, m, existing, onInput);
  });

  // Live "will save as" preview (2026-09-17, at the school's request) --
  // see updateDibelsCompositePreviewEdit_/previewDibelsComposite (Code.gs).
  html += '<div id="dibels-composite-preview-' + sess.session_id + '" class="muted" style="font-size:.82rem;margin-top:4px"></div>';
  return html;
}

/**
 * Dispatches to the right score-editing fields for this session's
 * assessment_type, pre-filled with whatever's already recorded.
 * Supported: DIBELS (2026-09-22 -- see renderDibelsScoreEditFields_),
 * easyCBM, easyCBM Math (numeric-per-measure), Lexile (raw_score IS the
 * literal typed string/number, safe to round-trip exactly), CORE Phonics
 * (2026-09-18 -- see renderCorePhonicsEditFields_, which pre-fills the
 * same word-grid UI the New Assessment form uses from
 * getSessionItemDetail's per-part marks), and DRA (2026-09-18 -- see
 * renderDraScoreEditFields_; only sessions saved AFTER the 2026-09-18 fix
 * that started persisting the original Guided Reading Level letter, not
 * just the derived DRA number, can be pre-filled exactly -- an older
 * session honestly asks for a re-selection rather than guessing one).
 * Anything else falls back to metadata-only editing with an explanation,
 * same as every type did before this change.
 */
function renderSessionScoreEditFields_(sess) {
  var existing = sessionMeasureRawScores_(sess.session_id);
  var gradeKey = normalizeGradeKey_(sess.grade_at_admin);
  function applicable(list) { return (list || []).filter(function(m) { return !gradeKey || m.grades.indexOf(gradeKey) !== -1; }); }

  if (sess.assessment_type === 'dibels') {
    return renderDibelsScoreEditFields_(sess, existing, applicable(state.dibelsMeasures));
  }
  if (sess.assessment_type === 'easycbm') {
    return applicable(state.easyCbmMeasures).map(function(m) { return scoreEditMeasureRow_('se-eval-', sess, m, existing); }).join('');
  }
  if (sess.assessment_type === 'easycbm_math') {
    return applicable(state.easyCbmMathMeasures).map(function(m) { return scoreEditMeasureRow_('se-ecmval-', sess, m, existing); }).join('');
  }
  if (sess.assessment_type === 'lexile') {
    var lexScore = existing.lexile_score;
    var wcpm = existing.orf_wcpm;
    return '<div class="field"><label>Lexile Score (e.g. 620L or BR100L)</label><input type="text" id="se-lexile-' + sess.session_id + '" value="' + (lexScore !== undefined && lexScore !== null ? escapeHtml(String(lexScore)) : '') + '" placeholder="e.g. 620L" /></div>'
      + '<div class="field"><label>Words Correct Per Minute <span class="muted" style="font-weight:400">(required — benchmarked against Hasbrouck &amp; Tindal ORF norms)</span></label><input type="number" id="se-lexile-wcpm-' + sess.session_id + '" min="0" value="' + (wcpm !== undefined && wcpm !== null ? escapeHtml(String(wcpm)) : '') + '" /></div>';
  }
  if (sess.assessment_type === 'core_phonics') {
    return renderCorePhonicsEditFields_(sess);
  }
  if (sess.assessment_type === 'dra') {
    return renderDraScoreEditFields_(sess, existing);
  }
  return '<p class="muted" style="font-size:.82rem;margin:8px 0 0">Score editing isn\'t available yet for ' + escapeHtml(ASSESSMENT_LABELS[sess.assessment_type] || sess.assessment_type) + ' sessions — delete and re-administer this session instead if a score needs to change.</p>';
}

/**
 * CORE Phonics score editing (2026-09-18, at the school's request) --
 * reuses the exact same word-grid/stop-group rendering the New Assessment
 * form uses (renderCorePhonicsPartInner_, attachCorePhonicsHandlersForPart_,
 * toggleCorePhonicsStop_, updateCorePhonicsScore_), operating on the SAME
 * global corePhonicsMarks/corePhonicsTouched/corePhonicsStopGroup/
 * corePhonicsLastTapped state those already use. Safe because the New
 * Assessment flow and a session's inline Edit form can never both be on
 * screen in the same browser tab at once (they're different full-page/
 * profile-inline views) -- collectSessionScoreEditInput_'s core_phonics
 * branch below reads the same globals right back out on Save.
 * Pre-fills from state.sessionItemDetailCache (fetched by
 * editSessionClick_ before this renders) instead of defaulting every item
 * to correct, the way a brand-new entry does.
 */
function renderCorePhonicsEditFields_(sess) {
  corePhonicsMarks = {};
  corePhonicsTouched = {};
  corePhonicsLastTapped = null;
  corePhonicsStopGroup = {};

  var detail = (state.sessionItemDetailCache && state.sessionItemDetailCache[sess.session_id]) || {};
  var bucket = state.corePhonicsAvailability[corePhonicsGradeBucket_(sess.grade_at_admin)];
  var allPartIds = state.corePhonicsParts.map(function(p) { return p.id; }); // already in CORE_PART_ORDER's own order -- see getCorePhonicsParts, Code.gs
  var applicableIds = (bucket && bucket[sess.season]) || allPartIds;
  // Union with whatever was actually recorded -- never silently hide a
  // previously-recorded part just because a later grade/season correction
  // (or a part given "if indicated," outside the standard chart) would no
  // longer suggest it for a brand-new entry.
  var partIds = allPartIds.filter(function(id) {
    return applicableIds.indexOf(id) !== -1 || Object.prototype.hasOwnProperty.call(detail, 'part_' + id.toLowerCase());
  });
  var applicableParts = state.corePhonicsParts.filter(function(p) { return partIds.indexOf(p.id) !== -1; });

  var html = '<p class="muted" style="margin:8px 0;font-size:.82rem">Pre-filled with what was actually recorded -- tap a word to mark it wrong (tap again to undo). A part with no prior record here defaults every word to correct, same as a brand-new entry.</p>';

  applicableParts.forEach(function(part) {
    var recorded = detail['part_' + part.id.toLowerCase()];
    if (recorded) {
      corePhonicsMarks[part.id] = recorded.slice();
      corePhonicsTouched[part.id] = recorded.map(function(v) { return v === false; });
      var stopGroup = reconstructCorePhonicsStopGroup_(part.id, recorded);
      if (stopGroup !== undefined) corePhonicsStopGroup[part.id] = stopGroup;
    } else {
      corePhonicsMarks[part.id] = part.items.map(function() { return true; });
      corePhonicsTouched[part.id] = part.items.map(function() { return false; });
    }
    var count = corePhonicsMarks[part.id].filter(function(v) { return v === true; }).length;
    html += '<details class="part-block" open><summary>Part ' + part.id.replace('_long', ' (long)').replace('_short', ' (short)') + ' — ' + escapeHtml(part.label)
      + ' <span class="part-score" id="score-' + part.id + '">' + count + '/' + part.items.length + '</span></summary>'
      + '<div id="part-content-' + part.id + '">' + renderCorePhonicsPartInner_(part) + '</div></details>';
  });
  return html;
}

/**
 * Reverses which "Stopped here" group, if any, was in effect for one
 * part's previously-recorded marks -- a disabled group's every index was
 * saved as null (see renderCorePhonicsPartInner_'s own disabled-group
 * handling), so the last group with at least one non-null index is the
 * one administration actually stopped after. Returns undefined when
 * every group has at least one non-null index (nothing was stopped).
 */
function reconstructCorePhonicsStopGroup_(partId, marks) {
  var groups = corePhonicsPartGroups_(partId);
  if (!groups) return undefined;
  var lastAdministeredGroup;
  var anyFullyNullGroup = false;
  groups.forEach(function(g, gi) {
    var allNull = g.indices.every(function(idx) { return marks[idx] === null || marks[idx] === undefined; });
    if (allNull) anyFullyNullGroup = true;
    else lastAdministeredGroup = gi;
  });
  return anyFullyNullGroup ? lastAdministeredGroup : undefined;
}

/**
 * DRA score editing (2026-09-18, at the school's request). `existing` is
 * sessionMeasureRawScores_'s map (for Words Correct Per Minute, which is
 * always the literal number entered -- no ambiguity there). The Guided
 * Reading Level letter itself can only be pre-filled exactly for a
 * session saved after the 2026-09-18 fix that started persisting it (see
 * Registry.gs's dra.score) -- an older session has no reliable way to
 * recover which of possibly several letters mapping to the same DRA
 * number was actually typed, so this asks for a fresh selection instead
 * of guessing one.
 */
function renderDraScoreEditFields_(sess, existing) {
  var detail = (state.sessionItemDetailCache && state.sessionItemDetailCache[sess.session_id]) || {};
  var currentGrl = detail.dra_level;
  var wcpm = existing.orf_wcpm;

  var html = currentGrl
    ? ''
    : '<p class="muted" style="font-size:.78rem;margin-bottom:6px">This session was recorded before the exact Guided Reading Level letter was saved (only the derived DRA number was) -- please re-select the correct level below rather than trust a guess.</p>';
  html += '<div class="field"><label>Guided Reading Level</label><select id="se-dra-grl-' + sess.session_id + '">'
    + (currentGrl ? '' : '<option value="">Select…</option>')
    + (state.grlLetters || []).map(function(g) { return '<option value="' + g + '"' + (g === currentGrl ? ' selected' : '') + '>' + g + '</option>'; }).join('')
    + '</select></div>'
    + '<div class="field"><label>Words Correct Per Minute <span class="muted" style="font-weight:400">(required — benchmarked against Hasbrouck &amp; Tindal ORF norms)</span></label><input type="number" id="se-dra-wcpm-' + sess.session_id + '" min="0" value="' + (wcpm !== undefined && wcpm !== null ? escapeHtml(String(wcpm)) : '') + '" /></div>';
  return html;
}

/** Reads back whatever renderSessionScoreEditFields_ rendered, in the shape scoreAssessmentSession expects for this type -- or null if this type has no editable score fields at all (see renderSessionScoreEditFields_'s doc comment). */
function collectSessionScoreEditInput_(sess, grade, season) {
  if (sess.assessment_type === 'dibels') {
    var entries = [];
    (state.dibelsMeasures || []).forEach(function(m) {
      if (m.id === 'COMPOSITE' || m.id === 'ORF_ACCURACY' || m.id === 'MAZE') return; // Composite is never manual; ORF Accuracy/Maze are derived -- collected separately below, not through this generic loop
      var el = document.getElementById('se-dval-' + sess.session_id + '-' + m.id);
      var val = el ? el.value : '';
      if (val !== '') entries.push({ measure: m.id, rawScore: Number(val) });
    });
    var input = { grade: grade, season: season, entries: entries };

    var existing = sessionMeasureRawScores_(sess.session_id);
    var orfErrorsEl = document.getElementById('se-dval-orf-errors-' + sess.session_id);
    if (orfErrorsEl && orfErrorsEl.value !== '') {
      input.orfErrors = Number(orfErrorsEl.value);
    } else if (existing.orf_accuracy !== undefined) {
      input.existingOrfAccuracy = existing.orf_accuracy; // preserve verbatim -- see updateSessionFields (Code.gs)/dibels.score (Registry.gs)
    }
    var mazeCorrectEl = document.getElementById('se-dval-maze-correct-' + sess.session_id);
    var mazeIncorrectEl = document.getElementById('se-dval-maze-incorrect-' + sess.session_id);
    if (mazeCorrectEl && mazeCorrectEl.value !== '') {
      input.mazeCorrect = Number(mazeCorrectEl.value);
      if (mazeIncorrectEl && mazeIncorrectEl.value !== '') input.mazeIncorrect = Number(mazeIncorrectEl.value);
    } else if (existing.maze !== undefined) {
      input.existingMaze = existing.maze; // preserve verbatim
    }
    return input;
  }
  if (sess.assessment_type === 'easycbm') {
    var entries2 = [];
    (state.easyCbmMeasures || []).forEach(function(m) {
      var el = document.getElementById('se-eval-' + sess.session_id + '-' + m.id);
      var val = el ? el.value : '';
      if (val !== '') entries2.push({ measure: m.id, rawScore: Number(val) });
    });
    return { grade: grade, season: season, entries: entries2 };
  }
  if (sess.assessment_type === 'easycbm_math') {
    var entries3 = [];
    (state.easyCbmMathMeasures || []).forEach(function(m) {
      var el = document.getElementById('se-ecmval-' + sess.session_id + '-' + m.id);
      var val = el ? el.value : '';
      if (val !== '') entries3.push({ measure: m.id, rawScore: Number(val) });
    });
    return { grade: grade, season: season, entries: entries3 };
  }
  if (sess.assessment_type === 'lexile') {
    var wcpmEl = document.getElementById('se-lexile-wcpm-' + sess.session_id);
    var wcpmVal = wcpmEl ? wcpmEl.value : '';
    if (wcpmVal === '') { toast('Words Correct Per Minute is required.'); return undefined; } // undefined (not null) signals "validation failed, abort save"
    var lexEl = document.getElementById('se-lexile-' + sess.session_id);
    return { grade: grade, season: season, lexileScore: lexEl ? lexEl.value.trim() : '', wcpm: Number(wcpmVal) };
  }
  if (sess.assessment_type === 'core_phonics') {
    // renderCorePhonicsEditFields_ populated corePhonicsMarks (the SAME
    // global the New Assessment form's own collectAndSubmit reads) while
    // rendering this form -- read it straight back out, same shape
    // scoreCorePhonics expects.
    return { itemResults: corePhonicsMarks };
  }
  if (sess.assessment_type === 'dra') {
    var grlEl = document.getElementById('se-dra-grl-' + sess.session_id);
    var draWcpmEl = document.getElementById('se-dra-wcpm-' + sess.session_id);
    var grlVal = grlEl ? grlEl.value : '';
    var draWcpmVal = draWcpmEl ? draWcpmEl.value : '';
    if (!grlVal) { toast('Guided Reading Level is required.'); return undefined; }
    if (draWcpmVal === '') { toast('Words Correct Per Minute is required.'); return undefined; }
    return { grade: grade, season: season, grl: grlVal, wcpm: Number(draWcpmVal) };
  }
  return null; // no editable score fields for this type -- metadata-only save
}

function renderSessionEditForm_(sess) {
  var currentGrade = normalizeGradeKey_(sess.grade_at_admin);
  var showSeason = sess.assessment_type === 'dibels' || sess.assessment_type === 'lexile' || sess.assessment_type === 'dra' || sess.assessment_type === 'core_phonics' || sess.assessment_type === 'easycbm' || sess.assessment_type === 'easycbm_math';

  return '<div style="margin-top:10px;padding-top:10px;border-top:1px solid var(--line)">'
    + '<div class="field-row">'
    + '<div class="field"><label>Administration date</label><input type="date" id="se-date-' + sess.session_id + '" value="' + escapeHtml(String(sess.administration_date || '').substring(0, 10)) + '" /></div>'
    + '<div class="field"><label>Grade at administration</label><select id="se-grade-' + sess.session_id + '">'
    + NEW_ASSESSMENT_GRADE_OPTIONS.map(function(g) { return '<option value="' + g + '"' + (currentGrade === g ? ' selected' : '') + '>' + (NEW_ASSESSMENT_GRADE_LABELS_[g] || g) + '</option>'; }).join('')
    + '</select></div>'
    + '</div>'
    + '<div class="field-row">'
    + '<div class="field"><label>School year</label><select id="se-year-' + sess.session_id + '">'
    + (state.availableSchoolYears || []).map(function(y) { return '<option value="' + escapeHtml(y) + '"' + (sess.school_year === y ? ' selected' : '') + '>' + escapeHtml(y) + '</option>'; }).join('')
    + '</select></div>'
    + (showSeason ? '<div class="field"><label>Season</label><select id="se-season-' + sess.session_id + '">'
        + ['Fall', 'Winter', 'Spring', 'Other'].map(function(s) { return '<option' + (sess.season === s ? ' selected' : '') + '>' + s + '</option>'; }).join('')
        + '</select></div>' : '')
    + '</div>'
    + (sess.assessment_type === 'easycbm_math'
        ? '<div class="field"><label>Test Grade Level <span class="muted" style="font-weight:400">(optional — if different from the student\'s own grade)</span></label><select id="se-test-grade-' + sess.session_id + '">'
          + '<option value="">Same as student\'s grade</option>'
          + NEW_ASSESSMENT_GRADE_OPTIONS.map(function(g) { return '<option value="' + g + '"' + ((sess.test_grade_level || '') === g ? ' selected' : '') + '>' + (NEW_ASSESSMENT_GRADE_LABELS_[g] || g) + '</option>'; }).join('')
          + '</select></div>'
        : '')
    + '<div class="field"><label>Administered by</label><select id="se-role-' + sess.session_id + '">'
    + (state.administratorRoles || []).map(function(r) { return '<option' + (sess.administrator_role === r ? ' selected' : '') + '>' + escapeHtml(r) + '</option>'; }).join('')
    + '</select></div>'
    + '<div class="field"><label>Notes</label><textarea id="se-notes-' + sess.session_id + '" rows="2">' + escapeHtml(sess.notes || '') + '</textarea></div>'
    + '<p class="muted" style="font-size:.78rem;margin:12px 0 4px;font-weight:700">Scores</p>'
    + renderSessionScoreEditFields_(sess)
    + '<div class="btn-row" style="margin-top:8px">'
    + '<button class="btn btn-primary btn-small" onclick="saveSessionEditClick_(\'' + sess.session_id + '\')">Save</button>'
    + '<button class="btn btn-secondary btn-small" onclick="cancelSessionEdit_(\'' + sess.session_id + '\')">Cancel</button>'
    + '</div></div>';
}

function cancelSessionEdit_(sessionId) {
  var slot = document.getElementById('session-edit-' + sessionId);
  if (slot) slot.innerHTML = '';
}

function saveSessionEditClick_(sessionId, confirmMismatch, confirmIncompleteComposite) {
  var sess = ((state.currentHistory || {}).sessions || []).filter(function(s) { return s.session_id === sessionId; })[0];
  if (!sess) return;

  var dateEl = document.getElementById('se-date-' + sessionId);
  var gradeEl = document.getElementById('se-grade-' + sessionId);
  var yearEl = document.getElementById('se-year-' + sessionId);
  var seasonEl = document.getElementById('se-season-' + sessionId);
  var roleEl = document.getElementById('se-role-' + sessionId);
  var notesEl = document.getElementById('se-notes-' + sessionId);
  var testGradeEl = document.getElementById('se-test-grade-' + sessionId);
  var grade = gradeEl ? gradeEl.value : '';
  var season = seasonEl ? seasonEl.value : '';

  var patch = {
    administration_date: dateEl ? dateEl.value : '',
    grade_at_admin: grade,
    school_year: yearEl ? yearEl.value : '',
    season: season,
    administrator_role: roleEl ? roleEl.value : '',
    notes: notesEl ? notesEl.value.trim() : ''
  };
  // Only present on the form for easycbm_math sessions (renderSessionEditForm_) --
  // omitted (not sent as '') for every other type, so their sessions never
  // pick up a stray test_grade_level write.
  if (testGradeEl) patch.test_grade_level = testGradeEl.value;
  if (confirmMismatch) patch.confirm_grade_year_mismatch = true;
  if (confirmIncompleteComposite) patch.confirm_incomplete_composite = true;

  // null means this assessment type has no editable score fields at all
  // (metadata-only save, unchanged from before); undefined means the score
  // fields ARE editable but failed validation (collectSessionScoreEditInput_
  // already toasted why) -- abort without saving anything in that case.
  var input = collectSessionScoreEditInput_(sess, grade, season);
  if (input === undefined) return;
  if (input !== null) patch.input = input;

  call('updateSessionFields', sessionId, patch).then(function(result) {
    if (!result) throw new Error('updateSessionFields returned nothing.');
    if (result.grade_year_mismatch_warning) {
      showConfirm_(
        'Grade doesn\'t match this school year?',
        'You entered Grade ' + (NEW_ASSESSMENT_GRADE_LABELS_[result.entered_grade] || result.entered_grade) + ' for ' + escapeHtml(patch.school_year)
          + ', but based on this student\'s current grade, ' + escapeHtml(patch.school_year) + ' should be Grade ' + (NEW_ASSESSMENT_GRADE_LABELS_[result.expected_grade] || result.expected_grade)
          + '. If this student was genuinely held back a grade, this is expected -- otherwise, cancel and fix "Grade at administration" before saving.',
        'Save Anyway',
        function() { saveSessionEditClick_(sessionId, true, confirmIncompleteComposite); }
      );
      return;
    }
    if (result.composite_incomplete_warning) {
      showConfirm_(
        'Missing measures needed for the Composite score',
        'The DIBELS Composite Score can\'t be calculated because these measures are still blank: ' + result.missing_measures.map(escapeHtml).join(', ')
          + '. Go back and enter them, or save this session without a Composite score.',
        'Save Without Composite',
        function() { saveSessionEditClick_(sessionId, confirmMismatch, true); }
      );
      return;
    }
    toast('Session updated.');
    openStudent(state.currentStudent.student_id);
  }).catch(function(err) { toast('Error: ' + err.message); });
}

function showEditStudentForm_() {
  var s = state.currentStudent;
  var slot = document.getElementById('edit-student-slot');
  slot.innerHTML = '<div class="card" style="margin-top:12px">'
    + '<h2>Edit Student</h2>'

/**
 * Plain-text student summary for pasting into an IEP-meeting doc, a parent
 * email, etc. Clipboard (not a CSV/file download) is the deliberate choice
 * for single-student exports -- nothing persists outside the browser tab,
 * unlike a downloaded file. CSV export is reserved for bulk/aggregate data
 * (see the principal dashboard's export instead).
 */
function buildStudentSummaryText_() {
  var s = state.currentStudent;
  var h = state.currentHistory;
  var lines = [];
  lines.push(s.first_name + ' ' + s.last_name + ' — Grade ' + (s.grade || '—') + (s.school ? ' · ' + s.school : ''));
  lines.push('Summary generated ' + fmtDate(todayIso_()));
  lines.push('');

  if (h.strengths.length === 0 && h.concerns.length === 0) {
    lines.push('No assessments recorded yet.');
  } else {
    if (h.strengths.length) {
      lines.push('Strengths: ' + h.strengths.map(function(s) {
        return measureLabel_(s.measure) + (s.stale ? ' (needs retesting — ' + measureAbbreviation_(s.measure) + ', last assessed ' + s.last_assessed_school_year + ')' : '');
      }).join(', '));
    }
    if (h.concerns.length) {
      lines.push('Areas of concern: ' + h.concerns.map(function(c) {
        return measureLabel_(c.measure) + ' (' + c.tier + (c.trend !== 'insufficient data' ? ', ' + c.trend : '')
          + (c.stale ? ', needs retesting — ' + measureAbbreviation_(c.measure) + ', last assessed ' + c.last_assessed_school_year : '') + ')';
      }).join('; '));
    }
  }

  lines.push('');
  lines.push('Assessment History:');
  if (h.sessions.length === 0) {
    lines.push('(none yet)');
  } else {
    h.sessions.slice().reverse().forEach(function(sess) {
      var label = ASSESSMENT_LABELS[sess.assessment_type] || sess.assessment_type;
      lines.push('- ' + fmtDate(sess.administration_date) + ' — ' + label
        + (sess.season ? ' (' + sess.season + ')' : '') + (sess.grade_at_admin ? ', Grade ' + sess.grade_at_admin : '')
        + (sess.administrator_role ? ', administered by ' + sess.administrator_role : ''));
      if (sess.notes) lines.push('    Notes: ' + sess.notes);
    });
  }

  return lines.join('\n');
}

function copyTextToClipboard_(text) {
  if (navigator.clipboard && navigator.clipboard.writeText) {
    return navigator.clipboard.writeText(text);
  }
  // Fallback for sandboxed contexts (Apps Script HtmlService serves this page
  // inside an iframe, where the async Clipboard API isn't always available/
  // permitted) -- the older execCommand trick works from a direct user
  // gesture even when the Clipboard API itself is blocked.
  return new Promise(function(resolve, reject) {
    var ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    var ok = false;
    try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
    document.body.removeChild(ta);
    if (ok) resolve(); else reject(new Error('execCommand copy failed'));
  });
}

function copyStudentSummaryClick() {
  var text = buildStudentSummaryText_();
  copyTextToClipboard_(text).then(function() {
    toast('Summary copied to clipboard.');
    logIepExportEvent_('clipboard_summary');
  }).catch(function() {
    toast('Could not copy to clipboard in this browser.');

}

/**
 * Static, print-safe version of the live profile's Growth Over Time charts
 * (2026-09-17). Deliberately does NOT reuse renderGrowthChartBlock_/
 * growthChartCaptionHtml_ as-is: those build DOM ids (gchart-caption-<mid>)
 * and onclick handlers (selectGrowthChartPoint_) meant for the live,
 * single-instance profile page -- reusing them here would risk duplicate
 * DOM ids (the print preview can be open while the live profile's own
 * Growth Over Time section is still mounted underneath it) and would let a
 * click in the print preview corrupt GROWTH_CHART_SELECTED_, a piece of
 * state shared with the live page. buildGrowthChartSvg_ itself is still
 * reused for the actual chart drawing -- called WITHOUT its `mid` argument
 * so it renders every point with no onclick attribute at all (see its own
 * `onclickAttr = mid ? ... : ''` guard), i.e. a purely static image. The
 * caption below each chart is a plain, non-interactive summary of the
 * latest point only (no tap-to-select -- nothing to select on paper).
 */
function buildPrintGrowthChartsHtml_(h) {
  var measureIds = Object.keys(h.measureSeries || {});
  if (measureIds.length === 0) return '';
  var html = '<h2>Growth Over Time</h2>';
  measureIds.forEach(function(mid) {
    var series = h.measureSeries[mid];
    var points = series.points;
    var last = points[points.length - 1];
    var hasBenchmark = points.some(function(p) { return p.benchmark_reference !== null && p.benchmark_reference !== undefined; });
    html += '<div style="margin-bottom:18px;page-break-inside:avoid">'
      + '<strong style="font-size:.85rem">' + escapeHtml(measureLabel_(mid)) + '</strong> '
      + '<span style="color:#666;font-size:.8rem">(' + escapeHtml(series.trend)
      + (points.length < 3 ? ' — ' + points.length + ' data point' + (points.length === 1 ? '' : 's') : '') + ')</span>'
      + buildGrowthChartSvg_(points, hasBenchmark)
      + '<div style="color:#666;font-size:.78rem;margin-top:4px">'
      + escapeHtml(fmtDate(points[0].date)) + ' → ' + escapeHtml(fmtDate(last.date))
      + ' · Latest: ' + escapeHtml(String(last.raw_score)) + ' (' + escapeHtml(pointStatusText_(last)) + ')'
      + (last.benchmark_reference !== null && last.benchmark_reference !== undefined ? ' · Goal: ' + escapeHtml(String(last.benchmark_reference)) : '')
      + '</div></div>';
  });
  return html;
}

/**
 * Formatted, printable single-student report -- covers "hand a page to a
 * parent" or "bring one to an IEP meeting" (Phase 13b), which neither the
 * clipboard summary (plain text, nothing to hold) nor CSV export (reserved
 * for bulk/aggregate data, see exportDashboardCsv_) covers well. Rendered
 * into #print-report (normally hidden; see the @media print CSS rule) so
 * printing shows ONLY this formatted page, not the live app's nav/buttons.
 */
function buildStudentReportHtml_() {
  var s = state.currentStudent;
  var h = state.currentHistory;
  var html = '<div style="max-width:720px;margin:0 auto;font-size:.92rem">'
    + printLetterheadHtml_('Student Assessment Report', s.first_name + ' ' + s.last_name + ' — Grade ' + (s.grade || '—') + (s.school ? ' · ' + s.school : '') + ' · Generated ' + fmtDate(todayIso_()));

  html += '<h2>Summary</h2>';
  if (h.strengths.length === 0 && h.concerns.length === 0) {
    html += '<p>No assessments recorded yet.</p>';
  } else {
    if (h.strengths.length) {
      html += '<p style="margin-bottom:4px"><strong>Strengths</strong></p>'
        + '<ul style="margin:0 0 14px;padding-left:20px">'
        + h.strengths.map(function(s) {
            return '<li>' + escapeHtml(measureLabel_(s.measure))
              + (s.stale ? ' — needs retesting (' + escapeHtml(measureAbbreviation_(s.measure)) + ', last assessed ' + escapeHtml(s.last_assessed_school_year) + ')' : '')
              + '</li>';
          }).join('')
        + '</ul>';
    }
    if (h.concerns.length) {
      html += '<p style="margin-bottom:4px"><strong>Areas of Concern</strong></p>'
        + '<ul style="margin:0 0 14px;padding-left:20px">'
        + h.concerns.map(function(c) {
            var plain = tierPlainLanguage_(c.tier);
            return '<li>' + escapeHtml(measureLabel_(c.measure)) + ' — ' + escapeHtml(c.tier)
              + (plain ? ' (' + escapeHtml(plain) + ')' : '')
              + (c.trend !== 'insufficient data' ? ', ' + escapeHtml(c.trend) : '')
              + (c.stale ? ' — needs retesting (' + escapeHtml(measureAbbreviation_(c.measure)) + ', last assessed ' + escapeHtml(c.last_assessed_school_year) + ')' : '')
              + '</li>';
          }).join('')
        + '</ul>';
    }
  }

  var measureIds = Object.keys(h.measureSeries || {});
  if (measureIds.length > 0) {
    // Real find, 2026-09-26 (independent code review, "reporting consistency"):
    // this table always shows the LITERAL most recent data point per measure,
    // while Summary above deliberately walks back past a null-tier point to
    // the last one that actually had a tier (a partial CORE Phonics battery,
    // for instance, can legitimately produce a null tier on the newest date).
    // The two can show different dates for the same measure with nothing
    // explaining why -- flag it inline, only where it actually applies.
    var summarizedMeasures = {};
    (h.strengths || []).concat(h.concerns || []).forEach(function(entry) { summarizedMeasures[entry.measure] = true; });
    html += '<h2>Latest Scores</h2><table><thead><tr><th>Measure</th><th>Date</th><th>Score</th><th>Status</th><th>Goal</th></tr></thead><tbody>';
    measureIds.forEach(function(mid) {
      var series = h.measureSeries[mid];
      var last = series.points[series.points.length - 1];
      var mostRecentUnscored = !last.benchmark_tier && summarizedMeasures[mid];
      html += '<tr><td>' + escapeHtml(measureLabel_(mid)) + '</td>'
        + '<td>' + escapeHtml(fmtDate(last.date)) + '</td>'
        + '<td>' + escapeHtml(String(last.raw_score)) + '</td>'
        + '<td>' + escapeHtml(pointStatusText_(last)) + (mostRecentUnscored ? ' <span style="font-size:.85em">(see Summary above for the last scored result)</span>' : '') + '</td>'
        + '<td>' + (last.benchmark_reference !== null && last.benchmark_reference !== undefined ? escapeHtml(String(last.benchmark_reference)) : '—') + '</td></tr>';
    });
    html += '</tbody></table>';
  }

  // Optional (2026-09-17, at the school's request): a printable version of
  // the same Growth Over Time charts already on the live profile -- opt-in
  // via the "Include Growth Charts" checkbox in the preview (see
  // previewStudentReportClick/toggleReportCharts_), not shown by default,
  // so a standard report stays exactly as short as it's always been unless
  // someone specifically wants the visual trend included (e.g. for an IEP
  // meeting where a picture of progress over time is more persuasive than
  // a bare "Latest Scores" number).
  if (state.printReportIncludeCharts) {
    html += buildPrintGrowthChartsHtml_(h);
  }

  html += '<h2>Assessment History</h2>';
  if (h.sessions.length === 0) {
    html += '<p>No sessions recorded yet.</p>';
  } else {
    // Notes removed from print (2026-09-22, at the school's request --
    // informal staff shorthand read as unprofessional on a document meant
    // to leave the app). Still shown in the live app/on-screen history and
    // the copy-to-clipboard summary -- this only trims the printed page.
    html += '<table><thead><tr><th>Date</th><th>Assessment</th><th>Season</th><th>Grade</th><th>Administered By</th></tr></thead><tbody>';
    h.sessions.slice().reverse().forEach(function(sess) {
      html += '<tr><td>' + escapeHtml(fmtDate(sess.administration_date)) + '</td>'
        + '<td>' + escapeHtml(ASSESSMENT_LABELS[sess.assessment_type] || sess.assessment_type) + '</td>'
        + '<td>' + escapeHtml(sess.season || '—') + '</td>'
        + '<td>' + escapeHtml(sess.grade_at_admin || '—') + '</td>'
        + '<td>' + escapeHtml(sess.administrator_role || '—') + '</td></tr>';
    });
    html += '</tbody></table>';
  }

  return html + '</div>';
}

 * Dashboard view (no new server call), same print-report/@media print

 * clean printed page, not the live app's nav/buttons.
 */
function buildBoardPacketHtml_() {
  var d = state.dashboard;
  var c = state.compliance;
  var html = '<div style="max-width:720px;margin:0 auto;font-size:.92rem">'
    + printLetterheadHtml_('ELC Benchmarking Report' + (c ? ' — ' + c.school_year : ''), 'Generated ' + (window.ELC_DEMO_NOW ? window.ELC_DEMO_NOW() : new Date()).toLocaleString());

  var headline = d ? computeDashboardHeadline_(d) : null;
  if (headline) {
    var cur = parseTrendPeriodKey_(headline.current_period);
    var prev = parseTrendPeriodKey_(headline.previous_period);
    var deltaText = headline.delta === 0 ? 'No change'
      : (headline.delta < 0 ? Math.abs(headline.delta) + ' fewer student' + (Math.abs(headline.delta) === 1 ? '' : 's') + ' At Risk'
                             : headline.delta + ' more student' + (headline.delta === 1 ? '' : 's') + ' At Risk');
    html += '<h2>Headline</h2><p><strong>Schoolwide At Risk: ' + headline.previous_at_risk + ' → ' + headline.current_at_risk + '</strong> ('
      + escapeHtml(deltaText) + ', ' + escapeHtml(prev.season) + ' ' + escapeHtml(prev.schoolYear) + ' → ' + escapeHtml(cur.season) + ' ' + escapeHtml(cur.schoolYear) + ')</p>';
  }

  html += '<h2>Risk Tier Snapshot by Grade</h2>';
  if (!d || !d.grades || d.grades.length === 0) {
    html += '<p>No active students on the roster yet.</p>';
  } else {
    html += '<table><thead><tr><th>Grade</th><th>Total</th><th>At Risk</th><th>Some Risk</th><th>On Track</th><th>Not Yet Assessed</th></tr></thead><tbody>';
    d.grades.forEach(function(g) {
      html += '<tr><td>' + escapeHtml(g.grade) + '</td><td>' + g.total + '</td><td>' + g.current.at_risk + '</td>'
        + '<td>' + g.current.some_risk + '</td><td>' + g.current.on_track + '</td><td>' + g.current.not_assessed + '</td></tr>';
    });
    html += '</tbody></table>';
  }

  html += '<h2>Benchmarking Compliance</h2>';
  if (!c || !c.checkpoints || c.checkpoints.length === 0) {
    html += '<p>No compliance data available.</p>';
  } else {

// Phase 39: toLocaleDateString() with no locale argument renders using the
// VIEWER's own browser/OS locale -- on a US-formatted date that's MM/DD/YYYY,
// but on a different locale it silently becomes DD/MM/YYYY with the exact
// same digits, which reads as a nonsense date (or a DIFFERENT real date) to
// anyone assuming the US order. Forcing 'en-US' with a spelled-out month
// (e.g. "Dec 5, 2025") makes the day/month order impossible to misread,
// regardless of whose browser is looking at it.
function fmtDate(d) {
  if (!d) return '';
  var date = new Date(d);
  if (isNaN(date.getTime())) return String(d);
  return date.toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' });
}

  });
}

  var chain = state.assessmentTypes ? Promise.resolve(state.assessmentTypes) : call('getAssessmentTypes');

    renderNewAssessmentStep1();

/**
 * Lazily fetches whatever a given assessment type's entry form needs,
 * caching each piece so re-selecting the same type later is instant.
 * Sequential, not Promise.all — see the note in openStudent() about
 * parallel google.script.run calls being unreliable in this app.
 */
function ensureTypeDataLoaded_(type) {
  // Administrator-role list is needed by every type's common-fields step
  // (not type-specific), so it's fetched once here regardless of which
  // branch below runs, then cached like everything else in this function.
  var rolesReady = state.administratorRoles ? Promise.resolve() : call('getAdministratorRoles').then(function(r) {
    if (!r) throw new Error('getAdministratorRoles returned nothing.');
    state.administratorRoles = r;
  });
  // Phase 29a: the School Year field is now a closed-list select (see
  // renderNewAssessmentStep2), needed for every type's common fields too.
  var schoolYearsReady = state.availableSchoolYears ? Promise.resolve() : call('getAvailableSchoolYears').then(function(r) {
    if (!r) throw new Error('getAvailableSchoolYears returned nothing.');
    state.availableSchoolYears = r;
  });

  return Promise.all([rolesReady, schoolYearsReady]).then(function() {
    if (type === 'core_phonics') {
      var parts = state.corePhonicsParts ? Promise.resolve() : call('getCorePhonicsParts').then(function(r) {
        if (!r) throw new Error('getCorePhonicsParts returned nothing.');
        state.corePhonicsParts = r;
      });
      return parts.then(function() {
        if (state.corePhonicsAvailability) return;
        return call('getCorePhonicsAvailability').then(function(r) {
          if (!r) throw new Error('getCorePhonicsAvailability returned nothing.');
          state.corePhonicsAvailability = r;
        });
      });
    }
    if (type === 'dibels') {
      if (state.dibelsMeasures) return Promise.resolve();
      return call('getDibelsMeasureList').then(function(r) {
        if (!r) throw new Error('getDibelsMeasureList returned nothing.');
        state.dibelsMeasures = r;
      });
    }
    if (type === 'dra') {
      if (state.grlLetters) return Promise.resolve();
      return call('getGrlLetters').then(function(r) {
        if (!r) throw new Error('getGrlLetters returned nothing.');
        state.grlLetters = r;
      });
    }
    if (type === 'easycbm') {
      if (state.easyCbmMeasures) return Promise.resolve();
      return call('getEasyCbmMeasureList').then(function(r) {
        if (!r) throw new Error('getEasyCbmMeasureList returned nothing.');
        state.easyCbmMeasures = r;
      });
    }
    if (type === 'easycbm_math') {
      if (state.easyCbmMathMeasures) return Promise.resolve();
      return call('getEasyCbmMathMeasureList').then(function(r) {
        if (!r) throw new Error('getEasyCbmMathMeasureList returned nothing.');
        state.easyCbmMathMeasures = r;
      });
    }
    return Promise.resolve(); // lexile needs nothing beyond the common fields
  });
}
