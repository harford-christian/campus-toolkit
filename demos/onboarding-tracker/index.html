<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Onboarding Tracker — Showcase demo</title>
<style>
  :root { --gold:#D4AF37; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { display: flex; flex-direction: column; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: #201f22; }
  .bar {
    flex: none; display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    padding: 10px 16px; color: #fff;
    background: linear-gradient(120deg, #6d1414 0%, #8f1b1b 55%, #B22222 100%);
    box-shadow: 0 4px 14px rgba(0,0,0,.35); z-index: 2;
  }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 1.05rem; }
  .brand .logo { font-size: 1.5rem; }
  .brand small { display: block; font-weight: 600; font-size: .72rem; opacity: .85; }
  .seg { display: inline-flex; background: rgba(255,255,255,.14); border: 1px solid rgba(255,255,255,.25); border-radius: 999px; padding: 4px; gap: 2px; flex-wrap: wrap; }
  .seg button { border: 0; cursor: pointer; font: inherit; font-weight: 700; font-size: .86rem; color: #fff; background: transparent; padding: 8px 13px; border-radius: 999px; }
  .seg button:hover { background: rgba(255,255,255,.16); }
  .seg button.active { background: var(--gold); color: #3a2b00; }
  .sync { font: inherit; font-weight: 700; font-size: .8rem; border-radius: 999px; border: 1px solid rgba(255,255,255,.35); background: rgba(255,255,255,.14); color: #fff; padding: 6px 11px; cursor: pointer; }
  .sync:hover { background: rgba(255,255,255,.24); }
  .spacer { flex: 1; }
  .hint { font-size: .78rem; opacity: .9; max-width: 30rem; line-height: 1.35; }
  .toast { font-size: .78rem; font-weight: 700; background: rgba(255,255,255,.18); border-radius: 999px; padding: 6px 11px; }
  .toast:empty { display: none; }
  .back, .reset { color: #fff; text-decoration: none; font-weight: 700; font-size: .86rem; opacity: .9; border: 1px solid rgba(255,255,255,.3); padding: 7px 12px; border-radius: 999px; background: none; cursor: pointer; font-family: inherit; }
  .back:hover, .reset:hover { background: rgba(255,255,255,.12); }
  .stage { flex: 1; position: relative; }
  .stage iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; display: block; background: #f4f7f6; }
  @media (max-width: 1240px) { .hint { display: none; } }
  @media (max-width: 980px) { .brand small { display: none; } .seg button { padding: 8px 10px; font-size: .8rem; } }
</style>
</head>
<body>
  <div class="bar">
    <div class="brand">
      <span class="logo" aria-hidden="true">🧾</span>
      <span>Onboarding Tracker<small>Approval email in &middot; one IT + HR checklist per new hire</small></span>
    </div>
    <div class="seg" role="tablist" aria-label="Choose a screen">
      <button data-src="inbox.html" aria-selected="false">📥 Approval emails</button>
      <button data-src="dashboard.html" class="active" aria-selected="true">📋 Dashboard</button>
    </div>
    <button class="sync" id="sync" type="button" title="Run the app's 10-minute email sync now">⟳ Run the 10-minute sync</button>
    <span class="toast" id="toast"></span>
    <span class="spacer"></span>
    <span class="hint" id="hint"></span>
    <button class="reset" id="reset" type="button" title="Forget this visit's changes and replay the sample history">↻ Reset</button>
    <a class="back" href="../../index.html" target="_top">← Gallery</a>
  </div>
  <div class="stage">
    <iframe id="screen" src="dashboard.html" title="Onboarding Tracker screen"></iframe>
  </div>
<script>
  // Both screens run the app's own Code.js (logic.js) over the same in-memory sheet and mailbox (mock.js), kept in
  // sessionStorage, so a sync or a tick on one shows on the other.
  var frame = document.getElementById('screen'), hint = document.getElementById('hint'), toast = document.getElementById('toast');
  var btns = [].slice.call(document.querySelectorAll('.seg button')), syncBtn = document.getElementById('sync');
  var HINTS = {
    'dashboard.html': 'Open <b>Avery Coleman</b> and tick a few items: the card behind the modal keeps up. Then press <b>Run the 10-minute sync</b>: a new hire\'s approval email becomes a card, and a comment joins Avery\'s discussion log.',
    'inbox.html': 'The emails the sync reads. The two in bold arrived this morning and have not been synced; press <b>Run the 10-minute sync</b> and watch them go plain.'
  };
  function say(t) { toast.textContent = t; clearTimeout(say.t); say.t = setTimeout(function () { toast.textContent = ''; }, 6000); }
  function demo() { try { return frame.contentWindow.ONBOARD_DEMO || null; } catch (e) { return null; } }
  function activate(src) {
    btns.forEach(function (b) { var on = b.getAttribute('data-src') === src; b.classList.toggle('active', on); b.setAttribute('aria-selected', on ? 'true' : 'false'); });
    hint.innerHTML = HINTS[src] || '';
    frame.src = src;
  }
  btns.forEach(function (b) { b.addEventListener('click', function () { activate(b.getAttribute('data-src')); }); });
  activate('dashboard.html');
  function refresh() { var d = demo(), n = d ? d.unread() : 0; syncBtn.textContent = '⟳ Run the 10-minute sync' + (n ? ' (' + n + ' unread)' : ''); }
  frame.addEventListener('load', refresh);
  syncBtn.addEventListener('click', function () {
    var d = demo(); if (!d) return;
    var n = d.unread(), r = d.sync();
    say(n ? 'Synced ' + n + ' email' + (n === 1 ? '' : 's') + (r.added ? ': ' + r.added + ' new onboarding record' + (r.added === 1 ? '' : 's') : '') + '.' : 'Nothing new under the label.');
    frame.src = frame.src;
  });
  document.getElementById('reset').addEventListener('click', function () {
    var d = demo(); if (d) d.reset(); else try { sessionStorage.removeItem('onboard-demo-state-v1'); } catch (e) {}
    say('Sample history replayed.');
    activate('dashboard.html');
  });
</script>
</body>
</html>
