<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Onboarding Tracker — approval emails</title>
<script src="logic.js"></script>
<script src="data.js"></script>
<script src="mock.js"></script>
<style>
  :root { --red:#B22222; --ink:#222; --mute:#666; --line:#e4e4e4; --bg:#f4f7f6; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:14px/1.5 Inter,"Segoe UI",Arial,sans-serif; }
  .wrap { display:grid; grid-template-columns:minmax(240px, 360px) 1fr; min-height:100vh; }
  aside { border-right:1px solid var(--line); background:#fff; padding:14px 10px; }
  aside h2 { font-size:12px; text-transform:uppercase; letter-spacing:.06em; color:var(--mute); margin:4px 8px 10px; }
  .mail { display:block; width:100%; text-align:left; border:0; background:none; font:inherit; padding:9px 10px; border-radius:10px; cursor:pointer; color:inherit; }
  .mail:hover { background:#faf5f5; } .mail.on { background:#fde8e8; }
  .mail span { display:block; font-size:13px; } .mail small { color:var(--mute); }
  .mail.unread span { font-weight:800; } .mail.unread span::before { content:'●  '; color:var(--red); }
  main { padding:18px 22px 40px; }
  .env { background:#fff; border:1px solid var(--line); border-radius:12px; padding:16px 20px; max-width:760px; }
  .hdr { display:grid; grid-template-columns:70px 1fr; gap:2px 10px; font-size:13px; color:var(--mute); margin-bottom:14px; padding-bottom:12px; border-bottom:1px solid var(--line); }
  .hdr span:nth-child(even) { color:var(--ink); }
  .env table td { padding:3px 14px 3px 0; vertical-align:top; }
  .note { color:var(--mute); font-size:12.5px; max-width:760px; margin:0 0 12px; }
  @media (max-width: 760px) { .wrap { grid-template-columns:1fr; } aside { border-right:0; border-bottom:1px solid var(--line); } }
</style>
</head>
<body>
<div class="wrap">
  <aside><h2 id="label"></h2><div id="list"></div></aside>
  <main>
    <p class="note">These are the identity platform's notification emails under the label the sync reads. A <b>bold</b> one has not been
      synced yet. The sync reads each unread message's subject (requested, commented, approved, rejected or revoked) and
      body, then marks the thread read.</p>
    <div id="view"></div>
  </main>
</div>
<script>
  var O = window.ONBOARD_DEMO, mails = O.emails().slice().reverse(), current = mails.length ? mails[0].id : '';
  document.getElementById('label').textContent = 'Label: ' + window.ONBOARD_LOGIC.GMAIL_LABEL + ' · newest first';
  function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
  function when(ms) { var d = new Date(ms); return d.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' }) + ', ' + d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' }); }
  function render() {
    document.getElementById('list').innerHTML = mails.map(function (m) {
      return '<button class="mail' + (m.unread ? ' unread' : '') + (m.id === current ? ' on' : '') + '" data-id="' + esc(m.id) + '"><span>' + esc(m.subject) + '</span><small>' + esc(when(m.at)) + '</small></button>';
    }).join('');
    Array.prototype.forEach.call(document.querySelectorAll('.mail'), function (b) { b.onclick = function () { current = b.getAttribute('data-id'); render(); }; });
    var m = mails.filter(function (x) { return x.id === current; })[0];
    document.getElementById('view').innerHTML = !m ? '' : '<div class="env"><div class="hdr"><span>From</span><span>Identity platform &lt;notifications@example.invalid&gt;</span>' +
      '<span>Date</span><span>' + esc(when(m.at)) + '</span><span>Subject</span><span><b>' + esc(m.subject) + '</b></span></div>' + m.html + '</div>';
    Array.prototype.forEach.call(document.querySelectorAll('#view a'), function (a) { a.onclick = function (e) { e.preventDefault(); }; a.title = 'The identity platform\'s request page (not part of this demo)'; });
  }
  render();
</script>
</body>
</html>
