<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Memo Check — Showcase demo</title>
<style>
  :root { --gold:#D4AF37; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { display: flex; flex-direction: column; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: #201f22; }
  .bar {
    flex: none; display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    padding: 10px 16px; color: #fff;
    background: linear-gradient(120deg, #6d1414 0%, #8f1b1b 55%, #B22222 100%);
    box-shadow: 0 4px 14px rgba(0,0,0,.35); z-index: 2;
  }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 1.05rem; }
  .brand .logo { font-size: 1.5rem; }
  .brand small { display: block; font-weight: 600; font-size: .72rem; opacity: .85; }
  .seg { display: inline-flex; background: rgba(255,255,255,.14); border: 1px solid rgba(255,255,255,.25); border-radius: 999px; padding: 4px; gap: 2px; flex-wrap: wrap; }
  .seg button {
    border: 0; cursor: pointer; font: inherit; font-weight: 700; font-size: .86rem;
    color: #fff; background: transparent; padding: 8px 13px; border-radius: 999px;
  }
  .seg button:hover { background: rgba(255,255,255,.16); }
  .seg button.active { background: var(--gold); color: #3a2b00; }
  .tools { display: none; align-items: center; gap: 8px; flex-wrap: wrap; }
  .tools.show { display: inline-flex; }
  .tools select, .tools button {
    font: inherit; font-weight: 700; font-size: .8rem; border-radius: 999px; border: 1px solid rgba(255,255,255,.35);
    background: rgba(255,255,255,.14); color: #fff; padding: 6px 11px; cursor: pointer;
  }
  .tools select option { color: #222; }
  .tools button:hover { background: rgba(255,255,255,.24); }
  .tools button:disabled { opacity: .45; cursor: default; }
  .spacer { flex: 1; }
  .hint { font-size: .78rem; opacity: .9; max-width: 30rem; line-height: 1.35; }
  .toast { font-size: .78rem; font-weight: 700; background: rgba(255,255,255,.18); border-radius: 999px; padding: 6px 11px; }
  .toast:empty { display: none; }
  .back, .reset { color: #fff; text-decoration: none; font-weight: 700; font-size: .86rem; opacity: .9; border: 1px solid rgba(255,255,255,.3); padding: 7px 12px; border-radius: 999px; background: none; cursor: pointer; font-family: inherit; }
  .back:hover, .reset:hover { background: rgba(255,255,255,.12); }
  .stage { flex: 1; position: relative; }
  .stage iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; display: block; background: #f7f6f3; }
  @media (max-width: 1280px) { .hint { display: none; } }
  @media (max-width: 980px) { .brand small { display: none; } .seg button { padding: 8px 10px; font-size: .8rem; } }
</style>
</head>
<body>
  <div class="bar">
    <div class="brand">
      <span class="logo" aria-hidden="true">📨</span>
      <span>Memo Check<small>Staff email in &middot; proposed Campus Control changes out &middot; a human decides</small></span>
    </div>
    <div class="seg" role="tablist" aria-label="Choose a screen">
      <button data-src="inbox.html" aria-selected="false">📨 Staff email</button>
      <button data-src="digest.html" aria-selected="false">✉️ Digest</button>
      <button data-src="queue.html" class="active" aria-selected="true">✅ Review queue</button>
    </div>
    <span class="tools" id="tools">
      <select id="who" aria-label="Who is signed in">
        <option value="demo.staff@example.edu">Signed in as a schedule editor</option>
        <option value="teacher@example.edu">Signed in as a teacher (view only)</option>
      </select>
      <button id="clicks" type="button" title="Eagle Eye is not in this demo: this writes to the plan what its clicks would write">🖱 Make the Eagle Eye clicks</button>
      <button id="tick" type="button" title="Run Memo Check's hourly trigger now">⟳ Run the hourly check</button>
    </span>
    <span class="toast" id="toast"></span>
    <span class="spacer"></span>
    <span class="hint" id="hint"></span>
    <button class="reset" id="reset" type="button" title="Forget this visit's decisions and replay the sample history">↻ Reset</button>
    <a class="back" href="../../index.html" target="_top">← Gallery</a>
  </div>
  <div class="stage">
    <iframe id="screen" src="queue.html" title="Memo Check screen"></iframe>
  </div>
<script>
  // Each screen runs the app's own server code (logic.js) over the same in-memory Google (mock.js), sharing one
  // sessionStorage state, so a decision in the queue shows in every view. The two tool buttons call into the
  // current screen's copy and reload it.
  var frame = document.getElementById('screen'), tools = document.getElementById('tools'), hint = document.getElementById('hint');
  var toast = document.getElementById('toast'), who = document.getElementById('who');
  var btns = [].slice.call(document.querySelectorAll('.seg button'));
  var HINTS = {
    'inbox.html': 'Three emails reached the staff list. Open one to see what Memo Check sent the model, what came back, and which queue rows it became.',
    'digest.html': 'The email the hourly check sent for each memo with something new in it. Its Review buttons open the queue on that row.',
    'queue.html': '<b>Set up &amp; approve</b> the Wednesday chapel swap, press <b>Make the Eagle Eye clicks</b>, then <b>Run the hourly check</b>: the row moves to Applied by itself. Deny the Friday in-service; the correction moved it to Monday.'
  };
  function say(t) { toast.textContent = t; clearTimeout(say.t); say.t = setTimeout(function () { toast.textContent = ''; }, 6000); }
  function demo() { try { return frame.contentWindow.MEMO_DEMO || null; } catch (e) { return null; } }
  function activate(src) {
    var page = src.split('?')[0].split('#')[0];
    btns.forEach(function (b) { var on = b.getAttribute('data-src') === page; b.classList.toggle('active', on); b.setAttribute('aria-selected', on ? 'true' : 'false'); });
    tools.classList.toggle('show', page === 'queue.html');
    hint.innerHTML = HINTS[page] || '';
    frame.src = src;
  }
  window.memoOpen = activate;
  btns.forEach(function (b) { b.addEventListener('click', function () { activate(b.getAttribute('data-src')); }); });
  activate('queue.html');

  function refreshTools() {
    var d = demo(), n = d ? d.approved() : 0;
    var c = document.getElementById('clicks');
    c.disabled = !n; c.textContent = '🖱 Make the Eagle Eye clicks' + (n ? ' (' + n + ' approved)' : '');
    if (d) who.value = d.user();
  }
  frame.addEventListener('load', refreshTools);
  who.addEventListener('change', function () { var d = demo(); if (d) d.setUser(who.value); frame.src = frame.src; });
  document.getElementById('clicks').addEventListener('click', function () {
    var d = demo(); if (!d) return;
    var made = d.makeClicks();
    say(made.length ? 'Eagle Eye: ' + made.length + ' change' + (made.length === 1 ? '' : 's') + ' made. Memo Check has not looked yet.' : 'Nothing approved to apply.');
    refreshTools();
  });
  document.getElementById('tick').addEventListener('click', function () {
    var d = demo(); if (!d) return;
    var applied = d.runTick();
    say(applied.length ? 'Hourly check: ' + applied.length + ' row' + (applied.length === 1 ? '' : 's') + ' found in the plan, marked applied.' : 'Hourly check: no new mail, and nothing approved shows in the plan yet.');
    frame.src = frame.src;
  });
  document.getElementById('reset').addEventListener('click', function () {
    var d = demo(); if (d) d.reset(); else try { sessionStorage.removeItem('memo-demo-state-v1'); sessionStorage.removeItem('memo-demo-user'); } catch (e) {}
    say('Sample history replayed.');
    activate('queue.html');
  });
</script>
</body>
</html>
