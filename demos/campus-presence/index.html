<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Campus Presence — Showcase demo</title>
<style>
  :root { --maroon:#8f1b1b; --maroon-hi:#B22222; --gold:#D4AF37; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { display: flex; flex-direction: column; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: #f6f7f9; }
  .bar {
    flex: none; display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
    padding: 10px 16px; color: #fff;
    background: linear-gradient(120deg, #6d1414 0%, #8f1b1b 55%, #B22222 100%);
    box-shadow: 0 4px 14px rgba(0,0,0,.35); z-index: 2;
  }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 1.05rem; }
  .brand .logo { font-size: 1.5rem; }
  .brand small { display: block; font-weight: 600; font-size: .72rem; opacity: .85; }
  .seg { display: inline-flex; background: rgba(255,255,255,.14); border: 1px solid rgba(255,255,255,.25); border-radius: 999px; padding: 4px; gap: 2px; flex-wrap: wrap; }
  .seg button {
    border: 0; cursor: pointer; font: inherit; font-weight: 700; font-size: .86rem;
    color: #fff; background: transparent; padding: 8px 13px; border-radius: 999px;
    display: inline-flex; align-items: center; gap: 6px; transition: background .12s;
  }
  .seg button:hover { background: rgba(255,255,255,.16); }
  .seg button.active { background: var(--gold); color: #3a2b00; }
  .seg .rule { width: 1px; align-self: stretch; margin: 2px 5px; background: rgba(255,255,255,.28); }
  .spacer { flex: 1; }
  .hint { font-size: .78rem; opacity: .82; max-width: 27rem; line-height: 1.35; }
  .back { color: #fff; text-decoration: none; font-weight: 700; font-size: .86rem; opacity: .9; border: 1px solid rgba(255,255,255,.3); padding: 7px 12px; border-radius: 999px; }
  .back:hover { background: rgba(255,255,255,.12); }
  .stage { flex: 1; position: relative; background: #f6f7f9; }
  .stage iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; display: block; background: #f6f7f9; }
  @media (max-width: 980px) { .brand small, .hint { display: none; } .seg button { padding: 8px 10px; font-size: .8rem; } }
</style>
</head>
<body>
  <div class="bar">
    <div class="brand">
      <span class="logo" aria-hidden="true">🪪</span>
      <span>Campus Presence<small>Sign-in / sign-out &amp; live who-is-on-campus</small></span>
    </div>
    <div class="seg" role="tablist" aria-label="Choose a screen">
      <button data-src="kiosk.html" aria-selected="false">🪪 Kiosk &middot; HS</button>
      <button data-src="kiosk.html?station=el" aria-selected="false">🎒 Kiosk &middot; EL</button>
      <span class="rule" aria-hidden="true"></span>
      <button data-src="board.html" class="active" aria-selected="true">📋 Live Board</button>
      <button data-src="muster.html" aria-selected="false">🧯 Muster</button>
      <button data-src="metrics.html" aria-selected="false">📈 Metrics</button>
    </div>
    <span class="spacer"></span>
    <span class="hint">Two anonymous iPads at the entrances, three staff screens behind the
      desk &mdash; one event log. Sign someone out at a kiosk, then open the board.</span>
    <a class="back" href="../../index.html" target="_top">← Gallery</a>
  </div>
  <div class="stage">
    <iframe id="screen" src="board.html" title="Campus Presence screen"></iframe>
  </div>
<script>
  // One system, five surfaces — swap the framed screen in place. The two kiosk buttons load the
  // SAME built page with different ?station= values, exactly as the two iPads do in production.
  var frame = document.getElementById('screen');
  var btns = [].slice.call(document.querySelectorAll('.seg button'));

  function activate(btn) {
    btns.forEach(function (x) { x.classList.remove('active'); x.setAttribute('aria-selected', 'false'); });
    btn.classList.add('active');
    btn.setAttribute('aria-selected', 'true');
  }

  btns.forEach(function (b) {
    b.addEventListener('click', function () {
      activate(b);
      frame.src = b.getAttribute('data-src');
    });
  });

  // The staff pages keep their own working Board / Muster / Metrics nav, so a click in there
  // navigates the frame without going through these buttons. Re-sync the highlight when we are
  // allowed to read the frame's location; from a file:// page the browser treats the frame as a
  // separate origin and refuses, in which case the buttons simply stay as they were.
  frame.addEventListener('load', function () {
    var here = '';
    try { here = frame.contentWindow.location.href; } catch (e) { return; }
    var match = null;
    btns.forEach(function (b) {
      var src = b.getAttribute('data-src');
      if (here.indexOf(src) !== -1 && (!match || src.length > match.getAttribute('data-src').length)) match = b;
    });
    if (match) activate(match);
  });
</script>
</body>
</html>
