<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>MACS Fine Arts — Showcase demo</title>
<style>
  :root { --maroon:#8f1b1b; --maroon-hi:#B22222; --gold:#D4AF37; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { display: flex; flex-direction: column; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: #f6f7f9; }
  .bar {
    flex: none; display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
    padding: 10px 16px; color: #fff;
    background: linear-gradient(120deg, #6d1414 0%, #8f1b1b 55%, #B22222 100%);
    box-shadow: 0 4px 14px rgba(0,0,0,.35); z-index: 2;
  }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 1.05rem; }
  .brand .logo { font-size: 1.5rem; }
  .brand small { display: block; font-weight: 600; font-size: .72rem; opacity: .85; }
  .seg { display: inline-flex; background: rgba(255,255,255,.14); border: 1px solid rgba(255,255,255,.25); border-radius: 999px; padding: 4px; gap: 2px; flex-wrap: wrap; }
  .seg button {
    border: 0; cursor: pointer; font: inherit; font-weight: 700; font-size: .86rem;
    color: #fff; background: transparent; padding: 8px 13px; border-radius: 999px;
    display: inline-flex; align-items: center; gap: 6px; transition: background .12s;
  }
  .seg button:hover { background: rgba(255,255,255,.16); }
  .seg button.active { background: var(--gold); color: #3a2b00; }
  .spacer { flex: 1; }
  .hint { font-size: .78rem; opacity: .85; max-width: 28rem; line-height: 1.35; }
  .hint code { background: rgba(255,255,255,.18); padding: 1px 6px; border-radius: 6px; font-weight: 800; }
  .outbox { font-size: .78rem; font-weight: 700; background: rgba(255,255,255,.14); border: 1px solid rgba(255,255,255,.25); border-radius: 999px; padding: 6px 11px; white-space: nowrap; max-width: 24rem; overflow: hidden; text-overflow: ellipsis; }
  .outbox:empty { display: none; }
  .back, .reset { color: #fff; text-decoration: none; font-weight: 700; font-size: .86rem; opacity: .9; border: 1px solid rgba(255,255,255,.3); padding: 7px 12px; border-radius: 999px; background: none; cursor: pointer; font-family: inherit; }
  .back:hover, .reset:hover { background: rgba(255,255,255,.12); }
  .stage { flex: 1; position: relative; }
  .stage iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; display: block; background: #f6f7f9; }
  @media (max-width: 1180px) { .hint { display: none; } }
  @media (max-width: 980px) { .brand small { display: none; } .seg button { padding: 8px 10px; font-size: .8rem; } }
</style>
</head>
<body>
  <div class="bar">
    <div class="brand">
      <span class="logo" aria-hidden="true">🎭</span>
      <span>MACS Fine Arts<small>Multi-school competition registration &middot; one signed-in submission per school</small></span>
    </div>
    <div class="seg" role="tablist" aria-label="Choose a screen">
      <button data-src="form.html" class="active" aria-selected="true">📝 School registration</button>
      <button data-src="admin.html" aria-selected="false">🗂️ Competition admin</button>
      <button data-src="spelling-bee.html" aria-selected="false">🐝 Spelling Bee</button>
      <button data-src="creative-writing.html" aria-selected="false">✍️ Creative Writing</button>
    </div>
    <span class="spacer"></span>
    <span class="hint" id="hint">Pick <b>Riverbend Baptist School</b>, any email, and the one-time code <code>123456</code>
      (it lands in the outbox here instead of an inbox). Add a few entries, submit, then open the admin screen&rsquo;s
      <b>Submissions</b> tab.</span>
    <span class="outbox" id="outbox" title="What the app would have emailed this visit"></span>
    <button class="reset" id="reset" type="button" title="Forget this visit's sign-in, draft and submissions">↻ Reset</button>
    <a class="back" href="../../index.html" target="_top">← Gallery</a>
  </div>
  <div class="stage">
    <iframe id="screen" src="form.html" title="MACS Fine Arts screen"></iframe>
  </div>
<script>
  // One Apps Script project, two deployments in production: the anonymous registration form (schools verify
  // by emailed code) and the admin console behind a Google sign-in allowlist. Both read one Sheet; the demo's
  // in-memory copy lives in sessionStorage so a submission on the form shows on the admin page.
  // The Spelling Bee and Creative Writing forms are two more, smaller projects, each with its own Sheet and no
  // admin web app; each keeps its own sessionStorage copy.
  var frame = document.getElementById('screen');
  var hint = document.getElementById('hint');
  var btns = [].slice.call(document.querySelectorAll('.seg button'));
  var HINTS = {
    'form.html': 'Pick <b>Riverbend Baptist School</b>, any email, and the one-time code <code>123456</code> (it lands in the outbox here instead of an inbox). Add a few entries, submit, then open the admin screen&rsquo;s <b>Submissions</b> tab.',
    'admin.html': 'Setup tabs edit what the form shows; <b>Submissions</b> is every entry with its auto cross-references; <b>Run Actions</b> seeds a sample school, clears it, and archives the year.',
    'spelling-bee.html': 'Its own small project and Sheet, no sign-in. Pick a school and a sponsor, choose how many students per grade group, name them, submit. <b>Chesapeake</b> and <b>Pine Ridge</b> have already registered, so the one-time rule refuses them. There is no admin screen; staff read the Sheet.',
    'creative-writing.html': 'Pick a school, tick the rules box and a level, then on that level&rsquo;s tab tick a category and upload a PDF for the entry and its judging sheet (any PDF, or this <a href="sample.pdf" download style="color:#fff">sample</a>). Submit from the <b>Payment</b> tab. <b>Harbor Light</b> has already registered.'
  };
  function activate(btn) {
    btns.forEach(function (x) { x.classList.remove('active'); x.setAttribute('aria-selected', 'false'); });
    btn.classList.add('active'); btn.setAttribute('aria-selected', 'true');
    var src = btn.getAttribute('data-src');
    hint.innerHTML = HINTS[src];
    frame.src = src;
  }
  btns.forEach(function (btn) { btn.addEventListener('click', function () { activate(btn); }); });

  document.getElementById('reset').addEventListener('click', function () {
    try { ['macs-demo-workbook-v1', 'macs-demo-outbox', 'macs-demo-spelling-v1', 'macs-demo-writing-v1'].forEach(function (k) { sessionStorage.removeItem(k); }); } catch (e) {}
    try { localStorage.removeItem('macsFormDraft_v1'); } catch (e) {}
    frame.src = frame.src.split('#')[0];
  });

  // The emails the app would have sent — the sign-in code is the useful one.
  var outbox = document.getElementById('outbox');
  setInterval(function () {
    var list = [];
    try { list = JSON.parse(sessionStorage.getItem('macs-demo-outbox') || '[]'); } catch (e) {}
    if (!list.length) { outbox.textContent = ''; return; }
    var last = list[list.length - 1];
    var code = /code for .* is (\d{6})/.exec(last.body || '');
    outbox.textContent = '✉ ' + list.length + (list.length === 1 ? ' email' : ' emails') + ' · last to ' + last.to + (code ? ' · code ' + code[1] : '');
  }, 800);
</script>
</body>
</html>
