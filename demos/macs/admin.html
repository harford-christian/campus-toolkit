<!DOCTYPE html>
<html>
<head>
  <base target="_self">
  <script src="logic.js"></script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MACS Scheduling — Admin</title>
  <style>
    :root {
      --md-red: #c8102e;
      --md-red-deep: #8c0a1f;
      --md-cream: #f2ead9;
      --danger: #7a1220;
      --bg: #2b2b2d;
      --surface: #ffffff;
      --border: #ecdfd8;
      --text: #241414;
      --text-muted: #7a6a63;
    }
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background: var(--bg); color: var(--text); margin: 0; padding: 0; line-height: 1.5; font-size: 15px;
    }
    .page {
      background: var(--surface); min-height: 100vh;
      display: grid; grid-template-columns: 236px 1fr;
    }

    .sidebar {
      background: var(--bg); color: #f2ead9; padding: 22px 16px; display: flex; flex-direction: column;
      gap: 20px; position: sticky; top: 0; height: 100vh; overflow-y: auto;
    }
    .masthead { display: flex; align-items: center; gap: 12px; padding: 0 4px 16px; border-bottom: 1px solid rgba(242,234,217,.14); }
    .crest { width: 40px; height: auto; flex-shrink: 0; border-radius: 7px; box-shadow: 0 4px 12px rgba(0,0,0,.3); }
    .masthead-title h1 { font-size: 15.5px; margin: 0; color: #fff; font-weight: 800; line-height: 1.25; }
    .masthead-title p { margin: 4px 0 0; font-size: 10.5px; color: #b3a49b; font-weight: 500; line-height: 1.4; }

    .navgroup-label {
      font-size: 10.5px; text-transform: uppercase; letter-spacing: .08em; color: #9c8f89; padding: 0 8px 5px;
    }
    .navgroup { display: flex; flex-direction: column; gap: 1px; }
    .tab-btn {
      position: relative;
      background: transparent; color: #f2ead9; border: none; padding: 9px 26px 9px 10px; font-size: 13.5px; font-weight: 600;
      letter-spacing: 0; text-transform: none; text-align: left; cursor: pointer; white-space: nowrap;
      border-radius: 7px; transition: background .15s; opacity: .85; width: 100%;
    }
    .tab-btn:hover { background: rgba(242,234,217,.08); opacity: 1; }
    .tab-btn.active { background: var(--md-red); color: #fff; opacity: 1; }
    .dirty-badge {
      position: absolute; top: 6px; right: 8px; width: 16px; height: 16px; border-radius: 50%;
      background: #f2b90c; color: #241414; font-size: 11px; font-weight: 800; line-height: 16px;
      text-align: center;
    }
    .unsaved-banner {
      display: none; align-items: center; gap: 8px; background: #fdf3e2; color: #8a5a00;
      border: 1px solid #f2b90c; border-radius: 8px; padding: 9px 14px; font-size: 13.5px; font-weight: 600;
      margin: 0 0 16px;
    }
    .unsaved-banner.show { display: flex; }

    .main { padding: 26px 34px 60px; min-width: 0; }
    .tab-panel { display: none; }
    .tab-panel.active { display: block; }

    .panel-intro { font-size: 14.5px; color: var(--text-muted); margin: 0 0 16px; max-width: 820px; }

    .toolbar { display: flex; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; align-items: center; }
    button { cursor: pointer; border: none; border-radius: 9px; padding: 12px 20px; font-size: 14.5px; font-weight: 700; }
    .btn-primary { background: var(--md-red); color: #fff; }
    .btn-primary:hover { background: var(--md-red-deep); }
    .btn-accent { background: #1f7a3d; color: #fff; }
    .btn-accent:hover { background: #16612e; }
    .btn-secondary { background: #fff; color: var(--md-red-deep); border: 1px solid var(--border); }
    .btn-secondary:hover { background: #fdf1ee; }
    button:disabled { opacity: .55; cursor: not-allowed; }

    /* ---- Search + sort ---- */
    .search-bar input {
      padding: 11px 16px; font-size: 15px; border: 2px solid var(--border); border-radius: 999px; background: #fff; width: 280px;
    }
    .search-bar input:focus { outline: none; border-color: var(--md-red); box-shadow: 0 0 0 3px rgba(200,16,46,.15); }
    .sort-bar { display: flex; align-items: center; gap: 9px; }
    .sort-bar .sort-label { font-size: 12.5px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: .04em; }
    .sort-bar select {
      padding: 10px 12px; font-size: 15px; border: 2px solid var(--border); border-radius: 9px; background: #fff; color: var(--text);
    }
    .sort-bar button { padding: 10px 14px; font-size: 13.5px; }

    /* ---- Row-list layout (replaces spreadsheet-style tables AND field-grid cards) ---- */
    .row-scroll { overflow-x: auto; padding: 4px 4px 8px; }
    .row-list { display: flex; flex-direction: column; gap: 10px; max-height: 64vh; overflow-y: auto; min-width: fit-content; }
    .row-head {
      display: grid; align-items: center; gap: 16px; padding: 0 18px 4px; min-width: fit-content;
      font-size: 11.5px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: .04em;
    }
    .row-head span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .data-row {
      display: grid; align-items: center; gap: 16px; border: 1px solid var(--border); border-radius: 12px;
      padding: 14px 18px; background: #fffdfb; box-shadow: 0 2px 8px rgba(140,10,31,.06); font-size: 16px;
      transition: box-shadow .15s, opacity .15s;
    }
    .data-row:hover { box-shadow: 0 4px 14px rgba(140,10,31,.12); }
    .data-row.deleted { opacity: .4; }
    .data-row input[type=text], .data-row select {
      width: 100%; padding: 10px 12px; border: 2px solid var(--border); border-radius: 9px; font-size: 16px;
      background: #fff; color: var(--text);
    }
    .data-row input[type=text]:focus, .data-row select:focus { outline: none; border-color: var(--md-red); box-shadow: 0 0 0 3px rgba(200,16,46,.15); }
    .data-row .static-cell { color: var(--text-muted); font-size: 15.5px; }
    .data-row .name-cell { font-weight: 700; }

    .row-remove {
      width: 30px; height: 30px; border-radius: 50%; border: 1px solid var(--border); background: #fff; color: var(--danger);
      font-size: 16px; line-height: 1; padding: 0; display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    .row-remove:hover { background: #fdeceb; border-color: var(--danger); }

    /* Registrations tab: bumped up further than the row-list default */
    #panel-registrations .data-row { font-size: 18px; padding: 16px 18px; }
    #panel-registrations .static-cell { font-size: 17px; }
    #panel-registrations .name-cell { font-size: 18px; }
    #panel-registrations .row-head { font-size: 13px; }

    /* Boolean toggle pill */
    .toggle-pill { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; user-select: none; }
    .toggle-pill input { position: absolute; opacity: 0; width: 0; height: 0; }
    .toggle-pill .pill {
      width: 42px; height: 24px; border-radius: 999px; background: #e5dcd6; position: relative; transition: background .15s; flex-shrink: 0;
    }
    .toggle-pill .pill::after {
      content: ''; position: absolute; top: 2px; left: 2px; width: 20px; height: 20px; border-radius: 50%;
      background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.3); transition: transform .15s;
    }
    .toggle-pill input:checked + .pill { background: var(--md-red); }
    .toggle-pill input:checked + .pill::after { transform: translateX(18px); }
    .toggle-pill .pill-label { font-size: 13px; font-weight: 600; color: var(--text-muted); white-space: nowrap; }

    /* Color swatch picker, used on the Schools tab */
    .data-row input[type=color] {
      width: 44px; height: 34px; padding: 0; border: 2px solid var(--border); border-radius: 8px; cursor: pointer; background: none;
    }

    /* Save-status chips */
    .status-chip { display: inline-flex; align-items: center; gap: 7px; font-size: 13.5px; font-weight: 700; padding: 6px 13px; border-radius: 999px; }
    .status-chip:empty { display: none; }
    .status-chip.saving { background: #f6dde1; color: var(--md-red-deep); }
    .status-chip.success { background: #e3f6e9; color: #15803d; }
    .status-chip.error { background: #fdeceb; color: var(--danger); }
    .spinner {
      width: 12px; height: 12px; border: 2px solid rgba(0,0,0,.15); border-top-color: currentColor;
      border-radius: 50%; animation: spin .6s linear infinite; flex-shrink: 0;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    button.running .btn-spinner { display: inline-block; margin-right: 7px; }
    .btn-spinner { display: none; }

    .action-grid { display: flex; flex-direction: column; gap: 12px; max-width: 700px; }
    .action-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }

    .rollover-card { max-width: 700px; margin: 0 0 28px; padding: 16px 18px; border: 1px solid var(--border); border-left: 4px solid var(--md-red); border-radius: 8px; background: #fdf1ee; }
    .rollover-card h3 { margin: 0 0 6px; font-size: 16px; }
    .rollover-card p { margin: 0 0 12px; font-size: 14px; color: var(--text-muted); }
    .rollover-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .rollover-row input[type=text] { font-size: 14px; padding: 8px 10px; border: 1px solid var(--border); border-radius: 6px; width: 100px; }

    .empty-state { color: var(--text-muted); font-size: 14.5px; font-style: italic; padding: 18px 6px; }

    /* ---- Field Templates (editor + preview, not a row-list) ---- */
    .template-card {
      border: 1px solid var(--border); border-radius: 12px; padding: 16px; background: #fffdfb;
      box-shadow: 0 2px 8px rgba(140,10,31,.06);
    }
    .template-card.selected { box-shadow: 0 0 0 2px var(--md-red), 0 4px 14px rgba(140,10,31,.12); }

    /* ---- Debug log: catches anything that fails silently, visible without opening devtools ---- */
    #debug-toggle {
      position: fixed; bottom: 16px; right: 16px; z-index: 1000; background: #2b2b2d; color: #fff;
      border: 1px solid #514e49; border-radius: 999px; padding: 10px 16px; font-size: 12.5px; font-weight: 700;
      box-shadow: 0 4px 14px rgba(0,0,0,.3);
    }
    #debug-toggle.has-errors { background: var(--danger); border-color: var(--danger); }
    #debug-panel {
      position: fixed; bottom: 60px; right: 16px; z-index: 1000; width: min(560px, 90vw); max-height: 50vh;
      background: #1c1c1d; color: #e8e2df; border: 1px solid #514e49; border-radius: 10px; padding: 12px;
      display: none; flex-direction: column; gap: 8px; box-shadow: 0 12px 30px rgba(0,0,0,.4);
    }
    #debug-panel.open { display: flex; }
    #debug-panel .debug-head { display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: #b8a9a2; }
    #debug-panel pre {
      margin: 0; font-size: 11.5px; line-height: 1.5; white-space: pre-wrap; word-break: break-word;
      overflow-y: auto; max-height: 40vh; font-family: ui-monospace, Menlo, monospace;
    }
    #debug-panel button { padding: 6px 10px; font-size: 11.5px; }
  </style>

<script>window.DEMO_META = { name: "MACS Fine Arts" };</script>

<body>
  <div class="page">
    <div class="sidebar">
    <div class="masthead">
      <img class="crest" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%23c8102e'/%3E%3Ccircle cx='32' cy='32' r='24' fill='none' stroke='white' stroke-width='2'/%3E%3Ctext x='32' y='38' font-family='Inter,Arial,sans-serif' font-size='15' font-weight='800' fill='white' text-anchor='middle'%3EMACS%3C/text%3E%3C/svg%3E" alt="MACS logo">
      <div class="masthead-title">
        <h1>MACS Scheduling</h1>
        <p>Admin — changes save to the Sheet when you click Save.</p>
      </div>
    </div>

    <div id="tabs"></div>
    </div>

    <div class="main">
      <div class="unsaved-banner" id="unsaved-banner">⚠ Unsaved changes on this tab — click Save Changes before switching away or closing the page.</div>
      <div id="panels"></div>
    </div>
  </div>

  <button id="debug-toggle" type="button">Debug Log</button>
  <div id="debug-panel">
    <div class="debug-head">
      <span>Debug log — if a tab won't populate, screenshot this</span>
      <span>
        <button class="btn-secondary" id="debug-copy" type="button">Copy</button>
        <button class="btn-secondary" id="debug-clear" type="button">Clear</button>
      </span>
    </div>
    <pre id="debug-log"></pre>
  </div>

  <script>
    var TABS = [
      { id: 'catConfig', label: 'Category Config', build: function (c) { buildCategoriesPanel(c); } },
      { id: 'fieldTemplates', label: 'Field Templates', build: function (c) { buildFieldTemplatesPanel(c); } },
      { id: 'buildings', label: 'Building Map', build: function (c) { buildBuildingsPanel(c); } },
      { id: 'judgingSheets', label: 'Judging Sheets', build: function (c) { buildJudgingSheetsPanel(c); } },
      { id: 'settings', label: 'Settings', build: function (c) { buildSettingsPanel(c); } },
      { id: 'judges', label: 'Judges', build: function (c) { buildJudgesPanel(c); } },
      { id: 'schools', label: 'Schools', build: function (c) { buildSchoolsPanel(c); } },
      { id: 'registrations', label: 'Registrations', build: function (c) { buildRegistrationsPanel(c); } },
      { id: 'submissions', label: 'Submissions', build: function (c) { buildSubmissionsPanel(c); } },
      { id: 'actions', label: 'Run Actions', build: function (c) { buildActionsPanel(c); } }
    ];

    var NAV_GROUPS = [
      { label: 'Setup', ids: ['catConfig', 'fieldTemplates', 'buildings', 'judgingSheets', 'settings'] },
      { label: 'Schools & People', ids: ['schools', 'judges'] },
      { label: 'Competition Data', ids: ['registrations', 'submissions'] },
      { label: 'Actions', ids: ['actions'] }
    ];

    // ---- Debug log: on-page record of anything that fails, since a school
    // admin can't easily be walked through opening devtools over the phone.
    var DEBUG_LOG = [];
    function logDebug(msg, isError) {
      var line = '[' + new Date().toLocaleTimeString() + '] ' + msg;
      DEBUG_LOG.push(line);
      var pre = document.getElementById('debug-log');
      if (pre) pre.textContent = DEBUG_LOG.join('\n');
      if (isError) {
        var toggle = document.getElementById('debug-toggle');
        if (toggle) toggle.classList.add('has-errors');
        console.error(msg);
      } else {
        console.log(msg);
      }
    }
    window.onerror = function (message, source, lineno, colno, error) {
      logDebug('UNCAUGHT ERROR: ' + message + ' @ ' + (source || '?') + ':' + lineno + (error && error.stack ? '\n' + error.stack : ''), true);
    };
    window.addEventListener('unhandledrejection', function (ev) {
      var reason = ev.reason;
      logDebug('UNHANDLED PROMISE REJECTION: ' + (reason && reason.message ? reason.message : reason), true);
    });

    function setStatus(panelId, state, message) {
      var el = document.getElementById('status-' + panelId);
      if (!el) return;
      if (el._fadeTimer) { clearTimeout(el._fadeTimer); el._fadeTimer = null; }
      if (!state) { el.className = 'status-chip'; el.innerHTML = ''; return; }
      var icon = state === 'saving' ? '<span class="spinner"></span>' : state === 'success' ? '✓' : '✗';
      el.className = 'status-chip ' + state;
      el.innerHTML = icon + '<span>' + message + '</span>';
      if (state === 'success') {
        el._fadeTimer = setTimeout(function () { el.className = 'status-chip'; el.innerHTML = ''; }, 2500);
      }
    }

    // Wraps a load-success callback so a client-side rendering bug shows up
    // as an error chip instead of silently leaving the panel blank.
    function safeRender(panelId, fn) {
      return function (result) {
        logDebug(panelId + ': load succeeded, ' + (result ? (result.length != null ? result.length + ' row(s)' : 'result received') : 'result is ' + result));
        try {
          fn(result);
        } catch (e) {
          logDebug(panelId + ': RENDER THREW: ' + e.message + (e.stack ? '\n' + e.stack : ''), true);
          setStatus(panelId, 'error', 'Render error: ' + e.message);
        }
      };
    }

    function switchTab(id) {
      document.querySelectorAll('.tab-btn').forEach(function (b) { b.classList.toggle('active', b.dataset.tab === id); });
      document.querySelectorAll('.tab-panel').forEach(function (p) { p.classList.toggle('active', p.id === 'panel-' + id); });
      var banner = document.getElementById('unsaved-banner');
      if (banner) banner.classList.toggle('show', !!DIRTY_PANELS[id]);
    }

    // ---- Unsaved-changes tracking: a red badge on the tab + a banner on the active panel,
    // plus a confirm-before-leaving prompt — so an edit made but not Saved isn't silently lost.
    var DIRTY_PANELS = {};
    function markPanelDirty(panelId) {
      if (DIRTY_PANELS[panelId]) return;
      DIRTY_PANELS[panelId] = true;
      updateDirtyUi(panelId);
    }
    function markPanelClean(panelId) {
      if (!DIRTY_PANELS[panelId]) return;
      delete DIRTY_PANELS[panelId];
      updateDirtyUi(panelId);
    }
    function updateDirtyUi(panelId) {
      var btn = document.querySelector('.tab-btn[data-tab="' + panelId + '"]');
      if (btn) {
        var badge = btn.querySelector('.dirty-badge');
        if (DIRTY_PANELS[panelId]) {
          if (!badge) {
            badge = document.createElement('span');
            badge.className = 'dirty-badge';
            badge.textContent = '!';
            badge.title = 'Unsaved changes';
            btn.appendChild(badge);
          }
        } else if (badge) {
          badge.remove();
        }
      }
      if (btn && btn.classList.contains('active')) {
        var banner = document.getElementById('unsaved-banner');
        if (banner) banner.classList.toggle('show', !!DIRTY_PANELS[panelId]);
      }
    }
    // Wires generic dirty-tracking onto one panel: any edit inside its row-list/card-grid
    // marks it dirty; the status chip flipping to "success" (set by every panel's own
    // Save handler) marks it clean again — no per-panel code needed for either.
    function watchPanelForUnsavedChanges(panelId, panelEl) {
      function isEdit(ev) { return !ev.target.closest('.search-bar, .sort-bar'); }
      panelEl.addEventListener('input', function (ev) { if (isEdit(ev)) markPanelDirty(panelId); });
      panelEl.addEventListener('change', function (ev) { if (isEdit(ev)) markPanelDirty(panelId); });
      panelEl.addEventListener('click', function (ev) {
        if (ev.target.closest('[data-action^="add"]') || ev.target.closest('.row-remove')) markPanelDirty(panelId);
      });
      var statusEl = panelEl.querySelector('.status-chip');
      if (statusEl) {
        new MutationObserver(function () {
          if (statusEl.classList.contains('success')) markPanelClean(panelId);
        }).observe(statusEl, { attributes: true, attributeFilter: ['class'] });
      }
    }
    window.addEventListener('beforeunload', function (ev) {
      if (Object.keys(DIRTY_PANELS).length) { ev.preventDefault(); ev.returnValue = ''; }
    });

    function init() {
      var tabsEl = document.getElementById('tabs');
      var panelsEl = document.getElementById('panels');
      var byId = {};
      TABS.forEach(function (t) { byId[t.id] = t; });
      var firstId = TABS[0] && TABS[0].id;

      NAV_GROUPS.forEach(function (group) {
        var label = document.createElement('div');
        label.className = 'navgroup-label';
        label.textContent = group.label;
        tabsEl.appendChild(label);

        var wrap = document.createElement('div');
        wrap.className = 'navgroup';
        group.ids.forEach(function (id) {
          var t = byId[id];
          if (!t) return;
          var btn = document.createElement('button');
          btn.className = 'tab-btn' + (id === firstId ? ' active' : '');
          btn.dataset.tab = t.id;
          btn.textContent = t.label;
          btn.onclick = function () { switchTab(t.id); };
          wrap.appendChild(btn);
        });
        tabsEl.appendChild(wrap);
      });

      TABS.forEach(function (t, i) {
        var panel = document.createElement('div');
        panel.className = 'tab-panel' + (i === 0 ? ' active' : '');
        panel.id = 'panel-' + t.id;
        panelsEl.appendChild(panel);
      });
      TABS.forEach(function (t) {
        var panel = document.getElementById('panel-' + t.id);
        t.build(panel);
        watchPanelForUnsavedChanges(t.id, panel);
      });
    }

    function buildBuildingsPanel(c) {
      buildCardPanel(c, {
        panelId: 'buildings', getter: 'admin_getBuildingMap', setter: 'admin_saveBuildingMap',
        introText: 'Tell us which building each room is in. If a student has two events in different buildings back-to-back, the scheduler automatically gives them extra time to walk over.',
        addLabel: '+ Add Room',
        fields: [
          { key: 'room', label: 'Room' },
          { key: 'building', label: 'Building', datalist: true }
        ]
      });
    }

    // Settings stores times as 24hr "HH:mm" — the admin UI shows/edits them as 12hr
    // ("8:30 AM") and converts back on save. Non-time values pass through unchanged.
    function timeTo12Hour_(v) {
      var s = (v == null ? '' : String(v)).trim();
      var m = /^([01]?\d|2[0-3]):([0-5]\d)$/.exec(s);
      if (!m) return v;
      var h = parseInt(m[1], 10);
      var ampm = h >= 12 ? 'PM' : 'AM';
      var h12 = h % 12; if (h12 === 0) h12 = 12;
      return h12 + ':' + m[2] + ' ' + ampm;
    }
    function timeTo24Hour_(v) {
      var s = (v == null ? '' : String(v)).trim();
      var m = /^(\d{1,2}):([0-5]\d)\s*([AaPp][Mm])$/.exec(s);
      if (!m) return v;
      var h = parseInt(m[1], 10) % 12;
      if (/pm/i.test(m[3])) h += 12;
      return (h < 10 ? '0' : '') + h + ':' + m[2];
    }

    // ---- Settings: rows, but the Setting name itself is fixed once it exists on the sheet — only Value is editable ----
    function buildSettingsPanel(container) {
      var columns = [
        { key: 'key', label: 'Setting', width: 'minmax(300px, 1.4fr)' },
        { key: 'value', label: 'Value', width: 'minmax(220px, 1fr)' }
      ];
      panelChrome(container, 'settings',
        'Day/lunch/ceremony times, travel buffer, gym closure — read by the scheduler on every run. ' +
        'Existing setting names are fixed; only the value can be changed. Use + Add Setting to introduce a brand-new one.',
        '+ Add Setting');
      var list = document.getElementById('list-settings');
      var toolbar = document.getElementById('toolbar-settings');
      renderRowHead('settings', columns, ['44px']);

      function addRow(data) {
        var row = document.createElement('div');
        row.className = 'data-row';

    // Fills a <datalist> with the distinct, non-empty values of `key` across `rows` —
    // used to suggest previously-typed values (room names, sections, judge names, …)
    // without forcing the field into a rigid dropdown.
    function populateDatalist(id, rows, key) {
      var dl = document.getElementById(id);
      if (!dl) return;
      var seen = {}, vals = [];
      rows.forEach(function (r) {
        var v = (r[key] || '').toString().trim();
        if (v && !seen[v]) { seen[v] = true; vals.push(v); }
      });
      vals.sort();
      dl.innerHTML = vals.map(function (v) { return '<option value="' + v.replace(/"/g, '&quot;') + '">'; }).join('');
    }

    function gridTemplate(columns, extraWidths) {
      var widths = columns.map(function (c) { return c.width; });
      if (extraWidths) widths = widths.concat(extraWidths);
      return 'grid-template-columns:' + widths.join(' ') + ';';
    }

    function renderRowHead(panelId, columns, extraWidths, extraLabels) {
      var head = document.getElementById('rowhead-' + panelId);
      if (!head) return;
      head.style.cssText += gridTemplate(columns, extraWidths);
      var labels = columns.map(function (c) { return '<span>' + c.label + '</span>'; });
      (extraLabels || []).forEach(function (l) { labels.push('<span>' + l + '</span>'); });
      labels.push('<span></span>'); // remove-button column
      head.innerHTML = labels.join('');
    }

    // Generic filter+sort control. Sorting reorders .data-row children of
    // `list` by reading either a matching input[data-key] (editable panels)
    // or a row.dataset value (read-only panels like Registrations) for the
    // selected column. Filtering matches typed text against every sort
    // column plus any extraSearchKeys (dataset-only fields not offered as a
    // sort option, e.g. Submissions' Title).
    function attachSortBar(toolbarEl, list, columns, extraSearchKeys) {
      extraSearchKeys = extraSearchKeys || [];
      if (columns.length < 1) return;

      function getVal(row, key) {
        var el = row.querySelector('[data-key="' + key + '"]');
        if (el) return ((el.value != null ? el.value : el.textContent) || '').toString().toLowerCase();
        return (row.dataset[key] || '').toString().toLowerCase();
      }

      var searchWrap = document.createElement('div');
      searchWrap.className = 'search-bar';
      searchWrap.style.margin = '0 0 0 auto';
      var searchInput = document.createElement('input');
      searchInput.type = 'text';
      searchInput.placeholder = 'Filter…';
      searchWrap.appendChild(searchInput);

      var allSearchKeys = columns.map(function (c) { return c.key; }).concat(extraSearchKeys);
      function applyFilter() {
        var q = searchInput.value.trim().toLowerCase();
        var rows = Array.prototype.slice.call(list.querySelectorAll('.data-row'));
        var anyVisible = false;
        rows.forEach(function (row) {
          var text = allSearchKeys.map(function (k) { return getVal(row, k); }).join(' ');
          var match = !q || text.indexOf(q) !== -1;
          row.style.display = match ? '' : 'none';
          if (match) anyVisible = true;
        });
        var empty = list.querySelector('.empty-state.no-match');
        if (!anyVisible && q && rows.length) {
          if (!empty) {
            empty = document.createElement('div');
            empty.className = 'empty-state no-match';
            empty.textContent = 'Nothing matches "' + searchInput.value.trim() + '".';
            list.appendChild(empty);
          }
        } else if (empty) {
          empty.remove();
        }
      }
      searchInput.addEventListener('input', applyFilter);

      var wrap = document.createElement('div');
      wrap.className = 'sort-bar';
      var label = document.createElement('span');
      label.className = 'sort-label';
      label.textContent = 'Sort';
      var select = document.createElement('select');
      columns.forEach(function (c) {
        var o = document.createElement('option');
        o.value = c.key; o.textContent = c.label;
        select.appendChild(o);
      });
      var dirBtn = document.createElement('button');
      dirBtn.type = 'button';
      dirBtn.className = 'btn-secondary';
      var dir = 1;
      dirBtn.textContent = '↑ A–Z';

      function doSort() {
        var rows = Array.prototype.slice.call(list.querySelectorAll('.data-row'));
        rows.sort(function (a, b) {
          var av = getVal(a, select.value), bv = getVal(b, select.value);
          var an = parseFloat(av), bn = parseFloat(bv);
          var cmp;
          if (av !== '' && bv !== '' && !isNaN(an) && !isNaN(bn)) cmp = an - bn;
          else cmp = av < bv ? -1 : av > bv ? 1 : 0;
          return cmp * dir;
        });
        rows.forEach(function (r) { list.appendChild(r); });
      }
      select.addEventListener('change', doSort);
      dirBtn.onclick = function () { dir *= -1; dirBtn.textContent = dir === 1 ? '↑ A–Z' : '↓ Z–A'; doSort(); };

      wrap.appendChild(label);
      wrap.appendChild(select);
      wrap.appendChild(dirBtn);
      toolbarEl.appendChild(searchWrap);
      toolbarEl.appendChild(wrap);
      return doSort;
    }

    // ---- Category Config panel: one row per category name, with JH/SH Code as two columns ----
    // Everything about a category is shared between its Junior High and
    // Senior High versions EXCEPT the Code — so the row has one set of
    // shared fields, plus separate JH/SH code cells.
    var CATEGORY_BASIC_FIELDS = [
      { key: 'room', label: 'Default Room' },
      { key: 'maxPerSchool', label: 'Max Entries / School' }
    ];
    var CATEGORY_ADVANCED_FIELDS = [
      { key: 'durationSlots', label: 'Duration (15-min blocks)' },
      { key: 'fieldTemplate', label: 'Entry Form Style (advanced — must match a key on Field Templates)' }
    ];
    var CATEGORY_ADVANCED_FLAGS = [
      { key: 'isGroupRoster', label: 'Group Roster' },
      { key: 'roomRequired', label: 'Room Required' }
    ];
    var CATEGORY_LEVELS = ['Junior High', 'Senior High'];

    var CATEGORY_COLUMNS = [
      { key: 'name', label: 'Category Name', width: 'minmax(170px, 1.3fr)' },
      { key: 'section', label: 'Section', width: 'minmax(110px, 0.8fr)' },
      { key: 'room', label: 'Default Room', width: 'minmax(120px, 0.8fr)' },
      { key: 'maxPerSchool', label: 'Max / School', width: 'minmax(90px, 0.6fr)' },
      { key: 'durationSlots', label: 'Duration (15-min blocks)', width: 'minmax(110px, 0.7fr)' },
      { key: 'fieldTemplate', label: 'Entry Form Style', width: 'minmax(150px, 1fr)' },
      { key: 'judgingSheetName', label: 'Judging Sheet', width: 'minmax(150px, 1fr)' }
    ];
    var CATEGORY_EXTRA_WIDTHS = ['90px', '90px', '70px', '70px', '44px'];
    var CATEGORY_EXTRA_LABELS = ['JH Code', 'SH Code', 'Group Roster', 'Room Required'];
    // Same value for nearly every category — hidden behind "Show Advanced Fields" by default.
    var CATEGORY_ADVANCED_KEYS = ['maxPerSchool', 'durationSlots', 'fieldTemplate'];
    function categoryVisibleColumns(showAdvanced) {
      if (showAdvanced) return CATEGORY_COLUMNS;
      return CATEGORY_COLUMNS.filter(function (c) { return CATEGORY_ADVANCED_KEYS.indexOf(c.key) === -1; });
    }

    // Same category name -> one group with up to one row per level. A
    // category that only competes at one level (e.g. Extemporaneous
    // Speaking, Senior High only) ends up with just that level filled in.
    // Everything but Code/Level is expected to match between the two rows
    // of a group — the shared fields below are seeded from whichever row
    // is found first.
    function groupCategoryRows(rows) {
      var order = [], groups = {};
      rows.forEach(function (r) {
        var key = (r.name || '').trim() || ('(unnamed ' + (order.length + 1) + ')');
        if (!groups[key]) { groups[key] = { name: r.name || '', section: r.section || '', shared: r, codes: {} }; order.push(key); }
        var g = groups[key];
        if (!g.section && r.section) g.section = r.section;
        var level = CATEGORY_LEVELS.indexOf(r.level) !== -1 ? r.level : (/senior/i.test(r.level || '') ? 'Senior High' : 'Junior High');
        g.codes[level] = r.code || '';
      });
      return order.map(function (k) { return groups[k]; });
    }

    function buildCategoriesPanel(container) {
      container.innerHTML =
        '<p class="panel-intro">One row per category. Everything here applies to both Junior High and Senior High ' +
        'except the Code, which has its own column for each level. Judging Sheet takes the <em>name</em> of a sheet ' +
        'managed on the Judging Sheets tab.</p>' +
        '<div class="toolbar" id="toolbar-categories">' +
        '<button class="btn-primary" data-action="add">+ Add Category</button>' +
        '<button class="btn-accent" data-action="save">Save Changes</button>' +
        '<button class="btn-secondary" data-action="toggle-advanced">Show Advanced Fields</button>' +
        '<span class="status-chip" id="status-categories"></span>' +
        '</div>' +
        '<div class="row-scroll"><div class="row-head" id="rowhead-categories"></div>' +
        '<div class="row-list" id="list-categories"></div></div>' +
        '<datalist id="dl-categorySections"></datalist>' +
        '<datalist id="dl-categoryRooms"></datalist>' +
        '<datalist id="dl-judgingSheetNames"></datalist>';
      var list = document.getElementById('list-categories');
      var toolbar = document.getElementById('toolbar-categories');
      var showAdvanced = false;
      renderRowHead('categories', categoryVisibleColumns(showAdvanced), CATEGORY_EXTRA_WIDTHS, CATEGORY_EXTRA_LABELS);

      function addRow(group) {
        var row = document.createElement('div');
        row.className = 'data-row';
        row.style.cssText = gridTemplate(categoryVisibleColumns(showAdvanced), CATEGORY_EXTRA_WIDTHS);
        var shared = group ? group.shared || {} : {};

        function textCell(key, value, placeholder, listId) {
          var input = document.createElement('input');
          input.type = 'text';
          input.dataset.key = key;
          input.value = value != null ? value : '';
          if (placeholder) input.placeholder = placeholder;
          if (listId) input.setAttribute('list', listId);
          if (CATEGORY_ADVANCED_KEYS.indexOf(key) !== -1) {
            input.dataset.advanced = '1';
            if (!showAdvanced) input.style.display = 'none';
          }
          row.appendChild(input);
          return input;
        }

        textCell('name', group ? group.name : '');
        textCell('section', group ? group.section : '', null, 'dl-categorySections');
        CATEGORY_BASIC_FIELDS.forEach(function (f) {
          textCell(f.key, shared[f.key], null, f.key === 'room' ? 'dl-categoryRooms' : null);
        });
        CATEGORY_ADVANCED_FIELDS.forEach(function (f) { textCell(f.key, shared[f.key]); });
        textCell('judgingSheetName', shared.judgingSheetName, 'Judging sheet name', 'dl-judgingSheetNames');

        var codes = group ? { 'Junior High': group.codes['Junior High'] || '', 'Senior High': group.codes['Senior High'] || '' } : { 'Junior High': '', 'Senior High': '' };
        var jhInput = textCell('codeJH', codes['Junior High']);
        var shInput = textCell('codeSH', codes['Senior High']);
        row._getCodes = function () { return { 'Junior High': jhInput.value, 'Senior High': shInput.value }; };

        CATEGORY_ADVANCED_FLAGS.forEach(function (c) {
          var pillLabel = document.createElement('label');
          pillLabel.className = 'toggle-pill';
          var input = document.createElement('input');
          input.type = 'checkbox';
          input.dataset.key = c.key;
          input.checked = !!shared[c.key];
          var pill = document.createElement('span');
          pill.className = 'pill';
          pillLabel.appendChild(input);
          pillLabel.appendChild(pill);
          row.appendChild(pillLabel);
        });

        row.appendChild(makeRemoveBtn(function () { row.remove(); }));
        list.appendChild(row);
      }

      container.querySelector('[data-action="add"]').onclick = function () { addRow(null); };
      container.querySelector('[data-action="toggle-advanced"]').onclick = function () {
        showAdvanced = !showAdvanced;
        this.textContent = showAdvanced ? 'Hide Advanced Fields' : 'Show Advanced Fields';
        renderRowHead('categories', categoryVisibleColumns(showAdvanced), CATEGORY_EXTRA_WIDTHS, CATEGORY_EXTRA_LABELS);
        var template = gridTemplate(categoryVisibleColumns(showAdvanced), CATEGORY_EXTRA_WIDTHS);
        list.querySelectorAll('.data-row').forEach(function (dataRow) {
          dataRow.style.cssText = template;
          dataRow.querySelectorAll('[data-advanced="1"]').forEach(function (input) {
            input.style.display = showAdvanced ? '' : 'none';
          });
        });
      };
      container.querySelector('[data-action="save"]').onclick = function () {
        var rows = [];
        list.querySelectorAll('.data-row').forEach(function (dataRow) {
          var name = dataRow.querySelector('[data-key="name"]').value;
          var section = dataRow.querySelector('[data-key="section"]').value;
          var shared = {};
          CATEGORY_BASIC_FIELDS.concat(CATEGORY_ADVANCED_FIELDS).forEach(function (f) {
            shared[f.key] = dataRow.querySelector('[data-key="' + f.key + '"]').value;
          });
          shared.judgingSheetName = dataRow.querySelector('[data-key="judgingSheetName"]').value;
          CATEGORY_ADVANCED_FLAGS.forEach(function (c) { shared[c.key] = dataRow.querySelector('[data-key="' + c.key + '"]').checked; });
          var codes = dataRow._getCodes();
          CATEGORY_LEVELS.forEach(function (level) {
            var code = codes[level];
            if (!code) return; // this category doesn't compete at this level — skip, don't write an empty row
            var r = { name: name, section: section, level: level, code: code };
            Object.keys(shared).forEach(function (k) { r[k] = shared[k]; });
            rows.push(r);
          });
        });
        setStatus('categories', 'saving', 'Saving…');
        google.script.run
          .withSuccessHandler(function () { setStatus('categories', 'success', 'Saved'); })
          .withFailureHandler(function (err) { setStatus('categories', 'error', 'Error: ' + err.message); })
          .admin_saveCategoryConfig(rows);
      };

      attachSortBar(toolbar, list, [
        { key: 'name', label: 'Name' }, { key: 'section', label: 'Section' }
      ]);

      setStatus('categories', 'saving', 'Loading…');
      google.script.run
        .withSuccessHandler(safeRender('categories', function (rows) {
          setStatus('categories', null);
          rows = rows || [];
          populateDatalist('dl-categorySections', rows, 'section');
          populateDatalist('dl-categoryRooms', rows, 'room');
          if (!rows.length) { list.innerHTML = '<div class="empty-state">No categories yet — click Add Category.</div>'; return; }
          groupCategoryRows(rows).forEach(addRow);
        }))
        .withFailureHandler(function (err) { logDebug('categories' + ': load FAILED: ' + err.message, true); setStatus('categories', 'error', 'Failed to load: ' + err.message); })
        .admin_getCategoryConfig();
      google.script.run
        .withSuccessHandler(safeRender('categories', function (rows) {
          populateDatalist('dl-judgingSheetNames', rows || [], 'name');
        }))
        .withFailureHandler(function (err) { logDebug('categories: judging sheets load FAILED: ' + err.message, true); })
        .admin_getJudgingSheets();
    }

    // ---- Field Templates panel: editor + click-to-select live preview ----
    // Fixed palette of fields an admin can include — label/type/width are
    // preset per field so admins just check the ones they want, in
    // whatever order they want, instead of configuring each one by hand.
    var FIELD_DEFS = [
      { key: 'title', label: 'Title', type: 'text', full: false },
      { key: 'authorComposer', label: 'Composer', type: 'text', full: false },
      { key: 'accompanist', label: 'Accompanist', type: 'text', full: false },
      { key: 'conductor', label: 'Conductor', type: 'text', full: false },
      { key: 'attachment', label: 'PDF Upload', type: 'file', full: true }
    ];
    function fieldDefFor(key) { return FIELD_DEFS.filter(function (d) { return d.key === key; })[0]; }

    function buildFieldTemplatesPanel(container) {
      container.innerHTML =
        '<p class="panel-intro">Click a template card to preview it on the right. Use Include to add/remove fields, arrows to reorder.</p>' +
        '<div class="toolbar">' +
        '<button class="btn-primary" data-action="add-template">+ Add Template</button>' +
        '<button class="btn-accent" data-action="save-templates">Save Changes</button>' +
        '<span class="status-chip" id="status-fieldTemplates"></span>' +
        '</div>' +
        '<div style="display:flex; gap:18px; align-items:flex-start; flex-wrap:wrap;">' +
        '<div id="templateList" style="flex:1 1 520px; min-width:360px; display:flex; flex-direction:column; gap:12px;"></div>' +
        '<div id="templatePreviewWrap" style="flex:0 0 320px; position:sticky; top:0;">' +
        '<div style="font-size:12px;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:.04em;margin-bottom:8px;">Live Preview</div>' +
        '<div id="templatePreview" style="border:1px solid var(--border); border-radius:12px; background:var(--md-cream); padding:14px;"></div>' +
        '</div></div>';

      var listEl = document.getElementById('templateList');
      var panel = container;

      function renderPreview(tpl) {
        var prev = document.getElementById('templatePreview');
        var fields = [];
        try { fields = JSON.parse(tpl.fieldsJson || '[]'); } catch (e) { fields = []; }
        var html = '<div style="border:1px solid var(--border);border-radius:10px;background:#fff;padding:12px;margin-bottom:10px;">' +
          '<div style="font-size:12px;font-weight:700;color:var(--md-red-deep);text-transform:uppercase;letter-spacing:.03em;margin-bottom:7px;">Student Name *</div>' +
          '<div style="font-size:12px;color:var(--text-muted);margin:-4px 0 9px;">(shows "Group Name" instead when a category has Group Roster checked, on Category Config)</div>' +
          '<input disabled style="width:100%;padding:10px 12px;font-size:14.5px;border:2px solid var(--border);border-radius:8px;margin-bottom:11px;" placeholder="(always shown)">' +
          '<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">' +
          fields.map(function (f) {
            var w = f.full ? 'grid-column:1/-1;' : '';
            var input = f.type === 'textarea'
              ? '<textarea disabled style="width:100%;min-height:56px;padding:9px;font-size:14.5px;border:2px solid var(--border);border-radius:8px;"></textarea>'
              : f.type === 'file'
              ? '<input type="file" disabled style="width:100%;padding:9px;font-size:14.5px;border:2px solid var(--border);border-radius:8px;">'
              : '<input disabled style="width:100%;padding:9px 12px;font-size:14.5px;border:2px solid var(--border);border-radius:8px;">';
            return '<div style="' + w + '"><div style="font-size:11.5px;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:.04em;margin-bottom:4px;">' + f.label + '</div>' + input + '</div>';
          }).join('') +
          '</div></div>';
        html += '<div style="font-size:13px;color:var(--text-muted);margin-top:9px;">' +
          'Group Roster (student list + autofill) is set per-category on the Category Config sub-tab, not here.</div>' +
          '<div style="font-size:13px;color:var(--text-muted);margin-top:5px;">' +
          (tpl.scheduled ? 'Scheduled into the live grid.' : 'NOT scheduled — excluded from the live grid.') + '</div>';
        prev.innerHTML = html;
      }

      var INCLUDE_DEFS = [
        { key: 'authorComposer', label: 'Author/Composer' },
        { key: 'accompanist', label: 'Accompanist' },
        { key: 'conductor', label: 'Conductor' },
        { key: 'attachment', label: 'PDF Upload' }
      ];

      function syncFieldRows(fieldsEditor, includedKeys) {
        var wanted = ['title'].concat(includedKeys);
        Array.prototype.slice.call(fieldsEditor.querySelectorAll('[data-role="field-row"]')).forEach(function (row) {
          if (wanted.indexOf(row.dataset.key) === -1) row.remove();
        });
        wanted.forEach(function (key) {
          if (fieldsEditor.querySelector('[data-role="field-row"][data-key="' + key + '"]')) return;
          addFieldRow(fieldsEditor, { key: key, label: fieldDefFor(key).label });
        });
      }

      function addFieldRow(fieldsEditor, field) {
        var def = fieldDefFor(field.key);
        if (!def) return;
        var row = document.createElement('div');
        row.dataset.role = 'field-row';
        row.dataset.key = field.key;
        row.style.cssText = 'display:flex;align-items:center;gap:12px;padding:10px 12px;border:1px solid var(--border);border-radius:9px;margin-bottom:7px;background:#fff;';

        var tag = document.createElement('span');
        tag.textContent = def.label;
        tag.style.cssText = 'font-size:14px;font-weight:700;color:var(--text-muted);width:140px;flex-shrink:0;';

        var labelInput = document.createElement('input');
        labelInput.dataset.role = 'field-label';
        labelInput.value = field.label || def.label;
        labelInput.style.cssText = 'flex:1;padding:10px 12px;font-size:16px;border:2px solid var(--border);border-radius:8px;';
        labelInput.placeholder = 'What this field displays as';
        labelInput.addEventListener('input', function () { syncPreviewFromCard(fieldsEditor.closest('.template-card')); });
        labelInput.addEventListener('click', function (ev) { ev.stopPropagation(); });

        var upBtn = document.createElement('button');
        upBtn.className = 'btn-secondary'; upBtn.textContent = '↑'; upBtn.style.padding = '7px 11px'; upBtn.type = 'button';
        upBtn.onclick = function (ev) {
          ev.stopPropagation();
          var prev = row.previousElementSibling;
          if (prev) fieldsEditor.insertBefore(row, prev);
          syncPreviewFromCard(fieldsEditor.closest('.template-card'));
        };
        var downBtn = document.createElement('button');
        downBtn.className = 'btn-secondary'; downBtn.textContent = '↓'; downBtn.style.padding = '7px 11px'; downBtn.type = 'button';
        downBtn.onclick = function (ev) {
          ev.stopPropagation();
          var next = row.nextElementSibling;
          if (next) fieldsEditor.insertBefore(next, row);
          syncPreviewFromCard(fieldsEditor.closest('.template-card'));
        };

        row.appendChild(tag); row.appendChild(labelInput); row.appendChild(upBtn); row.appendChild(downBtn);
        fieldsEditor.appendChild(row);
      }

      function cardToTemplate(card) {
        var fields = [];
        card.querySelectorAll('[data-role="field-row"]').forEach(function (row) {
          var def = fieldDefFor(row.dataset.key);
          if (!def) return;
          var customLabel = row.querySelector('[data-role="field-label"]').value.trim();
          var f = { key: def.key, label: customLabel || def.label };
          if (def.type === 'textarea') f.type = 'textarea';
          if (def.type === 'file') f.type = 'file';
          if (def.full) f.full = true;
          fields.push(f);
        });
        return {
          key: card.querySelector('[data-role="key"]').value.trim(),
          label: card.querySelector('[data-role="label"]').value.trim(),
          fieldsJson: JSON.stringify(fields),
          scheduled: card.querySelector('[data-role="scheduled"]').checked
        };
      }

      function syncPreviewFromCard(card) {
        if (!card) return;
        renderPreview(cardToTemplate(card));
      }

      function selectCard(card) {
        listEl.querySelectorAll('.template-card').forEach(function (c) { c.classList.remove('selected'); });
        card.classList.add('selected');
        syncPreviewFromCard(card);
      }

      function addTemplateCard(data) {
        var card = document.createElement('div');
        card.className = 'template-card';
        card.addEventListener('click', function () { selectCard(card); });

        var topRow = document.createElement('div');
        topRow.style.cssText = 'display:flex;gap:10px;margin-bottom:12px;';
        var keyInput = document.createElement('input'); keyInput.dataset.role = 'key'; keyInput.placeholder = 'template-key'; keyInput.value = data ? data.key : '';
        keyInput.style.cssText = 'width:170px;font-size:16px;padding:10px 12px;border:2px solid var(--border);border-radius:8px;';
        var labelInput = document.createElement('input'); labelInput.dataset.role = 'label'; labelInput.placeholder = 'Display label'; labelInput.value = data ? data.label : '';
        labelInput.style.cssText = 'flex:1;font-size:16px;padding:10px 12px;border:2px solid var(--border);border-radius:8px;';
        [keyInput, labelInput].forEach(function (el) { el.addEventListener('click', function (ev) { ev.stopPropagation(); }); });
        topRow.appendChild(keyInput); topRow.appendChild(labelInput);

        var flagsRow = document.createElement('div');
        flagsRow.style.cssText = 'display:flex;gap:16px;margin-bottom:12px;';
        var scheduledLabel = document.createElement('label');
        scheduledLabel.className = 'toggle-pill';
        scheduledLabel.addEventListener('click', function (ev) { ev.stopPropagation(); });
        var scheduledInput = document.createElement('input');
        scheduledInput.type = 'checkbox'; scheduledInput.dataset.role = 'scheduled'; scheduledInput.checked = data ? !!data.scheduled : true;
        var scheduledPill = document.createElement('span'); scheduledPill.className = 'pill';
        var scheduledText = document.createElement('span'); scheduledText.className = 'pill-label'; scheduledText.textContent = 'Scheduled into live grid';
        scheduledLabel.appendChild(scheduledInput); scheduledLabel.appendChild(scheduledPill); scheduledLabel.appendChild(scheduledText);
        flagsRow.appendChild(scheduledLabel);

        var initialFields = [];
        if (data) { try { initialFields = JSON.parse(data.fieldsJson || '[]'); } catch (e) { initialFields = []; } }
        var initialIncludedKeys = initialFields.map(function (f) { return f.key; }).filter(function (k) { return k !== 'title'; });

        var includeLabel = document.createElement('div');
        includeLabel.textContent = 'Include:';
        includeLabel.style.cssText = 'font-size:12px;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:.04em;margin-bottom:7px;';

        var includeRow = document.createElement('div');
        includeRow.style.cssText = 'display:flex;gap:20px;margin-bottom:14px;flex-wrap:wrap;';
        includeRow.addEventListener('click', function (ev) { ev.stopPropagation(); });
        var fieldsEditor = document.createElement('div');
        fieldsEditor.addEventListener('click', function (ev) { ev.stopPropagation(); });

        INCLUDE_DEFS.forEach(function (def) {
          var lbl = document.createElement('label');
          lbl.style.cssText = 'display:flex;align-items:center;gap:6px;font-size:15px;';
          var cb = document.createElement('input');
          cb.type = 'checkbox';
          cb.dataset.includeKey = def.key;
          cb.checked = initialIncludedKeys.indexOf(def.key) !== -1;
          cb.addEventListener('change', function () {
            var included = INCLUDE_DEFS.filter(function (d) {
              return includeRow.querySelector('[data-include-key="' + d.key + '"]').checked;
            }).map(function (d) { return d.key; });
            syncFieldRows(fieldsEditor, included);
            syncPreviewFromCard(card);
          });
          lbl.appendChild(cb);
          lbl.appendChild(document.createTextNode(def.label));
          includeRow.appendChild(lbl);
        });

        var fieldsLabel = document.createElement('div');
        fieldsLabel.textContent = 'Fields (rename what displays, arrows to reorder):';
        fieldsLabel.style.cssText = 'font-size:12px;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:.04em;margin:9px 0 7px;';

        fieldsEditor.style.marginBottom = '5px';

        var removeCardBtn = makeRemoveBtn(function () { card.remove(); });

        card.appendChild(topRow);
        card.appendChild(flagsRow);
        card.appendChild(includeLabel);
        card.appendChild(includeRow);
        card.appendChild(fieldsLabel);
        card.appendChild(fieldsEditor);
        card.appendChild(removeCardBtn);
        card.style.position = 'relative';
        card.style.paddingRight = '46px';
        removeCardBtn.style.position = 'absolute';
        removeCardBtn.style.top = '14px';
        removeCardBtn.style.right = '14px';

        [keyInput, labelInput].forEach(function (el) { el.addEventListener('input', function () { syncPreviewFromCard(card); }); });
        scheduledInput.addEventListener('change', function () { syncPreviewFromCard(card); });

        syncFieldRows(fieldsEditor, initialIncludedKeys);
        var byKey = {};
        initialFields.forEach(function (f) { byKey[f.key] = f; });
        Array.prototype.slice.call(fieldsEditor.querySelectorAll('[data-role="field-row"]')).forEach(function (row) {
          if (byKey[row.dataset.key]) row.querySelector('[data-role="field-label"]').value = byKey[row.dataset.key].label;
        });

        listEl.appendChild(card);
        if (!listEl.querySelector('.template-card.selected')) selectCard(card);
      }

      panel.querySelector('[data-action="add-template"]').onclick = function () { addTemplateCard(null); };
      panel.querySelector('[data-action="save-templates"]').onclick = function () {
        var rows = Array.prototype.slice.call(listEl.querySelectorAll('.template-card')).map(cardToTemplate).filter(function (r) { return r.key; });
        setStatus('fieldTemplates', 'saving', 'Saving…');
        google.script.run
          .withSuccessHandler(function () { setStatus('fieldTemplates', 'success', 'Saved'); })
          .withFailureHandler(function (err) { setStatus('fieldTemplates', 'error', 'Error: ' + err.message); })
          .admin_saveFieldTemplates(rows);
      };

      setStatus('fieldTemplates', 'saving', 'Loading…');
      google.script.run
        .withSuccessHandler(safeRender('fieldTemplates', function (templates) {
          setStatus('fieldTemplates', null);
          (templates || []).forEach(addTemplateCard);
        }))
        .withFailureHandler(function (err) { logDebug('fieldTemplates' + ': load FAILED: ' + err.message, true); setStatus('fieldTemplates', 'error', 'Failed to load: ' + err.message); })
        .admin_getFieldTemplates();
    }

    // ---- Registrations panel: read-only contact info per school, as sortable rows ----

        { key: 'school', label: 'School', width: '1.2fr' },

        .admin_getRegistrations();
    }

    // ---- Submissions panel: view, edit inline, delete — with search + sort since this list can run 100+ rows ----
    function buildSubmissionsPanel(container) {
      var columns = [
        { key: 'entryId', label: 'Entry ID', width: '90px' },
        { key: 'school', label: 'School', width: '70px' },
        { key: 'category', label: 'Category', width: '85px' },
        { key: 'name', label: 'Name', width: '1.3fr' },
        { key: 'title', label: 'Title', width: '1.3fr' },
        { key: 'accompanist', label: 'Accompanist', width: '1.2fr' },
        { key: 'conductor', label: 'Conductor', width: '1.2fr' }
      ];
      container.innerHTML =
        '<div class="toolbar" id="toolbar-submissions"><span class="status-chip" id="status-submissions"></span></div>' +
        '<div class="row-scroll"><div class="row-head" id="rowhead-submissions"></div>' +
        '<div class="row-list" id="list-submissions"></div></div>';
      var list = document.getElementById('list-submissions');
      var toolbar = document.getElementById('toolbar-submissions');
      renderRowHead('submissions', columns, ['100px', '44px'], ['']);

      attachSortBar(toolbar, list, [
        { key: 'entryId', label: 'Entry ID' }, { key: 'school', label: 'School' },
        { key: 'category', label: 'Category' }, { key: 'name', label: 'Name' }
      ], ['title']);

      function addRow(e) {
        var row = document.createElement('div');
        row.className = 'data-row';
        row.style.cssText = gridTemplate(columns, ['100px', '44px']);
        row.dataset.entryId = e['Entry ID'] || '';
        row.dataset.school = e['School Code'] || '';
        row.dataset.category = e['Category Code'] || '';
        row.dataset.name = e['Name'] || '';
        row.dataset.title = e['Title'] || '';

        var idSpan = document.createElement('span');
        idSpan.className = 'static-cell'; idSpan.textContent = e['Entry ID'] || '';
        var schoolSpan = document.createElement('span');
        schoolSpan.className = 'static-cell'; schoolSpan.textContent = e['School Code'] || '';
        var catSpan = document.createElement('span');
        catSpan.className = 'static-cell'; catSpan.textContent = e['Category Code'] || '';
        row.appendChild(idSpan);
        row.appendChild(schoolSpan);
        row.appendChild(catSpan);

        ['Name', 'Title', 'Accompanist', 'Conductor'].forEach(function (field) {
          var input = document.createElement('input');
          input.type = 'text';
          input.dataset.field = field;
          input.value = e[field] || '';
          row.appendChild(input);
        });

        var saveBtn = document.createElement('button');
        saveBtn.className = 'btn-primary';
        saveBtn.textContent = 'Save';
        saveBtn.style.padding = '9px 14px';
        saveBtn.style.fontSize = '13.5px';
        saveBtn.onclick = function () {
          var updates = {};
          row.querySelectorAll('input[data-field]').forEach(function (input) { updates[input.dataset.field] = input.value; });
          setStatus('submissions', 'saving', 'Saving…');
          google.script.run
            .withSuccessHandler(function () { setStatus('submissions', 'success', 'Entry ' + e['Entry ID'] + ' updated'); })
            .withFailureHandler(function (err) { setStatus('submissions', 'error', 'Error: ' + err.message); })
            .admin_updateSubmissionEntry(e['Entry ID'], updates);
        };
        row.appendChild(saveBtn);

        row.appendChild(makeRemoveBtn(function () {
          if (!confirm('Delete entry ' + e['Entry ID'] + '? This cannot be undone.')) return;
          setStatus('submissions', 'saving', 'Deleting…');
          google.script.run
            .withSuccessHandler(function () { row.classList.add('deleted'); setStatus('submissions', 'success', 'Entry deleted'); })
            .withFailureHandler(function (err) { setStatus('submissions', 'error', 'Error: ' + err.message); })
            .admin_deleteSubmissionEntry(e['Entry ID']);
        }));

        list.appendChild(row);
      }

      setStatus('submissions', 'saving', 'Loading…');
      google.script.run
        .withSuccessHandler(safeRender('submissions', function (rows) {
          setStatus('submissions', null);
          rows = rows || [];
          if (!rows.length) { list.innerHTML = '<div class="empty-state">No submissions yet.</div>'; return; }
          rows.forEach(addRow);
        }))
        .withFailureHandler(function (err) { logDebug('submissions' + ': load FAILED: ' + err.message, true); setStatus('submissions', 'error', 'Failed to load: ' + err.message); })
        .admin_getSubmissions();
    }

    // ---- Actions panel: trigger the same generation/check functions as the Sheet menu ----
    function buildActionsPanel(container) {
      var ACTIONS = [
        { id: 'btn-seed-historical', fn: 'admin_runSeedHistoricalTestData', label: 'Seed Sample Test Data (one fabricated school, every category)', cls: 'btn-secondary' },
        { id: 'btn-clear-test-data', fn: 'admin_runClearTestData', label: 'Clear Test Data', cls: 'btn-secondary' }
      ];
      container.innerHTML =
        '<div class="rollover-card">' +
          '<h3>Reset for Next Year</h3>' +
          '<p>Saves a complete copy of this whole spreadsheet into Drive under ' +
          '"MACS Fine Arts Competition / &lt;year&gt; / Secondary", ' +
          'then clears Submissions, Registrations, Master, Schedule, and the Admin Edit Log so the site is ready for a new year, ' +
          'and moves this live spreadsheet into next year\'s folder ("MACS Fine Arts Competition / &lt;next year&gt; / Secondary") so it\'s easy to find. ' +
          'Category Config, Field Templates, Settings, Building Map, Schools, Judges, and Judging Sheets are left exactly as they are.</p>' +
          '<div class="rollover-row">' +
            '<label for="rollover-year" style="font-size:14px;">Year being archived:</label>' +
            '<input type="text" id="rollover-year" placeholder="2027">' +
            '<button class="btn-primary" id="btn-rollover"><span class="spinner btn-spinner"></span><span class="btn-label-text">Archive &amp; Reset for Next Year</span></button>' +
            '<span class="status-chip" id="status-btn-rollover"></span>' +
          '</div>' +
          '<div id="rollover-result" style="margin-top:10px; font-size:14px;"></div>' +
        '</div>' +
        '<p class="panel-intro">Run these in order after registration closes. Same functions as the Sheet\'s "MACS Scheduling" menu.</p>' +
        '<div class="action-grid" id="action-grid"></div>';

      google.script.run
        .withSuccessHandler(function (rows) {
          var setting = (rows || []).find(function (r) { return r.key === 'Competition Year'; });
          if (setting && setting.value) document.getElementById('rollover-year').value = setting.value;
        })
        .withFailureHandler(function () {})
        .admin_getSettings();

      var rolloverBtn = document.getElementById('btn-rollover');
      var rolloverChip = document.getElementById('status-btn-rollover');
      var rolloverResult = document.getElementById('rollover-result');
      rolloverBtn.onclick = function () {
        var year = document.getElementById('rollover-year').value.trim();
        if (!year) { alert('Enter the year being archived first (e.g. "2027").'); return; }
        var typed = prompt('This archives the entire spreadsheet and then permanently clears Submissions, Registrations, ' +
          'Master, Schedule, and the Admin Edit Log for a new year.\n\nType the year (' + year + ') to confirm:');
        if (typed !== year) return;

        rolloverBtn.disabled = true;
        rolloverBtn.classList.add('running');
        rolloverChip.className = 'status-chip saving';
        rolloverChip.innerHTML = '<span class="spinner"></span><span>Archiving…</span>';
        rolloverResult.innerHTML = '';
        google.script.run
          .withSuccessHandler(function (r) {
            rolloverBtn.disabled = false;
            rolloverBtn.classList.remove('running');
            rolloverChip.className = 'status-chip success';
            rolloverChip.innerHTML = '✓<span>Done</span>';
            rolloverResult.innerHTML = 'Archived as "' + r.archiveName + '" — <a href="' + r.archiveUrl + '" target="_blank">open archive</a>. ' +
              'Live sheet is cleared and ready' + (r.nextYear ? ' for ' + r.nextYear : '') +
              (r.movedTo ? ', and moved into Drive folder "' + r.movedTo + '".' : '.');
            if (r.nextYear) document.getElementById('rollover-year').value = r.nextYear;
          })
          .withFailureHandler(function (err) {
            rolloverBtn.disabled = false;
            rolloverBtn.classList.remove('running');
            rolloverChip.className = 'status-chip error';
            rolloverChip.innerHTML = '✗<span>Error: ' + err.message + '</span>';
          })
          .admin_resetForNextYear(year);
      };

      var grid = document.getElementById('action-grid');

      ACTIONS.forEach(function (a) {
        var row = document.createElement('div');
        row.className = 'action-row';
        var btn = document.createElement('button');
        btn.className = a.cls;
        btn.id = a.id;
        btn.innerHTML = '<span class="spinner btn-spinner"></span><span class="btn-label-text">' + a.label + '</span>';
        var chip = document.createElement('span');
        chip.className = 'status-chip';
        chip.id = 'status-' + a.id;
        row.appendChild(btn);
        row.appendChild(chip);
        grid.appendChild(row);

        btn.onclick = function () {
          btn.disabled = true;
          btn.classList.add('running');
          chip.className = 'status-chip saving';
          chip.innerHTML = '<span class="spinner"></span><span>Running…</span>';
          google.script.run
            .withSuccessHandler(function (r) {
              btn.disabled = false;
              btn.classList.remove('running');
              var msg = 'Done' + (r && r.violationCount != null ? ' — Violations: ' + r.violationCount : '');
              chip.className = 'status-chip success';
              chip.innerHTML = '✓<span>' + msg + '</span>';
            })
            .withFailureHandler(function (err) {
              btn.disabled = false;
              btn.classList.remove('running');
              chip.className = 'status-chip error';
              chip.innerHTML = '✗<span>Error: ' + err.message + '</span>';
            })
            [a.fn]();
        };
      });
    }

    document.getElementById('debug-toggle').onclick = function () {
      var panel = document.getElementById('debug-panel');
      panel.classList.toggle('open');
      document.getElementById('debug-toggle').classList.remove('has-errors');
    };
    document.getElementById('debug-copy').onclick = function () {
      var text = DEBUG_LOG.join('\n') || '(log is empty)';
      if (navigator.clipboard) navigator.clipboard.writeText(text);
    };
    document.getElementById('debug-clear').onclick = function () {
      DEBUG_LOG.length = 0;
      document.getElementById('debug-log').textContent = '';
      document.getElementById('debug-toggle').classList.remove('has-errors');
    };

    logDebug('init() starting');
    try {
      init();
      logDebug('init() completed');
    } catch (e) {
      logDebug('init() THREW: ' + e.message + (e.stack ? '\n' + e.stack : ''), true);
    }
  </script>
</body>
</html>
