<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Driver Routes — Showcase demo</title>
<style>
  :root { --maroon:#8f1b1b; --maroon-hi:#B22222; --gold:#D4AF37; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { display: flex; flex-direction: column; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: #f6f7f9; }
  .bar {
    flex: none; display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
    padding: 10px 16px; color: #fff;
    background: linear-gradient(120deg, #6d1414 0%, #8f1b1b 55%, #B22222 100%);
    box-shadow: 0 4px 14px rgba(0,0,0,.35); z-index: 2;
  }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 1.05rem; }
  .brand .logo { font-size: 1.5rem; }
  .brand small { display: block; font-weight: 600; font-size: .72rem; opacity: .85; }
  .seg { display: inline-flex; background: rgba(255,255,255,.14); border: 1px solid rgba(255,255,255,.25); border-radius: 999px; padding: 4px; gap: 2px; flex-wrap: wrap; }
  .seg button {
    border: 0; cursor: pointer; font: inherit; font-weight: 700; font-size: .86rem;
    color: #fff; background: transparent; padding: 8px 13px; border-radius: 999px;
    display: inline-flex; align-items: center; gap: 6px; transition: background .12s;
  }
  .seg button:hover { background: rgba(255,255,255,.16); }
  .seg button.active { background: var(--gold); color: #3a2b00; }
  .spacer { flex: 1; }
  .hint { font-size: .78rem; opacity: .82; max-width: 30rem; line-height: 1.35; }
  .back { color: #fff; text-decoration: none; font-weight: 700; font-size: .86rem; opacity: .9; border: 1px solid rgba(255,255,255,.3); padding: 7px 12px; border-radius: 999px; }
  .back:hover { background: rgba(255,255,255,.12); }
  .stage { flex: 1; position: relative; background: #f6f7f9; }
  /* The driver app is a PHONE app. Framing it full-width would misrepresent it, so it gets a
     phone-shaped stage; the office console gets the whole width, as a desk screen should. */
  .stage iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; display: block; background: #f6f7f9; }
  .stage.phone { display: grid; place-items: center; padding: 18px 12px; background: #e9ebef; }
  .stage.phone iframe {
    position: static; width: 100%; max-width: 26rem; height: 100%; max-height: 46rem;
    border: 1px solid #c9cdd4; border-radius: 22px; box-shadow: 0 10px 34px rgba(0,0,0,.18); background: #fff;
  }
  @media (max-width: 980px) { .brand small, .hint { display: none; } .seg button { padding: 8px 10px; font-size: .8rem; } }
</style>
</head>
<body>
  <div class="bar">
    <div class="brand">
      <span class="logo" aria-hidden="true">🚌</span>
      <span>Driver Routes<small>Route sheets for bus drivers &amp; subs &middot; no school email needed</small></span>
    </div>
    <div class="seg" role="tablist" aria-label="Choose a screen">
      <button data-src="driver.html" data-phone="1" class="active" aria-selected="true">📱 Driver &middot; phone</button>
      <button data-src="office.html" aria-selected="false">🗂️ Transportation Office</button>
    </div>
    <span class="spacer"></span>
    <span class="hint">Sign in with PIN <b>4821</b>, open <b>Jarrettsville</b>, tick a child on &mdash;
      then switch to the office and watch that route move off &ldquo;Not checked&rdquo;.</span>
    <a class="back" href="../../index.html" target="_top">← Gallery</a>
  </div>
  <div class="stage phone" id="stage">
    <iframe id="screen" src="driver.html" title="Driver Routes screen"></iframe>
  </div>
<script>
  // Two Apps Script projects in production — an ANONYMOUS driver app and a DOMAIN office console —
  // sharing one workbook. Here they share one sessionStorage, so a tick on the phone is visible
  // from the office, which is exactly the relationship worth showing.
  var frame = document.getElementById('screen');
  var stage = document.getElementById('stage');
  var btns = [].slice.call(document.querySelectorAll('.seg button'));

  function activate(btn) {
    btns.forEach(function (x) { x.classList.remove('active'); x.setAttribute('aria-selected', 'false'); });
    btn.classList.add('active');
    btn.setAttribute('aria-selected', 'true');
    stage.classList.toggle('phone', btn.getAttribute('data-phone') === '1');
    frame.src = btn.getAttribute('data-src');
  }

  btns.forEach(function (btn) {
    btn.addEventListener('click', function () { activate(btn); });
  });
</script>
</body>
</html>
