    // Use-as-is (layout-locked) forms freeze access + approval for non-admins.
    if (EDITING.structureLocked) {
      ['sVisibility', 'sRestriction', 'aEn', 'aWho', 'aMode', 'aCondField', 'aCondOp', 'aCondVal'].forEach(function (idd) { var el = document.getElementById(idd); if (el) el.disabled = true; });
    }
    document.getElementById('sConfirm').oninput = function () { s.confirmationMessage = this.value; };
    document.getElementById('btnSave').onclick = saveAll;
    document.getElementById('btnShare').onclick = function () { doShare(EDITING.meta.id); };
    document.getElementById('btnResp').onclick = function () { openResponses(EDITING.meta.id); };
    var bd = document.getElementById('btnDelete'); if (bd) bd.onclick = function () { doDelete(EDITING.meta.id, function () { DIRTY = false; renderDashboard(); }); };
  }

  // ---------- PDF Template tab ----------
  // Opt-in per-form PDF export that visually matches one or more staff-uploaded documents (see
  // PdfTemplate.js) — a form can have several templates (schema.settings.pdfTemplates, an array)
  // all pulling from the SAME pool of schema fields, e.g. a "Physical Form" and an "Emergency
  // Card" both filled from one submission. Field placement is click-a-field-then-drag-a-box — no
  // drag library, just absolutely-positioned divs over the rasterized page image, stored as
  // PERCENTAGES of the page (converted to/from PDF points via the page's widthPt/heightPt) so
  // redraws never need to know the image's actual rendered pixel size.
  var PDFTPL_ACTIVE = '';  // id of the template currently shown in the mapper
  var PDFTPL_PAGE = 0;     // which page of that template is showing
  var PDFTPL_ARM = '';        // fieldId currently armed to be drawn on next click-drag, or ''
  var PDFTPL_ARM_OPTION = ''; // for a 'checkboxes' field: which option the next placement is for
  var PDFTPL_SELECTED = [];   // [{fid, idx}, ...] boxes selected on the current page — click to select,
                              // shift-click to add; last entry is the "match to" source for Match size.
  var PDFTPL_SAVE_T = {}; // debounce handles for savePdfTemplateMapping, KEYED BY TEMPLATE ID —
  // a single shared timer here previously meant editing template B while template A's save was
  // still pending cancelled A's save outright (lost edit); keying by id lets each document's
  // save debounce independently.
  var PDFTPL_LAST_SAVED = {}; // templateId -> Date of its last successful savePdfTemplateMapping

  function pdfInputFields_() { return fields().filter(function (f) { return !isContentType(f.type); }); }

  /** "Administrator-Cell phone" for a field following a sectionHeader labeled "Administrator" —
   *  disambiguates same-named fields (Name/Phone/Email) that repeat across sections of one form. */
  function pdfFieldDisplayLabel_(f) {
    var all = fields();
    var idx = all.indexOf(f);
    var section = '';
    for (var i = idx - 1; i >= 0; i--) {
      if (all[i].type === 'sectionHeader') { section = all[i].label || ''; break; }
      if (all[i].type === 'sectionEnd') break; // boundary crossed — not part of the section above it
    }
    var label = fieldDisplayName_(f);
    return section ? (section + '-' + label) : label;
  }

  /** Client-side mirror of PdfTemplate.js's normalizePdfFieldBoxes_ — tolerates a form saved
   *  before fieldBoxes became array-valued. Keep in sync if that shape changes again. */
  function normalizePdfFieldBoxes_(raw) {
    var out = {};
    Object.keys(raw || {}).forEach(function (fid) {
      var v = raw[fid];
      out[fid] = Array.isArray(v) ? v : [v];
    });
    return out;
  }

  function pdfActiveTemplate_() {
    var templates = EDITING.schema.settings.pdfTemplates || [];
    if (!templates.length) return null;
    if (!templates.some(function (t) { return t.id === PDFTPL_ACTIVE; })) PDFTPL_ACTIVE = templates[0].id;
    var tpl = templates.filter(function (t) { return t.id === PDFTPL_ACTIVE; })[0];
    tpl.fieldBoxes = normalizePdfFieldBoxes_(tpl.fieldBoxes);
    tpl.calcFields = tpl.calcFields || {};
    return tpl;
  }

  var PDFTPL_ACCEPT = 'application/pdf,.pdf,.doc,.docx,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document';

  function pdfTemplateTabHtml() {
    var templates = EDITING.schema.settings.pdfTemplates || [];
    var tpl = templates.length ? pdfActiveTemplate_() : null;
    return pdfDocumentsListHtml_(templates) +
      (tpl ? pdfTplChipsHtml_(templates, tpl) + pdfSingleTemplateHtml_(tpl) : '') +
      (templates.length ? pdfBuildAllHtml_(templates) : '');
  }

  function pdfDocumentsListHtml_(templates) {
    var rows = templates.map(function (t) {
      return '<div class="pdftpl-doc-row">' +
        '<span class="pdftpl-doc-name">' + esc(t.name) + '</span>' +
        '<span class="pdftpl-doc-status' + (t.enabled ? ' on' : '') + '">' + (t.enabled ? 'Active' : 'Paused') + '</span>' +
        '<button class="btn ghost sm" data-pause="' + esc(t.id) + '">' + (t.enabled ? 'Pause' : 'Resume') + '</button>' +
        '<button class="btn ghost sm" data-rename="' + esc(t.id) + '">Rename</button>' +
        '<button class="btn ghost sm" data-replace="' + esc(t.id) + '">Replace document…</button>' +
        '<input class="pdftpl-replace-file" data-replace-file="' + esc(t.id) + '" type="file" accept="' + PDFTPL_ACCEPT + '" style="display:none">' +
        '<button class="btn ghost sm danger" data-delete="' + esc(t.id) + '">Delete</button>' +
      '</div>';
    }).join('');
    return '<div class="setcard">' +
      '<h4>PDF Template</h4>' +
      '<p class="help">Upload the school’s existing PDF or Word doc (a signed permission slip, physical, KI form, etc.) and place a box for each field below — submissions will then export as a PDF that looks exactly like it, instead of the generic branded receipt. Add more than one document if this form needs to produce several filled PDFs from the same answers.</p>' +
      '<div class="pdftpl-doclist">' + rows +
        '<div class="pdftpl-doc-row pdftpl-doc-add">' +
          '<button class="btn ghost sm" id="_pdfTplAdd">+ Add document</button>' +
          '<input id="_pdfTplAddFile" type="file" accept="' + PDFTPL_ACCEPT + '" style="display:none">' +
        '</div>' +
      '</div>' +
    '</div>';
  }

  function pdfTplChipsHtml_(templates, tpl) {
    return '<div class="pdftpl-tpl-switcher"><span class="label">Now viewing</span>' + templates.map(function (t) {
      return '<button class="pdftpl-tpl-chip' + (t.id === tpl.id ? ' on' : '') + '" data-tid="' + esc(t.id) + '">' +
        '<span class="dot" style="background:' + (t.enabled ? 'var(--hcs-red)' : 'var(--line-strong)') + '"></span>' + esc(t.name) + '</button>';
    }).join('') + '</div>';
  }

  function pdfBuildAllHtml_(templates) {
    var lastExported = templates.reduce(function (max, t) { return t.mappedAt && t.mappedAt > max ? t.mappedAt : max; }, '');
    var lastExportedText = lastExported ? 'Last exported ' + new Date(lastExported).toLocaleString() : 'Never exported';
    return '<div class="pdftpl-exportbar">' +
      '<span class="help" id="_pdfTplBuildAllStatus">' + esc(lastExportedText) + '</span>' +
      '<button class="btn" id="_pdfTplBuildAll">Export All Templates</button>' +
    '</div>';
  }

  function pdfSingleTemplateHtml_(tpl) {
    if (PDFTPL_PAGE >= tpl.pageCount) PDFTPL_PAGE = 0;
    var page = tpl.pages[PDFTPL_PAGE];
    var pageTabs = tpl.pageCount > 1 ? '<div class="pdftpl-pagetabs">' + tpl.pages.map(function (p) {
      return '<button class="' + (p.index === PDFTPL_PAGE ? 'on' : '') + '" data-pg="' + p.index + '">Page ' + (p.index + 1) + '</button>';
    }).join('') + '</div>' : '';
    var boxesHtml = Object.keys(tpl.fieldBoxes || {}).map(function (fid) {
      var f = pdfInputFields_().filter(function (x) { return x.id === fid; })[0];
      var calc = tpl.calcFields && tpl.calcFields[fid];
      var label = f ? pdfFieldDisplayLabel_(f) : (calc ? pdfCalcDisplayLabel_(calc) : fid);
      return tpl.fieldBoxes[fid].map(function (b, idx) {
        if (b.page !== PDFTPL_PAGE) return '';
        var boxLabel = label + (b.optionValue ? ' — ' + b.optionValue : '');
        var left = (b.x / page.widthPt) * 100, top = (b.y / page.heightPt) * 100;
        var w = (b.w / page.widthPt) * 100, h = (b.h / page.heightPt) * 100;
        var sel = pdfBoxSelected_(fid, idx);
        return '<div class="pdftpl-box' + (sel ? ' selected' : '') + '" data-fid="' + esc(fid) + '" data-boxidx="' + idx + '" style="left:' + left + '%;top:' + top + '%;width:' + w + '%;height:' + h + '%">' +
          '<span class="lbl-chip">' + esc(boxLabel) + '</span><span class="del-x" data-del="' + esc(fid) + '" data-delidx="' + idx + '">✕</span><span class="rs"></span></div>';
      }).join('');
    }).join('');
    var selectionBarHtml = pdfSelectionBarHtml_(tpl);
    var fieldListHtml = pdfFieldListRows_(tpl).map(function (r) {
      if (r.heading) return '<div class="pdftpl-field-heading">' + esc(r.heading) + '</div>';
      var armed = PDFTPL_ARM === r.fid && (PDFTPL_ARM_OPTION || '') === (r.opt || '');
      return '<div class="pdftpl-field' + (r.sub ? ' sub' : '') + (r.placed ? ' placed' : '') + (armed ? ' arming' : '') +
        '" data-fid="' + esc(r.fid) + '" data-opt="' + esc(r.opt || '') + '">' +
        '<span class="dot"></span>' + esc(r.label) +
        (r.textOnly ? '<span class="help" style="margin-left:auto">text only</span>' : '') + '</div>';
    }).join('') || '<p class="help">This form has no fields yet — add some on the Build tab first.</p>';
    return '<div class="setcard" style="margin-bottom:16px">' +
        '<p class="help">Click a field on the left, then click on the page to place it. Drag a placed box to move it, or its corner to resize.' +
          (tpl.fieldBoxes && Object.keys(tpl.fieldBoxes).some(function (fid) {
            var f = pdfInputFields_().filter(function (x) { return x.id === fid; })[0];
            return f && (f.type === 'file' || f.type === 'signature');
          }) ? ' Signature/file fields render as blank on the PDF (same as the branded receipt) — no image is composited.' : '') + '</p>' +
        (tpl.lastBuildError ? '<p class="notice err" style="margin-top:8px">' + esc(tpl.lastBuildError) + '</p>' : '') +
      '</div>' +
      pageTabs +
      selectionBarHtml +
      '<div class="pdftpl-layout">' +
        '<div class="pdftpl-fieldlist">' + fieldListHtml + '</div>' +
        '<div class="pdftpl-stage" id="_pdfTplStage" data-w="' + page.widthPt + '" data-h="' + page.heightPt + '">' +
          '<img src="' + esc(page.pngUrl) + '" alt="Page ' + (PDFTPL_PAGE + 1) + '" draggable="false">' +
          boxesHtml +
        '</div>' +
      '</div>';
  }

  function pdfBoxSelected_(fid, idx) {
    return PDFTPL_SELECTED.some(function (s) { return s.fid === fid && s.idx === idx; });
  }
  function pdfSelectBox_(fid, idx, additive) {
    if (!additive) { PDFTPL_SELECTED = [{ fid: fid, idx: idx }]; return; }
    var at = PDFTPL_SELECTED.findIndex ? PDFTPL_SELECTED.findIndex(function (s) { return s.fid === fid && s.idx === idx; }) : -1;
    if (at === -1) { for (var i = 0; i < PDFTPL_SELECTED.length; i++) { if (PDFTPL_SELECTED[i].fid === fid && PDFTPL_SELECTED[i].idx === idx) { at = i; break; } } }
    if (at === -1) PDFTPL_SELECTED.push({ fid: fid, idx: idx });
    else PDFTPL_SELECTED.splice(at, 1);
  }

  /** Field choices for a single placed box's optional visibility gate — same eligible-field set
   *  as an approval condition. Independent of the FIELD this box belongs to: e.g. a "Total
   *  students" count placed twice on the page can have its second occurrence gated by a totally
   *  different "Participating? Yes/No" question, while the first occurrence (no condition set)
   *  keeps showing unconditionally — see buildPdfTemplateDataMap_. */
  function pdfBoxCondFieldOpts_(sel) {
    var opts = '<option value="">— always show —</option>';
    fields().forEach(function (f) {
      if (NON_CONDITION_TYPES[f.type]) return;
      opts += '<option value="' + f.id + '"' + (sel === f.id ? ' selected' : '') + '>' + esc(fieldDisplayName_(f)) + '</option>';
    });
    return opts;
  }
  /** Shown whenever at least one box is selected: numeric W/H (points) for the last-selected
   *  box, plus "Match size" to apply that box's size to every other selected box — the fix for
   *  eyeballing drag-resize until several boxes look roughly the same size. With exactly ONE box
   *  selected (a condition is a property of one specific box, not a batch op) and that box
   *  belongs to a real schema field (not a PDF-only calc overlay — see tpl.calcFields), also
   *  offers an "Only show when…" gate for that single occurrence. */
  function pdfSelectionBarHtml_(tpl) {
    if (!PDFTPL_SELECTED.length) return '';
    var last = PDFTPL_SELECTED[PDFTPL_SELECTED.length - 1];
    var b = tpl.fieldBoxes[last.fid] && tpl.fieldBoxes[last.fid][last.idx];
    if (!b) { PDFTPL_SELECTED = []; return ''; }
    var isCalc = !!(tpl.calcFields && tpl.calcFields[last.fid]);
    var showCond = PDFTPL_SELECTED.length === 1 && !isCalc;
    var cond = b.condition || {};
    return '<div class="pdftpl-selbar">' +
      '<span class="help">' + PDFTPL_SELECTED.length + ' box' + (PDFTPL_SELECTED.length === 1 ? '' : 'es') + ' selected</span>' +
      '<label class="lbl" style="margin:0">W<input class="control" type="number" min="4" id="_pdfSelW" value="' + Math.round(b.w) + '" style="width:70px;display:inline-block"></label>' +
      '<label class="lbl" style="margin:0">H<input class="control" type="number" min="4" id="_pdfSelH" value="' + Math.round(b.h) + '" style="width:70px;display:inline-block"></label>' +
      (PDFTPL_SELECTED.length > 1 ? '<button class="btn ghost sm" id="_pdfSelMatch">Match size to last-selected</button>' : '') +
      '<button class="btn ghost sm" id="_pdfSelClear">Clear selection</button>' +
      (showCond ?
        '<div class="frow" style="gap:6px;margin-top:8px;width:100%;flex-basis:100%">' +
          '<label class="lbl" style="margin:0 6px 0 0;white-space:nowrap;align-self:center">Only show this box when' +
            info('Gates only THIS placed occurrence of the field — useful when the same field is placed more than once on the page and only one copy should be conditional.') +
          '</label>' +
          '<select class="control" id="_pdfBoxCondField">' + pdfBoxCondFieldOpts_(cond.field || '') + '</select>' +
          '<select class="control" id="_pdfBoxCondOp">' + condOpOpts(cond) + '</select>' +
          '<input class="control" id="_pdfBoxCondVal" placeholder="value" value="' + esc(cond.value || '') + '">' +
        '</div>' : '') +
    '</div>';
  }

  function wirePdfSelectionBar_(tpl) {
    var wEl = document.getElementById('_pdfSelW'), hEl = document.getElementById('_pdfSelH');
    var matchBtn = document.getElementById('_pdfSelMatch'), clearBtn = document.getElementById('_pdfSelClear');
    if (!PDFTPL_SELECTED.length) return;
    var last = PDFTPL_SELECTED[PDFTPL_SELECTED.length - 1];
    function applySize(w, h) {
      var b = tpl.fieldBoxes[last.fid][last.idx];
      tpl.fieldBoxes[last.fid][last.idx] = Object.assign({}, b, { w: Math.max(4, w), h: Math.max(4, h) });
      schedulePdfTplSave_(tpl);
      renderEditorPane();
    }
    if (wEl) wEl.onchange = function () { applySize(Number(wEl.value) || 4, Number(hEl.value) || 4); };
    if (hEl) hEl.onchange = function () { applySize(Number(wEl.value) || 4, Number(hEl.value) || 4); };
    if (matchBtn) matchBtn.onclick = function () {
      var src = tpl.fieldBoxes[last.fid][last.idx];
      PDFTPL_SELECTED.forEach(function (s) {
        if (s.fid === last.fid && s.idx === last.idx) return;
        var b = tpl.fieldBoxes[s.fid][s.idx];
        tpl.fieldBoxes[s.fid][s.idx] = Object.assign({}, b, { w: src.w, h: src.h });
      });
      schedulePdfTplSave_(tpl);
      renderEditorPane();
    };
    if (clearBtn) clearBtn.onclick = function () { PDFTPL_SELECTED = []; renderEditorPane(); };
    var condFieldEl = document.getElementById('_pdfBoxCondField');
    var condOpEl = document.getElementById('_pdfBoxCondOp');
    var condValEl = document.getElementById('_pdfBoxCondVal');
    if (condFieldEl) {
      var applyCond = function () {
        var b = tpl.fieldBoxes[last.fid][last.idx];
        var next = Object.assign({}, b);
        if (condFieldEl.value) next.condition = { field: condFieldEl.value, op: condOpEl.value, value: condValEl.value.trim() };
        else delete next.condition;
        tpl.fieldBoxes[last.fid][last.idx] = next;
        schedulePdfTplSave_(tpl);
        renderEditorPane();
      };
      condFieldEl.onchange = applyCond;
      condOpEl.onchange = applyCond;
      condValEl.onchange = applyCond;
    }
  }

  /** Reads a File as base64 and hands it to `fn(base64)`; `fn` returns the server call's promise. */
  function pdfReadFileThen_(file, fn) {
    var reader = new FileReader();
    return new Promise(function (resolve, reject) {
      reader.onload = function () {
        fn(String(reader.result).split(',')[1]).then(resolve, reject);
      };
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  function wirePdfTemplateControls() {
    var templates = EDITING.schema.settings.pdfTemplates || [];

    function uploadAsNewTemplate(file) {
      var addBtn = document.getElementById('_pdfTplAdd');
      // A toast used to stand in here, but it self-dismisses after ~2.6s while this upload +
      // page-rasterization can take a minute for multi-page/Word docs — the message vanished
      // long before the work was done. A busy button persists exactly as long as the call does.
      var orig = setBusy_(addBtn, 'Uploading & preparing pages…');
      return pdfReadFileThen_(file, function (b64) { return call('addPdfTemplate', [CURRENT_CONTEXT_ID, EDITING.meta.id, file.name, file.type, b64]); })
        .then(function (r) {
          EDITING.schema.settings.pdfTemplates = r.pdfTemplates;
          PDFTPL_ACTIVE = r.pdfTemplates[r.pdfTemplates.length - 1].id;
          PDFTPL_PAGE = 0; PDFTPL_ARM = ''; PDFTPL_SELECTED = [];
          renderEditorPane(); // rebuilds _pdfTplAdd fresh, clearing the busy state
        }).catch(function (e) { clearBusy_(addBtn, orig); alertErr(e); });
    }

    document.getElementById('_pdfTplAdd').onclick = function () { document.getElementById('_pdfTplAddFile').click(); };
    document.getElementById('_pdfTplAddFile').onchange = function (e) {
      var file = e.target.files[0]; if (!file) return;
      uploadAsNewTemplate(file);
    };

    document.querySelectorAll('[data-pause]').forEach(function (b) {
      b.onclick = function () {
        var tid = b.getAttribute('data-pause');
        var t = templates.filter(function (x) { return x.id === tid; })[0];
        cancelPdfTplSave_(tid); // we're about to send fresher data for this id ourselves
        call('savePdfTemplateMapping', [CURRENT_CONTEXT_ID, EDITING.meta.id, tid, t.fieldBoxes, !t.enabled, t.calcFields || {}]).then(function (r) {
          EDITING.schema.settings.pdfTemplates = r.pdfTemplates;
          renderEditorPane();
        }).catch(alertErr);
      };
    });

    document.querySelectorAll('[data-rename]').forEach(function (b) {
      b.onclick = function () {
        var tid = b.getAttribute('data-rename');
        var t = templates.filter(function (x) { return x.id === tid; })[0];
        FormsUI.prompt('Rename document', { value: t.name, okLabel: 'Rename' }).then(function (name) {
          if (name === null) return;
          name = name.trim();
          if (!name || name === t.name) return;
          call('renamePdfTemplate', [CURRENT_CONTEXT_ID, EDITING.meta.id, tid, name]).then(function (r) {
            EDITING.schema.settings.pdfTemplates = r.pdfTemplates;
            renderEditorPane();
          }).catch(alertErr);
        });
      };
    });
    document.querySelectorAll('[data-replace]').forEach(function (b) {
      b.onclick = function () {
        var tid = b.getAttribute('data-replace');
        document.querySelector('[data-replace-file="' + tid + '"]').click();
      };
    });
    document.querySelectorAll('[data-replace-file]').forEach(function (input) {
      input.onchange = function (e) {
        var tid = input.getAttribute('data-replace-file');
        var file = e.target.files[0]; if (!file) return;
        FormsUI.confirm('Replace this document?', 'Your field placement is kept — you’ll need to Export All Templates once afterward before this document is used in submissions again.', 'Replace').then(function (ok) {
          if (!ok) { e.target.value = ''; return; }
          cancelPdfTplSave_(tid);
          // Same fix as uploadAsNewTemplate above: a self-dismissing toast used to stand in for
          // this call, which vanished well before the upload + rasterization actually finished.
          var replaceBtn = document.querySelector('[data-replace="' + tid + '"]');
          var orig = setBusy_(replaceBtn, 'Uploading…');
          pdfReadFileThen_(file, function (b64) { return call('replacePdfTemplateSource', [CURRENT_CONTEXT_ID, EDITING.meta.id, tid, file.name, file.type, b64]); })
            .then(function (r) {
              EDITING.schema.settings.pdfTemplates = r.pdfTemplates;
              PDFTPL_PAGE = 0; PDFTPL_ARM = ''; PDFTPL_SELECTED = [];
              renderEditorPane(); // rebuilds the Replace button fresh, clearing the busy state
            }).catch(function (e) { clearBusy_(replaceBtn, orig); alertErr(e); });
        });
      };
    });

    document.querySelectorAll('[data-delete]').forEach(function (b) {
      b.onclick = function () {
        var tid = b.getAttribute('data-delete');
        var t = templates.filter(function (x) { return x.id === tid; })[0];
        FormsUI.confirm('Delete "' + t.name + '"?', 'This removes its uploaded document and field placement — submissions already sent are unaffected.', 'Delete').then(function (ok) {
          if (!ok) return;
          cancelPdfTplSave_(tid);
          call('deletePdfTemplate', [CURRENT_CONTEXT_ID, EDITING.meta.id, tid]).then(function (r) {
            EDITING.schema.settings.pdfTemplates = r.pdfTemplates;
            if (PDFTPL_ACTIVE === tid) PDFTPL_ACTIVE = '';
            renderEditorPane();
          }).catch(alertErr);
        });
      };
    });

    if (!templates.length) return;

    var tpl = pdfActiveTemplate_();

    document.querySelectorAll('.pdftpl-tpl-chip').forEach(function (b) {
      b.onclick = function () { PDFTPL_ACTIVE = b.getAttribute('data-tid'); PDFTPL_PAGE = 0; PDFTPL_ARM = ''; PDFTPL_SELECTED = []; renderEditorPane(); };
    });

    document.querySelectorAll('.pdftpl-pagetabs button').forEach(function (b) {
      b.onclick = function () { PDFTPL_PAGE = Number(b.getAttribute('data-pg')); PDFTPL_ARM = ''; PDFTPL_SELECTED = []; renderEditorPane(); };
    });

    document.querySelectorAll('.pdftpl-field').forEach(function (el) {
      el.onclick = function () {
        var fid = el.getAttribute('data-fid');
        var opt = el.getAttribute('data-opt') || '';
        if (PDFTPL_ARM === fid && (PDFTPL_ARM_OPTION || '') === opt) { PDFTPL_ARM = ''; PDFTPL_ARM_OPTION = ''; renderEditorPane(); return; }
        PDFTPL_ARM = fid; PDFTPL_ARM_OPTION = opt;
        renderEditorPane();
      };
    });

    wirePdfStageDrawing_(tpl);
    wirePdfSelectionBar_(tpl);

    document.querySelectorAll('.pdftpl-box .del-x').forEach(function (el) {
      el.onclick = function (e) {
        e.stopPropagation();
        var fid = el.getAttribute('data-del');
        var idx = Number(el.getAttribute('data-delidx'));
        tpl.fieldBoxes[fid].splice(idx, 1);
        if (!tpl.fieldBoxes[fid].length) {
          delete tpl.fieldBoxes[fid];
          if (tpl.calcFields) delete tpl.calcFields[fid];
        }
        PDFTPL_SELECTED = []; // indices shifted — stale selection would point at the wrong box
        schedulePdfTplSave_(tpl);
        renderEditorPane();
      };
    });

    var buildAllBtn = document.getElementById('_pdfTplBuildAll');
    if (buildAllBtn) {
      buildAllBtn.onclick = function () {
        var status = document.getElementById('_pdfTplBuildAllStatus');
        buildAllBtn.disabled = true;
        var current = pdfActiveTemplate_();
        if (current) cancelPdfTplSave_(current.id);
        var saveCurrent = current
          ? call('savePdfTemplateMapping', [CURRENT_CONTEXT_ID, EDITING.meta.id, current.id, current.fieldBoxes, current.enabled, current.calcFields || {}])
          : Promise.resolve();
        saveCurrent.then(function () {
          var list = EDITING.schema.settings.pdfTemplates || [];
          var built = 0, failed = [];
          var chain = Promise.resolve();
          list.forEach(function (t, i) {
            chain = chain.then(function () {
              status.textContent = 'Building ' + (i + 1) + ' of ' + list.length + '… (' + t.name + ')';
              return call('buildPdfTemplate', [CURRENT_CONTEXT_ID, EDITING.meta.id, t.id]).then(function (r) {
                EDITING.schema.settings.pdfTemplates = r.pdfTemplates;
                if (r.ok) built++; else failed.push(t.name);
              });
            });
          });
          return chain.then(function () { return { built: built, failed: failed }; });
        }).then(function (res) {
          FormsUI.toast(res.failed.length
            ? res.built + ' built, failed: ' + res.failed.join(', ')
            : res.built + ' template' + (res.built === 1 ? '' : 's') + ' exported');
          buildAllBtn.disabled = false;
          renderEditorPane(); // re-shows the bar with the freshly updated "Last exported" time
        }).catch(function (e) { buildAllBtn.disabled = false; alertErr(e); });
      };
    }
  }

  /** Field-box mapping (and the enabled toggle) is persisted through its OWN dedicated server
   *  call, NOT the generic saveForm/setFormState autosave — saveForm always overwrites
   *  schema.settings with whatever's already stored server-side (see Forms.js), and
   *  setFormState's SETTINGS_BOOLS/STRINGS allowlist has no entry for pdfTemplates either, so
   *  mapper edits would silently vanish on the very first autosave tick otherwise. */
  function schedulePdfTplSave_(tpl) {
    clearTimeout(PDFTPL_SAVE_T[tpl.id]);
    PDFTPL_SAVE_T[tpl.id] = setTimeout(function () {
      delete PDFTPL_SAVE_T[tpl.id];
      call('savePdfTemplateMapping', [CURRENT_CONTEXT_ID, EDITING.meta.id, tpl.id, tpl.fieldBoxes, tpl.enabled, tpl.calcFields || {}]).then(function () {
        PDFTPL_LAST_SAVED[tpl.id] = new Date();
        pdfUpdateSaveStatusEl_();
      }).catch(alertErr);
    }, 700);
  }
  /** The main toolbar's save-status span (next to the global Save button) doubles as the PDF
   *  mapper's OWN save indicator while that tab is active — the mapper saves through its own
   *  dedicated debounced call (schedulePdfTplSave_), not the global Save button, so it needs its
   *  own "did this actually save" feedback rather than borrowing the unrelated Build-tab one. */
  function pdfUpdateSaveStatusEl_() {
    var el = document.getElementById('_pdfTplSaveStatus');
    if (!el) return;
    if (EDITOR_TAB !== 'pdf') { el.style.display = 'none'; return; }
    var tpl = pdfActiveTemplate_();
    el.style.display = tpl ? 'inline-flex' : 'none';
    if (tpl) el.textContent = pdfSaveStatusText_(tpl.id);
  }
  function pdfSaveStatusText_(templateId) {
    var when = PDFTPL_LAST_SAVED[templateId];
    return when ? 'Saved ' + when.toLocaleTimeString() : 'Not saved yet';
  }

  /** Cancels a pending debounced save for one template WITHOUT sending it — call this right
   *  before an action that's about to replace EDITING.schema.settings.pdfTemplates wholesale
   *  from a fresh server response (pause/resume, replace, delete, upload, Export All) when
   *  that same call is itself about to send fresher data for the SAME template id, so the old
   *  timer can't fire later and stomp the newer save with a stale snapshot. */
  function cancelPdfTplSave_(tplId) {
    clearTimeout(PDFTPL_SAVE_T[tplId]);
    delete PDFTPL_SAVE_T[tplId];
  }

  /** Click-drag-to-create on empty stage area; drag-to-move and corner-drag-to-resize on an
   *  existing box. All math is done in PDF points, converted through the stage's rendered
   *  bounding-box size at the moment of interaction (not cached — window can resize mid-drag). */

  function pdfFieldOptionChoices_(f) {
    if (f.type === 'checkboxes' || f.type === 'radio') return f.options || [];
    if (f.type === 'yesno') return ['Yes', 'No'];
    if (f.type === 'multiAnswer') return f.subLabels || [];
    return null;
  }

  /** One row per placeable target — a plain field, or (for checkboxes/radio/yesno/multiAnswer)
   *  one row PER OPTION/sub-row, named after the option/sub-row itself rather than the parent
   *  question, under a non-clickable heading naming the parent question. Lets staff arm and
   *  place each choice directly with no intermediate "which option?" popover. */
  function pdfFieldListRows_(tpl) {
    var rows = [];
    pdfInputFields_().forEach(function (f) {
      var choices = pdfFieldOptionChoices_(f);
      if (choices && choices.length) {
        rows.push({ heading: pdfFieldDisplayLabel_(f) });
        choices.forEach(function (opt) {
          var placed = (tpl.fieldBoxes[f.id] || []).some(function (b) { return b.optionValue === opt; });
          rows.push({ fid: f.id, opt: opt, label: opt, placed: placed, sub: true });
        });
      } else {
        var placed = tpl.fieldBoxes && tpl.fieldBoxes[f.id] && tpl.fieldBoxes[f.id].length > 0;
        rows.push({ fid: f.id, opt: '', label: pdfFieldDisplayLabel_(f), placed: placed, textOnly: (f.type === 'file' || f.type === 'signature') });
      }
    });
    return rows;
  }

  /** A plain click on empty page area (nothing armed) offers a PDF-only calculated overlay —
   *  an existing Number field's answer × a fixed factor (e.g. "tuition per class" × "classes
   *  enrolled"). This is NOT a form field: it never touches schema.fields, never appears in the
   *  Build tab, is never asked of the parent, and is never stored on a submission — it only
   *  paints a computed number onto the exported PDF. Stored in tpl.calcFields (metadata) +
   *  tpl.fieldBoxes (placement, same as a real field's box) so the existing Slides-build pipeline
   *  (which places a text-overlay shape per fieldBoxes key, agnostic of what that key means)
   *  needs no changes. */
  function pdfCalcSourceOptions_() {
    // Not restricted to Number fields — multiply just parses the answer as a number at fill
    // time (0 if it doesn't parse), so any real field can be a source, same eligibility as
    // the PDF mapper's regular field list.
    var eligible = pdfInputFields_();
    if (!eligible.length) return '<option value="">— add a field to this form first —</option>';
    return eligible.map(function (f) { return '<option value="' + esc(f.id) + '">' + esc(pdfFieldDisplayLabel_(f)) + '</option>'; }).join('');
  }
  function pdfCalcDisplayLabel_(calc) {
    var src = fields().filter(function (f) { return f.id === calc.sourceFieldId; })[0];
    var srcLabel = src ? fieldDisplayName_(src) : calc.sourceFieldId;
    return (calc.label || ('= ' + srcLabel + ' × ' + calc.factor));
  }
  function pdfOpenCalcOverlayPopover_(tpl, pt, clientX, clientY) {
    document.querySelectorAll('.pdftpl-newfield-popover').forEach(function (el) { el.remove(); });
    if (!pdfInputFields_().length) {
      FormsUI.toast('Add a field to this form first, then a calculated overlay can multiply its answer.');
      return;
    }
    var pop = document.createElement('div');
    pop.className = 'pdftpl-newfield-popover';
    pop.style.left = Math.min(clientX, window.innerWidth - 240) + 'px';
    pop.style.top = Math.min(clientY, window.innerHeight - 170) + 'px';
    pop.innerHTML =
      '<label class="lbl" style="margin-top:0">PDF-only calculation: one field × a fixed number</label>' +
      '<p class="help" style="margin:0 0 6px">Simpler than the live form’s Calculation field (which can sum several fields) — this only multiplies ONE field’s answer, and never appears on the live form itself.</p>' +
      '<select class="control" id="_pdfCalcSrc" style="margin-bottom:6px;width:100%">' + pdfCalcSourceOptions_() + '</select>' +
      '<input class="control" type="number" step="any" id="_pdfCalcFactor" placeholder="Multiply by (e.g. 13)" value="1" style="width:100%;margin-bottom:6px">' +
      '<input class="control" id="_pdfCalcLabel" placeholder="Label on this box (optional)" style="margin-bottom:8px;width:100%">' +
      '<div class="frow" style="gap:8px">' +
        '<button class="btn sm" id="_pdfCalcAdd">Add overlay</button>' +
        '<button class="btn ghost sm" id="_pdfCalcCancel">Cancel</button>' +
      '</div>';
    document.body.appendChild(pop);
    var srcEl = document.getElementById('_pdfCalcSrc');
    var factorEl = document.getElementById('_pdfCalcFactor');
    var labelEl = document.getElementById('_pdfCalcLabel');
    srcEl.focus();

    function close() { pop.remove(); document.removeEventListener('mousedown', onOutside); }
    function onOutside(ev) { if (!pop.contains(ev.target)) close(); }
    setTimeout(function () { document.addEventListener('mousedown', onOutside); }, 0);

    document.getElementById('_pdfCalcCancel').onclick = close;
    document.getElementById('_pdfCalcAdd').onclick = function () {
      var srcId = srcEl.value;
      if (!srcId) { srcEl.focus(); return; }
      var calcId = 'calc_' + uid();
      tpl.calcFields = tpl.calcFields || {};
      tpl.calcFields[calcId] = { sourceFieldId: srcId, factor: Number(factorEl.value) || 1, label: labelEl.value.trim() };
      tpl.fieldBoxes[calcId] = [{ page: PDFTPL_PAGE, x: pt.x, y: pt.y, w: 120, h: 18 }];
      schedulePdfTplSave_(tpl);
      close();
      renderEditorPane();
    };
    labelEl.onkeydown = function (ev) {
      if (ev.key === 'Enter') document.getElementById('_pdfCalcAdd').click();
      if (ev.key === 'Escape') close();
    };
  }

  function wirePdfStageDrawing_(tpl) {
    var stage = document.getElementById('_pdfTplStage');
    var widthPt = Number(stage.getAttribute('data-w')), heightPt = Number(stage.getAttribute('data-h'));

    function ptFromEvent(e) {
      var r = stage.getBoundingClientRect();
      var x = Math.min(Math.max(0, e.clientX - r.left), r.width);
      var y = Math.min(Math.max(0, e.clientY - r.top), r.height);
      return { x: (x / r.width) * widthPt, y: (y / r.height) * heightPt };
    }

    // Delegated on the stage itself (not bound per-.pdftpl-box element) so a box that appears via
    // ANY code path — full re-render, renderBoxesOnly_, a freshly-created draft — is draggable
    // immediately, with no separate rebind step that could silently be skipped.
    stage.onmousedown = function (e) {
      var hitBox = e.target.closest('.pdftpl-box');
      if (hitBox) {
        if (e.target.classList.contains('del-x')) return; // handled by its own onclick
        e.stopPropagation();
        var fid = hitBox.getAttribute('data-fid');
        var idx = Number(hitBox.getAttribute('data-boxidx'));
        var resizing = e.target.classList.contains('rs');
        var start = ptFromEvent(e);
        var moved = false;
        var orig = { x: tpl.fieldBoxes[fid][idx].x, y: tpl.fieldBoxes[fid][idx].y, w: tpl.fieldBoxes[fid][idx].w, h: tpl.fieldBoxes[fid][idx].h };
        function onMoveExisting(ev) {
          var cur = ptFromEvent(ev);
          var dx = cur.x - start.x, dy = cur.y - start.y;
          if (Math.abs(dx) > 1 || Math.abs(dy) > 1) moved = true;
          var b = tpl.fieldBoxes[fid][idx];
          if (resizing) {
            tpl.fieldBoxes[fid][idx] = { page: b.page, x: orig.x, y: orig.y, w: Math.max(4, orig.w + dx), h: Math.max(4, orig.h + dy), optionValue: b.optionValue };
          } else {
            tpl.fieldBoxes[fid][idx] = { page: b.page, x: orig.x + dx, y: orig.y + dy, w: orig.w, h: orig.h, optionValue: b.optionValue };
          }
          renderBoxesOnly_();
        }
        function onUpExisting(ev) {
          document.removeEventListener('mousemove', onMoveExisting);
          document.removeEventListener('mouseup', onUpExisting);
          if (!moved) {
            // A click, not a drag — select this box instead (shift/cmd-click adds to selection).
            pdfSelectBox_(fid, idx, ev.shiftKey || ev.metaKey || ev.ctrlKey);
            renderEditorPane();
            return;
          }
          schedulePdfTplSave_(tpl);
        }
        document.addEventListener('mousemove', onMoveExisting);
        document.addEventListener('mouseup', onUpExisting);
        return;
      }

      var start = ptFromEvent(e);

      if (PDFTPL_SELECTED.length) {
        // Clicking empty page area while boxes are selected just exits select mode — a click
        // there shouldn't also pop the calc-overlay picker in the same motion.
        PDFTPL_SELECTED = [];
        renderEditorPane();
        return;
      }

      if (!PDFTPL_ARM) {
        // Nothing armed: a click on empty page area offers a PDF-only calculated overlay
        // (an existing field's answer × a fixed factor) — not a real form field.
        pdfOpenCalcOverlayPopover_(tpl, start, e.clientX, e.clientY);
        return;
      }

      var fid = PDFTPL_ARM;
      var optionValue = PDFTPL_ARM_OPTION || undefined;
      var boxes = (tpl.fieldBoxes[fid] = tpl.fieldBoxes[fid] || []);
      boxes.push({ page: PDFTPL_PAGE, x: start.x, y: start.y, w: 120, h: 18, optionValue: optionValue });
      PDFTPL_ARM = '';
      PDFTPL_ARM_OPTION = '';
      schedulePdfTplSave_(tpl);
      renderEditorPane();
    };

    // Cheap redraw during a drag: just this stage's boxes, not the whole tab (field list, page
    // tabs, etc.) — avoids re-binding the drag listeners on every mousemove tick.
    function renderBoxesOnly_() {
      var tplNow = pdfActiveTemplate_();
      var page = tplNow.pages[PDFTPL_PAGE];
      document.querySelectorAll('.pdftpl-box').forEach(function (el) {
        var fid = el.getAttribute('data-fid');
        var idx = Number(el.getAttribute('data-boxidx'));
        var b = tplNow.fieldBoxes[fid] && tplNow.fieldBoxes[fid][idx];
        if (!b) return;
        el.style.left = (b.x / page.widthPt) * 100 + '%';
        el.style.top = (b.y / page.heightPt) * 100 + '%';
        el.style.width = (b.w / page.widthPt) * 100 + '%';
        el.style.height = (b.h / page.heightPt) * 100 + '%';
      });
    }
  }

  function stateFromSettings_(s) {
    // simple keys come from the shared spec (SharedLogic/Logic.js) — same list the server persists
    var st = { lifecycle: s.lifecycle, access: s.access, locked: s.locked,
      maxResponses: Number(s.maxResponses) || 0,
      approval: s.approval || { enabled: false, approvers: [], mode: 'any' },
      notifyEmails: s.notifyEmails, pdfRecipientEmails: s.pdfRecipientEmails, approvedNotifyEmails: s.approvedNotifyEmails };
    SETTINGS_BOOLS.forEach(function (k) { st[k] = !!s[k]; });
    SETTINGS_STRINGS.forEach(function (k) { st[k] = s[k] || ''; });
    return st;
  }
  function markDirty() { DIRTY = true; updateSaveBanner_(); scheduleAutosave(); }

  // Read-only mirror of what a submitter sees — shared by the template library's "Show
  // preview" pane and each field's own collapsed WYSIWYG view in the editor (fieldCard()'s
  // .fcpreview calls pvField_ directly per-field; this wraps the whole-form version).
  function renderSchemaPreviewInto_(host, s) {
    if (!host) return;
    try {
      var h = '<div class="pv-title">' + esc(s.title || 'Untitled form') + '</div>' +
        (s.description ? '<p class="pv-desc">' + esc(s.description) + '</p>' : '');
      var step = 1;
      (s.pages[0].fields || []).forEach(function (f) { h += pvField_(f, s, function () { step++; return step; }); });
      host.innerHTML = '<div class="pv-sheet">' + (h || '<p class="help">Nothing to preview yet.</p>') + '</div>';
    } catch (e) {
      // never fail silently — show the problem where the preview would be
      host.innerHTML = '<p class="notice err">Preview couldn’t render: ' + esc(String(e && e.message || e)) + '</p>';
    }
  }
  function pvField_(f, s, nextStep) {
    if (f.type === 'pageBreak') return '<div class="pv-break">Step ' + nextStep() + (f.label ? ' — ' + esc(f.label) : '') + '</div>';
    if (f.type === 'sectionHeader') return '<div class="section-head">' + esc(f.label) + '</div>';
    if (f.type === 'sectionEnd') return '<hr class="section-end">';
    if (f.type === 'description') return descParagraphs_(f.label).map(function (para, i) {
      return '<p class="desc-block" style="' + esc(descInlineStyle_(descParagraphStyle_(f, i))) + '">' + esc(para) + '</p>';
    }).join('');
    if (f.type === 'faq') {
      return '<div class="faq-block">' + (f.label ? '<div class="section-head">' + esc(f.label) + '</div>' : '') +
        (f.items || []).map(function (it) { return '<details class="faq-item"><summary>' + esc(it.q || '') + '</summary><div class="faq-a">' + esc(it.a || '') + '</div></details>'; }).join('') + '</div>';
    }
    var ctrl = '';
    switch (f.type) {
      case 'textarea': ctrl = '<textarea class="control" disabled placeholder="' + esc(f.placeholder || '') + '"></textarea>'; break;
      case 'dropdown': ctrl = '<select class="control" disabled><option>— Choose —</option></select>'; break;
      case 'studentPicker': ctrl = f.multiple
        ? '<div class="choices"><label class="choice"><input type="checkbox" disabled><span>(the parent’s own students)</span></label></div>'
        : '<select class="control" disabled><option>— Choose student —</option></select>'; break;
      case 'staffPicker': ctrl = '<select class="control" disabled><option>— Choose ' + (f.staffLevel ? f.staffLevel + ' ' : '') + 'staff —</option></select>'; break;
      case 'radio': case 'yesno': {
        var opts = f.type === 'yesno' ? ['Yes', 'No'] : (f.options || []);
        ctrl = '<div class="choices">' + opts.map(function (o) { return '<label class="choice"><input type="radio" disabled><span>' + esc(o) + (f.capacity && f.capacity[o] != null ? ' <em style="color:#999">(max ' + f.capacity[o] + ')</em>' : '') + '</span></label>'; }).join('') + '</div>'; break;
      }
      case 'checkboxes':
        ctrl = '<div class="choices">' + (f.options || []).map(function (o) { return '<label class="choice"><input type="checkbox" disabled><span>' + esc(o) + (f.capacity && f.capacity[o] != null ? ' <em style="color:#999">(max ' + f.capacity[o] + ')</em>' : '') + '</span></label>'; }).join('') + '</div>'; break;
      case 'rating': { var n = f.max || 5, st = ''; for (var i = 0; i < n; i++) st += '☆'; ctrl = '<div style="font-size:1.3rem;color:var(--hcs-gold)">' + st + '</div>'; break; }
      case 'multiAnswer': {
        var maSubs = f.subLabels || [], maReq = f.subRequired || {};
        ctrl = '<div class="multians">' + maSubs.map(function (lbl) {
          return '<div class="mafield"><label class="malabel">' + esc(lbl) + (maReq[lbl] ? '<span class="req">*</span>' : '') + '</label>' +
            multiSubCtrl_(f, true) + '</div>';
        }).join('') + '</div>'; break;
      }
      case 'file': ctrl = '<input type="file" class="control" disabled>'; break;
      case 'signature': ctrl = '<div class="pv-sig">✍ signature box</div>'; break;
      case 'calculation': ctrl = '<div class="calc-value">0</div>' + (f.calc && f.calc.hidden ? '<p class="help">Hidden on the live form — still computed and saved.</p>' : ''); break;
      default: {
        var t = { email: 'email', phone: 'tel', number: 'number', date: 'date', time: 'time' }[f.type] || 'text';
        ctrl = '<input class="control" type="' + t + '" disabled placeholder="' + esc(f.placeholder || '') + '">';
      }
    }
    var cond = '';
    var condRulesForPv = condRules_(f.showIf).rules.filter(function (r) { return r.field; });
    if (condRulesForPv.length) {
      var opTxtMap = { equals: 'is', notEquals: 'is not', contains: 'includes', notEmpty: 'is answered', empty: 'is blank' };
      var condParts = condRulesForPv.map(function (r) {
        // r.field is a plain fieldId, or 'fieldId::subLabel' for a multiAnswer sub-row source.
        var fid = r.field, sub = '', ci = fid.indexOf('::');
        if (ci > -1) { sub = fid.slice(ci + 2); fid = fid.slice(0, ci); }
        var src = fields().filter(function (g) { return g.id === fid; })[0] || {};
        var label = (src.id ? fieldDisplayName_(src) : fid) + (sub ? ' — ' + sub : '');
        return '“' + esc(label) + '” ' + (opTxtMap[r.op] || r.op) + (r.value ? ' “' + esc(r.value) + '”' : '');
      });
      var condJoin = condParts.length > 1 ? (condRules_(f.showIf).mode === 'any' ? ' OR ' : ' AND ') : '';
      cond = '<div class="pv-cond">Shown when ' + condParts.join(condJoin) + '</div>';
    }
    return '<div class="field">' + cond +
      '<label class="fieldlabel">' + esc(f.label || '(no label)') + (f.required ? '<span class="req">*</span>' : '') + '</label>' +
      ctrl + (f.help ? '<div class="help">' + esc(f.help) + '</div>' : '') + '</div>';
  }
  function scheduleAutosave() { if (EDITING && EDITING.structureLocked) return; clearTimeout(AUTOSAVE_T); AUTOSAVE_T = setTimeout(function () { doSave(true); }, 1500); }
  /** Save schema + settings. silent=true for autosave (no toast, no button spinner). Returns a promise. */
  function doSave(silent) {
    if (!EDITING) return Promise.resolve();
    if (SAVING) { scheduleAutosave(); return Promise.resolve(); }
    SAVING = true;
    updateSaveBanner_();
    var s = EDITING.schema.settings;
    var btn = document.getElementById('btnSave');
    if (!silent && btn) { btn.disabled = true; btn.innerHTML = '<span class="spinner"></span> Saving…'; }
    var save1 = EDITING.structureLocked ? Promise.resolve({ ok: true }) : call('saveForm', [CURRENT_CONTEXT_ID, EDITING.meta.id, EDITING.schema, EDITING.meta.version]);
    return save1
      .then(function (r1) {
        if (r1 && r1.version != null) EDITING.meta.version = r1.version;
        return call('setFormState', [CURRENT_CONTEXT_ID, EDITING.meta.id, stateFromSettings_(s), EDITING.meta.version]);
      })
      .then(function (res) {
        SAVING = false; DIRTY = false; LAST_SAVED_AT = new Date();
        SAVE_ERROR = ''; SAVE_ERROR_RELOADABLE = false;
        updateSaveBanner_(); if (btn) { btn.disabled = false; btn.textContent = 'Save'; }
        if (res && res.meta && res.meta.version != null) EDITING.meta.version = res.meta.version;
        if (res && res.droppedNotify && res.droppedNotify.length) {
          // off-domain notify addresses are never stored (parent/student PII stays in-house)
          var dropped = res.droppedNotify.map(function (x) { return String(x).toLowerCase(); });
          s.notifyEmails = (s.notifyEmails || []).filter(function (e) { return dropped.indexOf(String(e).toLowerCase()) < 0; });
          var nEl = document.getElementById('sNotify'); if (nEl) nEl.value = (s.notifyEmails || []).join(', ');
          // A silently-unsubscribed notification recipient is exactly the thing that must NOT
          // vanish in 2.6 seconds — latch it into the Notifications card until dismissed.
          var warnEl = document.getElementById('sNotifyWarn');
          if (warnEl) {
            warnEl.style.display = 'block';
            warnEl.innerHTML = 'Removed — not an allowed (' + esc(domainsLabel_()) + ') address, so it was not saved: <strong>' +
              esc(res.droppedNotify.join(', ')) + '</strong>. Parent/student data stays in-house, so notifications can only go to school addresses.';
          } else {
            FormsUI.toast('Removed non-HCS notify address: ' + res.droppedNotify.join(', '));
          }
        } else if (res && res.droppedPdfRecipients && res.droppedPdfRecipients.length) {
          var droppedPdf = res.droppedPdfRecipients.map(function (x) { return String(x).toLowerCase(); });
          s.pdfRecipientEmails = (s.pdfRecipientEmails || []).filter(function (e) { return droppedPdf.indexOf(String(e).toLowerCase()) < 0; });
          var pEl = document.getElementById('sPdfRecipients'); if (pEl) pEl.value = (s.pdfRecipientEmails || []).join(', ');
          var pWarnEl = document.getElementById('sPdfRecipientsWarn');
          if (pWarnEl) {
            pWarnEl.style.display = 'block';
            pWarnEl.innerHTML = 'Removed — not an allowed (' + esc(domainsLabel_()) + ') address, so it was not saved: <strong>' +
              esc(res.droppedPdfRecipients.join(', ')) + '</strong>.';
          } else {
            FormsUI.toast('Removed non-HCS PDF recipient: ' + res.droppedPdfRecipients.join(', '));
          }
        } else if (res && res.droppedApprovedNotify && res.droppedApprovedNotify.length) {
          var droppedAp = res.droppedApprovedNotify.map(function (x) { return String(x).toLowerCase(); });
          s.approvedNotifyEmails = (s.approvedNotifyEmails || []).filter(function (e) { return droppedAp.indexOf(String(e).toLowerCase()) < 0; });
          var aEl = document.getElementById('aApprovedNotify'); if (aEl) aEl.value = (s.approvedNotifyEmails || []).join(', ');
          var aWarnEl = document.getElementById('aApprovedNotifyWarn');
          if (aWarnEl) {
            aWarnEl.style.display = 'block';
            aWarnEl.innerHTML = 'Removed — not an allowed (' + esc(domainsLabel_()) + ') address, so it was not saved: <strong>' +
              esc(res.droppedApprovedNotify.join(', ')) + '</strong>.';
          } else {
            FormsUI.toast('Removed non-HCS approval recipient: ' + res.droppedApprovedNotify.join(', '));
          }
        } else if (!silent) FormsUI.toast('Saved');
      })
      .catch(function (e) {
        SAVING = false; if (btn) { btn.disabled = false; btn.textContent = 'Save'; }
        var code = String(e && e.message || e);
        // A FAILED autosave must never be silent. It used to be: silent mode swallowed the
        // modal, so a CONFLICT (someone else saved) left only the banner flipping back to
        // "Unsaved changes" with no reason — and the next autosave would overwrite their work.
        // The banner now latches into an error state for both paths; the modal stays
        // manual-save-only so typing isn't interrupted every 1.5s.
        SAVE_ERROR = friendlyError(code);
        SAVE_ERROR_RELOADABLE = (code === 'CONFLICT');
        updateSaveBanner_();
        if (!silent) FormsUI.modal('Couldn’t save', esc(SAVE_ERROR));
      });
  }
  function saveAll() { return doSave(false); }

  // ---------- responses ----------
  /** Render a response cell: Drive/file URLs become clickable links, everything else escapes. */
  function respCellHtml(c) {
    var s = String(c == null ? '' : c);
    if (!/https?:\/\//.test(s)) return esc(s);
    var n = 0;
    return s.split(/\s*\|\s*|\s+/).filter(Boolean).map(function (tok) {
      if (/^https?:\/\//.test(tok)) { n++; return '<a href="' + esc(tok) + '" target="_blank" rel="noopener">file ' + n + ' ↗</a>'; }
      return esc(tok);
    }).join(' ');
  }

  var RESP_PAGE_SIZE = 100;   // newest-N loaded by default
  var RESP_LOAD_ALL = 5000;   // "Load all responses" ceiling — beyond this, use the Sheet/CSV

  function openResponses(formId, limit) {
    chrome(LOADING_HTML_ + 'Loading responses…</p>');
    call('getResponses', [CURRENT_CONTEXT_ID, formId, limit || RESP_PAGE_SIZE]).then(function (r) {
      // S13: an approver reaching this view (not the form's owner/admin) gets read-only access —
      // no CSV export, no raw Sheet link, per the locked decision. r.canManage is false for them.
      var head = '<div style="display:flex;align-items:center;gap:10px;margin:16px 0">' +
        '<button class="btn ghost sm" id="back">← Back</button>' +
        '<h1 class="form-title" style="margin:0;font-size:1.2rem">Responses (' + r.count + ')</h1>' +
        (r.canManage ? '<button class="btn ghost sm" id="exportCsv" style="margin-left:auto">Export CSV</button>' : '') +
        (r.canManage ? '<button class="btn ghost sm" id="rebuildSheet">Rebuild sheet</button>' : '') +
        (r.canManage ? '<button class="btn ghost sm" id="renameFolders">Rename Drive folders</button>' : '') +
        (ME && ME.isAdmin ? '<button class="btn ghost sm" id="rebuildAllPdfs">Rebuild all PDFs</button>' : '') +
        (ME && ME.isAdmin ? '<button class="btn ghost sm" id="undoLastPdfRebuild">Undo last rebuild</button>' : '') +
        (r.canManage && r.sheetUrl ? '<a class="btn ghost sm" style="text-decoration:none" target="_blank" href="' + esc(r.sheetUrl) + '">Open Sheet ↗</a>' : '') + '</div>';
      var statusIdx = r.headers.indexOf('Status');
      var submIdx = r.headers.indexOf('SubmissionID');
      var statuses = [];
      var pendingLoadedCount = 0;
      if (statusIdx > -1) r.rows.forEach(function (row) {
        var v = String(row[statusIdx] || '');
        if (v && statuses.indexOf(v) === -1) statuses.push(v);
        if (v === 'Pending Approval') pendingLoadedCount++;
      });
      // Approve/Reject shows up as an extra column whenever ANY row across the WHOLE sheet is
      // Pending Approval (S15 — r.pendingApprovalCount is computed server-side over every row,
      // not just what's loaded), not only when a currently-loaded row happens to be pending —
      // otherwise an old pending decision could silently hide behind the truncated table.
      var hasApprovals = r.pendingApprovalCount > 0;
      // Admin-only: rebuild a submission's PDF template output from its already-stored answers
      // (e.g. after fixing a field mapping) without touching the response row or re-emailing.
      var canRebuildPdf = !!(ME && ME.isAdmin) && submIdx > -1;
      // Any manager (owner or admin) can grab a copyable edit/withdraw link — e.g. for a
      // response recorded before "Allow edit" was turned on, whose respondent never got one at
      // submit time. No email is sent — staff copy it and deliver it however they choose.
      // Server enforces allowEdit/editable-status; the button just offers it.
      var canGetEditLink = r.canManage && submIdx > -1;
      // Never let the table imply it holds everything. Search/filter below run purely
      // client-side over `r.rows`, so if that's a subset the person searching has to know it —
      // otherwise an older response reads as "doesn't exist" (see Forms.js's getResponses).
      var hiddenPending = r.pendingApprovalCount - pendingLoadedCount;
      var truncNotice = !r.truncated ? '' :
        '<div class="notice info" style="margin-bottom:12px;display:flex;align-items:center;gap:12px;flex-wrap:wrap">' +
          '<span style="flex:1;min-width:220px">Showing the <strong>newest ' + r.shown + '</strong> of <strong>' + r.count +
          '</strong> responses. Search and filters below only look at these ' + r.shown + '.' +
          (hiddenPending > 0 ? ' <strong>' + hiddenPending + ' response' + (hiddenPending === 1 ? '' : 's') + ' awaiting approval aren’t in this view.</strong>' : '') +
          '</span>' +
          (r.count <= RESP_LOAD_ALL
            ? '<button class="btn sm" id="respLoadAll" type="button">Load all ' + r.count + '</button>'
            : '<span class="help" style="margin:0">Too many to load here — use <strong>Export CSV</strong> or <strong>Open Sheet</strong>.</span>') +
        '</div>';
      var searchPlaceholder = r.truncated
        ? 'Search these ' + r.shown + ' responses…'
        : 'Search responses (name, student, email…)';
      var toolbar = !r.rows.length ? '' :
        '<div class="toolbar"><input id="rSearch" type="search" placeholder="' + esc(searchPlaceholder) + '" aria-label="Search responses">' +
        (statuses.length > 1 ? '<select id="rStatus" aria-label="Filter by status"><option value="">All statuses</option>' + statuses.map(function (v) { return '<option>' + esc(v) + '</option>'; }).join('') + '</select>' : '') + '</div>';
      chrome(head + truncNotice + toolbar + '<div id="rwrap"></div>');
      document.getElementById('back').onclick = renderDashboard;
      var loadAllBtn = document.getElementById('respLoadAll');
      if (loadAllBtn) loadAllBtn.onclick = function () {
        setBusy_(loadAllBtn, 'Loading…');
        openResponses(formId, RESP_LOAD_ALL);
      };

      var draw = function () {
        var qEl = document.getElementById('rSearch'), sEl = document.getElementById('rStatus');
        var q = qEl ? qEl.value.toLowerCase() : '', st = sEl ? sEl.value : '';
        var list = r.rows.map(function (row, i) { return { row: row, i: i }; }).filter(function (x) {
          if (st && statusIdx > -1 && String(x.row[statusIdx]) !== st) return false;
          if (q && !x.row.some(function (c) { return String(c).toLowerCase().indexOf(q) > -1; })) return false;
          return true;
        });
        document.getElementById('rwrap').innerHTML = !r.rows.length ? '<p class="help">No responses yet.</p>' :
          !list.length ? '<p class="help">No responses match.</p>' :
          '<p class="help" style="margin:0 0 6px">Click a row to see the full response.</p>' +
          '<div style="overflow:auto"><table class="rtable"><thead><tr>' +
            r.headers.map(function (h) { return '<th>' + esc(h) + '</th>'; }).join('') + (hasApprovals ? '<th>Approve</th>' : '') + (canRebuildPdf ? '<th>PDF</th>' : '') + (canGetEditLink ? '<th>Edit link</th>' : '') + '</tr></thead><tbody>' +
            list.map(function (x) {
              var pending = statusIdx > -1 && String(x.row[statusIdx]) === 'Pending Approval';
              var decideTd = !hasApprovals ? '' : '<td>' + (pending && submIdx > -1
                ? '<button class="btn sm" data-decide="Approved" data-sid="' + esc(x.row[submIdx]) + '">Approve</button> ' +
                  '<button class="btn ghost sm" data-decide="Rejected" data-sid="' + esc(x.row[submIdx]) + '">Reject</button>'
                : '') + '</td>';
              var pdfTd = !canRebuildPdf ? '' : '<td><button class="btn ghost sm" data-rebuildpdf data-sid="' + esc(x.row[submIdx]) + '">Rebuild PDF</button></td>';
              var editLinkTd = !canGetEditLink ? '' : '<td><button class="btn ghost sm" data-editlink data-sid="' + esc(x.row[submIdx]) + '">Copy edit link</button></td>';
              return '<tr data-ri="' + x.i + '" tabindex="0">' + x.row.map(function (c) { return '<td>' + respCellHtml(c) + '</td>'; }).join('') + decideTd + pdfTd + editLinkTd + '</tr>';
            }).join('') +
            '</tbody></table></div>';
        document.querySelectorAll('.rtable tr[data-ri]').forEach(function (tr) {
          var open = function (e) {
            if (e.target && (e.target.tagName === 'A' || e.target.closest('button'))) return; // let file links / decide buttons click through
            var row = r.rows[Number(tr.getAttribute('data-ri'))];
            var body = '<table style="border-collapse:collapse;font-size:.88rem">' + r.headers.map(function (h, ci) {
              var v = row[ci];
              if (v === '' || v == null) return '';
              return '<tr><td style="padding:5px 12px 5px 0;color:#666;vertical-align:top;white-space:nowrap">' + esc(h) + '</td><td style="padding:5px 0">' + respCellHtml(v) + '</td></tr>';
            }).join('') + '</table>';
            modalWith('Response detail', body, null, null);
          };
          tr.onclick = open;
          tr.onkeydown = function (e) { if (e.key === 'Enter') open(e); };
        });
        document.querySelectorAll('.rtable [data-decide]').forEach(function (b) {
          b.onclick = function (e) {
            e.stopPropagation();
            var sid = b.getAttribute('data-sid'), decision = b.getAttribute('data-decide');
            FormsUI.prompt(decision, { body: '<p class="help">Add a note for the submitter (optional).</p>', placeholder: 'Note (optional)', okLabel: decision, multiline: true }).then(function (comment) {
              if (comment === null) return;
              b.disabled = true;
              call('decideApproval', [CURRENT_CONTEXT_ID, formId, sid, decision, comment]).then(function (res) {
                if (!res.ok) { b.disabled = false; return FormsUI.modal('Couldn’t save decision', esc(res.message || 'Error')); }
                var row = r.rows.filter(function (x) { return String(x[submIdx]) === sid; })[0];
                if (row && statusIdx > -1) row[statusIdx] = res.status;
                FormsUI.toast('Marked ' + res.status);
                draw();
              }).catch(function (e2) { b.disabled = false; alertErr(e2); });
            });
          };
        });
        document.querySelectorAll('.rtable [data-rebuildpdf]').forEach(function (b) {
          b.onclick = function (e) {
            e.stopPropagation();
            var sid = b.getAttribute('data-sid');
            FormsUI.confirm('Rebuild this submission’s PDF?',
              'Re-fills the PDF template(s) from this submission’s stored answers and replaces the file kept in Drive. The response itself isn’t changed and no email is sent.',
              'Rebuild').then(function (ok) {
              if (!ok) return;
              b.disabled = true; var origLabel = b.textContent; b.textContent = 'Rebuilding…';
              call('adminRebuildSubmissionPdf', [CURRENT_CONTEXT_ID, formId, sid]).then(function (res) {
                b.disabled = false; b.textContent = origLabel;
                if (!res.pdfCopies || !res.pdfCopies.length) {
                  return FormsUI.modal('No PDF produced', res.pdfCopiesOverCap
                    ? 'The rebuilt PDF(s) were too large to return — check the template.'
                    : 'No enabled/built PDF template produced a file for this submission.');
                }
                res.pdfCopies.forEach(function (f) {
                  var bytes = atob(f.b64), arr = new Uint8Array(bytes.length);
                  for (var i2 = 0; i2 < bytes.length; i2++) arr[i2] = bytes.charCodeAt(i2);
                  var blob = new Blob([arr], { type: 'application/pdf' });
                  var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = f.name; a.click();
                  setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
                });
                FormsUI.toast('PDF rebuilt');
              }).catch(function (e2) { b.disabled = false; b.textContent = origLabel; alertErr(e2); });
            });
          };
        });
        document.querySelectorAll('.rtable [data-editlink]').forEach(function (b) {
          b.onclick = function (e) {
            e.stopPropagation();
            var sid = b.getAttribute('data-sid');
            b.disabled = true; var origLabel = b.textContent; b.textContent = 'Loading…';
            call('adminGetEditLink', [CURRENT_CONTEXT_ID, formId, sid]).then(function (res) {
              b.disabled = false; b.textContent = origLabel;
              if (!res.ok) {
                var msg = { 'edit-disabled': 'This form’s “Allow edit” setting is off.',
                  'not-found': 'That submission no longer exists.',
                  'not-editable': 'This response has already been decided or withdrawn.',
                  'no-runner-url': 'No runner URL is configured for this form yet.',
                  'not-configured': 'This school’s setup isn’t finished yet — an admin needs to run setupEditLinkSecret_() once and copy the value to every app (see gas-shared/AuthKit.js) before a link can be minted from here.'
                }[res.reason] || ('Couldn’t build the link (' + res.reason + ').');
                return FormsUI.modal('Couldn’t get edit link', esc(msg));
              }
              // No email is sent — copy-only, so staff decide how (and whether) to deliver it.
              var body = (res.respondentEmail ? '<p class="help" style="margin-bottom:8px">Respondent: ' + esc(res.respondentEmail) + '</p>' : '') +
                '<input class="control" id="_editlinkurl" readonly value="' + esc(res.link) + '" style="margin-bottom:8px">' +
                '<button class="btn block sm" id="_editlinkcopy" type="button">Copy link</button>';
              var ov = modalWith('Edit link', body, null);
              ov.querySelector('#_editlinkcopy').onclick = function () {
                var i = ov.querySelector('#_editlinkurl'); i.select();
                try { document.execCommand('copy'); } catch (e2) {}
                try { navigator.clipboard.writeText(i.value); } catch (e2) {}
                FormsUI.toast('Link copied');
              };
            }).catch(function (e2) { b.disabled = false; b.textContent = origLabel; alertErr(e2); });
          };
        });
      };
      var qEl2 = document.getElementById('rSearch'); if (qEl2) qEl2.oninput = draw;
      var sEl2 = document.getElementById('rStatus'); if (sEl2) sEl2.onchange = draw;
      draw();
      var ex = document.getElementById('exportCsv');
      if (ex) ex.onclick = function () {
        call('exportResponsesCsv', [CURRENT_CONTEXT_ID, formId]).then(function (res) {
          var blob = new Blob([res.csv], { type: 'text/csv;charset=utf-8' });
          var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = res.filename; a.click();
          setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
        }).catch(alertErr);
      };
      var renameBtn = document.getElementById('renameFolders');
      if (renameBtn) renameBtn.onclick = function () {
        FormsUI.confirm('Rename old Drive folders?',
          'Renames every submission’s Uploads folder that still uses the raw submission id to match this form’s current human-readable Drive naming setting. Files aren’t moved or merged — only the folder name changes. Requires "Human-readable Drive naming" to be turned on for this form.',
          'Rename').then(function (goOn) {
          if (!goOn) return;
          renameBtn.disabled = true; var origLabel = renameBtn.textContent; renameBtn.textContent = 'Renaming…';
          call('adminRenameSubmissionFolders', [CURRENT_CONTEXT_ID, formId]).then(function (res) {
            renameBtn.disabled = false; renameBtn.textContent = origLabel;
            if (!res.ok) return FormsUI.modal('Couldn’t rename folders', esc(res.reason || 'Error'));
            if (res.message) return FormsUI.modal('Nothing to rename', esc(res.message));
            FormsUI.toast('Renamed ' + res.renamed + ' folder' + (res.renamed === 1 ? '' : 's') +
              (res.skipped ? ', skipped ' + res.skipped : ''));
            if (res.duplicates) FormsUI.modal('Needs a manual look',
              esc(res.duplicates + ' submission' + (res.duplicates === 1 ? '' : 's') + ' already had more than one Drive folder ' +
              'sharing the same name — skipped rather than guessed at. Open the form’s Uploads folder in Drive to sort those out by hand.'));
          }).catch(function (e2) { renameBtn.disabled = false; renameBtn.textContent = origLabel; alertErr(e2); });
        });
      };
      var rebuildAllBtn = document.getElementById('rebuildAllPdfs');
      if (rebuildAllBtn) rebuildAllBtn.onclick = function () {
        FormsUI.confirm('Rebuild every submission’s PDF?',
          'Re-fills the PDF template(s) from EVERY submission’s stored answers on this form — e.g. after fixing a field mapping. Nothing is deleted: each submission keeps its original PDF(s), and the rebuilt copy is saved alongside it with a "(rebuilt …)" timestamp in its name. No response data changes and no email is sent. Large forms may take a while.',
          'Rebuild all').then(function (goOn) {
          if (!goOn) return;
          rebuildAllBtn.disabled = true; var origLabel = rebuildAllBtn.textContent; rebuildAllBtn.textContent = 'Rebuilding…';
          call('adminRebuildAllSubmissionPdfs', [CURRENT_CONTEXT_ID, formId]).then(function (res) {
            rebuildAllBtn.disabled = false; rebuildAllBtn.textContent = origLabel;
            if (!res.ok) return FormsUI.modal('Couldn’t rebuild PDFs', esc(res.reason || 'Error'));
            FormsUI.toast('Rebuilt ' + res.rebuilt + ' submission' + (res.rebuilt === 1 ? '' : 's') +
              (res.skipped ? ', ' + res.skipped + ' produced no PDF' : '') +
              (res.failed ? ', ' + res.failed + ' failed' : ''));
          }).catch(function (e2) { rebuildAllBtn.disabled = false; rebuildAllBtn.textContent = origLabel; alertErr(e2); });
        });
      };
      var undoRebuildBtn = document.getElementById('undoLastPdfRebuild');
      if (undoRebuildBtn) undoRebuildBtn.onclick = function () {
        FormsUI.confirm('Remove the last rebuild’s PDFs?',
          'Deletes (to Trash) only the PDF copies created by the most recent "Rebuild all PDFs" run on this form — every submission’s ORIGINAL PDF is untouched. Only works once per rebuild; there’s nothing to undo if you’ve already undone this round or nothing’s been rebuilt since.',
          'Remove them').then(function (goOn) {
          if (!goOn) return;
          undoRebuildBtn.disabled = true; var origLabel = undoRebuildBtn.textContent; undoRebuildBtn.textContent = 'Removing…';
          call('adminDeleteLastPdfRebuild', [CURRENT_CONTEXT_ID, formId]).then(function (res) {
            undoRebuildBtn.disabled = false; undoRebuildBtn.textContent = origLabel;
            if (!res.ok) {
              return FormsUI.modal('Nothing to undo', res.reason === 'no-last-rebuild'
                ? 'There’s no recent "Rebuild all PDFs" run to undo for this form.'
                : esc(res.reason || 'Error'));
            }
            FormsUI.toast('Removed ' + res.deleted + ' rebuilt PDF' + (res.deleted === 1 ? '' : 's') + ' (sent to Trash)');
          }).catch(function (e2) { undoRebuildBtn.disabled = false; undoRebuildBtn.textContent = origLabel; alertErr(e2); });
        });
      };
      var rebuildBtn = document.getElementById('rebuildSheet');
      if (rebuildBtn) rebuildBtn.onclick = function () {
        rebuildBtn.disabled = true;
        rebuildBtn.innerHTML = '<span class="spinner"></span> Checking...';
        call('adminMigrateResponseSheet', [CURRENT_CONTEXT_ID, formId]).then(function (rep) {
          rebuildBtn.disabled = false; rebuildBtn.textContent = 'Rebuild sheet';
          if (rep && rep.alreadyV3) {
            modalWith('Nothing to do', '<p>This sheet is already in the current layout.</p>', '', null);
            return;
          }
          if (!rep || !rep.ok) {
            var why = (rep && rep.reason === 'v1-sheet')
              ? 'This form still has a pre-v2 sheet, which holds no live responses. It cannot be rebuilt.'
              : (rep && rep.reason === 'no-sheet')
              ? 'This form has no responses yet, so there is nothing to rebuild.'
              : 'Could not read this form’s Responses sheet.';
            modalWith('Can’t rebuild', '<div class="notice err">' + esc(why) + '</div>', '', null);
            return;
          }
          var years = Object.keys(rep.yearCounts || {}).sort().map(function (y) {
            return '<li><strong>' + esc(y) + '</strong> - ' + rep.yearCounts[y] + ' response' + (rep.yearCounts[y] === 1 ? '' : 's') + '</li>';
          }).join('');
          var body =
            '<p>This builds a <strong>new</strong> Responses spreadsheet with a School Year column and one column per multiple-choice option. The current sheet is kept, renamed, in this form’s Drive folder.</p>' +
            '<p><strong>' + rep.rowsRead + '</strong> response' + (rep.rowsRead === 1 ? '' : 's') + ' would be carried over into <strong>' + (rep.columns || []).length + '</strong> answer columns.</p>' +
            (years ? '<p class="help" style="margin:10px 0 4px">School year that would be stamped:</p><ul style="margin:0 0 10px 18px">' + years + '</ul>' : '') +
            (rep.blankYear ? '<div class="notice info"><strong>' + rep.blankYear + '</strong> response' + (rep.blankYear === 1 ? ' has' : 's have') + ' no usable date, so School Year is left blank for ' + (rep.blankYear === 1 ? 'it' : 'them') + '.</div>' : '') +
            (rep.orphans && rep.orphans.length
              ? '<div class="notice info">' + rep.orphans.length + ' column' + (rep.orphans.length === 1 ? '' : 's') + ' belong' + (rep.orphans.length === 1 ? 's' : '') + ' to question' + (rep.orphans.length === 1 ? '' : 's') + ' no longer on this form: ' +
                esc(rep.orphans.map(function (o) { return o.label; }).join(', ')) +
                '. Their answers are kept, in columns prefixed “Retired”.</div>'
              : '') +
            (rep.unmapped && rep.unmapped.length
              ? '<div class="notice info">Some stored answers no longer match any current option and will not be carried into the new columns: ' +
                esc(rep.unmapped.map(function (u) { return u.value + ' (' + u.count + ')'; }).join(', ')) +
                '. They stay in the old sheet. Check the form’s options if this is unexpected.</div>'
              : '') +
            '<p class="help">Existing edit and approval links keep working - responses keep their reference numbers.</p>';
          modalWith('Rebuild this Responses sheet?', body, 'Rebuild', function () {
            return call('adminMigrateResponseSheet', [CURRENT_CONTEXT_ID, formId, { apply: true }]).then(function (res) {
              if (!res || !res.ok) {
                throw new Error(res && res.reason === 'raced'
                  ? 'A response came in while this was being prepared. Nothing changed - try again.'
                  : 'The rebuild did not complete. Nothing was changed.');
              }
              openResponses(formId);
            });
          });
        }).catch(function (e) {
          rebuildBtn.disabled = false; rebuildBtn.textContent = 'Rebuild sheet';
          modalWith('Can’t rebuild', '<div class="notice err">' + esc(String(e && e.message || e)) + '</div>', '', null);
        });
      };
    }).catch(alertErr);
  }

  // Every .catch(alertErr) in this file funnels through here, so mapping codes to sentences
  // once (friendlyError, Logic.js) fixes the raw-"DENIED"-in-a-modal problem everywhere at once.
  function alertErr(e) { FormsUI.modal('Something went wrong', esc(friendlyError(e))); }
})();
</script>
