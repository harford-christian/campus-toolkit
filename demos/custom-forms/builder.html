  /* FormsUI — tiny dependency-free client helpers shared by builder + runner. */
  var FormsUI = (function () {
    // textContent→innerHTML escapes & < > but NOT quotes, and esc() output is interpolated into
    // quoted attributes (value="…", data-*="…") all over — so escape both quote kinds too.
    function esc(s){ var d=document.createElement('div'); d.textContent = (s==null?'':String(s)); return d.innerHTML.replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
    function toast(msg, ms){ var t=document.createElement('div'); t.className='toast'; t.setAttribute('role','status'); t.setAttribute('aria-live','polite'); t.textContent=msg;
      document.body.appendChild(t); setTimeout(function(){ t.remove(); }, ms||2600); }
    function el(tag, attrs, html){ var e=document.createElement(tag);
      if(attrs) Object.keys(attrs).forEach(function(k){ e.setAttribute(k, attrs[k]); });
      if(html!=null) e.innerHTML=html; return e; }
    function trap_(ov){
      ov.addEventListener('keydown', function(e){
        if(e.key!=='Tab') return;
        var f=ov.querySelectorAll('button,input,select,textarea,a[href]'); if(!f.length) return;
        var first=f[0], last=f[f.length-1];
        if(e.shiftKey && document.activeElement===first){ e.preventDefault(); last.focus(); }
        else if(!e.shiftKey && document.activeElement===last){ e.preventDefault(); first.focus(); }
      });
    }
    function modal(title, bodyHtml, btnLabel){
      return new Promise(function(resolve){
        var ov=document.createElement('div'); ov.className='modal-overlay';
        ov.innerHTML='<div class="modal" role="dialog" aria-modal="true" aria-label="'+esc(title)+'"><h3>'+esc(title)+'</h3><div class="mbody">'+bodyHtml+'</div><button class="btn block">'+esc(btnLabel||'Got it')+'</button></div>';
        var b=ov.querySelector('button');
        b.onclick=function(){ ov.remove(); resolve(); };
        ov.addEventListener('keydown', function(e){ if(e.key==='Escape'){ ov.remove(); resolve(); } });
        document.body.appendChild(ov); trap_(ov); b.focus();
      });
    }
    function confirm(title, bodyHtml, okLabel){
      return new Promise(function(resolve){
        var ov=document.createElement('div'); ov.className='modal-overlay';
        ov.innerHTML='<div class="modal" role="dialog" aria-modal="true" aria-label="'+esc(title)+'"><h3>'+esc(title)+'</h3><div class="mbody">'+bodyHtml+'</div>'+
          '<div style="display:flex;gap:10px"><button class="btn ghost block" data-x="0" type="button">Cancel</button><button class="btn block" data-x="1" type="button">'+esc(okLabel||'OK')+'</button></div></div>';
        function done(v){ ov.remove(); resolve(v); }
        ov.querySelector('[data-x="0"]').onclick=function(){ done(false); };
        ov.querySelector('[data-x="1"]').onclick=function(){ done(true); };
        ov.addEventListener('keydown', function(e){ if(e.key==='Escape') done(false); });

          '<button class="btn ghost block" data-x="0" type="button">'+esc(secondaryLabel)+'</button></div></div>';
        function done(v){ ov.remove(); resolve(v); }
        ov.querySelector('[data-x="1"]').onclick=function(){ done(true); };
        ov.querySelector('[data-x="0"]').onclick=function(){ done(false); };
        ov.addEventListener('keydown', function(e){ if(e.key==='Escape') done(true); });
        document.body.appendChild(ov); trap_(ov); ov.querySelector('[data-x="1"]').focus();

/**
 * What to say about last year's answers on a MACS school form.
 *
 * Nothing is ever filled in unprompted. The form OFFERS, the respondent accepts, and only then
 * does anything touch a field — including when a verified session from earlier in the visit is
 * already in hand, which skips the code but still asks. Two silent writers to the same inputs
 * (a restored draft and a prior-year fill) is exactly what made those two features
 * indistinguishable, so neither writes without being asked.
 *
 * Once accepted, the component names the verified email: a form that has just filled itself in
 * has to answer "on whose authority", and the address is the answer.

 * { phase:'verified', icon, title, detail, action:null, dismissible:false }.

function schoolPrefillNotice(state) {

        : 'No previous answers on file for ' + school + '.',
      action: null, dismissible: false
    };
  }
  return {
    phase: 'offer', icon: 'shield',
    title: 'Save time — reuse last year’s answers',
    detail: 'Verify an email on file for ' + school + ' and the answers that don’t change year ' +
      'to year will be filled in for you. First time filling this out? Verify anyway — it\'s what ' +
      'lets next year\'s form fill itself in from what you enter today.',
    // A session already verified earlier this visit shouldn't be asked for a code again, but it
    // still doesn't get to fill anything until this button is pressed.
    action: state.hasToken
      ? { kind: 'use', label: 'Use last year’s answers' }
      : { kind: 'verify', label: 'Verify my email' },

  };
}

      call('adminFactsStatus', [CURRENT_CONTEXT_ID]).then(function (st) { if (!stale()) renderFactsPage(st); }).catch(err);
    } else if (TAB === 'site') {
      call('adminGetSiteSettings', [CURRENT_CONTEXT_ID]).then(function (st) { if (!stale()) renderSiteSettingsPage(st); }).catch(err);
    } else if (TAB === 'contexts') {
      call('adminListContexts').then(function (items) { if (!stale()) { CONTEXTS = items; renderContextsPage(items); } }).catch(err);
    } else {
      call(TAB === 'all' ? 'listAllForms' : 'listMyForms', [CURRENT_CONTEXT_ID]).then(function (items) { if (!stale()) renderForms(items); }).catch(err);
    }
    function err(e) { if (!stale()) host().innerHTML = '<div class="notice err">' + esc(friendlyError(e)) + '</div>'; }
  }

  /** S13/S14 follow-up: a single cross-form queue for an approver, instead of hunting through
   *  each form's own responses table (and having to own the form to even reach it). Every item
   *  is decided right here — decideApproval already accepts a snapshotted approver or admin,
   *  same auth as the per-form responses table's Approve/Reject column reuses. */
  function renderApprovalsQueue(items) {
    var host = document.getElementById('list');
    if (!items.length) { host.innerHTML = '<p class="help">Nothing waiting on your decision right now.</p>'; return; }
    host.innerHTML =
      '<p class="help" style="margin:0 0 12px">Every submission across every form in this context that’s waiting on your approval.</p>' +
      '<div class="chipgrid">' + items.map(function (it) {
        var when = shortDate_(it.timestamp);
        return '<div class="chip-wrap" data-aqcard><div class="chip">' +
          '<div class="ledger-title">' + esc(it.formTitle || '(untitled)') + '</div>' +
          '<div class="ledger-meta">' + esc(it.respondentEmail || '(no email)') + (when ? ' · ' + esc(when) : '') + '</div>' +
          '<div class="ledger-foot"><div class="ledger-foot-row">' +
            '<button class="btn sm" data-aqdecide="Approved" data-aqform="' + esc(it.formId) + '" data-aqsid="' + esc(it.submissionId) + '">Approve</button>' +
            '<button class="btn ghost sm" data-aqdecide="Rejected" data-aqform="' + esc(it.formId) + '" data-aqsid="' + esc(it.submissionId) + '">Reject</button>' +
            '<button class="ledger-link" data-aqview="' + esc(it.formId) + '" style="margin-left:auto">View full response</button>' +
          '</div></div>' +
        '</div></div>';
      }).join('') + '</div>';
    host.querySelectorAll('[data-aqview]').forEach(function (b) {
      b.onclick = function () { openResponses(b.getAttribute('data-aqview')); };
    });
    host.querySelectorAll('[data-aqdecide]').forEach(function (b) {
      b.onclick = function () {
        var formId = b.getAttribute('data-aqform'), sid = b.getAttribute('data-aqsid'), decision = b.getAttribute('data-aqdecide');
        FormsUI.prompt(decision, { body: '<p class="help">Add a note for the submitter (optional).</p>', placeholder: 'Note (optional)', okLabel: decision, multiline: true }).then(function (comment) {
          if (comment === null) return;
          var card = b.closest('[data-aqcard]');
          var orig = setBusy_(b, decision === 'Approved' ? 'Approving…' : 'Rejecting…');
          call('decideApproval', [CURRENT_CONTEXT_ID, formId, sid, decision, comment]).then(function (res) {
            if (!res.ok) { clearBusy_(b, orig); return FormsUI.modal('Couldn’t save decision', esc(res.message || 'Error')); }
            FormsUI.toast('Marked ' + res.status);
            if (card) card.remove();
            if (!host.querySelector('[data-aqcard]')) host.innerHTML = '<p class="help">Nothing waiting on your decision right now.</p>';
          }).catch(function (e) { clearBusy_(b, orig); alertErr(e); });
        });
      };
    });
  }

  // Admin-only queue of personal templates whose owner asked to publish them to the shared
  // library (see doRequestPublish / Forms.js's requestPublishTemplate). `items === null`
  // means the caller isn't an admin — they can request publishing from the Template
  // library tab, but only an admin decides it, so this tab just points them there.
  function renderTemplateRequests(items) {
    var host = document.getElementById('list');
    if (items === null) {
      host.innerHTML = '<p class="help">Only admins review template requests. To publish one of your own templates to the shared library, open <strong>Template library</strong>, find it under “My forms,” and use “Request to publish.”</p>';
      return;
    }
    if (!items.length) { host.innerHTML = '<p class="help">No templates are waiting to join the shared library right now.</p>'; return; }
    // Approve/Reject used to be one irreversible click on title+owner alone, with no way to see
    // what was being admitted to the school-wide library — even though the Template library tab
    // right next door has a preview pane. Same split2col + prevpane pattern reused here.
    host.innerHTML =
      '<p class="help" style="margin:0 0 12px">Personal templates a staff member asked to add to the shared library — click one to preview it, then approve to make it available to all staff, or reject to keep it personal.</p>' +
      '<div class="split2col"><div class="grid">' + items.map(function (t) {
        return '<div class="fcard" data-tplcard="' + esc(t.formId) + '" tabindex="0" role="button" aria-label="Preview ' + esc(t.title || '(untitled)') + '">' +
          '<h3>' + esc(t.title || '(untitled)') + '</h3>' +
          '<div class="meta">by ' + esc(t.owner) + (t.category ? ' · ' + esc(t.category) : '') + '</div>' +
          '<div class="acts">' +
            '<button class="btn sm" data-tplreq="approve" data-id="' + esc(t.formId) + '" data-title="' + esc(t.title || '(untitled)') + '">Approve</button>' +
            '<button class="btn ghost sm" data-tplreq="reject" data-id="' + esc(t.formId) + '" data-title="' + esc(t.title || '(untitled)') + '">Reject</button>' +
          '</div></div>';
      }).join('') + '</div>' +
      '<div class="prevpane"><div class="prevpane-hd">Preview</div><div id="tplReqPrev"><p class="help">Click a request to preview it here.</p></div></div>' +
      '</div>';

    var showPreview = function (id) {
      var pv = document.getElementById('tplReqPrev');
      if (!pv) return;
      host.querySelectorAll('.fcard[data-tplcard]').forEach(function (c) { c.classList.toggle('active', c.getAttribute('data-tplcard') === id); });
      pv.innerHTML = '<span class="spinner" style="border-color:rgba(139,30,30,.25);border-top-color:var(--hcs-red)"></span>';
      call('getTemplatePreview', [CURRENT_CONTEXT_ID, id])
        .then(function (res) { renderSchemaPreviewInto_(pv, normalizeSchema(res.schema)); })
        .catch(function (e) { pv.innerHTML = '<p class="notice err">' + esc(friendlyError(e)) + '</p>'; });
    };
    host.querySelectorAll('.fcard[data-tplcard]').forEach(function (card) {
      card.style.cursor = 'pointer';
      card.addEventListener('click', function (e) { if (e.target.closest('.acts')) return; showPreview(card.getAttribute('data-tplcard')); });
      card.addEventListener('keydown', function (e) {
        if (e.target.closest('.acts')) return;
        if (e.key !== 'Enter' && e.key !== ' ') return;
        e.preventDefault(); showPreview(card.getAttribute('data-tplcard'));
      });
    });

    document.querySelectorAll('[data-tplreq]').forEach(function (b) {
      b.onclick = function () {
        var id = b.getAttribute('data-id'), approve = b.getAttribute('data-tplreq') === 'approve';
        var title = b.getAttribute('data-title') || 'this template';
        // Both directions are irreversible from here (approve publishes school-wide; reject
        // notifies the requester), so both get a confirm naming what happens.
        FormsUI.confirm(approve ? 'Publish to the shared library?' : 'Reject this request?',
          approve
            ? '<strong>' + esc(title) + '</strong> will become available to <strong>all staff</strong> to copy and use.'
            : '<strong>' + esc(title) + '</strong> stays personal to its owner. They’ll be told the request was declined.',
          approve ? 'Publish' : 'Reject'
        ).then(function (ok) {
          if (!ok) return;
          b.disabled = true; b.innerHTML = '<span class="spinner" style="width:12px;height:12px"></span> ' + (approve ? 'Approving…' : 'Rejecting…');
          call('decideTemplateRequest', [CURRENT_CONTEXT_ID, id, approve]).then(function () {
            FormsUI.toast(approve ? 'Published to shared library' : 'Request rejected');
            loadList();
          }).catch(function (e) { b.disabled = false; b.textContent = approve ? 'Approve' : 'Reject'; alertErr(e); });
        });
      };
    });
  }

  function renderForms(items) {
    var host = document.getElementById('list');
    CURRENT_FORM_ITEMS = items;
    if (!items.length) { host.innerHTML = '<p class="help">No forms yet. Click “New form” to start.</p>'; return; }
    host.innerHTML =
      '<div class="toolbar"><input id="fSearch" type="search" placeholder="Search forms…" aria-label="Search forms">' +
        '<select id="fStatus" aria-label="Filter by status"><option value="">All statuses</option><option>draft</option><option>published</option><option>closed</option></select>' +
        '<select id="fSort" aria-label="Sort"><option value="updated">Recently updated</option><option value="title">Title A–Z</option><option value="responses">Most responses</option></select></div>' +
      '<div id="grid"></div>';
    var draw = function () {
      var q = (document.getElementById('fSearch').value || '').toLowerCase();
      var st = document.getElementById('fStatus').value;
      var sort = document.getElementById('fSort').value;
      var list = items.filter(function (m) {
        return (!q || String(m.title || '').toLowerCase().indexOf(q) > -1 || String(m.owner || '').toLowerCase().indexOf(q) > -1) && (!st || m.lifecycle === st);
      });
      if (sort === 'title') list.sort(function (a, b) { return String(a.title).localeCompare(String(b.title)); });
      else if (sort === 'responses') list.sort(function (a, b) { return (b.submissions || 0) - (a.submissions || 0); });
      document.getElementById('grid').innerHTML = list.length ? '<div class="chipgrid">' + list.map(formCardHtml).join('') + '</div>' : '<p class="help">No forms match.</p>';
      wireCardButtons();
    };
    document.getElementById('fSearch').oninput = draw;
    document.getElementById('fStatus').onchange = draw;
    document.getElementById('fSort').onchange = draw;
    draw();
  }
  // Ledger card — see CLAUDE.md-adjacent design notes: fixed 8-row settings checklist, same
  // order on every card whether or not that setting is active, so a glance across the grid
  // shows which forms are loaded up without opening any of them. Lifecycle is the only
  // color-coded thing (a small mono status word); everything else is contrast (✓ / —), not hue.
  var LEDGER_LC = { draft: { c: 'var(--hcs-gold)', label: 'Draft' }, published: { c: 'var(--ok)', label: 'Published' }, closed: { c: 'var(--err)', label: 'Closed' } };
  function ledgerRow_(label, on, val) {
    return '<div class="ledger-row' + (on ? ' on' : '') + '"><span class="ledger-mark">' + (on ? '✓' : '—') + '</span><span class="ledger-label">' + esc(label) + '</span><span class="ledger-val">' + esc(val) + '</span></div>';
  }
  function shortDate_(iso) {
    if (!iso) return '';
    var d = new Date(iso);
    return isNaN(d.getTime()) ? '' : d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
  }
  // m.settings is a compact summary computed server-side from the registry's already-loaded
  // SchemaJson cell (see settingsSummaryFromRow_ in Forms.js) — null only when that cell was
  // blanked for being oversized, in which case we say so rather than showing false "off" rows.
  function ledgerChecklistHtml_(m) {
    if (m.settings === null) return '<div class="ledger-unavail">Settings unavailable here — schema too large to summarize. Open the editor to see them.</div>';
    var s = m.settings || {};
    var restrictionOn = !!m.classCode;
    var windowOn = !!(s.openDate || m.closeDate);
    var windowVal = windowOn ? ((s.openDate ? shortDate_(s.openDate) : 'now') + ' – ' + (m.closeDate ? shortDate_(m.closeDate) : 'no end')) : 'Always open';
    var capOn = s.maxResponses > 0;
    return '<div class="ledger-checklist">' +
      ledgerRow_('Restriction', restrictionOn, restrictionOn ? m.classCode : 'None') +
      ledgerRow_('Approval', s.approvalEnabled, s.approvalEnabled ? (s.approvalMode === 'all' ? 'All of ' : 'Any of ') + s.approvalCount + ' approver' + (s.approvalCount === 1 ? '' : 's') : 'Not required') +
      ledgerRow_('PDF templates', s.pdfTemplateCount > 0, s.pdfTemplateCount > 0 ? s.pdfTemplateCount + ' built' : 'None') +
      ledgerRow_('Response cap', capOn, capOn ? m.submissions + ' of ' + s.maxResponses : 'No cap') +
      ledgerRow_('Window', windowOn, windowVal) +
      ledgerRow_('Multi-child', !!s.multiStudent, s.multiStudent ? 'Allowed' : 'Off') +
      ledgerRow_('One per email', !!s.onePerEmail, s.onePerEmail ? 'Enforced' : 'Off') +
      ledgerRow_('Editable after', !!s.allowEdit, s.allowEdit ? 'Yes, via link' : 'Locked') +
    '</div>';
  }
  function formCardHtml(m) {
    var id = m.id;
    var canDel = ME.isAdmin || String(m.owner || '').toLowerCase() === ME.email.toLowerCase();
    var menu =
      menuItem('Duplicate', 'dup', id, 'dup') +
      menuItem('Save as template', 'tpl', id, 'dup') +
      menuItem('Share (QR code)', 'share', id, 'clip') +
      menuItem('Edit card', 'editcard', id, 'edit') +
      ((ME.isAdmin && CONTEXTS.length > 1) ? menuItem('Move to context…', 'movectx', id, 'chevron') : '') +
      (canDel ? menuItem('Delete', 'del', id, 'trash', 'danger') : '');
    var lc = LEDGER_LC[m.lifecycle] || LEDGER_LC.draft;
    var metaBits = [accessLevel_(m.access).longLabel];
    if (m.locked) metaBits.push('Not accepting');
    if (m.category) metaBits.push(m.category);
    return '<div class="chip-wrap"><div class="chip">' +
        '<button class="ledger-card-head" data-act="edit" data-id="' + id + '">' +
          '<span class="ledger-title">' + esc(m.title || '(untitled)') + '</span>' +
          '<span class="ledger-lc" style="--lc:' + lc.c + '">' + lc.label + '</span>' +
        '</button>' +
        '<div class="ledger-meta">' + esc(metaBits.join(' · ')) + '</div>' +
        (TAB === 'all' ? '<div class="ledger-owner">' + esc(m.owner) + '</div>' : '') +
        (m.notes ? '<div class="ledger-notes">' + esc(m.notes) + '</div>' : '') +
        '<button class="ledger-toggle" data-act="togglesettings" data-id="' + id + '" aria-expanded="false" aria-controls="settings_' + id + '">' +
          '<span class="ledger-toggle-arrow">▸</span> Settings' +
        '</button>' +
        '<div id="settings_' + id + '" hidden>' + ledgerChecklistHtml_(m) + '</div>' +
        '<div class="ledger-foot">' +
          '<div class="ledger-foot-row">' +
            '<button class="ledger-link" data-act="edit" data-id="' + id + '">Edit</button>' +
            '<button class="ledger-link" data-act="preview" data-id="' + id + '">Preview</button>' +
          '</div>' +
          '<div class="ledger-foot-row">' +
            '<button class="ledger-link" data-act="resp" data-id="' + id + '">' + m.submissions + ' response' + (m.submissions === 1 ? '' : 's') + '</button>' +
            '<span style="margin-left:auto;display:flex;gap:8px">' +
              '<button class="iconbtn" data-act="copylink" data-id="' + id + '" title="Copy link">' + FormsUI.icon('clip', { size: 14 }) + '</button>' +
              '<div class="moremenu">' +
                '<button class="btn ghost sm" data-act="more" data-id="' + id + '" aria-haspopup="true" aria-expanded="false" title="More actions">' + FormsUI.icon('more') + '</button>' +
                '<div class="menu" id="menu_' + id + '" hidden>' + menu + '</div>' +
              '</div>' +
            '</span>' +
          '</div>' +
        '</div>' +
      '</div></div>';
  }
  function menuItem(label, act, id, iconName, cls) {
    return '<button class="' + (cls || '') + '" data-act="' + act + '" data-id="' + id + '">' + FormsUI.icon(iconName, { size: 15 }) + esc(label) + '</button>';
  }

  function renderLibrary(items) {
    var host = document.getElementById('list');
    if (!items.length) { host.innerHTML = '<p class="help">No templates yet.</p>'; return; }
    var cards = items.map(function (m) {
      var lock = m.layoutLock === 'useAsIs' ? '<span class="pill locked">use as-is</span>' : '<span class="pill draft">starter</span>';
      var scope = m.templateScope === 'shared' ? '<span class="pill staff">shared</span>'
        : m.templateScope === 'pending' ? '<span class="pill pending">pending review</span>'
        : '<span class="pill private">personal</span>';
      var canEdit = ME.isAdmin || m.owner.toLowerCase() === ME.email.toLowerCase();
      var isOwner = m.owner.toLowerCase() === ME.email.toLowerCase();
      // Admin curation: publish/unpublish from the school-wide shared library. Non-admin
      // owners of a personal template can ask for it to be reviewed instead.
      var curate = ME.isAdmin
        ? (m.templateScope === 'shared'
            ? btn('Unpublish', 'unpub', m.id, 'ghost')
            : m.templateScope !== 'pending' ? btn('Make shared', 'pub', m.id, 'ghost') : '')
        : (isOwner && m.templateScope === 'personal' ? btn('Request to publish', 'request', m.id, 'ghost') : '');
      return '<div class="fcard" data-libcard="' + m.id + '" tabindex="0" role="button" aria-label="Preview ' + esc(m.title || '(untitled)') + '"><h3>' + esc(m.title || '(untitled)') + '</h3>' +
        '<div class="pills">' + scope + lock + (m.category ? '<span class="pill draft">' + esc(m.category) + '</span>' : '') + '</div>' +
        '<div class="meta">by ' + esc(m.owner) + '</div>' +
        '<div class="acts">' + btn('Use this template', 'use', m.id) +
          (canEdit ? btn('Edit', 'edit', m.id, 'ghost') : '') + curate +
          (canEdit
            ? '<button class="btn ghost danger sm" data-act="del" data-id="' + m.id + '" title="Delete template" style="display:inline-flex;align-items:center;gap:5px">' + FormsUI.icon('trash', { size: 15 }) + ' Delete</button>' : '') +
        '</div></div>';
    }).join('');
    host.innerHTML = '<div class="split2col">' +
      '<div class="grid">' + cards + '</div>' +
      '<div class="prevpane"><div class="prevpane-hd">Preview</div><div id="libPrev"><p class="help">Click a template to preview it here.</p></div></div>' +
      '</div>';
    wireCardButtons();
    // Clicking (or focusing + Enter/Space on) the card itself — anywhere outside its action
    // buttons — loads the preview. No separate "Show preview" button; the card is the target.
    host.querySelectorAll('.fcard[data-libcard]').forEach(function (card) {
      card.style.cursor = 'pointer';
      card.addEventListener('click', function (e) {
        if (e.target.closest('.acts')) return;
        doShowLibraryPreview(card.getAttribute('data-libcard'));
      });
      card.addEventListener('keydown', function (e) {
        if (e.target.closest('.acts')) return;
        if (e.key !== 'Enter' && e.key !== ' ') return;
        e.preventDefault();
        doShowLibraryPreview(card.getAttribute('data-libcard'));
      });
    });
  }

  function accessLabel(a) { return accessLevel_(a).label.toLowerCase(); }
  function btn(label, act, id, cls) { return '<button class="btn ' + (cls || '') + ' sm" data-act="' + act + '" data-id="' + id + '">' + esc(label) + '</button>'; }

  // Busy-state helper for the confirm-then-call() actions below — the confirm dialog
  // itself closes immediately (it's just a yes/no), but the server call after it had no
  // visible feedback until now. btnEl may be undefined if a caller has no button handy
  // (e.g. a legacy call site not yet updated to pass one) — no-op rather than throw.
  function setBusy_(btnEl, label) {
    if (!btnEl) return null;
    var orig = btnEl.innerHTML;
    btnEl.disabled = true;
    btnEl.innerHTML = '<span class="spinner" style="width:12px;height:12px"></span> ' + esc(label);
    return orig;
  }
  function clearBusy_(btnEl, orig) {
    if (!btnEl) return;
    btnEl.disabled = false;
    if (orig != null) btnEl.innerHTML = orig;
  }

  function closeMenus() {
    document.querySelectorAll('.moremenu .menu').forEach(function (mn) { mn.setAttribute('hidden', 'hidden'); });
    document.querySelectorAll('[data-act="more"]').forEach(function (bb) { bb.setAttribute('aria-expanded', 'false'); });
  }
  function wireCardButtons() {
    if (!window.__hcsMenuClose) { // close any open "More" menu when clicking outside it
      window.__hcsMenuClose = true;
      document.addEventListener('click', function (e) { if (!e.target.closest('.moremenu')) closeMenus(); });
    }
    document.querySelectorAll('[data-act]').forEach(function (b) {
      b.onclick = function () {
        var id = b.getAttribute('data-id'), act = b.getAttribute('data-act');
        if (act === 'more') {
          var menu = document.getElementById('menu_' + id), wasHidden = menu && menu.hasAttribute('hidden');
          closeMenus();
          if (menu && wasHidden) { menu.removeAttribute('hidden'); b.setAttribute('aria-expanded', 'true'); }
          return;
        }
        if (act === 'togglesettings') {
          var box = document.getElementById('settings_' + id), arrow = b.querySelector('.ledger-toggle-arrow');
          var opening = box && box.hasAttribute('hidden');
          if (box) { if (opening) box.removeAttribute('hidden'); else box.setAttribute('hidden', ''); }
          b.setAttribute('aria-expanded', String(!!opening));
          if (arrow) arrow.textContent = opening ? '▾' : '▸';
          return;
        }
        closeMenus();
        if (act === 'edit') return openEditor(id);
        if (act === 'preview') return doPreview(id, b);
        if (act === 'resp') return openResponses(id);
        if (act === 'share') return doShare(id, b);
        if (act === 'copylink') return doCopyLink(id);
        if (act === 'editcard') return openFormCardEditor(id);
        if (act === 'dup') return doDuplicate(id, b);
        if (act === 'use') return doUse(id);
        if (act === 'tpl') return doSaveAsTemplate(id);
        if (act === 'pub') return doSetTemplateScope(id, 'shared', b);
        if (act === 'unpub') return doSetTemplateScope(id, 'personal', b);
        if (act === 'request') return doRequestPublish(id, b);
        if (act === 'del') return doDelete(id, null, b);
        if (act === 'movectx') return doMoveForm(id);
      };
    });
  }

  /** Admin-only: move a form's registry row + entire Drive folder to another context. */
  function doMoveForm(id) {
    var others = CONTEXTS.filter(function (c) { return c.contextId !== CURRENT_CONTEXT_ID && c.active !== false; });
    if (!others.length) { FormsUI.modal('Nothing to move to', 'No other context is registered yet.'); return; }
    var options = others.map(function (c) { return '<option value="' + esc(c.contextId) + '">' + esc(c.displayName) + '</option>'; }).join('');
    var body = '<p class="help">Moves this form’s registry row AND its entire Drive folder (schema, responses, uploads) to the selected context. This can’t be undone from here.</p>' +
      '<label class="lbl">Destination context</label><select class="control" id="_moveDest">' + options + '</select>' +
      '<label class="lbl">Type the destination context id to confirm</label>' +
      '<input class="control" id="_moveConfirm" placeholder="' + esc(others[0].contextId) + '" autocomplete="off">';
    modalWith('Move to another context', body, 'Move', function (ov) {
      var dest = ov.querySelector('#_moveDest').value;
      // Typed confirmation, because this relocates live response data between databases on one
      // click and there is no undo in the UI.
      var typed = (ov.querySelector('#_moveConfirm').value || '').trim();
      if (typed !== dest) return Promise.reject(new Error('Type “' + dest + '” exactly to confirm this move.'));
      return call('adminMoveForm', [CURRENT_CONTEXT_ID, id, dest]).then(function () {
        FormsUI.toast('Form moved'); loadList();
      });
    });
  }

  // generic bespoke modal that reads its inputs on OK (before closing)
  // If onOk returns a promise, the modal stays open with the OK button showing a spinner
  // until it resolves — closing early hid whether the save actually succeeded. Non-promise
  // (or no) return keeps the old immediate-close behavior.
  function modalWith(title, bodyHtml, okLabel, onOk) {
    var ov = document.createElement('div'); ov.className = 'modal-overlay';
    ov.innerHTML = '<div class="modal" role="dialog" aria-modal="true"><h3>' + esc(title) + '</h3><div class="mbody">' + bodyHtml + '</div>' +
      '<div style="display:flex;gap:10px"><button class="btn ghost block" data-x="0" type="button">Close</button>' +

      var label = ok.textContent;

    ov.addEventListener('keydown', function (e) { if (e.key === 'Escape') close(); });
    document.body.appendChild(ov); (ok || ov.querySelector('[data-x="0"]')).focus();
    return ov;
  }

  function doShare(id, btnEl) {
    var orig = setBusy_(btnEl, '');

      if (!r.url) return FormsUI.modal('Link not available', shareUrlProblem_(r));
      // S9: the QR image is generated by api.qrserver.com, i.e. the form's URL leaves the school
      // network. That was happening automatically, with nothing on screen saying so — and if the
      // host is blocked, staff just saw a broken image with no explanation. Now it's opt-in and

      var body = '<p class="help" style="margin-bottom:8px">Access: ' + esc(accessLabel(r.access)) + '</p>' +
        '<input class="control" id="_shareurl" readonly value="' + esc(r.url) + '" style="margin-bottom:8px">' +
        '<button class="btn block sm" id="_copybtn" type="button">Copy link</button>' +

          '<button class="btn ghost block sm" id="_qrbtn" type="button">Show QR code</button>' +

        '</div>';
      var ov = modalWith('Share form', body, null);
      ov.querySelector('#_copybtn').onclick = function () {
        var i = ov.querySelector('#_shareurl'); i.select();
        try { document.execCommand('copy'); } catch (e) {}
        try { navigator.clipboard.writeText(i.value); } catch (e) {}
        FormsUI.toast('Link copied');
      };
      ov.querySelector('#_qrbtn').onclick = function () {
        var box = ov.querySelector('#_qrbox');
        var qr = 'https://api.qrserver.com/v1/create-qr-code/?size=180x180&data=' + encodeURIComponent(r.url);
        box.innerHTML = '<div class="center"><img id="_qrimg" alt="QR code for this form" src="' + esc(qr) +
          '" style="width:180px;height:180px;border:1px solid var(--line);border-radius:8px"></div>';

        var img = box.querySelector('#_qrimg');

  // ---------- contexts (multi-tenant: HCS, MACS, ... — admin-only) ----------
  // Mirrors logic/theme.js's DEFAULT_TOKENS/hexToRgba_ for a live, no-reload repaint when
  // switching contexts — the server-rendered Theme.html (see Theme.js) is still the source
  // of truth for a form-filler's actual page load; this only repaints the BUILDER's own chrome.
  var CLIENT_THEME_DEFAULTS = { primary: '#8B1E1E', primaryHover: '#701818', accent: '#D4AF37', accentSoft: '#f6ecd0', bg: '#f4f5f7', card: '#ffffff' };
  function clientHexToRgba_(hex, alpha) {
    var h = String(hex || '').replace('#', '');
    return 'rgba(' + parseInt(h.slice(0, 2), 16) + ',' + parseInt(h.slice(2, 4), 16) + ',' + parseInt(h.slice(4, 6), 16) + ',' + alpha + ')';
  }
  function applyContextTheme(ctx) {
    var t = (ctx && ctx.theme) || {};
    var primary = t.primary || CLIENT_THEME_DEFAULTS.primary;
    var root = document.documentElement.style;
    root.setProperty('--hcs-red', primary);
    root.setProperty('--hcs-red-hover', t.primaryHover || CLIENT_THEME_DEFAULTS.primaryHover);
    root.setProperty('--hcs-gold', t.accent || CLIENT_THEME_DEFAULTS.accent);
    root.setProperty('--hcs-gold-soft', t.accentSoft || CLIENT_THEME_DEFAULTS.accentSoft);
    root.setProperty('--bg', t.bg || CLIENT_THEME_DEFAULTS.bg);
    root.setProperty('--card', t.card || CLIENT_THEME_DEFAULTS.card);
    root.setProperty('--ring', '0 0 0 3px ' + clientHexToRgba_(primary, .16));
  }
  function switchContext(contextId) {
    var go = function () {
      CURRENT_CONTEXT_ID = contextId; // deliberately NOT persisted — see CURRENT_CONTEXT_ID
      applyContextTheme(CONTEXTS.filter(function (c) { return c.contextId === contextId; })[0]);
      renderDashboard();
    };
    // mirror the "← All forms" handler: save pending edits before switching context so an
    // in-progress form edit isn't silently wiped by the dashboard re-render.
    if (EDITING && DIRTY && !EDITING.structureLocked) doSave(true).then(function () { DIRTY = false; go(); });
    else { DIRTY = false; go(); }
  }

        var t = {};
        CTX_COLOR_FIELDS.forEach(function (cf) {
          var el = document.getElementById('_ctxHex_' + cf[1]);
          t[cf[1]] = (el && /^#[0-9a-fA-F]{6}$/.test(el.value)) ? el.value : CLIENT_THEME_DEFAULTS[cf[1]];

          '<div class="ctx-preview-card" style="background:' + t.card + '">' +
            '<div class="ctx-preview-field"></div><div class="ctx-preview-field" style="width:45%"></div>' +

          if (!colorEl || !hexEl) return;
          // Bind both input+change on the swatch — some browsers only fire 'change' (not

          var onSwatchPick = function () { hexEl.value = colorEl.value; renderCtxPreview_(); CTX_PREVIEWING = true; applyContextTheme({ theme: ctxPreviewTheme_() }); };

      }
      function render() {
        host.innerHTML =
          '<div class="setcard" style="margin-bottom:16px">' +
            '<p class="help">Each context is a fully separate form database (own System sheet + Drive root) with its own theme and identity model.</p>' +

            '<button class="btn" id="_ctxAddBtn" style="margin-top:12px">+ Add a context</button>' +

      /** Controls that only exist once a form is open (re-run on every openForm). */
      function wireFormControls_() {
        var autoCreate = document.getElementById('_ctxAutoCreate');
        if (autoCreate) autoCreate.onchange = function () {
          document.getElementById('_ctxManualIds').style.display = autoCreate.checked ? 'none' : 'block';
        };

        if (unlock) unlock.onclick = function () {

          modalWith('Change database ids',
            '<p class="help">Changing the system sheet or root folder id re-points <strong>every form, response and ' +

            '<input class="control" id="_ctxUnlockConfirm" placeholder="' + esc(id) + '" autocomplete="off">',
            'Unlock', function (ov) {
              var typed = (ov.querySelector('#_ctxUnlockConfirm').value || '').trim();
              if (typed !== id) return Promise.reject(new Error('Type “' + id + '” exactly to unlock these fields.'));
              document.getElementById('_ctxSheet').removeAttribute('readonly');

      function wire() {
        host.querySelectorAll('[data-editctx]').forEach(function (b) {
          b.onclick = function () {
            var id = b.getAttribute('data-editctx');
            openForm(CONTEXTS.filter(function (x) { return x.contextId === id; })[0] || null);
          };
        });
        document.getElementById('_ctxAddBtn').onclick = function () { openForm(null); };
        document.getElementById('_ctxCancel').onclick = closeForm;
        document.getElementById('_ctxSave').onclick = function () {
          var idEl = document.getElementById('_ctxId');
          var rawId = idEl.value.trim();
          // A5: contextId was free text with no format or duplicate check on the client. It keys
          // the whole tenancy model (Script Properties, cache keys, registry lookups), and
          // re-using an existing id is a support incident, so check before calling.
          if (!editingId) {
            if (!/^[a-z0-9-]{2,20}$/.test(rawId)) {
              FormsUI.modal('Check the context id',
                'Use 2–20 characters, lowercase letters, numbers or hyphens only (e.g. <code>macs</code>). ' +
                'It becomes this context’s permanent key and can’t be renamed later.');
              return;
            }
            if (CONTEXTS.some(function (c) { return String(c.contextId).toLowerCase() === rawId.toLowerCase(); })) {
              FormsUI.modal('That id is taken', 'A context called <strong>' + esc(rawId) + '</strong> already exists. Pick a different id, or use its Edit button.');
              return;
            }
          }
          var data = {
            contextId: rawId,
            displayName: document.getElementById('_ctxName').value.trim(),
            authMode: document.getElementById('_ctxAuth').value,
            runnerUrl: document.getElementById('_ctxRunnerUrl').value.trim(),
            brandName: document.getElementById('_ctxBrandName').value.trim(),
            logoUrl: document.getElementById('_ctxLogoUrl').value.trim(),
            theme: ctxPreviewTheme_()
          };
          // Chain the pre-flight confirms: each only appears when it applies, and any Cancel stops.
          var checks = [];
          if (!editingId && data.authMode === 'facts-otp') {
            // This was a <p class="help"> footnote under the dropdown; it's a hard constraint.
            checks.push(['Parent sign-in won’t work for this context',
              'The FACTS directory sync only feeds HCS, so a <strong>facts-otp</strong> context has an empty ' +
              'guardian list — every parent one-time code will fail to send. Unless you’re also extending ' +
              'the FACTS pipeline, choose <strong>open-picker</strong>.',
              'Use facts-otp anyway']);
          }
          if (!data.runnerUrl) {
            checks.push(['No runner URL set',
              'Forms created in this context will have no app to serve them until a runner URL is added here later. Continue without one?',
              'Continue anyway']);
          }
          if (!editingId && autoCreate && autoCreate.checked) {
            checks.push(['Create a new database for this context?',
              'This creates a <strong>new Drive folder and a new System spreadsheet</strong> for <strong>' +
              esc(data.displayName || data.contextId) + '</strong>. They aren’t removed if you delete the ' +
              'context afterwards, so avoid running this twice.',
              'Create it']);
          }
          (function runChecks(i) {
            if (i >= checks.length) { doSaveContext_(); return; }
            FormsUI.confirm(checks[i][0], checks[i][1], checks[i][2]).then(function (ok) { if (ok) runChecks(i + 1); });
          })(0);
          function doSaveContext_() {
          var wasEdit = !!editingId;
          var btn = document.getElementById('_ctxSave');
          var orig = setBusy_(btn, wasEdit ? 'Saving…' : 'Creating…');
          var req;
          if (wasEdit) {
            data.systemSheetId = document.getElementById('_ctxSheet').value.trim();
            data.rootFolderId = document.getElementById('_ctxFolder').value.trim();
            var activeEl = document.getElementById('_ctxActive');
            if (activeEl) data.active = activeEl.checked;
            var devOverrideEl = document.getElementById('_ctxDevOverride');
            if (devOverrideEl) data.devOverride = devOverrideEl.value;
            req = call('adminUpdateContext', [editingId, data]);
          } else if (autoCreate && autoCreate.checked) {
            req = call('adminCreateContext', [data]);
          } else {
            data.systemSheetId = document.getElementById('_ctxSheet').value.trim();
            data.rootFolderId = document.getElementById('_ctxFolder').value.trim();
            req = call('adminAddContext', [data]);
          }
          req.then(function () { return call('adminListContexts'); })
            .then(function (list) { CONTEXTS = list; editingId = null; FormsUI.toast(wasEdit ? 'Context saved' : 'Context created'); render(); /* render() re-renders with the panel hidden */ })
            .catch(function (e) { clearBusy_(btn, orig); alertErr(e); });
          }
        };
      }
      render();
  }

  // ---------- App Manager (admin-only) ----------
  function appStatusPillHtml(a) {
    var tint = { up: { bg: '#e6f4ea', fg: '#1a7f37' }, down: { bg: '#fbe9e7', fg: '#c62828' }, unknown: { bg: '#eee', fg: '#666' } }[a.lastStatus] || { bg: '#eee', fg: '#666' };
    var label = { up: 'Up', down: 'Down', unknown: 'Not checked' }[a.lastStatus] || 'Not checked';
    var title = (a.lastCheckedAt ? 'Checked ' + a.lastCheckedAt : 'Never checked') + (a.lastStatusMsg ? ' (' + a.lastStatusMsg + ')' : '');
    // Age belongs ON the pill, not in a hover title: badges only refresh on a manual check or
    // the 6-hourly trigger, and a stale 'down' greys the app out for every parent in the Portal
    // (see portalTile_) — so "Up" from 7 hours ago must not look identical to "Up" from now.
    var ageTxt = '';
    if (a.lastCheckedAt) {
      var ageMs = Date.now() - new Date(a.lastCheckedAt).getTime();
      if (isFinite(ageMs) && ageMs >= 0) {
        var hrs = Math.floor(ageMs / 3600000);
        ageTxt = hrs >= 8 ? ' · stale' : (hrs >= 1 ? ' · ' + hrs + 'h ago' : ' · just now');
      }
    }
    return '<span class="pill" style="background:' + tint.bg + ';color:' + tint.fg + '" title="' + esc(title) + '">' + label + esc(ageTxt) + '</span>';
  }
  // Same ledger-card look/structure as a form card (formCardHtml) — title+status head,
  // uppercase meta line, two-row footer — so App Manager reads as "forms, one more kind

    if (a.visibleToStaff) metaBits.push('Staff');

  function renderAppsManager(items) {

    var section = function (label, hint, list) {
      return '<div class="section-head">' + esc(label) + ' (' + list.length + ')</div>' +

        .catch(function (e) { appCheckAllBtn.disabled = false; appCheckAllBtn.textContent = 'Check all'; alertErr(e); });
    };

      window.__hcsAppMenuClose = true;
      document.addEventListener('click', function (e) { if (!e.target.closest('.moremenu')) closeAppMenus(); });
    }

      var chip = b.closest('[data-appid]'), appId = chip.getAttribute('data-appid'), act = b.getAttribute('data-appact');

      ssoSection;
    var pendingLogoUrl = a.logoUrl || '';
    var modalEl = modalWith(existing ? 'Edit app' : 'Add app', body, existing ? 'Save' : 'Add', function (ov) {
      // Elements this context's modal doesn't render (Parent/Staff/Student/handoff/slug under
      // open-picker) fall back to false/'' rather than throwing on a null querySelector — and
      // that's also the CORRECT value to persist: an open-picker context has no portal for
      // those roles to see anyway.
      var q = function (sel) { return ov.querySelector(sel); };
      var checkedOrFalse = function (sel) { var el = q(sel); return !!(el && el.checked); };
      var valueOrBlank = function (sel) { var el = q(sel); return el ? el.value : ''; };
      var data = {
        Name: q('#_appName').value, Description: q('#_appDesc').value,
        Url: q('#_appUrl').value, IconEmoji: q('#_appIcon').value,
        LogoUrl: pendingLogoUrl, Notes: q('#_appNotes').value,
        OwnerEmail: q('#_appOwner').value, Active: q('#_appActive').checked,
        SupportsHandoff: checkedOrFalse('#_appHandoff'), Slug: valueOrBlank('#_appSlug'),
        VisibleToParent: checkedOrFalse('#_appVisParent'), VisibleToStaff: checkedOrFalse('#_appVisStaff'),
        VisibleToStudent: checkedOrFalse('#_appVisStudent'), VisibleToGuest: checkedOrFalse('#_appVisGuest')
      };
      // "In Portal" with no role selected renders a card that says "No roles selected" while
      // claiming to be live — visible to nobody, with nothing flagging it as a mistake.
      if (data.Active && !data.VisibleToParent && !data.VisibleToStaff && !data.VisibleToStudent && !data.VisibleToGuest) {
        return Promise.reject(new Error('Pick at least one role under “Visible to”, or turn off “Show in Forms Portal”.'));
      }
      if (data.VisibleToGuest && data.SupportsHandoff) {
        return Promise.reject(new Error('“Guests” and “Supports SSO handoff” can’t both be on — guests have no identity to hand off.'));
      }
      var save = existing ? call('adminUpdateApp', [CURRENT_CONTEXT_ID, existing.appId, data]) : call('adminAddApp', [CURRENT_CONTEXT_ID, data]);
      return save.then(function () { FormsUI.toast(existing ? 'App updated' : 'App added'); loadList(); });
    });
    var fileInput = modalEl.querySelector('#_appLogoFile');
    fileInput.onchange = function () {
      var file = fileInput.files[0];
      if (!file) return;
      var preview = modalEl.querySelector('#_appLogoPreview');
      preview.innerHTML = '<span class="spinner"></span><p class="help">Uploading…</p>';
      var reader = new FileReader();
      reader.onload = function () {
        var b64 = String(reader.result).split(',')[1];
        call('adminUploadAppLogo', [CURRENT_CONTEXT_ID, file.name, file.type, b64]).then(function (r) {
          pendingLogoUrl = r.url;
          preview.innerHTML = '<img src="' + esc(r.url) + '" alt=""><p class="help">Uploaded.</p>';
        }).catch(function (e) { preview.innerHTML = '<p class="help">Upload failed.</p>'; alertErr(e); });
      };
      reader.readAsDataURL(file);
    };
  }

  // ---------- editor ----------
  /** openTab: which editor tab to land on ('build' default) — used by doUse so a freshly copied
   *  template opens on Settings, the tab its own toast tells you to review. */
  function openEditor(formId, openTab) {
    chrome(LOADING_HTML_ + 'Loading editor…</p>');
    call('loadFormForEdit', [CURRENT_CONTEXT_ID, formId]).then(function (res) {
      EDITING = { meta: res.meta, schema: normalizeSchema(res.schema), structureLocked: res.structureLocked, isAdmin: res.isAdmin };
      EDITOR_TAB = openTab || 'build';
      // A10: an 'open-picker' context (e.g. MACS) has no identity model to gate Private or
      // Staff-only on, so such a form must be Public. Coerce ONCE here, on load, and tell the
      // person — this used to happen invisibly inside settingsTabHtml() on every render.
      // Only Staff-only is impossible on an 'open-picker' context (no Google SSO). Private is
      // valid there now — it means the school email code — so it must NOT be coerced away.
      var coercedAccess = currentContextAuthMode_() === 'open-picker' && EDITING.schema.settings.access === ACCESS_LEVELS.staff.id;
      if (coercedAccess) EDITING.schema.settings.access = ACCESS_LEVELS.open.id;
      renderEditor();
      // renderEditor() resets DIRTY, so flag the pending change AFTER it — otherwise the
      // coercion would sit in memory unsaved with the banner claiming nothing had changed.
      if (coercedAccess) {
        markDirty();
        FormsUI.toast('This context has no staff sign-in, so access was set to Public');
      }
    }).catch(function (e) { chrome('<div class="card card-pad"><p class="notice err">' + esc(friendlyError(e)) + '</p></div>'); });
  }
  function normalizeSchema(s) {
    s = s || {}; s.settings = s.settings || {}; s.pages = s.pages && s.pages.length ? s.pages : [{ title: 'Main', fields: [] }];
    s.pages[0].fields = s.pages[0].fields || [];
    return s;
  }

  var EDITOR_TAB = 'build'; // 'build' | 'settings' | 'preview' — reset in openEditor()

    chrome(

  // ---------- "+" insert points between fields (see renderCanvas) — click one, pick a type
  // from the readable dropdown menu, and the new field lands exactly there, not just at
  // the end. Reuses the app's existing .moremenu/.menu dropdown look (full-width readable
  // rows), not small pill buttons.
  function fieldGapHtml(idx, big) {
    var labelFor = {}; FIELD_TYPES.forEach(function (t) { labelFor[t[0]] = t[1]; });
    var menu = TYPE_GROUPS.map(function (g) {
      return '<div class="tg-group"><h4>' + esc(g[0]) + '</h4><div class="tg-grid">' + g[1].map(function (ty) {
        return '<button class="tg-tile" data-type="' + ty + '" title="' + esc(TYPE_TIPS[ty] || '') + '">' +
          '<span class="ic">' + (TYPE_ICONS[ty] || '❔') + '</span><span class="lb">' + esc(labelFor[ty] || ty) + '</span></button>';
      }).join('') + '</div></div>';
    }).join('');
    // Every inter-field gap doubles as an add point, but they're hover-only dashed lines —
    // easy to miss as "the" place to add a field. The LAST gap (after the final field, or
    // the only gap on an empty canvas) renders as an always-visible "+ Add field" button
    // instead, so there's one obvious, permanent place to add a field beyond the between-
    // fields hover targets.
    var addBtnHtml = big
      ? '<button class="gapadd gapadd-big" title="Add field" aria-label="Add field">' + FormsUI.icon('plus', { size: 14 }) + ' Add field</button>'
      : '<button class="gapadd" title="Add field here" aria-label="Add field here">' + FormsUI.icon('plus', { size: 13 }) + '</button>';
    return '<div class="fieldgap' + (big ? ' fieldgap-big' : '') + '" data-gapidx="' + idx + '"><div class="moremenu">' +
      addBtnHtml +
      '<div class="menu gapmenu tilemenu" hidden>' + menu + '</div>' +
    '</div></div>';
  }
  function closeGapMenus() {
    document.querySelectorAll('.fieldgap .menu').forEach(function (m) { m.setAttribute('hidden', 'hidden'); });
  }
  // One delegated listener on #canvas (persists across renderCanvas() re-renders, since
  // that only rewrites innerHTML — attaching this in renderCanvas() itself would stack a
  // fresh duplicate on every add/delete/reorder; called once from renderEditorPane()
  // instead, right after #canvas is created fresh for this form.
  function wireFieldGaps() {
    var host = document.getElementById('canvas');
    if (!host) return;
    host.addEventListener('click', function (e) {
      var addBtn = e.target.closest('.gapadd');
      if (addBtn) {
        var menu = addBtn.parentElement.querySelector('.menu');
        var wasHidden = menu.hasAttribute('hidden');
        closeGapMenus();
        if (wasHidden) menu.removeAttribute('hidden');
        return;
      }
      var typeBtn = e.target.closest('.gapmenu button[data-type]');
      if (typeBtn) {
        var gap = typeBtn.closest('.fieldgap');
        addField(typeBtn.getAttribute('data-type'), Number(gap.getAttribute('data-gapidx')));
      }
    });
    if (!window.__hcsGapMenuClose) {
      window.__hcsGapMenuClose = true;
      document.addEventListener('click', function (e) { if (!e.target.closest('.fieldgap')) closeGapMenus(); });
    }
  }

  // ---------- undo (structural ops only: add/delete/duplicate/move/drag/parent-block) ----------
  /** S7c: undo history is per-form and persisted for the tab's lifetime, because renderEditor()
   *  wipes UNDO_STACK — so leaving a form and coming back silently discarded it while the delete
   *  confirm still promised "Undo is available afterward". sessionStorage (not localStorage): a
   *  new tab or a new day should start clean. */
  function undoKey_() { return 'hcsBuilderUndo:' + (EDITING && EDITING.meta ? EDITING.meta.id : ''); }
  function persistUndo_() {
    try { sessionStorage.setItem(undoKey_(), JSON.stringify(UNDO_STACK)); } catch (e) {}
  }
  function loadUndo_() {
    try {
      var raw = sessionStorage.getItem(undoKey_());
      UNDO_STACK = raw ? (JSON.parse(raw) || []) : [];
    } catch (e) { UNDO_STACK = []; }
    if (!Array.isArray(UNDO_STACK)) UNDO_STACK = [];
    var bu = document.getElementById('btnUndo'); if (bu) bu.disabled = !UNDO_STACK.length;
  }
  function snapshotUndo() {
    UNDO_STACK.push(JSON.stringify(EDITING.schema));
    if (UNDO_STACK.length > 20) UNDO_STACK.shift();
    persistUndo_();
    var bu = document.getElementById('btnUndo'); if (bu) bu.disabled = false;
  }
  function doUndo() {
    if (!UNDO_STACK.length || !EDITING || EDITING.structureLocked) return;
    if (!document.getElementById('canvas')) return; // not on the editor screen
    EDITING.schema = normalizeSchema(JSON.parse(UNDO_STACK.pop()));
    persistUndo_();
    renderCanvas(); markDirty();
    var bu = document.getElementById('btnUndo'); if (bu) bu.disabled = !UNDO_STACK.length;
    FormsUI.toast('Undone');
  }
  function undoKeyHandler_(e) {
    if (!(e.ctrlKey || e.metaKey) || e.key.toLowerCase() !== 'z') return;
    var t = e.target && e.target.tagName;
    if (t === 'INPUT' || t === 'TEXTAREA' || t === 'SELECT') return; // native text undo wins
    if (EDITING) { e.preventDefault(); doUndo(); }
  }

  // Empty-canvas "which kind of form is this" choice — deliberately rendered ABOVE the
  // title/description fields (in #startBlock, see renderEditorPane) so it's the first thing
  // seen and clearly something to pick before filling in details, not a footnote below an
  // empty field list. Re-rendered from renderCanvas() so it appears/disappears in lockstep
  // with the field list (e.g. picking a start option, or deleting the last field).
  function renderStartBlock() {
    var host = document.getElementById('startBlock');
    if (!host) return;
    if (EDITING.structureLocked || fields().length) { host.innerHTML = ''; return; }
    host.innerHTML =
      '<p class="help" style="margin:0 0 8px;font-weight:700">Pick how to start this form:</p>' +
      '<div class="startchoices">' +
        '<button type="button" id="startParent"><strong>👪 Parent form</strong><span>Adds the parent identity block + student picker and sets access to Private (parents verify by email). Most HCS forms start here.</span></button>' +
        '<button type="button" id="startContact"><strong>✏️ Basic info block</strong><span>Adds First name, Last name, and Email fields — for open/staff forms.</span></button>' +
        '<button type="button" id="startBlank"><strong>📄 Start blank</strong><span>Add one field at a time.</span></button>' +
      '</div><div class="divider"></div>';
    var sp = document.getElementById('startParent'); if (sp) sp.onclick = function () { addParentBlock(true); };
    var sc = document.getElementById('startContact');
    if (sc) sc.onclick = function () {
      snapshotUndo();
      fields().push(
        { id: uid(), type: 'text', label: 'First name', required: true },
        { id: uid(), type: 'text', label: 'Last name', required: true },
        { id: uid(), type: 'email', label: 'Email', required: true });
      renderCanvas(); markDirty();
    };
    var sb2 = document.getElementById('startBlank');
    if (sb2) sb2.onclick = function () {
      var gapBtn = document.querySelector('#canvas .fieldgap .gapadd'); if (gapBtn) gapBtn.click();
    };
  }

  function renderCanvas() {
    renderStartBlock();
    var host = document.getElementById('canvas');
    var locked = EDITING.structureLocked;
    var fs = fields();
    var bar = document.getElementById('canvasBar');
    if (bar) bar.style.display = (!locked && fs.length > 3) ? 'flex' : 'none';
    if (!fs.length) {
      // Empty canvas: the start-choice buttons live above the title now (#startBlock) —
      // this is just the one add point, styled as the permanent "+ Add field" button.
      host.innerHTML = locked ? '<p class="help">No fields yet.</p>' : fieldGapHtml(0, true);
      return;
    }
    // A "+" insert point before every field, and one more (always-visible) after the last —
    // pick a type at any of them and the new field lands exactly there, not always at the end.
    var rows = locked ? [] : [fieldGapHtml(0)];
    fs.forEach(function (f, i) { rows.push(fieldCard(f, i, locked)); if (!locked) rows.push(fieldGapHtml(i + 1, i === fs.length - 1)); });
    host.innerHTML = rows.join('');
    // restore per-card collapse state
    fs.forEach(function (f) {
      if (COLLAPSED[f.id]) { var c = host.querySelector('.fieldcard[data-fid="' + f.id + '"]'); if (c) c.classList.add('collapsed'); }
    });
    var tAll = document.getElementById('btnToggleAll');
    if (tAll) {
      var allCollapsed = fs.every(function (f) { return COLLAPSED[f.id]; });
      tAll.textContent = allCollapsed ? 'Expand all' : 'Collapse all';
      tAll.onclick = function () {
        var target = !fs.every(function (f) { return COLLAPSED[f.id]; });
        fs.forEach(function (f) { COLLAPSED[f.id] = target; });
        renderCanvas();
      };
    }
    var pAll = document.getElementById('btnPriorAll');
    if (pAll) {
      var allOn = allPriorYearOn_();
      pAll.textContent = allOn ? 'Turn off "remember from last time" for all' : 'Turn on "remember from last time" for all';
      pAll.onclick = function () { snapshotUndo(); toggleAllPriorYear_(); };
    }
    if (locked) return;
    fs.forEach(function (f, i) {
      bindInput('lbl_' + f.id, function (v) { f.label = v; var lp = document.querySelector('.fieldcard[data-fid="' + f.id + '"] .fclabel'); if (lp) lp.textContent = v; });
      if (f.type === 'description') {
        descParagraphs_(f.label).forEach(function (para, pi) {
          var setParaStyle = function (key, val) {
            f.paragraphStyles = f.paragraphStyles || [];
            f.paragraphStyles[pi] = f.paragraphStyles[pi] || {};
            f.paragraphStyles[pi][key] = val;
            renderCanvas(); markDirty();
          };
          var daEl = document.getElementById('dalign_' + f.id + '_' + pi); if (daEl) daEl.onchange = function () { setParaStyle('align', daEl.value); };
          var dlhEl = document.getElementById('dlh_' + f.id + '_' + pi); if (dlhEl) dlhEl.onchange = function () { setParaStyle('lineHeight', Number(dlhEl.value) || 1.5); };
          var dfEl = document.getElementById('dfont_' + f.id + '_' + pi); if (dfEl) dfEl.onchange = function () { setParaStyle('fontFamily', dfEl.value); };
          var dsEl = document.getElementById('dsize_' + f.id + '_' + pi); if (dsEl) dsEl.onchange = function () { setParaStyle('fontSize', dsEl.value); };
        });
      }
      var faqEl = document.getElementById('faq_' + f.id); if (faqEl) faqEl.oninput = function () { f.items = parseFaq(this.value); };
      bindInput('help_' + f.id, function (v) { f.help = v; });
      var reqEl = document.getElementById('req_' + f.id); if (reqEl) reqEl.onchange = function () { f.required = this.checked; };
      var optEl = document.getElementById('opt_' + f.id);
      if (optEl) optEl.oninput = function () {
        var oldOpts = f.options || [];
        var newOpts = this.value.split('\n').map(function (s) { return s.trim(); }).filter(Boolean);
        // Rename propagation: capacity limits and conditional rules are keyed by the option's
        // LABEL, so renaming an option would silently orphan them. When the option count is
        // unchanged, treat position i as a rename and carry the keys along.
        if (oldOpts.length === newOpts.length) {
          oldOpts.forEach(function (o, i) {
            var n = newOpts[i];
            if (!o || !n || o === n) return;
            if (f.capacity && f.capacity[o] != null) { f.capacity[n] = f.capacity[o]; delete f.capacity[o]; }
            fields().forEach(function (g) {
              if (g.showIf && g.showIf.field === f.id && g.showIf.value === o) {
                g.showIf.value = n;
                var cv = document.getElementById('cval_' + g.id); if (cv) cv.value = n;
              }
            });
          });
          var capBox = document.getElementById('cap_' + f.id);
        }
        f.options = newOpts;
        // keep the per-option capacity inputs in sync with the (renamed/added/removed) options
        var cb = document.getElementById('capbox_' + f.id); if (cb) cb.innerHTML = capRows(f);
      };
      var pfEl = document.getElementById('pf_' + f.id); if (pfEl) pfEl.onchange = function () { f.prefillFrom = this.value; };
      (function () {
        var fidEl = document.getElementById('fid_' + f.id);
        if (!fidEl) return;
        fidEl.onblur = function () {
          var errEl = document.getElementById('fiderr_' + f.id);
          var newId = String(fidEl.value || '').trim();
          if (newId === f.id) { if (errEl) { errEl.textContent = ''; errEl.style.display = 'none'; } return; }
          snapshotUndo();
          var res = renameFieldId_(f, newId);
          if (!res.ok) {
            fidEl.value = f.id;
            if (errEl) { errEl.textContent = res.msg; errEl.style.display = ''; }
            return;
          }
          if (errEl) { errEl.textContent = ''; errEl.style.display = 'none'; }
          renderCanvas();
          markDirty();
        };
      })();
      var multEl = document.getElementById('mult_' + f.id); if (multEl) multEl.onchange = function () { f.multiple = this.checked; };
      var lvlEl = document.getElementById('lvl_' + f.id); if (lvlEl) lvlEl.onchange = function () { f.staffLevel = this.value; };
      var accEl = document.getElementById('acc_' + f.id); if (accEl) accEl.oninput = function () { f.accept = this.value; };
      var subsEl = document.getElementById('subs_' + f.id);
      if (subsEl) subsEl.oninput = function () {
        var oldSubs = f.subLabels || [];
        var newSubs = subsEl.value.split('\n').map(function (s) { return s.trim(); }).filter(Boolean);
        if (oldSubs.length === newSubs.length) {
          oldSubs.forEach(function (o, idx) {
            var n = newSubs[idx];
            if (!o || !n || o === n) return;
            if (f.subRequired && f.subRequired[o] != null) { f.subRequired[n] = f.subRequired[o]; delete f.subRequired[o]; }
            if (f.subPriorYear && f.subPriorYear[o] != null) { f.subPriorYear[n] = f.subPriorYear[o]; delete f.subPriorYear[o]; }
          });
        }
        f.subLabels = newSubs;
        var srb = document.getElementById('subreqbox_' + f.id); if (srb) srb.innerHTML = subReqRows(f);
        var spb = document.getElementById('subpriorbox_' + f.id); if (spb) spb.innerHTML = subPriorRows(f);
      };
      var subtypeEl = document.getElementById('subtype_' + f.id);
      if (subtypeEl) subtypeEl.onchange = function () { f.subType = subtypeEl.value; renderCanvas(); markDirty(); };
