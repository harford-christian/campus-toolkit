  /* FormsUI — tiny dependency-free client helpers shared by builder + runner. */
  var FormsUI = (function () {
    // textContent→innerHTML escapes & < > but NOT quotes, and esc() output is interpolated into
    // quoted attributes (value="…", data-*="…") all over — so escape both quote kinds too.
    function esc(s){ var d=document.createElement('div'); d.textContent = (s==null?'':String(s)); return d.innerHTML.replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
    function toast(msg, ms){ var t=document.createElement('div'); t.className='toast'; t.setAttribute('role','status'); t.setAttribute('aria-live','polite'); t.textContent=msg;
      document.body.appendChild(t); setTimeout(function(){ t.remove(); }, ms||2600); }
    function el(tag, attrs, html){ var e=document.createElement(tag);
      if(attrs) Object.keys(attrs).forEach(function(k){ e.setAttribute(k, attrs[k]); });
      if(html!=null) e.innerHTML=html; return e; }
    function trap_(ov){
      ov.addEventListener('keydown', function(e){
        if(e.key!=='Tab') return;
        var f=ov.querySelectorAll('button,input,select,textarea,a[href]'); if(!f.length) return;
        var first=f[0], last=f[f.length-1];
        if(e.shiftKey && document.activeElement===first){ e.preventDefault(); last.focus(); }
        else if(!e.shiftKey && document.activeElement===last){ e.preventDefault(); first.focus(); }
      });
    }
    function modal(title, bodyHtml, btnLabel){
      return new Promise(function(resolve){
        var ov=document.createElement('div'); ov.className='modal-overlay';
        ov.innerHTML='<div class="modal" role="dialog" aria-modal="true" aria-label="'+esc(title)+'"><h3>'+esc(title)+'</h3><div class="mbody">'+bodyHtml+'</div><button class="btn block">'+esc(btnLabel||'Got it')+'</button></div>';
        var b=ov.querySelector('button');
        b.onclick=function(){ ov.remove(); resolve(); };
        ov.addEventListener('keydown', function(e){ if(e.key==='Escape'){ ov.remove(); resolve(); } });
        document.body.appendChild(ov); trap_(ov); b.focus();
      });
    }
    function confirm(title, bodyHtml, okLabel){
      return new Promise(function(resolve){
        var ov=document.createElement('div'); ov.className='modal-overlay';
        ov.innerHTML='<div class="modal" role="dialog" aria-modal="true" aria-label="'+esc(title)+'"><h3>'+esc(title)+'</h3><div class="mbody">'+bodyHtml+'</div>'+
          '<div style="display:flex;gap:10px"><button class="btn ghost block" data-x="0" type="button">Cancel</button><button class="btn block" data-x="1" type="button">'+esc(okLabel||'OK')+'</button></div></div>';
        function done(v){ ov.remove(); resolve(v); }
        ov.querySelector('[data-x="0"]').onclick=function(){ done(false); };
        ov.querySelector('[data-x="1"]').onclick=function(){ done(true); };
        ov.addEventListener('keydown', function(e){ if(e.key==='Escape') done(false); });

          '<button class="btn ghost block" data-x="0" type="button">'+esc(secondaryLabel)+'</button></div></div>';
        function done(v){ ov.remove(); resolve(v); }
        ov.querySelector('[data-x="1"]').onclick=function(){ done(true); };
        ov.querySelector('[data-x="0"]').onclick=function(){ done(false); };
        ov.addEventListener('keydown', function(e){ if(e.key==='Escape') done(true); });
        document.body.appendChild(ov); trap_(ov); ov.querySelector('[data-x="1"]').focus();

  function verifyCode() {
    var code = (document.getElementById('otpCode').value || '').trim();
    if (!/^\d{6}$/.test(code)) return otpError('Enter the 6-digit code.');
    var btn = document.getElementById('otpVerify'); btn.disabled = true; btn.innerHTML = '<span class="spinner"></span> Verifying…';
    google.script.run.withSuccessHandler(function (res) {
      if (res && res.ok && res.token) {
        PARENT_TOKEN = res.token;
        try { localStorage.setItem(TOKEN_KEY, PARENT_TOKEN); } catch (e) {}
        google.script.run.withSuccessHandler(function (view) { renderPortalHome(view.role, view.email, view.apps, view.closingSoon, view.globalForms, PARENT_TOKEN, view.students, view.canBridge, view.alsoStaff, view.builderUrl, view.builderEditorUrl, view.devOverride); })
          .withFailureHandler(function (e) { otpError(friendlyErr_(e)); })
          .getPortalView(PARENT_TOKEN);
      } else {
        btn.disabled = false; btn.textContent = 'Verify';
        otpError((res && res.msg) || 'That code is not correct.');
      }
    }).withFailureHandler(function (e) { btn.disabled = false; btn.textContent = 'Verify'; otpError(friendlyErr_(e)); })
      .authVerifyOtp(otpEmail, code);
  }

  function otpError(msg) { var e = document.getElementById('otpErr'); if (e) { e.style.display = 'block'; e.textContent = msg; } }
  /** Sentence a parent can act on, instead of the bare code — FormsUI's shared base map (M13),
   *  same one the MACS gate and Runner.html use, so wording can't drift between screens. */
  function friendlyErr_(e) {
    return FormsUI.friendlyErrCode(e);
  }

  /** One tile for a form OR an app. Apps get a data-i index (for click-wiring below);
   *  forms are plain links, no wiring needed. subtitle (student-section forms only) shows
   *  which class the form belongs to, instead of a separate class-roster list. */
  function portalTile_(it, i) {
    var down = it.kind === 'app' && it.data.lastStatus === 'down';
    var tileInner = '<span class="tile-icon">' + FormsUI.esc(it.icon) + '</span>' +
      '<span class="tile-body">' +
        '<span class="tile-name" title="' + FormsUI.esc(it.title) + '">' + FormsUI.esc(it.title) + '</span>' +
        (it.subtitle ? '<span class="tile-sub" title="' + FormsUI.esc(it.subtitle) + '">' + FormsUI.esc(it.subtitle) + '</span>' : '') +
      '</span>' +
      '<span class="tile-chev">›</span>';
    if (down) {
      // Status only ever refreshes via manual "Check status" or the every-6h background
      // trigger (checkAllAppsStatusAcrossContexts_) — a stale badge is possible but this is
      // still strictly better than showing a dead app as a normal clickable tile with no
      // indication anything's wrong.
      return '<div class="tile" style="opacity:.55;cursor:not-allowed" title="This app didn’t respond at its last check and may be temporarily unavailable.">' + tileInner + '</div>';
    }
    return it.kind === 'form'
      ? '<a class="tile" href="' + FormsUI.esc(it.data.url) + '"' + tileTarget_() + '>' + tileInner + '</a>'
      : '<button class="tile" data-i="' + i + '" type="button">' + tileInner + '</button>';
  }
  // Apps and forms look and read identically to parents/staff — both are just "a form" to
  // fill out. icon/category never signal which is which; the only difference (handoff vs.
  // direct link) is decided server-side in openApp_/click-wiring below.
  function formItem_(f, subtitle) { return { kind: 'form', title: f.title, icon: '📄', data: f, subtitle: subtitle || '' }; }
  function appItem_(a) { return { kind: 'app', title: a.name, icon: '📄', data: a, subtitle: a.lastStatus === 'down' ? 'Temporarily unavailable' : '' }; }

  function daysUntil_(dateStr) {
    if (!dateStr) return null;
    var d = new Date(dateStr); if (isNaN(d)) return null;
    var ms = d.setHours(0, 0, 0, 0) - new Date().setHours(0, 0, 0, 0);
    return Math.round(ms / 86400000);
  }
  /**
   * The urgency badge, shared by the signed-in portal and the guest/MACS home.
   * P12: 0 used to render as "0 days", which reads as "already over" for a form that in fact
   * closes tonight — and the same "0 days" appeared for a past-due form still in the list. Now
   * today says TODAY, tomorrow LAST DAY, and anything already past is filtered out by the callers.
   */
  function daysBadgeHtml_(days) {
    if (days == null) return '';
    var big, small;
    if (days <= 0) { big = '!'; small = 'today'; }
    else if (days === 1) { big = '1'; small = 'last day'; }
    else { big = String(days); small = 'days'; }
    return '<div class="portal-urgent-days"><b>' + big + '</b><span>' + small + '</span></div>';
  }

  function renderPortalHome(role, email, apps, closingSoon, globalForms, parentToken, students, canBridge, alsoStaff, builderUrl, builderEditorUrl, devOverride) {
    var roleLabel = role === 'staff' ? 'Staff' : role === 'student' ? 'Student' : 'Parent';
    // Same admin-only warning as apps/builder's dashboard (Builder.html's devOverrideBannerHtml_)
    // — getPortalView only populates this for a signed-in staff admin (never for a parent), so
    // no extra gating needed here. Previously this had zero visibility outside the builder, so
    // an admin testing submissions/receipts via runner-staff had no on-screen sign every outbound
    // email (OTP codes, confirmations, approvals) was silently rerouting to DEV_EMAIL.
    var devOverrideBanner = (devOverride && devOverride.active)
      ? '<div class="notice err" style="margin-bottom:12px">Dev override is ON — every outbound email ' +
        '(OTP codes, confirmations, approvals) is being redirected to ' + FormsUI.esc(devOverride.devEmail) +
        ' instead of the real recipient. Turn off DEVELOPER_OVERRIDE in Script Properties before go-live.</div>'
      : '';

    var closingHtml = (closingSoon && closingSoon.length)
      ? '<section class="portal-urgent"><h2 class="portal-section-h portal-urgent-h">Closing soon</h2>' +
        closingSoon.map(function (f) {
          return '<a class="portal-urgent-row" href="' + FormsUI.esc(f.url) + '" target="_blank" rel="noopener">' +
            daysBadgeHtml_(daysUntil_(f.closeDate)) +
            '<span class="portal-urgent-body"><span class="portal-urgent-t" title="' + FormsUI.esc(f.title) + '">' + FormsUI.esc(f.title) + '</span></span>' +
            '<span class="tile-chev">›</span></a>';
        }).join('') +
        '</section>'
      : '';

    // Every form/app a parent/staff member can reach globally (not tied to a specific
    // student), grouped by category — apps fold into the same categories as forms (or
    // "General" if uncategorized), never a separate "Apps" bucket.
    var globalItems = (globalForms || []).map(function (f) { return formItem_(f); }).concat((apps || []).map(appItem_))
      .sort(function (a, b) { return a.title.localeCompare(b.title); });
    globalItems.forEach(function (it, i) { it.idx = i; });
    var byCat = {};
    globalItems.forEach(function (it) {
      var cat = it.data.category || 'General';
      (byCat[cat] = byCat[cat] || []).push(it);
    });
    var catOrder = Object.keys(byCat).sort(function (a, b) {
      if (a === 'General') return 1; if (b === 'General') return -1;
      return a.localeCompare(b);
    });
    var globalHtml = '<section class="portal-section">' +
      (globalItems.length
        ? catOrder.map(function (cat) {
            return (catOrder.length > 1 ? '<h3 class="portal-subhead">' + FormsUI.esc(cat) + '</h3>' : '') +
              '<div class="tilegrid">' + byCat[cat].map(function (it) { return portalTile_(it, it.idx); }).join('') + '</div>';
          }).join('')
        : '<p class="help">Nothing here yet.</p>') +
      '</section>';

    var studentsHtml = (students || []).length
      ? '<section class="portal-section"><h2 class="portal-section-h">My students</h2>' +
        '<div class="portal-students">' + (students || []).map(function (s) {
          var sub = [s.grade ? 'Grade ' + s.grade : '', s.homeroomTeacher ? 'Homeroom: ' + s.homeroomTeacher : '']
            .filter(Boolean).join(' · ');
          var classDescByCode = {};
          (s.classes || []).forEach(function (c) { classDescByCode[c.classCode] = c.classDescription || c.classCode; });
          var formList = s.forms || [];
          var studentForms = formList.map(function (f) { return portalTile_(formItem_(f, classDescByCode[f.classCode] || '')); }).join('');
          return '<div class="portal-student-card">' +
            '<div class="portal-student-head">' +
              '<div class="portal-student-name">' + FormsUI.esc(s.displayName) + '</div>' +
              (sub ? '<div class="portal-student-sub">' + FormsUI.esc(sub) + '</div>' : '') +
              '<div class="portal-student-count">' + formList.length + (formList.length === 1 ? ' form' : ' forms') + '</div>' +
            '</div>' +
            (studentForms ? '<div class="tilegrid" style="margin-top:10px">' + studentForms + '</div>'
              : '<p class="help" style="margin-top:8px">No class forms right now.</p>') +
          '</div>';
        }).join('') + '</div></section>'
      : '';

    var signOutBtn = role === 'parent'
      ? '<button id="portalSignOut" class="btn ghost sm block" type="button">Sign out</button>' : '';
    // Shown on EITHER app whenever the signed-in email is both a FACTS guardian and staff —
    // never both true+true here (each app resolves identity its own way), so exactly one
    // branch fires. Staff->Parent needs the bridge (different app/session, see
    // epParentBridge_); Parent->Staff is just a link — Builder's DOMAIN deployment
    // recognizes their Google session with no ticket involved. Lives inside the profile
    // dropdown now (opts.profileBody), not a brandbar pill — plain .btn styling, since the
    // dropdown has a normal card background.
    // Wording deliberately avoids "View as" — this is a real navigation into a fully
    // authenticated session in the other role (able to submit forms, not a read-only preview),
    // so it should read like going somewhere, not toggling a simulation.
    var roleToggleBody = (role !== 'parent' && canBridge)
      ? '<button id="toggleToParent" class="btn ghost sm block" type="button">Switch to Parent view</button>'
      : (role === 'parent' && alsoStaff && builderUrl)
      ? '<a id="toggleToStaff" href="' + FormsUI.esc(builderUrl) + '" target="_top" class="btn ghost sm block" style="text-align:center">Go to Staff Portal</a>'
      : '';
    // Cross-link lives in the topbar (permanent, matches Builder's reciprocal link to
    // Portal) instead of a body button that only appeared for staff on the home view.
    // role === 'staff' only ever occurs on apps/runner-staff (runner-public is ANONYMOUS —
    // Session.getActiveUser() is always empty there, so identifyVisitor_ never resolves a
    // staff/student identity on that app).
    // If BUILDER_URL isn't set in Script Properties, builderEditorUrl comes back blank and the
    // link would otherwise just silently vanish with nothing telling anyone why — show a muted
    // note instead so a misconfiguration is visible, not invisible.
    var builderMissingNote = (role === 'staff' && !builderEditorUrl)
      ? '<p class="help" style="text-align:center;margin:2px 0 0">Form Builder link isn’t configured — ask an admin to set BUILDER_URL.</p>' : '';
    shell(
      '<div class="stack" style="margin-top:18px">' +
        devOverrideBanner +
        '<div><h1 class="form-title">' + roleLabel + ' Forms Portal</h1></div>' +
        closingHtml +
        studentsHtml +
        globalHtml +
        '<div id="portalErr" class="notice err" role="alert" style="display:none"></div>' +
      '</div>',
      { wide: true, crossLinkUrl: (role === 'staff' ? builderEditorUrl : ''), crossLinkLabel: 'Open Form Builder',
        profileEmail: email, profileBody: roleToggleBody + signOutBtn + builderMissingNote });
    globalItems.forEach(function (it, i) {
      if (it.kind !== 'app') return;
      var btn = document.querySelector('.tile[data-i="' + i + '"]');
      if (btn) btn.onclick = function () { openApp(it.data, parentToken, btn); };
    });
    var so = document.getElementById('portalSignOut');
    if (so) so.addEventListener('click', signOut);
    var bb = document.getElementById('toggleToParent');
    if (bb) bb.addEventListener('click', function () {
      bb.disabled = true; bb.innerHTML = '<span class="spinner" style="width:12px;height:12px;border-color:rgba(139,30,30,.3);border-top-color:var(--hcs-red)"></span> Opening…';
      google.script.run.withSuccessHandler(function (r) {
        if (r && r.ok && r.url) {
          // A real <a target="_top"> the user clicks themselves, not a JS-triggered nav from
          // an async callback — some browsers/sandboxed iframes silently drop the latter
          // (the "click does nothing" bug), since the click's user-activation doesn't carry
          // through the google.script.run round trip.
          bb.outerHTML = '<a id="toggleToParent" href="' + FormsUI.esc(r.url) + '" target="_top" class="btn ghost sm block" style="text-align:center">Continue as Parent →</a>';
          return;
        }
        bb.disabled = false; bb.textContent = 'Switch to Parent view';
        var err = document.getElementById('portalErr');
        if (err) {
          err.style.display = '';
          err.textContent = (r && r.code === 'NO_URL')
            ? 'The parent view link isn’t configured yet. Contact the school office.'
            : 'Could not open the parent view. Try again.';
        }
      }).withFailureHandler(function (e) {
        bb.disabled = false; bb.textContent = 'Switch to Parent view';
        var err = document.getElementById('portalErr');
        if (err) { err.style.display = ''; err.textContent = friendlyErr_(e); }
      }).getParentBridgeUrl();
    });
  }

  function signOut() {
    PARENT_TOKEN = null; try { localStorage.removeItem(TOKEN_KEY); } catch (e) {}
    // Same shared-device concern Runner.html's signOut addresses (P16) — a second parent
    // signing in on this browser must not inherit the first parent's saved form drafts.
    // Prefixes must match Runner.html's DRAFT_PREFIX/ATTACH_PREFIX (Portal has no FORM_ID
    // of its own to scope a single form's draft, so it clears every form's).
    FormsUI.clearAllDrafts(['hcsFormsDraft:', 'hcsFormsAttach:']);
    renderOtp();
  }

  function openApp(a, parentToken, btn) {
    if (!a.supportsHandoff) { window.open(a.url, '_blank'); return; }
    var label = btn.innerHTML;
    btn.disabled = true; btn.innerHTML = '<span class="spinner"></span> Opening…';
    google.script.run.withSuccessHandler(function (r) {
      btn.disabled = false; btn.innerHTML = label;
      if (r && r.url) { window.open(r.url, '_blank'); }
      else portalError('That link isn’t set up yet. Contact the school office.');
    }).withFailureHandler(function (e) {
      btn.disabled = false; btn.innerHTML = label;
      portalError(friendlyErr_(e));
    }).getAppHandoffUrl(parentToken, a.slug);
  }
  function portalError(msg) { var e = document.getElementById('portalErr'); if (e) { e.style.display = 'block'; e.textContent = msg; } }
})();
</script>

  
</body>
</html>
