  /* FormsUI — tiny dependency-free client helpers shared by builder + runner. */
  var FormsUI = (function () {
    // textContent→innerHTML escapes & < > but NOT quotes, and esc() output is interpolated into
    // quoted attributes (value="…", data-*="…") all over — so escape both quote kinds too.
    function esc(s){ var d=document.createElement('div'); d.textContent = (s==null?'':String(s)); return d.innerHTML.replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
    function toast(msg, ms){ var t=document.createElement('div'); t.className='toast'; t.setAttribute('role','status'); t.setAttribute('aria-live','polite'); t.textContent=msg;
      document.body.appendChild(t); setTimeout(function(){ t.remove(); }, ms||2600); }
    function el(tag, attrs, html){ var e=document.createElement(tag);
      if(attrs) Object.keys(attrs).forEach(function(k){ e.setAttribute(k, attrs[k]); });
      if(html!=null) e.innerHTML=html; return e; }
    function trap_(ov){
      ov.addEventListener('keydown', function(e){
        if(e.key!=='Tab') return;
        var f=ov.querySelectorAll('button,input,select,textarea,a[href]'); if(!f.length) return;
        var first=f[0], last=f[f.length-1];
        if(e.shiftKey && document.activeElement===first){ e.preventDefault(); last.focus(); }
        else if(!e.shiftKey && document.activeElement===last){ e.preventDefault(); first.focus(); }
      });
    }
    function modal(title, bodyHtml, btnLabel){
      return new Promise(function(resolve){
        var ov=document.createElement('div'); ov.className='modal-overlay';
        ov.innerHTML='<div class="modal" role="dialog" aria-modal="true" aria-label="'+esc(title)+'"><h3>'+esc(title)+'</h3><div class="mbody">'+bodyHtml+'</div><button class="btn block">'+esc(btnLabel||'Got it')+'</button></div>';
        var b=ov.querySelector('button');
        b.onclick=function(){ ov.remove(); resolve(); };
        ov.addEventListener('keydown', function(e){ if(e.key==='Escape'){ ov.remove(); resolve(); } });
        document.body.appendChild(ov); trap_(ov); b.focus();
      });
    }
    function confirm(title, bodyHtml, okLabel){
      return new Promise(function(resolve){
        var ov=document.createElement('div'); ov.className='modal-overlay';
        ov.innerHTML='<div class="modal" role="dialog" aria-modal="true" aria-label="'+esc(title)+'"><h3>'+esc(title)+'</h3><div class="mbody">'+bodyHtml+'</div>'+
          '<div style="display:flex;gap:10px"><button class="btn ghost block" data-x="0" type="button">Cancel</button><button class="btn block" data-x="1" type="button">'+esc(okLabel||'OK')+'</button></div></div>';
        function done(v){ ov.remove(); resolve(v); }
        ov.querySelector('[data-x="0"]').onclick=function(){ done(false); };
        ov.querySelector('[data-x="1"]').onclick=function(){ done(true); };
        ov.addEventListener('keydown', function(e){ if(e.key==='Escape') done(false); });

          '<button class="btn ghost block" data-x="0" type="button">'+esc(secondaryLabel)+'</button></div></div>';
        function done(v){ ov.remove(); resolve(v); }
        ov.querySelector('[data-x="1"]').onclick=function(){ done(true); };
        ov.querySelector('[data-x="0"]').onclick=function(){ done(false); };
        ov.addEventListener('keydown', function(e){ if(e.key==='Escape') done(true); });
        document.body.appendChild(ov); trap_(ov); ov.querySelector('[data-x="1"]').focus();

        btn.disabled = false; btn.textContent = 'Send code'; svError(friendlyErr_(e));
      }).macsRequestOtp(school, email);
    };

    document.getElementById('svEmail').addEventListener('keydown', function (e) { if (e.key === 'Enter') send(); });
  }
  function renderSchoolCode(school) {

      '<div class="card flush-top card-pad stack">' +

        FormsUI.esc(school) + ', a 6-digit code is on its way. It expires in 10 minutes.</p></div>' +
        '<div class="field"><label for="svCode">6-digit code</label>' +

  function svError(msg) { var e = document.getElementById('svErr'); if (e) { e.style.display = 'block'; e.textContent = msg; } }

  function signOut() {
    TOKEN = null; try { localStorage.removeItem(TOKEN_KEY); } catch (e) {}
    // Signing out on a shared device must not leave this person's answers, signature, or
    // attachments behind for whoever sits down next (see draftScope_).
    clearAllDrafts_();
    ATTACH = {}; SIG_DRAWN = {}; ATTACH_DRAFT_SKIPPED = false;
    loadForm();
  }

  // "Start over" / "Submit another response": a fresh, empty copy of this form. Never
  // location.reload() — the Runner lives inside HtmlService's googleusercontent sandbox iframe,
  // and reloading that inner frame on its own drops the page payload and leaves a blank white
  // screen. Re-fetching through loadForm() re-renders in place and keeps the sign-in session.
  function restartForm_() {
    ATTACH = {}; SIG_DRAWN = {}; ATTACH_DRAFT_SKIPPED = false;
    LAST_ANSWERS = null; PRIOR_WROTE = []; PF_OFFER_HIDDEN = false;
    loadForm();
    try { window.scrollTo(0, 0); } catch (e) {}
  }

  // ---------- render form ----------
  function renderForm(form) {
    FORM = form;
    FIELDS = []; VISALL = [];
    var body = '<div class="card flush-top card-pad stack">';
    if (IS_PREVIEW) body += '<div class="notice info">' + FormsUI.icon('eye') + ' <strong>Preview</strong> — this is exactly what submitters see (with sample data). Nothing is saved.</div>';
    if (IS_EDIT) body += '<div class="notice info">' + FormsUI.icon('edit') + ' <strong>Editing your response</strong> — make your changes below and save. You can also withdraw it entirely.</div>';
    // honeypot (bots fill it; humans never see it) — server drops any submission with this set
    body += '<input type="text" id="hpField" name="hp_addr" tabindex="-1" autocomplete="off" aria-hidden="true" style="position:absolute!important;left:-9999px;top:auto;width:1px;height:1px;opacity:0">';
    // Identity + sign-out now live in the header (shell()'s brandbar-right), matching
    // Portal/Builder — not a separate body banner. "Update my info" (collapseIdentityBlock's
    // reveal link) is the one thing that stays in the body since it's tied to specific fields.
    body += '<a href="#" id="showIdentity" class="help" style="display:none">Update my info</a>';
    body += '<div><h1 class="form-title">' + FormsUI.esc(form.title) + '</h1>' +
            (form.description ? '<p class="form-desc">' + FormsUI.esc(form.description) + '</p>' : '') + '</div>';
    if (form.locked) body += '<div class="notice err">This form is not currently accepting responses.</div>';
    // Exactly ONE thing can stand here: the offer to reuse last year's answers, and only until
    // it's used or dismissed. The draft is a modal question answered before this, and its
    // outcome is a toast; per-field marks are the record of what was carried over. Nothing
    // accumulates at the top of the form.
    body += '<div id="formNotices"><div id="pfSlot"></div></div>';
    body += '<div id="fields"></div>';
    body += '<div id="attachTotal" style="margin-top:10px"></div>';
    body += '<div id="formErr" class="notice err" role="alert" style="display:none"></div>';
    body += '<div id="pageNav"></div>';
    body += '</div>';
    shell(body);

    LOCKED = !!form.locked;
    var flat = [];
    (form.pages || []).forEach(function (pg) { (pg.fields || []).forEach(function (f) { flat.push(f); }); });
    PAGES = [{ title: '', fields: [] }];
    flat.forEach(function (f) {
      if (f.type === 'pageBreak') PAGES.push({ title: f.label || '', fields: [] });
      else PAGES[PAGES.length - 1].fields.push(f);
    });
    var host = document.getElementById('fields');
    PAGES.forEach(function (pg, pi) {
      var pdiv = FormsUI.el('div', { 'class': 'formpage stack', 'data-page': pi });
      if (PAGES.length > 1 && pg.title) pdiv.appendChild(FormsUI.el('div', { 'class': 'section-head' }, FormsUI.esc(pg.title)));
      pg.fields.forEach(function (f) { pdiv.appendChild(renderField(f)); });
      host.appendChild(pdiv);
    });
    buildDupGroups();
    if (!LOCKED && !IS_PREVIEW && FIELDS.some(function (f) { return f.required; })) {
      // Say what actually gets saved. This used to read "your progress saves automatically on
      // this device" full stop, while saveDraft() skipped file/signature fields entirely — so a
      // parent who signed and attached a photo, then hit an expired session, lost exactly the
      // work the sentence had promised was safe. Those are persisted now (saveAttachDraft), but
      // only up to a size cap, so the caveat is named rather than implied.
      var hasAttachFields = FIELDS.some(function (f) { return f.type === 'file' || f.type === 'signature'; });
      host.parentNode.insertBefore(
        FormsUI.el('p', { 'class': 'help', 'style': 'margin:0 0 2px' },
          '<span class="req" aria-hidden="true">*</span> Required — your progress saves automatically on this device' +
          (hasAttachFields ? ', including your signature and small attachments.' : '.')),
        host);
    }

    if (!IS_EDIT) { applyPrefill(); applySchoolPrefill(); }
    initSignatures();
    if (IS_EDIT) {
      FIELDS.forEach(function (f) { if (EDIT_ANSWERS && EDIT_ANSWERS[f.id] != null) writeValue(f, EDIT_ANSWERS[f.id]); });
      markOnFileFields();
    } else {
      // URL-parameter prefill (staff-shared links): ?fieldId=value
      if (typeof URL_PREFILL === 'object' && URL_PREFILL) {
        FIELDS.forEach(function (f) { if (URL_PREFILL[f.id] != null && URL_PREFILL[f.id] !== '') writeValue(f, URL_PREFILL[f.id]); });
      }
      // The draft question is answered FIRST, and only then do last year's answers get a chance
      // to fill anything. Strictly sequential — two silent writers to the same inputs is what
      // made the two features indistinguishable in the first place.
      resolveDraftThen_(offerPriorYear_);
    }
    recomputeCalc();
    applyVisibility();
    host.addEventListener('input', onFieldChange);
    host.addEventListener('change', onFieldChange);
    CUR = 0; showPage(0, false); // initial paint: don't announce or grab focus

    if (form.reviewMode && !REVIEW_SHOWN) {
      REVIEW_SHOWN = true;
      var demo = (typeof window !== 'undefined' && window.PREVIEW) ? ' <em>(This is a demo — no email is actually sent.)</em>' : '';
      FormsUI.modal('Before you begin',
        'The email address you enter will receive <strong>two emails</strong> after you submit: a <strong>confirmation</strong> (to you as the requester) and a copy of the <strong>notification the form’s owner receives</strong>.' + demo,
        'Got it');
    }
  }

  // ---------- pagination ----------
  function showPage(i, announceStep) {
    CUR = Math.max(0, Math.min(i, PAGES.length - 1));
    document.querySelectorAll('.formpage').forEach(function (p) {
      p.style.display = (LOCKED || Number(p.getAttribute('data-page')) === CUR) ? '' : 'none';
    });
    renderNav();
    try { window.scrollTo({ top: 0, behavior: 'smooth' }); } catch (e) {}
    // P9: scrolling is not a change of state to anyone who can't see it. Announce the step and
    // put focus at the top of it, so Tab continues from the new page rather than the document.
    if (announceStep !== false && PAGES.length > 1) {
      var pageEl = document.querySelector('.formpage[data-page="' + CUR + '"]');
      FormsUI.announce('Step ' + (CUR + 1) + ' of ' + PAGES.length + (PAGES[CUR].title ? ': ' + PAGES[CUR].title : ''));
      FormsUI.focusView(pageEl);
    }
  }
  function renderNav() {
    var nav = document.getElementById('pageNav'); if (!nav) return;
    if (LOCKED) { nav.innerHTML = ''; document.querySelectorAll('.formpage').forEach(function (p) { p.style.display = ''; }); return; }
    var multi = PAGES.length > 1;
    var prog = multi ? '<div class="progress" role="progressbar" aria-valuemin="1" aria-valuemax="' + PAGES.length + '" aria-valuenow="' + (CUR + 1) + '" aria-label="Step ' + (CUR + 1) + ' of ' + PAGES.length + '"><div class="progress-bar" style="width:' + Math.round((CUR + 1) / PAGES.length * 100) + '%"></div></div>' +
      '<p class="help center">Step ' + (CUR + 1) + ' of ' + PAGES.length + (PAGES[CUR].title ? ' — ' + FormsUI.esc(PAGES[CUR].title) : '') + '</p>'
      : (FIELDS.length > 8 ? '<p class="help center" id="ansCount" aria-live="polite"></p>' : '');
    var btns = '<div style="display:flex;gap:10px;margin-top:14px">';
    if (multi && CUR > 0) btns += '<button class="btn ghost" id="prevBtn" type="button">← Back</button>';
    var lastPage = CUR >= PAGES.length - 1;
    btns += lastPage
      ? '<button class="btn block" id="submitBtn" type="button">' + (IS_EDIT ? 'Save changes' : 'Submit') + '</button>'
      : '<button class="btn block" id="nextBtn" type="button">Next →</button>';
    btns += '</div>';
    if (IS_EDIT && lastPage) btns += '<div style="margin-top:10px"><button class="btn ghost block" id="withdrawBtn" type="button" style="color:var(--hcs-red)">Withdraw this response</button></div>';
    // Clearing your own typing is a reset, so it belongs down here with submit — not in a
    // standing banner at the top competing with the pre-fill offer for attention.
    if (!IS_EDIT && !IS_PREVIEW && lastPage) btns += '<p class="help center" style="margin-top:12px">' +
      '<button class="btn plain" id="startOver" type="button">Start over</button></p>';
    nav.innerHTML = prog + btns;
    var pv = document.getElementById('prevBtn'); if (pv) pv.onclick = function () { showPage(CUR - 1); };
    var nx = document.getElementById('nextBtn'); if (nx) nx.onclick = onNext;
    var sb = document.getElementById('submitBtn'); if (sb) sb.onclick = onSubmit;
    var wb = document.getElementById('withdrawBtn'); if (wb) wb.onclick = onWithdraw;
    var so = document.getElementById('startOver');
    if (so) so.onclick = function () {
      FormsUI.confirm('Start over?', 'This clears everything you have typed on this device. ' +
        'Anything already submitted is unaffected.', 'Start over').then(function (ok) {
        if (ok) { clearDraft(); restartForm_(); }
      });
    };
    updateAnswerCount();
  }
  // "X of N required questions answered" — orientation on long single-page forms.
  function updateAnswerCount() {
    var el = document.getElementById('ansCount'); if (!el) return;
    var ans = currentAnswers();
    var req = FIELDS.filter(function (f) { return f.required && f.type !== 'calculation' && evalShowIf(f.showIf, ans); });
    if (!req.length) { el.textContent = ''; return; }
    var done = req.filter(function (f) {
      // A typed name alone no longer counts as "answered" for a signature — must be drawn
      // ink (or, editing, already on file) — same bar processAnswers_ enforces server-side.
      if (f.type === 'signature') return (ATTACH[f.id] && ATTACH[f.id].length) || (IS_EDIT && ON_FILE[f.id]);
      if (f.type === 'file') return (ATTACH[f.id] && ATTACH[f.id].length) || !fieldEmpty(f, ans[f.id]);
      return !fieldEmpty(f, ans[f.id]);
    }).length;
    el.textContent = done + ' of ' + req.length + ' required questions answered';
  }
  function onNext() {
    if (uploadsPending('nextBtn')) return;
    var r = validatePage(CUR);
    var formErr = document.getElementById('formErr');
    if (!r.ok) { formErr.style.display = 'block'; formErr.textContent = 'Please fix the highlighted fields.'; navigateToField(r.firstBad); return; }
    formErr.style.display = 'none';
    showPage(CUR + 1);
  }
  // if files are still being read, wait and retry so an attachment is never dropped
  function uploadsPending(btnId) {
    if (PENDING_READS <= 0) return false;
    var fe = document.getElementById('formErr'); if (fe) { fe.style.display = 'block'; fe.textContent = 'Your file is still attaching — one moment…'; }
    setTimeout(function () { var b = document.getElementById(btnId); if (b) b.click(); }, 350);
    return true;
  }
  function validatePage(pi) {
    var ans = currentAnswers(), ok = true, firstBad = null;
    PAGES[pi].fields.forEach(function (f) {
      if (isContentType(f.type) || f.type === 'calculation') return;
      if (!evalShowIf(f.showIf, ans)) { setErr(f, ''); return; }
      var msg = '';
      if (f.type === 'file') { if (f.required && !(ATTACH[f.id] && ATTACH[f.id].length) && !(IS_EDIT && ON_FILE[f.id])) msg = 'Please attach a file.'; }
      else if (f.type === 'signature') { captureSignature(f); if (f.required && !(ATTACH[f.id] && ATTACH[f.id].length) && !(IS_EDIT && ON_FILE[f.id])) msg = 'Please sign in the box.'; }
      else {
        var v = readValue(f);
        if (f.required && fieldEmpty(f, v)) msg = 'This field is required.';
        else if (!fieldEmpty(f, v) && f.type === 'email' && !EMAIL_RE.test(v)) msg = 'Enter a valid email address.';
        else if (!fieldEmpty(f, v)) msg = patternErr(f, v);
      }
      setErr(f, msg); if (msg) { ok = false; if (!firstBad) firstBad = f; }
    });
    return { ok: ok, firstBad: firstBad };
  }
  function pageOfField(fid) { for (var i = 0; i < PAGES.length; i++) if (PAGES[i].fields.some(function (f) { return f.id === fid; })) return i; return CUR; }
  function navigateToField(f) {
    if (!f) return; var pi = pageOfField(f.id); if (pi !== CUR) showPage(pi);
    var w = document.querySelector('[data-fid="' + f.id + '"]'); if (!w) return;
    w.scrollIntoView({ behavior: 'smooth', block: 'center' });
    var c = w.querySelector('input:not([type=hidden]),select,textarea,canvas'); if (c) { try { c.focus({ preventScroll: true }); } catch (e) { try { c.focus(); } catch (x) {} } }
  }
  function onFieldChange(e) { applyVisibility(); recomputeCalc(); saveDraft(); updateAnswerCount(); mirrorDuplicateQuestion(e); }

  // ---------- duplicate questions auto-fill each other ----------
  // Same label + type asked twice on one form (e.g. repeated in different sections) — answering
  // either one fills the other, live. Only plain single-control types are mirrored; file/
  // signature/multiAnswer/calculation/content-types are excluded (no sensible generic copy).
  var DUP_GROUPS = {}; // fieldId -> [other fieldIds sharing its label+type]
  var DUP_MIRRORABLE_TYPES = { text: 1, textarea: 1, number: 1, email: 1, phone: 1, date: 1, time: 1,
    dropdown: 1, radio: 1, checkboxes: 1, yesno: 1, rating: 1, studentPicker: 1, staffPicker: 1 };
  function buildDupGroups() {
    // Same label used under DIFFERENT sections (e.g. "Name" under "Administrator" AND under
    // "Fine Arts Director") must never mirror each other — they're clearly different people.
    // Fields with no section at all (or two fields in the SAME section) are unaffected and
    // still mirror. sectionOf[fid] = the enclosing sectionHeader's id, or '' if none/reset by
    // a sectionEnd — walked once over VISALL (the full ordered content+input list) since
    // FIELDS alone has no section markers to walk.
    var sectionOf = {}, curSection = '';
    VISALL.forEach(function (f) {
      if (f.type === 'sectionHeader') { curSection = f.id; return; }
      if (f.type === 'sectionEnd') { curSection = ''; return; }
      sectionOf[f.id] = curSection;
    });
    var byKey = {};
    FIELDS.forEach(function (f) {
      if (!DUP_MIRRORABLE_TYPES[f.type]) return;
      var norm = String(f.label || '').trim().toLowerCase().replace(/\s+/g, ' ');
      if (!norm) return;
      var key = f.type + '::' + norm + '::' + (sectionOf[f.id] || '');
      (byKey[key] = byKey[key] || []).push(f.id);
    });
    DUP_GROUPS = {};
    Object.keys(byKey).forEach(function (k) {
      var ids = byKey[k];
      if (ids.length < 2) return;
      ids.forEach(function (id) { DUP_GROUPS[id] = ids.filter(function (x) { return x !== id; }); });
    });
  }
  function mirrorDuplicateQuestion(e) {
    if (!e || !e.target || !e.target.closest) return;
    var wrap = e.target.closest('[data-fid]'); if (!wrap) return;
    var fid = wrap.getAttribute('data-fid');
    var mates = DUP_GROUPS[fid]; if (!mates || !mates.length) return;
    var f = FIELDS.filter(function (x) { return x.id === fid; })[0]; if (!f) return;
    var v = readValue(f);
    mates.forEach(function (mid) {
      var mf = FIELDS.filter(function (x) { return x.id === mid; })[0];
      if (mf) writeValue(mf, v);
    });
  }

  // ---------- calculation fields ----------
  // evalShowIf + computeCalc come from SharedLogic.html (generated from Logic.js) — one source, server-identical.
  function recomputeCalc() {
    var ans = currentAnswers();
    // mirror the server: hidden fields don't count
    FIELDS.forEach(function (f) { if (!evalShowIf(f.showIf, ans)) ans[f.id] = isMultiField(f) ? [] : ''; });
    FIELDS.forEach(function (f) { if (f.type === 'calculation') { var el = document.getElementById('f_' + f.id); if (el) el.textContent = computeCalc(f, ans); } });
  }

  // ---------- save & resume (localStorage) ----------
  var DRAFT_PREFIX = 'hcsFormsDraft:', ATTACH_PREFIX = 'hcsFormsAttach:';
  // Signature/file payloads are base64 and can be large; localStorage is ~5 MB per origin for
  // ALL keys combined. Cap what we persist well under that, and NEVER pretend we saved
  // something we dropped (see attachRestoreNotice_).
  var ATTACH_DRAFT_MAX_CHARS = 2 * 1024 * 1024; // ~1.5 MB of binary once base64-decoded
  var ATTACH_DRAFT_SKIPPED = false;             // true when the payload was too big to persist

  /**
   * Drafts are scoped to WHO is filling the form, not just which form it is.
   * The old key was 'hcsFormsDraft:<formId>' — form-scoped only — so on a shared family or
   * library computer the next person to open the same form got the previous person's answers
   * restored under a friendly "We restored your saved progress" notice. Scoping by verified
   * email (or picked school, for MACS) keeps that from crossing between people on one device.
   */
  function draftScope_() {
    if (VIA === 'otp' && PREFILL && PREFILL.parent && PREFILL.parent.email) return String(PREFILL.parent.email).toLowerCase();
    var school = (typeof URL_PREFILL === 'object' && URL_PREFILL && URL_PREFILL.School) || '';
    if (school) return 'school:' + String(school).toLowerCase();
    return 'anon';
  }
  function draftKey() { return DRAFT_PREFIX + FORM_ID + ':' + draftScope_(); }
  function attachDraftKey() { return ATTACH_PREFIX + FORM_ID + ':' + draftScope_(); }

  function saveDraft() {
    if (IS_EDIT) return; // editing an existing response — don't touch the new-submission draft
    try {
      var d = {};
      FIELDS.forEach(function (f) { if (f.type === 'file' || f.type === 'signature' || f.type === 'calculation') return; d[f.id] = readValue(f); });
      // Underscore-prefixed so it can never collide with a field id. A draft written before this
      // existed simply has no timestamp — draftAgeLabel_ says "earlier" for those.
      d._savedAt = new Date().getTime();
      localStorage.setItem(draftKey(), JSON.stringify(d));
    } catch (e) {}
  }

  /**
   * Persist the attachments too. Previously saveDraft() skipped file/signature fields entirely
   * while the form promised "your progress saves automatically on this device" and
   * friendlyErr_ told a parent whose session expired that their answers "will still be here" —
   * so a signed, photographed physical form was silently lost on the refresh we told them to do.
   * Called after any change to ATTACH (handleFiles / captureSignature / clearSignature).
   */
  function saveAttachDraft() {
    if (IS_EDIT) return;
    try {
      var payload = JSON.stringify(ATTACH || {});
      if (payload === '{}') { localStorage.removeItem(attachDraftKey()); ATTACH_DRAFT_SKIPPED = false; return; }
      if (payload.length > ATTACH_DRAFT_MAX_CHARS) {
        // Too big to keep. Drop any stale copy and remember to SAY so, rather than leaving a
        // half-truthful "we saved everything" impression.
        localStorage.removeItem(attachDraftKey());
        ATTACH_DRAFT_SKIPPED = true;
        return;
      }
      localStorage.setItem(attachDraftKey(), payload);
      ATTACH_DRAFT_SKIPPED = false;
    } catch (e) {
      // Quota or private-mode failure — same rule: don't claim it's saved.
      ATTACH_DRAFT_SKIPPED = true;
      try { localStorage.removeItem(attachDraftKey()); } catch (e2) {}
    }
  }

  /** Re-hydrate ATTACH from the draft, redrawing any signature back onto its canvas. */
  function restoreAttachDraft() {
    var raw; try { raw = localStorage.getItem(attachDraftKey()); } catch (e) { return false; }
    if (!raw) return false;
    var saved; try { saved = JSON.parse(raw); } catch (e) { return false; }
    var restored = 0;
    Object.keys(saved).forEach(function (fid) {
      var f = FIELDS.filter(function (x) { return x.id === fid; })[0];
      if (!f || !saved[fid] || !saved[fid].length) return;
      ATTACH[fid] = saved[fid];
      restored++;
      if (f.type === 'signature') {
        SIG_DRAWN[fid] = true;
        var c = document.getElementById('sig_' + fid);
        if (c) {
          c.classList.add('has-ink');
          var img = new Image();
          img.onload = function () {
            var ratio = window.devicePixelRatio || 1;
            try { c.getContext('2d').drawImage(img, 0, 0, c.width / ratio, c.height / ratio); } catch (e) {}
          };
          img.src = 'data:' + (saved[fid][0].mimeType || 'image/png') + ';base64,' + saved[fid][0].b64;
        }
      } else {
        var list = document.getElementById('fl_' + fid);
        if (list) {
          list.innerHTML = saved[fid].map(function (at) {
            return '<div class="fitem">📎 ' + FormsUI.esc(at.name || 'file') + ' <span class="muted">(restored)</span></div>';
          }).join('');
        }
      }
    });
    return restored > 0;
  }

  function clearAllDrafts_() { FormsUI.clearAllDrafts([DRAFT_PREFIX, ATTACH_PREFIX]); }
  // In edit mode, note which file/signature fields already have a value so re-upload is optional.
  function markOnFileFields() {
    Object.keys(ON_FILE || {}).forEach(function (id) {

      // one instead of overwriting it with this now-empty read. Only discard/replace when the
      // canvas still has ink, or there's no prior good capture to fall back on.
      if (canvasIsBlank_(c) && ATTACH[f.id] && ATTACH[f.id].length) return;
      ATTACH[f.id] = [{ name: 'signature.png', mimeType: 'image/png', b64: c.toDataURL('image/png').split(',')[1] }];
    } else { delete ATTACH[f.id]; }
  }
  /** Capture + persist every drawn signature. Called on stroke-end (see setupSigPad) so a
   *  signature survives a refresh/session expiry, not only a submit attempt. */
  function captureAndSaveSignatures_() {
    FIELDS.forEach(function (f) { if (f.type === 'signature') captureSignature(f); });
    afterAttachChange_();
  }

  // dropdown (single) or checkbox group (multiple) shared by student/staff pickers
  function pickerControl(name, opts, multiple, ph) {
    if (multiple) {
      return '<div class="choices">' + opts.map(function (o) {
        return '<label class="choice"><input type="checkbox" name="' + name + '" value="' + FormsUI.esc(o.v) + '"><span>' + FormsUI.esc(o.label) + '</span></label>';
      }).join('') + '</div>';
    }
    return '<select class="control" id="' + name + '">' +
      (opts.length !== 1 ? '<option value="">' + FormsUI.esc(ph) + '</option>' : '') +
      opts.map(function (o) { return '<option value="' + FormsUI.esc(o.v) + '">' + FormsUI.esc(o.label) + '</option>'; }).join('') + '</select>';
  }
  // isMultiField comes from SharedLogic.html (generated from Logic.js) — one shared predicate.
  // capacity remaining for an option (from server); full options are disabled + labeled
  function capNote(f, o) {
    if (!f.capacityLeft || f.capacityLeft[o] == null) return { full: false, suffix: '' };
    var left = f.capacityLeft[o];
    return { full: left <= 0, suffix: left <= 0 ? ' (full)' : ' (' + left + ' left)' };
  }

  // conditional logic (evalShowIf) + calc (computeCalc) live in SharedLogic.html — one source, generated from Logic.js.
  function currentAnswers() { var a = {}; FIELDS.forEach(function (f) { a[f.id] = readValue(f); }); return a; }
  function applyVisibility() {
    var ans = currentAnswers();
    VISALL.forEach(function (f) {
      var w = document.querySelector('[data-fid="' + f.id + '"]');
      if (w) w.style.display = evalShowIf(f.showIf, ans) ? '' : 'none';
    });
  }

  // ---------- prefill ----------
  function selectedStudent() {
    var picker = FIELDS.filter(function (f) { return f.type === 'studentPicker'; })[0];
    if (!picker || !PREFILL) return null;
    var v = readValue(picker);
    var arr = Array.isArray(v) ? v : (v ? [v] : []);
    if (arr.length !== 1) return null; // grade derive only makes sense for a single selected student
    return (PREFILL.students || []).filter(function (s) { return s.displayName === arr[0]; })[0] || null;
  }
  function setVal(id, v) { var el = document.getElementById('f_' + id); if (el != null && v != null) el.value = v; }

  // Independent of applyPrefill()/PREFILL — MACS/open-access forms are never OTP-verified, so
  // PREFILL is always null for them (buildPrefill_ only returns non-null for verifiedVia:'otp'),
  // and applyPrefill() bails out immediately on that. The school-picker field has nothing to do
  // with FACTS/OTP prefill, so it must run unconditionally.
  function applySchoolPrefill() {
    var schoolField = FIELDS.filter(function (f) { return f.prefillFrom === 'schoolPicker'; })[0];
    if (!schoolField) return;
    var schoolVal = (typeof URL_PREFILL === 'object' && URL_PREFILL && URL_PREFILL.School) || '';
    setVal(schoolField.id, schoolVal);
    var sel = document.getElementById('f_' + schoolField.id);
    if (sel) { sel.readOnly = true; sel.setAttribute('readonly', 'readonly'); }
    // A <select> silently ignores an assignment that matches none of its <option>s, falling back
    // to displaying its FIRST option — so a school-picker field whose hand-typed options have
    // drifted from MACS_SCHOOLS looks correctly filled while actually holding ''. Everything
    // downstream (prior-year lookup, the stored answer) then keys off nothing at all. Say so
    // rather than letting it read as "pre-fill just doesn't work".
    if (schoolVal && sel && !readValue(schoolField)) {
      schoolPrefillBanner_({
        phase: 'record', icon: 'info',
        title: 'This form’s school list doesn’t include “' + schoolVal + '”',
        detail: 'It couldn’t be filled in. Please tell the school office — the form needs updating.',
        action: null, dismissible: false
      }, schoolVal);
      return;
    }
    // Deliberately does NOT start the prior-year lookup — resolveDraftThen_ does, once the
    // draft question is settled. This only puts the picked school into its locked field.
  }

  /**
   * The one banner about "remember from last time" on a school-picker form. Text/tone come from
   * schoolPrefillNotice (SharedLogic.html, generated from Logic.js) so the four states stay
   * Node-testable; this only paints it. Rendered above the fields, replacing itself on repaint.
   */
  /**
   * Paint the pre-fill component. Two phases, one slot (see docs/prefill-banner-options.html):
   * `offer` is a .pf-step with the email box disclosed in place, shown only while there IS
   * something to act on; `record` is a quiet full-bleed .pf-row stating what happened. Wording
   * and state mapping come from schoolPrefillNotice (SharedLogic.html, generated from Logic.js)
   * so the four states stay Node-testable — this only renders.
   */
  function schoolPrefillBanner_(notice, school) {
    var el = document.getElementById('pfSlot');
    if (!el) return;
    var gone = !notice || (notice.phase === 'offer' && PF_OFFER_HIDDEN);
    if (gone) { el.innerHTML = ''; return; }
    el.setAttribute('role', 'status');
    el.setAttribute('aria-live', 'polite');
    el.innerHTML = notice.phase === 'offer' ? pfOfferHtml_(notice) : pfRecordHtml_(notice);

    var act = document.getElementById('pfAction');
    if (act && notice.action) {
      var openCode = function () { act.style.display = 'none'; renderSchoolVerify_(school); };
      act.onclick = notice.action.kind === 'verify'
        // hide the trigger once its form is open — two ways to start the same thing reads as a bug
        ? openCode
        // an existing session skips the code; a STALE one still has to ask for it
        : function () {
            act.disabled = true; act.innerHTML = '<span class="spinner"></span> Filling in…';
            applyPriorYear_(school, function () {
              act.disabled = false; act.textContent = notice.action.label; openCode();
            });
          };
    }
    var skip = document.getElementById('pfSkip');
    if (skip) skip.onclick = function () { PF_OFFER_HIDDEN = true; schoolPrefillBanner_(notice, school); };
  }

  /** The OFFER phase — a real choice, so declining is a button and not just inaction. */
  function pfOfferHtml_(n) {
    return '<div class="pf-step">' +
      '<p class="pf-kick">Optional, before you start</p>' +
      '<div class="pf-head">' + FormsUI.icon(n.icon, { size: 22, cls: 'pf-ico' }) +
        '<div><p class="pf-t">' + FormsUI.esc(n.title) + '</p>' +
        '<p class="pf-d">' + FormsUI.esc(n.detail) + '</p></div>' +
      '</div>' +
      '<div class="pf-actions">' +
        '<button class="btn" id="pfAction" type="button">' + FormsUI.esc(n.action.label) + '</button>' +
        '<button class="btn plain" id="pfSkip" type="button">Start from blank</button>' +
      '</div>' +
      '<div id="schoolVerifyBox"></div>' +
    '</div>';
  }

  /** The RECORD phase — provenance, not a notice. Digits are wrapped for tabular alignment. */
  function pfRecordHtml_(n) {
    var cls = n.icon === 'check' ? ' is-ok' : (n.icon === 'shield' ? ' is-attn' : '');
    var title = FormsUI.esc(n.title).replace(/^(\d+)/, '<span class="pf-num">$1</span>');
    return '<div class="pf-row' + cls + '">' +
      FormsUI.icon(n.icon, { size: 20, cls: 'pf-ico' }) +
      '<div class="pf-body"><p class="pf-t">' + title + '</p>' +
        '<p class="pf-d">' + FormsUI.esc(n.detail) + '</p></div>' +
      (n.action
        ? '<div class="pf-side"><button class="btn plain" id="pfAction" type="button">' +
            FormsUI.esc(n.action.label) + '</button></div>'
        : '') +
    '</div>';
  }

  /**
   * Inline email verification, right where the pre-filled answers would land.
   *
   * This used to live on the school gate, which was the wrong place twice over: en route to the
   * guest portal there is nothing to pre-fill, and the token couldn't survive the hop to a form
   * anyway (portal tiles opened a new tab; round-2 audit M12 had moved the token from the URL
   * into per-tab sessionStorage). Verifying here needs no carrier — the token is used by the very
   * page that mints it. It's still ALSO written to sessionStorage under the same key the gate
   * used, so a second form opened in the same visit doesn't ask again (see the SCHOOL_TOKEN
   * fallback at the top of this file).
   *
   * Nothing about submitting depends on this — submitForm never checks a school token.
   */
  function renderSchoolVerify_(school) {
    var box = document.getElementById('schoolVerifyBox');
    if (!box) return;
    box.innerHTML =
      '<div class="pf-otp">' +
        '<div class="field"><label for="schoolOtpEmail">Email on file for ' +
          FormsUI.esc(school) + '</label>' +
          '<input class="control" type="email" id="schoolOtpEmail" autocomplete="email" ' +
            'placeholder="you@example.com"></div>' +
        '<div class="pf-actions"><button class="btn ghost" id="schoolOtpSend" type="button">Send code</button></div>' +
        '<div id="schoolOtpCodeBox"></div>' +
        '<p class="notice err" id="schoolOtpErr" style="display:none;margin-top:10px" role="alert"></p>' +
      '</div>';
    var emailEl = document.getElementById('schoolOtpEmail');
    var errEl = document.getElementById('schoolOtpErr');
    var sendBtn = document.getElementById('schoolOtpSend');
    emailEl.focus();
    function fail_(msg) { errEl.style.display = 'block'; errEl.textContent = msg; }

    sendBtn.onclick = function () {
      var email = emailEl.value.trim();
      errEl.style.display = 'none';
      if (!email) return fail_('Enter your email address first.');
      if (!EMAIL_RE.test(email)) return fail_('Enter a valid email address.');
      sendBtn.disabled = true; sendBtn.innerHTML = '<span class="spinner"></span> Sending…';
      google.script.run.withSuccessHandler(function (res) {
        sendBtn.disabled = false; sendBtn.textContent = 'Resend code';
        if (!res || !res.ok) return fail_((res && res.msg) || 'Could not send a code — try again.');
        document.getElementById('schoolOtpCodeBox').innerHTML =
          '<div class="field" style="margin-top:12px"><label for="schoolOtpCode">6-digit code</label>' +
            '<input class="control" id="schoolOtpCode" inputmode="numeric" ' +
            'autocomplete="one-time-code" maxlength="6" placeholder="000000" style="max-width:11rem"></div>' +
          '<div class="pf-actions"><button class="btn" id="schoolOtpVerify" type="button">Verify</button></div>';
        var vBtn = document.getElementById('schoolOtpVerify');
        vBtn.onclick = function () {
          errEl.style.display = 'none';
          vBtn.disabled = true; vBtn.innerHTML = '<span class="spinner"></span> Verifying…';
          google.script.run.withSuccessHandler(function (vres) {
            if (!vres || !vres.ok) {
              vBtn.disabled = false; vBtn.textContent = 'Verify';
              return fail_((vres && vres.msg) || 'Could not verify — try again.');
            }
            TOKEN = vres.token;
            // Same key the gate used, so another form this visit skips the prompt. Best-effort:
            // a private-mode or quota failure must not break the pre-fill we already have.
            try { sessionStorage.setItem('hcsSchoolToken:' + school, vres.token); } catch (e) {}
            applyPriorYear_(school); // the offer becomes the verified confirmation
          }).withFailureHandler(function (e) {
            vBtn.disabled = false; vBtn.textContent = 'Verify';
            fail_(FormsUI.friendlyErrCode(e));
          }).macsVerifyOtp(school, email, document.getElementById('schoolOtpCode').value.trim());
        };
      }).withFailureHandler(function (e) {
        sendBtn.disabled = false; sendBtn.textContent = 'Send code';
        fail_(FormsUI.friendlyErrCode(e));
      }).macsRequestOtp(school, email);
    };
  }

  function applyPrefill() {
    if (!PREFILL) return;
    var p = PREFILL.parent || {};
    var picker = FIELDS.filter(function (f) { return f.type === 'studentPicker'; })[0];

    // auto-select when the parent has exactly one student
    if (picker && (PREFILL.students || []).length === 1) {
      if (picker.multiple) {
        var cb = document.querySelector('input[name="f_' + picker.id + '"]');
        if (cb) { cb.checked = true; cb.closest('.choice').classList.add('selected'); }
      } else { setVal(picker.id, PREFILL.students[0].displayName); }
    }

    FIELDS.forEach(function (f) {
      switch (f.prefillFrom) {
        case 'parentFirst': setVal(f.id, p.first); break;
        case 'parentLast':  setVal(f.id, p.last); break;
        case 'parentEmail':
          setVal(f.id, p.email);
          var el = document.getElementById('f_' + f.id);
          if (el) { el.readOnly = true; el.setAttribute('readonly', 'readonly'); }
          break;
      }
    });
    collapseIdentityBlock();
    refreshStudentDerived();

    if (picker) {
      if (picker.multiple) {
        document.querySelectorAll('input[name="f_' + picker.id + '"]').forEach(function (cb) { cb.addEventListener('change', refreshStudentDerived); });
      } else {
        var pel = document.getElementById('f_' + picker.id);
        if (pel) pel.addEventListener('change', refreshStudentDerived);
      }
    }
  }

  // Verified parents shouldn't stare at inputs they never touch: hide successfully-prefilled
  // parent identity fields (the banner already says who's submitting) and any section header
  // left with nothing visible under it. "Update my info" reveals them for corrections.
  function collapseIdentityBlock() {
    if (VIA !== 'otp') return;
    var IDENTITY = { parentFirst: 1, parentLast: 1, parentEmail: 1 };
    var collapsed = 0;
    FIELDS.forEach(function (f) {
      if (!IDENTITY[f.prefillFrom]) return;
      if (!readValue(f)) return; // never hide a still-empty required field
      var w = document.querySelector('[data-fid="' + f.id + '"]');
      if (w) { w.classList.add('identity-collapsed'); collapsed++; }
    });
    if (!collapsed) return;
    // hide section headers whose entire section is now collapsed
    var hdr = null, hasVisible = false;
    var closeSection = function () {
      if (hdr && !hasVisible) { var hw = document.querySelector('[data-fid="' + hdr.id + '"]'); if (hw) hw.classList.add('identity-collapsed'); }
    };
    VISALL.forEach(function (f) {
      if (f.type === 'sectionHeader') { closeSection(); hdr = f; hasVisible = false; return; }
      var w = document.querySelector('[data-fid="' + f.id + '"]');
      if (w && !w.classList.contains('identity-collapsed')) hasVisible = true;
    });
    closeSection();
    var link = document.getElementById('showIdentity');
    if (link) {
      link.style.display = '';
      link.onclick = function (e) {
        e.preventDefault();
        document.querySelectorAll('.identity-collapsed').forEach(function (x) { x.classList.remove('identity-collapsed'); });
        link.style.display = 'none';
      };
    }
  }

  function refreshStudentDerived() {
    var s = selectedStudent();
    FIELDS.forEach(function (f) {
      if (f.prefillFrom === 'studentGradeNextYear') {
        // seed the next grade up (current+1) but leave EDITABLE so a parent can override
        var ng = s && typeof nextGrade === 'function' ? nextGrade(s.grade) : '';
        if (ng) setVal(f.id, ng);
        return;
      }
      if (f.prefillFrom !== 'studentGrade' && f.prefillFrom !== 'studentName') return;
      var v = s ? (f.prefillFrom === 'studentGrade' ? s.grade : s.displayName) : '';
      setVal(f.id, v);
      // Only lock when we actually derived a value; otherwise leave it editable so a parent
      // with 0 or >1 students selected can still complete a required field (no dead-end).
      if (v) lockField(f.id, true); else lockField(f.id, false);
    });
    maybePriorYear();
  }
  // Pre-fill "remembered" fields (priorYear) from this student's most recent prior submission to
  // this same form. Server-guarded to the OTP parent's own students; applied as editable defaults.
  // Shared by maybePriorYear/applyPriorYear_. A plain field's remembered value is
  // whatever readValue()/writeValue() already handle; a multiAnswer's is a PARTIAL {subLabel:
  // value} object (server already filtered it to only the subPriorYear-flagged sub-rows) —
  // each sub-row is written individually, skipping any the submitter already filled in.
  function applyPriorAnswers_(answers) {
    PRIOR_WROTE = [];   // exactly what this pass filled, so "Clear them" undoes only that
    FIELDS.forEach(function (f) {
      if (!fieldHasPriorYear(f) || answers[f.id] == null) return;
      if (f.type === 'multiAnswer') {
        var name = 'f_' + f.id;
        (f.subLabels || []).forEach(function (lbl, si) {
          if (answers[f.id][lbl] == null) return;
          var el = document.getElementById(name + '__' + si);
          if (el && !el.value) { el.value = answers[f.id][lbl]; PRIOR_WROTE.push({ id: f.id, sub: si }); }
        });
        return;
      }
      var cur = readValue(f);
      // never clobber an edit, or anything the restored draft already put here
      if (fieldEmpty(f, cur)) { writeValue(f, answers[f.id]); PRIOR_WROTE.push({ id: f.id }); markPriorField_(f); }
    });
    applyVisibility();
  }

  /**
   * Mark a field as coming from last year, next to its label, with its own undo.
   *
   * This is what replaced the standing summary row at the top of the form. A tally ("57 answers
   * carried over") can't tell you WHICH answers, which is the only thing worth knowing when you
   * are deciding whether a value is still true — so the record lives on the fields instead, and
   * the top of the form is left for actions not yet taken.
   */
  function markPriorField_(f) {
    var wrap = document.querySelector('[data-fid="' + f.id + '"]');
    if (!wrap) return;
    var lbl = wrap.querySelector('label, .lbl, .fieldlabel');
    if (!lbl || lbl.querySelector('.pf-mark')) return;
    var mark = FormsUI.el('span', { 'class': 'pf-mark' },
      FormsUI.icon('check', { size: 11 }) + 'Last year');
    lbl.appendChild(mark);
    var undo = FormsUI.el('button', { 'class': 'pf-undo', 'type': 'button',
      'aria-label': 'Clear the value carried over for ' + (f.label || 'this field') }, 'Undo');
    undo.onclick = function () { undoPriorField_(f); };
    lbl.appendChild(undo);
  }

  /** Clear one carried-over field and drop its mark. */
  function undoPriorField_(f) {
    PRIOR_WROTE = PRIOR_WROTE.filter(function (w) { return w.id !== f.id; });
    writeValue(f, isMultiField(f) ? [] : '');
    var el = document.getElementById('f_' + f.id);
    if (el && 'value' in el) el.value = '';
    var wrap = document.querySelector('[data-fid="' + f.id + '"]');
    if (wrap) {
      var m = wrap.querySelector('.pf-mark'); if (m) m.remove();
      var u = wrap.querySelector('.pf-undo'); if (u) u.remove();
    }
    recomputeCalc(); applyVisibility(); saveDraft();
    if (el && el.focus) el.focus();
  }

  function maybePriorYear() {
    if (VIA !== 'otp' || IS_PREVIEW || IS_EDIT) return;
    if (!FIELDS.some(fieldHasPriorYear)) return;
    var s = selectedStudent(); if (!s) return;
    google.script.run.withSuccessHandler(function (res) {
      if (!res || !res.ok || !res.answers) return;
      applyPriorAnswers_(res.answers);
    }).getPriorAnswersForStudent(FORM_ID, TOKEN, s.displayName);
  }
  // Same idea as maybePriorYear(), keyed on the picked school instead of a student — MACS's
  // anonymous "open-picker" forms have no OTP identity, so the school choice is the key.
  /** The picked school's own allowlist flag, straight from the gate's payload — no server round
   *  trip just to decide whether an offer is worth showing. MACS_SCHOOLS only exists on
   *  runner-macs; the guard keeps this inert everywhere else. */
  function schoolOtpAvailable_(school) {
    if (typeof MACS_SCHOOLS === 'undefined' || !MACS_SCHOOLS) return false;
    var m = MACS_SCHOOLS.filter(function (x) { return x.name === school; })[0];
    return !!(m && m.otp);
  }

  function priorYearSchool_() {
    var picker = FIELDS.filter(function (f) { return f.prefillFrom === 'schoolPicker'; })[0];
    if (!picker || !FIELDS.some(fieldHasPriorYear)) return '';
    return readValue(picker) || '';
  }

  /**
   * OFFER last year's answers. Never fills anything on its own — not even when a verified
   * session from an earlier form this visit is already in hand, which only changes the button
   * from "Verify my email" to "Use last year's answers". Nothing reads the response sheet until
   * that button is pressed, so the respondent is never handed values they didn't ask for.
   */
  function offerPriorYear_() {
    if (IS_PREVIEW || IS_EDIT) return;
    var school = priorYearSchool_(); if (!school) return;
    schoolPrefillBanner_(schoolPrefillNotice({
      school: school, otpAvailable: schoolOtpAvailable_(school), hasToken: !!TOKEN
    }), school);
  }

  /**
   * Offer accepted: fetch and apply. A stale session token comes back verified:false — fall
   * through to the code flow rather than doing nothing visible.
   */
  function applyPriorYear_(school, onNeedsVerify) {
    google.script.run.withSuccessHandler(function (res) {
      if (!res || !res.ok) return;
      if (!res.verified) { if (onNeedsVerify) onNeedsVerify(); return; }
      if (res.answers) applyPriorAnswers_(res.answers);
      schoolPrefillBanner_(schoolPrefillNotice({
        school: school, otpAvailable: true, verified: true, filled: res.filled, email: res.email
      }), school);
    }).withFailureHandler(function () { /* leave the offer standing so it can be retried */ })
      .getPriorAnswersForSchool(FORM_ID, school, TOKEN);
  }

  function lockField(id, on) {
    var el = document.getElementById('f_' + id);
    if (!el) return;
    el.readOnly = !!on;
    if (on) el.setAttribute('readonly', 'readonly'); else el.removeAttribute('readonly');
  }

  // ---------- collect + validate + submit ----------
  function readValue(f) {
    var name = 'f_' + f.id;
    if (f.type === 'calculation') { var ce = document.getElementById(name); return ce ? ce.textContent.trim() : ''; }
    if (f.type === 'multiAnswer') {
      var out = {};
      (f.subLabels || []).forEach(function (lbl, si) {
        var el2 = document.getElementById(name + '__' + si);
        out[lbl] = el2 ? el2.value.trim() : '';
      });
      return out;
    }
    if (isMultiField(f)) return Array.prototype.slice.call(document.querySelectorAll('input[name="' + name + '"]:checked')).map(function (i) { return i.value; });
    if (f.type === 'radio' || f.type === 'yesno' || f.type === 'rating') { var c = document.querySelector('input[name="' + name + '"]:checked'); return c ? c.value : ''; }
    var el = document.getElementById(name); return el ? el.value.trim() : '';
  }
  function fieldEmpty(f, v) { return isMultiField(f) ? v.length === 0 : v === ''; }
  // Mirrors RunnerApi.js's pattern check client-side so a format mismatch (e.g. "Numbers only")
  // shows inline instead of only bouncing back after a full submit round-trip.
  function patternErr(f, v) {
    var pat = f.validation && f.validation.pattern;
    if (!pat || v === '') return '';
    try { return new RegExp(pat).test(v) ? '' : (f.validation.patternMsg || 'Invalid format.'); }
    catch (e) { return ''; }
  }
  // HTML pattern/inputmode attrs for render-time — pattern gives native browser hint/highlight,
  // patternErr (above) still does the real check since <input pattern> alone doesn't block submit.
  function patternAttrs(f) {
    var pat = f.validation && f.validation.pattern;
    if (!pat) return '';
    var out = ' pattern="' + FormsUI.esc(pat) + '"';
    if (pat === '^[0-9]+$') out += ' inputmode="numeric"';
    return out;
  }
  function setErr(f, msg) {
    var wrap = document.querySelector('[data-fid="' + f.id + '"]');
    if (!wrap) return;
    wrap.classList.toggle('invalid', !!msg);
    wrap.querySelector('.error').textContent = msg || '';
    var primary = wrap.querySelector('#f_' + f.id) || wrap.querySelector('.choices');
    if (primary) { if (msg) primary.setAttribute('aria-invalid', 'true'); else primary.removeAttribute('aria-invalid'); }
  }

  function onSubmit() {
    if (uploadsPending('submitBtn')) return;
    // Preflight the SAME total the server enforces, so an over-limit submission is caught here
    // — with the same wording — instead of after a full round trip. captureSignature runs in
    // the validation loop below, but signatures already in ATTACH count now.
    FIELDS.forEach(function (f) { if (f.type === 'signature') captureSignature(f); });
    if (attachedBytes_() > ATTACH_LIMITS.MAX_TOTAL_BYTES) {
      var feAtt = document.getElementById('formErr');
      feAtt.style.display = 'block';
      feAtt.textContent = attachTotalTooLargeMsg();
      renderAttachTotal_();
      try { feAtt.scrollIntoView({ behavior: 'smooth', block: 'center' }); } catch (e) {}
      return;
    }
    var answers = {}, firstBad = null, ok = true;
    var ans0 = currentAnswers(), vis = {};
    FIELDS.forEach(function (f) { vis[f.id] = evalShowIf(f.showIf, ans0); });
    FIELDS.forEach(function (f) {
      if (!vis[f.id]) return; // hidden by conditional logic — don't validate or submit
      var msg = '';
      if (f.type === 'file') {
        if (f.required && !(ATTACH[f.id] && ATTACH[f.id].length) && !(IS_EDIT && ON_FILE[f.id])) msg = 'Please attach a file.';
      } else if (f.type === 'signature') {
        captureSignature(f);
        answers[f.id] = readValue(f); // printed name (optional caption, never satisfies "required" alone)
        if (f.required && !(ATTACH[f.id] && ATTACH[f.id].length) && !(IS_EDIT && ON_FILE[f.id])) msg = 'Please sign in the box.';
      } else if (f.type === 'multiAnswer') {
        var vMa = readValue(f); answers[f.id] = vMa;
        var subs = f.subLabels || [], reqMap = f.subRequired || {};
        for (var si2 = 0; si2 < subs.length; si2++) {
          if (reqMap[subs[si2]] && !vMa[subs[si2]]) { msg = 'Please fill in "' + subs[si2] + '".'; break; }
        }
      } else {
        var v = readValue(f); answers[f.id] = v;
        if (f.required && fieldEmpty(f, v)) msg = 'This field is required.';
        else if (!fieldEmpty(f, v) && f.type === 'email' && !EMAIL_RE.test(v)) msg = 'Enter a valid email address.';
        else if (!fieldEmpty(f, v)) msg = patternErr(f, v);
      }
      setErr(f, msg);
      if (msg) { ok = false; if (!firstBad) firstBad = f; }
    });
    var formErr = document.getElementById('formErr');
    if (!ok) {
      formErr.style.display = 'block'; formErr.textContent = 'Please fix the highlighted fields.';
      FormsUI.announce('This form has errors. Please fix the highlighted fields.');
      navigateToField(firstBad);
      return;
    }
    formErr.style.display = 'none';
    LAST_ANSWERS = answers; // remembered so "add another child" can carry the parent/common fields over
    if (IS_PREVIEW) { onSubmitDone({ ok: true, message: 'This is a preview — your response was NOT saved.', submissionId: 'PREVIEW' }); return; }
    var btn = document.getElementById('submitBtn'); btn.disabled = true;
    var label = IS_EDIT ? 'Save changes' : 'Submit';
    btn.innerHTML = '<span class="spinner"></span> ' + (IS_EDIT ? 'Saving…' : 'Submitting…');
    // Building a PDF template (Slides fill + export) can add several seconds on top of the
    // plain write-to-sheet — nudge the submitter after a delay so it doesn't read as hung.
    // Fires on a delay rather than being conditioned on the form actually having a PDF
    // template so the client never needs to know that detail.
    var pdfHintT = setTimeout(function () {
      if (btn.disabled) btn.innerHTML = '<span class="spinner"></span> Building your PDF copy — this can take a moment…';
    }, 4000);
    var clearPdfHint = function () { clearTimeout(pdfHintT); };
    var run = google.script.run
      .withSuccessHandler(function (res) { clearPdfHint(); onSubmitDone(res); })
      .withFailureHandler(function (e) { clearPdfHint(); btn.disabled = false; btn.textContent = label; formErr.style.display = 'block'; formErr.textContent = friendlyErr_(e); });
    if (IS_EDIT) run.updateSubmission(FORM_ID, EDIT_ID, EDIT_T, answers, ATTACH);
    else run.submitForm(FORM_ID, answers, TOKEN, ATTACH, ((document.getElementById('hpField') || {}).value || ''));
  }

  function onWithdraw() {
    FormsUI.confirm('Withdraw this response?', 'This cancels your submission. This can’t be undone, but you can submit the form again afterward.', 'Withdraw', 'Keep it')
      .then(function (yes) {
        if (!yes) return;
        var wb = document.getElementById('withdrawBtn'); if (wb) { wb.disabled = true; wb.innerHTML = '<span class="spinner"></span> Withdrawing…'; }
        google.script.run
          .withSuccessHandler(function (res) {
            if (res && res.ok) {
              shell('<div class="card flush-top card-pad center stack"><div style="color:var(--hcs-red)">' + FormsUI.icon('check', { cls: 'hcsi-lg' }) + '</div>' +
                '<h1 class="form-title">Response withdrawn</h1>' +
                '<p class="form-desc">' + FormsUI.esc(res.message || 'Your response has been withdrawn.') + '</p></div>');
              FormsUI.announce('Response withdrawn.');
              FormsUI.focusView(document.querySelector('#app .card'));
            } else {
              if (wb) { wb.disabled = false; wb.textContent = 'Withdraw this response'; }
              var fe = document.getElementById('formErr'); if (fe) { fe.style.display = 'block'; fe.textContent = (res && res.message) || (res && reasonText(res)[1]) || 'Could not withdraw this response.'; }
            }
          })
          .withFailureHandler(function (e) { if (wb) { wb.disabled = false; wb.textContent = 'Withdraw this response'; } var fe = document.getElementById('formErr'); if (fe) { fe.style.display = 'block'; fe.textContent = friendlyErr_(e); } })
          .withdrawSubmission(FORM_ID, EDIT_ID, EDIT_T);
      });
  }

  function onSubmitDone(res) {
    var btn = document.getElementById('submitBtn'), formErr = document.getElementById('formErr');
    if (!res || !res.ok) {
      if (btn) { btn.disabled = false; btn.textContent = IS_EDIT ? 'Save changes' : 'Submit'; }
      if (res && res.errors) { FIELDS.forEach(function (f) { if (res.errors[f.id]) setErr(f, res.errors[f.id]); }); formErr.style.display = 'block'; formErr.textContent = 'Please fix the highlighted fields.'; }
      else { formErr.style.display = 'block'; formErr.textContent = (res && res.message) || 'Submission failed. Please try again.'; }
      return;
    }
    if (!IS_EDIT) clearDraft();
    var canAddChild = !IS_PREVIEW && !IS_EDIT && FORM && FORM.multiStudent && VIA === 'otp' &&
      FIELDS.some(function (f) { return f.type === 'studentPicker'; });
    var nextStep = res.status === 'Pending Approval'
      ? '<div class="notice info" style="text-align:left">Your submission will be reviewed. You’ll get an email with the decision.</div>' : '';
    // Per round-2 audit P20: the Drive copy is private now (staff-side record only), so the
    // submitter's copy comes back as bytes in the response and is offered as a real download
    // (Blob -> createObjectURL -> a.download -> click, same mechanism Builder.html's CSV export
    // uses) — never a new-tab link to a shared Drive file, and never a plain blob-URL open,
    // which the googleusercontent sandbox can block.
    var pdfCopies = res.pdfCopies || [];
    var pdfLinks = pdfCopies.length
      ? pdfCopies.map(function (d, i) {
          return '<button type="button" class="btn ghost block" data-pdfcopy="' + i + '">' +
            FormsUI.icon('download') + ' Download a copy (' + FormsUI.esc(d.name) + ')</button>';
        }).join('')
      : (res.pdfCopiesOverCap ? '<p class="help">Your copy is attached to the confirmation email.</p>' : '');
    var doneTitle = IS_EDIT ? 'Changes saved' : 'Submitted';
    shell('<div class="card flush-top card-pad center stack">' +
      '<div style="color:var(--hcs-red)">' + FormsUI.icon('check', { cls: 'hcsi-lg' }) + '</div>' +
      '<h1 class="form-title">' + doneTitle + '</h1>' +
      '<p class="form-desc">' + FormsUI.esc(res.message) + '</p>' +
      nextStep +
      pdfLinks +
      '<p class="help">Reference: ' + FormsUI.esc(res.displayLabel || res.submissionId) + '</p>' +
      (canAddChild ? '<button class="btn block" id="addChildBtn" type="button">' + FormsUI.icon('plus') + ' Save &amp; add another child</button>' : '') +
      (IS_PREVIEW || IS_EDIT ? '' : '<button class="btn ghost" id="anotherBtn" type="button">' + (canAddChild ? 'I’m done' : 'Submit another response') + '</button>') +
      '</div>');
    document.querySelectorAll('[data-pdfcopy]').forEach(function (b) {
      b.onclick = function () {
        var d = pdfCopies[Number(b.getAttribute('data-pdfcopy'))];
        if (!d) return;
        var bin = atob(d.b64), bytes = new Uint8Array(bin.length);
        for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
        var blob = new Blob([bytes], { type: 'application/pdf' });
        var url = URL.createObjectURL(blob);
        var a = document.createElement('a'); a.href = url; a.download = d.name; a.click();
        setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
      };
    });
    var acb = document.getElementById('addChildBtn'); if (acb) acb.onclick = addAnotherChild;
    var anb = document.getElementById('anotherBtn'); if (anb) anb.onclick = restartForm_;
    FormsUI.announce(doneTitle + '. ' + (res.message || '') + ' Reference ' + (res.displayLabel || res.submissionId || ''));
    FormsUI.focusView(document.querySelector('#app .card'));
  }

  // Re-open the form for the parent's NEXT child: keep parent + common answers, reset the student
  // (and student-derived + file/signature fields). Produces a separate response row per child.
  function addAnotherChild() {
    var keep = LAST_ANSWERS || {};
    // What does NOT carry over: the student picker, student-derived fields, and every
    // file/signature field. A toast saying "your info was kept" was actively misleading for a
    // parent who had just signed and attached a physical form for child 1 — they'd submit child
    // 2 believing the signature came along. Spell it out, once, before they start.
    var resetFields = FIELDS.filter(function (f) { return f.type === 'file' || f.type === 'signature'; });
    var resetNames = resetFields.map(function (f) { return f.label || (f.type === 'signature' ? 'Signature' : 'Attachment'); });

    ATTACH = {}; SIG_DRAWN = {}; ATTACH_DRAFT_SKIPPED = false;
    renderForm(FORM); // fresh render — applyPrefill re-fills parent fields and resets the picker
    FIELDS.forEach(function (f) {
      if (f.type === 'studentPicker' || f.type === 'file' || f.type === 'signature') return;
      if (f.prefillFrom === 'studentGrade' || f.prefillFrom === 'studentName' || f.prefillFrom === 'studentGradeNextYear') return;
      if (keep[f.id] != null) writeValue(f, keep[f.id]);
    });
    recomputeCalc(); applyVisibility(); renderAttachTotal_();
    try { window.scrollTo({ top: 0, behavior: 'smooth' }); } catch (e) {}

    var body = '<p style="margin:0 0 10px">Your contact details and shared answers were kept. ' +
      'Choose your next child to continue.</p>';
    if (resetNames.length) {
      body += '<p style="margin:0 0 6px"><strong>You’ll need to redo these for this child:</strong></p><ul style="margin:0;padding-left:20px">' +
        resetNames.map(function (n) { return '<li>' + FormsUI.esc(n) + '</li>'; }).join('') + '</ul>';
    }
    FormsUI.modal('Next child', body, 'Got it');
  }
})();
</script>
