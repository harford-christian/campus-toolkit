<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Custom Forms — Showcase demo</title>
<style>
  :root { --maroon:#8B1E1E; --gold:#D4AF37; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { display: flex; flex-direction: column; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: #f4f5f7; }
  .bar {
    flex: none; display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
    padding: 10px 16px; color: #fff;
    background: linear-gradient(120deg, #5f1414 0%, #8B1E1E 55%, #a52a2a 100%);
    box-shadow: 0 4px 14px rgba(0,0,0,.35); z-index: 2;
  }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 1.05rem; }
  .brand .logo { font-size: 1.5rem; }
  .brand small { display: block; font-weight: 600; font-size: .72rem; opacity: .85; }
  .seg { display: inline-flex; background: rgba(255,255,255,.14); border: 1px solid rgba(255,255,255,.25); border-radius: 999px; padding: 4px; gap: 2px; flex-wrap: wrap; }
  .seg button {
    border: 0; cursor: pointer; font: inherit; font-weight: 700; font-size: .86rem;
    color: #fff; background: transparent; padding: 8px 13px; border-radius: 999px;
    display: inline-flex; align-items: center; gap: 6px; transition: background .12s;
  }
  .seg button:hover { background: rgba(255,255,255,.16); }
  .seg button.active { background: var(--gold); color: #3a2b00; }
  .seg .rule { width: 1px; align-self: stretch; margin: 2px 5px; background: rgba(255,255,255,.28); }
  .spacer { flex: 1; }
  .hint { font-size: .78rem; opacity: .85; max-width: 26rem; line-height: 1.35; }
  .back { color: #fff; text-decoration: none; font-weight: 700; font-size: .86rem; opacity: .9; border: 1px solid rgba(255,255,255,.3); padding: 7px 12px; border-radius: 999px; white-space: nowrap; }
  .back:hover { background: rgba(255,255,255,.12); }
  .stage { flex: 1; position: relative; background: #f4f5f7; }
  .stage iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; display: block; background: #f4f5f7; }
  @media (max-width: 1480px) { .hint { display: none; } }
  @media (max-width: 760px) { .brand small { display: none; } .seg button { padding: 7px 9px; font-size: .78rem; } }
</style>
</head>
<body>
  <div class="bar">
    <div class="brand">
      <span class="logo" aria-hidden="true">📝</span>
      <span>Custom Forms<small>Five Apps Script apps, one form system</small></span>
    </div>
    <div class="seg" role="tablist" aria-label="Choose an app">
      <button data-src="chooser.html" aria-selected="false">🚪 Front door</button>
      <span class="rule" aria-hidden="true"></span>
      <button data-src="builder.html" class="active" aria-selected="true">🛠️ Builder</button>
      <button data-src="staff.html" aria-selected="false">🏫 Staff portal</button>
      <span class="rule" aria-hidden="true"></span>
      <button data-src="parent.html" aria-selected="false">👪 Parent portal</button>
      <button data-src="macs.html" aria-selected="false">🎓 MACS forms</button>
    </div>
    <span class="spacer"></span>
    <span class="hint">Build and publish a form in the Builder, fill it in as a parent (sign in with the
      emailed one-time code), then find the response — and any approval — back in the Builder.</span>
    <a class="back" href="../../index.html" target="_top">← Gallery</a>
  </div>
  <div class="stage">
    <iframe id="screen" src="builder.html" title="Custom Forms screen"></iframe>
  </div>
<script>
  // Five separately deployed apps, one shared form store — swap the framed app in place. Every app
  // here reads and writes the same demo Drive and Sheets (sessionStorage, this tab), so whatever is
  // done in one frame is there when the next one loads.
  var frame = document.getElementById('screen');
  var btns = [].slice.call(document.querySelectorAll('.seg button'));
  var FAMILY = { 'parent-form.html': 'parent.html', 'staff-form.html': 'staff.html', 'macs-portal.html': 'macs.html', 'macs-form.html': 'macs.html' };

  function activate(btn) {
    btns.forEach(function (x) { x.classList.remove('active'); x.setAttribute('aria-selected', 'false'); });
    if (!btn) return;
    btn.classList.add('active');
    btn.setAttribute('aria-selected', 'true');
  }
  btns.forEach(function (b) {
    b.addEventListener('click', function () { activate(b); frame.src = b.getAttribute('data-src'); });
  });
  // Links inside the apps (a portal tile, the chooser's buttons, the Builder's preview) move the frame
  // without these buttons; re-sync the highlight when the browser lets us read the frame's address.
  frame.addEventListener('load', function () {
    var here = '';
    try { here = frame.contentWindow.location.pathname.split('/').pop(); } catch (e) { return; }
    here = FAMILY[here] || here;
    activate(btns.filter(function (b) { return b.getAttribute('data-src') === here; })[0]);
  });
</script>
</body>
</html>
