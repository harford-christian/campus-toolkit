<!DOCTYPE html>
<html>
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HCS Dismissal</title>
<!-- ===== Showcase demo shim (standalone build) ===== -->
<link rel="stylesheet" href="../../assets/demo-banner.css">
<script>window.DEMO_META = { name: "Dismissal Board" };</script>
<script src="../../assets/gsr-shim.js"></script>
<script src="data.js"></script>
<script src="mock.js"></script>
<script src="../../assets/demo-banner.js" defer></script>
</head>
<body>
<!--
  HCS Dismissal.

  TWO MODES, because there are two very different jobs:
    RAMP    — one flat ALPHABETICAL list. A child arrives in front of you by name, not by lane, so
              the list is sorted the way they arrive. Flagged students stay INLINE in red rather
              than moving to a separate section: they must still be findable the moment someone
              asks where that child is. Tapping a name is INSTANT — the card is built client-side
              from data already loaded, never a round trip.
    EXPLORE — grouped by lane and drilled into, for teachers checking who rides what.

  Everything after the first load is local: filtering, searching and tapping never hit the server.
-->
<style>
  /* Varsity theme, verbatim from ../facts-directory-search/Index.html so the staff tools look like
     one system. `only light` stops Chrome Auto Dark reinterpreting the palette. */
  :root {
    color-scheme: only light;
    --red: #8E1420; --red-deep: #6d0f18; --gold: #F2B705; --gold-ink: #3a2a00;
    --page: #8E1420; --title: #fff; --who: #e9c2c7; --status: #f0d3d7;
    --card: #fff; --card-border: #6d0f18; --line: #e5e7eb;
    --dt: #6b7280; --dd: #1f2430;
    --input-bg: #fff; --input-ink: #1f2430; --input-border: #6d0f18;
    --ok: #1f8a4c; --flag: #C62828; --flag-bg: #FDECEA;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { font-family: -apple-system, "Segoe UI", Roboto, sans-serif; color: var(--dd);
         background: var(--page); margin: 0; padding: 1rem; min-height: 100dvh;
         overscroll-behavior-y: contain; touch-action: manipulation; }
  .wrap { max-width: 60rem; margin: 0 auto; }
  .top { position: sticky; top: 0; z-index: 10; background: var(--page);
         margin: -1rem -1rem 0; padding: .8rem 1rem .55rem; }
  header { display: flex; align-items: center; justify-content: space-between; gap: .6rem;
           margin: 0 0 .5rem; }
  h1 { color: var(--title); font-size: 1.1rem; margin: 0; font-weight: 500; }
  h1 b { font-weight: 800; }
  .who { color: var(--who); font-size: .72rem; }

  .modes { display: flex; gap: .3rem; }
  .modes button { min-height: 38px; padding: .35rem .9rem; font-size: .85rem; border-radius: .5rem;
                  background: transparent; color: var(--status); border: 1px solid var(--who); }
  .modes button[aria-pressed="true"] { background: var(--gold); color: var(--gold-ink);
                                       border-color: var(--gold); font-weight: 700; }

  .filters { display: flex; gap: .45rem; flex-wrap: wrap; align-items: center; }
  select, input[type=search] {
    font-size: 1.05rem; min-height: 44px; padding: .5rem .7rem; border-radius: .5rem;
    border: 1px solid var(--input-border); background: var(--input-bg); color: var(--input-ink);
  }
  input[type=search] { flex: 1; min-width: 7rem; caret-color: var(--gold); }
  input[type=search]:focus, select:focus { outline: 2px solid var(--gold); border-color: transparent; }
  button { font-size: 1rem; min-height: 44px; padding: .5rem 1rem; border: 0; border-radius: .5rem;
           background: var(--gold); color: var(--gold-ink); font-weight: 600; cursor: pointer; }
  button.ghost { background: transparent; color: var(--status); border: 1px solid var(--who);
                 min-height: 44px; }
  .chiprow { display: flex; gap: .25rem; flex-wrap: wrap; margin: .4rem 0 0; }
  .chiprow button { min-height: 38px; padding: .3rem .6rem; font-size: .85rem; border-radius: .5rem;
                    background: transparent; color: var(--status); border: 1px solid var(--who); }
  .chiprow button[aria-pressed="true"] { background: #fff; color: var(--red-deep); font-weight: 700;
                                         border-color: #fff; }
  .tick { color: var(--status); font-size: .8rem; display: flex; align-items: center; gap: .3rem;
          min-height: 44px; padding: 0 .3rem; white-space: nowrap; }
  .tick input { width: 20px; height: 20px; }
  #menuBtn .fsum { font-weight: 400; font-size: .74rem; opacity: .85; margin-left: .35em;
                   max-width: 38vw; overflow: hidden; text-overflow: ellipsis;
                   display: inline-block; vertical-align: middle; }
  #menuPanel { margin-top: .35rem; }
  #menuPanel .modes { margin: 0 0 .45rem; }
  #menuPanel .filters { margin-bottom: .1rem; }
  .wnote { color: var(--dt); font-size: .78rem; }
  /* THE ROUTE IS ITS COLOUR. Each bus shows a coloured sheet in its window and every child is
     handed a matching stick; the driver checks the match. So the route NAME is rendered as a chip
     FILLED with that colour — the same object as the paper in the window — with the colour word
     inside it for a colour-blind reader, for mono print, and because "purple stick" is what people
     say out loud. Filled rather than coloured text because one route is WHITE. */
  .rchip { display: inline-block; font-weight: 800; font-size: .8rem;
           padding: .14em .7em; border-radius: 1em; border: 1px solid; margin-left: .5rem;
           vertical-align: middle; line-height: 1.3; }
  .rchip.big { font-size: 1.2rem; padding: .22em .85em; margin: .15rem 0 0; }
  .person.flag .rchip { opacity: .7; }        /* on a flagged row the flag stays the loudest thing */
  .driver { color: inherit; opacity: .85; font-size: .74rem; font-weight: 500; }
  .driver a { color: inherit; font-weight: 700; text-decoration: underline; }
  .driver.gap { color: #fff; background: #C62828; padding: .1em .45em; border-radius: .5em;
                font-weight: 700; }
  .person.notwalk { background: #f1f0ee; }
  .person.notwalk .pname { color: #6b7280; text-decoration: line-through; }
  .grades { display: flex; gap: .25rem; flex-wrap: wrap; }
  .grades button { min-height: 38px; min-width: 38px; padding: .3rem .55rem; font-size: .85rem;
                   background: transparent; color: var(--status); border: 1px solid var(--who); }
  .grades button[aria-pressed="true"] { background: #fff; color: var(--red-deep); font-weight: 700;
                                        border-color: #fff; }

  .tally { color: var(--status); font-size: .82rem; margin: .5rem 0 0; }
  .tally b { color: #fff; }
  .tally .flagged { color: #ffd9d9; }
  .freshness { color: var(--who); font-size: .7rem; margin: .2rem 0 0; }
  .topbtns { display: flex; gap: .3rem; }
  .topbtns button { min-height: 38px; padding: .35rem .75rem; font-size: .85rem; white-space: nowrap; }

  .list { background: var(--card); border: 1px solid var(--card-border); border-radius: .6rem;
          overflow: hidden; margin: .8rem 0; }
  .ghead { display: flex; align-items: center; justify-content: space-between; gap: .6rem;
           background: var(--red); color: #fff; padding: .5rem .9rem; font-weight: 700;
           font-size: .95rem; }
  /* a bus lane's header takes the ROUTE colour; the inline style sets bg + text, so everything
     inside must inherit rather than assume a red background */
  .gcount { font-weight: 500; font-size: .78rem; color: inherit; opacity: .85; white-space: nowrap; }

  /* 56px rows: this is scanned at speed with a thumb, so tap targets stay generous. */
  .person { display: flex; align-items: center; justify-content: space-between; gap: .7rem;
            width: 100%; text-align: left; background: none; border: 0; cursor: pointer;
            min-height: 56px; padding: .5rem .9rem; border-bottom: 1px solid var(--line);
            font-size: 1.02rem; color: var(--dd); }
  .person:last-child { border-bottom: 0; }
  .person:hover, .person:focus-visible { background: #FBECEE; }
  .person.flag { background: var(--flag-bg); }
  .person.flag .pname { color: var(--flag); }
  .pname { font-weight: 600; }
  .pdest { color: var(--dt); font-size: .82rem; margin-left: .5rem; font-weight: 400; }
  .person.flag .pdest { color: var(--flag); }
  .pmeta { color: var(--dt); font-size: .78rem; white-space: nowrap; text-align: right; }

  .att { font-size: .62rem; font-weight: 700; padding: .15em .5em; border-radius: .6em;
         margin-left: .4em; vertical-align: middle; letter-spacing: .02em; white-space: nowrap; }
  .att.flag   { background: var(--flag); color: #fff; }
  .att.late   { background: var(--gold); color: var(--gold-ink); }
  .att.split  { background: #1f4e8a; color: #fff; }
  .att.walk   { background: #e7e9ee; color: #3a2a00; }
  .att.ovr    { background: var(--ok); color: #fff; }
  .att.walkup { background: #00796B; color: #fff; }
  .att.standing { background: #e7e9ee; color: var(--dd); }

  .empty { padding: 1rem .9rem; color: var(--dt); }
  .simbar { background: var(--gold); color: var(--gold-ink); font-weight: 700; padding: .5rem .9rem;
            border-radius: .5rem; margin: 0 0 .6rem; }
  .warn { background: #FFF3CD; color: #7a5b00; padding: .5rem .9rem; border-radius: .5rem;
          margin: 0 0 .6rem; font-size: .85rem; }

  dialog { border: 1px solid var(--card-border); border-radius: .6rem; padding: 0; width: 24rem;
           max-width: calc(100vw - 1.5rem); }
  dialog::backdrop { background: rgba(0,0,0,.5); }
  .dlg { padding: 1rem; }
  .dlg h3 { margin: 0; font-size: 1.15rem; }
  .dlg .sub { color: var(--dt); font-size: .82rem; margin: .15rem 0 .8rem; }
  .sect { border-top: 1px solid var(--line); padding: .7rem 0 0; margin: .7rem 0 0; }
  .sect h4 { margin: 0 0 .4rem; font-size: .68rem; text-transform: uppercase; letter-spacing: .07em;
             color: var(--dt); }
  .bigdest { font-size: 1.25rem; font-weight: 800; color: var(--red-deep); }
  .flagbox { background: var(--flag-bg); color: var(--flag); border-radius: .4rem;
             padding: .5rem .65rem; font-weight: 700; margin: .5rem 0 0; }
  .row { display: flex; justify-content: space-between; gap: .6rem; padding: .3rem 0;
         border-bottom: 1px dotted var(--line); font-size: .92rem; }
  .row:last-child { border-bottom: 0; }
  .row .r { color: var(--dt); font-size: .78rem; white-space: nowrap; }
  .row a { color: var(--red-deep); font-weight: 600; text-decoration: none; }
  .showphone { background: #e7e9ee; color: var(--dd); font-size: .7rem; font-weight: 600;
               border-radius: .4em; padding: .2em .55em; min-height: 0; }
  .sib { display: flex; justify-content: space-between; gap: .6rem; padding: .35rem 0;
         border-bottom: 1px dotted var(--line); font-size: .92rem; cursor: pointer; }
  .sib:last-child { border-bottom: 0; }
  .dlgrow { display: flex; gap: .5rem; margin-top: .9rem; }
  .dlgrow button { flex: 1; }
  .dlgrow button.cancel { background: #e7e9ee; color: var(--dd); }
  .muted { color: var(--dt); font-size: .85rem; }

  /* settings: role membership */
  .mrow { display: flex; align-items: center; gap: .5rem; padding: .35rem 0;
          border-bottom: 1px dotted var(--line); font-size: .9rem; }
  .mrow:last-of-type { border-bottom: 0; }
  .mrow .me { flex: 1; overflow-wrap: anywhere; }
  .mrow .adm { background: var(--red); color: #fff; font-size: .6rem; font-weight: 700;
               padding: .15em .45em; border-radius: .6em; letter-spacing: .03em; }
  .mrow .del { background: #e7e9ee; color: var(--flag); font-size: .72rem; font-weight: 700;
               min-height: 32px; padding: .2rem .55rem; }
  .addrow { display: flex; gap: .4rem; margin: .5rem 0 0; }
  .addrow input[type=text] { flex: 1; min-width: 0; font-size: 1rem; min-height: 40px;
    padding: .4rem .6rem; border-radius: .5rem; border: 1px solid var(--input-border); }
  .mrow .me b { font-weight: 700; }
  .mrow .me .wnote { display: block; }
  .addrow button { min-height: 40px; padding: .4rem .8rem; font-size: .9rem; }
  .cfgnote { color: var(--dt); font-size: .78rem; margin: .35rem 0 0; }
  .viewnote { color: var(--gold); font-size: .72rem; margin: .2rem 0 0; font-weight: 600; }
  .nochange { background: #f1f0ee; color: var(--dt); font-size: .82rem; padding: .5rem .65rem;
              border-radius: .4rem; margin-top: .9rem; }

  @media (max-width: 640px) { body { padding: .7rem; } .who { display: none; } }
  @media (max-width: 380px) { .pmeta { display: none; } }
  /* PRINT — the driver's list (Josh, 2026-09-08). One page per PM route, built by printLists()
     into #printArea. The swap is gated on body.printing, set by the button, so a bare Ctrl+P still
     prints the board the way it always did. The colour band is forced to print: on paper the
     colour IS the route. */
  #printArea { display: none; }
  @media print {
    body.printing .wrap, body.printing dialog { display: none !important; }
    body.printing #printArea { display: block; }
    .sheet { page-break-after: always; break-after: page; color: #000;
             font: 12pt/1.35 -apple-system, "Segoe UI", Roboto, sans-serif; }
    .sheet:last-child { page-break-after: auto; break-after: auto; }
    .sheet h2 { margin: 0 0 .3rem; padding: .35rem .6rem; border: 2px solid; border-radius: 6px;
                font-size: 16pt; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    .sheet h3 { margin: .9rem 0 .2rem; font-size: 12pt; }
    .sheet .meta { margin: .15rem 0; font-size: 10.5pt; }
    .sheet table { width: 100%; border-collapse: collapse; margin-top: .4rem; }
    .sheet th, .sheet td { border-bottom: 1px solid #999; padding: .22rem .35rem; text-align: left;
                           vertical-align: top; }
    .sheet th { font-size: 9.5pt; text-transform: uppercase; letter-spacing: .03em; }
    .sheet .foot { margin-top: .9rem; font-size: 9pt; color: #333; }
  }
</style>

<div class="wrap">
  <div class="top">
    <!-- THE TOP, collapsed (Josh, 2026-09-06): title, Filters, Settings. Filters expands the modes
         AND the chips; Settings opens the dialog for everyone. Default open; shut once a view is
         saved, because the view IS the filters and at 3:10 the list is what matters. -->
    <header>
      <h1><b>HCS</b> Dismissal</h1>
      <div class="topbtns">
        <button id="menuBtn" class="ghost" aria-expanded="true" aria-controls="menuPanel"
                title="Show or hide the mode, lane, grade and route controls">▾ Filters</button>
        <button id="gear" class="ghost" title="Your access; roles and shared views if you manage any">&#9881; Settings</button>
      </div>
      <span class="who">demo.staff@example.edu</span>
    </header>
    <!-- ALWAYS visible: the search is the ramp's primary control and "all students" its escape hatch. -->
    <div class="filters" id="filterBar">
      <input id="q" type="search" placeholder="Name or ID…" autocomplete="off">
      <label class="tick" title="Search past your saved view, across the whole school">
        <input type="checkbox" id="qAll"> all students
      </label>
    </div>
    <!-- COLLAPSIBLE: everything that decides WHAT the list is. -->
    <div id="menuPanel">
      <div class="modes">
        <button id="mRamp" aria-pressed="true">Ramp</button>
        <button id="mClass" aria-pressed="false">Class</button>
        <button id="mWalk" aria-pressed="false">Walk-Up</button>
        <button id="mExplore" aria-pressed="false">Explore</button>
      </div>
      <div class="filters">
        <select id="fRoute"><option value="">All routes</option></select>
        <button id="saveBtn" class="ghost" title="Remember these filters for me">☆ Save view</button>
        <button id="refresh" class="ghost" title="Reload">↻</button>
        <button id="printBtn" class="ghost"
                title="Print one page per bus route for the drivers — who rides today and who does not. Pick a route above to print just that bus.">&#128424; Print bus lists</button>
      </div>
      <div class="chiprow" id="typeRow"></div>
      <div class="chiprow grades" id="grades"></div>
    </div>
    <!-- Class mode's scope is navigation, not a filter — it stays out of the panel. -->
    <div class="chiprow" id="scopeRow" hidden></div>
    <div class="tally" id="tally">Loading…</div>
    <div class="viewnote" id="viewnote"></div>
    <div class="freshness" id="freshness"></div>
  </div>

  <div id="banners"></div>
  <div id="board"></div>
</div>

<!-- The driver's list, filled by printLists() and shown only while printing. -->
<div id="printArea" aria-hidden="true"></div>

<dialog id="card"><div class="dlg" id="cardBody"></div></dialog>

<dialog id="ovr"><div class="dlg">
  <h3 id="ovrName">Student</h3>
  <p class="sub">Change for <b>today only</b>. Clears overnight — a permanent change belongs in FACTS.</p>
  <label class="muted" for="ovrType">Dismissal today</label>
  <select id="ovrType" style="width:100%">
    <option>Bus</option><option>Car</option><option>Early Bird</option><option>Staff Kid</option>
  </select>
  <label class="muted" for="ovrRoute">Route (buses only)</label>
  <input id="ovrRoute" placeholder="e.g. J" style="width:100%">
  <label class="muted" for="ovrDest">Handed to today</label>
  <select id="ovrDest" style="width:100%"></select>
  <input id="ovrDestOther" placeholder="or type a name / place" style="width:100%;margin-top:.3rem">
  <label class="muted" for="ovrNote">Note</label>
  <input id="ovrNote" placeholder="e.g. mum called at 1pm" style="width:100%">
  <div class="dlgrow">
    <button class="cancel" id="ovrCancel">Cancel</button>
    <button id="ovrSave">Save for today</button>
  </div>
</div></dialog>

<!--
  Settings. Shown ONLY to someone who administers at least one role, and it lists only the roles
  they administer — so the ramp lead opens this and sees Ramp, with no way to reach Walk-Up or Office.
-->
<dialog id="cfg"><div class="dlg">
  <h3>Settings</h3>
  <p class="sub" id="cfgSub"></p>
  <div id="cfgBody"></div>
  <!-- one shared suggestion list for every role's add box: staff names, values are the emails -->
  <datalist id="staffList"></datalist>
  <div class="dlgrow"><button class="cancel" id="cfgClose">Close</button></div>
</div></dialog>

<script>
// GENERATED from Dismissal.gs by tools/build-client.mjs — DO NOT EDIT.
// Edit Dismissal.gs, then re-run the generator.
/**
 * Dismissal.gs — PURE dismissal logic. No SpreadsheetApp, no DriveApp, no GAS globals.
 *
 * Runs in three places from this one source, like Search.gs in ../facts-directory-search:
 *   GAS      — the server calls it after reading the tabs
 *   Node     — tools/test-dismissal.mjs
 *   Browser  — DismissalClient.html, GENERATED by tools/build-client.mjs. After ANY edit here,
 *              re-run that generator or the client goes stale (the test suite fails if it is).
 *
 * WHAT THE BOARD ANSWERS, in order of what costs most if wrong:
 *   1. Who should be in each bus/van line right now.
 *   2. Who should NOT — because they are absent, left early, or were signed out mid-day. A child
 *      waited for who already went home wastes staff time; a child NOT waited for who is still
 *      here is the serious failure. So an unknown always reads as EXPECTED, never as absent.
 *
 * DATA IN (all read-only, produced elsewhere):
 *   roster      Dismissal_WORKING!Roster        — ../facts-api-sync/Transportation.gs, daily 04:00
 *   attendance  FACTS_API_Sync_STAGING!'Attendance Today' — facts-api-sync, every 15 min
 *   signedOut   SignInOut_DB!EVENTS             — campus-sign-in-out-system. DORMANT until that
 *               project reaches M6; the reader is gated on a Script Property so an unset id skips
 *               silently rather than erroring.
 *   overrides   Dismissal_WORKING!Overrides     — today-only, entered in this app.
 *
 * DISMISSAL IS PM. The roster carries AM rows too (a student can ride a different route each way,
 * and 11 ride in but not home). Everything here filters to Session=PM unless asked otherwise —
 * showing all riders would have staff waiting on 11 children who never board.
 */

/* ------------------------------------ cell helpers ------------------------------------ */

/**
 * Sheets hands back a Date for anything it parsed as one, and google.script.run cannot serialize
 * Dates — so every cell is stringified before it leaves the server. The 1899-12-30 epoch is Sheets'
 * time-only value; paid for in blood in ../facts-directory-search/Search.gs.
 */
function dsCellToString(v) {
  if (v instanceof Date) {
    var y = v.getFullYear(), mo = v.getMonth(), d = v.getDate();
    var hh = ('0' + v.getHours()).slice(-2), mm = ('0' + v.getMinutes()).slice(-2);
    if (y === 1899 && mo === 11 && d === 30) return hh + ':' + mm;
    return y + '-' + ('0' + (mo + 1)).slice(-2) + '-' + ('0' + d).slice(-2) + ' ' + hh + ':' + mm;
  }
  return v == null ? '' : String(v);
}

/** header row -> {name: index}. Parse by NAME; column order is not a contract we control. */
function dsHeaderMap(headerRow) {
  var map = {};
  (headerRow || []).forEach(function (h, i) { map[dsCellToString(h).trim()] = i; });
  return map;
}

/** Every cell of a tab as a string, so nothing downstream has to think about Dates. */
function dsSerializeTab(values) {
  return (values || []).map(function (row) {
    return (row || []).map(dsCellToString);
  });
}

/* ------------------------------------ parsing ------------------------------------ */

/**
 * Roster rows -> student records. One row per (student, session, route), so a split-custody child
 * legitimately appears twice in a session; they are kept as separate entries and marked split.
 * @return {Array<Object>}
 */
function dsBuildRoster(values) {
  if (!values || values.length < 2) return [];
  var h = dsHeaderMap(values[0]);
  var get = function (row, name) {
    var i = h[name];
    return i === undefined ? '' : dsCellToString(row[i]).trim();
  };
  var out = [];
  for (var r = 1; r < values.length; r++) {
    var row = values[r];
    var id = get(row, 'Student ID');
    if (!id) continue;
    out.push({
      id: id,
      name: get(row, 'Student Name'),
      grade: get(row, 'Grade'),
      session: get(row, 'Session'),
      type: get(row, 'Type'),
      routeCode: get(row, 'Route Code'),
      routeName: get(row, 'Route Name'),
      vehicle: get(row, 'Vehicle'),
      split: get(row, 'Split') === 'Y',
      building: get(row, 'Building'),
      pickup: get(row, 'Pickup'),
      walkTo: get(row, 'Walk To'),
      familyId: get(row, 'Family ID'),
      homeroom: get(row, 'Homeroom'),
      homeroomTeacher: get(row, 'Homeroom Teacher'),
      source: get(row, 'Source'),
      note: get(row, 'Note')
    });
  }
  return out;
}

/**
 * 'Attendance Today' -> {studentId: {code, status, detail, reason, excused}}.
 * The tab holds ONLY exceptions — a student absent from it was not marked anything, which is not
 * the same as being present. See dsClassify.
 */
function dsBuildAttendance(values) {
  var out = {};
  if (!values || values.length < 2) return out;
  var h = dsHeaderMap(values[0]);
  var get = function (row, name) {
    var i = h[name];
    return i === undefined ? '' : dsCellToString(row[i]).trim();
  };
  for (var r = 1; r < values.length; r++) {
    var id = get(values[r], 'Student ID');
    if (!id) continue;
    out[id] = {
      code: get(values[r], 'Code').toUpperCase(),
      status: get(values[r], 'Status'),
      detail: get(values[r], 'Detail'),
      reason: get(values[r], 'Reason'),
      excused: get(values[r], 'Excused')
    };
  }
  return out;
}

/**
 * Today's overrides -> {studentId: {type, note, by, at}}. Last write for a student wins.
 * Rows for any other date are ignored, which is what makes overrides self-expiring: nothing has to
 * clean up yesterday's, and a stale row can never leak into today's board.
 */
function dsBuildOverrides(values, todayKey) {
  var out = {};
  if (!values || values.length < 2) return out;
  var h = dsHeaderMap(values[0]);
  var get = function (row, name) {
    var i = h[name];
    return i === undefined ? '' : dsCellToString(row[i]).trim();
  };
  for (var r = 1; r < values.length; r++) {
    var row = values[r];
    var id = get(row, 'Student ID');
    var date = get(row, 'Date').slice(0, 10);
    if (!id || date !== todayKey) continue;
    out[id] = {
      type: get(row, 'Type'),
      routeCode: get(row, 'Route Code'),
      destination: get(row, 'Destination'),
      note: get(row, 'Note'),
      by: get(row, 'By'),
      at: get(row, 'At')
    };
  }
  return out;
}

/**
 * STANDING answers -> {studentId: {type, routeCode, destination, note, by, at, standing: true}}.
 *
 * The third kind of truth on this board. FACTS says where a parent WORKS; the walk-up list says who
 * is WALKED; this says what a specific child DOES every day when neither of those is right. First
 * case (office, 2026-09-06): the Boehm boys' mother drives an AM van route, so the placement code
 * puts them at the High School at 3:10 — and in fact she is a parent at the north-lot ramp like
 * anyone else. There was nowhere to write that down that outlived midnight.
 *
 * Office-owned, like Walkers and Routes. Applied UNDER today's overrides, so a phone call still
 * wins for the day. Only the four lanes are accepted; anything else is skipped here and named by
 * RUN_readiness rather than guessed at.
 */
var DS_STANDING_TYPES = ['Bus', 'Car', 'Early Bird', 'Staff Kid'];
function dsBuildStanding(values) {
  var out = {};
  if (!values || values.length < 2) return out;
  var h = dsHeaderMap(values[0]);
  var get = function (row, name) {
    var i = h[name];
    return i === undefined ? '' : dsCellToString(row[i]).trim();
  };
  for (var r = 1; r < values.length; r++) {
    var row = values[r];
    var id = get(row, 'Student ID'), type = get(row, 'Type');
    if (!id || DS_STANDING_TYPES.indexOf(type) === -1) continue;
    out[id] = {
      type: type, routeCode: get(row, 'Route Code'), destination: get(row, 'Destination'),
      note: get(row, 'Note'), by: get(row, 'By'), at: get(row, 'Since'), standing: true
    };
  }
  return out;
}

/** Standing answers with today's overrides laid on top — today always wins for its student. */
function dsMergeOverrides(standing, today) {
  var out = {};
  Object.keys(standing || {}).forEach(function (id) { out[id] = standing[id]; });
  Object.keys(today || {}).forEach(function (id) { out[id] = today[id]; });
  return out;
}

/**
 * Mark board rows for children on the APPROVED walk-up list, so the ramp never reads them as a
 * pickup. Evelyn Hodgson (office, 2026-09-06) has no staff parent — she walks up to meet her
 * brother — so the roster types her Car and the ramp lead's list would have waited for a car that was
 * never coming. Eighteen more walkers read "Staff Kid". The list is authoritative; the rows now
 * say so. Type is left alone (a bus child on the list stays Bus and is flagged elsewhere); the
 * row gains walkUp / walkUpWalking / walkUpTo / walkUpWhy for the renderer.
 */
function dsApplyWalkUps(board, walkUp) {
  var byId = {};
  ((walkUp && walkUp.rows) || []).forEach(function (w) { byId[w.id] = w; });
  ((board && board.groups) || []).forEach(function (g) {
    g.rows.forEach(function (r) {
      var w = byId[r.id];
      if (!w) return;
      r.walkUp = true;
      r.walkUpWalking = !!w.walking;
      r.walkUpTo = w.destination || '';
      r.walkUpWhy = w.walking ? '' : (w.why || w.kind || '');
    });
  });
  return board;
}

/**
 * Today's COMPLETED mid-day sign-outs, folded from Campus Presence's append-only EVENTS log.
 *
 * Column names are from campus-sign-in-out-system/logic/schema.js (read 2026-09-05, not assumed):
 *   Date 'yyyy-MM-dd' · Type · PersonKey (the FACTS Student ID) · Timestamp 'yyyy-MM-dd HH:mm:ss'
 *   · GuardianName · PickupMatch ('matched' | 'mismatch' | 'override' | 'n/a')
 *
 * The fold mirrors their logic/presence.js exactly:
 *   student_early_out with PickupMatch !== 'mismatch'  -> OFF campus
 *   student_return_in                                   -> back; clears the early-out
 *   a LATER early-out supersedes an earlier return      -> out, in, out again = OFF
 *   pickup_flag, visitor_*, movement, student_late_in   -> no effect on dismissal
 *
 * A MISMATCH IS AN OPEN FLAG, NOT A SIGN-OUT. It means someone whose name did not match the
 * authorised list tried to collect the child. Counting it would remove a child from the board on a
 * stranger's failed attempt — the one failure this app must never produce. The first (dormant)
 * version of this reader did not check PickupMatch; it never ran, but it would have.
 *
 * Their columns are text-formatted at bootstrap, yet their own gateway notes Sheets still hands
 * Date objects back — so Date is compared on its first ten characters, whatever shape it arrives in.
 *
 * @return {Object} {studentId: {at: 'HH:mm', withWhom}}
 */
function dsBuildSignedOut(values, dayKey) {
  var out = {};
  if (!values || values.length < 2) return out;
  var h = dsHeaderMap(values[0]);
  var get = function (row, name) {
    var i = h[name];
    return i === undefined ? '' : dsCellToString(row[i]).trim();
  };
  for (var r = 1; r < values.length; r++) {
    var row = values[r];
    if (get(row, 'Date').slice(0, 10) !== dayKey) continue;
    var type = get(row, 'Type');
    var sid = get(row, 'PersonKey');
    if (!sid) continue;
    if (type === 'student_early_out') {
      if (get(row, 'PickupMatch') === 'mismatch') continue;
      out[sid] = { at: get(row, 'Timestamp').slice(11, 16), withWhom: get(row, 'GuardianName') };
    } else if (type === 'student_return_in') {
      delete out[sid];
    }
  }
  return out;
}

/**
 * PickupContacts -> {studentId: [{name, relationship, cell, home, work, email, note}]}.
 * Who is authorised to collect a child. 568 of 653 enrolled students have at least one; the other
 * 85 have NONE recorded, which the card states plainly rather than rendering an empty list that
 * looks like a load failure.
 */
function dsBuildPickups(values) {
  var out = {};
  if (!values || values.length < 2) return out;
  var h = dsHeaderMap(values[0]);
  var get = function (row, name) {
    var i = h[name];
    return i === undefined ? '' : dsCellToString(row[i]).trim();
  };
  for (var r = 1; r < values.length; r++) {
    var row = values[r];
    var sid = get(row, 'studentId');
    if (!sid) continue;
    var last = get(row, 'lastName'), first = get(row, 'firstName');
    var nm = (last + (last && first ? ', ' : '') + first).trim();
    if (!nm) continue;
    (out[sid] = out[sid] || []).push({
      name: nm,
      rel: get(row, 'relationship'),
      cell: get(row, 'cellPhone'),
      home: get(row, 'homePhone'),
      work: get(row, 'workPhone'),
      email: get(row, 'email'),
      note: get(row, 'note'),
      order: Number(get(row, 'portalSortOrder') || 99)
    });
  }
  Object.keys(out).forEach(function (sid) {
    out[sid].sort(function (a, b) {
      if (a.order !== b.order) return a.order - b.order;
      return a.name < b.name ? -1 : a.name > b.name ? 1 : 0;
    });
  });
  return out;
}

/**
 * ONE ROW PER STUDENT, alphabetical — the ramp view.
 *
 * The grouped board is for exploring; the person receiving children off the ramp needs a single
 * flat list she can scan by name, because a child arrives in front of her by name, not by lane.
 * Flagged students stay INLINE and marked rather than moving to a separate section: she has to see
 * the whole set in front of her, and a child who is absent should still be findable at the moment
 * someone asks where they are.
 *
 * Split-custody students hold two route rows; here they collapse to one entry carrying both, so a
 * name never appears twice in a list being scanned at speed.
 */
function dsFlatList(board) {
  var by = {}, order = [];
  (board.groups || []).forEach(function (g) {
    g.rows.forEach(function (r) {
      var e = by[r.id];
      if (!e) {
        e = by[r.id] = {
          id: r.id, name: r.name, grade: r.grade, type: r.type,
          // `routes` are human labels (the FACTS course title, e.g. "Jarrettsville Bus Route");
          // `routeCodes` is the PARALLEL array of codes ("J"). The route table is keyed by code and
          // its names are the office's short ones ("Jarrettsville"), so the code is the only join
          // that works — the first version shipped labels alone and no colour ever rendered.
          routes: [], routeCodes: [], vehicle: r.vehicle, split: r.split,
          building: r.building, pickup: r.pickup, walkTo: r.walkTo, familyId: r.familyId,
          homeroom: r.homeroom, homeroomTeacher: r.homeroomTeacher,
          overridden: r.overridden, overrideNote: r.overrideNote,
          overrideBy: r.overrideBy || '', overrideAt: r.overrideAt || '',
          overrideDestination: r.overrideDestination || '',
          standing: !!r.standing, standingNote: r.standingNote || '',
          fromRouteCode: r.fromRouteCode || '', fromRouteName: r.fromRouteName || '',
          walkUp: !!r.walkUp, walkUpWalking: !!r.walkUpWalking,
          walkUpTo: r.walkUpTo || '', walkUpWhy: r.walkUpWhy || '',
          expected: r.expected, reason: r.reason, detail: r.detail, note: r.note
        };
        order.push(e);
      }
      var label = r.routeName || r.routeCode;
      if (label && e.routes.indexOf(label) === -1) {
        e.routes.push(label);
        e.routeCodes.push(r.routeCode || '');     // keep the two arrays index-aligned
      }
      // a flag on ANY of a student's rows flags the student
      if (!r.expected && e.expected) {
        e.expected = false; e.reason = r.reason; e.detail = r.detail;
      }
    });
  });
  order.sort(function (a, b) { return a.name < b.name ? -1 : a.name > b.name ? 1 : 0; });
  return order;
}

/**
 * Everything shown when a name is tapped: where they go, who may collect them, and their siblings.
 * PURE and computed client-side from the payload already loaded, so a tap costs no round trip —
 * speed at the ramp is the whole point.
 */
function dsStudentCard(id, flat, pickups) {
  var me = null;
  for (var i = 0; i < (flat || []).length; i++) {
    if (flat[i].id === id) { me = flat[i]; break; }
  }
  if (!me) return null;

  // Siblings come from the FLAT list, not a separately-shipped roster. Shipping the raw roster as
  // well as the board and the flat list meant the same student rows crossed the wire THREE times —
  // 558KB of a 1329KB payload. The flat list already has every enrolled student exactly once.
  var sibs = (flat || []).filter(function (r) {
    return me.familyId && r.familyId === me.familyId && r.id !== id;
  }).map(function (r) {
    return { id: r.id, name: r.name, grade: r.grade, type: r.type,
             routes: r.routes || [], routeCodes: r.routeCodes || [],
             pickup: r.pickup, expected: r.expected, reason: r.reason };
  });
  sibs.sort(function (a, b) { return a.name < b.name ? -1 : a.name > b.name ? 1 : 0; });

  var pk = (pickups || {})[id];
  return {
    student: me,
    familyId: me.familyId || '',
    siblings: sibs,
    pickups: pk || [],
    hasPickups: !!(pk && pk.length),
    pickupsLoaded: !!pickups            // false while the second phase is still in flight
  };
}


/**
 * The APPROVED staff-kid walk-up list (Dismissal_WORKING!Walkers).
 *
 * THIS IS AUTHORITATIVE AND HUMAN-APPROVED. It replaces the derived Walk To entirely.
 * Deriving walk-ups from the staff parent's Google OU placement produced ~127 candidates against
 * an approved list of 30 — over five times too many — because "a parent works here" is not the
 * same decision as "this child may walk between buildings unaccompanied". That decision is signed
 * off by a human, per child, and must never be inferred.
 *
 * Scope is K4 through 4th grade (per "Staff Kids Dismissal Process"), NOT all of elementary.
 *
 * Columns: Student ID | Student Name | Grade | Teacher | Frequency | Destination |
 *          Except Day | Except Reason | Note
 *   Frequency    'Daily' | 'Occasional'  — Occasional children come only when the office says so
 *   Destination  where the child is handed over; usually blank meaning "to their parent in the
 *                HS lobby", but some are specific ("to Mom", "to her brother an older sibling 12th")
 *   Except Day   a weekday abbreviation, e.g. 'Fri' — on that day the child is NOT walked
 *   Except Reason why, e.g. 'Art' — they are already in a specials room up by the high school
 *
 * Structured columns rather than free text: the source document wrote these as notes
 * ("Fridays - Art"), and a runtime parser guessing at prose is exactly how a child ends up in the
 * wrong place. The office edits these cells directly.
 */
function dsBuildWalkers(values) {
  var out = {};
  if (!values || values.length < 2) return out;
  var h = dsHeaderMap(values[0]);
  var get = function (row, name) {
    var i = h[name];
    return i === undefined ? '' : dsCellToString(row[i]).trim();
  };
  for (var r = 1; r < values.length; r++) {
    var row = values[r];
    var id = get(row, 'Student ID');
    if (!id) continue;
    out[id] = {
      id: id,
      name: get(row, 'Student Name'),
      grade: get(row, 'Grade'),
      teacher: get(row, 'Teacher'),
      frequency: get(row, 'Frequency') || 'Daily',
      destination: get(row, 'Destination'),
      exceptDay: get(row, 'Except Day'),
      exceptReason: get(row, 'Except Reason'),
      // Where the child goes ON the exception day. the walk-up chaperone, 2026-09-04: some parents are happy for
      // an Art child to go from the specials room straight to their own classroom, which is a
      // STANDING arrangement rather than a daily call-in — so it lives on the approved list.
      exceptDestination: get(row, 'Except Destination'),
      note: get(row, 'Note')
    };
  }
  return out;
}

/**
 * Today's walk-up list: who is walking, who is not, and WHY not.
 *
 * Everyone on the approved list appears EVERY day (Josh, 2026-09-04) — a child is never silently
 * dropped, because "why isn't X here?" is a question asked at the door and the answer has to be on
 * the sheet. The reasons a child is not walking, most specific first:
 *   1. signed out mid-day / absent / left early  — from attendance and Campus Presence
 *   2. a weekday exception                       — already in a special up by the HS
 *   3. Occasional and not flagged for today      — only comes when the office says so
 * Anything else is walking.
 *
 * The counts let the chaperone check a headcount before lining up, which is the safety step the
 * paper process relied on, without hiding anybody to get it.
 *
 * @param {string} dayName 'Mon'..'Sun' in school time
 * @param {Object} occasionalToday {studentId: true} — today's confirmed Occasional children
 */
function dsWalkUpList(flat, walkers, att, outs, dayName, occasionalToday, overrides) {
  var byId = {};
  (flat || []).forEach(function (r) { byId[r.id] = r; });
  var rows = [];
  Object.keys(walkers || {}).forEach(function (id) {
    var w = walkers[id];
    var st = byId[id] || null;
    var ov = (overrides || {})[id] || null;
    var v = dsClassify(st || {}, (att || {})[id], (outs || {})[id]);

    var isExceptDay = !!(w.exceptDay && dayName &&
      w.exceptDay.toLowerCase().slice(0, 3) === dayName.toLowerCase().slice(0, 3));

    // Where this child is handed over today, most specific first:
    //   1. a today-only change someone phoned in
    //   2. the standing arrangement for this exception day (e.g. Fridays -> their own classroom)
    //   3. their standing destination
    //   4. blank, meaning the default: to their parent in the HS lobby
    var dest = (ov && ov.destination) ? ov.destination
             : (isExceptDay && w.exceptDestination) ? w.exceptDestination
             : w.destination;

    var walking = true, why = '', kind = '';
    if (!v.expected) {
      walking = false; kind = v.reason; why = v.detail;
    } else if (isExceptDay) {
      // A standing exception destination means the child still GOES somewhere, just not walked up
      // from the Elementary by the chaperone — so say where, rather than only that they are absent
      // from the line.
      walking = false; kind = 'IN A SPECIAL';
      why = (w.exceptReason ? 'in ' + w.exceptReason : 'not walked today') +
        (w.exceptDestination ? ' — goes ' + w.exceptDestination : ' — already up by the HS');
    } else if (w.frequency === 'Occasional' && !((occasionalToday || {})[id])) {
      walking = false; kind = 'NOT TODAY';
      why = 'occasional — only when the office confirms';
    }
    rows.push({
      id: id, name: w.name || (st ? st.name : id), grade: w.grade || (st ? st.grade : ''),
      teacher: w.teacher, frequency: w.frequency,
      destination: dest, standingDestination: w.destination, note: w.note,
      exceptDay: w.exceptDay, exceptReason: w.exceptReason,
      exceptDestination: w.exceptDestination,
      walking: walking, kind: kind, why: why,
      overridden: !!ov, overrideNote: ov ? (ov.note || '') : '',
      overrideBy: ov ? (ov.by || '') : '', overrideAt: ov ? (ov.at || '') : '',
      onRoster: !!st
    });
  });
  rows.sort(function (a, b) { return a.name < b.name ? -1 : a.name > b.name ? 1 : 0; });
  var walkingN = rows.filter(function (r) { return r.walking; }).length;
  return {
    dayName: dayName || '', rows: rows,
    counts: { onList: rows.length, walking: walkingN, notWalking: rows.length - walkingN }
  };
}

/**
 * Routes tab -> {routeCode: {code, name, colour, vehicle, drivers: [...]}}.
 *
 * The colour is the safety mechanism: children are handed a coloured stick matching the vehicle
 * window, and the driver checks it. So it is surfaced everywhere a route is named, together with
 * the colour NAME — a swatch alone fails a colour-blind reader and fails in mono print, and the
 * name is what people actually say ("orange stick").
 */
function dsBuildRoutes(values) {
  var out = {};
  if (!values || values.length < 2) return out;
  var h = dsHeaderMap(values[0]);
  var get = function (row, name) {
    var i = h[name];
    return i === undefined ? '' : dsCellToString(row[i]).trim();
  };
  for (var r = 1; r < values.length; r++) {
    var row = values[r];
    var code = get(row, 'Route Code');
    if (!code) continue;
    var e = out[code] || (out[code] = {
      code: code, name: get(row, 'Route Name'), colour: get(row, 'Colour'),
      vehicle: get(row, 'Vehicle'), drivers: []
    });
    if (!e.name) e.name = get(row, 'Route Name');
    if (!e.colour) e.colour = get(row, 'Colour');
    if (!e.vehicle) e.vehicle = get(row, 'Vehicle');
    var drv = get(row, 'Driver');
    if (drv) {
      e.drivers.push({
        session: get(row, 'Session') || 'PM',
        name: drv,
        phone: get(row, 'Phone'),
        days: get(row, 'Days').split(/[,\s]+/).filter(String),
        note: get(row, 'Note')
      });
    }
  }
  return out;
}

/**
 * Find a route's table entry for a student row. CODE FIRST — it is the only key both sides share.
 *
 * The roster's Route Name is the FACTS course TITLE ("Jarrettsville Bus Route", "Aberdeen/Havre
 * de Grace Route") while the office's Routes tab uses the short name ("Jarrettsville"). The first
 * version joined on name equality from page-side JS, matched nothing, and no colour ever rendered
 * on a ramp row or a card — found only when Josh asked where the colours were. The name fallback
 * is a STARTS-WITH so "Jarrettsville" still finds "Jarrettsville Bus Route" if a code is ever
 * missing, and it lives here so the join is tested rather than assumed.
 *
 * @param {Object} routes dsBuildRoutes output, keyed by code
 * @param {string} code   the route code, or ''
 * @param {string} label  the human label the row carries, or ''
 * @return {Object|null}
 */
function dsRouteFor(routes, code, label) {
  routes = routes || {};
  var c = String(code || '').trim();
  if (c && routes[c]) return routes[c];
  var l = String(label || '').trim().toLowerCase();
  if (!l) return null;
  if (routes[label]) return routes[label];                 // a label that IS a code
  var keys = Object.keys(routes);
  for (var i = 0; i < keys.length; i++) {
    var rt = routes[keys[i]];
    var n = String(rt.name || '').trim().toLowerCase();
    if (n && (l === n || l.indexOf(n) === 0)) return rt;
  }
  return null;
}

/**
 * Who is driving this route for a session on a given weekday.
 *
 * A driver with NO days listed covers every school day. Returns an ARRAY on purpose: zero means
 * nobody is listed for today, which the UI must say out loud rather than hide — Aberdeen/HdG PM
 * has no Tuesday driver in the source sheet and 19 children ride it. More than one means the
 * source double-covers that day, which is equally worth showing.
 */
function dsDriversFor(route, session, dayName) {
  if (!route) return [];
  var d = String(dayName || '').slice(0, 3).toLowerCase();
  return (route.drivers || []).filter(function (x) {
    if (String(x.session).toUpperCase() !== String(session).toUpperCase()) return false;
    if (!x.days.length) return true;
    for (var i = 0; i < x.days.length; i++) {
      if (String(x.days[i]).slice(0, 3).toLowerCase() === d) return true;
    }
    return false;
  });
}

/* ------------------------------------ roles + permissions ------------------------------------ */

/**
 * The role vocabulary. READ is broad for everyone (Josh, 2026-09-03: roles set a default view, not
 * a wall — same as FACTS Finder, where any staff member can look up any student). WRITE is narrow
 * by default, because a mis-tap puts a child in the wrong line.
 *
 * The real control is not this table: it is that EVERY change stamps who and when, and shows on
 * the board. A permission model stops accidents; an audit trail catches the rest.
 */
var DS_ROLES = ['Admin', 'Office', 'Ramp', 'Walk-Up', 'Teacher', 'Transportation'];

/** Roles tab -> [{role, email, admin, note}] */
function dsBuildRoles(values) {
  var out = [];
  if (!values || values.length < 2) return out;
  var h = dsHeaderMap(values[0]);
  var get = function (row, name) {
    var i = h[name];
    return i === undefined ? '' : dsCellToString(row[i]).trim();
  };
  for (var r = 1; r < values.length; r++) {
    var email = get(values[r], 'Email').toLowerCase();
    var role = get(values[r], 'Role');
    if (!email || !role) continue;
    out.push({
      role: role, email: email,
      admin: /^(y|yes|true)$/i.test(get(values[r], 'Admin')),
      note: get(values[r], 'Note')
    });
  }
  return out;
}

/**
 * What this person may do. PURE, so the same answer is computed on the server (to enforce) and in
 * the browser (to hide what they cannot use). The server NEVER trusts the browser's copy —
 * google.script.run will call any global function in the project, so hiding a button is not a
 * permission check.
 *
 * @param {string} email        the SIGNED-IN visitor
 * @param {Array}  roleRows     dsBuildRoles output
 * @param {string} teacherName  their "LastName FirstName" from the Staff tab, '' if not staff
 * @param {Object} [homeroomTeachers]  {lowercased "LastName FirstName": true} — every name the
 *                 roster lists as somebody's Homeroom Teacher. Holding a homeroom IS the Teacher
 *                 role: it comes and goes with FACTS, not with a row somebody has to remember to
 *                 add or remove. Rows in the Roles tab still count too.
 * @return {Object} capability set
 */
function dsPermissions(email, roleRows, teacherName, homeroomTeachers) {
  var e = String(email || '').toLowerCase();
  var mine = (roleRows || []).filter(function (r) { return r.email === e; });
  var roles = {}, adminOf = {};
  mine.forEach(function (r) {
    roles[r.role] = true;
    if (r.admin) adminOf[r.role] = true;
  });

  // IMPLICIT Teacher: the roster says students list this person as their homeroom teacher. A new
  // hire gets the role the morning FACTS shows their homeroom; a leaver loses it the same way.
  var teacherImplicit = false;
  if (teacherName && homeroomTeachers &&
      homeroomTeachers[String(teacherName).trim().toLowerCase()] === true) {
    teacherImplicit = true;
    roles['Teacher'] = true;
  }

  var isAdmin = !!roles['Admin'];
  // An Admin administers every role without needing a row per role.
  if (isAdmin) DS_ROLES.forEach(function (r) { adminOf[r] = true; });

  return {
    email: e,
    roles: Object.keys(roles).sort(),
    adminOf: Object.keys(adminOf).sort(),
    teacherName: teacherName || '',
    // WRITE SCOPE, widest first. Office take the phone calls, so they are deliberately the widest.
    // Ramp is unfenced (Josh, 2026-09-04): a parent can arrive at the ramp for ANY child, and the
    // person physically holding that child must be able to record what just happened.
    // TEACHERS ARE READ-ONLY (Josh, 2026-09-05): they look up any student and see their own class,
    // but a change goes through the office or the ramp — "that has to go through the right people."
    // This reverses the 09-04 own-class allowance; canChangeOwnClass is kept as a field for the
    // client's payload shape and now means nothing beyond canChangeAnyone.
    canChangeAnyone: isAdmin || !!roles['Office'] || !!roles['Ramp'],
    canChangeWalkUp: isAdmin || !!roles['Office'] || !!roles['Ramp'] || !!roles['Walk-Up'],
    canChangeOwnClass: isAdmin || !!roles['Office'] || !!roles['Ramp'],
    canEditRoutes: isAdmin || !!roles['Transportation'],
    canManageRoles: Object.keys(adminOf).length > 0,
    isAdmin: isAdmin,
    teacherImplicit: teacherImplicit
  };
}

/** {lowercased teacher name: true} for every Homeroom Teacher the roster names. */
function dsHomeroomTeacherSet(roster) {
  var out = {};
  (roster || []).forEach(function (r) {
    var t = String(r.homeroomTeacher || '').trim().toLowerCase();
    if (t) out[t] = true;
  });
  return out;
}

/**
 * May this person change THIS child's dismissal today?
 *
 * Read is broad; write belongs to the people who take the calls. Office and Ramp may change anyone,
 * Walk-Up may change a child on the approved list, and everyone else — teachers included, since
 * 2026-09-05 — is told who to tell. The refusal never says "get a role": for most staff, read-only
 * is the correct state, not a missing permission.
 *
 * @param {Object} perm      dsPermissions output
 * @param {Object} student   the child's flat/roster entry, or null (kept for the call sites; the
 *                           own-class allowance it served was withdrawn)
 * @param {boolean} isWalkUp whether the child is on the approved walk-up list
 * @return {{ok: boolean, why: string}} why is shown to the person, so it must be plain English
 */
function dsCanChange(perm, student, isWalkUp) {
  if (perm && perm.canChangeAnyone) return { ok: true, why: '' };
  if (isWalkUp && perm && perm.canChangeWalkUp) return { ok: true, why: '' };
  if (perm && perm.canChangeWalkUp) {
    return { ok: false, why: 'You can change children on the approved walk-up list. For anyone ' +
      'else, tell the office and they\'ll record it.' };
  }
  return { ok: false, why: 'Changes are recorded by the office or the ramp — tell them and ' +
    'they\'ll record it.' };
}

/**
 * The classroom view's three widening scopes. Lives here rather than in the page so it is tested,
 * and so the name comparison is the one dsPermissions uses to recognise a homeroom teacher.
 * (Teachers are read-only since 2026-09-05; this decides only what they SEE.)
 *
 * 'class'  — students whose Homeroom Teacher is this person. FACTS records ONE homeroom teacher per
 *            student, so where a grade is shared between teachers each sees their own homeroom.
 * 'grade'  — every student in any grade this person teaches. The answer for a co-teacher, and for
 *            "a parent is asking about a child two doors down".
 * 'school' — everyone. Reading is broad by design; only writing is scoped.
 *
 * @param {Array}  rows        flat list rows
 * @param {string} teacherName "LastName FirstName", or '' if the sign-in matched no staff record
 * @param {string} scope       'class' | 'grade' | 'school'
 */
function dsScopeRows(rows, teacherName, scope) {
  rows = rows || [];
  if (scope === 'school') return rows.slice();
  var t = String(teacherName || '').trim().toLowerCase();
  if (!t) return [];                       // no match is NOT everyone — fail closed and say so
  var mine = rows.filter(function (r) {
    return String(r.homeroomTeacher || '').trim().toLowerCase() === t;
  });
  if (scope !== 'grade') return mine;
  var grades = {};
  mine.forEach(function (r) { grades[String(r.grade)] = true; });
  return rows.filter(function (r) { return grades[String(r.grade)] === true; });
}

/**
 * Turn what someone typed into the settings "add" box into ONE email, or say why not.
 *
 * An address goes through as-is. A name matches when every typed token appears somewhere in the
 * staff name, in any order — "gina", "sowell gi" and "Gina Sowell" all find "Sowell Gina",
 * because people say first-name-first and FACTS stores last-name-first. Exactly one hit is an
 * answer; none or several is a message the person can act on, never a guess. This is the same
 * resolution whether the browser's own suggestion list rendered or not, so an iPad that shows no
 * dropdown still gets the right person.
 *
 * @param {Array<{email, name}>} staff  the directory
 * @param {string} typed
 * @return {{email?: string, name?: string, error?: string}}
 */
function dsResolveStaff(staff, typed) {
  var t = String(typed || '').trim().toLowerCase();
  if (!t) return { error: 'Type a name or an email.' };
  if (t.indexOf('@') !== -1) {
    var exact = (staff || []).filter(function (s) { return String(s.email).toLowerCase() === t; })[0];
    return exact ? { email: exact.email, name: exact.name } : { email: t };
  }
  var toks = t.split(/\s+/).filter(String);
  var hits = (staff || []).filter(function (s) {
    var n = String(s.name || '').toLowerCase();
    return toks.every(function (k) { return n.indexOf(k) !== -1; });
  });
  if (hits.length === 1) return { email: hits[0].email, name: hits[0].name };
  if (!hits.length) return { error: 'Nobody on staff matches "' + typed + '". Type the email instead.' };
  return { error: hits.length + ' people match "' + typed + '": ' +
    hits.slice(0, 6).map(function (s) { return s.name; }).join(', ') +
    (hits.length > 6 ? '…' : '') + ' — keep typing.' };
}

/**
 * The staff DIRECTORY for the settings add box: [{email, name}] for ACTIVE staff on the school
 * domain, sorted by name. Distinct from dsBuildStaffNames, which maps every address it can for the
 * own-class check — this one is what gets SUGGESTED to a role admin, so it must not offer someone
 * who left in June. Source is FACTS /people/staff via the staging Staff tab, refreshed 07/11/15, so
 * it follows HR without anyone maintaining a list here. A tab with no Active column is not filtered
 * (defensive), but the real tab has one.
 */
function dsBuildStaffDirectory(values, domain) {
  var out = [];
  if (!values || values.length < 2) return out;
  var h = dsHeaderMap(values[0]);
  var get = function (row, name) {
    var i = h[name];
    return i === undefined ? '' : dsCellToString(row[i]).trim();
  };
  var d = String(domain || '').toLowerCase();
  var seen = {};
  for (var r = 1; r < values.length; r++) {
    var row = values[r];
    if (h['Active'] !== undefined && !/^(y|yes|true)$/i.test(get(row, 'Active'))) continue;
    var nm = (get(row, 'Last Name') + ' ' + get(row, 'First Name')).trim();
    if (!nm) continue;
    ['Email', 'Email2'].forEach(function (c) {
      var e = get(row, c).toLowerCase();
      if (!e || seen[e]) return;
      if (d && e.split('@')[1] !== d) return;              // a personal address can never sign in
      seen[e] = 1;
      out.push({ email: e, name: nm });
    });
  }
  out.sort(function (a, b) {
    return a.name < b.name ? -1 : a.name > b.name ? 1 : (a.email < b.email ? -1 : 1);
  });
  return out;
}

/** email -> "LastName FirstName", from the staging Staff tab, for the own-class check. */
function dsBuildStaffNames(values) {
  var out = {};
  if (!values || values.length < 2) return out;
  var h = dsHeaderMap(values[0]);
  var get = function (row, name) {
    var i = h[name];
    return i === undefined ? '' : dsCellToString(row[i]).trim();
  };
  for (var r = 1; r < values.length; r++) {
    var row = values[r];
    // FACTS convention, matching the roster's Homeroom Teacher: "LastName FirstName", NO comma.
    var nm = (get(row, 'Last Name') + ' ' + get(row, 'First Name')).trim();
    if (!nm) continue;
    ['Email', 'Email2'].forEach(function (c) {
      var e = get(row, c).toLowerCase();
      if (e) out[e] = nm;
    });
  }
  return out;
}

/* ------------------------------------ classification ------------------------------------ */

/**
 * Is this student expected in their line today, and if not, why not?
 *
 * Precedence, most specific first. Each step is a POSITIVE statement that the child left or never
 * arrived; anything else means expected.
 *   1. signed out mid-day and not back   -> NOT expected
 *   2. attendance code ED (early dismissal) -> NOT expected
 *   3. attendance flagged absent (AE/AU)  -> NOT expected
 *   4. everything else                    -> EXPECTED
 *
 * LA / TE / TU are deliberately EXPECTED: a late arrival is present by dismissal, and treating
 * "arrived late" as "gone home" is the failure that leaves a child standing outside.
 *
 * THE HONEST LIMIT: a student who never came in and was never marked absent reads as expected.
 * Campus Presence has no attendance feed by design and FACTS attendance depends on a teacher
 * entering it. The UI must show data freshness rather than implying certainty.
 *
 * @return {{expected: boolean, reason: string, detail: string}}
 */
function dsClassify(student, att, out) {
  if (out) {
    return {
      expected: false, reason: 'SIGNED OUT',
      detail: (out.at ? out.at + ' ' : '') + (out.withWhom ? 'with ' + out.withWhom : '')
    };
  }
  var a = att || null;
  if (a) {
    // Code OR the producer's own Status bucket. facts-api-sync/Attendance.gs classifies from the
    // FACTS flags into 'Absent' | 'Late' | 'Left early' and writes that as Status; matching on it
    // means a second early-dismissal code added in FACTS is caught here without a code change.
    if (a.code === 'ED' || /left early|early dismissal/i.test(a.status || '')) {
      return { expected: false, reason: 'LEFT EARLY', detail: a.reason || a.detail || '' };
    }
    if (a.code === 'AE' || a.code === 'AU' || /absent/i.test(a.status || '')) {
      return {
        expected: false, reason: 'ABSENT',
        detail: (a.excused === 'Y' ? 'excused' : a.excused === 'N' ? 'unexcused' : '') +
                (a.reason ? (a.excused ? ' — ' : '') + a.reason : '')
      };
    }
    if (a.code === 'LA' || a.code === 'TE' || a.code === 'TU' || /late|tardy/i.test(a.status || '')) {
      return { expected: true, reason: 'LATE', detail: a.reason || '' };
    }
  }
  return { expected: true, reason: '', detail: '' };
}

/* ------------------------------------ the board ------------------------------------ */

/**
 * Fold everything into the structure the UI renders.
 *
 * @param {Object} d roster, attendance, signedOut, overrides
 * @param {Object} [opts] {session: 'PM', routes: dsBuildRoutes output}
 * @return {Object} {session, counts, groups[], notExpected[], conflicts[], types[], routes[]}
 */
function dsBuildBoard(d, opts) {
  d = d || {}; opts = opts || {};
  var session = opts.session || 'PM';
  var att = d.attendance || {};
  var outs = d.signedOut || {};
  var ovr = d.overrides || {};
  var routes = opts.routes || {};

  var rows = (d.roster || []).filter(function (s) { return s.session === session; });
  var byGroup = {}, notExpected = [], seen = {};
  // LANES ARE KEYED BY THE ROSTER'S ROUTE NAME (the FACTS course title). A child overridden ONTO a
  // bus must join that bus's lane, so the name for a code comes from the roster first and from the
  // Routes tab only for a code no rider carries today — found 2026-09-08, when the first override
  // to J opened a second "Jarrettsville" lane beside "Jarrettsville Bus Route".
  var nameByCode = {};
  rows.forEach(function (s) { if (s.routeCode && s.routeName && !nameByCode[s.routeCode]) nameByCode[s.routeCode] = s.routeName; });
  var counts = { total: 0, expected: 0, notExpected: 0, byType: {} };

  rows.forEach(function (s) {
    var o = ovr[s.id] || null;
    var type = o && o.type ? o.type : s.type;
    var routeCode = o && o.routeCode ? o.routeCode : s.routeCode;
    var v = dsClassify(s, att[s.id], outs[s.id]);

    // AN OVERRIDE REPLACES THE JOURNEY, NOT JUST THE LABEL. The first version changed `type` and
    // left routeName/vehicle as the roster had them, so "mum is collecting Ella, not the bus"
    // produced a Car row whose destination still read "Jarrettsville" — the one thing the override
    // existed to stop saying. Anything not a bus carries no route; a bus with a changed route takes
    // the name and vehicle of the route it was changed TO, not the one it left.
    var routeName = s.routeName, vehicle = s.vehicle, split = s.split;
    if (type !== 'Bus') {
      routeCode = ''; routeName = ''; vehicle = ''; split = false;
    } else if (routeCode !== s.routeCode) {
      var rt = routes[routeCode];
      routeName = nameByCode[routeCode] || (rt ? (rt.name || routeCode) : '');
      vehicle = rt ? (rt.vehicle || '') : '';
      split = false;                        // one route was chosen for today; nothing to confirm
    }

    // WHEN AN OVERRIDE TAKES A RIDER OFF THEIR BUS, THE BUS STILL NEEDS TO KNOW. The driver's list
    // (dsDriverLists) is built from the board alone, so the route the roster had rides along on the
    // row whenever an override changed the journey away from it — blank otherwise.
    var moved = !!o && s.type === 'Bus' && !!s.routeCode && (type !== 'Bus' || routeCode !== s.routeCode);

    var entry = {
      id: s.id, name: s.name, grade: s.grade, type: type,
      routeCode: routeCode, routeName: routeName, vehicle: vehicle,
      split: split, building: s.building, pickup: s.pickup, walkTo: s.walkTo,
      familyId: s.familyId, homeroom: s.homeroom, homeroomTeacher: s.homeroomTeacher,
      note: s.note, source: s.source,
      // The audit trail travels with the row. Every change stamps who and when; the card must be
      // able to say so, or the stamp is a promise the sheet keeps and the app breaks. A STANDING
      // answer is not "today" — it is the child's normal — so it gets its own flag and note and
      // never earns the TODAY badge.
      overridden: !!(o && !o.standing), overrideNote: (o && !o.standing) ? (o.note || '') : '',
      overrideBy: (o && !o.standing) ? (o.by || '') : '', overrideAt: (o && !o.standing) ? (o.at || '') : '',
      overrideDestination: o ? (o.destination || '') : '',
      standing: !!(o && o.standing), standingNote: (o && o.standing) ? (o.note || '') : '',
      fromRouteCode: moved ? s.routeCode : '', fromRouteName: moved ? s.routeName : '',
      expected: v.expected, reason: v.reason, detail: v.detail
    };

    // A student appears once per (session, route); count distinct students, not rows.
    if (!seen[s.id]) { seen[s.id] = 1; counts.total++; }
    counts.byType[type] = (counts.byType[type] || 0) + 1;
    if (v.expected) counts.expected++; else { counts.notExpected++; notExpected.push(entry); }

    var key = type === 'Bus' ? (routeName || routeCode || 'Bus') : type;
    (byGroup[key] = byGroup[key] || { key: key, type: type, rows: [] }).rows.push(entry);
  });

  // Bus groups first (a missed bus is unrecoverable), then Early Bird (they leave first),
  // then Staff Kid, then Car.
  var rank = { 'Bus': 0, 'Early Bird': 1, 'Staff Kid': 2, 'Car': 3 };
  var groups = Object.keys(byGroup).map(function (k) { return byGroup[k]; });
  groups.forEach(function (g) {
    g.rows.sort(function (a, b) { return a.name < b.name ? -1 : a.name > b.name ? 1 : 0; });
    g.expected = g.rows.filter(function (r) { return r.expected; }).length;
    g.notExpected = g.rows.length - g.expected;
  });
  groups.sort(function (a, b) {
    var ra = rank[a.type] === undefined ? 9 : rank[a.type];
    var rb = rank[b.type] === undefined ? 9 : rank[b.type];
    return ra !== rb ? ra - rb : (a.key < b.key ? -1 : a.key > b.key ? 1 : 0);
  });
  notExpected.sort(function (a, b) { return a.name < b.name ? -1 : a.name > b.name ? 1 : 0; });

  return {
    session: session, counts: counts, groups: groups, notExpected: notExpected,
    types: groups.map(function (g) { return g.type; }).filter(function (t, i, arr) {
      return arr.indexOf(t) === i;
    }),
    routes: groups.filter(function (g) { return g.type === 'Bus'; }).map(function (g) { return g.key; })
  };
}

/**
 * Narrow a board client-side. Returns the same shape so the renderer never branches on filtered vs
 * not. Search matches name, student id and route.
 */
function dsFilterBoard(board, f) {
  f = f || {};
  var q = String(f.q || '').trim().toLowerCase();
  var grades = f.grades && f.grades.length ? f.grades : null;
  var notTypes = f.excludeTypes && f.excludeTypes.length ? f.excludeTypes : null;
  // `types` is a MULTI-select include list. the ramp lead needs Bus AND Car at once and does not want
  // Staff Kid — a single-value dropdown literally cannot express that, which is an accuracy gap
  // rather than a convenience one. `type` (singular) is kept for older saved views.
  var types = f.types && f.types.length ? f.types : (f.type ? [f.type] : null);
  var keep = function (r) {
    if (types && types.indexOf(r.type) === -1) return false;
    if (notTypes && notTypes.indexOf(r.type) !== -1) return false;
    if (grades && grades.indexOf(String(r.grade)) === -1) return false;
    if (f.route && (r.routeName || r.routeCode) !== f.route) return false;
    if (f.pickup && r.pickup !== f.pickup) return false;
    if (f.expected === true && !r.expected) return false;
    if (f.expected === false && r.expected) return false;
    if (q) {
      var hay = (r.name + ' ' + r.id + ' ' + (r.routeName || '') + ' ' + (r.routeCode || '')).toLowerCase();
      if (hay.indexOf(q) === -1) return false;
    }
    return true;
  };
  var groups = [], counts = { total: 0, expected: 0, notExpected: 0, byType: {} }, seen = {};
  (board.groups || []).forEach(function (g) {
    var rows = g.rows.filter(keep);
    if (!rows.length) return;
    var exp = rows.filter(function (r) { return r.expected; }).length;
    rows.forEach(function (r) {
      if (!seen[r.id]) { seen[r.id] = 1; counts.total++; }
      counts.byType[r.type] = (counts.byType[r.type] || 0) + 1;
    });
    counts.expected += exp;
    counts.notExpected += rows.length - exp;
    groups.push({ key: g.key, type: g.type, rows: rows, expected: exp, notExpected: rows.length - exp });
  });
  return {
    session: board.session, counts: counts, groups: groups,
    notExpected: (board.notExpected || []).filter(keep),
    types: board.types, routes: board.routes
  };
}

// Node test harness reaches these directly; GAS and the browser ignore the export.
/* ------------------------------------ the driver's list ------------------------------------ */

/**
 * One printable list per PM bus route — who is riding today, who is NOT, and who is driving —
 * built from the SAME board the ramp sees, so paper and screen cannot disagree (the front desk
 * prints these for the drivers; Josh, 2026-09-08).
 *
 * A rider on the route's group today is RIDING when expected, NOT RIDING with the board's reason
 * (ABSENT / LEFT EARLY / SIGNED OUT) otherwise. A rider an override took OFF the bus reaches the
 * list through fromRouteCode as "CAR TODAY" (or "ON <other route> TODAY"), because the driver
 * still needs to know not to wait. A standing answer says so — "(STANDING)" — rather than reading
 * as a fresh change every day. Unknown reads as riding, same as everywhere else in this app.
 *
 * @param board   dsBuildBoard output
 * @param routes  dsBuildRoutes output — colour, vehicle, who drives which day
 * @param dayName 'Mon'..'Fri'
 * @param only    optional route code or name — just that route's list, for a one-bus reprint
 * @return [{ code, name, colour, vehicle, drivers: [{name, phone}],
 *            riding:    [{ id, name, grade, building, flags: ['also on …', 'added today — …', 'standing — …'] }],
 *            notRiding: [{ id, name, grade, reason, detail }] }]  alphabetical, riders alphabetical
 */
function dsDriverLists(board, routes, dayName, only) {
  routes = routes || {};
  var lists = {}, routesOf = {}, rows = [];
  ((board && board.groups) || []).forEach(function (g) {
    (g.rows || []).forEach(function (r) { rows.push(r); });
  });
  var onBus = function (r) { return r.type === 'Bus' && !!(r.routeCode || r.routeName); };
  var labelOf = function (r) { return r.routeName || r.routeCode; };

  function listFor(code, label) {
    var rt = dsRouteFor(routes, code, label);
    var key = (rt && rt.code) || code || label;
    if (!lists[key]) {
      lists[key] = {
        code: (rt && rt.code) || code || '',
        name: (rt && rt.name) || label || code || 'Bus',
        colour: (rt && rt.colour) || '', vehicle: (rt && rt.vehicle) || '',
        drivers: dsDriversFor(rt, 'PM', dayName).map(function (d) {
          return { name: d.name, phone: d.phone || '' };
        }),
        riding: [], notRiding: []
      };
    }
    return lists[key];
  }

  rows.forEach(function (r) {
    if (onBus(r)) (routesOf[r.id] = routesOf[r.id] || []).push(labelOf(r));
  });
  rows.forEach(function (r) {
    if (onBus(r)) {
      var L = listFor(r.routeCode, r.routeName);
      if (r.expected) {
        var flags = [];
        (routesOf[r.id] || []).forEach(function (n) { if (n !== labelOf(r)) flags.push('also on ' + n); });
        if (r.overridden) flags.push('added today' + (r.overrideNote ? ' — ' + r.overrideNote : ''));
        else if (r.standing) flags.push('standing' + (r.standingNote ? ' — ' + r.standingNote : ''));
        L.riding.push({ id: r.id, name: r.name, grade: r.grade, building: r.building || '', flags: flags });
      } else {
        L.notRiding.push({ id: r.id, name: r.name, grade: r.grade, reason: r.reason || 'NOT EXPECTED',
                           detail: r.detail || '' });
      }
    }
    if (r.fromRouteCode || r.fromRouteName) {
      var F = listFor(r.fromRouteCode, r.fromRouteName);
      var to = r.type === 'Bus' ? dsRouteFor(routes, r.routeCode, r.routeName) : null;
      var where = r.type === 'Bus'
        ? 'ON ' + String((to && to.name) || r.routeName || r.routeCode || 'ANOTHER BUS').toUpperCase()
        : String(r.type || 'CHANGED').toUpperCase();
      var note = r.standing ? r.standingNote : r.overrideNote;
      F.notRiding.push({
        id: r.id, name: r.name, grade: r.grade,
        reason: where + (r.standing ? ' (STANDING)' : ' TODAY'),
        detail: [r.overrideDestination || '', note || ''].filter(String).join(' — ')
      });
    }
  });

  var byName = function (a, b) { return a.name < b.name ? -1 : a.name > b.name ? 1 : 0; };
  var out = Object.keys(lists).map(function (k) { return lists[k]; });
  out.forEach(function (L) { L.riding.sort(byName); L.notRiding.sort(byName); });
  out.sort(byName);
  if (only) {
    var o = String(only).trim().toLowerCase();
    out = out.filter(function (L) {
      return L.code.toLowerCase() === o || L.name.toLowerCase() === o;
    });
  }
  return out;
}

    dsBuildStanding: dsBuildStanding, dsMergeOverrides: dsMergeOverrides, dsApplyWalkUps: dsApplyWalkUps,
    DS_STANDING_TYPES: DS_STANDING_TYPES,
