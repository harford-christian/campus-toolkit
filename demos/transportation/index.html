<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Dismissal Board — Showcase demo</title>
<style>
  /* Hand-written switcher (not a build output): the two built pages are board.html (build.json) and
     kiosk.html (build.kiosk.json). */
  :root { --maroon:#8f1b1b; --gold:#D4AF37; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { display: flex; flex-direction: column; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: #f6f7f9; }
  .bar {
    flex: none; display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
    padding: 10px 16px; color: #fff;
    background: linear-gradient(120deg, #6d1414 0%, #8f1b1b 55%, #B22222 100%);
    box-shadow: 0 4px 14px rgba(0,0,0,.35); z-index: 2;
  }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 1.05rem; }
  .brand .logo { font-size: 1.5rem; }
  .brand small { display: block; font-weight: 600; font-size: .72rem; opacity: .85; }
  .seg { display: inline-flex; background: rgba(255,255,255,.14); border: 1px solid rgba(255,255,255,.25); border-radius: 999px; padding: 4px; gap: 2px; flex-wrap: wrap; }
  .seg button {
    border: 0; cursor: pointer; font: inherit; font-weight: 700; font-size: .86rem;
    color: #fff; background: transparent; padding: 8px 13px; border-radius: 999px;
    display: inline-flex; align-items: center; gap: 6px; transition: background .12s;
  }
  .seg button:hover { background: rgba(255,255,255,.16); }
  .seg button.active { background: var(--gold); color: #3a2b00; }
  .spacer { flex: 1; }
  .hint { font-size: .78rem; opacity: .82; max-width: 30rem; line-height: 1.35; }
  .back { color: #fff; text-decoration: none; font-weight: 700; font-size: .86rem; opacity: .9; border: 1px solid rgba(255,255,255,.3); padding: 7px 12px; border-radius: 999px; }
  .back:hover { background: rgba(255,255,255,.12); }
  .stage { flex: 1; position: relative; background: #f6f7f9; }
  .stage iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; display: block; background: #f6f7f9; }
  @media (max-width: 980px) { .brand small, .hint { display: none; } .seg button { padding: 8px 10px; font-size: .8rem; } }
</style>
</head>
<body>
  <div class="bar">
    <div class="brand">
      <span class="logo" aria-hidden="true">🚌</span>
      <span>Dismissal Board<small>The staff board &amp; the ramp iPad it publishes to</small></span>
    </div>
    <div class="seg" role="tablist" aria-label="Choose a screen">
      <button data-src="board.html" class="active" aria-selected="true">📋 Dismissal Board</button>
      <button data-src="kiosk.html" aria-selected="false">🧸 Ramp Kiosk (iPad)</button>
    </div>
    <span class="spacer"></span>
    <span class="hint">The ramp iPad has no sign-in and renders only the file the board publishes.
      Change a K4&ndash;5 child to Car on the board, then open the kiosk.</span>
    <a class="back" href="../../index.html" target="_top">← Gallery</a>
  </div>
  <div class="stage">
    <iframe id="screen" src="board.html" title="Dismissal demo screen"></iframe>
  </div>
<script>
  // Two Apps Script projects, one dataset: board.html is the staff Dismissal Board, kiosk.html the ramp
  // iPad, which reads the Dismissal_RAMP_BOARD.json the board's server publishes. Both share this tab's
  // sessionStorage, so a change saved on the board shows on the kiosk.
  // The board gets this page's own query string, so index.html?sim=2026-09-18 15:00 still time-travels it.
  var frame = document.getElementById('screen');
  var btns = [].slice.call(document.querySelectorAll('.seg button'));
  function srcFor(b) { var s = b.getAttribute('data-src'); return s === 'board.html' ? s + location.search : s; }
  function activate(btn) {
    btns.forEach(function (x) { x.classList.remove('active'); x.setAttribute('aria-selected', 'false'); });
    btn.classList.add('active');
    btn.setAttribute('aria-selected', 'true');
  }
  frame.src = srcFor(btns[0]);
  btns.forEach(function (b) {
    b.addEventListener('click', function () { activate(b); frame.src = srcFor(b); });
  });
  // The kiosk's "Full app" button opens the board inside the frame; re-sync the highlight when the
  // browser lets us read the frame's location (a file:// page may not, and then the buttons stay put).
  frame.addEventListener('load', function () {
    var here = '';
    try { here = frame.contentWindow.location.pathname; } catch (e) { return; }
    btns.forEach(function (b) { if (here.slice(-b.getAttribute('data-src').length) === b.getAttribute('data-src')) activate(b); });
  });
</script>
</body>
</html>
