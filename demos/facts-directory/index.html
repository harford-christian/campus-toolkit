  var codeParts = /^([bg])?((?:jv|v|ms)*)([bg])?(cctry|xc|volley|vb|basket|bb|soft|sb|base|bsb|flag|ff|soccer|soc|sc|golf)$/
    .exec(String((activity && activity.code) || '').toLowerCase()) || [];
  var codeSport = codeParts[4] || '';
  if (!sport) {
    sport =
      /^(cctry|xc)$/.test(codeSport) ? 'Cross-Country' :
      /^(vb|volley)$/.test(codeSport) ? 'Volleyball' :
      /^(bb|basket)$/.test(codeSport) ? 'Basketball' :
      /^(sb|soft)$/.test(codeSport) ? 'Softball' :
      /^(base|bsb)$/.test(codeSport) ? 'Baseball' :
      /^(ff|flag)$/.test(codeSport) ? 'Flag Football' :
      /^(sc|soc|soccer)$/.test(codeSport) ? 'Soccer' :
      codeSport === 'golf' ? 'Golf' : '';
  }
  if (!sport) return [];

  /* A course may name more than one level; collect every level it claims, from TWO sources.

     1. The DESCRIPTION's words, as whole tokens only. "Junior Varsity" is stripped before the
        bare "Varsity" test, so "Junior Varsity & Varsity Basketball" yields BOTH levels while
        "Junior Varsity Basketball" yields only JV.
     2. The CODE's level prefix, read ANCHORED: an optional B/G gender letter, then jv|v|ms.
        Real codes are built that way ("BVSOC", "GMSVB", "BJVVBB", "MSCCTRY").

     Anchoring the code matters. An earlier version searched the whole string for a bare "v"
     followed by letters, to catch "VSOC" — and the "v" in **v**olleyball matched it, so every
     "MS Girls Volleyball" enrolment also claimed Varsity and picked up the Varsity team's away
     games. Showing an MS player the varsity bus time is exactly the failure this feature exists
     to prevent, so level is now read positionally or not at all. */
  var levels = {};
  var noJv = l.replace(/junior\s+varsity/g, ' jv ');
  if (/middle\s*school|\bms\b/.test(l)) levels.MS = true;
  if (/\bjv\b/.test(noJv)) levels.JV = true;
  if (/\bvarsity\b/.test(noJv)) levels.Varsity = true;

  var codeLevel = /^(jv|v|ms)/.exec(codeParts[2] || '');
  if (codeLevel) {
    levels[codeLevel[1] === 'v' ? 'Varsity' : codeLevel[1] === 'jv' ? 'JV' : 'MS'] = true;
  }
  var wantLevel = Object.keys(levels);

  /* Gender: THE CLASS WINS when it states one, and only then fall back to the student.
     The original rule took gender from the student alone, because FACTS course titles "often
     state no gender" — but HCS's do ("MS Girls Soccer"), and ignoring that put a boy enrolled
     in MSGSoc onto the MS BOYS calendar. The class is the more specific signal; the student's
     own record is the fallback for a title like "Junior Varsity & Varsity Basketball" that
     names none. This also means a blank/unknown Gender cell no longer matches both teams. */
  var classGender =
    /\b(girls?|women'?s?|ladies)\b/.test(l) ? 'Girls' :
    /\b(boys?|men'?s?)\b/.test(l) ? 'Boys' :
    (codeParts[1] || codeParts[3]) === 'g' ? 'Girls' :
    (codeParts[1] || codeParts[3]) === 'b' ? 'Boys' : '';

  var g = String(gender || '').trim().toLowerCase().charAt(0);
  var wantGender = classGender || (g === 'm' ? 'Boys' : g === 'f' ? 'Girls' : '');

  var candidates = (teams || []).filter(function (t) {
    if (t.sport !== sport) return false;
    // Coed teams (Cross-Country, Golf, Flag Football) take either gender.
    if (t.gender !== 'Coed' && wantGender && t.gender !== wantGender) return false;
    return true;
  });

  // Level narrows only when that sport actually HAS separate level calendars. Real case:
  // FACTS carries a course called "MS Cross Country", but HCS runs a single cross-country
  // calendar (Varsity/Coed) that middle-schoolers' meets are posted on — filtering by MS
  // there would silently hide every runner's dismissal. Same for Golf, Softball and Flag
  // Football, which each have one calendar for all levels.
  if (wantLevel.length) {
    var byLevel = candidates.filter(function (t) { return wantLevel.indexOf(t.level) !== -1; });
    if (byLevel.length) return byLevel;
    /* No calendar at that level. Falling back to "every candidate" is only safe when there is
       exactly ONE — the real case being "MS Cross Country" against HCS's single XC calendar.
       With more than one it INVENTS teams: "JV Boys Soccer" read for a girl used to return MS
       *and* Varsity girls, neither of which she is on. Silence beats a wrong bus time. */
    return candidates.length === 1 ? candidates : [];
  }
  return candidates;
}

/**
 * Will this class be missed because the student leaves for a game?
 *
 * The test is the class's END, not its start: a class that is still running when the team is
 * dismissed is cut short, and one that starts afterwards is missed entirely — both matter to a
 * teacher. A class that has already ENDED by the dismissal is unaffected.
 *
 * @param c          one annotateSchedule row (needs meetsToday + end)
 * @param dismissMin dismissal in minutes past midnight; -1 when there is no game today
 */
function isMissedForGame(c, dismissMin) {
  if (!c || !c.meetsToday || dismissMin === null || dismissMin === undefined || dismissMin < 0) {
    return false;
  }
  var end = searchTimeToMin_(c.end);
  return end > dismissMin; // end is exclusive everywhere here, so ">" not ">="
}

/**
 * Join a student's activity enrolments to today's team events.
 * @param activities the student's Activity=Y classes
 * @param gender     the student's Gender cell
 * @param teams      ATHLETICS_TEAMS
 * @param events     [{teamId, date:'YYYY-MM-DD', title, start:'HH:MM', location,
 *                    dismiss:'HH:MM', depart:'HH:MM'}]
 * @param isoDate    the date to report on
 * @return {Array} one entry per team event today, most urgent dismissal first
 */
function athleticsForStudent(activities, gender, teams, events, isoDate) {
  var mine = {};
  (activities || []).forEach(function (a) {
    athleticsMatchTeams(a, gender, teams).forEach(function (t) { mine[t.id] = t; });
  });
  var byId = {};
  (teams || []).forEach(function (t) { byId[t.id] = t; });

  var out = [];
  (events || []).forEach(function (ev) {
    if (ev.date !== isoDate) return;      // never let another day's game read as today's
    if (!mine[ev.teamId]) return;
    var t = byId[ev.teamId] || {};
    out.push({
      teamId: ev.teamId,
      // "Soccer - V (Boys)" reads better here as "Varsity Boys Soccer"
      team: [t.level === 'Varsity' ? 'Varsity' : t.level, t.gender === 'Coed' ? '' : t.gender, t.sport]
        .filter(String).join(' '),
      sport: t.sport || '',
      title: ev.title || '',
      start: ev.start || '',
      location: ev.location || '',
      dismiss: ev.dismiss || '',
      depart: ev.depart || '',
      // Does this event take the student OUT OF CLASS? Only a posted dismissal/departure does.
      // After-school practices and home games fill most of these calendars and change nothing
      // about the school day, so surfacing them at the top of a record would be pure noise —
      // and "Cross-Country today, dismissal not posted" on a 3:30 practice is worse than noise,
      // it invites someone to go looking for a dismissal that was never meant to exist.
      leavesEarly: !!(ev.dismiss || ev.depart)
    });
  });
  out.sort(function (a, b) {
    var am = searchTimeToMin_(a.dismiss || a.depart || a.start);
    var bm = searchTimeToMin_(b.dismiss || b.depart || b.start);
    if (am < 0) am = 9999;
    if (bm < 0) bm = 9999;
    return am - bm;
  });
  return out;
}

/** Optimal-string-alignment distance (Levenshtein + adjacent transposition = 1). */
function searchEditDistance_(a, b) {
  var la = a.length, lb = b.length;
  var d = [];
  for (var i = 0; i <= la; i++) { d[i] = [i]; }
  for (var j = 0; j <= lb; j++) { d[0][j] = j; }
  for (i = 1; i <= la; i++) {
    for (j = 1; j <= lb; j++) {
      var cost = a[i - 1] === b[j - 1] ? 0 : 1;
      d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + cost);
      if (i > 1 && j > 1 && a[i - 1] === b[j - 2] && a[i - 2] === b[j - 1]) {
        d[i][j] = Math.min(d[i][j], d[i - 2][j - 2] + 1);
      }
    }
  }
  return d[la][lb];
}

// Node interop; harmless in GAS (`module` is undefined there).
if (typeof module !== 'undefined' && module.exports) {
  module.exports = {
    searchWorkbook: searchWorkbook,
    searchCellToString_: searchCellToString_,
    serializeTabs: serializeTabs,
    SEARCH_MAX_ROWS_PER_TAB: SEARCH_MAX_ROWS_PER_TAB,
    buildPeople: buildPeople,
    buildTeachers: buildTeachers,
    buildClasses: buildClasses,
    searchPeople: searchPeople,
    personDetail: personDetail,
    teacherDetail: teacherDetail,
    classDetail: classDetail,
    buildPeriodTimes: buildPeriodTimes,
    buildEmergencyContacts: buildEmergencyContacts,
    buildAttendance: buildAttendance,
    buildPickupContacts: buildPickupContacts,
    pruneToEnrolled: pruneToEnrolled,
    buildTransportation: buildTransportation,
    buildSiblings: buildSiblings,
    buildPresence: buildPresence,
    studentStatus: studentStatus,
    bellSlotTimes: bellSlotTimes,
    annotateSchedule: annotateSchedule,
    schoolDayBlock: schoolDayBlock,
    slotAppliesToGrade_: slotAppliesToGrade_,
    parseSimClock: parseSimClock,
    isHomeroomClass_: isHomeroomClass_,
    parseAthleticsTimes: parseAthleticsTimes,
    athleticsNormalizeDesc_: athleticsNormalizeDesc_,
    athleticsParseIcs: athleticsParseIcs,
    athleticsMatchTeams: athleticsMatchTeams,
    athleticsForStudent: athleticsForStudent,
    isMissedForGame: isMissedForGame,
    parseQuarterRanges: parseQuarterRanges,
    quarterForDate: quarterForDate,
    searchTimeToMin_: searchTimeToMin_,
    searchTimeLabel_: searchTimeLabel_,
    searchGradeKeys_: searchGradeKeys_,
    searchEditDistance_: searchEditDistance_
  };
}
</script>

<script>
  var q = document.getElementById('q');
  var go = document.getElementById('go');
  var statusEl = document.getElementById('status');
  var resultsEl = document.getElementById('results');
  var debounceTimer = null;
  var reqSeq = 0;            // only the newest request may render (guards out-of-order responses)
  var lastList = null;       // last people-list result, so "back" needs no new server call
  var lastListStatus = '';
  var lastPersonDetail = null; // open student's record, for the 60s NOW re-render
  var IDLE_MSG = 'Type a name — pick a student to see their full record.';

  /* ---------- favourites ----------
     The handful of students one person checks repeatedly (their own kids, a caseload, a
     homeroom). Stored server-side keyed by the signed-in user, so they follow that person from
     phone to desk — see the warning in Code.gs about why this cannot use UserProperties.
     Only IDs are stored; the rows are rendered from the dataset already in the page, which is
     what keeps a favourite from ever showing stale data. */
  var favIds = [];
  var favBusy = false;

  function isFav_(id) { return favIds.indexOf(String(id)) !== -1; }

  /** Keep the header chip in step with how many favourites this user has. */
  function syncFavChip_() {
    var el = document.getElementById('favview');
    if (!el) return;
    el.hidden = favIds.length === 0;
    el.textContent = '★ Favourites (' + favIds.length + ')';
  }

  /** Show the favourites view on demand — clears the query, which is what reveals it. */
  function showFavorites_() {
    q.value = '';
    navStack = [];
    currentView = { type: 'list' };
    lastList = null;        // otherwise Back would restore the previous search over the top
    lastListStatus = '';
    renderIdle_();
    window.scrollTo(0, 0);
  }

  function loadFavorites_() {
    google.script.run
      .withSuccessHandler(function (ids) {
        favIds = ids || [];
        syncFavChip_();
        if (!q.value.trim()) renderIdle_();   // show them as soon as they arrive
        rerenderIfPerson_();                  // and light the star on an open record
      })
      .withFailureHandler(function () { /* favourites are a convenience; never block search */ })
      .favoritesApi();
  }

  function toggleFav_(id, on) {
    if (favBusy) return;
    favBusy = true;
    // Optimistic: flip locally so the tap feels instant, then reconcile with the server's
    // authoritative list (which also tells us if the cap refused the add).
    if (on && !isFav_(id)) favIds.push(String(id));
    else if (!on) favIds = favIds.filter(function (x) { return x !== String(id); });
    syncFavChip_();
    rerenderIfPerson_();
    google.script.run
      .withSuccessHandler(function (res) {
        favBusy = false;
        favIds = res.ids || [];
        syncFavChip_();
        // Re-render BEFORE writing the status line: renderPerson and renderIdle_ both reset
        // statusEl, so setting the message first would have silently wiped it.
        rerenderIfPerson_();
        if (!q.value.trim()) renderIdle_();
        if (res.full) {
          statusEl.textContent = 'Favourites are full (' + favIds.length + ' of ' + favIds.length +
            ') — remove one before adding another.';
        }
      })
      .withFailureHandler(function (err) {
        favBusy = false;
        statusEl.textContent = 'Could not save that favourite: ' + err.message;
        loadFavorites_(); // resync rather than leave the optimistic flip lying
      })
      .favoriteToggleApi(String(id), !!on);
  }

  /* Full dataset, fetched ONCE at page load. Until it arrives, searches fall back to
     the server; after that every keystroke runs searchPeople() (SearchClient) locally —
     instant, no debounce, works from the first character. */
  var tabsData = null;
  var periodTimes = null;      // buildPeriodTimes() index, from the Period Times tab

  /* The two phone-heavy contact tabs feed only COLLAPSED sections, so they arrive in a second
     call once the page is already usable (Josh, 2026-09-06). `extrasState` is what keeps that
     honest: until the tabs land, those sections must read "Loading…" rather than "None on
     file" — the builders return {} for a missing tab, so without this a student with three
     pickup contacts would briefly be reported as having none. On failure we say so and offer
     a retry instead of silently claiming the lists are empty. */
  var extrasState = 'loading';   // 'loading' | 'ready' | 'failed'
  function loadExtras_() {
    extrasState = 'loading';
    google.script.run
      .withSuccessHandler(function (extra) {
        if (extra && extra.length && tabsData) tabsData = tabsData.concat(extra);
        extrasState = 'ready';
        rerenderIfPerson_();
      })
      .withFailureHandler(function () { extrasState = 'failed'; rerenderIfPerson_(); })
      .tabsExtrasApi();
  }

  google.script.run
    .withSuccessHandler(function (tabs) {
      tabsData = tabs;
      periodTimes = buildPeriodTimes(tabs);
      if (q.value.trim()) run(); // rerun whatever's typed through the instant engine
      else renderIdle_();        // favourites can only render once the dataset is here
      loadExtras_();             // only now — the first call owns the critical path
    })
    .withFailureHandler(function () { /* server-search fallback keeps working */ })
    .tabsApi();

  /* Today's bells + the school-time clock. Bells are authoritative on delay/exam days;
     if the hub is unreachable we fall back to the FACTS grid's normal-day times. */
  var bellToday = null;
  var clockSkewMs = 0;         // server(school) time - device time, so a wrong phone clock can't mislead

  /* Today's sign-in/out + dismissal overrides. Deliberately NOT part of the bundled dataset:
     both change during the day, and a record opened at 10:00 and read at 13:30 must not still
     claim a child is in the building. Small payload, refreshed on a timer. */
  var presenceData = null;
  function loadPresence_(then) {
    google.script.run
      .withSuccessHandler(function (p) { presenceData = p; if (then) then(); })
      .withFailureHandler(function () { presenceData = presenceData || { presence: {}, overrides: {} }; })
      .presenceApi();
  }
  loadFavorites_(); // small and independent of the dataset — fire it with presence
  loadPresence_(function () {
    rerenderIfPerson_();
    // an empty box means the favourites view is showing: refresh its status pills too
    if (q.value.trim()) run(); else renderIdle_();
  });
  // 2 minutes: matches the server-side cache, so this costs a call only when it can differ.
  setInterval(function () {
    loadPresence_(function () {
    rerenderIfPerson_();
    // an empty box means the favourites view is showing: refresh its status pills too
    if (q.value.trim()) run(); else renderIdle_();
  });
  }, 120000);

  /** Today's presence for one student, '' -> null. */
  function presenceFor_(id) {
    return (presenceData && presenceData.presence && presenceData.presence[id]) || null;
  }
  // ?sim=YYYY-MM-DD[ HH:MM] pins the clock AND pulls that date's bells, so the NOW highlight
  // can be exercised out of session (or replayed against a past delay day).
  var SIM = parseSimClock((new URLSearchParams(location.search).get('sim') || '').replace(/[^0-9:\- T]/g, '').slice(0, 16));
  google.script.run
    .withSuccessHandler(function (b) { bellToday = b; rerenderIfPerson_(); })
    .withFailureHandler(function () { bellToday = { ok: false, closed: false, periods: [] }; })
    [SIM ? 'bellForDateApi' : 'bellTodayApi'](SIM ? SIM.date : undefined);
  /* Today's games + the dismissal times coaches typed into the team calendars. Same posture as
     the bells: if it fails, athleticsData stays a harmless empty payload and the record simply
     lists no games — a missing dismissal must never read as "no game today". */
  /* PAUSED by default (Josh, 2026-09-07) until the athletics rosters are loaded into FACTS —
     Script Property ATHLETICS_ENABLED, flipped by RUN_enableAthletics in Config.gs with no
     redeploy. While paused the page makes NO call at all, so the 21 calendar fetches stop
     rather than running every 30 minutes to produce nothing. */
  var ATHLETICS_ON = true; // demo: always on (production gates this on ATHLETICS_ENABLED)
  var athleticsData = null;
  if (ATHLETICS_ON) {
    google.script.run
      .withSuccessHandler(function (a) { athleticsData = a; rerenderIfPerson_(); })
      .withFailureHandler(function () { athleticsData = { events: [], teams: [], ok: false }; })
      .athleticsApi(SIM ? SIM.date : undefined);
  }

  /** Today's games for one student, matched off their activity enrolments + gender. */
  function gamesFor_(d) {
    if (!ATHLETICS_ON || !athleticsData || !d) return [];
    var date = (SIM && SIM.date) || serverDate;
    if (!date) return [];
    return athleticsForStudent(d.activities || [], (d.profile || {}).gender,
      athleticsData.teams || [], athleticsData.events || [], date);
  }

  google.script.run
    .withSuccessHandler(function (n) {
      var parts = String(n.time || '').split(':');
      if (parts.length === 2) {
        var d = new Date();
        var serverMin = Number(parts[0]) * 60 + Number(parts[1]);
        var deviceMin = d.getHours() * 60 + d.getMinutes();
        clockSkewMs = (serverMin - deviceMin) * 60000;
      }
      serverDow = n.dayOfWeek || 0;
      serverDate = n.date || '';
      quarterRanges = parseQuarterRanges(n.quarterDates || '');
      rerenderIfPerson_();
    })
    .withFailureHandler(function () { /* device clock it is */ })
    .nowApi();
  var serverDow = 0;           // 1=Mon .. 7=Sun, from the server
  var serverDate = '';         // school-time YYYY-MM-DD
  var quarterRanges = [];      // configured quarter date ranges ([] = no filtering)

  /** School-time "now" as {dayCol 1..5 or '', nowMin} — or the simulated moment. */
  function schoolNow_() {
    if (SIM) return { dayCol: SIM.dayCol, nowMin: SIM.nowMin };
    var d = new Date(Date.now() + clockSkewMs);
    var dow = serverDow || ((d.getDay() + 6) % 7 + 1); // JS 0=Sun -> 1=Mon..7=Sun
    return { dayCol: dow >= 1 && dow <= 5 ? dow : '', nowMin: d.getHours() * 60 + d.getMinutes() };
  }

  function scheduleCtx_() {
    var t = schoolNow_();
    return {
      dayCol: t.dayCol,
      nowMin: t.nowMin,
      bells: bellToday && bellToday.ok ? bellSlotTimes(bellToday.periods) : {},
      closed: !!(bellToday && bellToday.closed) || !t.dayCol,
      // 0 when unconfigured or out of range -> no quarter filtering
      quarter: quarterForDate(quarterRanges, SIM ? SIM.date : serverDate)
    };
  }

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  // Highlight query tokens inside an ALREADY-ESCAPED string. cls: 'ex' green, 'cl' yellow.
  function highlight(escaped, tokens, cls) {
    var out = escaped;
    (tokens || []).forEach(function (t) {
      var safe = esc(t).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
      out = out.replace(new RegExp('(' + safe + ')', 'gi'),
        '<mark class="' + (cls || 'ex') + '">$1</mark>');
    });
    return out;
  }
  // Exact token hits in green, then close-spelling name words (whole words) in yellow.
  function nameHtml(name, tokens, fuzzyWords) {
    var out = highlight(esc(name), tokens, 'ex');
    (fuzzyWords || []).forEach(function (w) {
      var safe = esc(w).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
      out = out.replace(new RegExp('\\b(' + safe + ')\\b', 'gi'), '<mark class="cl">$1</mark>');
    });
    return out;
  }

  function dispGrade(g) { return String(g || '').replace(/^0/, ''); } // export pads: 07 → 7

  /**
   * The date attendance is judged against: the simulated day when time-travelling, else
   * school time from the server. Passing it explicitly means a stale `Attendance Today` tab
   * (15-minute job stopped) is ignored rather than shown as today's absences.
   */
  function attendanceDate_() {
    if (SIM) return SIM.date;
    return serverDate || '';
  }

  /**
   * Status pill. Driven by studentStatus(), which resolves attendance + today's sign-in/out
   * into ONE verdict — a sign-out beats a late arrival, an absence is never suppressed, and
   * an unknown reads as present (no pill) rather than inventing an absence.
   */
  function attTag_(a, st) {
    var s = st || (a && a.status ? { state: /absent/i.test(a.status) ? 'absent'
                                          : /late/i.test(a.status) ? 'late' : 'left',
                                     label: a.status } : null);
    if (!s) return '';
    var text = s.state === 'out' ? 'OUT' : s.state === 'back' ? 'BACK' : s.label.toUpperCase();
    return '<span class="att ' + s.state + '">' + esc(text) + '</span>';
  }

  /**
   * The empty-search screen. Shows the user's favourites WITH today's status, so opening the
   * app answers "is any of my five out today?" before anyone types anything — which is the
   * whole point of the feature. Falls back to the idle prompt when there are none.
   */
  var favPeople = [];
  function renderIdle_() {
    if (!favIds.length || !tabsData) {
      resultsEl.innerHTML = '';
      statusEl.textContent = IDLE_MSG;
      return;
    }
    var people = buildPeople(tabsData);
    var byId = {};
    people.forEach(function (p) { byId[p.id] = p; });
    var att = buildAttendance(tabsData, attendanceDate_());
    var pres = (presenceData || {}).presence || {};

    // Keep the user's own order, and silently drop an id that is no longer in the export
    // (a withdrawn student) rather than rendering a blank row.
    favPeople = favIds.map(function (id) { return byId[id]; }).filter(Boolean);

    if (!favPeople.length) {
      resultsEl.innerHTML = '';
      statusEl.textContent = IDLE_MSG;
      return;
    }

    var rows = favPeople.map(function (p, i) {
      var a = att[p.id] || null;
      var st = studentStatus(a, pres[p.id] || null);
      var meta = ['Grade ' + dispGrade(p.grade), p.homeroom, p.homeroomTeacher]
        .filter(function (x) { return x && x !== 'Grade '; }).join(' · ');
      return '<button class="person" data-fav="' + i + '">' +
        '<span class="pname">' + esc(p.name) + attTag_(a, st) + '</span>' +
        '<span class="pmeta">' + esc(meta) + '</span></button>';
    }).join('');

    resultsEl.innerHTML = '<div class="grouplabel">★ Favourites</div>' +
      '<div class="people">' + rows + '</div>';
    statusEl.textContent = IDLE_MSG;
    Array.prototype.forEach.call(resultsEl.querySelectorAll('[data-fav]'), function (btn) {
      btn.addEventListener('click', function () {
        openPerson(favPeople[Number(btn.getAttribute('data-fav'))]);
      });
    });
  }

  /* ---------- navigation trail ----------
     Every tap-through (list → class → student → …) pushes the view it came FROM,
     so Back walks the trail one step at a time instead of jumping to the results. */
  var navStack = [];
  var currentView = { type: 'list' };

  function navPush_(view) { navStack.push(currentView); currentView = view; }

  function backLabel_() {
    var d = navStack[navStack.length - 1];
    if (!d || d.type === 'list') return '‹ Back to results';
    return '‹ Back to ' + (d.type === 'class' ? (d.ref.description || d.ref.code) : d.ref.name);
  }

  function goBack() {
    var d = navStack.pop() || { type: 'list' };
    currentView = d;
    if (d.type === 'list') {
      if (lastList) { renderList(lastList); statusEl.innerHTML = lastListStatus; }
      else renderIdle_();
    }
    else if (d.type === 'person') openPerson(d.ref, false);
    else if (d.type === 'teacher') openTeacher(d.ref, false);
    else openClass(d.ref, false);
    window.scrollTo(0, 0);
  }

  function backButtonHtml_() { return '<button class="back" id="back">' + esc(backLabel_()) + '</button>'; }
  function bindBack_() { document.getElementById('back').addEventListener('click', goBack); }

  /* ---------- people list ---------- */
  function renderList(res) {
    lastList = res;
    navStack.length = 0;                 // a results render is the root of the tap trail
    currentView = { type: 'list' };
    var teachers = res.teachers || [];
    var classes = res.classes || [];
    if (!res.tokens.length) { resultsEl.innerHTML = ''; statusEl.textContent = ''; return; }
    if (!res.total && !teachers.length && !classes.length) {
      resultsEl.innerHTML = '';
      statusEl.textContent = 'No matches for “' + res.query + '”.';
      lastListStatus = statusEl.innerHTML;
      return;
    }
    // Counts read in the same order the groups render (Josh, 2026-09-16).
    var parts = [];
    if (res.total) parts.push(res.total + ' student' + (res.total === 1 ? '' : 's'));
    if (teachers.length) parts.push(teachers.length + ' teacher' + (teachers.length === 1 ? '' : 's'));
    if (classes.length) parts.push((res.classesTotal || classes.length) + ' class' + (res.classesTotal === 1 ? '' : 'es'));
    statusEl.textContent = parts.join(', ') +
      (res.hasClose ? ' (including similar spellings)' : '') +
      (res.truncated ? ' — showing ' + res.people.length + ' students, add another word to narrow down' : '') +
      '. Tap one for the full record.';
    lastListStatus = statusEl.innerHTML;

    var groupCount = (classes.length ? 1 : 0) + (teachers.length ? 1 : 0) + (res.total ? 1 : 0);
    var labels = groupCount > 1;
    var html = '';
    /* GROUP ORDER (Josh, 2026-09-16): Students, then Teachers, then Classes. A name
       search is overwhelmingly a search for a person, so the people come first. */
    if (res.total) {
      html += (labels ? '<div class="grouplabel">Students</div>' : '') +
        '<div class="people">' + res.people.map(function (p, i) {
          var meta = ['Grade ' + dispGrade(p.grade), p.homeroom, p.homeroomTeacher]
            .filter(function (x) { return x && x !== 'Grade '; }).join(' · ');
          if (p.via) meta = 'parent: ' + p.via + (meta ? ' · ' + meta : '');
          if (p.close) meta = (meta ? meta + ' · ' : '') + 'similar spelling';
          return '<button class="person" data-i="' + i + '">' +
            '<span class="pname">' + nameHtml(p.name, res.tokens, p.fuzzyWords) +
            attTag_(p.attendance, p.status) + '</span>' +
            '<span class="pmeta">' + esc(meta) + '</span></button>';
        }).join('') + '</div>';
    }
    if (teachers.length) {
      html += (labels ? '<div class="grouplabel">Teachers</div>' : '') +
        '<div class="people">' + teachers.map(function (t, i) {
          var meta = [t.department, t.level, t.grades ? 'Grades ' + t.grades : '']
            .filter(String).join(' · ') || 'Teacher';
          if (t.close) meta += ' · similar spelling';
          // What they're teaching RIGHT NOW, so the answer to "where is Mrs Duvall?" is in the
          // result list rather than one tap away (Josh, 2026-09-16).
          var teaching = teacherNowLabel_(t.id);
          if (teaching) meta = teaching + (meta ? ' · ' + meta : '');
          return '<button class="person" data-t="' + i + '">' +
            '<span class="pname">' + nameHtml(t.name, res.tokens, t.fuzzyWords) +
            ' <span class="tag">Teacher</span></span>' +
            '<span class="pmeta">' + esc(meta) + '</span></button>';
        }).join('') + '</div>';
    }
    if (classes.length) {
      html += (labels ? '<div class="grouplabel">Classes</div>' : '') +
        '<div class="people">' + classes.map(function (c, i) {
          var meta = [c.teacher, c.grades ? 'Grades ' + c.grades : '',
            c.students + ' student' + (c.students === 1 ? '' : 's')].filter(String).join(' · ');
          return '<button class="person" data-c="' + i + '">' +
            '<span class="pname">' + highlight(esc(c.description || c.code), res.tokens, 'ex') +
            ' <span class="tag">Class</span></span>' +
            '<span class="pmeta">' + esc(meta) + '</span></button>';
        }).join('') + '</div>';
    }
    resultsEl.innerHTML = html;
    Array.prototype.forEach.call(resultsEl.querySelectorAll('.person'), function (btn) {
      btn.addEventListener('click', function () {
        if (btn.hasAttribute('data-c')) openClass(classes[Number(btn.getAttribute('data-c'))]);
        else if (btn.hasAttribute('data-t')) openTeacher(teachers[Number(btn.getAttribute('data-t'))]);
        else openPerson(res.people[Number(btn.getAttribute('data-i'))]);
      });
    });
  }

  /* ---------- person detail ---------- */
  function openPerson(p, push) {
    if (push !== false) navPush_({ type: 'person', ref: p });
    if (tabsData) { reqSeq++; renderPerson(personDetail(tabsData, p.id, attendanceDate_(), (presenceData||{}).presence), p); return; }
    var seq = ++reqSeq;
    statusEl.textContent = 'Loading ' + p.name + '…';
    google.script.run
      .withSuccessHandler(function (d) { if (seq === reqSeq) renderPerson(d, p); })
      .withFailureHandler(function (err) {
        if (seq === reqSeq) statusEl.textContent = 'Error: ' + err.message;
      })
      .personApi(p.id);
  }

  function dlRow(label, value) {
    return value ? '<dt>' + esc(label) + '</dt><dd>' + esc(value) + '</dd>' : '';
  }

  /* ---------- collapsible sections ----------
     Records are getting long (schedule + guardians + emergency contacts + transportation),
     so each block is a <details>. Open/closed is remembered per section in localStorage —
     which also survives the 60s NOW re-render, since that rebuilds the DOM. */
  /* The key prefix is VERSIONED. A remembered choice beats the default, so changing the
     default order/open-state alone would leave anyone who had ever toggled a section — Josh
     included — looking at the old layout and reporting it as broken. Bumping the prefix
     retires the old remembered state once; from then on each staff member's own toggles
     persist again under the new prefix. Bump it whenever the defaults change meaningfully.
     sec2: = 2026-09-06, record reordered to Student / Schedule / Transportation first. */
  var SECTION_STORE = 'sec2:';

  function sectionOpen_(key, dflt) {
    try {
      var v = localStorage.getItem(SECTION_STORE + key);
      return v === null ? dflt : v === '1';
    } catch (e) { return dflt; } // private mode / storage blocked
  }

  function section_(key, titleHtml, smallHtml, bodyHtml, defaultOpen) {
    return '<details class="tab" data-sec="' + esc(key) + '"' + (sectionOpen_(key, defaultOpen) ? ' open' : '') + '>' +
      '<summary>' + titleHtml + (smallHtml ? ' <small>' + smallHtml + '</small>' : '') +
      '<span class="chev"></span></summary>' + bodyHtml + '</details>';
  }

  function bindSections_() {
    Array.prototype.forEach.call(resultsEl.querySelectorAll('details[data-sec]'), function (d) {
      d.addEventListener('toggle', function () {
        try { localStorage.setItem(SECTION_STORE + d.getAttribute('data-sec'), d.open ? '1' : '0'); } catch (e) {}
      });
    });
  }

  function renderPerson(d, p) {
    if (!d) { statusEl.textContent = 'No record found for ' + p.name + '.'; return; }
    lastPersonDetail = d;
    statusEl.textContent = '';
    var html = backButtonHtml_();

    // Today's attendance goes at the very top of the record and in the section header —
    // if a student isn't in the building, that outranks everything else on the page.
    var att = d.attendance;
    var st = studentStatus(att, d.presence);
    var attBar = '';
    if (st) {
      var acls = st.state === 'absent' ? '' : ' ' + st.state;
      attBar = '<div class="attbar' + acls + '"><b>' + esc(st.label) +
        (st.state === 'out' || st.state === 'back' ? '' : ' today') + '</b>' +
        (st.detail ? ' — ' + esc(st.detail) : '') + '</div>';
    }

    // A game today changes when this child leaves the building, which is the same question
    // attendance answers — so it sits at the top of the record, not buried in the activities
    // list. The dismissal is whatever the coach typed into the calendar; when they typed
    // nothing, say so rather than imply the student stays all day.
    var games = gamesFor_(d);
    // Only events that pull the child out of class earn a place at the top; the rest of the
    // team calendar (practices, home games) is after-school and changes nothing here.
    var leaving = games.filter(function (g) { return g.leavesEarly; });
    /* Josh, 2026-09-14: the sport and the dismissal time, nothing else. The earlier version
       carried departure, game time, venue and a leaving/left phrase — true, but it buried the
       one fact a teacher acts on. " PM" is dropped because every real dismissal is an
       afternoon one; a genuinely morning departure (Saturday tournaments do exist in the data)
       keeps its AM so "8:30 Dismissal" can never be misread. */
    var gameBar = leaving.map(function (g) {
      var when = g.dismiss || g.depart;
      return '<div class="attbar game"><b>' + esc(g.team) + '</b> · ' +
        esc(searchTimeLabel_(when).replace(/\s*PM$/, '')) + ' Dismissal</div>';
    }).join('');

    /* The classes this dismissal actually costs them. Earliest dismissal wins if a student
       somehow has two games today. */
    var dismissMin = leaving.length
      ? searchTimeToMin_(leaving[0].dismiss || leaving[0].depart) : -1;

    // Favourite toggle. Lives in the record body rather than the section header, because a
    // button inside a <summary> fights the collapse on every tap.
    var faved = isFav_(d.profile.id);
    var favRow = '<div class="hit favrow"><button class="favbtn' + (faved ? ' on' : '') +
      '" data-favtoggle="' + esc(d.profile.id) + '" data-on="' + (faved ? '0' : '1') + '">' +
      (faved ? '★ In your Favourites' : '☆ Add to Favourites') + '</button>' +
      (faved ? '<span class="assumed">shows on your home screen with today\'s status</span>' : '') +
      '</div>';

    html += section_('student', esc(d.profile.name) + attTag_(att, st), '— Student',
      attBar + gameBar + favRow + '<div class="hit"><dl>' +
      dlRow('Student ID', d.profile.id) +
      dlRow('Grade', dispGrade(d.profile.grade)) +
      dlRow('Locker', d.profile.locker) +
      dlRow('Homeroom', d.profile.homeroom) +
      dlRow('Homeroom Teacher', d.profile.homeroomTeacher) +
      dlRow('Student Email', d.profile.email) +
      dlRow('Status', d.profile.status) +
      dlRow('Gender', d.profile.gender) +
      '</dl></div>', true);

    /* SECTION ORDER (Josh, 2026-09-06): Student, Schedule, Transportation expanded, then
       Siblings, Authorised Pickup, Emergency Contacts collapsed. The first three answer
       "where is this child and how do they leave"; the collapsed three are phone-number
       heavy and only wanted once you're already looking for a person to call. */

    // today's schedule: period + room + real clock times, with the current class bolded
    var ctx = scheduleCtx_();
    // annotateSchedule tolerates a missing grid (no times resolve, nothing is "now"), and it
    // still orders the rows by period — so it handles the not-yet-loaded case too. A separate
    // fallback here would be a second code path that quietly ordered the schedule differently.
    var sched = annotateSchedule(d.classes, periodTimes, ctx);
    var anyTimes = sched.some(function (c) { return c.beginLabel; });

    html += section_('schedule', 'Schedule', '(' + d.classes.length + ')',
      dayBarHtml_(sched, ctx, anyTimes, d.profile.grade) +
      (sched.length ? sched.map(function (c, i) {
        var meta = [c.period, c.room ? 'Room ' + c.room : '', c.teacher, c.quarters, c.category]
          .filter(String).join(' · ');
        var time = c.offQuarter ? 'not this quarter'
          : c.beginLabel ? (c.beginLabel + (c.endLabel ? '–' + c.endLabel : ''))
          : (anyTimes && c.period ? 'not today' : '');
        return '<button class="cls' + (c.current ? ' now' : (anyTimes && !c.meetsToday ? ' off' : '')) +
          (isMissedForGame(c, dismissMin) ? ' missed' : '') +
          '" data-cl="' + i + '">' +
          (time ? '<span class="clstime">' + esc(time) + '</span>' : '') +
          esc(c.description || c.code) +
          (c.current ? '<span class="nowtag">' + (c.sharedSlot ? 'NOW?' : 'NOW') + '</span>' : '') +
          '<div class="t">' + esc(meta) + '</div></button>';
      }).join('') : '<div class="hit">No classes on file.</div>'), true);

    // How the child gets home. `assumed` means the producer defaulted them to Car as the
    // residual rather than recording it — say so, don't present a guess as fact. An override
    // is TODAY's truth and replaces the standing assignment.
    var tr = d.transportation;
    var ov = (presenceData && presenceData.overrides) ? presenceData.overrides[d.profile.id] : null;
    if (tr || ov) {
      var trBody = '';
      if (ov) {
        trBody += '<div class="attbar late"><b>' + esc(ov.type || 'Changed') + ' today</b>' +
          (ov.destination ? ' — ' + esc(ov.destination) : '') +
          (ov.note ? ' · ' + esc(ov.note) : '') +
          (ov.by ? ' <span class="assumed">(' + esc(ov.by) + ')</span>' : '') + '</div>';
      }
      trBody += '<div class="hit"><dl>' +
        (tr ? dlRow('Normally', tr.type + (tr.assumed ? ' (assumed — not recorded)' : '')) : '') +
        (tr ? dlRow('Route', [tr.routeCode, tr.routeName].filter(String).join(' — ')) : '') +
        (tr ? dlRow('Vehicle', tr.vehicle) : '') +
        (tr ? dlRow('Pickup point', tr.pickup) : '') +
        (tr ? dlRow('Building', tr.building) : '') +
        (tr ? dlRow('Walk to', tr.walkTo) : '') +
        (tr ? dlRow('Note', tr.note) : '') +
        '</dl></div>';
      if (tr && tr.extra && tr.extra.length) {
        trBody += '<div class="hit"><b>Also rides:</b> ' +
          tr.extra.map(function (x) {
            return esc([x.routeCode, x.routeName].filter(String).join(' — ') || x.type);
          }).join(', ') + ' <span class="assumed">(split custody)</span></div>';
      }
      html += section_('transport', 'Transportation',
        esc(ov ? (ov.type || 'changed today') : (tr ? tr.type : '')), trBody, true);
    }

    html += section_('guardians', 'Parents / Guardians', '(' + d.guardians.length + ')',
      (d.guardians.length ? d.guardians.map(function (g) {
        return '<div class="hit"><dl>' +
          dlRow('Name', g.name) +
          g.emails.map(function (e, i) { return dlRow(i ? 'Email ' + (i + 1) : 'Email', e); }).join('') +
          '</dl></div>';
      }).join('') : '<div class="hit">None on file.</div>'), true);

    // Other enrolled children in the same family (FACTS Family ID), tappable.
    var sibs = d.siblings || [];
    if (sibs.length) {
      html += section_('siblings', 'Siblings', '(' + sibs.length + ')',
        sibs.map(function (s, i) {
          return '<button class="person" data-sib="' + i + '">' +
            '<span class="pname">' + esc(s.name) + '</span>' +
            '<span class="pmeta">tap for their record</span></button>';
        }).join(''), false);
    }

    /* The two deferred sections. `emptyMsg` is only ever shown once the contact tabs have
       actually arrived — while they are in flight the builders legitimately return nothing,
       and reporting that as "none on file" would be a confident lie about a child's
       emergency contacts. Count stays '…' for the same reason: '(0)' asserts a fact. */
    function deferredSection_(key, title, rows, rowHtml, emptyMsg) {
      // Rows win over state: on the server fallback path (personApi, used before the bundle
      // lands) the record already carries these contacts, and hiding real data behind a
      // "Loading…" that will never resolve would be worse than the empty-list problem.
      if (rows.length) {
        return section_(key, title, '(' + rows.length + ')', rows.map(rowHtml).join(''), false);
      }
      if (extrasState === 'loading') {
        return section_(key, title, '…', '<div class="hit assumed">Loading…</div>', false);
      }
      if (extrasState === 'failed') {
        return section_(key, title, '',
          '<div class="hit">Could not load — <a href="#" data-retry="1">try again</a>.</div>', false);
      }
      return section_(key, title, '(0)', '<div class="hit">' + emptyMsg + '</div>', false);
    }

    // Who may COLLECT the child — distinct from guardians and from the emergency call list.
    html += deferredSection_('pickups', 'Authorised Pickup', d.pickups || [], function (c) {
      return '<div class="hit"><dl>' +
        dlRow('Name', c.name + (c.relationship ? ' — ' + c.relationship : '')) +
        dlRow('Cell', c.cell) + dlRow('Home', c.home) + dlRow('Work', c.work) +
        dlRow('Email', c.email) + '</dl></div>';
    }, 'No pickup contacts recorded in FACTS for this student.');

    // Emergency call list — a separate FACTS list from the guardians above. Collapsed by
    // default: it carries phone numbers and most lookups don't need it.
    html += deferredSection_('emergency', 'Emergency Contacts', d.emergency || [], function (c) {
      return '<div class="hit"><dl>' +
        dlRow('Name', c.name + (c.relationship ? ' — ' + c.relationship : '')) +
        dlRow('Cell', c.cell) +
        dlRow('Home', c.home) +
        dlRow('Work', c.work) +
        dlRow('Email', c.email) +
        dlRow('Note', c.note) +
        '</dl></div>';
    }, 'None on file in FACTS.');

    // Teams and clubs, kept out of the period-by-period schedule above. Most carry no
    // period in FACTS (they meet after school), so they'd otherwise clutter it as "not today".
    var acts = d.activities || [];
    // Which of today's games belongs to which enrolment, so the row that has a game says so.
    var gameByTeam = {};
    leaving.forEach(function (g) { gameByTeam[g.teamId] = g; });
    html += section_('activities', 'Sports &amp; Activities', '(' + acts.length + ')',
      (acts.length ? acts.map(function (c, i) {
        var meta = [/athletic/i.test(c.dept || '') ? 'Athletics' : (c.dept || 'Activity'),
          c.teacher, c.period, c.room ? 'Room ' + c.room : '', c.quarters]
          .filter(String).join(' · ');
        var g = null;
        if (athleticsData) {
          athleticsMatchTeams(c, d.profile.gender, athleticsData.teams || [])
            .forEach(function (t) { g = g || gameByTeam[t.id]; });
        }
        var tag = g
          ? '<span class="nowtag">' + esc(searchTimeLabel_(g.dismiss || g.depart)) + '</span>'
          : '';
        return '<button class="cls' + (g ? ' now' : '') + '" data-act="' + i + '">' +
          esc(c.description || c.code) + tag +
          '<div class="t">' + esc(meta) + '</div></button>';
      }).join('')
        : '<div class="hit">Not on a team or club roster in FACTS.</div>'), false);

    resultsEl.innerHTML = html;
    bindBack_();
    bindSections_();
    Array.prototype.forEach.call(resultsEl.querySelectorAll('[data-favtoggle]'), function (btn) {
      btn.addEventListener('click', function () {
        toggleFav_(btn.getAttribute('data-favtoggle'), btn.getAttribute('data-on') === '1');
      });
    });
    // Retry link shown on a deferred section whose background fetch failed.
    Array.prototype.forEach.call(resultsEl.querySelectorAll('[data-retry]'), function (a) {
      a.addEventListener('click', function (ev) { ev.preventDefault(); loadExtras_(); });
    });
    Array.prototype.forEach.call(resultsEl.querySelectorAll('[data-cl]'), function (btn) {
      btn.addEventListener('click', function () {
        openClass(sched[Number(btn.getAttribute('data-cl'))]);
      });
    });
    Array.prototype.forEach.call(resultsEl.querySelectorAll('[data-act]'), function (btn) {
      btn.addEventListener('click', function () {
        openClass(acts[Number(btn.getAttribute('data-act'))]);
      });
    });
    Array.prototype.forEach.call(resultsEl.querySelectorAll('[data-sib]'), function (btn) {
      btn.addEventListener('click', function () {
        openPerson(sibs[Number(btn.getAttribute('data-sib'))]); // {id, name} is all openPerson needs
      });
    });
    window.scrollTo(0, 0);
  }

  /** The line above a schedule explaining what today is and where the times came from. */
  function dayBarHtml_(sched, ctx, anyTimes, grade) {
    var simNote = SIM ? '<div class="daybar warn"><b>SIMULATED TIME</b> — ' + esc(SIM.label) +
      ' (' + (ctx.dayCol ? ['', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday'][ctx.dayCol] : 'weekend') +
      '). Remove <code>?sim=</code> from the URL for real time.</div>' : '';
    if (!anyTimes) {
      // Distinguish the two very different reasons for "no times" instead of blaming elementary
      // for what may be a broken join (that mislabelling shipped in @17 and confused a 12th grader).
      var hasPatterns = sched.some(function (c) { return c.pattern; });
      if (!hasPatterns) {
        return simNote + '<div class="daybar">No periods scheduled for these classes — FACTS ' +
          'assigns class periods for grades 7-12 only.</div>';
      }
      return simNote + '<div class="daybar warn">These classes have periods (' +
        esc(sched.filter(function (c) { return c.period; }).map(function (c) { return c.period; })
          .slice(0, 4).join(', ')) + '…) but the <b>Period Times</b> reference didn’t match — ' +
        'times unavailable. Tell IT: run RUN_diagnosePeriods.</div>';
    }
    if (!ctx.dayCol) return simNote + '<div class="daybar">Weekend — showing each class’s usual weekday time.</div>';
    var live = sched.filter(function (c) { return c.current; });
    var cur = live[0];
    // Two classes can share a slot for DIFFERENT reasons: semester-split (different Q labels,
    // e.g. Health Q3,4 vs PE Q1,2) or a part-week class sitting on a daily one (Concert Band
    // Mon/Wed/Fri over a daily Study Hall). Say which, rather than asserting semester-split.
    function daysPerWeek_(c) {
      var byDay = periodTimes && c.pattern ? periodTimes.byPattern[String(c.pattern)] : null;
      return byDay ? Object.keys(byDay).length : 0;
    }
    var qs = live.map(function (c) { return String(c.quarters || ''); });
    var mixedQuarters = qs.some(function (q) { return q !== qs[0]; });
    /* When none of THEIR classes is in session, name where the school day actually is instead
       of reporting an absence of one. "no class in session at this time" at 11:50 reads as
       though something is wrong; the honest answer — they're at lunch — was already sitting in
       the Period Times grid (Josh, 2026-09-14). Lunch is grade-banded, so schoolDayBlock picks
       the band that matches this student rather than whichever lunch happens to be running. */
    var curPhrase = !cur ? (function () {
      var blk = schoolDayBlock(periodTimes, ctx, grade);
      if (!blk) return 'no class in session right now';
      if (blk.state === 'block') {
        return 'at <b>' + esc(blk.label) + '</b>' +
          (blk.end ? ' until ' + esc(searchTimeLabel_(blk.end)) : '');
      }
      if (blk.state === 'before') return 'before the school day starts';
      if (blk.state === 'after') return 'after the school day ends';
      return 'between classes';
    })()
      : live.length === 1 ? 'in <b>' + esc(cur.description || cur.code) + '</b> now'
      : live.length + ' classes share this period — <b>' +
        live.map(function (c) {
          var d = daysPerWeek_(c);
          return esc(c.description || c.code) + (d && d < 5 ? ' (' + d + ' days/wk)' : '');
        }).join('</b> or <b>') + '</b>' +
        (mixedQuarters ? ' — semester-split, compare the Q labels' : '');
    if (bellToday && bellToday.closed) {
      // Either a real holiday or a date the bell calendar has no entry for — indistinguishable
      // from here, so say what we know and still highlight off the normal schedule.
      return simNote + '<div class="daybar warn"><b>' + esc(bellToday.mode || 'No school') +
        '</b> per the bell calendar, so no bell times for this date — highlight uses the normal ' +
        'schedule · ' + curPhrase + '</div>';
    }
    var usingBells = sched.some(function (c) { return c.timeSource === 'bell'; });
    var mode = bellToday && bellToday.ok ? (bellToday.mode || '') : '';
    var abnormal = mode && !/^normal/i.test(mode);
    var bits = [];
    if (mode) bits.push('<b>' + esc(mode) + '</b>');
    bits.push(curPhrase);
    if (abnormal && !usingBells) {
      bits.push('bell times unavailable for these periods — showing the normal schedule');
    }
    return simNote + '<div class="daybar' + (abnormal ? ' warn' : '') + '">' + bits.join(' · ') + '</div>';
  }

  /** Re-render an open student so the NOW highlight follows the clock. */
  function rerenderIfPerson_() {
    if (currentView.type === 'person' && lastPersonDetail) {
      var scrollY = window.scrollY;
      /* REBUILD from the current dataset, don't just re-render the cached object. The deferred
         contact tabs — and a fresher presence fold — arrive AFTER the record was first built,
         so re-rendering what was computed at open time would leave Authorised Pickup and
         Emergency Contacts permanently empty once they finally loaded. */
      var d = lastPersonDetail;
      if (tabsData) {
        var fresh = personDetail(tabsData, d.profile.id, attendanceDate_(), (presenceData || {}).presence);
        if (fresh) d = fresh;
      }
      renderPerson(d, currentView.ref);
      window.scrollTo(0, scrollY);
    }
  }
  setInterval(rerenderIfPerson_, 60000);

  /* ---------- teacher detail ---------- */
  function openTeacher(t, push) {
    if (push !== false) navPush_({ type: 'teacher', ref: t });
    if (tabsData) { reqSeq++; renderTeacher(teacherDetail(tabsData, t.id), t); return; }
    var seq = ++reqSeq;
    statusEl.textContent = 'Loading ' + t.name + '…';
    google.script.run
      .withSuccessHandler(function (d) { if (seq === reqSeq) renderTeacher(d, t); })
      .withFailureHandler(function (err) {
        if (seq === reqSeq) statusEl.textContent = 'Error: ' + err.message;
      })
      .teacherApi(t.id);
  }

  /**
   * "Now: Physics" for one teacher, or '' when nothing of theirs is in session.
   * Same engine the student schedule uses — annotateSchedule over the Period Times grid with
   * today's bells — so a delay day, the Friday reversal and quarter filtering all apply here
   * too, rather than being reimplemented for teachers.
   */
  function teacherNowLabel_(id) {
    if (!tabsData || !periodTimes) return '';
    var d = teacherDetail(tabsData, id);
    if (!d || !d.classes.length) return '';
    var live = annotateSchedule(d.classes, periodTimes, scheduleCtx_())
      .filter(function (c) { return c.current; });
    if (!live.length) return '';
    // Two classes can legitimately share a slot (semester-split); name the first and say so
    // rather than silently picking one.
    return 'Now: ' + (live[0].description || live[0].code) +
      (live.length > 1 ? ' (+' + (live.length - 1) + ' sharing this period)' : '');
  }

  function renderTeacher(d, t) {
    if (!d) { statusEl.textContent = 'No record found for ' + t.name + '.'; return; }
    statusEl.textContent = '';
    var p = d.profile;
    var html = backButtonHtml_();

    html += section_('teacher', esc(p.name), '— Teacher',
      '<div class="hit"><dl>' +
      dlRow('Department', p.department) +
      dlRow('Level', p.level) +
      dlRow('Grades', p.grades) +
      dlRow('Homerooms', p.homerooms) +
      dlRow('Core', p.core) +
      dlRow('Specials', p.specials) +
      dlRow('Fine-Arts Electives', p.fineArts) +
      dlRow('Athletics', p.athletics) +
      dlRow('ELC', p.elc) +
      dlRow('Active', p.active) +
      '</dl></div>', true);

    /* A teacher's classes get the SAME treatment as a student's: today's clock times, in
       school-day order, with the one in session bolded (Josh, 2026-09-16). Reuses
       annotateSchedule rather than a second ordering rule, so the Friday reversal, delay-day
       bells and quarter filtering behave identically on both pages. */
    var tctx = scheduleCtx_();
    var tsched = annotateSchedule(d.classes, periodTimes, tctx);
    var tAnyTimes = tsched.some(function (c) { return c.beginLabel; });
    // annotateSchedule returns its OWN row shape and drops `students`; carry it back by key.
    var tCount = {};
    d.classes.forEach(function (c) { tCount[c.key] = c.students; });

    html += section_('teacherClasses', 'Classes', '(' + d.classes.length + ')',
      dayBarHtml_(tsched, tctx, tAnyTimes, '') +
      (tsched.length ? tsched.map(function (c, i) {
        var time = c.offQuarter ? 'not this quarter'
          : c.beginLabel ? (c.beginLabel + (c.endLabel ? '–' + c.endLabel : ''))
            : (tAnyTimes && c.period ? 'not today' : '');
        return '<button class="cls' + (c.current ? ' now' : (tAnyTimes && !c.meetsToday ? ' off' : '')) +
          '" data-cl="' + i + '">' +
          (time ? '<span class="clstime">' + esc(time) + '</span>' : '') +
          esc(c.description || c.code) +
          (c.current ? '<span class="nowtag">' + (c.sharedSlot ? 'NOW?' : 'NOW') + '</span>' : '') +
          '<div class="t">' + esc([c.period, c.room ? 'Room ' + c.room : '',
            tCount[c.key] + ' student' + (tCount[c.key] === 1 ? '' : 's'),
            c.quarters, c.category].filter(String).join(' · ')) + '</div></button>';
      }).join('') : '<div class="hit">No classes on the schedule tab.</div>'), true);

    resultsEl.innerHTML = html;
    bindBack_();
    bindSections_();
    Array.prototype.forEach.call(resultsEl.querySelectorAll('[data-cl]'), function (btn) {
      btn.addEventListener('click', function () {
        // tsched, not d.classes — annotateSchedule reorders into school-day order, so the
        // index would otherwise open the wrong class.
        openClass(tsched[Number(btn.getAttribute('data-cl'))]);
      });
    });
    window.scrollTo(0, 0);
  }

  /* ---------- class detail: instructor first, class info, then the roster ---------- */
  function openClass(c, push) {
    if (push !== false) navPush_({ type: 'class', ref: c });
    if (tabsData) { reqSeq++; renderClass(classDetail(tabsData, c.key), c); return; }
    var seq = ++reqSeq;
    statusEl.textContent = 'Loading ' + (c.description || c.code) + '…';
    google.script.run
      .withSuccessHandler(function (d) { if (seq === reqSeq) renderClass(d, c); })
      .withFailureHandler(function (err) {
        if (seq === reqSeq) statusEl.textContent = 'Error: ' + err.message;
      })
      .classApi(c.key);
  }

  function renderClass(d, c) {
    if (!d) { statusEl.textContent = 'No record found for ' + (c.description || c.code) + '.'; return; }
    statusEl.textContent = '';
    var p = d.profile;
    var html = backButtonHtml_();

    html += section_('classInstructors', 'Instructor' + (d.instructors.length > 1 ? 's' : ''), '',
      (d.instructors.length ? d.instructors.map(function (t, i) {
        if (!t.id) return '<div class="hit">' + esc(t.name) + '</div>';
        var meta = [t.department, t.level, t.grades ? 'Grades ' + t.grades : '']
          .filter(String).join(' · ') || 'tap for profile';
        return '<button class="person" data-t="' + i + '">' +
          '<span class="pname">' + esc(t.name) + ' <span class="tag">Teacher</span></span>' +
          '<span class="pmeta">' + esc(meta) + '</span></button>';
      }).join('') : '<div class="hit">None on file.</div>'), true);

    html += section_('classInfo', esc(p.description || p.code), '— Class',
      '<div class="hit"><dl>' +
      dlRow('Class Code', p.code) +
      dlRow('Period', p.period) +
      dlRow('Room', p.room) +
      dlRow('Category', p.category) +
      dlRow('Grades', p.grades) +
      dlRow('Quarters', p.quarters) +
      dlRow('Students', String(p.students)) +
      '</dl></div>', true);

    html += section_('classRoster', 'Students', '(' + d.students.length + ')',
      (d.students.length ? d.students.map(function (s, i) {
        var meta = ['Grade ' + dispGrade(s.grade), s.homeroom, s.homeroomTeacher]
          .filter(function (x) { return x && x !== 'Grade '; }).join(' · ');
        return '<button class="person" data-s="' + i + '">' +
          '<span class="pname">' + esc(s.name) + '</span>' +
          '<span class="pmeta">' + esc(meta) + '</span></button>';
      }).join('') : '<div class="hit">No students on file.</div>'), true);

    resultsEl.innerHTML = html;
    bindBack_();
    bindSections_();
    Array.prototype.forEach.call(resultsEl.querySelectorAll('.person'), function (btn) {
      btn.addEventListener('click', function () {
        if (btn.hasAttribute('data-t')) openTeacher(d.instructors[Number(btn.getAttribute('data-t'))]);
        else openPerson(d.students[Number(btn.getAttribute('data-s'))]);
      });
    });
    window.scrollTo(0, 0);
  }

  /* ---------- search plumbing ---------- */
  function run() {
    var query = q.value.trim();
    if (tabsData) {
      reqSeq++; // cancel any in-flight server render
      if (!query) { renderIdle_(); return; }
      renderList(searchPeople(tabsData, query, { today: attendanceDate_(), presence: (presenceData||{}).presence }));
      return;
    }
    if (query.length < 2) return; // server fallback keeps the old floor
    var seq = ++reqSeq;
    statusEl.textContent = 'Searching…';
    google.script.run
      .withSuccessHandler(function (res) { if (seq === reqSeq) renderList(res); })
      .withFailureHandler(function (err) {
        if (seq === reqSeq) statusEl.textContent = 'Error: ' + err.message;
      })
      .searchApi(query);
  }
  function runNow() { clearTimeout(debounceTimer); run(); }

  // every keystroke searches: instantly once the local dataset is in, debounced
  // server call for the few seconds before that
  q.addEventListener('input', function () {
    clearTimeout(debounceTimer);
    if (tabsData) { run(); return; }
    debounceTimer = setTimeout(run, 300);
  });
  go.addEventListener('click', runNow);
  (function () {
    var fv = document.getElementById('favview');
    if (fv) fv.addEventListener('click', showFavorites_);
  })();
  q.addEventListener('keydown', function (e) { if (e.key === 'Enter') runNow(); });

  /* ---------- deep link (?id=…&n=…) ----------
     Campus Presence's muster roster links straight to a student's record, so a
     front-office question ('where is Noah May right now?') lands on the answer
     instead of a search box. openPerson falls back to the personApi server call
     because tabsData is still loading at this point; push=false keeps the entry
     out of the back stack, so Back returns to an empty search rather than here. */
  var DEEP_ID = (new URLSearchParams(location.search).get('id') || '').replace(/[^0-9A-Za-z._-]/g, '').slice(0, 32);
  var DEEP_NAME = (new URLSearchParams(location.search).get('n') || '').replace(/[^A-Za-z ,.'\-]/g, '').slice(0, 60);
  if (DEEP_ID) {
    openPerson({ id: DEEP_ID, name: DEEP_NAME || 'that student' }, false);
  }
</script>
</body>
