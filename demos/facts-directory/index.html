<!DOCTYPE html>
<html>
<head>
<base target="_top">
<style>
  /* Varsity theme (V6, chosen 2026-07-24): HCS red page, white cards, gold accents.
     ONE theme in all modes: `only light` is the hard opt-out that stops Chrome Auto Dark
     from reinterpreting the palette (it was inverting red/cream to greens and breaking
     input contrast). Every color is explicit — nothing left for the browser to guess. */
  :root {
    color-scheme: only light;
    --red: #8E1420; --red-deep: #6d0f18; --gold: #F2B705; --gold-ink: #3a2a00;
    --page: #8E1420; --title: #fff; --who: #e9c2c7; --status: #f0d3d7;
    /* NOTE: avoid warm-light backgrounds (cream/ivory) anywhere — forced dark mode
       (Chrome Auto Dark inside the GAS wrapper frame, immune to color-scheme opt-outs)
       darkens them into ugly olive. Dark saturated colors like the red pass through. */
    --card: #fff; --card-border: #6d0f18; --line: #e5e7eb;
    --tabhead-bg: #8E1420; --tabhead-fg: #fff;
    --dt: #6b7280; --dd: #1f2430;
    --input-bg: #fff; --input-ink: #1f2430; --input-border: #6d0f18;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { font-family: -apple-system, "Segoe UI", Roboto, sans-serif; color: var(--dd);
         background: var(--page); margin: 0; padding: 1rem; min-height: 100dvh;
         overscroll-behavior-y: contain; touch-action: manipulation; }
  .wrap { max-width: 56rem; margin: 0 auto; }
  /* sticky search area (house pattern: sticky top bar) — stays put while scrolling results */
  .top { position: sticky; top: 0; z-index: 10; background: var(--page);
         margin: -1rem -1rem 0; padding: 1rem 1rem .75rem; }
  header { display: flex; align-items: baseline; justify-content: space-between; gap: 1rem;
           flex-wrap: wrap; margin: 0 0 .8rem; }
  h1 { font-size: 1.2rem; margin: 0; color: var(--title); font-weight: 700; }
  h1 b { color: var(--gold); }
  .who { color: var(--who); font-size: .8rem; }
  .searchbar { display: flex; gap: .5rem; }
  /* the way IN to the favourites view — a chip under the search bar, gold so it reads as
     "yours". 44px tall per the house touch rule. */
  .favview { margin: .6rem 0 0; min-height: 44px; padding: .4rem .9rem; font-size: .85rem;
             background: var(--gold); color: var(--gold-ink); border-radius: 1.4rem; }
  .favview[hidden] { display: none; }
  /* inputs >= 16px so iOS doesn't zoom on focus; tap targets >= 44px (HCS house rules) */
  #q { flex: 1; font-size: 1.05rem; min-height: 44px; padding: .6rem .8rem;
       border: 1px solid var(--input-border); border-radius: .5rem;
       background: var(--input-bg); color: var(--input-ink); caret-color: var(--gold); }
  #q::placeholder { color: var(--dt); opacity: 1; }
  #q:focus { outline: 2px solid var(--gold); border-color: transparent; }
  button { font-size: 1rem; min-height: 44px; padding: .6rem 1.1rem; border: 0;
           border-radius: .5rem; background: var(--gold); color: var(--gold-ink);
           font-weight: 600; cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  .status { color: var(--status); font-size: .85rem; margin: .8rem 0; min-height: 1.2em; }

  /* person list */
  .people { background: var(--card); border: 1px solid var(--card-border); border-radius: .6rem;
            overflow: hidden; }
  .person { display: flex; align-items: center; justify-content: space-between; gap: .8rem;
            width: 100%; text-align: left; background: none; border: 0; cursor: pointer;
            min-height: 52px; padding: .55rem .9rem; border-bottom: 1px solid var(--line);
            border-radius: 0; color: var(--dd); font-weight: 400; font-size: 1rem; }
  .person:last-child { border-bottom: 0; }
  .person:hover, .person:focus-visible { background: #FBECEE; }
  .pname { font-weight: 600; }
  .pmeta { color: var(--dt); font-size: .78rem; white-space: nowrap; }
  .tag { background: var(--gold); color: var(--gold-ink); font-size: .62rem; font-weight: 700;
         padding: .1em .45em; border-radius: .6em; vertical-align: middle; }
  .grouplabel { color: #f0d3d7; font-size: .75rem; font-weight: 700; text-transform: uppercase;
                letter-spacing: .06em; margin: .9rem 0 .35rem; }
  .grouplabel:first-child { margin-top: 0; }
  mark { background: var(--gold); color: var(--gold-ink); padding: 0 .1em; border-radius: .15em; }
  mark.ex { background: #8FE39B; color: #0d3a17; } /* green = exact name match */
  mark.cl { background: var(--gold); color: var(--gold-ink); } /* yellow = close spelling */

  /* person detail */
  /* min-height 44px per HCS touch rule — was 0, a ~20px tap target on phones */
  .back { display: flex; align-items: center; background: none; border: 0; color: #fff;
          font-size: .9rem; font-weight: 600; padding: 0 .6rem .4rem 0; min-height: 44px;
          cursor: pointer; }
  .tab { background: var(--card); border: 1px solid var(--card-border); border-radius: .6rem;
         margin: 0 0 1rem; overflow: hidden; }
  .tab > h2 { font-size: .9rem; margin: 0; padding: .55rem .9rem; background: var(--tabhead-bg);
              color: var(--tabhead-fg); border-bottom: 1px solid var(--line); }
  .tab > h2 small { color: #f0d3d7; font-weight: normal; }
  /* collapsible sections: native <details> so it works without JS and stays keyboard-accessible */
  details.tab > summary { font-size: .9rem; font-weight: 700; margin: 0; padding: .55rem .9rem;
                          background: var(--tabhead-bg); color: var(--tabhead-fg);
                          border-bottom: 1px solid var(--line); cursor: pointer;
                          min-height: 44px; display: flex; align-items: center; gap: .4rem;
                          list-style: none; -webkit-tap-highlight-color: transparent; }
  details.tab > summary::-webkit-details-marker { display: none; } /* iOS/Safari default triangle */
  details.tab > summary::marker { content: ''; }
  details.tab > summary small { color: #f0d3d7; font-weight: normal; }
  details.tab > summary:focus-visible { outline: 2px solid var(--gold); outline-offset: -2px; }
  details.tab > summary .chev { margin-left: auto; transition: transform .15s;
                                border: solid #f0d3d7; border-width: 0 2px 2px 0;
                                padding: 3px; transform: rotate(45deg); flex: none; }
  details.tab[open] > summary .chev { transform: rotate(-135deg); }
  details.tab:not([open]) > summary { border-bottom: 0; }
  @media (prefers-reduced-motion: reduce) { details.tab > summary .chev { transition: none; } }
  .hit { padding: .6rem .9rem; border-bottom: 1px solid var(--line); }
  .hit:last-child { border-bottom: 0; }
  .hit dl { display: grid; grid-template-columns: auto 1fr; gap: .1rem .8rem; margin: 0; }
  .hit dt { color: var(--dt); font-size: .75rem; white-space: nowrap; padding-top: .12rem; }
  .hit dd { margin: 0; font-size: .9rem; color: var(--dd); word-break: break-word; }
  /* schedule rows: the class happening RIGHT NOW is bold with a gold rail */
  .cls.now { font-weight: 700; background: #FFF8E1; box-shadow: inset 3px 0 0 var(--gold); }
  .cls.now .t { color: #6b5400; font-weight: 600; }
  .cls.off { opacity: .62; } /* doesn't meet today */
  /* A class cut short, or missed entirely, by today's game dismissal. */
  .cls.missed { background: #FDECEA; box-shadow: inset 0 0 0 2px #C62828; }
  .cls.missed .t { color: #7f1d1d; }
  .cls.now.missed { box-shadow: inset 0 0 0 2px #C62828, inset 3px 0 0 var(--gold); }
  .nowtag { background: #8FE39B; color: #0d3a17; font-size: .62rem; font-weight: 700;
            padding: .1em .45em; border-radius: .6em; vertical-align: middle; margin-left: .35rem; }
  /* today's attendance — deliberately loud, it changes where a student physically is */
  .att { font-size: .62rem; font-weight: 700; padding: .12em .5em; border-radius: .6em;
         vertical-align: middle; margin-left: .35rem; white-space: nowrap; }
  .att.absent { background: #C62828; color: #fff; }
  .att.late { background: var(--gold); color: var(--gold-ink); }
  .att.left { background: #6b7280; color: #fff; }
  .att.out { background: #6d28d9; color: #fff; }   /* signed out — not in the building */
  .att.back { background: #0e7490; color: #fff; }  /* signed out and came back */
  .attbar.out { background: #F3EEFF; color: #4c1d95; }
  .attbar.back { background: #ECFEFF; color: #155e75; }
  .assumed { color: var(--dt); font-style: italic; }
  /* favourites: a quiet outline button, gold once set. 44px tap target per the house rule. */
  .favrow { display: flex; align-items: center; gap: .6rem; flex-wrap: wrap; }
  .favbtn { background: none; border: 1px solid var(--input-border); color: var(--red);
            font-size: .85rem; font-weight: 600; min-height: 44px; padding: .4rem .8rem; }
  .favbtn.on { background: var(--gold); color: var(--gold-ink); border-color: var(--gold); }
  .favrow .assumed { font-size: .75rem; }
  .attbar { padding: .5rem .9rem; font-size: .85rem; background: #FDECEA;
            border-bottom: 1px solid var(--line); color: #7f1d1d; }
  .attbar.late { background: #FFF3CD; color: #6b5400; }
  .attbar.left { background: #EEF0F2; color: #374151; }
  /* A game today: green like the NOW tag — a scheduled leave, not a problem. Once the
     dismissal has passed the child is actually OUT of the building, so it takes the same
     purple as a sign-out (.attbar.out) — the page should read the same way for "gone at a
     coach's dismissal" as for "gone because the office signed them out". */
  /* A game today (Josh's spec, 2026-09-14): red frame, light red fill — the SAME treatment the
     classes they'll miss get, so the bar and the affected rows read as one statement. */
  .attbar.game { background: #FDECEA; color: #7f1d1d; border: 2px solid #C62828;
                 border-radius: .4rem; margin: .6rem .9rem; padding: .55rem .8rem; }
  .attbar b { font-weight: 700; }
  .clstime { float: right; color: var(--dt); font-size: .78rem; font-weight: 600; white-space: nowrap;
             margin-left: .5rem; }
  .cls.now .clstime { color: #6b5400; }
  .daybar { padding: .5rem .9rem; font-size: .8rem; color: var(--dd);
            background: #FBECEE; border-bottom: 1px solid var(--line); }
  .daybar b { color: var(--red); }
  .daybar.warn { background: #FFF3CD; }
  .cls { padding: .55rem .9rem; border-bottom: 1px solid var(--line); font-size: .9rem; }
  .cls:last-child { border-bottom: 0; }
  .cls .t { color: var(--dt); font-size: .78rem; }
  /* tappable class rows inside detail views (teacher's classes, student's schedule) */
  button.cls { display: block; width: 100%; text-align: left; background: none;
               border: 0; border-bottom: 1px solid var(--line); border-radius: 0;
               color: var(--dd); font-weight: 400; font-family: inherit; cursor: pointer; }
  button.cls:last-child { border-bottom: 0; }
  button.cls:hover, button.cls:focus-visible { background: #FBECEE; }
  .trunc { padding: .5rem .9rem; color: var(--dt); font-size: .8rem; font-style: italic;
           background: var(--card); border: 1px solid var(--card-border);
           border-radius: .6rem; margin-top: .6rem; }

  /* HCS standard breakpoints: 640px phone, 380px tiny phone */
  @media (max-width: 640px) {
    body { padding: .75rem; }
    .top { margin: -.75rem -.75rem 0; padding: .75rem .75rem .6rem; }
    header { margin-bottom: .6rem; }
    .who { display: none; } /* reclaim header space on phones */
  }
  @media (max-width: 380px) {
    .hit dl { grid-template-columns: 1fr; gap: 0 0; }
    .hit dt { padding-top: .3rem; }
    .pmeta { white-space: normal; }
  }
</style>
<!-- ===== Showcase demo shim (standalone build) ===== -->
<link rel="stylesheet" href="../../assets/demo-banner.css">
<script>window.DEMO_META = { name: "Directory Search" };</script>
<script src="../../assets/gsr-shim.js"></script>
<script src="data.js"></script>
<script src="mock.js"></script>
<script src="../../assets/demo-banner.js" defer></script>
</head>
<body>
<div class="wrap">
  <div class="top">
    <header>
      <h1><b>HCS</b> Directory Search</h1>
      <span class="who">demo.staff@example.edu</span>
    </header>
    <div class="searchbar">
      <input id="q" type="search" placeholder="Student name, ID, parent email, homeroom…"
             autofocus autocomplete="off">
      <button id="go">Search</button>
    </div>
    <!-- Favourites were only reachable by CLEARING the search box, which nobody discovers
         (Josh couldn't find his own, 2026-09-08). This chip is the way in. Hidden until the
         user actually has favourites, so it never adds clutter for someone who doesn't. -->
    <button id="favview" class="favview" hidden>★ Favourites</button>
  </div>
  <div class="status" id="status">Type a name — pick a student to see their full record.</div>
  <div id="results"></div>
</div>
<script>
// GENERATED from Search.gs by tools/build-client.mjs — DO NOT EDIT.
/**
 * facts-directory-search — PURE search logic, environment-agnostic (Node + GAS).
 * No SpreadsheetApp here; callers supply already-loaded tab values.
 * This exact file is exercised by tools/test-search.mjs (Node) and by Code.gs (GAS).
 *
 * Input tabs shape: [{ name: 'Sheet1', values: [[hdr,...],[cell,...],...] }]
 * (values[0] is the header row, as returned by getDataRange().getValues()).
 */

var SEARCH_MAX_ROWS_PER_TAB = 100;

/**
 * Stringify a cell for matching/display. GAS getValues() yields Dates for date cells —
 * AND for time-only cells, which Sheets stores as a time-of-day on the spreadsheet epoch
 * 1899-12-30. Rendering those date-only silently destroyed every bell/period time
 * ("08:36:00" -> "1899-12-30"), so:
 *   - epoch 1899-12-30 + a time  -> "HH:MM:SS"        (a bare time value)
 *   - a real date with a time    -> "YYYY-MM-DD HH:MM:SS"
 *   - a real date at midnight    -> "YYYY-MM-DD"      (unchanged)
 */
function searchCellToString_(v) {
  if (v === null || v === undefined) return '';
  if (v instanceof Date) {
    var p2 = function (n) { return ('0' + n).slice(-2); };
    var hh = v.getHours(), mi = v.getMinutes(), ss = v.getSeconds();
    var time = p2(hh) + ':' + p2(mi) + ':' + p2(ss);
    var y = v.getFullYear(), mo = v.getMonth(), d = v.getDate();
    if (y === 1899 && mo === 11 && d === 30) return time; // Sheets' time-only epoch
    var date = y + '-' + p2(mo + 1) + '-' + p2(d);
    return (hh || mi || ss) ? (date + ' ' + time) : date;
  }
  return String(v);
}

/**
 * Deep-copy tabs with every cell stringified (dates → YYYY-MM-DD). Needed to hand
 * tab data to the web client: google.script.run cannot serialize Date objects.
 * All search/detail functions here accept serialized tabs identically to raw ones.
 */
function serializeTabs(tabs) {
  return (tabs || []).map(function (t) {
    return {
      name: t.name,
      values: (t.values || []).map(function (row) { return row.map(searchCellToString_); })
    };
  });
}

/**
 * Search every cell of every tab for a query.
 * Multi-word query = AND: every token must appear (case-insensitive substring)
 * somewhere in the row. Header rows are never returned as hits.
 *
 * @param {Array<{name:string, values:Array<Array>}>} tabs
 * @param {string} query
 * @param {Object} [opts] { maxRowsPerTab=SEARCH_MAX_ROWS_PER_TAB }
 * @return {{query:string, tokens:Array<string>, totalHits:number, tabs:Array<{
 *   name:string, headers:Array<string>, hits:Array<{rowIndex:number, cells:Array<string>,
 *   matchedCols:Array<number>}>, total:number, truncated:boolean}>}}
 *   tabs[] only contains tabs with >=1 hit. rowIndex is the 1-based sheet row.
 */
function searchWorkbook(tabs, query, opts) {
  opts = opts || {};
  var cap = opts.maxRowsPerTab || SEARCH_MAX_ROWS_PER_TAB;

  var tokens = String(query || '').toLowerCase().split(/\s+/).filter(function (t) { return t; });
  var out = { query: String(query || ''), tokens: tokens, totalHits: 0, tabs: [] };
  if (!tokens.length) return out;

  (tabs || []).forEach(function (tab) {
    var values = tab.values || [];
    if (values.length < 2) return; // header-only or empty tab
    var headers = values[0].map(searchCellToString_);

    var hits = [];
    var total = 0;
    for (var r = 1; r < values.length; r++) {
      var cells = values[r].map(searchCellToString_);
      var lower = cells.map(function (c) { return c.toLowerCase(); });

      var allTokensHit = tokens.every(function (t) {
        return lower.some(function (c) { return c.indexOf(t) !== -1; });
      });
      if (!allTokensHit) continue;

      total++;
      if (hits.length < cap) {
        var matchedCols = [];
        lower.forEach(function (c, i) {
          if (tokens.some(function (t) { return c.indexOf(t) !== -1; })) matchedCols.push(i);
        });
        hits.push({ rowIndex: r + 1, cells: cells, matchedCols: matchedCols });
      }
    }

    if (total > 0) {
      out.totalHits += total;
      out.tabs.push({
        name: tab.name,
        headers: headers,
        hits: hits,
        total: total,
        truncated: total > hits.length
      });
    }
  });

  return out;
}

/* ====================================================================
   People search — the staff UI is a person picker: match PEOPLE (students),
   list them, then fetch one person's full profile by ID. This keeps
   "noah may" from surfacing Noah Lambert just because his teacher is
   Ann-Marie May: schedule teachers are NOT part of a person's search blob.
   ==================================================================== */

var SEARCH_MAX_PEOPLE = 50;
var SEARCH_MAX_TEACHERS = 20;
var SEARCH_MAX_CLASSES = 25;
var PERIOD_TIMES_TAB = 'Period Times';
var EMERGENCY_TAB_NAME = 'Emergency Contacts';
var ATTENDANCE_TAB_NAME = 'Attendance Today';
var PICKUP_TAB_NAME = 'PickupContacts';
var ROSTER_TAB_NAME = 'Roster';
var DIRECTORY_TAB_NAMES = ['Directory', 'Sheet1'];
var SCHEDULES_TAB_NAME = 'Student Schedules';
var TEACHERS_TAB_NAME = 'Teachers';

/**
 * Stable class identity. Two sections CAN share class code + teacher while meeting in
 * different periods (real at HCS: BI08-LOC with the same teacher is both Period 1 and
 * Period 3), so the FACTS Class ID wins when the export carries it; the old
 * code+teacher key remains the fallback for pre-2026-08-06 exports.
 */
function classKey_(classId, code, teacher) {
  return classId ? ('id:' + classId) : (code + '|' + teacher);
}

function searchTabByName_(tabs, names) {
  for (var i = 0; i < (tabs || []).length; i++) {
    if (names.indexOf(tabs[i].name) !== -1) return tabs[i];
  }
  return null;
}

/** @return {Object} header name (exact string) -> column index. */
function searchHeaderMap_(headerRow) {
  var map = {};
  (headerRow || []).forEach(function (h, i) { map[searchCellToString_(h)] = i; });
  return map;
}

/**
 * Group the LONG-format directory tab (one row per student+guardian) into people.
 * Parses columns by HEADER NAME (facts-api-sync's contract: columns are append-only).
 * @return {Array<{id,name,grade,homeroom,homeroomTeacher,status,email,gender,
 *                 guardians:Array<{name:string,emails:Array<string>}>}>} sorted by name.
 */
function buildPeople(tabs) {
  var dir = searchTabByName_(tabs, DIRECTORY_TAB_NAMES);
  if (!dir || (dir.values || []).length < 2) return [];
  var h = searchHeaderMap_(dir.values[0]);
  var byId = {};
  var order = [];
  for (var r = 1; r < dir.values.length; r++) {
    var row = dir.values[r];
    var cell = function (name) { return searchCellToString_(row[h[name]]).trim(); };
    var id = cell('Student ID (System)');
    if (!id) continue;
    var p = byId[id];
    if (!p) {
      p = byId[id] = {
        id: id,
        name: cell('LastName FirstName'),
        grade: cell('Grade Level'),
        homeroom: cell('Homeroom'),
        homeroomTeacher: cell('Homeroom Teacher'),
        status: cell('Status'),
        email: cell('Email'),
        gender: cell('Gender'),
        locker: cell('Locker'), // appended to the directory contract 2026-09-06; '' on old exports
        guardians: []
      };
      order.push(p);
    }
    var gName = cell('LastName FirstName 1');
    var gEmails = [cell('Email 1'), cell('Email2')].filter(function (e) { return e; });
    if (gName || gEmails.length) p.guardians.push({ name: gName, emails: gEmails });
  }
  order.sort(function (a, b) { return a.name < b.name ? -1 : a.name > b.name ? 1 : 0; });
  return order;
}

/**
 * Teachers from the Teachers tab (name format "Last, First" — same string the
 * schedules tab uses, so classes can be matched to a teacher by name).
 */
function buildTeachers(tabs) {
  var tt = searchTabByName_(tabs, [TEACHERS_TAB_NAME]);
  if (!tt || (tt.values || []).length < 2) return [];
  var h = searchHeaderMap_(tt.values[0]);
  var out = [];
  for (var r = 1; r < tt.values.length; r++) {
    var row = tt.values[r];
    var cell = function (name) { return searchCellToString_(row[h[name]]).trim(); };
    if (!cell('Teacher')) continue;
    out.push({
      id: cell('Staff ID'),
      name: cell('Teacher'),
      active: cell('Active'),
      level: cell('Level'),
      department: cell('Department'),
      grades: cell('Grades'),
      core: cell('Core'),
      specials: cell('Specials'),
      fineArts: cell('Fine-Arts Electives'),
      athletics: cell('Athletics'),
      homerooms: cell('Homerooms'),
      elc: cell('ELC')
    });
  }
  return out;
}

/* ---------- grade-word normalization ----------
   Real gradeLevel values in the export are zero-padded: 01..12, K4, K5.
   Staff type "7", "7th", "seventh", "seventh grade" — all must hit grade 07. */

var SEARCH_GRADE_WORDS = { first: 1, second: 2, third: 3, fourth: 4, fifth: 5, sixth: 6,
  seventh: 7, eighth: 8, ninth: 9, tenth: 10, eleventh: 11, twelfth: 12 };

/** @return {Array<string>} canonical grade keys a token could mean ('07', 'K5', …), [] if none. */
function searchGradeKeys_(t) {
  if (t === 'k' || t === 'kindergarten' || t === 'kinder') return ['K4', 'K5'];
  if (/^k[45]$/.test(t)) return [t.toUpperCase()];
  var n = null;
  var m = t.match(/^(\d{1,2})(?:st|nd|rd|th)?$/);
  if (m) n = Number(m[1]);
  else if (SEARCH_GRADE_WORDS[t]) n = SEARCH_GRADE_WORDS[t];
  if (n === null || n < 1 || n > 12) return [];
  return [(n < 10 ? '0' : '') + n];
}

/** Display form of a grade key: '07' → '7', 'K5' stays. */
function searchGradeLabel_(g) {
  return String(g || '').replace(/^0/, '');
}

function searchGradeSortVal_(g) {
  if (g === 'K4') return -2;
  if (g === 'K5') return -1;
  return Number(g) || 99;
}

/** What a person can be FOUND by: their identity fields + guardians. Not status/gender. */
function personBlob_(p) {
  var bits = [p.id, p.name, p.grade, p.homeroom, p.homeroomTeacher, p.email];
  p.guardians.forEach(function (g) { bits.push(g.name); bits.push(g.emails.join(' ')); });
  return bits.join(' | ').toLowerCase();
}

/** Edit-distance budget for a fuzzy token, scaled by its length (0 = no fuzzing). */
function searchFuzzBudget_(token) {
  if (token.length < 3 || !/^[a-z'-]+$/.test(token)) return 0; // IDs/emails: exact only
  return token.length <= 4 ? 1 : token.length <= 7 ? 2 : 3;
}

/**
 * Group the schedules tab into classes, keyed by class code + teacher (two sections
 * of the same course under different teachers stay separate). A class's GRADES come
 * from its enrolled students — real course titles often carry no grade at all
 * ("Concert Band - Junior High"), so "7th band" must match via the roster.
 * @return {Array<{key,code,description,category,teacher,grades:Object,
 *                 quarters:Object, students:Array<{id,name,grade,quarters}>}>}
 */
function buildClasses(tabs) {
  var sched = searchTabByName_(tabs, [SCHEDULES_TAB_NAME]);
  if (!sched || (sched.values || []).length < 2) return [];
  var h = searchHeaderMap_(sched.values[0]);
  var byKey = {};
  var order = [];
  for (var r = 1; r < sched.values.length; r++) {
    var row = sched.values[r];
    var cell = function (name) { return h[name] === undefined ? '' : searchCellToString_(row[h[name]]).trim(); };
    var code = cell('Class Code');
    if (!code) continue;
    var teacher = cell('Teacher');
    var classId = cell('Class ID');
    var key = classKey_(classId, code, teacher);
    var c = byKey[key];
    if (!c) {
      c = byKey[key] = {
        key: key,
        classId: classId,
        code: code,
        description: cell('Class Description'),
        category: cell('Category'),
        teacher: teacher,
        period: cell('Period'),
        room: cell('Room'),
        pattern: cell('Pattern'),
        grades: {},
        quarters: {},
        students: []
      };
      order.push(c);
    }
    var grade = cell('Grade');
    if (grade) c.grades[grade] = true;
    var qtr = cell('Quarters');
    if (qtr) c.quarters[qtr] = true;
    c.students.push({ id: cell('Student ID'), name: cell('Student Name'), grade: grade, quarters: qtr });
  }
  order.forEach(function (c) {
    c.students.sort(function (a, b) { return a.name < b.name ? -1 : a.name > b.name ? 1 : 0; });
  });
  return order;
}

/** Sorted display label for a class's grade set: {"07","08"} -> '7, 8'. */
function classGradesLabel_(gradesObj) {
  return Object.keys(gradesObj)
    .sort(function (a, b) { return searchGradeSortVal_(a) - searchGradeSortVal_(b); })
    .map(searchGradeLabel_)
    .join(', ');
}

/**
 * Person search with built-in fuzzy name matching: every token (AND) must match the
 * person either exactly (case-insensitive substring of their blob) or as a CLOSE
 * SPELLING of one of their name words (edit distance with cheap transpositions) —
 * so "johnathon" lists every Jonathon/Jonathan/Johnathan. Exact matches rank first;
 * close-spelling matches carry close:true.
 * @return {{query,tokens,total,truncated,hasClose:boolean,
 *           people:Array<{id,name,grade,homeroom,homeroomTeacher,close:boolean}>}}
 */
function searchPeople(tabs, query, opts) {
  opts = opts || {};
  var cap = opts.maxPeople || SEARCH_MAX_PEOPLE;
  // opts.today ('YYYY-MM-DD') switches on today's absent/late badge in the result list;
  // opts.presence adds the signed-out pill, so "not in the building" is visible before you tap
  var attendance = opts.today === undefined ? {} : buildAttendance(tabs, opts.today);
  var presence = opts.presence || {};
  var tokens = String(query || '').toLowerCase().split(/\s+/).filter(function (t) { return t; });
  var out = { query: String(query || ''), tokens: tokens, total: 0, truncated: false, hasClose: false, people: [] };
  if (!tokens.length) return out;

  var people = buildPeople(tabs);

  // per token: the grades it could name ("7th"/"seventh" → 07) — used for students AND classes
  var gradeKeys = tokens.map(searchGradeKeys_);

  // vocabulary of STUDENT name words only — fuzzy spelling applies to the student's own
  // first/last name, never guardians (a parent named Jonathan must not make his kid a
  // "close match" for johnathon; that read as random names in the list)
  var vocab = {};
  people.forEach(function (p) {
    p.name.split(/[\s,]+/).forEach(function (w) {
      if (w.length >= 2) vocab[w.toLowerCase()] = true;
    });
  });
  var vocabWords = Object.keys(vocab);

  // per token: the set of real name words it's a close spelling of
  var fuzzySets = tokens.map(function (t) {
    var budget = searchFuzzBudget_(t);
    var set = {};
    if (budget) {
      vocabWords.forEach(function (w) {
        if (Math.abs(w.length - t.length) > budget) return;
        if (searchEditDistance_(t, w) <= budget) set[w] = true;
      });
    }
    return set;
  });

  var matches = [];
  people.forEach(function (p) {
    var own = [p.id, p.name, 'grade ' + p.grade, p.homeroom, p.homeroomTeacher, p.email]
      .join(' | ').toLowerCase(); // 'grade' literal so "seventh grade" matches 07 students
    var studentWords = p.name.toLowerCase().split(/[\s,]+/);
    var exactCount = 0;
    var via = null;     // guardian whose name/email carried the match (shown in the list)
    var fw = {};        // name words matched by close spelling (yellow-highlighted in the UI)
    var ok = tokens.every(function (t, i) {
      if (own.indexOf(t) !== -1) { exactCount++; return true; }
      if (gradeKeys[i].indexOf(p.grade) !== -1) { exactCount++; return true; } // "seventh" → grade 07
      for (var k = 0; k < p.guardians.length; k++) {
        var g = p.guardians[k];
        if ((g.name + ' ' + g.emails.join(' ')).toLowerCase().indexOf(t) !== -1) {
          exactCount++;
          if (!via) via = g.name;
          return true;
        }
      }
      var hits = studentWords.filter(function (w) { return fuzzySets[i][w]; });
      hits.forEach(function (w) { fw[w] = true; });
      return hits.length > 0;
    });
    if (!ok) return;
    var nameLower = p.name.toLowerCase();
    var nameHits = tokens.filter(function (t) { return nameLower.indexOf(t) !== -1; }).length;
    matches.push({ p: p, allExact: exactCount === tokens.length, nameHits: nameHits, via: via,
                   fuzzyWords: Object.keys(fw) });
  });
  matches.sort(function (a, b) {
    return (b.allExact - a.allExact) || (b.nameHits - a.nameHits) ||
           (a.p.name < b.p.name ? -1 : a.p.name > b.p.name ? 1 : 0);
  });

  out.total = matches.length;
  out.truncated = matches.length > cap;
  out.people = matches.slice(0, cap).map(function (m) {
    return { id: m.p.id, name: m.p.name, grade: m.p.grade, homeroom: m.p.homeroom,
             homeroomTeacher: m.p.homeroomTeacher, close: !m.allExact, via: m.via,
             fuzzyWords: m.fuzzyWords,
             attendance: attendance[m.p.id] || null, // absent/late shows in the list itself
             status: studentStatus(attendance[m.p.id], presence[m.p.id]) };
  });

  // teachers: same exact-or-fuzzy-name matching against the Teachers tab
  var teachers = buildTeachers(tabs);
  var tVocab = {};
  teachers.forEach(function (t) {
    t.name.split(/[\s,]+/).forEach(function (w) {
      if (w.length >= 2) tVocab[w.toLowerCase()] = true;
    });
  });
  var tVocabWords = Object.keys(tVocab);
  var tFuzzySets = tokens.map(function (t) {
    var budget = searchFuzzBudget_(t);
    var set = {};
    if (budget) {
      tVocabWords.forEach(function (w) {
        if (Math.abs(w.length - t.length) > budget) return;
        if (searchEditDistance_(t, w) <= budget) set[w] = true;
      });
    }
    return set;
  });
  var tMatches = [];
  teachers.forEach(function (t) {
    if (t.active === 'N') return; // staff request: never list inactive teachers
    var blob = [t.id, t.name, t.department, t.level, t.grades, t.homerooms]
      .join(' | ').toLowerCase();
    var words = t.name.toLowerCase().split(/[\s,]+/);
    var exactCount = 0;
    var fw = {};
    var ok = tokens.every(function (tok, i) {
      if (blob.indexOf(tok) !== -1) { exactCount++; return true; }
      var hits = words.filter(function (w) { return tFuzzySets[i][w]; });
      hits.forEach(function (w) { fw[w] = true; });
      return hits.length > 0;
    });
    if (!ok) return;
    var nameLower = t.name.toLowerCase();
    var nameHits = tokens.filter(function (tok) { return nameLower.indexOf(tok) !== -1; }).length;
    tMatches.push({ t: t, allExact: exactCount === tokens.length, nameHits: nameHits,
                    fuzzyWords: Object.keys(fw) });
  });
  tMatches.sort(function (a, b) {
    return (b.allExact - a.allExact) || (b.nameHits - a.nameHits) ||
           (a.t.name < b.t.name ? -1 : a.t.name > b.t.name ? 1 : 0);
  });
  out.teachers = tMatches.slice(0, SEARCH_MAX_TEACHERS).map(function (m) {
    return { id: m.t.id, name: m.t.name, department: m.t.department, level: m.t.level,
             grades: m.t.grades, close: !m.allExact, fuzzyWords: m.fuzzyWords };
  });

  // classes: token must hit the class blob (title/code/category/teacher) OR name a grade
  // with enrolled students ("7th band" → title has band, roster has 07 kids)
  var classes = buildClasses(tabs);
  var cMatches = [];
  classes.forEach(function (c) {
    var gradesLabel = classGradesLabel_(c.grades);
    var blob = [c.code, c.description, c.category, c.teacher, 'grade ' + gradesLabel]
      .join(' | ').toLowerCase();
    var descLower = c.description.toLowerCase();
    var descHits = 0;
    var ok = tokens.every(function (tok, i) {
      if (blob.indexOf(tok) !== -1) {
        if (descLower.indexOf(tok) !== -1) descHits++;
        return true;
      }
      return gradeKeys[i].some(function (g) { return c.grades[g]; });
    });
    if (!ok) return;
    cMatches.push({ c: c, descHits: descHits, gradesLabel: gradesLabel });
  });
  cMatches.sort(function (a, b) {
    return (b.descHits - a.descHits) || (b.c.students.length - a.c.students.length) ||
           (a.c.description < b.c.description ? -1 : a.c.description > b.c.description ? 1 : 0);
  });
  out.classesTotal = cMatches.length;
  out.classes = cMatches.slice(0, SEARCH_MAX_CLASSES).map(function (m) {
    return { key: m.c.key, code: m.c.code, description: m.c.description,
             category: m.c.category, teacher: m.c.teacher, grades: m.gradesLabel,
             students: m.c.students.length };
  });

  out.hasClose = out.people.concat(out.teachers).some(function (x) { return x.close; });
  return out;
}

/**
 * One class's full record: instructor(s) resolved against the Teachers tab (tappable
 * when found there), class info, then the roster joined to the directory so every
 * student row carries grade + homeroom + homeroom teacher.
 * @return {?{profile:Object, instructors:Array, students:Array}} null if key unknown.
 */
function classDetail(tabs, key) {
  var classes = buildClasses(tabs);
  var c = null;
  for (var i = 0; i < classes.length; i++) if (classes[i].key === String(key)) { c = classes[i]; break; }
  if (!c) return null;

  var peopleById = {};
  buildPeople(tabs).forEach(function (p) { peopleById[p.id] = p; });
  var teachersByName = {};
  buildTeachers(tabs).forEach(function (t) { teachersByName[t.name] = t; });

  // export writes co-taught classes as "Last, First / Last, First"
  var instructors = c.teacher.split(' / ').map(function (n) { return n.trim(); })
    .filter(function (n) { return n; })
    .map(function (n) {
      var t = teachersByName[n];
      return t ? { id: t.id, name: t.name, department: t.department, level: t.level, grades: t.grades }
               : { id: null, name: n };
    });

  return {
    profile: {
      key: c.key, code: c.code, classId: c.classId, description: c.description,
      category: c.category, teacher: c.teacher, grades: classGradesLabel_(c.grades),
      period: c.period, room: c.room,
      quarters: Object.keys(c.quarters).sort().join(' / '), students: c.students.length
    },
    instructors: instructors,
    students: c.students.map(function (s) {
      var p = peopleById[s.id];
      return { id: s.id, name: p ? p.name : s.name, grade: s.grade,
               homeroom: p ? p.homeroom : '', homeroomTeacher: p ? p.homeroomTeacher : '',
               quarters: s.quarters };
    })
  };
}

/**
 * One teacher's full record: Teachers-tab profile + the classes they teach
 * (grouped from the schedules tab by matching the teacher's name, with student counts).
 * @return {?{profile:Object, classes:Array}} null if id unknown.
 */
function teacherDetail(tabs, id) {
  var teachers = buildTeachers(tabs);
  var t = null;
  for (var i = 0; i < teachers.length; i++) if (teachers[i].id === String(id)) { t = teachers[i]; break; }
  if (!t) return null;

  var byCode = {};
  var order = [];
  var sched = searchTabByName_(tabs, [SCHEDULES_TAB_NAME]);
  if (sched && (sched.values || []).length > 1) {
    var h = searchHeaderMap_(sched.values[0]);
    for (var r = 1; r < sched.values.length; r++) {
      var row = sched.values[r];
      if (searchCellToString_(row[h['Teacher']]).indexOf(t.name) === -1) continue;
      var code = searchCellToString_(row[h['Class Code']]);
      var cid = h['Class ID'] === undefined ? '' : searchCellToString_(row[h['Class ID']]).trim();
      var code2 = cid || code; // group per SECTION when the export carries Class ID
      var c = byCode[code2];
      if (!c) {
        c = byCode[code2] = {
          code: code,
          key: classKey_(cid, code, searchCellToString_(row[h['Teacher']])), // opens classDetail
          description: searchCellToString_(row[h['Class Description']]),
          category: searchCellToString_(row[h['Category']]),
          period: h['Period'] === undefined ? '' : searchCellToString_(row[h['Period']]).trim(),
          room: h['Room'] === undefined ? '' : searchCellToString_(row[h['Room']]).trim(),
          // The join key into `Period Times`. Without it a teacher's classes carry no clock
          // time, so annotateSchedule can't tell which one they are teaching RIGHT NOW —
          // which is the whole point of showing a teacher's schedule mid-day.
          pattern: h['Pattern'] === undefined ? '' : searchCellToString_(row[h['Pattern']]).trim(),
          quarters: {},
          students: 0
        };
        order.push(c);
      }
      c.students++;
      var qtr = searchCellToString_(row[h['Quarters']]).trim();
      if (qtr) c.quarters[qtr] = true; // distinct enrollment patterns, e.g. "Q1,2,3,4" vs "Q3"
    }
  }
  return {
    profile: t,
    classes: order.map(function (c) {
      return { code: c.code, key: c.key, description: c.description, category: c.category,
               period: c.period, room: c.room, pattern: c.pattern,
               quarters: Object.keys(c.quarters).sort().join(' / '), students: c.students };
    })
  };
}

/**
 * Today's attendance exceptions from the `Attendance Today` tab, indexed by student id.
 * Only students who are NOT present appear — the producer omits present rows entirely.
 *
 * `today` guards against a stale tab: the producer stamps each row with the date it pulled,
 * so if the 15-minute job stops running, yesterday's absences are ignored rather than
 * reported as today's. Pass '' to accept whatever the tab holds (used by tests).
 *
 * @return {Object} studentId -> {status, detail, code, excused, reason, date}
 */
function buildAttendance(tabs, today) {
  var t = searchTabByName_(tabs, [ATTENDANCE_TAB_NAME]);
  var out = {};
  if (!t || (t.values || []).length < 2) return out;
  var h = searchHeaderMap_(t.values[0]);
  for (var r = 1; r < t.values.length; r++) {
    var row = t.values[r];
    var cell = function (n) { return h[n] === undefined ? '' : searchCellToString_(row[h[n]]).trim(); };
    var sid = cell('Student ID');
    if (!sid) continue;
    var date = cell('Date');
    if (today && date && date.slice(0, 10) !== String(today).slice(0, 10)) continue; // stale
    out[sid] = {
      status: cell('Status'), detail: cell('Detail'), code: cell('Code'),
      excused: cell('Excused'), reason: cell('Reason'), date: date
    };
  }
  return out;
}

/**
 * Drop reference rows for students who are not in this export.
 *
 * `PickupContacts` is produced with NO enrolment filter — 5,564 rows covering 1,456 students
 * against 655 enrolled (measured 2026-09-06) — because campus-sign-in-out-system consumes that
 * same tab and may want the wider set. Roughly 800 of those students have left the school, and
 * without this every staff browser would receive withdrawn and graduated families' phone
 * numbers. Pruning HERE fixes it for this app without changing a tab another project depends on.
 *
 * Emergency Contacts needs no pruning: its producer already restricts to enrolled students.
 *
 * @return {Array} the same tab list, with pruned copies substituted (input is not mutated)
 */
function pruneToEnrolled(tabs) {
  var dir = searchTabByName_(tabs, DIRECTORY_TAB_NAMES);
  if (!dir || (dir.values || []).length < 2) return tabs;
  var enrolled = {};
  for (var r = 1; r < dir.values.length; r++) {
    var id = searchCellToString_(dir.values[r][0]).trim();
    if (id) enrolled[id] = true;
  }
  return (tabs || []).map(function (t) {
    if (t.name !== PICKUP_TAB_NAME || (t.values || []).length < 2) return t;
    var h = searchHeaderMap_(t.values[0]);
    var col = h['studentId'] !== undefined ? h['studentId'] : h['Student ID'];
    if (col === undefined) return t;
    var kept = [t.values[0]];
    for (var i = 1; i < t.values.length; i++) {
      if (enrolled[searchCellToString_(t.values[i][col]).trim()]) kept.push(t.values[i]);
    }
    return { name: t.name, values: kept };
  });
}

/**
 * Who may COLLECT a child, from the `PickupContacts` tab. Distinct from both the directory's
 * guardians (who the parents are) and the emergency list (who to call). Already produced into
 * the staging sheet by facts-api-sync — this app simply had never loaded it.
 *
 * NEVER surface a pickup id: Campus Presence tiers `PickupContactID` as SYSTEM, i.e. custody
 * adjacent and raw-sheet-only. Names and numbers only.
 *
 * @return {Object} studentId -> [{name, relationship, cell, home, work, email}]
 */
function buildPickupContacts(tabs) {
  var t = searchTabByName_(tabs, [PICKUP_TAB_NAME]);
  var out = {};
  if (!t || (t.values || []).length < 2) return out;
  var h = searchHeaderMap_(t.values[0]);
  for (var r = 1; r < t.values.length; r++) {
    var row = t.values[r];
    var cell = function (n) { return h[n] === undefined ? '' : searchCellToString_(row[h[n]]).trim(); };
    var sid = cell('studentId') || cell('Student ID');
    if (!sid) continue;
    var name = [cell('firstName') || cell('First Name'), cell('lastName') || cell('Last Name')]
      .filter(String).join(' ').trim();
    if (!name) continue;
    (out[sid] = out[sid] || []).push({
      name: name,
      relationship: cell('relationship') || cell('Relationship'),
      cell: cell('cellPhone') || cell('Cell Phone'),
      home: cell('homePhone') || cell('Home Phone'),
      work: cell('workPhone') || cell('Work Phone'),
      email: cell('email') || cell('Email')
    });
  }
  return out;
}

/**
 * How a student gets home, from the dismissal `Roster` tab (facts-api-sync/Transportation.gs,
 * rebuilt 04:00). Parsed by header NAME — that producer notes its column order was only ever
 * safe to reorder "because no consumer exists yet", and this app is now the second one.
 *
 * `Source === 'residual-default'` means Car was ASSUMED, not recorded; the UI must say so
 * rather than present a guess as fact. `Building` (physical) is not `Pickup` (where the parent
 * goes) — they are separate columns for a reason.
 *
 * @return {Object} studentId -> {type, routeCode, routeName, vehicle, split, building, pickup,
 *                                pickupBasis, walkTo, familyId, assumed, note}
 */
function buildTransportation(tabs) {
  var t = searchTabByName_(tabs, [ROSTER_TAB_NAME]);
  var out = {};
  if (!t || (t.values || []).length < 2) return out;
  var h = searchHeaderMap_(t.values[0]);
  for (var r = 1; r < t.values.length; r++) {
    var row = t.values[r];
    var cell = function (n) { return h[n] === undefined ? '' : searchCellToString_(row[h[n]]).trim(); };
    var sid = cell('Student ID');
    if (!sid) continue;
    var entry = {
      type: cell('Type'), routeCode: cell('Route Code'), routeName: cell('Route Name'),
      vehicle: cell('Vehicle'), split: cell('Split'), building: cell('Building'),
      pickup: cell('Pickup'), pickupBasis: cell('Pickup Basis'), walkTo: cell('Walk To'),
      familyId: cell('Family ID'), note: cell('Note'),
      assumed: /residual/i.test(cell('Source'))
    };
    // Split-custody students legitimately ride BOTH routes — keep every row, don't pick one.
    if (out[sid]) {
      out[sid].extra = (out[sid].extra || []).concat([entry]);
    } else {
      out[sid] = entry;
    }
  }
  return out;
}

/**
 * Siblings, from the roster's `Family ID` — authoritative in FACTS, unlike matching guardian
 * emails, which splits families that don't share an address.
 * @return {Object} studentId -> [{id, name}] (never includes the student themselves)
 */
function buildSiblings(tabs) {
  var t = searchTabByName_(tabs, [ROSTER_TAB_NAME]);
  var out = {};
  if (!t || (t.values || []).length < 2) return out;
  var h = searchHeaderMap_(t.values[0]);
  if (h['Family ID'] === undefined) return out;
  var byFamily = {}, nameById = {};
  for (var r = 1; r < t.values.length; r++) {
    var row = t.values[r];
    var cell = function (n) { return h[n] === undefined ? '' : searchCellToString_(row[h[n]]).trim(); };
    var sid = cell('Student ID'), fam = cell('Family ID');
    if (!sid || !fam) continue;
    nameById[sid] = cell('Student Name');
    (byFamily[fam] = byFamily[fam] || {})[sid] = true; // dedupe: split-custody rows repeat a student
  }
  Object.keys(byFamily).forEach(function (fam) {
    var ids = Object.keys(byFamily[fam]);
    if (ids.length < 2) return;
    ids.forEach(function (sid) {
      out[sid] = ids.filter(function (o) { return o !== sid; })
        .map(function (o) { return { id: o, name: nameById[o] || o }; })
        .sort(function (a, b) { return a.name < b.name ? -1 : a.name > b.name ? 1 : 0; });
    });
  });
  return out;
}

/**
 * Today's sign-in/out, folded from Campus Presence `EVENTS` rows — STATUS AND TIME ONLY.
 *
 * Campus Presence tiers GuardianName / Relationship / Reason / PickupMatch as OFFICE, and this
 * app is open to the whole staff OU, so none of those are carried out of this function
 * (Josh, 2026-09-06). Mirrors dsBuildSignedOut in FACTS/transportation/Dismissal.gs, which is
 * already tested against Campus Presence's real schema — including the rule that matters most:
 * a `PickupMatch === 'mismatch'` early-out is an OPEN FLAG, not a sign-out, and must never
 * remove a child.
 *
 * @return {Object} studentId -> {out, back, late}  ('' when that thing didn't happen)
 */
function buildPresence(values, todayKey) {
  var out = {};
  if (!values || values.length < 2) return out;
  var h = searchHeaderMap_(values[0]);
  var get = function (row, name) {
    var i = h[name];
    return i === undefined ? '' : searchCellToString_(row[i]).trim();
  };
  for (var r = 1; r < values.length; r++) {
    var row = values[r];
    if (todayKey && get(row, 'Date').slice(0, 10) !== String(todayKey).slice(0, 10)) continue;
    var sid = get(row, 'PersonKey');
    if (!sid) continue;
    var type = get(row, 'Type');
    var hhmm = get(row, 'Timestamp').slice(11, 16);
    var rec = out[sid] || (out[sid] = { out: '', back: '', late: '' });
    if (type === 'student_early_out') {
      if (get(row, 'PickupMatch') === 'mismatch') continue; // an open flag, NOT a departure
      rec.out = hhmm;
      rec.back = '';                       // a later return clears it again
    } else if (type === 'student_return_in') {
      if (rec.out) rec.back = hhmm;
    } else if (type === 'student_late_in') {
      rec.late = hhmm;
    }
  }
  return out;
}

/**
 * One verdict for "is this child here?", from attendance + presence.
 *
 * Precedence copied from the dismissal board, where it is already tested: a sign-out beats a
 * late arrival, and an override never suppresses an absence. Above all — AN UNKNOWN READS AS
 * PRESENT. A child not waited for who is still here is far worse than one waited for who has
 * gone home, so this never invents an absence.
 *
 * @return {?{state, label, detail}} null when there is nothing to say (i.e. present as normal)
 */
function studentStatus(attendance, presence) {
  var p = presence || {};
  if (p.out && !p.back) {
    return { state: 'out', label: 'Not in building',
             detail: 'signed out ' + searchTimeLabel_(p.out + ':00') };
  }
  if (attendance && attendance.status) {
    var d = [];
    if (attendance.detail && attendance.detail !== attendance.status) d.push(attendance.detail);
    if (attendance.reason) d.push(attendance.reason);
    if (p.out && p.back) {
      d.push('signed out ' + searchTimeLabel_(p.out + ':00') +
             ', returned ' + searchTimeLabel_(p.back + ':00'));
    }
    return { state: /absent/i.test(attendance.status) ? 'absent'
                  : /late/i.test(attendance.status) ? 'late' : 'left',
             label: attendance.status, detail: d.join(' · ') };
  }
  if (p.out && p.back) {
    return { state: 'back', label: 'Back in building',
             detail: 'signed out ' + searchTimeLabel_(p.out + ':00') +
                     ', returned ' + searchTimeLabel_(p.back + ':00') };
  }
  if (p.late) {
    return { state: 'late', label: 'Late arrival',
             detail: 'signed in ' + searchTimeLabel_(p.late + ':00') };
  }
  return null; // nothing recorded -> present, and we do not claim otherwise
}

/**
 * Emergency call list from the `Emergency Contacts` tab, indexed by student id.
 * A DIFFERENT list from the directory's guardians (who to call vs. who the parents are),
 * and separate again from FACTS' pickup-authorisation list.
 * @return {Object} studentId -> [{name, relationship, cell, home, work, email, note, order}]
 */
function buildEmergencyContacts(tabs) {
  var t = searchTabByName_(tabs, [EMERGENCY_TAB_NAME]);
  var out = {};
  if (!t || (t.values || []).length < 2) return out;
  var h = searchHeaderMap_(t.values[0]);
  for (var r = 1; r < t.values.length; r++) {
    var row = t.values[r];
    var cell = function (n) { return h[n] === undefined ? '' : searchCellToString_(row[h[n]]).trim(); };
    var sid = cell('Student ID');
    if (!sid) continue;
    (out[sid] = out[sid] || []).push({
      order: cell('Order'), name: cell('Contact Name'), relationship: cell('Relationship'),
      cell: cell('Cell Phone'), home: cell('Home Phone'), work: cell('Work Phone'),
      email: cell('Email'), note: cell('Note')
    });
  }
  return out;
}

/**
 * One person's full record: directory profile + guardians + their schedule rows.
 * @return {?{profile:Object, guardians:Array, classes:Array}} null if id unknown.
 */
function personDetail(tabs, id, today, presence) {
  var people = buildPeople(tabs);
  var p = null;
  for (var i = 0; i < people.length; i++) if (people[i].id === String(id)) { p = people[i]; break; }
  if (!p) return null;

  var classes = [];
  var sched = searchTabByName_(tabs, [SCHEDULES_TAB_NAME]);
  if (sched && (sched.values || []).length > 1) {
    var h = searchHeaderMap_(sched.values[0]);
    for (var r = 1; r < sched.values.length; r++) {
      var row = sched.values[r];
      if (searchCellToString_(row[h['Student ID']]).trim() !== p.id) continue;
      var cell = function (name) { return h[name] === undefined ? '' : searchCellToString_(row[h[name]]).trim(); };
      var clCode = cell('Class Code');
      var clTeacher = cell('Teacher');
      var clId = cell('Class ID');
      classes.push({
        code: clCode,
        classId: clId,
        key: classKey_(clId, clCode, clTeacher), // opens classDetail
        description: cell('Class Description'),
        category: cell('Category'),
        teacher: clTeacher,
        quarters: cell('Quarters'),
        period: cell('Period'),   // canonical, e.g. "Period 3" — blank for K4-6 (no periods in FACTS)
        room: cell('Room'),
        pattern: cell('Pattern'), // joins to the Period Times tab for today's clock time
        activity: cell('Activity') === 'Y', // team/club: listed apart from academic periods
        dept: cell('Course Dept')           // 'Athletics' distinguishes sports from other activities
      });
    }
  }
  return {
    profile: { id: p.id, name: p.name, grade: p.grade, homeroom: p.homeroom,
               homeroomTeacher: p.homeroomTeacher, status: p.status, email: p.email,
               gender: p.gender, locker: p.locker },
    guardians: p.guardians,
    emergency: buildEmergencyContacts(tabs)[p.id] || [],
    pickups: buildPickupContacts(tabs)[p.id] || [],
    transportation: buildTransportation(tabs)[p.id] || null,
    siblings: buildSiblings(tabs)[p.id] || [],
    attendance: (today === undefined ? {} : buildAttendance(tabs, today))[p.id] || null,
    presence: (presence && presence[p.id]) || null,
    // teams/clubs are split out of the academic schedule (structural `activity` flag)
    classes: classes.filter(function (c) { return !c.activity; }),
    activities: classes.filter(function (c) { return c.activity; })
  };
}

/* ====================================================================
   PERIODS — "which class is this student in right now?"

   facts-api-sync writes a `Period Times` tab: one row per (pattern, weekday)
   carrying the TIME SLOT that pattern occupies that day plus its clock times.
   The slot — not the period number — is the join key, which is what makes
   HCS's reverse-order Friday work: pattern "Period 1" sits in the P1 slot
   Mon-Thu and in the P8 slot (2:37pm) on Friday.

   On a normal day the FACTS times are correct. On a delay/exam/custom day the
   BELL schedule is authoritative, so today's bell times are matched onto the
   same slots and win when present (Josh 2026-08-06: every day must bold).
   ==================================================================== */

/** "HH:MM[:SS]" -> minutes since midnight; -1 if unparseable. */
function searchTimeToMin_(s) {
  var m = /^(\d{1,2}):(\d{2})/.exec(String(s || ''));
  return m ? (parseInt(m[1], 10) * 60 + parseInt(m[2], 10)) : -1;
}

/** "8:36 AM"-style display for an "HH:MM:SS" value ('' stays ''). */
function searchTimeLabel_(s) {
  var mins = searchTimeToMin_(s);
  if (mins < 0) return '';
  var h = Math.floor(mins / 60), m = mins % 60;
  var ap = h >= 12 ? 'PM' : 'AM';
  var h12 = h % 12; if (h12 === 0) h12 = 12;
  return h12 + ':' + ('0' + m).slice(-2) + ' ' + ap;
}

/**
 * Index the `Period Times` tab.
 * @return {{byPattern: Object, dayName: Object}}
 *   byPattern[pattern][dayCol] = {slot, slotLabel, period, begin, end}
 */
function buildPeriodTimes(tabs) {
  var pt = searchTabByName_(tabs, [PERIOD_TIMES_TAB]);
  var out = { byPattern: {}, bySlot: {}, dayName: {} };
  if (!pt || (pt.values || []).length < 2) return out;
  var h = searchHeaderMap_(pt.values[0]);
  for (var r = 1; r < pt.values.length; r++) {
    var row = pt.values[r];
    var cell = function (n) { return h[n] === undefined ? '' : searchCellToString_(row[h[n]]).trim(); };
    var pattern = cell('Pattern'), day = cell('Day');
    if (!pattern || !day) continue;
    var entry = {
      slot: cell('Slot'), slotLabel: cell('Slot Label'), period: cell('Period'),
      begin: cell('Begin'), end: cell('End')
    };
    // Pattern 0 = a "slot row": a grid cell no pattern occupies (Homeroom, Lunch)
    if (Number(pattern) === 0) {
      (out.bySlot[entry.slotLabel] = out.bySlot[entry.slotLabel] || {})[day] = entry;
    } else {
      (out.byPattern[pattern] = out.byPattern[pattern] || {})[day] = entry;
    }
    out.dayName[day] = cell('Day Name');
  }
  return out;
}

/**
 * Homeroom carries no FACTS pattern, but it does meet (08:28-08:33) and it's exactly where a
 * student is first thing in the morning — so it resolves through the Homeroom SLOT instead.
 */
function isHomeroomClass_(c) {
  return /homeroom/i.test(String((c && c.category) || '')) ||
         /^HR-/i.test(String((c && c.code) || ''));
}

/**
 * Today's bell periods -> { slotKey: {start, end, name} }, keyed to match FACTS slot
 * labels. BellHub names periods "1st Period".."8th Period", "Homeroom", "Chapel", "Lunch".
 */
function bellSlotTimes(bellPeriods) {
  var out = {};
  (bellPeriods || []).forEach(function (p) {
    var name = String((p && p.name) || '');
    if (!p || !p.start) return;
    var key = null;
    var m = /(\d+)\s*(?:st|nd|rd|th)?\s*period/i.exec(name);
    if (m) key = 'P' + Number(m[1]);
    else if (/homeroom/i.test(name)) key = 'Homeroom';
    else if (/lunch/i.test(name)) key = 'Lunch';
    else if (/chapel/i.test(name)) key = 'Chapel';
    if (key && !out[key]) out[key] = { start: p.start, end: p.end || '', name: name };
  });
  return out;
}

/**
 * Bell time for a FACTS slot label. Handles the grade-banded labels the template uses
 * ('P4 7-8' -> the bells' P4; 'Lunch 9-12' -> the bells' Lunch).
 */
function bellTimeForSlot_(bells, slotLabel) {
  bells = bells || {};
  var label = String(slotLabel || '');
  if (!label) return null;
  if (bells[label]) return bells[label];
  var m = /^P\s*(\d+)/i.exec(label);
  if (m && bells['P' + Number(m[1])]) return bells['P' + Number(m[1])];
  if (/^lunch/i.test(label) && bells['Lunch']) return bells['Lunch'];
  if (/^homeroom/i.test(label) && bells['Homeroom']) return bells['Homeroom'];
  return null;
}

/**
 * Does a grade-banded slot label apply to this student?
 *
 * HCS runs TWO lunches — "Lunch 7-8" at 10:57 and "Lunch 9-12" at 11:45 — and the same banding
 * on P4/P5. Without this check a 9th grader at 11:00 would be told they are at lunch when they
 * are actually in Period 4, because the 7-8 lunch is running at that moment for other students.
 *
 * An unbanded label ("Homeroom") applies to everyone. A banded label with a grade we cannot
 * read as a number (K5, ELC) returns FALSE: saying nothing beats naming the wrong lunch.
 */
function slotAppliesToGrade_(slotLabel, grade) {
  var band = /(\d{1,2})\s*-\s*(\d{1,2})\s*$/.exec(String(slotLabel || ''));
  if (!band) return true;
  var g = String(grade == null ? '' : grade).trim();
  if (!/^\d{1,2}$/.test(g)) return false; // "K5"/"ELC"/blank — don't guess a band
  return Number(g) >= Number(band[1]) && Number(g) <= Number(band[2]);
}

/** "Lunch 7-8" -> "Lunch". The band is implied by whose record you're looking at. */
function blockDisplayName_(slotLabel) {
  var s = String(slotLabel || '').replace(/\s*\d{1,2}\s*-\s*\d{1,2}\s*$/, '').trim();
  return s || String(slotLabel || '');
}

/**
 * Where the school day is RIGHT NOW for this student when no class of theirs is in session.
 *
 * Without this the schedule said "no class in session at this time", which at 11:50 reads like
 * something is broken rather than "they're at lunch" (Josh, 2026-09-14). The non-teaching slots
 * — Lunch, Homeroom — are already in the `Period Times` grid as Pattern-0 slot rows, so the
 * honest answer is sitting there; it just was never consulted.
 *
 * Bell times win over the FACTS grid per slot, exactly as annotateSchedule does, so a delay day
 * names the block at its real time instead of the normal-day one.
 *
 * @param periodTimes buildPeriodTimes() output
 * @param ctx   { dayCol:1..5 ('' = weekend), nowMin, bells }
 * @param grade the student's `Grade Level` — decides WHICH lunch applies
 * @return {?{state:string, label:string, begin:string, end:string}}
 *   state: 'block'   — inside a named non-teaching block (label = "Lunch"/"Homeroom")
 *          'between' — inside the school day but between blocks (passing time)
 *          'before' / 'after' — outside the school day
 *   null when the day has no slots at all (weekend, or no grid), so the caller can stay quiet.
 */
function schoolDayBlock(periodTimes, ctx, grade) {
  ctx = ctx || {};
  var day = String(ctx.dayCol || '');
  var now = ctx.nowMin;
  if (!day || now === null || now === undefined || now < 0) return null;

  var bySlot = (periodTimes || {}).bySlot || {};
  var byPattern = (periodTimes || {}).byPattern || {};
  var bells = ctx.bells || {};
  var dayStart = -1, dayEnd = -1, hit = null;

  var consider = function (label, cell, teaching) {
    if (!cell) return;
    if (!slotAppliesToGrade_(label, grade)) return;
    var b = bellTimeForSlot_(bells, label);
    var begin = (b && b.start) || cell.begin;
    var end = (b && b.end) || cell.end;
    var bm = searchTimeToMin_(begin), em = searchTimeToMin_(end);
    if (bm < 0 || em <= bm) return;
    // The school day spans EVERY slot, teaching or not — that's what makes "before"/"after"
    // distinguishable from "between classes".
    if (dayStart < 0 || bm < dayStart) dayStart = bm;
    if (em > dayEnd) dayEnd = em;
    if (teaching) return;                       // periods are named by the class, not here
    if (now < bm || now >= em) return;          // end is exclusive, as everywhere else here
    if (!hit || bm > searchTimeToMin_(hit.begin)) {
      hit = { state: 'block', label: blockDisplayName_(label), begin: begin, end: end };
    }
  };

  Object.keys(bySlot).forEach(function (label) {
    consider(label, bySlot[label][day], /^P\s*\d/i.test(label));
  });
  // Patterned (teaching) slots only widen the day's span; a student's own class already names
  // itself when it's in session.
  Object.keys(byPattern).forEach(function (p) {
    var cell = byPattern[p][day];
    if (cell) consider(cell.slotLabel, cell, true);
  });

  if (hit) return hit;
  if (dayStart < 0) return null;
  if (now < dayStart) return { state: 'before', label: '', begin: '', end: '' };
  if (now >= dayEnd) return { state: 'after', label: '', begin: '', end: '' };
  return { state: 'between', label: '', begin: '', end: '' };
}

/**
 * Annotate a student's classes with today's slot/time and flag the one happening NOW.
 *
 * @param {Array} classes personDetail().classes
 * @param {Object} periodTimes buildPeriodTimes() output
 * @param {Object} ctx { dayCol:1..5 ('' = weekend), nowMin:number, bells:Object }
 *   ctx.closed is accepted but INFORMATIONAL ONLY — it drives the banner, not the highlight.
 *   Josh 2026-08-06: every day needs the bold, so a day the bell calendar calls "closed"
 *   (a real holiday, or simply a date nobody has entered yet) still highlights from the
 *   FACTS normal-day times rather than going blank.
 * @return {Array} same rows + {slotLabel, begin, end, beginLabel, endLabel, timeSource,
 *                 meetsToday, current}; today's classes first in clock order.
 */
/**
 * The `Period Times` cell for a class on one weekday column, or null.
 * Same pattern/homeroom lookup the main annotate path uses, factored out so a day OTHER than
 * the one being viewed can be resolved — which is what gives the weekend view a sensible
 * order and period labels instead of blanks.
 */
function schedSlotCell_(c, periodTimes, day) {
  var byDay = c.pattern ? ((periodTimes || {}).byPattern || {})[String(c.pattern)] : null;
  var cell = (byDay && day) ? byDay[String(day)] : null;
  if (!cell && day && isHomeroomClass_(c)) {
    var hr = ((periodTimes || {}).bySlot || {})['Homeroom'];
    cell = (hr && hr[String(day)]) || null;
  }
  return cell || null;
}

var SCHED_MONDAY_COL = '1'; // Mon-Thu all run the same period ORDER; Monday represents them

function annotateSchedule(classes, periodTimes, ctx) {
  ctx = ctx || {};
  periodTimes = periodTimes || { byPattern: {} };
  var day = String(ctx.dayCol || '');
  var bells = ctx.bells || {};

  var out = (classes || []).map(function (c) {
    var o = {
      code: c.code, key: c.key, classId: c.classId, description: c.description,
      category: c.category, teacher: c.teacher, quarters: c.quarters,
      period: c.period, room: c.room, pattern: c.pattern,
      slotLabel: '', begin: '', end: '', beginLabel: '', endLabel: '',
      timeSource: '', meetsToday: false, current: false, offQuarter: false, sharedSlot: false
    };
    // semester-split classes: if we know today's quarter and this class doesn't meet in it,
    // keep the row (informative) but never let it meet or highlight
    if (ctx.quarter) {
      var qs = parseQuartersField_(c.quarters);
      var listed = false;
      for (var k in qs) { if (qs.hasOwnProperty(k)) { listed = true; break; } }
      if (listed && !qs[ctx.quarter]) o.offQuarter = true;
    }
    var byDay = c.pattern ? periodTimes.byPattern[String(c.pattern)] : null;
    var cell = byDay && day ? byDay[day] : null;
    if (!cell && day && isHomeroomClass_(c)) {
      var hr = (periodTimes.bySlot || {})['Homeroom'];
      cell = (hr && hr[day]) || null;
    }
    if (cell) {
      o.meetsToday = !o.offQuarter;
      o.slotLabel = cell.slotLabel;
      o.begin = cell.begin;
      o.end = cell.end;
      o.timeSource = cell.begin ? 'facts' : '';
      if (!o.period && cell.period) o.period = cell.period; // e.g. label homeroom "Homeroom"
      var b = bellTimeForSlot_(bells, cell.slotLabel);
      if (b && b.start) {
        o.begin = b.start;
        o.end = b.end || o.end;
        o.timeSource = 'bell';
      }
    }
    o.beginLabel = searchTimeLabel_(o.begin);
    o.endLabel = searchTimeLabel_(o.end);

    /* Row ORDER. The clock time for the day being viewed IS the order — which is what makes
       HCS's reverse Friday come out right (Period 8 at 8:36am first, Period 1 at 2:37pm last)
       with no special case for it anywhere. Sorting on period NUMBER instead would put Friday
       exactly backwards.

       When this day yields no time — a weekend, a student with no patterns, a part-week class
       that doesn't meet today — fall back to the MON-THU order read off the Monday column of
       the same grid, so the list still reads top-to-bottom like a school day instead of
       alphabetically. Last resort is the period number parsed from the label, offset so those
       rows land after every row that has a real time rather than interleaving with them. */
    var todayMin = o.meetsToday ? searchTimeToMin_(o.begin) : -1;
    var monday = schedSlotCell_(c, periodTimes, SCHED_MONDAY_COL);
    var mondayMin = monday ? searchTimeToMin_(monday.begin) : -1;
    var pnum = parseInt((String(o.period).match(/(\d+)/) || [])[1], 10);
    o.orderMin = todayMin >= 0 ? todayMin
      : mondayMin >= 0 ? mondayMin
        : !isNaN(pnum) ? (10000 + pnum)
          : 20000;
    // Homeroom carries no Period in FACTS, so its label came from today's slot row — leaving
    // it BLANK whenever today has no row (a weekend, an unpatterned day). The Mon-Thu row
    // names the same slot, so use it rather than render an unlabelled row.
    if (!o.period && monday && monday.period) o.period = monday.period;
    return o;
  });

  if (ctx.nowMin !== null && ctx.nowMin !== undefined && ctx.nowMin >= 0) {
    out.forEach(function (o) {
      var s = searchTimeToMin_(o.begin), e = searchTimeToMin_(o.end);
      o.current = !!o.meetsToday && s >= 0 && e > s && ctx.nowMin >= s && ctx.nowMin < e;
    });
  }

  // Two classes can look "current" at once when they're semester-split into the same period
  // (Government Q1,2 vs Economics Q3,4). Without configured quarter dates we cannot know which
  // one is really meeting, so flag it rather than pick one silently — the Q labels are on screen.
  var live = out.filter(function (o) { return o.current; });
  if (live.length > 1) live.forEach(function (o) { o.sharedSlot = true; });

  // Classes meeting today lead; both groups are then in school-day order (see o.orderMin).
  // Description only breaks a genuine tie — two classes sharing one slot.
  out.sort(function (a, b) {
    if (a.meetsToday !== b.meetsToday) return a.meetsToday ? -1 : 1;
    var d = a.orderMin - b.orderMin;
    if (d) return d;
    return a.description < b.description ? -1 : a.description > b.description ? 1 : 0;
  });
  return out;
}

/* ---------- quarters ----------
   A class's `Quarters` column is positional term flags ("Q1,2" = terms 1+2). Two
   semester-split classes can share a period — Zion has Government (Q1,2) and Economics
   (Q3,4) both in Period 2 — so without knowing which quarter a date falls in, BOTH would
   highlight. FACTS exposes no reachable GET for term date ranges (/SchoolTerms/v2's GET is
   shadowed by its by-id route; /SchoolTerms is POST-only), so the ranges are configured
   once a year in a Script Property. Unset = no filtering, i.e. the old behaviour. */

/** "Q1,2" / "Q1,2,3,4" -> {1:true,2:true}. Blank = meets every quarter. */
function parseQuartersField_(s) {
  var out = {};
  String(s || '').replace(/[^0-9,]/g, '').split(',').forEach(function (n) {
    if (n) out[Number(n)] = true;
  });
  return out;
}

/**
 * Parse the configured ranges: "1:2026-08-20..2026-10-24,2:2026-10-27..2027-01-16,..."
 * @return {Array<{q:number, start:string, end:string}>}
 */
function parseQuarterRanges(str) {
  var out = [];
  String(str || '').split(',').forEach(function (part) {
    var m = /^\s*([1-6])\s*:\s*(\d{4}-\d{2}-\d{2})\s*\.\.\s*(\d{4}-\d{2}-\d{2})\s*$/.exec(part);
    if (m) out.push({ q: Number(m[1]), start: m[2], end: m[3] });
  });
  return out;
}

/** Which quarter an ISO date falls in; 0 = unknown (outside every range, or none set). */
function quarterForDate(ranges, isoDate) {
  var d = String(isoDate || '');
  if (!/^\d{4}-\d{2}-\d{2}$/.test(d)) return 0;
  for (var i = 0; i < (ranges || []).length; i++) {
    if (d >= ranges[i].start && d <= ranges[i].end) return ranges[i].q;
  }
  return 0;
}

/**
 * Parse a `?sim=` time-travel value into a schedule context seed, so the current-class
 * highlight can be stress-tested on any date (a Friday, a Thursday, a past delay day)
 * without waiting for that day to arrive. Accepts "YYYY-MM-DD" (defaults to 08:45) or
 * "YYYY-MM-DD HH:MM" / "YYYY-MM-DDTHH:MM".
 * @return {?{date:string, dayCol:(number|string), nowMin:number, label:string}}
 */
function parseSimClock(s) {
  var m = /^(\d{4})-(\d{2})-(\d{2})(?:[ T](\d{1,2}):(\d{2}))?$/.exec(String(s || '').trim());
  if (!m) return null;
  var y = +m[1], mo = +m[2], d = +m[3];
  var hh = m[4] === undefined ? 8 : +m[4];
  var mi = m[5] === undefined ? 45 : +m[5];
  if (mo < 1 || mo > 12 || d < 1 || d > 31 || hh > 23 || mi > 59) return null;
  // UTC construction so the weekday can't shift with the viewer's timezone
  var dow = new Date(Date.UTC(y, mo - 1, d)).getUTCDay(); // 0=Sun..6=Sat
  var iso = m[1] + '-' + m[2] + '-' + m[3];
  return {
    date: iso,
    dayCol: (dow >= 1 && dow <= 5) ? dow : '', // '' = weekend, nothing meets
    nowMin: hh * 60 + mi,
    label: iso + ' ' + ('0' + hh).slice(-2) + ':' + ('0' + mi).slice(-2)
  };
}

/* ====================================================================
   ATHLETICS — game-day dismissal from the team Google Calendars.

   Coaches type the dismissal into the calendar event's DESCRIPTION by hand,
   and nothing in any project parsed it before this. A corpus of all 688
   non-empty descriptions across the 21 team calendars (pulled 2026-09-06)
   showed 37 distinct phrasings of the same two facts:

     Dismiss 1:15 / Depart 1:30            dismissal time 2:15
     dismissal 2:00 / departure 2:15       Dismissal: 3pm
     Depart school at 2:20 pm              Dismiss Class at 2:50 pm
     Dismiss - 2:20                        Depart HCS at 5:30pm
     dismissal time 1:30<br>departure...   Dismiss1:50 pm   (no space)
     2:00 dismissal                        3:20 Awards and Departure  (reversed)

   So the parser is deliberately loose about what sits BETWEEN the keyword and
   the clock, and strict about the clock itself. Anything it cannot read is
   left blank — a missing dismissal reads as "not posted", never as a guess.
   ==================================================================== */

/**
 * Flatten one ICS/Calendar description to plain lines. Descriptions arrive
 * either ICS-escaped (`\n`, `\,`) or as pasted Gmail HTML (`<br>`, `<table>`),
 * sometimes both in the same calendar.
 */
function athleticsNormalizeDesc_(s) {
  return String(s || '')
    .replace(/\\n/g, '\n')                       // ICS escaped newline
    .replace(/<br\s*\/?>/gi, '\n')
    .replace(/<\/(p|div|tr|li|h[1-6])>/gi, '\n')
    .replace(/<[^>]+>/g, ' ')                    // strip the rest of the markup
    .replace(/&nbsp;/gi, ' ')
    .replace(/&amp;/gi, '&')
    .replace(/&#39;|&apos;/gi, "'")
    .replace(/&quot;/gi, '"')
    .replace(/\\([,;\\])/g, '$1')                // ICS escaped , ; \
    .replace(/[ \t]+/g, ' ');
}

/**
 * "2:15" + optional am/pm -> "14:15" (the 24h shape searchTimeLabel_ renders).
 * Coaches almost never type am/pm, so a bare hour needs a school-day rule:
 * 1-7 are afternoon (every bare dismissal in the corpus fell 1:15-6:10),
 * 8-12 stay morning (Saturday tournaments: "Depart school 9:00 am").
 * An explicit am/pm always wins over the heuristic.
 */
function athleticsTimeTo24_(clock, ampm) {
  var m = /^(\d{1,2})(?::(\d{2}))?$/.exec(String(clock || '').trim());
  if (!m) return '';
  var h = +m[1], mi = m[2] === undefined ? 0 : +m[2];
  if (h > 23 || mi > 59) return '';
  var ap = String(ampm || '').replace(/\./g, '').toLowerCase();
  if (ap === 'pm') { if (h < 12) h += 12; }
  else if (ap === 'am') { if (h === 12) h = 0; }
  else if (h >= 1 && h <= 7) { h += 12; }
  return ('0' + h).slice(-2) + ':' + ('0' + mi).slice(-2);
}

var ATH_KEYWORD = '(dismiss(?:al|ed|es)?|depart(?:ure|ed|s|ing)?)';
var ATH_CLOCK = '(\\d{1,2}(?::\\d{2})?)\\s*(a\\.?m\\.?|p\\.?m\\.?)?';

/**
 * Pull the dismissal and departure times out of a calendar event description.
 * @return {{dismiss:string, depart:string}} 24h "HH:MM" each, '' when not posted.
 */
function parseAthleticsTimes(desc) {
  var text = athleticsNormalizeDesc_(desc);
  var out = { dismiss: '', depart: '' };
  var kind = function (word) { return /^dismiss/i.test(word) ? 'dismiss' : 'depart'; };

  // Forward: "Dismiss 1:15", "departure time 3:50", "Depart school at 2:20 pm".
  // The gap is capped at 18 non-digit chars so the scan cannot leap a sentence
  // and bind the keyword to an unrelated number further down the line.
  var fwd = new RegExp('\\b' + ATH_KEYWORD + '[^0-9\\n]{0,18}?' + ATH_CLOCK, 'gi');
  var m;
  while ((m = fwd.exec(text)) !== null) {
    var k = kind(m[1]);
    if (!out[k]) out[k] = athleticsTimeTo24_(m[2], m[3]);
  }

  // Reversed: "2:00 dismissal", "3:20 Awards and Departure". Rare (6 of 688),
  // and only consulted for a kind the forward pass did not already fill.
  if (!out.dismiss || !out.depart) {
    var rev = new RegExp(ATH_CLOCK + '[^0-9\\n]{0,18}?\\b' + ATH_KEYWORD + '\\b', 'gi');
    while ((m = rev.exec(text)) !== null) {
      var rk = kind(m[3]);
      if (!out[rk]) out[rk] = athleticsTimeTo24_(m[1], m[2]);
    }
  }

  // You are dismissed from class BEFORE the bus leaves, always. An inversion
  // means the two lines describe different days — real case, a multi-day
  // tournament carrying "Friday ... Dismiss at 3:45 pm / Saturday ... Depart
  // school at 8:30 am" in one event. Keep the dismissal (the thing staff act
  // on) and drop the departure rather than pair two unrelated days.
  if (out.dismiss && out.depart &&
      searchTimeToMin_(out.depart) < searchTimeToMin_(out.dismiss)) {
    out.depart = '';
  }
  return out;
}

/**
 * Pull the VEVENTs falling on `dateStr` out of one .ics body.
 *
 * Deliberately a narrow reader, not a full ICS implementation: it takes DTSTART/SUMMARY/
 * LOCATION/DESCRIPTION off each VEVENT and nothing else. Lives here rather than beside the
 * fetch so it can be tested in Node against real calendar bodies.
 *
 * RECURRENCE IS NOT EXPANDED — an RRULE event is only reported on its own DTSTART date. Games
 * are one-offs, so this costs nothing real; a recurring practice simply won't appear, which is
 * the safe direction to be wrong in (we under-report rather than invent a game).
 */
function athleticsParseIcs(body, teamId, dateStr) {
  var out = [];
  if (!body) return out;
  // RFC 5545 folds long lines with CRLF + a space/tab; unfold before anything else or a
  // DESCRIPTION will be cut mid-word and the dismissal lost.
  var text = String(body).replace(/\r\n[ \t]/g, '').replace(/\n[ \t]/g, '');
  var compact = String(dateStr || '').replace(/-/g, ''); // ICS dates are YYYYMMDD
  if (compact.length !== 8) return out;

  var blocks = text.split('BEGIN:VEVENT');
  for (var i = 1; i < blocks.length; i++) {
    var block = blocks[i].split('END:VEVENT')[0];
    var field = function (name) {
      var m = new RegExp('^' + name + '(;[^:\\n]*)?:(.*)$', 'm').exec(block);
      return m ? m[2].trim() : '';
    };
    var dtstart = field('DTSTART');
    if (dtstart.slice(0, 8) !== compact) continue;

    // "20260911T143000" (floating/local) or "...Z" (UTC), or "20260911" for an all-day entry.
    var tm = /^\d{8}T(\d{2})(\d{2})/.exec(dtstart);
    var start = tm ? (tm[1] + ':' + tm[2]) : '';
    // A UTC stamp has to be shifted into school time or a 4:00pm game reads as 8:00pm.
    // These calendars publish floating local times, so this only fires if that ever changes.
    if (start && /Z$/.test(dtstart)) start = athleticsShiftFromUtc_(compact, start);

    var times = parseAthleticsTimes(field('DESCRIPTION'));
    out.push({
      teamId: teamId,
      date: dateStr,
      title: athleticsNormalizeDesc_(field('SUMMARY')).trim(),
      start: start,
      allDay: !tm,
      location: athleticsNormalizeDesc_(field('LOCATION')).trim(),
      dismiss: times.dismiss,
      depart: times.depart
    });
  }
  return out;
}

/**
 * UTC "HH:MM" -> school-time "HH:MM". Eastern is UTC-4 in DST, UTC-5 otherwise; the sports
 * seasons sit either side of both switchovers. Approximated by the US rule (DST = Mar 8 -> Nov 1
 * inclusive-ish) because being an hour out on a game START is cosmetic — the DISMISSAL, which
 * is what staff act on, is hand-typed local text and never passes through here.
 */
function athleticsShiftFromUtc_(compactDate, hhmm) {
  var mo = +compactDate.slice(4, 6), day = +compactDate.slice(6, 8);
  var dst = (mo > 3 && mo < 11) || (mo === 3 && day >= 8) || (mo === 11 && day <= 1);
  var mins = searchTimeToMin_(hhmm) - (dst ? 240 : 300);
  if (mins < 0) mins += 1440; // wrapped to the previous local day
  return ('0' + Math.floor(mins / 60)).slice(-2) + ':' + ('0' + (mins % 60)).slice(-2);
}

/**
 * Which team calendars a FACTS activity enrolment corresponds to.
 *
 * FACTS names teams on the COURSE ("MS Cross Country", "Junior Varsity &
 * Varsity Basketball") and codes them structurally ("MSCCTRY", "BJVVBB").
 * Neither reliably states gender — "Junior Varsity & Varsity Basketball" says
 * nothing, and one course legitimately spans TWO calendars (JV *and* Varsity).
 * So: resolve sport + level(s) from the class, and take gender from the
 * STUDENT's own directory record, which FACTS always has. A class that
 * resolves no sport matches nothing rather than guessing.
 *
 * @param activity {{code:string, description:string}} one Activity=Y class
 * @param gender   the student's Gender cell ('M'/'F'/'Male'/...); '' = unknown
 * @param teams    the ATHLETICS_TEAMS table (id, sport, gender, level)
 * @return {Array} matching team records
 */
function athleticsMatchTeams(activity, gender, teams) {
  var hay = ((activity && activity.description) || '') + ' ' + ((activity && activity.code) || '');
  var l = hay.toLowerCase();

  var sport =
    /cross.?country|cctry|\bxc\b/.test(l) ? 'Cross-Country' :
    /volleyball|\bvb\b/.test(l) ? 'Volleyball' :
    /basketball|\bbb\b/.test(l) ? 'Basketball' :
    /softball|\bsb\b/.test(l) ? 'Softball' :
    /baseball/.test(l) ? 'Baseball' :
    /flag.?football/.test(l) ? 'Flag Football' :
    /soccer|\bsc\b/.test(l) ? 'Soccer' :
    /golf/.test(l) ? 'Golf' : '';

  /* Fall back to the CODE's structure when the words found nothing. Necessary because every
     Activity=Y class in the live export has a BLANK Class Description, so the only thing left
     is a code like "GMSVB" — and no word-boundary test can see "vb" inside it.

     Read positionally, never by substring: strip the optional gender letter and level prefix,
     then require the REMAINDER TO START with a sport token. That is what keeps "SPVB" (a bus
     route) from matching volleyball on the "vb" buried in it. */
  /* Match the WHOLE code as one shape rather than stripping a prefix and inspecting what's left.
     Anchoring both ends is what refuses the bus routes ("SP-AM", "CCAM", "IXL") and anything
     else that merely CONTAINS a sport token.

     The gender letter appears on EITHER side of the level, because HCS uses both orders:
       level-then-gender  JVBSoc, MSGSoc, VBSoc, VGSC   (what the registrar entered 2026-09-14)
       gender-then-level  BVSOC, GMSVB, BJVVBB          (the older team-code convention)
     Stripping one level token also breaks a double-level code: "BJVVBB" (Boys JV+Varsity
     BasketBall) leaves "vbb", which starts with "vb" — a basketball player matched to
     volleyball. Letting the regex backtrack across the whole string avoids both traps. */
